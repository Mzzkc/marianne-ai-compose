name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# NOTE on submodules: `compiler` and `scores/rosetta-corpus` are NOT checked
# out — no core test depends on them (the compile-command tests `importorskip`
# the optional `marianne_compiler` package). `plugins` IS checked out in the
# test jobs: the score-language gate (tests/test_score_language.py, GH #436)
# reads the skill layer, and the repo is public so no token is needed. Without
# it the gate would skip itself and CI could never fail on a language gap
# (Lens Inspect F6, 2026-10-14).

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --extra dev --extra daemon --extra tui --locked
      - name: Ruff
        run: uv run ruff check src/ tests/

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --extra dev --extra daemon --extra tui --locked
      - name: Mypy
        run: uv run mypy src/

  test:
    name: Tests + coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Check out the public plugins submodule (score-language gate)
        run: git submodule update --init --depth 1 plugins
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --extra dev --extra daemon --extra tui --locked --python ${{ matrix.python-version }}
      - name: Pytest with coverage
        # COLUMNS=200: keep Rich-rendered CLI --help wide enough that the options
        # table doesn't collapse on a non-TTY runner. (The CLI help tests strip
        # ANSI via click.unstyle, so forced-color environments are handled too.)
        # Random order is ON (pytest-randomly): the order-dependent leaks #367
        # tracked are fixed (two seeded whole-suite runs green on 2026-10-21,
        # seeds 724247959 and 20261021). The seed prints in the run header;
        # reproduce a red run locally with `-p randomly --randomly-seed=<seed>`.
        env:
          COLUMNS: "200"
        run: >-
          uv run pytest
          --cov=marianne
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-fail-under=80
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Export locked requirements
        run: >-
          uv export --frozen --extra dev --extra daemon --extra tui
          --no-emit-project --format requirements-txt > requirements-audit.txt
      - name: pip-audit
        run: uvx pip-audit --strict --requirement requirements-audit.txt
