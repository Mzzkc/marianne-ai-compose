name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# NOTE: submodules are intentionally NOT checked out. The bundled submodules
# (compiler, plugins, rosetta-corpus) live in separate repos that the default
# Actions token cannot clone. No core test depends on them; the compile-command
# tests `importorskip` the optional `marianne_compiler` package and skip cleanly
# when it is absent, so the suite is fully hermetic on a bare checkout.

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --extra dev --extra daemon --extra tui --locked
      - name: Ruff
        run: uv run ruff check src/ tests/

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --extra dev --extra daemon --extra tui --locked
      - name: Mypy
        run: uv run mypy src/

  test:
    name: Tests + coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --extra dev --extra daemon --extra tui --locked --python ${{ matrix.python-version }}
      - name: Pytest with coverage
        # COLUMNS=200: keep Rich-rendered CLI --help wide enough that the options
        # table doesn't collapse on a non-TTY runner.
        # env -u FORCE_COLOR: the runner exports FORCE_COLOR, which makes Rich
        # inject ANSI into captured --help output and split option strings (e.g.
        # "--wait"), breaking plain-substring assertions. Unset it so CliRunner
        # output is plain, as in a normal non-terminal capture.
        # -p no:randomly: deterministic order in CI (pytest-randomly stays active
        # for local dev; known order-dependent failures tracked in #367 / M9).
        env:
          COLUMNS: "200"
        run: >-
          env -u FORCE_COLOR uv run pytest
          -p no:randomly
          --cov=marianne
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-fail-under=80
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Export locked requirements
        run: >-
          uv export --frozen --extra dev --extra daemon --extra tui
          --no-emit-project --format requirements-txt > requirements-audit.txt
      - name: pip-audit
        run: uvx pip-audit --strict --requirement requirements-audit.txt
