name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# NOTE on submodules: `compiler` and `scores/rosetta-corpus` are NOT checked
# out — no core test depends on them (the compile-command tests `importorskip`
# the optional `marianne_compiler` package). `plugins` IS checked out in the
# test jobs: the score-language gate (tests/test_score_language.py, GH #436)
# reads the skill layer, and the repo is public so no token is needed. Without
# it the gate would skip itself and CI could never fail on a language gap
# (Lens Inspect F6, 2026-10-14).

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --extra dev --extra daemon --extra tui --locked
      - name: Ruff
        run: uv run ruff check src/ tests/

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --extra dev --extra daemon --extra tui --locked
      - name: Mypy
        run: uv run mypy src/

  test:
    name: Tests + coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Check out the public plugins submodule (score-language gate)
        run: git submodule update --init --depth 1 plugins
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --extra dev --extra daemon --extra tui --locked --python ${{ matrix.python-version }}
      - name: Pytest with coverage
        # COLUMNS=200: keep Rich-rendered CLI --help wide enough that the options
        # table doesn't collapse on a non-TTY runner. (The CLI help tests strip
        # ANSI via click.unstyle, so forced-color environments are handled too.)
        # Random order is ON (pytest-randomly): the order-dependent leaks #367
        # tracked are fixed (two seeded whole-suite runs green on 2026-10-21,
        # seeds 724247959 and 20261021). The seed prints in the run header;
        # reproduce a red run locally with `-p randomly --randomly-seed=<seed>`.
        env:
          COLUMNS: "200"
        run: >-
          uv run pytest
          --cov=marianne
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-fail-under=80
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  load-sensitive:
    name: Load-sensitive tests (stress-ng)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the public plugins submodule (score-language gate)
        run: git submodule update --init --depth 1 plugins
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies (locked)
        run: uv sync --extra dev --extra daemon --extra tui --locked
      - name: Install stress-ng
        run: sudo apt-get update && sudo apt-get install -y stress-ng
      - name: Idle control run (behavior unchanged, no load)
        # The three load-sensitive tests from #501 must pass with the default
        # factor 1 on an idle runner — the marks must not change idle behavior.
        run: >-
          uv run pytest
          "tests/test_drain_swap_352.py::TestDrainDeadlockBattery::test_large_stdout_burst"
          "tests/test_drain_swap_352.py::TestDrainDeadlockBattery::test_one_pipe_closed_early"
          "tests/test_clone_socket_ownership_repairs.py::test_cancelled_start_reaps_upstream_and_releases_socket"
          "tests/test_daemon_e2e.py::TestDaemonLifecycle::test_graceful_shutdown"
          -n0 -q
      - name: Under-load run (stress-ng --io 4 --cpu 4, factor 4)
        # Reproduce the host-load conditions that tripped the 30s safety net
        # (#501): real IO+CPU contention while the per-test timeout marks are
        # load-scaled. CI runners can't observe their own load the way the
        # solver conductor does (getloadavg-based factor), so export the
        # scaling explicitly the way verify.sh would at load ~4x cores.
        env:
          MARIANNE_TEST_LOAD_FACTOR: "4"
        run: |
          stress-ng --io 4 --cpu 4 --timeout 300s >/dev/null 2>&1 &
          STRESS_PID=$!
          sleep 2  # let the load ramp up before pytest collects
          # bash -e would abort the step on a failing pytest before the
          # cleanup below runs, so capture the exit code explicitly.
          set +e
          uv run pytest \
            "tests/test_drain_swap_352.py::TestDrainDeadlockBattery::test_large_stdout_burst" \
            "tests/test_drain_swap_352.py::TestDrainDeadlockBattery::test_one_pipe_closed_early" \
            "tests/test_clone_socket_ownership_repairs.py::test_cancelled_start_reaps_upstream_and_releases_socket" \
            "tests/test_daemon_e2e.py::TestDaemonLifecycle::test_graceful_shutdown" \
            -n0 -q
          RC=$?
          set -e
          kill "$STRESS_PID" 2>/dev/null || true
          exit $RC

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Export locked requirements
        run: >-
          uv export --frozen --extra dev --extra daemon --extra tui
          --no-emit-project --format requirements-txt > requirements-audit.txt
      - name: pip-audit
        run: uvx pip-audit --strict --requirement requirements-audit.txt
