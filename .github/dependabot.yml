# Dependabot keeps dependencies patched automatically. It is the primary
# CVE-detection mechanism (replacing the manual security-minimum pins in
# pyproject.toml) and opens PRs that update both pyproject.toml and uv.lock.
# pip-audit in CI (.github/workflows/ci.yml) is the secondary, fail-the-build gate.
version: 2
updates:
  # Python dependencies (resolved via uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Batch routine minor/patch bumps into one PR to reduce noise;
      # security updates and majors still come through individually.
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the CI / docs workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      actions-all:
        patterns:
          - "*"
