# Codex CLI — OpenAI's coding agent
#
# Uses 'codex exec' subcommand for non-interactive execution.
# JSONL output format with event-based completion detection.
# Prompt is a positional argument (no flag).
#
# Auth: Requires OPENAI_API_KEY or CODEX_API_KEY.

name: codex-cli
display_name: "Codex CLI"
description: "OpenAI's Codex CLI agent"
kind: cli

capabilities:
  - tool_use
  - file_editing
  - shell_access
  - mcp
  - structured_output
  - session_resume
  - streaming

default_timeout_seconds: 1800

models:
  - name: o3
    context_window: 200000
    cost_per_1k_input: 0.01
    cost_per_1k_output: 0.04
    max_output_tokens: 100000
  - name: o4-mini
    context_window: 200000
    cost_per_1k_input: 0.0011
    cost_per_1k_output: 0.0044
    max_output_tokens: 100000

cli:
  command:
    executable: codex
    subcommand: "exec"
    prompt_flag: null  # positional argument
    # Credential filtering: only pass OpenAI auth env vars to Codex subprocess.
    required_env:
      - OPENAI_API_KEY
      - CODEX_API_KEY
    model_flag: "--model"
    auto_approve_flag: "--full-auto"
    output_format_flag: "--json"
    output_format_value: null  # boolean flag, no value
    extra_flags:
      - "--skip-git-repo-check"
  # Interactive mode — drive the codex TUI in a tmux session.
  # Patterns spike-verified 2026-06-11 against codex v0.139.0.
  # The headless auto-approve flag (--full-auto) is exec-only and REJECTED
  # by the TUI — the interactive equivalent goes via extra_args.
  interactive:
    inherit_auto_approve: false
    extra_args:
      - "--dangerously-bypass-approvals-and-sandbox"
    startup_gates:
      - pattern: "Do you trust the contents of this directory"
        keys: ["Enter"]
    # Input prompt line: "› " (placeholder suggestion may follow it).
    ready_pattern: '(?m)^›'
    busy_patterns:
      - 'esc to interrupt'
      - 'Working \(\d+s'
    quiet_seconds: 15.0
    poll_interval_seconds: 2.0
    startup_timeout_seconds: 90.0
  output:
    format: jsonl
    completion_event_type: "item.completed"
    completion_event_filter:
      type: "agent_message"
    input_tokens_path: "usage.input_tokens"
    output_tokens_path: "usage.output_tokens"
  errors:
    rate_limit_patterns:
      - "rate.?limit"
      - "(?:error|status|code)[^\\w]*429"
      # Codex CLI subscription-mode quota messages (ChatGPT Plus/Pro/Team plans
      # share quota with the Codex CLI). Patterns are intentionally tight to
      # avoid false positives on code-context stderr; case-insensitive via
      # cli_backend._check_rate_limit -> re.search(..., re.IGNORECASE).
      #
      # Example codex stderr on quota exhaustion:
      #   ■ You've hit your usage limit. Upgrade to Pro (...), visit ... to
      #   purchase more credits or try again at 6:15 AM.
      #
      # The three patterns below each independently identify that message;
      # any one matching is sufficient.
      - "hit your\\s+(?:usage|monthly|weekly|daily)\\s*limit"
      - "purchase\\s+more\\s+credits"
      - "try\\s+again\\s+at\\s+\\d{1,2}:\\d{2}"
    auth_error_patterns:
      - "authenticat"
      - "invalid.*api.*key"
