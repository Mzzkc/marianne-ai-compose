# Goose — Block's autonomous agent
#
# Open source. Supports extensions (MCP-like), session management,
# and multiple LLM providers. Uses 'goose run' for non-interactive
# execution with JSON output.
#
# Auth: Provider-specific API keys.

name: goose
display_name: "Goose"
description: "Block's Goose agent with extension support"
kind: cli

capabilities:
  - tool_use
  - file_editing
  - shell_access
  - mcp
  - structured_output
  - session_resume
  - streaming

default_timeout_seconds: 1800

cli:
  command:
    executable: goose
    subcommand: "run"
    # goose requires an explicit input-source flag: one of -i, -t, or --recipe.
    # We deliver the prompt via stdin (consistent with the >32KB auto-stdin
    # path from GH#188), so the flag pair must be `-i -`. Using `-t -` is
    # not accepted by goose — only `-i` routes stdin into the instructions
    # channel.
    prompt_flag: "-i"
    prompt_via_stdin: true
    stdin_sentinel: "-"
    model_flag: "--model"
    output_format_flag: "--output-format"
    output_format_value: "json"
    extra_flags:
      - "--no-session"
      - "--quiet"
  # Interactive mode — drive a goose session in a tmux session.
  # Patterns spike-verified 2026-06-11 against goose (GLM-5.1 provider).
  # Interactive launch is 'goose session' (the headless 'run' subcommand
  # and its --no-session/--quiet extra_flags are never used here).
  interactive:
    # Verified, but opt-in: interactive-by-default is claude-code only
    # (composer decision 2026-06-11). Scores enable per-sheet/score via
    # instrument_config: {interactive: true}.
    enabled_by_default: false
    subcommand: "session"
    # Input hint line — rendered only while the input box is empty, so it
    # doubles as the bare-input (submit-verified) signal.
    ready_pattern: 'Enter to send'
    busy_patterns:
      - 'Ctrl\+C to interrupt'
    quiet_seconds: 15.0
    poll_interval_seconds: 2.0
    startup_timeout_seconds: 90.0
  output:
    format: json
    result_path: "response"
  errors:
    rate_limit_patterns:
      - "rate.?limit"
      - "(?:error|status|code)[^\\w]*429"
    auth_error_patterns:
      - "authenticat"
      - "unauthorized"
