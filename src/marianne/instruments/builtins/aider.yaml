# Aider — AI pair programming CLI
#
# Open source (Apache 2.0). BYOK via litellm. Focused on code editing
# rather than general agent tasks. Text output only (no JSON mode).
#
# Auth: Provider-specific API keys (OPENAI_API_KEY, ANTHROPIC_API_KEY, etc.)

# No effort: block (GH #535): aider 0.86.2 has --reasoning-effort, but it passes
# the value to whatever model/provider is configured and the accepted values
# depend on that model; unverified, so a sheet that sets effort is refused.

name: aider
display_name: "Aider"
description: "AI pair programming CLI (code editing focus)"
kind: cli

capabilities:
  - file_editing
  - shell_access

default_timeout_seconds: 1800

cli:
  command:
    # Grant provider/build credentials explicitly in your local profile.
    required_env: []
    executable: aider
    prompt_flag: "--message"
    model_flag: "--model"
    auto_approve_flag: "--yes"
    extra_flags:
      - "--no-stream"
  output:
    format: text  # aider has no JSON output mode
  errors:
    rate_limit_patterns:
      - "rate.?limit"
      - "(?:error|status|code)[^\\w]*429"
      - "too many requests"
    auth_error_patterns:
      - "authenticat"
      - "api.*key"
      - "unauthorized"
