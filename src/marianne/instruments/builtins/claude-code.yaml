# Claude Code — Anthropic's official CLI agent
#
# The reference instrument for Marianne. Full tool use, file editing,
# shell access, vision, and MCP support. Uses the -p flag for
# non-interactive prompt execution with JSON output.
#
# Auth: Requires valid Claude Code login (claude login).
#
# Verified: 2026-03-31 against Claude Code (production use across 3 orchestra runs)
#   - JSON output: {"result": "...", "usage": {...}} on stdout when -o json
#   - Text output: raw response on stdout when -o text (used by v3 score)
#   - Error format: non-JSON on stdout for rate limits ("API Error: Rate limit
#     reached", "You've hit your limit · resets <time>")
#   - Exit code: 0 on success, 1 on error (but rate limits sometimes exit 0)
#   - Rate limit messages appear on STDOUT not stderr — classifier must check both
#   - Single model per execution (no multi-model routing)
#   - Token paths are direct (no wildcard needed)

name: claude-code
display_name: "Claude Code"
description: "Anthropic's Claude Code CLI — full-featured coding agent"
kind: cli

capabilities:
  - tool_use
  - file_editing
  - shell_access
  - vision
  - mcp
  - structured_output
  - streaming
  - thinking

default_model: null  # Uses Claude Code's default model
default_timeout_seconds: 1800

# max_concurrent is set per MODEL TIER, not per version number.
# Within a family (e.g., Sonnet 4 vs Sonnet 4.5), the limit should be
# the same unless there's a specific technical reason to differ (e.g.,
# a version has a much larger context window that changes cost profile).
# Tier rationale: Haiku (cheap, fast) → 8, Sonnet (mid) → 6, Opus (expensive) → 4.
models:
  # ── Gateway-routed models (Anthropic-compatible Claude Code gateway) ──
  - name: "glm-5.3[1m]"
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 131072
    max_concurrent: 4
  - name: glm-5-Turbo
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6
  - name: glm-4.7
    context_window: 200000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 8

  # ── Sonnet tier (mid-range: fast, capable, cost-effective) ──
  - name: claude-sonnet-4-20250514
    context_window: 200000
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    max_output_tokens: 64000
    max_concurrent: 6
  - name: claude-sonnet-4-5-20250929
    context_window: 200000
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    max_output_tokens: 64000
    max_concurrent: 6
  - name: claude-sonnet-4-6
    context_window: 200000
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    max_output_tokens: 64000
    max_concurrent: 6
  - name: "claude-sonnet-4-6[1m]"
    context_window: 1000000
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
    max_output_tokens: 64000
    max_concurrent: 6

  # ── Opus tier (premium: deep reasoning, largest context) ──
  - name: claude-opus-4-20250514
    context_window: 200000
    cost_per_1k_input: 0.015
    cost_per_1k_output: 0.075
    max_output_tokens: 32000
    max_concurrent: 4
  - name: claude-opus-4-6
    context_window: 200000
    cost_per_1k_input: 0.015
    cost_per_1k_output: 0.075
    max_output_tokens: 32000
    max_concurrent: 4
  - name: "claude-opus-4-6[1m]"
    context_window: 1000000
    cost_per_1k_input: 0.015
    cost_per_1k_output: 0.075
    max_output_tokens: 32000
    max_concurrent: 4

  # ── Haiku tier (lightweight: fast, cheap, high concurrency) ──
  - name: claude-haiku-4-5-20251001
    context_window: 200000
    cost_per_1k_input: 0.0008
    cost_per_1k_output: 0.004
    max_output_tokens: 64000
    max_concurrent: 8

cli:
  command:
    executable: claude
    prompt_flag: "-p"
    # Deliver prompt via stdin (-p - sentinel) to avoid ARG_MAX limits
    # on large prompts. This preserves the proven stdin-delivery behavior
    # and is required for production-length agent prompts (F-105).
    prompt_via_stdin: true
    stdin_sentinel: "-"
    # Start subprocess in its own process group so MCP/LSP child processes
    # can be cleanly killed as a group on timeout (F-105, Claude Code #1935).
    start_new_session: true
    # Credential filtering: only pass Anthropic auth env vars to Claude subprocess.
    # Prevents OPENAI_API_KEY, GOOGLE_API_KEY, etc. from leaking to Anthropic's CLI.
    required_env:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_BASE_URL
      - ANTHROPIC_AUTH_TOKEN
      - ANTHROPIC_DEFAULT_OPUS_MODEL
      - ANTHROPIC_DEFAULT_SONNET_MODEL
      - ANTHROPIC_DEFAULT_HAIKU_MODEL
      - ANTHROPIC_SMALL_FAST_MODEL
      - CLAUDE_CODE_USE_BEDROCK
      - CLAUDE_CODE_USE_VERTEX
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - AWS_REGION
      - AWS_DEFAULT_REGION
      - GOOGLE_APPLICATION_CREDENTIALS
      - GOOGLE_CLOUD_PROJECT
      - CLOUD_ML_REGION
    model_flag: "--model"
    auto_approve_flag: "--dangerously-skip-permissions"
    output_format_flag: "--output-format"
    output_format_value: "json"
    system_prompt_flag: "--system-prompt"
    allowed_tools_flag: "--allowedTools"
    mcp_config_flag: "--mcp-config"
    mcp_config_prefix_args:
      - "--strict-mcp-config"
    # Disable MCP servers by default to prevent child process explosion (F-271).
    # --strict-mcp-config means "only use servers from --mcp-config";
    # passing empty config disables all MCP servers.
    mcp_disable_args:
      - "--strict-mcp-config"
      - "--mcp-config"
      - '{"mcpServers":{}}'
    # GLM 5.3's post-training gains are realized at high/max reasoning.
    extra_flags:
      - "--effort"
      - "max"
  # Interactive mode — drive the full Claude Code TUI in a tmux session
  # instead of headless -p. Patterns spike-verified 2026-06-10 against
  # Claude Code v2.1.172 (see docs/specs/2026-06-10-interactive-mode-design.md).
  interactive:
    # Trust-folder dialog appears on first launch in a new directory.
    # Option 1 ("Yes, I trust this folder") is pre-selected; Enter accepts.
    startup_gates:
      - pattern: "Is this a project you created or one you trust"
        keys: ["Enter"]
      # First-ever --dangerously-skip-permissions use shows an acceptance
      # dialog; "Yes, I accept" is reached with Down+Enter on v2.x.
      - pattern: "Bypass Permissions mode"
        keys: ["Down", "Enter"]
    # The BARE input prompt line: "❯ " with nothing typed after it.
    # Must stay anchored — the trust dialog renders a selection cursor
    # ("❯ 1. Yes, I trust this folder") that an unanchored pattern
    # matches, and a prompt pasted into that dialog is silently lost.
    ready_pattern: '(?m)^\s*❯\s*$'
    # Busy: tool-run hint, or a spinner line with elapsed time like
    # "· Percolating… (2s)" / "✻ Baked for 24s".
    busy_patterns:
      - "esc to interrupt"
      - '[·✻✽✶]\s+\w+…?\s*\(\d+'
      - '…\s*\(\d+m?\s?\d*s'
    # Verified provider/account quota screens. These are checked by the
    # interactive driver before idle nudges so a prompt-returning 429 does
    # not get treated as an agent that merely stopped working.
    rate_limit_screen_patterns:
      - 'API Error: Request rejected\s+\(429\)'
      - "You've hit your limit"
      - "API Error: Rate limit"
      - "Usage limit reached"
      - 'Your limit will reset at\s+\d{4}-\d{2}-\d{2}'
    quiet_seconds: 15.0
    poll_interval_seconds: 2.0
    startup_timeout_seconds: 90.0
    terminal_width: 200
    terminal_height: 50
    # Bottom 2 lines hold the status bar (token counter, mode hints) which
    # updates independently of work — excluded from the change hash.
    volatile_tail_lines: 2
  output:
    format: json
    result_path: "result"
    error_path: "error.message"
    input_tokens_path: "usage.input_tokens"
    output_tokens_path: "usage.output_tokens"
    aggregate_tokens: false  # Single model, no aggregation needed
  errors:
    # Exit codes
    success_exit_codes: [0]
    # Rate limit patterns — anchored to error contexts to avoid false
    # positives from incidental mentions in result output (F-497).
    # On successful exits, only stderr is scanned (guard in backend code).
    rate_limit_patterns:
      - "rate.?limit"
      - "(?:error|status|code)[^\\w]*429"
      - "(?:error|status|code)[^\\w]*529"
      - "You've hit your limit"
      - "API Error: Rate limit"
      - "resets.*\\(\\w+/\\w+\\)"
      - "(?:server|api|service).*overloaded"
    # Auth/permission errors
    auth_error_patterns:
      - "not authenticated"
      - "login required"
      - "unauthorized"
      - "invalid.*api.*key"
    # Capacity/overload errors (retriable)
    capacity_patterns:
      - "overloaded"
      - "503"
      - "capacity"
    # Timeout patterns
    timeout_patterns:
      - "timed?.?out"
      - "timeout"
