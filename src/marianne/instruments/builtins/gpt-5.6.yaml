# GPT-5.6 — OpenAI's GPT-5.6 model family (Sol / Terra / Luna)
#
# A three-tier family released July 2026:
#   Sol   — the flagship. Best coding/reasoning model in the family. Peak
#           performance, peak cost. Use for the hardest agentic work.
#   Terra — the balanced tier. Surpasses GPT-5.5's performance at lower cost.
#           The everyday workhorse for agentic coding.
#   Luna  — the fast/affordable tier. Nearly matches GPT-5.5's peak at less
#           than half the cost. High-throughput classification, routing, and
#           bulk code reads.
#
# All three ship on codex-cli (ChatGPT Plus/Pro/Team subscription or API key).
# Shared family facts (verified 2026-07-15):
#   - Provider: openai, wire API: responses
#   - Reasoning levels: low / medium / high / xhigh / max / ultra
#   - supports_parallel_tool_calls: true
#   - supports_reasoning_summaries: true
#   - web_search: text_and_image
#   - vision: yes (image_detail_original supported)
#   - apply_patch: freeform
#
# Auth: codex login (ChatGPT) or OPENAI_API_KEY / CODEX_API_KEY.
#
# Sources verified:
#   - codex doctor (2026-07-15): default model gpt-5.6-terra, provider openai,
#     wire API responses, supports websockets. Models cache lists
#     gpt-5.6-terra and gpt-5.6-luna; gpt-5.6-sol confirmed via OpenAI docs.
#   - OpenAI GPT-5.6 launch page + system card: three-tier family, ~1.05M
#     long-context available, 128K max output (Terra confirmed).
#   - Pricing (per 1M tokens): Sol $5/$30, Terra $2.50/$15, Luna $1/$6.
#   - Context window (codex models_cache.json): Terra 272000 base; family
#     supports ~1.05M long-context (the [1m] variant, same pattern as
#     claude-sonnet-4-6[1m]).

name: gpt-5.6
display_name: "GPT-5.6 (Sol/Terra/Luna)"
description: "OpenAI's GPT-5.6 family — Sol (flagship), Terra (balanced), Luna (fast/affordable). Run via codex-cli."
kind: cli

capabilities:
  - tool_use
  - file_editing
  - shell_access
  - vision
  - mcp
  - structured_output
  - streaming
  - thinking          # reasoning levels: low/medium/high/xhigh/max/ultra
  - session_resume

default_model: gpt-5.6-terra
default_timeout_seconds: 1800

# max_concurrent is per MODEL TIER. The 5.6 family tiers map to cost tiers:
#   Luna  (cheap, fast)    → 8  (high throughput, classification/routing)
#   Terra (balanced)       → 6  (everyday agentic work)
#   Sol   (expensive, deep)→ 4  (hardest problems, reserve capacity)
models:
  # ── Sol tier (flagship: peak reasoning, peak cost) ──
  - name: gpt-5.6-sol
    context_window: 272000
    cost_per_1k_input: 0.005
    cost_per_1k_output: 0.030
    max_output_tokens: 128000
    max_concurrent: 4
  - name: "gpt-5.6-sol[1m]"
    context_window: 1050000
    cost_per_1k_input: 0.005
    cost_per_1k_output: 0.030
    max_output_tokens: 128000
    max_concurrent: 4

  # ── Terra tier (balanced: everyday agentic workhorse) ──
  - name: gpt-5.6-terra
    context_window: 272000
    cost_per_1k_input: 0.0025
    cost_per_1k_output: 0.015
    max_output_tokens: 128000
    max_concurrent: 6
  - name: "gpt-5.6-terra[1m]"
    context_window: 1050000
    cost_per_1k_input: 0.0025
    cost_per_1k_output: 0.015
    max_output_tokens: 128000
    max_concurrent: 6

  # ── Luna tier (fast/affordable: high throughput, bulk work) ──
  - name: gpt-5.6-luna
    context_window: 272000
    cost_per_1k_input: 0.001
    cost_per_1k_output: 0.006
    max_output_tokens: 128000
    max_concurrent: 8
  - name: "gpt-5.6-luna[1m]"
    context_window: 1050000
    cost_per_1k_input: 0.001
    cost_per_1k_output: 0.006
    max_output_tokens: 128000
    max_concurrent: 8

cli:
  command:
    executable: codex
    subcommand: "exec"
    prompt_flag: null  # positional argument
    # Credential filtering: only pass OpenAI auth env vars to the Codex subprocess.
    required_env:
      - OPENAI_API_KEY
      - CODEX_API_KEY
    model_flag: "--model"
    auto_approve_flag: "--full-auto"
    output_format_flag: "--json"
    output_format_value: null  # boolean flag, no value
    extra_flags:
      - "--skip-git-repo-check"
  # Interactive mode — inherits codex-cli's interactive config. Patterns
  # spike-verified against codex 0.144.4 (same TUI shell as codex-cli).
  # Opt-in only (interactive-by-default is claude-code's role).
  interactive:
    enabled_by_default: false
    inherit_auto_approve: false
    extra_args:
      - "--dangerously-bypass-approvals-and-sandbox"
    startup_gates:
      - pattern: "Do you trust the contents of this directory"
        keys: ["Enter"]
    ready_pattern: '(?m)^›'
    busy_patterns:
      - 'esc to interrupt'
      - 'Working \(\d+s'
    quiet_seconds: 15.0
    poll_interval_seconds: 2.0
    startup_timeout_seconds: 90.0
  output:
    format: jsonl
    completion_event_type: "item.completed"
    completion_event_filter:
      type: "agent_message"
    input_tokens_path: "usage.input_tokens"
    output_tokens_path: "usage.output_tokens"
  errors:
    success_exit_codes: [0]
    # Rate limit patterns — shared with codex-cli (subscription quota is
    # family-wide across the ChatGPT Plus/Pro/Team plans). Tight anchoring
    # to avoid false positives on code-context stderr.
    rate_limit_patterns:
      - "rate.?limit"
      - "(?:error|status|code)[^\\w]*429"
      - "hit your\\s+(?:usage|monthly|weekly|daily)\\s*limit"
      - "purchase\\s+more\\s+credits"
      - "try\\s+again\\s+at\\s+\\d{1,2}:\\d{2}"
    auth_error_patterns:
      - "authenticat"
      - "invalid.*api.*key"
    capacity_patterns:
      - "overloaded"
      - "503"
      - "capacity"
    timeout_patterns:
      - "timed?.?out"
      - "timeout"
