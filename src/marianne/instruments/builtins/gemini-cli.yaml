# Gemini CLI — Google's Gemini coding agent
#
# Open source (Apache 2.0). Tool use, file editing, shell access,
# vision, and structured output. Uses --yolo for auto-approval.
#
# Auth: Gemini CLI's documented API-key variable is GEMINI_API_KEY. This
# profile also preserves GOOGLE_API_KEY plus Google ADC/gcloud surfaces for
# existing direct Google API and cloud-auth configurations.
#
# SECURITY NOTE: Vendor sandboxing is disabled by default (--sandbox false).
# Marianne manages workspace isolation at the orchestration layer. Scores
# requiring locked-down environments should override extra_flags per-sheet
# to re-enable sandboxing (--sandbox true). See design rationale in
# docs/specs/2026-04-16-process-lifecycle-design.md.
#
# Client mechanics verified: 2026-03-31 against gemini-cli 0.35.1
#   - JSON output: clean on stdout, preamble (YOLO warnings, keychain) on stderr
#   - Error format: {"error": {"type": "...", "message": "...", "code": N}} on stdout
#   - Stack traces on stderr (verbose Node.js, not structured — ignore)
#   - Exit code: 0 on success, 1 on error
#   - Multi-model routing: flash-lite for routing, flash/pro for execution
#     Token counts span multiple models under stats.models.*
#     Token paths use aggregate: true to sum across all models
#   - Rate limit patterns: untested (need live rate limit hit to verify)
#
# Current client/model census: 2026-08-17
#   - Local Gemini CLI version: 0.50.0
#   - Stable/GA API model: gemini-3.7-flash (released 2026-08-13)
#   - Input: text, image, video, audio, PDF; output: text
#   - Thinking levels: low, medium, high (`minimal` returns an error)
#   - Model features include function calling, structured output, caching,
#     code execution, search grounding, URL context, file search, and preview
#     computer use where the client exposes them.
#   - Official model facts verified 2026-08-17:
#     https://ai.google.dev/gemini-api/docs/models/gemini-3.7-flash
#     https://ai.google.dev/gemini-api/docs/latest-model
#     https://ai.google.dev/gemini-api/docs/changelog
#   - Local prompt execution was not re-verified: the shipped profile retains
#     its honest unsupported individual-OAuth status below.
#
# MCP note: Gemini CLI 0.46.0 supports project-scoped MCP servers in
# workspace `.gemini/settings.json` under top-level `mcpServers`. Marianne
# merges generated shared-pool config into that key for one sheet execution,
# then restores the previous settings file. A 2026-06-21 live dispatch smoke
# was blocked before MCP startup by Google's UNSUPPORTED_CLIENT /
# IneligibleTierError for the current individual tier; prefer Antigravity for
# current Google CLI live runs unless Gemini API/gcloud auth is configured.

name: gemini-cli
display_name: "Gemini CLI"
description: "Google's Gemini CLI with tool use and vision"
kind: cli
execution_status: unsupported
execution_status_detail: "Default individual-tier OAuth prompt execution returns UNSUPPORTED_CLIENT / IneligibleTierError; configure API/gcloud auth and override this profile locally before using it in fleets."

capabilities:
  - tool_use
  - file_editing
  - shell_access
  - vision
  - mcp
  - structured_output
  - thinking

default_model: gemini-3.7-flash
default_timeout_seconds: 1800

models:
  # ── Current stable generation ──
  - name: gemini-3.7-flash
    context_window: 1048576
    cost_per_1k_input: 0.00075
    cost_per_1k_output: 0.00375
    max_output_tokens: 65536
    max_concurrent: 8

  # ── Previous generations retained as explicit fallbacks/history ──
  - name: gemini-3.5-flash
    context_window: 1000000
    cost_per_1k_input: 0.00015
    cost_per_1k_output: 0.0006
    max_output_tokens: 65536
    max_concurrent: 8
  - name: gemini-3.5-flash-lite
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 8
  - name: gemini-3.1-pro-preview
    context_window: 1000000
    cost_per_1k_input: 0.00125
    cost_per_1k_output: 0.005
    max_output_tokens: 65536
    max_concurrent: 4
  - name: gemini-3-flash-preview
    context_window: 1000000
    cost_per_1k_input: 0.00015
    cost_per_1k_output: 0.0006
    max_output_tokens: 65536
    max_concurrent: 8
  - name: gemini-3.1-flash-lite-preview
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 8
  - name: gemini-2.5-pro
    context_window: 1000000
    cost_per_1k_input: 0.00125
    cost_per_1k_output: 0.005
    max_output_tokens: 65536
    max_concurrent: 4
  - name: gemini-2.5-flash
    context_window: 1000000
    cost_per_1k_input: 0.00015
    cost_per_1k_output: 0.0006
    max_output_tokens: 65536
    max_concurrent: 8
  - name: gemini-2.5-flash-lite
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 8

cli:
  command:
    executable: gemini
    prompt_flag: "-p"
    # Credential filtering: only pass Gemini/Google auth env vars to the subprocess.
    # Prevents ANTHROPIC_API_KEY, OPENAI_API_KEY, etc. from leaking to Google's CLI.
    required_env:
      - GEMINI_API_KEY
      - GOOGLE_API_KEY
      - GOOGLE_APPLICATION_CREDENTIALS
      - GOOGLE_CLOUD_PROJECT
      - CLOUDSDK_CONFIG
    model_flag: "-m"
    auto_approve_flag: "--yolo"
    output_format_flag: "-o"
    output_format_value: "json"
    mcp_config_workspace_path: ".gemini/settings.json"
    mcp_config_workspace_merge_key: "mcpServers"
    # Vendor sandboxing disabled: Marianne manages workspace isolation and
    # instrument security (credential filtering, workspace boundaries) at the
    # orchestration layer. Gemini's built-in sandbox restricts file access to
    # cwd, which breaks when musicians need to access the project root from a
    # workspace subdirectory. Scores requiring locked-down environments should
    # override extra_flags per-sheet to re-enable sandboxing.
    extra_flags:
      - "--skip-trust"
      - "--sandbox"
      - "false"
  # Interactive mode — drive the gemini TUI in a tmux session.
  # Patterns spike-verified 2026-06-11 against gemini-cli (Node 20 install).
  # NOTE: Google has announced gemini-cli deprecation for Google One /
  # unpaid tiers (June 18) in favor of Antigravity CLI — patterns may need
  # re-verification after migration.
  interactive:
    # Verified, but opt-in: interactive-by-default is claude-code only
    # (composer decision 2026-06-11). Scores enable per-sheet/score via
    # instrument_config: {interactive: true}.
    enabled_by_default: false
    startup_gates:
      # Trust dialog on first launch in a new directory; option 1
      # ("Trust folder") is pre-selected. The CLI restarts itself after
      # accepting and comes back ready without re-showing the gate.
      - pattern: "Do you trust the files in this folder"
        keys: ["Enter"]
    # Input-box placeholder — rendered only while the box is empty, so it
    # doubles as the bare-input (submit-verified) signal.
    ready_pattern: 'Type your message or @path/to/file'
    busy_patterns:
      - 'esc to cancel'
    quiet_seconds: 15.0
    poll_interval_seconds: 2.0
    startup_timeout_seconds: 90.0
  output:
    format: json
    result_path: "response"
    error_path: "error.message"
    # Gemini uses multi-model routing (flash-lite router + main model).
    # Token counts must be summed across all models, not first-match.
    input_tokens_path: "stats.models.*.tokens.prompt"
    output_tokens_path: "stats.models.*.tokens.candidates"
    aggregate_tokens: true  # Sum across wildcard matches, not first-match
  errors:
    # Exit codes
    success_exit_codes: [0]
    # Rate limit patterns (GH#189: stderr only — agent stdout is not scanned)
    rate_limit_patterns:
      - "rate.?limit"
      - "quota.?exceeded"
      - "(?:error|status|code)[^\\w]*429"
      - "RESOURCE_EXHAUSTED"
      - "Too Many Requests"
    # Auth/permission errors
    auth_error_patterns:
      - "authenticat"
      - "unauthorized"
      - "API key"
      - "PERMISSION_DENIED"
      - "PermissionDeniedError"
    # Capacity/overload errors (retriable)
    capacity_patterns:
      - "503"
      - "overloaded"
      - "UNAVAILABLE"
      - "ServerError"
    # Timeout patterns
    timeout_patterns:
      - "deadline.?exceeded"
      - "DEADLINE_EXCEEDED"
      - "timed?.?out"
