# Claude Code harness over PolyStrata's Anthropic-compatible API.
# PolyStrata (https://github.com/VecSzn/PolyStrata, MIT) is a local server that
# runs large sparse/MoE models (Qwen3.8-Flash-Next, GLM 5.3 Flash, Qwen3.6-35B-A3B,
# Gemma 4 26B-A4B, Tiel Coder, ...) on one consumer GPU by keeping the hot experts
# in VRAM and the rest in RAM. It serves OpenAI chat, Anthropic /v1/messages and
# Responses APIs on http://127.0.0.1:8080 (`--port N` to change).
#
# Requires: claude on PATH, a running PolyStrata with a model installed
# (`./setup.sh --family qwen --no-start`, then its run-<model>.sh), and
# "fit_max_tokens": true in that model's strata-<model>.json. Claude Code asks for
# 32,000 output tokens on every request and PolyStrata refuses a request whose
# prompt plus max_tokens runs past the context unless it may shorten the answer.
# Marianne installs nothing, starts nothing and downloads nothing.
#
# Model names are labels. PolyStrata answers every request with the model it has
# loaded, whatever the request names (unless the server was started with
# "switch_on_request": true, in which case an exact installed name, such as
# `qwen3.6-35b-a3b-ud-q3_k_m` (it carries the quantisation), loads that model;
# list the real ids with `curl http://127.0.0.1:8080/v1/models` and name them in
# an overlay). PolyStrata's docs say Claude Code refuses names it does not know;
# Claude Code 2.1.326 sends any --model value unchanged and prints only an
# `unrecognized_model` notice (observed against the mock seam).
# One model is in memory at a time, so a score should use one PolyStrata model
# at a time; switch with POST /api/models/load between scores.
#
# Endpoint and key: the origin is pinned below to PolyStrata's default host and
# port (127.0.0.1:8080). For another port or a server with an API key, put an
# overlay in ~/.marianne/instruments/ (profile `extends`, GH #543):
#   extends: claude-code-polystrata
#   cli:
#     command:
#       required_env: [POLYSTRATA_API_KEY]
#       env:
#         ANTHROPIC_BASE_URL: http://127.0.0.1:8081
#         ANTHROPIC_AUTH_TOKEN: ${POLYSTRATA_API_KEY}
# (expandvars has no shell-default syntax and leaves an unset ${VAR} literal, so
# the builtin cannot read the host, port or key from the environment itself.)
# Never expose PolyStrata beyond this machine without an API key.
# Only the profile's own env grants reach the child: ANTHROPIC_API_KEY is cleared
# so no inherited paid-provider credential is sent to the local server.
#
# Readiness: availability checks the `claude` binary only (the CLI-kind probe
# never calls the server), so `mzt instruments check claude-code-polystrata` is
# green with PolyStrata stopped; /health is not probed (a profile cannot express
# an HTTP probe for a CLI-kind instrument). Probe by hand:
#   curl -s http://127.0.0.1:8080/health     # "loaded": true when it can answer
# A stopped server fails at the first sheet instead: Claude Code prints
# `API Error: Connection refused`, which the backend types api_error (E301, a
# configuration failure, not a retry and not a fallback advance).
# CLAUDE_CODE_MAX_RETRIES caps Claude Code's own reconnect backoff at 3 (on a
# closed port the default ran past 100 s before reporting).
#
# Effort (GH #535): Claude Code always sends `output_config.effort` on
# /v1/messages (`high` when no flag is given, the same default PolyStrata
# documents) and `--effort low|medium|high` changes it. Observed on the wire
# against a mock Anthropic-compatible server with `claude` 2.1.326. PolyStrata
# documents low|medium|high for that field, so only those three levels are mapped;
# xhigh and max are not documented there and are refused, not guessed.
#
# Verified: 2026-11-17 against Claude Code 2.1.326 and a local mock
# Anthropic-compatible seam (no GPU and no PolyStrata on the authoring host):
# POST /v1/messages with the explicit model name, Bearer local auth, streamed
# reply -> JSON result/usage, exit 0; --effort and --tools reach the request.
# Real-model tool calls, JSON schema, thinking blocks and server error shapes
# remain unverified.
#
# Context: PolyStrata's context is chosen at its setup (8K to 262K; 32K under
# 14 GB of VRAM, 64K under 20 GB, else 128K). 32768 is declared because it is
# the smallest default; raise it in an overlay (a models: list replaces this
# one) to what you set up. Claude Code's own prefix is 15-30K tokens before the
# prompt (Marianne measured 28.8K with 29 tools and 14.0K with four, see the
# score-authoring skill), so 64K or more is the practical floor; at 32K narrow
# the toolset with instrument_config.tools.

name: claude-code-polystrata
display_name: Claude Code (PolyStrata)
description: Claude Code agent harness routed to a running local PolyStrata server (sparse MoE models on one GPU)
kind: cli
execution_status: warning
execution_status_detail: "Verified only against a mock Anthropic-compatible seam (no GPU and no PolyStrata on the authoring host): routing, auth header, effort and tools flags and streamed-JSON parsing are observed; real-model tool calls, JSON schema, thinking blocks and server error shapes are not. Start PolyStrata with fit_max_tokens set, run a one-sheet score on it, then set execution_status: ready in a user-layer copy. `mzt instruments check` only finds the claude binary, not the server."
capabilities:
- tool_use
- file_editing
- shell_access
- structured_output
default_model: qwen3.8-flash-next
default_timeout_seconds: 1800
models:
- name: qwen3.8-flash-next
  context_window: 32768
  cost_per_1k_input: 0.0
  cost_per_1k_output: 0.0
  max_output_tokens: 8192
  max_concurrent: 1
  effort_levels: &levels {minimal: low, low: low, medium: medium, high: high}
- name: glm-5.3-flash
  context_window: 32768
  cost_per_1k_input: 0.0
  cost_per_1k_output: 0.0
  max_output_tokens: 8192
  max_concurrent: 1
  effort_levels: *levels
- name: qwen3.6-35b-a3b
  context_window: 32768
  cost_per_1k_input: 0.0
  cost_per_1k_output: 0.0
  max_output_tokens: 8192
  max_concurrent: 1
  effort_levels: *levels
- name: gemma-4-26b-a4b
  context_window: 32768
  cost_per_1k_input: 0.0
  cost_per_1k_output: 0.0
  max_output_tokens: 8192
  max_concurrent: 1
  effort_levels: *levels
- name: tiel-coder-35b-a3b
  context_window: 32768
  cost_per_1k_input: 0.0
  cost_per_1k_output: 0.0
  max_output_tokens: 8192
  max_concurrent: 1
  effort_levels: *levels
effort:
  delivery: flag
  flag: "--effort"
  levels: {minimal: low, low: low, medium: medium, high: high}
# Per-sheet toolset (GH #534): the same `claude` binary, so the same `--tools`
# flag. Exercised against the mock seam: the request carries only the named tools.
tools:
  delivery: flag
  flag: "--tools"
  join: comma

cli:
  command:
    executable: claude
    prompt_flag: -p
    prompt_via_stdin: true
    stdin_sentinel: '-'
    start_new_session: true
    required_env: []
    model_flag: --model
    auto_approve_flag: --dangerously-skip-permissions
    output_format_flag: --output-format
    output_format_value: json
    json_schema_flag: --json-schema
    system_prompt_flag: --system-prompt
    mcp_config_flag: --mcp-config
    mcp_config_prefix_args:
    - --strict-mcp-config
    mcp_disable_args:
    - --strict-mcp-config
    - --mcp-config
    - '{"mcpServers":{}}'
    env:
      ANTHROPIC_BASE_URL: http://127.0.0.1:8080
      ANTHROPIC_AUTH_TOKEN: local
      ANTHROPIC_API_KEY: ''
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      CLAUDE_CODE_MAX_RETRIES: '3'
  output:
    format: json
    result_path: result
    error_path: error.message
    input_tokens_path: usage.input_tokens
    output_tokens_path: usage.output_tokens
    cache_read_tokens_path: usage.cache_read_input_tokens
    cache_write_tokens_path: usage.cache_creation_input_tokens
    aggregate_tokens: false
  errors:
    success_exit_codes:
    - 0
    rate_limit_patterns:
    - rate.?limit
    - (?:error|status|code)[^\w]*429
    - (?:error|status|code)[^\w]*529
    - You've hit your limit
    - 'API Error: Rate limit'
    - resets.*\(\w+/\w+\)
    - (?:server|api|service).*overloaded
    auth_error_patterns:
    - not authenticated
    - login required
    - unauthorized
    - invalid.*api.*key
    capacity_patterns:
    - overloaded
    - '503'
    - capacity
    timeout_patterns:
    - timed?.?out
    - timeout
