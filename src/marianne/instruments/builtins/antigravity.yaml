# Antigravity CLI - Google's successor terminal agent for Gemini CLI.
#
# Local help, model flag, and interactive tmux mode verified 2026-07-22
# against agy 1.1.5:
#   agy -p/--print <prompt>            one-shot print command, but non-TTY
#                                      daemon dispatch can fail with a
#                                      Bubble Tea TTY error while exiting 0
#   agy --model <model>                model override (selects a full slug
#                                      below; the -high/-medium/-low effort
#                                      tier is part of the slug, not --effort)
#   agy --effort <low|medium|high>     reasoning effort for the session
#   agy --dangerously-skip-permissions auto-approve tools
#   agy --sandbox <bool>               terminal sandbox toggle (agy <=1.1.x era;
#                                      on agy 1.1.26 --sandbox is a valueless
#                                      flag that ENABLES restrictions — the
#                                      two-token "--sandbox false" form is
#                                      rejected with an unexpected-argument
#                                      error that still exits 0)
#   agy --print-timeout <duration>     print-mode wait timeout
#   agy models                         lists configured models
#   workspace .agents/mcp_config.json  initializes configured MCP servers
#
# Model set refreshed 2026-11-17 against `agy models` on agy 1.5.10 (GH #552;
# earlier refresh 2026-09-04, agy 1.1.26). The AGY effort suffix (-low /
# -medium / -high, plus -xhigh on Hydrogen) is a selection tier over each
# family:
#   gemini-4-hydrogen (low / medium / high / xhigh)   <- current Gemini 4
#   gemini-4-argon    (low / medium / high)           <- current Gemini 4
#   gemini-3.8-flash  (high / medium / low)   <- default family (kept: still served)
# Removed 2026-11-17: gemini-3.7-flash, gemini-3.6-flash, gemini-3.5-flash and
# gemini-3.1-pro slugs, which `agy models` (1.5.10) no longer serves.
# agy also brokers cross-vendor models (claude-opus-5-5-*, claude-sonnet-5-5-*,
# gpt-oss-120b-medium on agy 1.5.10) through the same CLI; they are listed
# below as selectable models. claude-sonnet-4-6 and claude-opus-4-6-thinking
# are no longer in `agy models` (1.5.10) and were removed. `agy models` also
# lists gemini-pro-orchestrator-g1-pro ("Orchestrator (Argon)"), an agent
# orchestration wrapper, not a plain model slug; it is not listed here.
#
# This profile defaults to interactive tmux mode. Print mode re-verified
# 2026-09-04 on agy 1.1.26: `agy -p` from a non-TTY context returns output
# with exit 0 (earlier Bubble Tea TTY failures not reproduced). The crash
# classifiers for TTY errors are retained — treat their reappearance as a
# signal, not noise.
#
# Gemini 3.8 Flash (September 2026) accepts text, image, video, audio, and
# PDF input, emits text, and supports low/medium/high thinking; `minimal`
# returns an error. Official limits verified 2026-09-04:
# 1,048,576 input / 65,536 output.
#   https://ai.google.dev/gemini-api/docs/models/gemini-3.8-flash
#
# Cost model: per-token costs are zero because this profile models the installed
# subscription-backed CLI capacity, not direct API billing. Gemini 3.8 uses the
# official 1,048,576 context / 65,536 output limits; older retained families keep
# their prior conservative metadata as explicit fallbacks/history.
#
# MCP note: Antigravity has no CLI flag analogous to Claude Code's
# --mcp-config. A live smoke proved agy 1.1.5 reads workspace-local
# .agents/mcp_config.json and initializes a configured MCP server. Marianne
# materializes the conductor-generated shared-pool config at that path for the
# duration of a sheet, then restores/deletes it.
#
# Error classifiers are conservative until real Antigravity failure samples are
# captured. Do not broaden these from another instrument without samples.
#
# Official transition note: Google announced Antigravity CLI as the Gemini CLI
# successor on 2026-05-19, with consumer Gemini CLI serving ending 2026-06-18.

name: antigravity
display_name: "Antigravity CLI"
description: "Google Antigravity CLI via tmux-backed interactive mode"
kind: cli

capabilities:
  - tool_use
  - file_editing
  - shell_access
  - mcp
  - session_resume
  - thinking

default_model: gemini-3.8-flash-medium
default_timeout_seconds: 1800

# Marianne enforces max_concurrent per exact (instrument, model-slug) pair.
# AGY's effort suffix (-high / -medium / -low) is part of that selected slug,
# so each tier has its own baton limit; score- and daemon-level ceilings remain
# the outer aggregate guard. Flash tiers use 6 and Pro tiers use 4.
models:
  # ── Gemini 4 (agy 1.5.10; catalog gemini-4-hydrogen / gemini-4-argon) ──
  # Hydrogen: 1,048,576 context / 65,536 output, effort slugs low..xhigh.
  # Argon: 1,048,576 context / 32,768 output (catalog), effort slugs low..high.
  # Concurrency follows the existing split: Pro-class (Argon) 4, Flash-class
  # (Hydrogen, cheaper per the catalog) 6.
  - name: gemini-4-hydrogen-xhigh
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6
  - name: gemini-4-hydrogen-high
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6
  - name: gemini-4-hydrogen-medium
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6
  - name: gemini-4-hydrogen-low
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6
  - name: gemini-4-argon-high
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 32768
    max_concurrent: 4
  - name: gemini-4-argon-medium
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 32768
    max_concurrent: 4
  - name: gemini-4-argon-low
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 32768
    max_concurrent: 4

  # ── gemini-3.8-flash tier (profile default family; still served) ──
  - name: gemini-3.8-flash-high
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6
  - name: gemini-3.8-flash-medium
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6
  - name: gemini-3.8-flash-low
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6

  # ── agy-brokered cross-vendor models (agy 1.5.10 `agy models`) ──
  # Selectable through the same Google subscription seat; the effort tier is
  # part of the slug. Context/output follow the catalog (1M / 128K for the
  # Claude 5.5 pair). The agy 1.1.26-era claude-sonnet-4-6 and
  # claude-opus-4-6-thinking slugs are gone from `agy models` and removed.
  - name: claude-opus-5-5-high
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 128000
    max_concurrent: 4
  - name: claude-opus-5-5-medium
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 128000
    max_concurrent: 4
  - name: claude-opus-5-5-low
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 128000
    max_concurrent: 4
  - name: claude-sonnet-5-5-high
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 128000
    max_concurrent: 6
  - name: claude-sonnet-5-5-medium
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 128000
    max_concurrent: 6
  - name: claude-sonnet-5-5-low
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 128000
    max_concurrent: 6
  - name: gpt-oss-120b-medium
    context_window: 131072
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 32768
    max_concurrent: 6

# Per-sheet reasoning effort (GH #535). `agy --help` on agy 1.5.5 (checked
# 2026-11-11) lists `--effort` "Reasoning effort for the current CLI session
# (low|medium|high|xhigh|max)" as a top-level option, so it applies to print
# mode and to the interactive launch. agy has nothing below low: minimal runs
# at low. Unset adds no flag (the session default). The -high/-medium/-low
# suffix in a gemini model slug is a separate model choice made with `model:`;
# Marianne does not rewrite slugs from effort.
effort:
  delivery: flag
  flag: "--effort"
  levels:
    minimal: low
    low: low
    medium: medium
    high: high
    xhigh: xhigh
    max: max

cli:
  # GH #434: the stream's first event arrives within seconds of a healthy
  # start; 90 s of silence on both pipes is a dead session, struck early as
  # a stale timeout so the baton retries/falls back instead of burning the
  # sheet timeout. Does not bound silence after the first byte.
  first_output_timeout_seconds: 90
  command:
    executable: agy
    # Print-mode prompt delivery (verified 2026-10-14 against agy 1.1.26): the
    # prompt travels on stdin as ONE stream-json line. `agy -p` has no raw-text
    # stdin form (`-p -` is taken literally as the prompt "-"), and a 142 KB
    # prelude in argv dies at the kernel's per-argument limit (E2BIG,
    # "Argument list too long") before the process starts — observed live on
    # `mx-prism-verify-care-20261009` sheet 9, which then fell through to the
    # next instrument. `--input-format stream-json` requires
    # `--output-format stream-json`; the empty `-p ''` keeps print mode on
    # while the stream supplies the turn. Needle-at-the-end probes at 72 KB
    # and 161 KB answered correctly (no silent truncation).
    prompt_flag: "-p"
    prompt_via_stdin: true
    stdin_sentinel: ""
    stdin_json_template:
      event: user
      message:
        role: user
        content: "{prompt}"
    output_format_flag: "--output-format"
    output_format_value: "stream-json"
    model_flag: "--model"
    auto_approve_flag: "--dangerously-skip-permissions"
    mcp_config_workspace_path: ".agents/mcp_config.json"
    required_env:
      - GOOGLE_API_KEY
      - GOOGLE_APPLICATION_CREDENTIALS
      - GOOGLE_CLOUD_PROJECT
      - CLOUDSDK_CONFIG
    # --sandbox is now a valueless flag that ENABLES restrictions; the retired
    # two-token "--sandbox false" form is rejected by agy 1.1.26 with an
    # unexpected-argument error that still exits 0. Omitting it entirely means
    # no sandbox — the original intent of "--sandbox false".
    extra_flags:
      - "--input-format"
      - "stream-json"
      - "--print-timeout"
      - "30m"
  interactive:
    # Verified 2026-07-22 against Antigravity CLI 1.1.5 (flags --sandbox,
    # --print-timeout, --dangerously-skip-permissions all confirmed via
    # `agy --help`). Default-on because daemon print mode can emit a Bubble
    # Tea TTY error on stdout while exiting 0, which looks like success to
    # generic CLI dispatch.
    # Trust-dialog gate added 2026-07-15 against agy 1.1.2 and re-verified
    # against agy 1.1.5 — fresh directories show "Do you trust the contents
    # of this project?" with "Yes, I trust this folder" pre-selected; Enter
    # accepts.
    enabled_by_default: true
    inherit_auto_approve: true
    inherit_mcp_disable_args: false
    # --sandbox retired as two-token form (see extra_flags note above);
    # omitting it means no sandbox, which was always the intent.
    extra_args: []
    startup_gates:
      - pattern: "Do you trust the contents of this project"
        keys: ["Enter"]
    ready_pattern: '(?m)^>\s*$'
    busy_patterns:
      - 'esc to (?:cancel|interrupt)'
      - '[⣷⣯⣟⡿⢿⣻⣽⣾]'
    rate_limit_screen_patterns:
      - "\\bIndividual quota reached\\b"
    quiet_seconds: 15.0
    poll_interval_seconds: 2.0
    startup_timeout_seconds: 120.0
    terminal_width: 200
    terminal_height: 50
    volatile_tail_lines: 2
  output:
    # Print mode emits NDJSON: {"event":"init",...}, {"event":"step_update",...}
    # per delta, and one terminal {"event":"result","result":{"status":
    # "SUCCESS"|"ERROR","response":...,"error":...,"usage":{...}}}.
    format: jsonl
    event_type_key: event
    completion_event_type: result
    result_path: result.response
    error_path: result.error
    input_tokens_path: result.usage.input_tokens
    output_tokens_path: result.usage.output_tokens
  errors:
    success_exit_codes: [0]
    rate_limit_patterns:
      - "\\bIndividual quota reached\\b"
      - "\\bRESOURCE_EXHAUSTED\\b"
      - "\\bToo Many Requests\\b"
      - "\\bquota (?:exceeded|exhausted)\\b"
      - "(?:\\bstatus\\b|\\bcode\\b)[^\\w]*429\\b"
    auth_error_patterns:
      - "\\bnot authenticated\\b"
      - "\\bunauthorized\\b"
      - "\\bPERMISSION_DENIED\\b"
      - "\\bAPI key\\b"
      - "\\bsign in\\b"
    capacity_patterns:
      - "(?:\\bstatus\\b|\\bcode\\b)[^\\w]*503\\b"
      - "\\bUNAVAILABLE\\b"
      - "\\bserver overloaded\\b"
    timeout_patterns:
      - "\\bDEADLINE_EXCEEDED\\b"
      - "\\btimed out\\b"
      - "\\btimeout\\b"
    crash_patterns:
      - "\\bbubbletea:\\s*error opening TTY\\b"
      - "\\bcould not open TTY\\b"
      - "\\bunexpected argument\\b"
