# Antigravity CLI - Google's successor terminal agent for Gemini CLI.
#
# Local help, model flag, and interactive tmux mode verified 2026-07-22
# against agy 1.1.5:
#   agy -p/--print <prompt>            one-shot print command, but non-TTY
#                                      daemon dispatch can fail with a
#                                      Bubble Tea TTY error while exiting 0
#   agy --model <model>                model override (selects a full slug
#                                      below; the -high/-medium/-low effort
#                                      tier is part of the slug, not --effort)
#   agy --effort <low|medium|high>     reasoning effort for the session
#   agy --dangerously-skip-permissions auto-approve tools
#   agy --sandbox <bool>               terminal sandbox toggle
#   agy --print-timeout <duration>     print-mode wait timeout
#   agy models                         lists configured models
#   workspace .agents/mcp_config.json  initializes configured MCP servers
#
# Model set refreshed 2026-08-17 against `agy models` on agy 1.1.13. The eleven
# Gemini slugs span four model families; the AGY effort suffix (-high /
# -medium / -low) is a selection tier over each family:
#   gemini-3.7-flash  (high / medium / low)   <- current default family
#   gemini-3.6-flash  (high / medium / low)
#   gemini-3.5-flash  (high / medium / low)
#   gemini-3.1-pro    (high / low)
# Stale unsuffixed aliases (gemini-3.5-flash, gemini-3.5-flash-lite,
# gemini-3.5-pro) were removed — they no longer resolve in `agy models`.
#
# This profile defaults to interactive tmux mode. Print mode is kept for
# explicit callers, but daemon-run print mode is not treated as reliable until
# Antigravity stops requiring a controlling TTY for print-mode failures.
#
# Gemini 3.7 Flash is stable/GA (released 2026-08-13), accepts text, image,
# video, audio, and PDF input, emits text, and supports low/medium/high thinking;
# `minimal` returns an error. Relevant API capabilities include function calling,
# structured output, caching, code execution, search grounding, URL context,
# file search, and preview computer use. Official facts verified 2026-08-17:
#   https://ai.google.dev/gemini-api/docs/models/gemini-3.7-flash
#   https://ai.google.dev/gemini-api/docs/latest-model
#   https://ai.google.dev/gemini-api/docs/changelog
#
# Cost model: per-token costs are zero because this profile models the installed
# subscription-backed CLI capacity, not direct API billing. Gemini 3.7 uses the
# official 1,048,576 context / 65,536 output limits; older retained families keep
# their prior conservative metadata as explicit fallbacks/history.
#
# MCP note: Antigravity has no CLI flag analogous to Claude Code's
# --mcp-config. A live smoke proved agy 1.1.5 reads workspace-local
# .agents/mcp_config.json and initializes a configured MCP server. Marianne
# materializes the conductor-generated shared-pool config at that path for the
# duration of a sheet, then restores/deletes it.
#
# Error classifiers are conservative until real Antigravity failure samples are
# captured. Do not broaden these from another instrument without samples.
#
# Official transition note: Google announced Antigravity CLI as the Gemini CLI
# successor on 2026-05-19, with consumer Gemini CLI serving ending 2026-06-18.

name: antigravity
display_name: "Antigravity CLI"
description: "Google Antigravity CLI via tmux-backed interactive mode"
kind: cli

capabilities:
  - tool_use
  - file_editing
  - shell_access
  - mcp
  - session_resume
  - thinking

default_model: gemini-3.7-flash-medium
default_timeout_seconds: 1800

# Marianne enforces max_concurrent per exact (instrument, model-slug) pair.
# AGY's effort suffix (-high / -medium / -low) is part of that selected slug,
# so each tier has its own baton limit; score- and daemon-level ceilings remain
# the outer aggregate guard. Flash tiers use 6 and Pro tiers use 4.
models:
  # ── gemini-3.7-flash tier (current stable/default family) ──
  - name: gemini-3.7-flash-high
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6
  - name: gemini-3.7-flash-medium
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6
  - name: gemini-3.7-flash-low
    context_window: 1048576
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6

  # Older families remain available as explicit fallbacks/history.
  # ── gemini-3.6-flash tier (fast family) ──
  - name: gemini-3.6-flash-high
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6
  - name: gemini-3.6-flash-medium
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6
  - name: gemini-3.6-flash-low
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6

  # ── gemini-3.5-flash tier (previous/historical family) ──
  - name: gemini-3.5-flash-high
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6
  - name: gemini-3.5-flash-medium
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6
  - name: gemini-3.5-flash-low
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6

  # ── gemini-3.1-pro tier (deep reasoning family) ──
  - name: gemini-3.1-pro-high
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 4
  - name: gemini-3.1-pro-low
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 4

cli:
  command:
    executable: agy
    prompt_flag: "-p"
    prompt_via_stdin: false
    model_flag: "--model"
    auto_approve_flag: "--dangerously-skip-permissions"
    mcp_config_workspace_path: ".agents/mcp_config.json"
    required_env:
      - GOOGLE_API_KEY
      - GOOGLE_APPLICATION_CREDENTIALS
      - GOOGLE_CLOUD_PROJECT
      - CLOUDSDK_CONFIG
    extra_flags:
      - "--sandbox"
      - "false"
      - "--print-timeout"
      - "30m"
  interactive:
    # Verified 2026-07-22 against Antigravity CLI 1.1.5 (flags --sandbox,
    # --print-timeout, --dangerously-skip-permissions all confirmed via
    # `agy --help`). Default-on because daemon print mode can emit a Bubble
    # Tea TTY error on stdout while exiting 0, which looks like success to
    # generic CLI dispatch.
    # Trust-dialog gate added 2026-07-15 against agy 1.1.2 and re-verified
    # against agy 1.1.5 — fresh directories show "Do you trust the contents
    # of this project?" with "Yes, I trust this folder" pre-selected; Enter
    # accepts.
    enabled_by_default: true
    inherit_auto_approve: true
    inherit_mcp_disable_args: false
    extra_args:
      - "--sandbox"
      - "false"
    startup_gates:
      - pattern: "Do you trust the contents of this project"
        keys: ["Enter"]
    ready_pattern: '(?m)^>\s*$'
    busy_patterns:
      - 'esc to (?:cancel|interrupt)'
      - '[⣷⣯⣟⡿⢿⣻⣽⣾]'
    rate_limit_screen_patterns:
      - "\\bIndividual quota reached\\b"
    quiet_seconds: 15.0
    poll_interval_seconds: 2.0
    startup_timeout_seconds: 120.0
    terminal_width: 200
    terminal_height: 50
    volatile_tail_lines: 2
  output:
    format: text
  errors:
    success_exit_codes: [0]
    rate_limit_patterns:
      - "\\bIndividual quota reached\\b"
      - "\\bRESOURCE_EXHAUSTED\\b"
      - "\\bToo Many Requests\\b"
      - "\\bquota (?:exceeded|exhausted)\\b"
      - "(?:\\bstatus\\b|\\bcode\\b)[^\\w]*429\\b"
    auth_error_patterns:
      - "\\bnot authenticated\\b"
      - "\\bunauthorized\\b"
      - "\\bPERMISSION_DENIED\\b"
      - "\\bAPI key\\b"
      - "\\bsign in\\b"
    capacity_patterns:
      - "(?:\\bstatus\\b|\\bcode\\b)[^\\w]*503\\b"
      - "\\bUNAVAILABLE\\b"
      - "\\bserver overloaded\\b"
    timeout_patterns:
      - "\\bDEADLINE_EXCEEDED\\b"
      - "\\btimed out\\b"
      - "\\btimeout\\b"
    crash_patterns:
      - "\\bbubbletea:\\s*error opening TTY\\b"
      - "\\bcould not open TTY\\b"
