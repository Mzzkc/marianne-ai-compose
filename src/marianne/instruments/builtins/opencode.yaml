# OpenCode — Headless AI coding agent with OpenRouter support
#
# OpenCode (opencode.ai) is a CLI coding agent supporting 75+ LLM providers
# including OpenRouter natively. Uses -p flag for non-interactive prompt
# execution. Supports MCP servers via mcpServers config.
#
# Note: The OpenCode repo has been archived; development continues as "Crush"
# by Charm team. The deep fallback chain ensures continuity if OpenCode
# becomes unavailable.
#
# Auth: Configured via `opencode providers login`. Supports OpenRouter,
#       Z.AI, and other providers. Free-tier models available without credits.
#
# Default provider: OpenCode-hosted free tier (opencode/glm-5.3-flash-free)
# Headless mode: -p flag for non-interactive, -f json for structured output
#
# Z.AI Coding Plan route: this machine's paid coding-plan seat serves the
# zai-coding-plan/* models below (verified 2026-09-04 via `opencode models`
# on the live credential store). Per-token cost is zero — the plan is a
# flat subscription, not API billing. Scores that want the subscription
# route pin these explicitly; the default stays a free-tier model.
#
# Model ids are opencode's own `provider/model` ids, exactly as `opencode
# models` prints them. OpenRouter ids therefore carry the `openrouter/`
# prefix (openrouter/google/gemma-4-31b-it:free); the bare OpenRouter form
# (google/gemma-4-31b-it:free) names a provider opencode does not have and
# fails with a server error (probed 2026-11-17, opencode 1.19.4).
#
# Refreshed 2026-11-17 against `opencode models --verbose` (opencode 1.19.4,
# GH #552). Removed because the live list no longer serves them: the Z.AI
# glm-5.2, glm-5.2-highspeed, glm-5-turbo and glm-4.7 rows, and every
# OpenRouter :free row except the two Gemma 4 ones (qwen3-coder, gpt-oss-120b/
# 20b, hermes-3, nemotron-3-super/nano/nano-9b, qwen3-next/qwen3-4b,
# llama-3.3, minimax-m2.5, glm-4.5-air, trinity-large, gemma-3n, lfm-2.5).

name: opencode
display_name: "OpenCode"
description: "Headless AI coding agent with OpenRouter and MCP support"
kind: cli

capabilities:
  - tool_use
  - file_editing
  - shell_access
  - mcp
  - structured_output

# Free-tier model — $0 input/output. opencode/glm-5.3-flash-free is OpenCode's
# own hosted GLM-5.3-Flash route: listed by the live `opencode models`, tool
# calling and reasoning on, no OpenRouter key needed, and a headless
# `opencode run --model opencode/glm-5.3-flash-free` answered on this machine
# 2026-11-17. The previous default qwen/qwen3-coder:free is gone from
# OpenRouter. The free OpenRouter Gemma 4 rows rate-limited upstream during
# the same probe, so they are a worse default; Nemotron 3.5 Lightning scores
# 0.5% on Terminal-Bench 4.0 (catalog), too weak to drive a coding agent.
default_model: "opencode/glm-5.3-flash-free"
default_timeout_seconds: 1800

models:
  # ═══════════════════════════════════════════════════════════════════
  # Z.AI Coding Plan (paid subscription seat — glm-5.3 is current)
  # ═══════════════════════════════════════════════════════════════════
  # glm-5.3 runs at 1M context on this seat (same engine as the
  # Anthropic-compatible gateway's glm-5.3[1m] route); flash/highspeed
  # variants carry conservative output caps until officially documented.
  - name: "zai-coding-plan/glm-5.3"
    effort_levels: {minimal: low, low: low, high: high, max: max}
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 131072
    max_concurrent: 4
  - name: "zai-coding-plan/glm-5.3-flash"
    effort_levels: {minimal: low, low: low, high: high, max: max}
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6
  - name: "zai-coding-plan/glm-5.3-highspeed"
    effort_levels: {minimal: low, low: low, high: high, max: max}
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 6

  # ═══════════════════════════════════════════════════════════════════
  # Free tier — $0 per token. No SLA; shared upstream quota. Limits and
  # variants are what `opencode models --verbose` reports (2026-11-17).
  # ═══════════════════════════════════════════════════════════════════
  # OpenCode-hosted (opencode/*): no OpenRouter key.
  - name: "opencode/glm-5.3-flash-free"
    effort_levels: {minimal: low, low: low, high: high, max: max}
    context_window: 200000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 32000
    max_concurrent: 6
  - name: "opencode/nemotron-3.5-lightning-free"
    context_window: 262144
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 262144
    max_concurrent: 8
  - name: "opencode/nemotron-3.5-super-vl-free"
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 131072
    max_concurrent: 8
  # OpenRouter :free routes (need the OpenRouter credential).
  - name: "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
    effort_levels: {medium: medium, high: high}
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 8
  - name: "openrouter/nvidia/nemotron-3.5-lightning:free"
    effort_levels: {minimal: low, low: low, medium: medium, high: high}
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 65536
    max_concurrent: 8
  - name: "openrouter/nvidia/nemotron-3.5-super-vl:free"
    effort_levels: {minimal: low, low: low, medium: medium, high: high}
    context_window: 1000000
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 131072
    max_concurrent: 8
  - name: "openrouter/google/gemma-4-31b-it:free"
    effort_levels: {minimal: low, low: low, medium: medium, high: high}
    context_window: 262144
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 32768
    max_concurrent: 8
  - name: "openrouter/google/gemma-4-26b-a4b-it:free"
    effort_levels: {minimal: low, low: low, medium: medium, high: high}
    context_window: 262144
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
    max_output_tokens: 32768
    max_concurrent: 8

# Per-sheet reasoning effort (GH #535). `opencode run --help` (1.19.4, checked
# 2026-11-11): `--variant` "model variant (provider-specific reasoning effort)".
# Variants differ per model, so the profile maps nothing itself and each model
# row lists the variants `opencode models --verbose` reports for it (the
# zai-coding-plan glm-5.3 family and opencode/glm-5.3-flash-free: low, high,
# max; the OpenRouter Nemotron and Gemma rows: low/medium/high, `none` unmapped).
# Rows without effort_levels refuse the key. The TUI launch
# (`opencode [project]`) has no --variant, so interactive sheets refuse it.
effort:
  delivery: flag
  flag: "--variant"
  levels: {}
  interactive: false

cli:
  # GH #434: the stream's first event arrives within seconds of a healthy
  # start; 90 s of silence on both pipes is a dead session, struck early as
  # a stale timeout so the baton retries/falls back instead of burning the
  # sheet timeout. Does not bound silence after the first byte.
  first_output_timeout_seconds: 90
  command:
    executable: opencode
    subcommand: "run"
    # Bypass interactive permission prompts — required for headless/daemon
    # execution. Without this, opencode's default sandbox blocks file-write
    # tool calls at an interactive prompt that has no TTY, producing silent
    # 0-exit "success" with no deliverable (sheet validations then fail at
    # pass_rate=0.0 — the outcome-level catch, but a full retry budget wasted).
    auto_approve_flag: "--dangerously-skip-permissions"
    # GH#188: Stdin delivery for large prompt safety. Previously used
    # positional args which crashed on 100KB+ prompts during fallback.
    prompt_via_stdin: true
    model_flag: "--model"
    output_format_flag: "--format"
    output_format_value: "json"
    # Auth handled by opencode's credential store (opencode providers login).
    # Run `opencode providers login` to configure providers.
    # Keys stored in ~/.local/share/opencode/auth.json
    # GH #335: opencode reads its own store, so it needs none of the
    # conductor's credential variables (verified 2026-10-21: a GLM-5.3 run
    # with required_env [] answered). Only PATH/HOME/XDG/... pass through.
    # A provider you authenticate by environment variable instead goes here.
    required_env: []
  # Interactive mode — drive the opencode TUI in a tmux session.
  # Patterns spike-verified 2026-06-11 against OpenCode 1.4.6.
  # The headless permission flag is run-subcommand-only; the TUI's default
  # Build agent executes tools without permission prompts.
  interactive:
    # Verified, but opt-in: interactive-by-default is claude-code only
    # (composer decision 2026-06-11). Scores enable per-sheet/score via
    # instrument_config: {interactive: true}.
    enabled_by_default: false
    inherit_auto_approve: false
    # Bottom status line, present at boot and after every response.
    ready_pattern: 'tab agents'
    busy_patterns:
      - 'esc interrupt'
    quiet_seconds: 15.0
    poll_interval_seconds: 2.0
    startup_timeout_seconds: 90.0
  output:
    # OpenCode outputs NDJSON (one JSON event per line), not a single JSON object.
    # Events: step_start, tool_use, text (result), step_finish (tokens).
    format: jsonl
    completion_event_type: "text"
    result_path: "part.text"
    error_path: "part.text"
    input_tokens_path: "part.tokens.input"
    output_tokens_path: "part.tokens.output"
    aggregate_tokens: false
  errors:
    success_exit_codes: [0]
    rate_limit_patterns:
      - "rate.?limit"
      - "(?:error|status|code)[^\\w]*429"
      - "too many requests"
      # Z.AI Coding Plan (GH #509): "Error: Weekly/Monthly Limit Exhausted.
      # Your limit will reset at 2026-11-12 06:24:25"
      - "Limit Exhausted"
      - "Your limit will reset at"
    auth_error_patterns:
      - "unauthorized"
      - "invalid.*api.*key"
      - "authentication.*failed"
    # opencode with the requested provider unconfigured: exit 1 in ~12 s,
    # a ProviderModelNotFoundError log line (run) or "Error: Provider not
    # found: <id>" (models). Route facts, not work failures (GH #389).
    unavailable_patterns:
      - "ProviderModelNotFoundError"
      - "Provider not found"
    capacity_patterns:
      - "overloaded"
      - "503"
      - "capacity"
    timeout_patterns:
      - "timed?.?out"
      - "timeout"
