# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║              CODEBASE REWRITE — Iterative Language/Framework Migration      ║
# ║                                                                             ║
# ║  Patterns: Cathedral Construction + CEGAR Loop + Commissioning Cascade      ║
# ║                                                                             ║
# ║  WHY these three patterns compose for codebase rewrites:                    ║
# ║                                                                             ║
# ║  Cathedral Construction provides the iterative build loop. A codebase       ║
# ║  rewrite isn't a single pass — it's multiple iterations of analyze,         ║
# ║  rewrite, validate, review. Self-chaining with inherited workspace          ║
# ║  carries forward state across iterations. Stage 9's CONTINUE/COMPLETE       ║
# ║  decision gates the loop.                                                   ║
# ║                                                                             ║
# ║  CEGAR Loop provides progressive refinement. Stage 2 (coarse analysis)      ║
# ║  identifies ALL potential rewrite candidates cheaply. Stage 3 (triage)      ║
# ║  verifies which candidates are REAL vs FALSE_POSITIVE before expensive      ║
# ║  rewrite work begins. Stage 5 (candidate gate) is the CEGAR termination    ║
# ║  check — it verifies REAL candidates exist before committing to the         ║
# ║  expensive build stage.                                                     ║
# ║                                                                             ║
# ║  Commissioning Cascade provides multi-scope validation. Unit tests          ║
# ║  (fast, isolated) run first at stage 7. Integration tests (cross-module)    ║
# ║  run next at stage 8. Quality review (semantic judgment) runs last at       ║
# ║  stage 9. Staged fail-fast: if unit tests fail, skip integration.           ║
# ║                                                                             ║
# ║  This is NOT Echelon Repair — all candidates get the same rewrite           ║
# ║  treatment. There's no tier routing by difficulty.                           ║
# ║                                                                             ║
# ║  This is NOT Fan-out + Synthesis — each iteration is sequential.            ║
# ║  Parallelism occurs ACROSS iterations via self-chaining.                    ║
# ║                                                                             ║
# ║  Execution Flow (9 stages per iteration, fully sequential):                 ║
# ║                                                                             ║
# ║    Stage 1: Reconnaissance   → map codebase, dependencies, complexity       ║
# ║         |                                                                   ║
# ║    Stage 2: Coarse Analysis  → broad scan for rewrite candidates            ║
# ║         |                                                                   ║
# ║    Stage 3: Triage           → verify REAL vs FALSE_POSITIVE (CEGAR)        ║
# ║         |                                                                   ║
# ║    Stage 4: Decomposition    → units, each with the tests that bind it      ║
# ║         |                                                                   ║
# ║    Stage 5: Candidate Gate   → verify REAL candidates exist (CEGAR gate)    ║
# ║         |                                                                   ║
# ║    Stage 6: Unit Loop        → one unit per pass: adapt its tests, then     ║
# ║         |                      write code to pass them (skip if CONVERGED)  ║
# ║    Stage 7: Unit Validation  → run unit tests (Commissioning tier 1)        ║
# ║         |                                                                   ║
# ║    Stage 8: Integration      → run integration tests (Commissioning tier 2) ║
# ║         |                                                                   ║
# ║    Stage 9: Quality Review   → CONTINUE or COMPLETE (Cathedral gate +       ║
# ║         |                      Commissioning acceptance)                    ║
# ║    (sheet-9 trigger self-chains; next sheet 1 skips on COMPLETE)            ║
# ║                                                                             ║
# ║  Instruments are bound per role on the movements (capability classes        ║
# ║  from your classes.yaml, so the score is portable):                         ║
# ║    strong    — recon, decomposition, triage: stages 1, 3, 4                 ║
# ║    fast      — coarse scan, gate, test runs: stages 2, 5, 7, 8              ║
# ║    workhorse — the unit loop's edit/test cycles: stage 6                    ║
# ║    review    — quality judgment and the iteration decision: stage 9         ║
# ║                                                                             ║
# ║  Usage:                                                                     ║
# ║    1. Copy this score next to the project you are rewriting                 ║
# ║    2. Edit prompt.variables (search [CHANGE THIS]); project_root is the     ║
# ║       checkout the rewrite edits — the workspace holds only the ledgers     ║
# ║    3. mzt start && mzt run codebase-rewrite.yaml --var project_root=/abs    ║
# ║    4. mzt status codebase-rewrite --watch                                   ║
# ║    The sheet-9 trigger chains the next iteration by itself (the score      ║
# ║    names itself relative to its own path); the chain stops when the       ║
# ║    review writes COMPLETE, or at concert.max_chain_depth.                  ║
# ║                                                                             ║
# ║  Output (per iteration):                                                    ║
# ║    workspace/                                                               ║
# ║      01-reconnaissance.md       — Module inventory and dependencies         ║
# ║      02-candidates.yaml         — Rewrite candidates with classification    ║
# ║      03-triage.yaml             — Verified verdicts per candidate           ║
# ║      04-rewrite-plan.md        — Units in loop order, each with its tests   ║
# ║      05-gate-status.yaml        — PROCEED/CONVERGED gate decision           ║
# ║      06-migration-log.md       — One section per unit pass (red → green)    ║
# ║      06-units-done.txt         — Written only when every unit is DONE       ║
# ║      07-unit-test-results.md    — Unit test outcomes                       ║
# ║      08-integration-results.md  — Integration test outcomes                ║
# ║      09-quality-review.md       — Quality assessment + iteration gate      ║
# ║                                                                             ║
# ║  Sheets: 9 per iteration (stage 6 loops, up to 8 passes)                    ║
# ║  Time: ~1-4 h per iteration | Cost: ~$5-40, loop-bounded (cost_limit_usd)   ║
# ║  Expected iterations: 1-3 for small codebases, 2-5 for medium (50-200 files)║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: codebase-rewrite
description: >
  Generic codebase rewrite with iterative refinement. Cathedral Construction
  provides the iteration loop, CEGAR Loop provides progressive analysis
  (coarse scan, triage, gate), the unit loop rewrites one decomposed unit
  per pass by adapting its existing tests first and writing code to pass
  them, and Commissioning Cascade provides multi-scope validation (unit,
  integration, acceptance).

workspace: ../../workspaces/codebase-rewrite

# ═══════════════════════════════════════════════════════════════════════════════
# INSTRUMENT CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════

# Score default; every movement below binds its own role (see `movements`).
instrument: workhorse
instrument_fallbacks: [codex-cli]
instrument_config:
  timeout_seconds: 1200

# ═══════════════════════════════════════════════════════════════════════════════
# MOVEMENTS — named stages visible in `mzt status`
# ═══════════════════════════════════════════════════════════════════════════════

# Instruments are bound per role: recon and decomposition want the strongest
# reasoner, scanning and test runs want a fast one, the unit loop wants a
# tool-driven workhorse, and the review wants a judge.
movements:
  1:
    name: Reconnaissance
    instrument: strong
    instrument_config: {timeout_seconds: 900}
  2:
    name: Coarse Analysis
    instrument: fast
    instrument_config: {timeout_seconds: 600}
  3:
    name: Triage
    instrument: strong
    instrument_config: {timeout_seconds: 1200}
  4:
    name: Decomposition
    instrument: strong
    instrument_config: {timeout_seconds: 900}
  5:
    name: Candidate Gate
    instrument: fast
    instrument_config: {timeout_seconds: 300}
  6:
    name: Unit Loop
    instrument: workhorse
    instrument_config: {timeout_seconds: 2400}
  7:
    name: Unit Validation
    instrument: fast
    instrument_config: {timeout_seconds: 900}
  8:
    name: Integration Validation
    instrument: fast
    instrument_config: {timeout_seconds: 900}
  9:
    name: Quality Review
    instrument: review
    instrument_config: {timeout_seconds: 900}

# ═══════════════════════════════════════════════════════════════════════════════
# SHEET CONFIGURATION — 9 stages, fully sequential
# ═══════════════════════════════════════════════════════════════════════════════

sheet:
  size: 1
  total_items: 9
  descriptions:
    1: "Analyze codebase structure and map rewrite scope"
    2: "Broad scan for modules needing rewrite"
    3: "Verify candidates: REAL need vs FALSE_POSITIVE"
    4: "Decompose verified candidates into units, each bound to its tests"
    5: "Gate check: verify REAL candidates exist before expensive rewrite"
    6: "Unit loop: adapt the next unit's tests, then write code to pass them"
    7: "Run unit tests against rewritten code"
    8: "Run integration tests"
    9: "Review quality, decide CONTINUE or COMPLETE"
  dependencies:
    2: [1]
    3: [2]
    4: [3]
    5: [4]
    6: [5]
    7: [6]
    8: [7]
    9: [8]

  # Unit loop: sheet 6 repeats, one unit per pass, until the pass that
  # completes the last unit writes the marker (or the cap hits). At cap
  # without marker the loop ends with a warning and stage 9 decides
  # CONTINUE, so the next iteration picks up the remaining units.
  loops:
    6:
      index: unit_pass
      until: 'file("06-units-done.txt").exists'
      max_iterations: 8
      cost_limit_usd: 30.0

  # CEGAR check-termination: skip expensive stages when no REAL candidates.
  # Exit 0 from grep = pattern found = skip the stage.
  # Chain terminator: a COMPLETE decision from the previous iteration ends the
  # Cathedral loop at the next job's first sheet (zero prompt cost). Every
  # later sheet depends on sheet 1, so one skip settles the whole job.
  triggers:
    9:
      on_success:
        - concert:
            score: "codebase-rewrite.yaml"
            inherit_workspace: true
            fresh: true

  skip_when:
    1:
      command: 'test -f "{workspace}/.rewrite-complete"'
      description: "Chain complete — the previous iteration's review decided COMPLETE"
      timeout_seconds: 10
    6:
      command: 'grep -q "status: CONVERGED" "{workspace}/05-gate-status.yaml"'
      description: "Skip rewrite if no REAL candidates remain"
      timeout_seconds: 10
    7:
      command: 'grep -q "status: CONVERGED" "{workspace}/05-gate-status.yaml"'
      description: "Skip unit tests if no rewrite occurred"
      timeout_seconds: 10
    8:
      command: 'grep -q "status: CONVERGED" "{workspace}/05-gate-status.yaml" || grep -qE "\*\*Results:\*\*\s*FAIL" "{workspace}/07-unit-test-results.md"'
      description: "Skip integration tests if no rewrite occurred, or if unit tests failed (fail-fast)"
      timeout_seconds: 10

# ═══════════════════════════════════════════════════════════════════════════════
# CROSS-SHEET CONTEXT — workspace files carry state across stages
# ═══════════════════════════════════════════════════════════════════════════════

cross_sheet:
  auto_capture_stdout: true
  max_output_chars: 3000
  lookback_sheets: 3
  capture_files:
    - "{{ workspace }}/*.md"
    - "{{ workspace }}/*.yaml"

# ═══════════════════════════════════════════════════════════════════════════════
# CATHEDRAL CONSTRUCTION — self-chaining iteration loop
# ═══════════════════════════════════════════════════════════════════════════════
#
# After all 9 stages complete, the score re-submits itself with fresh: true.
# The next iteration's Reconnaissance stage reads the inherited workspace to
# plan what to rewrite next. Stage 9's CONTINUE/COMPLETE decision determines
# whether to continue. max_chain_depth: 10 provides a hard stop.
#
# IMPORTANT: Set job_path to the ABSOLUTE path of this score file.
# Relative paths resolve from the daemon's CWD, not the score's directory.

workspace_lifecycle:
  archive_on_fresh: true
  max_archives: 10
  # The COMPLETE marker must outlive the fresh archive, or the next iteration
  # could never see it and the chain would only stop at max_chain_depth.
  preserve_patterns:
    - ".iteration"
    - ".marianne-*"
    - ".coverage"
    - "archive/**"
    - ".worktrees/**"
    - ".rewrite-complete"

concert:
  enabled: true
  max_chain_depth: 10

# Cathedral Construction loop, as a sheet trigger (see sheet.triggers below):
# the sheet-9 trigger submits this same score as the next iteration, named
# relative to this file, so nothing absolute has to be edited in (the old
# `on_success: run_job` needed an absolute job_path). The chain ends
# structurally: when the review writes COMPLETE, the next iteration's sheet 1
# skips at dispatch (sheet.skip_when below), a skipped sheet carries no
# success, so no further trigger fires and that job completes green.

# ═══════════════════════════════════════════════════════════════════════════════
# RETRY AND STALE DETECTION
# ═══════════════════════════════════════════════════════════════════════════════

retry:
  max_retries: 3
  base_delay_seconds: 15

stale_detection:
  enabled: true
  idle_timeout_seconds: 1800

# ═══════════════════════════════════════════════════════════════════════════════
# PROMPT
# ═══════════════════════════════════════════════════════════════════════════════

prompt:
  variables:
    # The checkout the rewrite edits. ABSOLUTE path; set it per run with
    # `--var project_root=/abs` (chained iterations inherit it) rather than
    # editing it in. The workspace holds only this score's ledgers.
    project_root: "[CHANGE THIS: ABSOLUTE path to the project checkout]"
    source_language: "[CHANGE THIS: e.g., JavaScript, Python 2, Java 8]"
    target_language: "[CHANGE THIS: e.g., TypeScript, Python 3, Kotlin]"
    source_dir: "src"
    test_dir: "tests"
    # Both commands run from project_root.
    test_command: "[CHANGE THIS: e.g., pytest tests/ -x, npm test, cargo test]"
    integration_test_command: "[CHANGE THIS: e.g., pytest tests/integration/, npm run test:e2e]"
    improvement_specs: |
      - Modernize API patterns
      - Add type safety where applicable
      - Improve error handling
      - Update deprecated dependencies

  template: |
    {# ── Macros ─────────────────────────────────────────────────────────── #}

    {% macro write_to(filename) %}
    ## Output
    Write your findings to `{{ workspace }}/{{ filename }}`.
    Ensure the file is complete, well-structured, and self-contained.
    {% endmacro %}

    {% macro read_file(filename) %}
    Read `{{ workspace }}/{{ filename }}`.
    {% endmacro %}

    {# ── Stage 1: Reconnaissance (Cathedral: plan-iteration) ─────────── #}

    {% if stage == 1 %}
    # Reconnaissance — Codebase Analysis

    Analyze the codebase at `{{ project_root }}/{{ source_dir }}` (tests in
    `{{ project_root }}/{{ test_dir }}`) for migration from
    **{{ source_language }}** to **{{ target_language }}**. The project is
    edited in place there; this workspace holds only the ledgers.

    If previous iteration files exist in the workspace (01-reconnaissance.md,
    09-quality-review.md), read them first — this is a subsequent Cathedral
    Construction iteration. Focus on what REMAINS to be rewritten.

    ## Tasks

    1. **Inventory** all source files with approximate line counts
    2. **Map dependencies** — imports, function calls, class inheritance
    3. **Identify external dependencies** and their {{ target_language }} equivalents
    4. **Assess complexity** per module: simple (1) / moderate (2-3) / complex (4-5)
    5. **Check existing test coverage** — which modules have tests, how the
       tests reach the code (import, CLI subprocess, HTTP), and whether they
       can drive a {{ target_language }} implementation unchanged or need
       adapting
    6. **Check prior iteration progress** — which modules were already rewritten?

    {{ write_to("01-reconnaissance.md") }}
    Include: module inventory table, dependency graph, complexity ratings,
    external dependency mapping, test coverage, recommended rewrite order,
    and (if applicable) prior iteration progress summary.

    {# ── Stage 2: Coarse Analysis (CEGAR: coarse-check) ─────────────── #}

    {% elif stage == 2 %}
    # Coarse Analysis — Rewrite Candidate Identification

    {{ read_file("01-reconnaissance.md") }}

    Scan ALL modules and classify each:
    - **REWRITE**: Full translation to {{ target_language }} needed
    - **ADAPT**: Minor updates only (API changes, deprecations)
    - **SKIP**: Already compatible, already rewritten, or trivially convertible

    For each candidate, note:
    - Difficulty rating (1-5)
    - Specific challenges (pattern changes, API differences, type mismatches)
    - Risks (no tests, complex dependencies, shared state)

    {{ write_to("02-candidates.yaml") }}
    Structure:
    ```yaml
    candidates:
      - module: "path/to/module"
        classification: REWRITE
        difficulty: 3
        challenges: ["callback-to-async conversion", "no type hints"]
        risks: ["no existing tests", "used by 4 other modules"]
      - module: "path/to/other"
        classification: SKIP
        difficulty: 1
        challenges: []
        risks: []
    summary:
      total_modules: 25
      rewrite_count: 12
      adapt_count: 5
      skip_count: 8
    ```

    Be aggressive — over-classify rather than miss candidates.
    Stage 3 (Triage) will filter false positives.

    {# ── Stage 3: Triage (CEGAR: triage-findings) ───────────────────── #}

    {% elif stage == 3 %}
    # Triage — Verify Rewrite Candidates

    {{ read_file("01-reconnaissance.md") }}
    {{ read_file("02-candidates.yaml") }}

    For EACH candidate classified as REWRITE or ADAPT, read the actual
    source code and verify: is this a REAL need or a FALSE_POSITIVE
    (simpler than the coarse scan suggested)?

    Be skeptical. Coarse analysis consistently over-classifies because it
    reads module signatures, not implementations. A module that LOOKS like
    it needs rewriting may already be compatible.

    For each candidate:
    1. Read the source file
    2. Check if the {{ target_language }} equivalent is simpler than expected
    3. Check if an automated tool could handle the conversion
    4. Assess whether the coarse difficulty rating was accurate

    {{ write_to("03-triage.yaml") }}
    Structure:
    ```yaml
    triage_results:
      - module: "path/to/module"
        original_classification: REWRITE
        verdict: REAL
        evidence: "Contains complex callback nesting with no direct async equivalent"
        revised_difficulty: 4
      - module: "path/to/other"
        original_classification: REWRITE
        verdict: FALSE_POSITIVE
        evidence: "Only uses standard library calls that have 1:1 equivalents"
        revised_difficulty: 1
    summary:
      real_count: 8
      false_positive_count: 4
      total_triaged: 12
    ```

    {# ── Stage 4: Decomposition (CEGAR: refine-or-report) ──────────── #}

    {% elif stage == 4 %}
    # Decomposition — Units Bound to Their Tests

    {{ read_file("01-reconnaissance.md") }}
    {{ read_file("03-triage.yaml") }}

    Decompose the modules with verdict: REAL into **units** the unit loop
    (stage 6) can finish one per pass. Ignore FALSE_POSITIVE modules.

    A unit is the smallest piece that can be rewritten and proven on its
    own: a module, or a cluster of functions behind one interface. Each
    unit is bound to the tests that prove it — existing tests from
    `{{ project_root }}/{{ test_dir }}` first, new tests only where none
    exist. The tests are the specification; the rewrite is done when they
    pass against the {{ target_language }} code, not when the code "looks
    complete".

    Ordering rules:
    1. Dependency leaves first (units nothing else depends on)
    2. Within one level: the unit with the best existing tests first
    3. Group functions that share an interface into one unit

    For each unit:
    - **Scope:** source files/functions it covers
    - **Interface:** what callers see (signatures, CLI flags, wire format)
      — the interface the rewritten unit must keep so its tests still bind
    - **Tests:** existing test files/cases that cover it, and for each
      whether it runs unchanged against {{ target_language }} or needs
      adapting (and how: swap the entrypoint, port the harness, port the
      assertions). Name any behaviour with NO test; the loop writes a
      test for it before writing code.
    - **Acceptance command:** the narrowed test command that proves this
      unit alone (from `{{ test_command }}`, narrowed to its tests)
    - **{{ target_language }} patterns** to apply, and expected output files
    - **Effort:** lines, complexity

    Additional improvement specifications to apply during rewrite:
    {{ improvement_specs }}

    {{ write_to("04-rewrite-plan.md") }}
    Begin with a table (unit, scope, tests, acceptance command, status
    PENDING) in loop order, then the per-unit plans.

    {# ── Stage 5: Candidate Gate (CEGAR: check-termination) ─────────── #}

    {% elif stage == 5 %}
    # Candidate Gate — CEGAR Termination Check

    {{ read_file("03-triage.yaml") }}
    {{ read_file("04-rewrite-plan.md") }}

    Verify whether REAL rewrite candidates exist and require work this
    iteration. Read the triage results and the rewrite plan.

    Write `{{ workspace }}/05-gate-status.yaml` with this exact structure:
    ```yaml
    status: PROCEED
    real_count: 8
    false_positive_count: 4
    planned_modules: 8
    gate_reason: "8 REAL candidates require rewrite work"
    ```

    Rules:
    - If `real_count > 0` AND the rewrite plan lists modules to process:
      set `status: PROCEED`
    - If `real_count == 0` OR all REAL candidates were already handled
      in prior iterations: set `status: CONVERGED`

    If CONVERGED, stages 6-8 (rewrite, unit tests, integration tests)
    will be skipped automatically. Stage 9 (Quality Review) will still
    run to finalize the iteration decision.

    {{ write_to("05-gate-status.yaml") }}

    {# ── Stage 6: Unit Loop (Cathedral: build; one unit per pass) ───── #}

    {% elif stage == 6 %}
    # Unit Loop — Pass {{ loops.unit_pass }} of 8 max

    You are unit pass **{{ loops.unit_pass }}**. The conductor re-runs
    this sheet until the pass that completes the last unit writes the
    marker (or the pass/cost cap is hit). Each pass takes the NEXT unit in
    `04-rewrite-plan.md` whose status is not DONE.

    {{ read_file("04-rewrite-plan.md") }}
    {% if loops.unit_pass > 1 %}
    Read `{{ workspace }}/06-migration-log.md` — the previous passes'
    sections. Continue from the first unit that is not DONE; never redo a
    DONE unit.
    {% endif %}

    **Pass start — clear the loop marker (it proves THIS pass finished the
    plan):**
    ```bash
    rm -f {{ workspace }}/06-units-done.txt
    ```

    Work in `{{ project_root }}`. Write {{ target_language }} files
    alongside the originals; do NOT delete originals until the unit's
    tests pass against the rewrite.

    **Step 1 — Tests first (red).** Take the unit's tests from the plan.
    Adapt the ones that need it (entrypoint, harness, assertions) so they
    drive the {{ target_language }} implementation, and write tests for
    the behaviours the plan marked untested. Run the unit's acceptance
    command: it must FAIL for the right reason (missing implementation),
    not for a harness error. Record the red run.

    **Step 2 — Code to pass them (green).** Translate the unit from
    {{ source_language }} to {{ target_language }}, keeping the interface
    the plan names. Apply the improvement specifications. Run the unit's
    acceptance command until it passes. Do not widen scope to other units.

    **Step 3 — Prove, then record.** Run the acceptance command one final
    time and paste its tail. Then update the unit's row in
    `{{ workspace }}/04-rewrite-plan.md` to DONE (or PARTIAL / BLOCKED
    with the concrete blocker: the failing test and its message).

    **Step 4 — Marker, only when the plan is finished.** If and only if
    every unit's row now reads DONE:
    ```bash
    date -u +"units done %Y-%m-%dT%H:%M:%SZ" > {{ workspace }}/06-units-done.txt
    ```
    Never write it by hand for a plan with PENDING, PARTIAL or BLOCKED
    rows — it is the conductor's only loop evidence.

    **Output:** append to `{{ workspace }}/06-migration-log.md` (keep the
    previous passes' sections):

    ```markdown
    ## Pass {{ loops.unit_pass }} — <unit name> — <date>
    ### Tests adapted / written
    | Test | Change | Reason |
    ### Red run
    [tail of the acceptance command before the rewrite]
    ### Rewrite
    [files written, interface kept, improvements applied]
    ### Green run
    [tail of the acceptance command after the rewrite]
    ### Status: DONE | PARTIAL | BLOCKED (<concrete blocker>)
    ```

    {# ── Stage 7: Unit Validation (Commissioning: unit-check) ────────── #}

    {% elif stage == 7 %}
    # Unit Validation — Commissioning Cascade Tier 1

    Run the unit test suite against the rewritten code:

    ```bash
    cd {{ project_root }} && {{ test_command }}
    ```

    Capture ALL output. If tests fail, document which tests failed and why.
    Do NOT fix failures — that's the next iteration's job. Your role is
    accurate reporting.

    {{ write_to("07-unit-test-results.md") }}
    Include:
    - **Results:** PASS or FAIL
    - **Summary:** tests run, passed, failed, skipped (with counts)
    - **Failures:** for each failure — test name, file, error message,
      which rewritten module is involved
    - **Coverage notes:** any modules without test coverage

    {# ── Stage 8: Integration Validation (Commissioning: integration) ── #}

    {% elif stage == 8 %}
    # Integration Validation — Commissioning Cascade Tier 2

    Run the integration test suite:

    ```bash
    cd {{ project_root }} && {{ integration_test_command }}
    ```

    Capture ALL output. Focus on cross-module interaction failures that
    unit tests wouldn't catch — import errors, interface mismatches,
    runtime type errors at module boundaries.

    {{ write_to("08-integration-results.md") }}
    Include:
    - **Results:** PASS or FAIL
    - **Summary:** tests run, passed, failed, skipped (with counts)
    - **Integration failures:** for each — which modules interact,
      what broke at the boundary, root cause
    - **Regression notes:** anything that worked before the rewrite

    {# ── Stage 9: Quality Review (Cathedral: inspect + Commissioning: acceptance) #}

    {% elif stage == 9 %}
    # Quality Review — Iteration Gate

    Read all workspace artifacts:
    - `{{ workspace }}/04-rewrite-plan.md` — the units and their status rows
    - `{{ workspace }}/05-gate-status.yaml` — gate decision
    - `{{ workspace }}/06-migration-log.md` — what was completed (if exists)
    - `{{ workspace }}/07-unit-test-results.md` — unit test outcomes (if exists)
    - `{{ workspace }}/08-integration-results.md` — integration outcomes (if exists)
    - `{{ workspace }}/03-triage.yaml` — all verified candidates

    Note: stages 6-8 may have been skipped if the candidate gate reported
    CONVERGED (no REAL candidates remaining). If those files don't exist,
    check 05-gate-status.yaml for the reason.

    ## Assessment

    1. **Progress:** How many units are DONE vs PARTIAL / BLOCKED / PENDING?
       (`06-units-done.txt` present means the loop finished the plan.)
    2. **Quality:** Are rewritten modules clean, idiomatic {{ target_language }}?
    3. **Test health:** Do tests pass? Any regressions?
    4. **Blockers:** Anything preventing further progress?

    ## Iteration Decision

    Evaluate and write ONE of these decisions on its own line:

    **CONTINUE** — if ANY of these are true:
    - Any unit is not DONE (the unit loop hit its cap, or a unit is BLOCKED)
    - Tests are failing on rewritten modules (need fixes next iteration)
    - Quality issues were found that need another pass

    **COMPLETE** — if ALL of these are true:
    - Every unit is DONE (or gate said CONVERGED)
    - Unit tests pass (or were skipped due to convergence)
    - Integration tests pass (or were skipped due to convergence)
    - Code quality meets {{ target_language }} idioms

    {{ write_to("09-quality-review.md") }}
    Include: progress summary table, quality assessment, test result summary,
    blockers (if any), and the CONTINUE or COMPLETE decision with justification.

    If and only if the decision is COMPLETE, also create the chain stop
    marker: `touch "{{ workspace }}/.rewrite-complete"`. The next iteration's
    first sheet reads that file and skips, which ends the chain. Do NOT
    create it on CONTINUE.

    {% endif %}

# ═══════════════════════════════════════════════════════════════════════════════
# VALIDATIONS — staged fail-fast per sheet
#
# Each validation uses `condition` to target the correct sheet and `stage`
# for ordering within that sheet's validation run.
# Stage 1 = coarse checks (file exists). Stage 2 = fine checks (content).
# ═══════════════════════════════════════════════════════════════════════════════

validations:
  # ── Sheet 1: Reconnaissance ────────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/01-reconnaissance.md"
    condition: "sheet_num == 1"
    stage: 1
    description: "Reconnaissance report created"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/01-reconnaissance.md") -ge 200'
    condition: "sheet_num == 1"
    stage: 2
    description: "Reconnaissance has substantive content (200+ words)"

  # ── Sheet 2: Coarse Analysis ───────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/02-candidates.yaml"
    condition: "sheet_num == 2"
    stage: 1
    description: "Candidates file created"
  - type: content_contains
    path: "{workspace}/02-candidates.yaml"
    pattern: "candidates:"
    condition: "sheet_num == 2"
    stage: 2
    description: "Candidates file has proper YAML structure"
  - type: content_regex
    path: "{workspace}/02-candidates.yaml"
    pattern: "classification: (REWRITE|ADAPT|SKIP)"
    condition: "sheet_num == 2"
    stage: 2
    description: "Candidates have classification labels"

  # ── Sheet 3: Triage ────────────────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/03-triage.yaml"
    condition: "sheet_num == 3"
    stage: 1
    description: "Triage results created"
  # Every triaged candidate carries a verdict and evidence; an empty triage
  # (every candidate was SKIP) is legitimate and converges at stage 5.
  - type: command_succeeds
    command: |
      python3 - "{workspace}/03-triage.yaml" <<'PY'
      import sys, yaml
      t = yaml.safe_load(open(sys.argv[1])) or {}
      rows = t.get("triage_results") or []
      assert all(r.get("verdict") in ("REAL", "FALSE_POSITIVE") for r in rows), "bad verdict"
      assert all(r.get("evidence") for r in rows), "missing evidence"
      s = t.get("summary") or {}
      assert s.get("total_triaged", len(rows)) == len(rows), "summary disagrees with rows"
      PY
    condition: "sheet_num == 3"
    stage: 2
    timeout_seconds: 30
    description: "Every triaged candidate has a REAL/FALSE_POSITIVE verdict with evidence (zero rows allowed)"

  # ── Sheet 4: Rewrite Planning ──────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/04-rewrite-plan.md"
    condition: "sheet_num == 4"
    stage: 1
    description: "Rewrite plan created"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/04-rewrite-plan.md") -ge 100'
    condition: "sheet_num == 4"
    stage: 2
    description: "Rewrite plan has substantive content (100+ words)"
  - type: content_regex
    path: "{workspace}/04-rewrite-plan.md"
    pattern: "(?i)acceptance command"
    condition: "sheet_num == 4"
    stage: 2
    description: "Every unit names the test command that proves it"

  # ── Sheet 5: Candidate Gate ────────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/05-gate-status.yaml"
    condition: "sheet_num == 5"
    stage: 1
    description: "Gate status file created"
  - type: content_regex
    path: "{workspace}/05-gate-status.yaml"
    pattern: "status: (PROCEED|CONVERGED)"
    condition: "sheet_num == 5"
    stage: 2
    description: "Gate status has valid PROCEED/CONVERGED decision"
  - type: content_contains
    path: "{workspace}/05-gate-status.yaml"
    pattern: "real_count:"
    condition: "sheet_num == 5"
    stage: 2
    description: "Gate status includes REAL candidate count"

  # ── Sheet 6: Execute Rewrite ───────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/06-migration-log.md"
    condition: "sheet_num == 6"
    stage: 1
    description: "Migration log created"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/06-migration-log.md") -ge 50'
    condition: "sheet_num == 6"
    stage: 2
    description: "Migration log documents actual work done"
  - type: content_regex
    path: "{workspace}/06-migration-log.md"
    pattern: "Status: (DONE|PARTIAL|BLOCKED)"
    condition: "sheet_num == 6"
    stage: 2
    description: "Migration log has a per-unit status (partial passes may repeat)"
  - type: content_regex
    path: "{workspace}/06-migration-log.md"
    pattern: "### Red run"
    condition: "sheet_num == 6"
    stage: 2
    description: "Each unit pass ran its tests before writing code"

  # ── Sheet 7: Unit Validation ───────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/07-unit-test-results.md"
    condition: "sheet_num == 7"
    stage: 1
    description: "Unit test results recorded"
  - type: content_regex
    path: "{workspace}/07-unit-test-results.md"
    pattern: "\\*\\*Results:\\*\\*\\s*(PASS|FAIL)"
    condition: "sheet_num == 7"
    stage: 2
    description: "Unit test results contain PASS/FAIL verdict"
  # The report is the musician's account; the harness is the oracle. The
  # engine substitutes {test_command} as ONE shell-quoted word, which is
  # exactly what `bash -c` takes, so the whole command runs with its
  # arguments. Gate the sheet on the report's verdict matching the harness:
  # a PASS report over a red suite fails here; a FAIL report over a red suite
  # is an honest report and passes on to stage 9, which decides CONTINUE
  # (the skip on stage 8 is the fail-fast the header promises).
  - type: command_succeeds
    command: 'if grep -qE "\*\*Results:\*\*\s*PASS" "{workspace}/07-unit-test-results.md"; then cd "{project_root}" && bash -c {test_command}; else cd "{project_root}" && ! bash -c {test_command}; fi'
    condition: "sheet_num == 7"
    stage: 3
    timeout_seconds: 1800
    description: "Unit report verdict matches the bound test command's exit in project_root"

  # ── Sheet 8: Integration Validation ────────────────────────────────────
  - type: file_exists
    path: "{workspace}/08-integration-results.md"
    condition: "sheet_num == 8"
    stage: 1
    description: "Integration test results recorded"
  - type: content_regex
    path: "{workspace}/08-integration-results.md"
    pattern: "\\*\\*Results:\\*\\*\\s*(PASS|FAIL)"
    condition: "sheet_num == 8"
    stage: 2
    description: "Integration results contain PASS/FAIL verdict"
  - type: command_succeeds
    command: 'if grep -qE "\*\*Results:\*\*\s*PASS" "{workspace}/08-integration-results.md"; then cd "{project_root}" && bash -c {integration_test_command}; else cd "{project_root}" && ! bash -c {integration_test_command}; fi'
    condition: "sheet_num == 8"
    stage: 3
    timeout_seconds: 1800
    description: "Integration report verdict matches the bound test command's exit in project_root"

  # ── Sheet 9: Quality Review ────────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/09-quality-review.md"
    condition: "sheet_num == 9"
    stage: 1
    description: "Quality review created"
  - type: content_regex
    path: "{workspace}/09-quality-review.md"
    pattern: "\\b(CONTINUE|COMPLETE)\\b"
    condition: "sheet_num == 9"
    stage: 2
    description: "Quality review has CONTINUE/COMPLETE iteration decision"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/09-quality-review.md") -ge 150'
    condition: "sheet_num == 9"
    stage: 2
    description: "Quality review has substantive content (150+ words)"
