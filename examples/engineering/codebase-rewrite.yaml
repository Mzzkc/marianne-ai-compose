# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║        CODEBASE REWRITE — coverage-first, behaviour-bound, refined          ║
# ║                                                                             ║
# ║  Patterns: Cathedral Construction + CEGAR Loop + Commissioning Cascade      ║
# ║            + Rashomon refinement (critics on different models)              ║
# ║                                                                             ║
# ║  A rewrite is only as safe as the oracle that checks it, so the oracle is   ║
# ║  built first and has four tiers:                                            ║
# ║                                                                             ║
# ║    coverage   the SOURCE is covered to `coverage_floor` (default 90%) by    ║
# ║               tests before anything is rewritten; a shortfall is closed by  ║
# ║               characterization tests written against the source and        ║
# ║               committed on their own                                        ║
# ║    unit       `test_command`                                                ║
# ║    integration`integration_test_command`                                    ║
# ║    functional `functional_test_command` (black box: CLI, wire, HTTP)        ║
# ║    differential the same inputs through `source_run_command` and            ║
# ║               `target_run_command`; outputs must agree                      ║
# ║                                                                             ║
# ║  After behaviour is complete, a bounded refinement loop improves the new    ║
# ║  code: three critics on different models (idiom, spec, structural          ║
# ║  fidelity to the source), then a refiner that keeps only edits the whole   ║
# ║  oracle still passes. Matching the source's decomposition is rewarded in   ║
# ║  the final scorecard, never required over a test, a spec rule or an idiom. ║
# ║                                                                             ║
# ║  Stages (one iteration):                                                    ║
# ║    1  Reconnaissance       map modules, deps, spec drops/adds               ║
# ║    2  Coverage Baseline    measure source coverage (follows subprocesses)   ║
# ║    3  Characterize         LOOP: tests against the SOURCE until the floor   ║
# ║    4  Oracle Inventory     classify tests per tier; differential corpus     ║
# ║    5  Decomposition        units bound to tests + the structure to mirror   ║
# ║    6  Gate                 PROCEED / CONVERGED                              ║
# ║   ┌ behaviour_round LOOP (7-9) until every tier is green (cap 3)            ║
# ║   │ 7  Unit Loop           inner LOOP: one unit per pass, red → green       ║
# ║   │ 8  Oracle ×4           unit / integration / functional / differential   ║
# ║   └ 9  Behaviour Gate      all green + target coverage ≥ floor, else        ║
# ║                             reopen the failing units                        ║
# ║   10  Refinement Baseline  metrics + structure map before refining          ║
# ║   ┌ refine_pass LOOP (11-12) until critics converge (count = passes)        ║
# ║   │ 11 Critique ×3         idiom / spec / structural fidelity (spread)      ║
# ║   └ 12 Refine              apply, full oracle per commit, revert red        ║
# ║   13  Final Review         hard gates + scorecard; CONTINUE or COMPLETE     ║
# ║   (sheet 13's trigger self-chains; a COMPLETE marker ends the chain)        ║
# ║                                                                             ║
# ║  Usage:                                                                     ║
# ║    1. Copy this score next to the project you are rewriting                 ║
# ║    2. Set prompt.variables (search [CHANGE THIS]); project_root is the      ║
# ║       checkout the rewrite edits — the workspace holds only the ledgers    ║
# ║    3. mzt start && mzt run codebase-rewrite.yaml --var project_root=/abs    ║
# ║    4. mzt status codebase-rewrite --watch                                   ║
# ║                                                                             ║
# ║  Output (per iteration, in the workspace):                                  ║
# ║    01-reconnaissance.md   02-coverage.yaml    03-characterization-log.md    ║
# ║    04-oracle.md           04-differential/    05-rewrite-plan.md            ║
# ║    06-gate-status.yaml    07-migration-log.md 08-oracle-<tier>.md           ║
# ║    09-behaviour-gate.md   10-refine-baseline.md                             ║
# ║    11-critique-<lens>.md  12-refine-log.md    13-final-review.md            ║
# ║                                                                             ║
# ║  Sheets: 18 per iteration (13 stages; stage 8 ×4, stage 11 ×3)              ║
# ║  Time: ~2-8 h per iteration | Cost: loop-bounded (cost_limit_usd per loop)  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: codebase-rewrite
description: >
  Coverage-first codebase rewrite. The source is covered to a floor before
  anything is rewritten; units are rewritten test-first inside a loop that
  repeats until unit, integration, functional and differential tiers are all
  green; a bounded refinement loop then improves the new code under the same
  oracle, with critics on different models scoring idiom, spec conformance
  and structural fidelity to the source.

workspace: ../../workspaces/codebase-rewrite

# ═══════════════════════════════════════════════════════════════════════════════
# INSTRUMENTS — bound per role (capability classes from your classes.yaml)
# ═══════════════════════════════════════════════════════════════════════════════

instrument: workhorse
instrument_fallbacks: [codex-cli]
instrument_config:
  timeout_seconds: 1200

instruments:
  # The three refinement critics must not share one model's blind spot:
  # `spread` gives each voice a different head of the chain, `balance` starts
  # it on the least-loaded entry when two are busy.
  critic:
    chain: [codex-cli, claude-code, opencode]
    select: [spread, balance]

movements:
  1:  {name: Reconnaissance,        instrument: strong,    instrument_config: {timeout_seconds: 900}}
  2:  {name: Coverage Baseline,     instrument: fast,      instrument_config: {timeout_seconds: 1800}}
  3:  {name: Characterize,          instrument: workhorse, instrument_config: {timeout_seconds: 2400}}
  4:  {name: Oracle Inventory,      instrument: strong,    instrument_config: {timeout_seconds: 1200}}
  5:  {name: Decomposition,         instrument: strong,    instrument_config: {timeout_seconds: 1200}}
  6:  {name: Gate,                  instrument: fast,      instrument_config: {timeout_seconds: 300}}
  7:  {name: Unit Loop,             instrument: workhorse, instrument_config: {timeout_seconds: 2400}}
  8:  {name: Oracle,                instrument: fast,      instrument_config: {timeout_seconds: 1800}}
  9:  {name: Behaviour Gate,        instrument: strong,    instrument_config: {timeout_seconds: 900}}
  10: {name: Refinement Baseline,   instrument: fast,      instrument_config: {timeout_seconds: 900}}
  11: {name: Critique,              instrument: critic,    instrument_config: {timeout_seconds: 1200}}
  12: {name: Refine,                instrument: workhorse, instrument_config: {timeout_seconds: 2400}}
  13: {name: Final Review,          instrument: review,    instrument_config: {timeout_seconds: 1200}}

# ═══════════════════════════════════════════════════════════════════════════════
# SHEETS AND FLOW
# ═══════════════════════════════════════════════════════════════════════════════

sheet:
  size: 1
  total_items: 13
  fan_out:
    8: 4    # oracle tiers: unit, integration, functional, differential
    11: 3   # critics: idiom, spec, structure
  descriptions:
    1: "Map the source, its dependencies and the specification's drops/adds"
    2: "Measure source coverage the way the tests actually reach the code"
    3: "Characterization pass: cover the next under-covered module against the source"
    4: "Classify every test by tier and build the differential input corpus"
    5: "Decompose into units bound to tests and to the source structure they mirror"
    6: "Gate: PROCEED or CONVERGED"
    7: "Unit loop: adapt the next unit's tests, then write code to pass them"
    8: "Run one oracle tier against the rewrite"
    9: "Behaviour gate: every tier green and target coverage at the floor"
    10: "Record refinement baseline metrics and the structure map"
    11: "Critique the rewrite through one lens"
    12: "Refine: apply the critique, keep only edits the whole oracle passes"
    13: "Final review: hard gates, scorecard, CONTINUE or COMPLETE"
  dependencies:
    2: [1]
    3: [2]
    4: [3]
    5: [4]
    6: [5]
    7: [6]
    8: [7]
    9: [8]
    10: [9]
    11: [10]
    12: [11]
    13: [12]

  loops:
    # Characterization: one under-covered module per pass until the source
    # meets the floor. Skipped outright when stage 2 measured it already met.
    3:
      index: char_pass
      until: 'file("03-coverage-met.txt").exists'
      max_iterations: 6
      cost_limit_usd: 25.0
    # Behaviour rounds: rewrite, run every tier, gate. The gate reopens the
    # units its red tests point at, and the next round's unit loop takes only
    # those. Nested loops restart the inner loop on each outer round.
    7-9:
      index: behaviour_round
      until: 'file("09-behaviour-green.txt").exists'
      max_iterations: 3
      cost_limit_usd: 45.0
    7:
      index: unit_pass
      until: 'file("07-units-done.txt").exists'
      max_iterations: 8
      cost_limit_usd: 30.0
    # Refinement: a fixed number of quality passes, ending early when the
    # critics find nothing worth a pass. `count` with `until` acts as a cap.
    11-12:
      index: refine_pass
      until: 'file("12-refine-converged.txt").exists'
      count: 4
      cost_limit_usd: 30.0

  # Cathedral loop: the review's success submits the next iteration on the
  # same workspace. A COMPLETE review writes .rewrite-complete, every sheet of
  # the next iteration skips on it (a skip does not cascade, so each sheet
  # carries the test), the review is skipped, and no trigger fires.
  triggers:
    13:
      on_success:
        - concert:
            score: "codebase-rewrite.yaml"
            inherit_workspace: true
            fresh: true

  skip_when:
    1:  {command: 'test -f "{workspace}/.rewrite-complete"', description: "Chain complete", timeout_seconds: 10}
    2:  {command: 'test -f "{workspace}/.rewrite-complete"', description: "Chain complete", timeout_seconds: 10}
    3:
      command: 'test -f "{workspace}/.rewrite-complete" || grep -q "^floor_met: true" "{workspace}/02-coverage.yaml"'
      description: "Chain complete, or the source already meets the coverage floor"
      timeout_seconds: 10
    4:  {command: 'test -f "{workspace}/.rewrite-complete"', description: "Chain complete", timeout_seconds: 10}
    5:  {command: 'test -f "{workspace}/.rewrite-complete"', description: "Chain complete", timeout_seconds: 10}
    6:  {command: 'test -f "{workspace}/.rewrite-complete"', description: "Chain complete", timeout_seconds: 10}
    7:
      command: 'test -f "{workspace}/.rewrite-complete" || grep -q "status: CONVERGED" "{workspace}/06-gate-status.yaml"'
      description: "Chain complete, or no REAL candidates remain"
      timeout_seconds: 10
    8:
      command: 'test -f "{workspace}/.rewrite-complete" || grep -q "status: CONVERGED" "{workspace}/06-gate-status.yaml"'
      description: "Chain complete, or nothing was rewritten"
      timeout_seconds: 10
    9:
      command: 'test -f "{workspace}/.rewrite-complete" || grep -q "status: CONVERGED" "{workspace}/06-gate-status.yaml"'
      description: "Chain complete, or nothing was rewritten"
      timeout_seconds: 10
    # Never refine red code: refinement runs only once the behaviour gate
    # wrote its green marker.
    10:
      command: 'test -f "{workspace}/.rewrite-complete" || ! test -f "{workspace}/09-behaviour-green.txt"'
      description: "Chain complete, or behaviour is not green — nothing to refine"
      timeout_seconds: 10
    11:
      command: 'test -f "{workspace}/.rewrite-complete" || ! test -f "{workspace}/09-behaviour-green.txt"'
      description: "Chain complete, or behaviour is not green"
      timeout_seconds: 10
    12:
      command: 'test -f "{workspace}/.rewrite-complete" || ! test -f "{workspace}/09-behaviour-green.txt"'
      description: "Chain complete, or behaviour is not green"
      timeout_seconds: 10
    13:
      command: 'test -f "{workspace}/.rewrite-complete"'
      description: "Chain complete — skip the review, so its trigger never fires"
      timeout_seconds: 10

# The four oracle tiers and the three critics run side by side.
parallel:
  enabled: true
  max_concurrent: 4

cross_sheet:
  auto_capture_stdout: true
  max_output_chars: 3000
  lookback_sheets: 3

workspace_lifecycle:
  archive_on_fresh: true
  max_archives: 10
  # The COMPLETE marker and the coverage evidence must outlive the archive.
  preserve_patterns:
    - ".iteration"
    - ".marianne-*"
    - ".coverage"
    - "archive/**"
    - ".worktrees/**"
    - ".rewrite-complete"
    - "04-differential/**"

concert:
  enabled: true
  max_chain_depth: 10

retry:
  max_retries: 3
  base_delay_seconds: 15

stale_detection:
  enabled: true
  idle_timeout_seconds: 1800

# ═══════════════════════════════════════════════════════════════════════════════
# PROMPT
# ═══════════════════════════════════════════════════════════════════════════════

prompt:
  variables:
    # The checkout the rewrite edits. ABSOLUTE path, set per run with
    # `--var project_root=/abs` (chained iterations inherit it).
    project_root: "[CHANGE THIS: ABSOLUTE path to the project checkout]"
    source_language: "[CHANGE THIS: e.g., Python 3]"
    target_language: "[CHANGE THIS: e.g., Rust, Go, TypeScript]"
    source_dir: "src"
    test_dir: "tests"
    # Every command runs from project_root through `bash -c`.
    test_command: "[CHANGE THIS: unit tier, e.g. cargo test, go test ./..., pytest tests/unit]"
    integration_test_command: "[CHANGE THIS: integration tier, e.g. pytest tests/integration]"
    # Black-box tier: drives the built program the way a user or another
    # program does (CLI, stdin/stdout, wire, HTTP). Leave "" only when the
    # project has no such surface; the oracle then records the tier SKIPPED.
    functional_test_command: ""
    # Coverage contract: each command prints the TOTAL LINE COVERAGE PERCENT
    # as a bare number on its last line (e.g. `91.4`). It must follow the
    # code the way the tests reach it, on BOTH sides: a suite that runs the
    # program as a subprocess needs subprocess coverage (Python:
    # COVERAGE_PROCESS_START; Go: `go build -cover` + GOCOVERDIR, merged with
    # `go test` via `go tool covdata`; Rust: `cargo llvm-cov` with the binary
    # run under it), or the number counts only in-process unit tests and the
    # gate reopens units that are already tested.
    source_coverage_command: "[CHANGE THIS: e.g. coverage run -m pytest -q >/dev/null; coverage report --format=total]"
    target_coverage_command: "[CHANGE THIS: e.g. cargo llvm-cov --summary-only | awk '/TOTAL/{print $10+0}']"
    coverage_floor: 90
    # Differential contract: each command reads ONE input on stdin and writes
    # its result to stdout; the exit code is part of the result. The same
    # input through both must give the same stdout and exit code, unless the
    # input is listed in 04-differential/intended-differences.txt with the
    # specification rule that changes it.
    source_run_command: "[CHANGE THIS: e.g. python -m mytool]"
    target_run_command: "[CHANGE THIS: e.g. ./target/release/mytool]"
    # The branch in project_root every commit lands on (created from HEAD by
    # the first sheet that commits): characterization tests, rewritten units,
    # refinements. Never an untracked tree.
    rewrite_branch: "rewrite/codebase-rewrite"
    # The target specification. Every analysis stage reads it: a module it
    # drops is not a rewrite candidate; a capability it adds has no source
    # module. Point at a design document when one exists.
    improvement_specs: |
      - Modernize API patterns
      - Add type safety where applicable
      - Improve error handling
    oracle_tiers: ["unit", "integration", "functional", "differential"]
    critic_lenses: ["idiom and simplicity", "specification conformance", "structural fidelity to the source"]

  template: |
    {% macro write_to(filename) %}
    ## Output
    Write `{{ workspace }}/{{ filename }}`, complete and self-contained.
    {% endmacro %}
    {% macro branch_setup() %}
    Commit on `{{ rewrite_branch }}` in `{{ project_root }}` (create it from
    HEAD if it does not exist). Stage only the files you changed, never
    `git add -A`.
    ```bash
    cd {{ project_root }} && (git rev-parse --verify -q {{ rewrite_branch }} >/dev/null \
      || git checkout -q -b {{ rewrite_branch }}) && git checkout -q {{ rewrite_branch }}
    ```
    {% endmacro %}

    {% if stage == 1 %}
    # Reconnaissance

    Rewrite target: **{{ source_language }} → {{ target_language }}**.
    Source in `{{ project_root }}/{{ source_dir }}`, tests in
    `{{ project_root }}/{{ test_dir }}`. The project is edited in place; this
    workspace holds only ledgers. If `13-final-review.md` exists, this is a
    later iteration: read it first and plan only what remains.

    The specification below shapes everything: a module it drops is not a
    candidate, a capability it adds has no source module. Name both.
    {{ improvement_specs }}

    1. Inventory every source file with line counts.
    2. Map dependencies: imports, calls, inheritance. Record the module and
       public-function structure; later stages try to mirror it.
    3. Map external dependencies to {{ target_language }} equivalents.
    4. Rate complexity per module, 1 to 5.
    5. Describe how the tests reach the code: in-process import, subprocess,
       stdin/stdout, HTTP. This decides how coverage must be measured and
       which tests can drive the {{ target_language }} build unchanged.
    6. Note prior-iteration progress, if any.

    {{ write_to("01-reconnaissance.md") }}

    {% elif stage == 2 %}
    # Coverage Baseline

    Measure the SOURCE's line coverage before anything is rewritten:
    ```bash
    cd {{ project_root }} && bash -c {{ source_coverage_command | tojson }}
    ```
    The last line is the total percent. If it reads 0 or near 0 while the
    tests pass, the command is not following how the tests reach the code
    (see 01-reconnaissance.md, item 5). Fix the measurement, not the number,
    and say in the report what you changed and why.

    Then measure per module and list each module below the floor of
    {{ coverage_floor }}% with its uncovered lines.

    {{ write_to("02-coverage.yaml") }}
    ```yaml
    source_coverage_percent: 88.4      # the command's last line, verbatim
    floor: {{ coverage_floor }}
    floor_met: false                   # true when percent >= floor
    measured_with: "the exact command"
    modules:
      - path: "src/pkg/mod.py"
        percent: 61.0
        uncovered: ["mod.py:40-58", "mod.py:102"]
    ```

    {% elif stage == 3 %}
    # Characterization — pass {{ loops.char_pass }}

    The source is below the {{ coverage_floor }}% floor. Each pass covers the
    next under-covered module from `{{ workspace }}/02-coverage.yaml`
    {% if loops.char_pass > 1 %}(read `{{ workspace }}/03-characterization-log.md`
    first and continue where it stopped){% endif %}.

    Write **characterization tests against the {{ source_language }} source**:
    they pin what the code does today, including odd behaviour. They are the
    oracle the rewrite will be held to, so:
    - Prefer the boundary the rewrite will keep (CLI, stdin/stdout, public
      API, wire format) over internals: a boundary test converts to drive the
      {{ target_language }} build, an internal one is thrown away.
    - Every test must pass against the source now. A test you cannot make
      pass is a finding, not a test: record it.
    - Never change source code here.

    {{ branch_setup() }}
    Commit the tests as `test(<module>): characterize — <N> tests`.

    Re-measure with the stage-2 command. If the total is at or above the
    floor, write the marker (it ends this loop):
    ```bash
    echo "coverage met: <percent>" > {{ workspace }}/03-coverage-met.txt
    ```

    Append to `{{ workspace }}/03-characterization-log.md`:
    `## Pass {{ loops.char_pass }} — <module>`, tests added, coverage before
    → after, commit hash, behaviours that surprised you.

    {% elif stage == 4 %}
    # Oracle Inventory

    Read 01-reconnaissance.md, 02-coverage.yaml and (if present)
    03-characterization-log.md.

    1. Classify every test into **unit**, **integration** or **functional**.
       For each: how it reaches the code, and whether it can drive the
       {{ target_language }} build unchanged, needs its harness ported, or
       must be rewritten.
    2. Build the differential corpus in `{{ workspace }}/04-differential/inputs/`:
       one file per input, fed on stdin to both
       `{{ source_run_command }}` and `{{ target_run_command }}`. Cover every
       public behaviour, the error paths and the edge cases the tests use.
       When the project ships language-neutral fixtures (input + expected
       output files), copy them in.
    3. List in `{{ workspace }}/04-differential/intended-differences.txt`
       (one input filename per line, then `# <spec rule>`) every input whose
       output the specification deliberately changes. Leave it empty if none.
    4. Run each corpus input through `{{ source_run_command }}` now, and
       record that the source accepts the corpus.

    {{ write_to("04-oracle.md") }}
    Include the per-test classification table, the corpus size by category,
    and the commands each tier runs.

    {% elif stage == 5 %}
    # Decomposition — units bound to tests and to structure

    Read 01-reconnaissance.md and 04-oracle.md.
    {{ improvement_specs }}

    Split the work into **units**: the smallest piece that can be rewritten
    and proven alone. Order dependency leaves first; within a level, the
    best-tested unit first.

    For each unit:
    - **Scope:** source files and functions.
    - **Interface:** what callers see. The rewrite keeps it, so its tests bind.
    - **Mirrors:** the source module and functions this unit corresponds to,
      and the {{ target_language }} module/function names that keep that
      correspondence. Mirroring the source structure is rewarded in the final
      review; deviate when the specification or a {{ target_language }} idiom
      requires it, and say which.
    - **Tests:** the tests that prove it, by tier, and how each is adapted.
    - **Acceptance command:** the narrowed command that proves this unit.

    {{ write_to("05-rewrite-plan.md") }}
    Begin with a table: unit, scope, mirrors, tests, acceptance command,
    status PENDING.

    {% elif stage == 6 %}
    # Gate

    Read 05-rewrite-plan.md. Write `{{ workspace }}/06-gate-status.yaml`:
    ```yaml
    status: PROCEED        # CONVERGED when no unit needs work
    units_total: 8
    units_pending: 8
    gate_reason: "8 units planned"
    ```
    `units_pending` counts the plan's rows whose status is not DONE.

    {% elif stage == 7 %}
    # Unit Loop — round {{ loops.behaviour_round }}, pass {{ loops.unit_pass }}

    Take the NEXT unit in `{{ workspace }}/05-rewrite-plan.md` whose status is
    PENDING (a later round only has the units the behaviour gate reopened;
    each names the red test that reopened it).
    {% if loops.unit_pass > 1 or loops.behaviour_round > 1 %}
    Read `{{ workspace }}/07-migration-log.md` and never redo a DONE unit.
    {% endif %}

    Clear the loop marker first (it proves THIS pass finished the plan):
    ```bash
    rm -f {{ workspace }}/07-units-done.txt
    ```

    **1. Tests first (red).** Adapt the unit's tests so they drive the
    {{ target_language }} code. Run the acceptance command: it must fail for
    the missing implementation, not for a harness error.

    **2. Code to pass them (green).** Write the unit in {{ target_language }},
    keeping its interface and the structure named under **Mirrors** where the
    specification allows. Apply the specification. Do not widen scope.

    **3. Prove and record.** Run the acceptance command once more and keep its
    tail. Set the unit's status to DONE, or PARTIAL / BLOCKED with the failing
    test and its message.

    **4. Commit a DONE unit.**
    {{ branch_setup() }}
    Message: `rewrite(<unit>): <name> — {{ target_language }}, <N> tests green`.

    **5. Marker, only when every row reads DONE:**
    ```bash
    date -u +"units done %FT%TZ" > {{ workspace }}/07-units-done.txt
    ```

    Append to `{{ workspace }}/07-migration-log.md`:
    `## Round {{ loops.behaviour_round }} pass {{ loops.unit_pass }} — <unit>`,
    with `### Red run`, `### Green run` (command tails), the commit, and
    `### Status: DONE | PARTIAL | BLOCKED (<blocker>)`.

    {% elif stage == 8 %}
    {% set tier = oracle_tiers[instance - 1] %}
    # Oracle — {{ tier }} tier (round {{ loops.behaviour_round }})

    Run ONE tier against the rewrite, from `{{ project_root }}`, and report
    exactly what it says. Do not fix anything; the gate decides.

    {% if tier == "unit" %}
    ```bash
    cd {{ project_root }} && bash -c {{ test_command | tojson }}
    ```
    {% elif tier == "integration" %}
    ```bash
    cd {{ project_root }} && bash -c {{ integration_test_command | tojson }}
    ```
    {% elif tier == "functional" %}
    {% if functional_test_command %}
    ```bash
    cd {{ project_root }} && bash -c {{ functional_test_command | tojson }}
    ```
    {% else %}
    No functional command is configured. Write **Results:** SKIPPED and say
    which black-box surface the project would need tested.
    {% endif %}
    {% else %}
    Feed every file in `{{ workspace }}/04-differential/inputs/` on stdin to
    both commands and compare stdout and exit code:
    ```bash
    cd {{ project_root }}
    for f in {{ workspace }}/04-differential/inputs/*; do
      a=$(bash -c {{ source_run_command | tojson }} < "$f" 2>/dev/null; echo "exit=$?")
      b=$(bash -c {{ target_run_command | tojson }} < "$f" 2>/dev/null; echo "exit=$?")
      [ "$a" = "$b" ] || echo "DIFF $(basename "$f")"
    done
    ```
    A DIFF is a failure unless that input is listed in
    `04-differential/intended-differences.txt`.
    {% endif %}

    Write `{{ workspace }}/08-oracle-{{ instance }}.md`:
    - `**Tier:** {{ tier }}`
    - `**Results:** PASS`, `FAIL` or `SKIPPED`
    - counts (run, passed, failed, skipped; or inputs, agreed, differed)
    - every failure with the test or input, the message, and the unit in
      05-rewrite-plan.md it implicates

    {% elif stage == 9 %}
    # Behaviour Gate — round {{ loops.behaviour_round }}

    Read the four `{{ workspace }}/08-oracle-*.md` reports and measure the
    rewrite's coverage:
    ```bash
    cd {{ project_root }} && bash -c {{ target_coverage_command | tojson }}
    ```

    **Green** means: every tier PASS (functional may be SKIPPED only when no
    functional command is configured), and target coverage ≥
    {{ coverage_floor }}%. Then write the marker (it ends the behaviour loop):
    ```bash
    echo "behaviour green: round {{ loops.behaviour_round }}, coverage <percent>" > {{ workspace }}/09-behaviour-green.txt
    ```

    **Not green:** for each failure, find the unit it implicates and set that
    unit back to PENDING in 05-rewrite-plan.md with the failing test or input
    named. A unit already reopened in an earlier round becomes BLOCKED with
    that evidence instead, so no round spins on it. Coverage below the floor
    reopens the units whose code is uncovered, with "write tests for <lines>".

    {{ write_to("09-behaviour-gate.md") }}
    Include `**Verdict:** GREEN` or `**Verdict:** RED`, the per-tier table,
    target coverage, and the units reopened or blocked.

    {% elif stage == 10 %}
    # Refinement Baseline

    Behaviour is green. Before any refinement, record where the code stands:
    the HEAD commit of `{{ rewrite_branch }}`, the {{ target_language }}
    linter's findings, code size per module, and the structure map (each
    {{ target_language }} module and public function, with the source module
    and function it mirrors, or "none").

    {{ write_to("10-refine-baseline.md") }}
    Start the file with `baseline_commit: <full sha>` on its own line.

    {% elif stage == 11 %}
    {% set lens = critic_lenses[instance - 1] %}
    # Critique — {{ lens }} (refine pass {{ loops.refine_pass }})

    Read 10-refine-baseline.md{% if loops.refine_pass > 1 %} and
    12-refine-log.md (what earlier passes kept and reverted; do not re-raise a
    reverted finding){% endif %}. Review the {{ target_language }} code in
    `{{ project_root }}` through ONE lens: **{{ lens }}**.

    {% if instance == 1 %}
    Idiomatic {{ target_language }}, simpler control flow, dead code, needless
    allocation or copying, error handling that hides causes. Lint findings
    count.
    {% elif instance == 2 %}
    Check every rule of the specification, met or not, with evidence:
    {{ improvement_specs }}
    {% else %}
    Compare the {{ target_language }} structure with the source's: module
    boundaries, function boundaries, call graph. Score correspondence 0-100
    (100 = one-to-one). Propose only moves that cost no idiom and no
    behaviour: a renamed function, a split or merged module that restores
    correspondence. Never propose re-creating a structure the specification
    removed.
    {% endif %}

    Every finding names a file and line in `{{ project_root }}` as
    `path:line`, the concrete edit, and why it is better. If nothing is worth
    changing, write `NO FINDINGS` and why.

    Write `{{ workspace }}/11-critique-{{ instance }}.md` starting with
    `**Lens:** {{ lens }}`.

    {% elif stage == 12 %}
    # Refine — pass {{ loops.refine_pass }}

    Read the three `{{ workspace }}/11-critique-*.md` files. Merge them and
    drop any finding that contradicts a test or the specification. Order the
    rest: correctness and spec first, then idiom, then structural fidelity.

    {{ branch_setup() }}
    Apply ONE finding per commit (`refine(pass {{ loops.refine_pass }}): <what>`).
    After each commit run the whole oracle:
    ```bash
    cd {{ project_root }} && bash -c {{ test_command | tojson }} && bash -c {{ integration_test_command | tojson }}
    ```
    plus the functional command if configured, and the stage-8 differential
    loop. Anything red: `git revert --no-edit HEAD` and record why. Every
    commit you leave on the branch is green on every tier.

    If all three critics wrote NO FINDINGS, or every finding was dropped or
    reverted, write the marker (it ends the refinement loop):
    ```bash
    echo "refinement converged at pass {{ loops.refine_pass }}" > {{ workspace }}/12-refine-converged.txt
    ```

    Append to `{{ workspace }}/12-refine-log.md`:
    `## Pass {{ loops.refine_pass }}`, with a table of finding, lens,
    `Kept <sha>` / `Reverted (<failing tier>)` / `Dropped (<reason>)`.

    {% elif stage == 13 %}
    # Final Review

    Read every ledger in `{{ workspace }}`.

    **Hard gates** (any one failing means CONTINUE):
    - `09-behaviour-green.txt` exists, or 06-gate-status.yaml says CONVERGED
    - target coverage ≥ {{ coverage_floor }}%
    - every specification rule met (11-critique-2.md)
    - no unit PENDING or PARTIAL; BLOCKED only when the host cannot supply
      what it needs (a privilege, a device, a credential) — list each under
      **Blocked remainder**

    **Scorecard** (reported every iteration; weights sum to 100):

    | Dimension | Weight | Evidence |
    |---|---|---|
    | Behavioural equivalence | 40 | differential agreement, all tiers |
    | Specification conformance | 20 | the spec critic's table |
    | Idiom and simplicity | 20 | the idiom critic, lint before/after |
    | Structural fidelity | 20 | the structure critic's 0-100 score |

    Structural fidelity is a reward: losing it to follow the specification or
    a {{ target_language }} idiom costs those points and nothing else.

    {{ write_to("13-final-review.md") }}
    Include the gate table, the scorecard with the total, what the refinement
    passes kept, and the decision **CONTINUE** or **COMPLETE** on its own line.

    If and only if the decision is COMPLETE:
    `touch "{{ workspace }}/.rewrite-complete"` (it ends the chain).
    {% endif %}

# ═══════════════════════════════════════════════════════════════════════════════
# VALIDATIONS — the report is the musician's account; the commands are the oracle
#
# `condition` keys on `stage` (fan-out shifts sheet numbers). Validation
# commands receive each {variable} as ONE shell-quoted word, which is what
# `bash -c` takes.
# ═══════════════════════════════════════════════════════════════════════════════

validations:
  # ── 1 Reconnaissance ───────────────────────────────────────────────────
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/01-reconnaissance.md") -ge 250'
    condition: "stage == 1"
    description: "Reconnaissance is substantive (250+ words)"

  # ── 2 Coverage baseline: the recorded percent is what the command prints ──
  - type: command_succeeds
    command: |
      python3 - "{workspace}/02-coverage.yaml" {coverage_floor} <<'PY'
      import sys, yaml
      d = yaml.safe_load(open(sys.argv[1]))
      pct, floor = float(d["source_coverage_percent"]), float(sys.argv[2])
      assert d["floor_met"] is (pct >= floor), "floor_met disagrees with the percent"
      assert isinstance(d.get("modules"), list), "per-module list missing"
      PY
    condition: "stage == 2"
    stage: 1
    timeout_seconds: 30
    description: "Coverage record is well formed and floor_met agrees with the percent"
  - type: command_succeeds
    command: |
      cd {project_root} && got=$(bash -c {source_coverage_command} 2>/dev/null | tail -1 | tr -dc '0-9.') \
      && python3 -c "import sys,yaml; r=float(yaml.safe_load(open(sys.argv[1]))['source_coverage_percent']); g=float(sys.argv[2]); sys.exit(abs(r-g) > 1.0)" "{workspace}/02-coverage.yaml" "$got"
    condition: "stage == 2"
    stage: 2
    timeout_seconds: 1800
    description: "Recorded source coverage matches the coverage command within 1 point"

  # ── 3 Characterization: tests pass against the SOURCE; marker is honest ──
  - type: command_succeeds
    command: 'cd {project_root} && git log --oneline {rewrite_branch} 2>/dev/null | grep -qE "^[0-9a-f]+ test\("'
    condition: "stage == 3"
    stage: 1
    description: "Characterization tests are committed as test(<module>) on the rewrite branch"
  - type: command_succeeds
    command: |
      if test -f "{workspace}/03-coverage-met.txt"; then
        cd {project_root} && got=$(bash -c {source_coverage_command} 2>/dev/null | tail -1 | tr -dc '0-9.') \
        && python3 -c "import sys; sys.exit(float(sys.argv[1]) < float(sys.argv[2]))" "$got" {coverage_floor}
      fi
    condition: "stage == 3"
    stage: 2
    timeout_seconds: 1800
    description: "The coverage-met marker is written only when the source really meets the floor"

  # ── 4 Oracle inventory: a corpus exists and the source accepts it ───────
  - type: command_succeeds
    command: 'test -n "$(ls -A "{workspace}/04-differential/inputs" 2>/dev/null)" && test -f "{workspace}/04-differential/intended-differences.txt"'
    condition: "stage == 4"
    stage: 1
    description: "Differential corpus and intended-differences list exist"
  - type: content_regex
    path: "{workspace}/04-oracle.md"
    pattern: "(?i)\\bunit\\b[\\s\\S]*\\bintegration\\b[\\s\\S]*\\bfunctional\\b"
    condition: "stage == 4"
    stage: 2
    description: "Every test tier is classified"

  # ── 5 Decomposition ─────────────────────────────────────────────────────
  - type: command_succeeds
    command: |
      python3 - "{workspace}/05-rewrite-plan.md" <<'PY'
      import re, sys
      t = open(sys.argv[1]).read()
      for need in ("acceptance command", "mirrors", "interface"):
          assert re.search(need, t, re.I), f"plan never names {need!r}"
      assert re.search(r"\|\s*PENDING\s*\|", t), "no PENDING unit rows"
      PY
    condition: "stage == 5"
    timeout_seconds: 30
    description: "Every unit names its interface, mirror and acceptance command"

  # ── 6 Gate: the count agrees with the plan ──────────────────────────────
  - type: command_succeeds
    command: |
      python3 - "{workspace}/06-gate-status.yaml" "{workspace}/05-rewrite-plan.md" <<'PY'
      import re, sys, yaml
      g = yaml.safe_load(open(sys.argv[1]))
      rows = re.findall(r"^\|.*\|\s*(PENDING|PARTIAL|BLOCKED|DONE)\s*\|\s*$", open(sys.argv[2]).read(), re.M)
      pending = sum(1 for r in rows if r != "DONE")
      assert g["status"] in ("PROCEED", "CONVERGED")
      assert g["units_pending"] == pending, f"gate says {g['units_pending']}, plan has {pending}"
      assert (g["status"] == "CONVERGED") == (pending == 0), "status disagrees with the pending count"
      PY
    condition: "stage == 6"
    timeout_seconds: 30
    description: "Gate decision agrees with the plan's pending units"

  # ── 7 Unit loop ─────────────────────────────────────────────────────────
  - type: content_regex
    path: "{workspace}/07-migration-log.md"
    pattern: "### Red run[\\s\\S]*### Status: (DONE|PARTIAL|BLOCKED)"
    condition: "stage == 7"
    stage: 1
    description: "Each pass ran its tests red before writing code and recorded a status"
  - type: command_succeeds
    command: 'if grep -qE "### Status: DONE" "{workspace}/07-migration-log.md"; then cd {project_root} && git log --oneline {rewrite_branch} 2>/dev/null | grep -qE "^[0-9a-f]+ rewrite\("; fi'
    condition: "stage == 7"
    stage: 2
    description: "A DONE unit is a rewrite(<unit>) commit on the rewrite branch"

  # ── 8 Oracle: each voice's verdict matches its tier's real exit ─────────
  - type: command_succeeds
    command: 'if grep -qE "\*\*Results:\*\*\s*PASS" "{workspace}/08-oracle-1.md"; then cd {project_root} && bash -c {test_command}; else cd {project_root} && ! bash -c {test_command}; fi'
    condition: "stage == 8 and instance == 1"
    timeout_seconds: 1800
    description: "Unit verdict matches the unit command's exit"
  - type: command_succeeds
    command: 'if grep -qE "\*\*Results:\*\*\s*PASS" "{workspace}/08-oracle-2.md"; then cd {project_root} && bash -c {integration_test_command}; else cd {project_root} && ! bash -c {integration_test_command}; fi'
    condition: "stage == 8 and instance == 2"
    timeout_seconds: 1800
    description: "Integration verdict matches the integration command's exit"
  - type: command_succeeds
    command: |
      f="{workspace}/08-oracle-3.md"
      if [ -z {functional_test_command} ]; then grep -qE "\*\*Results:\*\*\s*SKIPPED" "$f"
      elif grep -qE "\*\*Results:\*\*\s*PASS" "$f"; then cd {project_root} && bash -c {functional_test_command}
      else cd {project_root} && ! bash -c {functional_test_command}; fi
    condition: "stage == 8 and instance == 3"
    timeout_seconds: 1800
    description: "Functional verdict matches the functional command (SKIPPED only when none is set)"
  - type: command_succeeds
    command: |
      cd {project_root}; diffs=0
      for f in "{workspace}"/04-differential/inputs/*; do
        n=$(basename "$f"); grep -qxF "$n" "{workspace}/04-differential/intended-differences.txt" 2>/dev/null && continue
        a=$(bash -c {source_run_command} < "$f" 2>/dev/null; echo "exit=$?")
        b=$(bash -c {target_run_command} < "$f" 2>/dev/null; echo "exit=$?")
        [ "$a" = "$b" ] || diffs=$((diffs+1))
      done
      if grep -qE "\*\*Results:\*\*\s*PASS" "{workspace}/08-oracle-4.md"; then [ "$diffs" -eq 0 ]; else [ "$diffs" -gt 0 ]; fi
    condition: "stage == 8 and instance == 4"
    timeout_seconds: 1800
    description: "Differential verdict matches a real source/target comparison of the corpus"

  # ── 9 Behaviour gate: GREEN only when it is ─────────────────────────────
  - type: command_succeeds
    command: |
      if grep -qE "\*\*Verdict:\*\*\s*GREEN" "{workspace}/09-behaviour-gate.md"; then
        test -f "{workspace}/09-behaviour-green.txt" \
        && for i in 1 2 4; do grep -qE "\*\*Results:\*\*\s*PASS" "{workspace}/08-oracle-$i.md" || exit 1; done \
        && grep -qE "\*\*Results:\*\*\s*(PASS|SKIPPED)" "{workspace}/08-oracle-3.md" \
        && cd {project_root} && got=$(bash -c {target_coverage_command} 2>/dev/null | tail -1 | tr -dc '0-9.') \
        && python3 -c "import sys; sys.exit(float(sys.argv[1]) < float(sys.argv[2]))" "$got" {coverage_floor}
      else
        ! test -f "{workspace}/09-behaviour-green.txt"
      fi
    condition: "stage == 9"
    timeout_seconds: 1800
    description: "GREEN means every tier passed and target coverage meets the floor; RED leaves no marker"

  # ── 10 Refinement baseline ──────────────────────────────────────────────
  - type: command_succeeds
    command: 'sha=$(sed -n "s/^baseline_commit: *\([0-9a-f]\{40\}\).*/\1/p" "{workspace}/10-refine-baseline.md" | head -1) && test -n "$sha" && cd {project_root} && test "$(git cat-file -t "$sha")" = commit'
    condition: "stage == 10"
    description: "Baseline names a real commit"

  # ── 11 Critique: findings point at real code ────────────────────────────
  - type: command_succeeds
    command: |
      f="{workspace}/11-critique-{instance}.md"
      grep -q "NO FINDINGS" "$f" && exit 0
      python3 - "$f" {project_root} <<'PY'
      import os, re, sys
      refs = re.findall(r"`?([\w./-]+\.\w+):(\d+)", open(sys.argv[1]).read())
      assert refs, "findings name no path:line"
      root = sys.argv[2]
      for path, line in refs:
          p = path if os.path.isabs(path) else os.path.join(root, path)
          assert os.path.isfile(p), f"{path} does not exist"
          assert int(line) <= sum(1 for _ in open(p, errors="replace")), f"{path}:{line} is past the end"
      PY
    condition: "stage == 11"
    timeout_seconds: 60
    description: "Every finding names a path:line that exists (or the critic wrote NO FINDINGS)"

  # ── 12 Refine: every kept commit is green ───────────────────────────────
  - type: content_regex
    path: "{workspace}/12-refine-log.md"
    pattern: "## Pass \\d+"
    condition: "stage == 12"
    stage: 1
    description: "The pass is logged"
  - type: command_succeeds
    command: 'cd {project_root} && git checkout -q {rewrite_branch} && bash -c {test_command} && bash -c {integration_test_command}'
    condition: "stage == 12"
    stage: 2
    timeout_seconds: 1800
    description: "The rewrite branch is green on unit and integration after refinement"

  # ── 13 Final review: COMPLETE only when the hard gates hold ─────────────
  - type: command_succeeds
    command: |
      f="{workspace}/13-final-review.md"
      grep -qE "^\s*\**(CONTINUE|COMPLETE)\**\s*$" "$f" || exit 1
      if grep -qE "^\s*\**COMPLETE\**\s*$" "$f"; then
        test -f "{workspace}/.rewrite-complete" \
        && { test -f "{workspace}/09-behaviour-green.txt" || grep -q "status: CONVERGED" "{workspace}/06-gate-status.yaml"; }
      else
        ! test -f "{workspace}/.rewrite-complete"
      fi
    condition: "stage == 13"
    timeout_seconds: 30
    description: "COMPLETE requires green behaviour (or convergence) and writes the marker; CONTINUE does not"
