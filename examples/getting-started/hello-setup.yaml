# hello-setup.yaml — the discovery prescore (run THIS first).
#
# This pure `cli` prescore creates a class map only when absent, checks that
# workhorse has a runnable entry, then chains to hello.
#
#   1. Configure → classes write --if-absent probes available shipped routes.
#   2. Prepare   → resolve-hello.py copies the class-based score into the
#      workspace with absolute asset paths.
#   3. Chain     →  on success, Marianne runs that resolved orchestration. The
#      hello story (prose → vignettes → a Strudel soundtrack → a website) is
#      composed through the frozen workhorse fallback chain.
#
# So the chain is: discover → edit a score → run it → present the result. That
# is Marianne introspecting and rewriting its own work to fit the machine — a
# small taste of what scores can do.
#
# Run it:
#   mzt start
#   mzt run examples/getting-started/hello-setup.yaml
#   # (it opens workspaces/hello/the-sky-library.html for you when it finishes)

name: hello-setup
description: "Setup prescore — configure capability classes, prepare hello, and chain to it."

workspace: ../../workspaces/hello

instrument: cli                       # deterministic shell — no AI, no hangs

concert:
  enabled: true                       # allow chaining to the resolved score

sheet:
  size: 1
  total_items: 1

prompt:
  # raw_prompt (cli): configure only when absent, verify workhorse, then copy.
  template: >-
    mzt instruments classes write --if-absent &&
    mzt instruments classes check --class workhorse &&
    python3 "{{ workspace }}/../../examples/getting-started/assets/resolve-hello.py"
    "{{ workspace }}"
    "{{ workspace }}/../../examples/getting-started/hello.yaml"

validations:
  - type: file_exists
    path: "{workspace}/hello-resolved.yaml"
    description: "A class-based orchestration was written"
  - type: command_succeeds
    command: "mzt validate {workspace}/hello-resolved.yaml"
    description: "Resolved hello score validates before chaining"

on_success:
  - type: run_job
    job_path: "{workspace}/hello-resolved.yaml"
    description: "Run the hello orchestration on the discovered instrument"
