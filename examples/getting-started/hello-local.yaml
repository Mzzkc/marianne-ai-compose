# hello-local.yaml — Your First Marianne Score (PURE-LOCAL, fully offline)
#
# The local-only twin of hello.yaml. Identical orchestration — parallel agents
# write a story, a deterministic tool builds a website, an agent polishes it —
# but it runs ENTIRELY on a local Ollama model (no OpenRouter, no cloud, no
# account). Use this when you want zero network calls; use hello.yaml if you'd
# like it to try fast free OpenRouter models first and fall back to local.
#
#   Movement 1 · The World     one agent writes the shared setting (prose)
#         │  ▼ fan-out (parallel)
#   Movement 2 · Vignettes     three agents each write one character at once
#         │  ▼
#   Movement 3 · Assembly      a DETERMINISTIC tool folds them into one valid
#         │                    HTML page — you always get a real website
#         │  ▼
#   Movement 4 · Polish        an agent tailors that page to the story told
#
# Mediums crossed: prose → parallel prose → a styled, openable web page.
# Pattern: Fan-out + Synthesis + a Tool-Chain seam.
#
# Prerequisites (one-time):
#   pip install -e ".[daemon]"           # Marianne + conductor
#   # a local model served by Ollama, reachable by the opencode-gemma instrument:
#   ollama pull gemma4:26b               # (or adjust the instrument's model)
#
# Usage:
#   mzt start                                          # start the conductor
#   mzt run examples/getting-started/hello-local.yaml  # run the score
#   mzt status hello-local --watch                     # watch the orchestration
#   open workspaces/hello-local/the-sky-library.html   # read the result
#
# Output (workspaces/hello-local/):
#   01-world.md  02-character-1..3.md  site-base.html  the-sky-library.html
#
# Time: ~5-15 min (local inference)  |  Cost: $0 (fully local)  |  Sheets: 6

name: hello-local
description: "Pure-local first score — the same orchestration as hello.yaml, run entirely on a local Ollama model (no cloud, no account)."

workspace: ../../workspaces/hello-local

# Fully local — opencode drives a local Ollama model via its OpenAI-compatible
# endpoint. No OpenRouter, no fallback chain, no network. Swap the model in
# the opencode-gemma profile (~/.marianne/instruments/opencode-gemma.yaml) for
# any Ollama tag you have pulled.
instrument: opencode-gemma

movements:
  1:
    name: "The World"
  2:
    name: "Three Vignettes"
  3:
    name: "Soundtrack"               # compose loopable music for the story
  4:
    name: "The Page"
    instrument: cli                  # deterministic — builds the FINAL page, no AI

sheet:
  size: 1
  total_items: 4
  fan_out:
    2: 3                             # Movement 2 → three parallel characters
  dependencies:
    2: [1]
    3: [1]                           # soundtrack reads the world's mood (parallel with vignettes)
    4: [2, 3]                        # the page waits for the vignettes AND the soundtrack
  cadenzas:
    5:                               # corpus → the soundtrack sheet only (sheet 5 = movement 3)
      - file: "{{ workspace }}/../../examples/getting-started/assets/strudel-patterns.md"
        as: skill

parallel:
  enabled: true
  max_concurrent: 1                  # single local GPU — serialize the voices

cross_sheet:
  auto_capture_stdout: true
  max_output_chars: 2000
  lookback_sheets: 5

retry:
  max_retries: 1

prompt:
  variables:
    setting: "a floating garden-city above the clouds, fifty years from now"
    characters:
      1:
        name: "Lira"
        role: "a wind-mapper who reads the sky like sheet music"
        secret: "she has been quietly repairing the oldest bridge — the one everyone says to tear down"
      2:
        name: "Fen"
        role: "a soil-singer who tends the deep gardens whose roots hold the city aloft"
        secret: "he is growing something in the lowest garden that should not survive at this altitude"
      3:
        name: "Cael"
        role: "a memory-keeper who maintains the archive of weather and old songs"
        secret: "she found that the city's founding song hides coordinates to something below the clouds"

  template: |
    {% if stage == 1 %}
    You are a fiction writer. Write the shared SETTING for a short story
    collection set in {{ setting }}.

    Write 250-400 words of vivid, sensory prose. Make the reader feel the
    place — the light, the air, a small everyday detail or two. End with one
    sentence hinting that something is quietly changing.

    Use simple markdown: a `#` title and short paragraphs. Write ONLY the
    setting. Save it to {{ workspace }}/01-world.md and stop.

    {% elif stage == 2 %}
    {% set char = characters[instance] %}
    You are a fiction writer. First read the shared world at
    {{ workspace }}/01-world.md and match its tone.

    Write a 200-350 word vignette for ONE character:
    - Name: {{ char.name }}
    - Role: {{ char.role }}
    - Quiet secret: {{ char.secret }}

    Show one small moment of their morning in this city, let the secret
    surface gently (don't explain it), and end on a beat that makes the
    reader want more. Use a `#` title with the character's name and short
    paragraphs. Write ONLY this vignette. Save it to
    {{ workspace }}/02-character-{{ instance }}.md and stop.

    {% elif stage == 3 %}
    You are a Strudel composer (Strudel is live-coding music — strudel.cc).
    First read the shared world at {{ workspace }}/01-world.md and feel its mood.

    Write ONE short, LOOPABLE, ambient background soundtrack. Keep it SIMPLE and
    SAFE so it actually plays — use ONLY these building blocks:
    - setcps(0.4)                              (a slow tempo, on the first line)
    - note("c3 eb3 g3").sound("sine")          (or "triangle"/"sawtooth"/"square")
    - s("hh*4")  or  s("bd ~ ~ ~")             (built-in samples: bd sd hh cp oh)
    - .gain(0.3)   .lpf(800)   .room(0.4)   .slow(4)   .delay(0.3)
    - stack(layerA, layerB, layerC)            (layer 2-3 of the above)
    Rules: keep every .gain low (0.2-0.4); do NOT invent sample names; do NOT use
    .ar / .adsr / arrange / silence; no markdown fences, no prose. Output ONLY the
    Strudel code, starting with setcps(...). Save it to
    {{ workspace }}/soundtrack.strudel and stop.

    {% elif stage == 4 %}
    python3 "{{ workspace }}/../../examples/getting-started/assets/assemble-site.py" "{{ workspace }}"
    {% endif %}

validations:
  - type: file_exists
    path: "{workspace}/01-world.md"
    condition: "stage == 1"
    description: "World setting exists"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/01-world.md") -ge 120'
    condition: "stage == 1"
    description: "World has substantive prose (120+ words)"

  - type: file_exists
    path: "{workspace}/02-character-{instance}.md"
    condition: "stage == 2"
    description: "Character vignette exists"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/02-character-{instance}.md") -ge 80'
    condition: "stage == 2"
    description: "Vignette has substantive prose (80+ words)"

  - type: file_exists
    path: "{workspace}/soundtrack.strudel"
    condition: "stage == 3"
    description: "The Strudel soundtrack exists"
  - type: command_succeeds
    command: 'grep -q "setcps" "{workspace}/soundtrack.strudel"'
    condition: "stage == 3"
    description: "Soundtrack has a tempo (setcps) — a runnable pattern"
  - type: command_succeeds
    command: 'python3 "{workspace}/../../examples/getting-started/assets/check-strudel-errors.py" "{workspace}/soundtrack.strudel"'
    condition: "stage == 3"
    description: "Soundtrack uses only valid sounds (the static reality check)"

  - type: file_exists
    path: "{workspace}/the-sky-library.html"
    condition: "stage == 4"
    description: "Final website built"
  - type: content_contains
    path: "{workspace}/the-sky-library.html"
    pattern: "<!DOCTYPE html>"
    condition: "stage == 4"
    description: "Final website is valid HTML5"
  - type: content_contains
    path: "{workspace}/the-sky-library.html"
    pattern: "strudel-editor"
    condition: "stage == 4"
    description: "The soundtrack player is embedded"
