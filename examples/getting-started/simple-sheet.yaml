# Example: Simple Sheet Job
# `workhorse` chooses an available general model; set classes.yaml to prefer yours.
# A minimal Mzt configuration demonstrating core Marianne features
#
# What this demonstrates:
#   - Basic sheet configuration with parallel execution
#   - Fan-out pattern: work divided across multiple sheets (2 sheets processing 10 items)
#   - Built-in template variables (sheet_num, total_sheets, workspace, start_item, end_item)
#   - Validation requirements and retry configuration
#   - A workhorse class chain for resilient instrument selection
#
# What it produces:
#   - Two markdown files (sheet1.md, sheet2.md) in the workspace
#   - Each file contains a summary of the work done for that sheet's item range
#
# How to adapt:
#   - Change total_items and size to control parallelization
#   - Modify the template to perform your actual work
#   - Add validations specific to your output format
#   - Point workspace to your desired output directory
#
# Estimated cost depends on the configured workhorse profile.
# Estimated time: 2-5 minutes
#
# Usage:
#   mzt run examples/getting-started/simple-sheet.yaml
#   mzt status simple-sheet
#   mzt resume simple-sheet

name: "simple-sheet"
description: "Minimal example showing core Marianne features"

workspace: "../../workspaces/simple-workspace"

# Instrument: a general capability resolved through the user's class chain.
# See `mzt instruments classes show` for the effective order.
instrument: workhorse

instrument_config:
  timeout_seconds: 600       # 10 minutes per sheet

  # A fixed model belongs in a score alias, not on a capability class.

sheet:
  size: 5          # Items per sheet
  total_items: 10  # Total items = 2 sheets

prompt:
  variables:
    # [CHANGE THIS] The work. Ten items, split across two sheets by
    # `sheet.size` above; each sheet gets its range by index.
    items:
      1: "the number 7"
      2: "the word 'palimpsest'"
      3: "the year 1969"
      4: "the color cyan"
      5: "the chemical symbol Fe"
      6: "the note A440"
      7: "the fraction 22/7"
      8: "the letter Q"
      9: "the planet Neptune"
      10: "the unit 'furlong'"
  template: |
    Process sheet {{ sheet_num }} of {{ total_sheets }}: items {{ start_item }} to {{ end_item }}.

    For each item below, write two or three sentences on what it is and one
    fact about it a reader would not guess:
    {% for i in range(start_item, end_item + 1) %}
    - Item {{ i }}: {{ items[i] }}
    {% endfor %}

    Create a file at {{ workspace }}/sheet{{ sheet_num }}.md with a top-level
    heading, then one section per item in the order above, then a closing
    section "Observations" on any pattern across this sheet's items.


retry:
  max_retries: 2
  base_delay_seconds: 10

validations:
  - type: file_exists
    path: "{workspace}/sheet{sheet_num}.md"
    description: "Sheet output file must exist"

  - type: content_regex
    path: "{workspace}/sheet{sheet_num}.md"
    pattern: "^#\\s+"
    description: "Output has markdown heading structure"

  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/sheet{sheet_num}.md") -ge 50'
    description: "Output has substantive content (50+ words)"
