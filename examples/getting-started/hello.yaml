# hello.yaml — Your First Marianne Score (free, local-capable, orchestrated)
#
# Marianne is an ORCHESTRATOR, not a prompt wrapper. This score proves it:
# it coordinates several AI agents across stages AND mediums to build one
# artifact no single prompt could — a self-contained website telling a short
# story, written by agents working in parallel and woven together.
#
#   Movement 1 · The World     one agent writes the shared setting (prose)
#         │
#         ▼   fan-out (parallel)
#   Movement 2 · Vignettes     three agents each write one character — in
#         │                    parallel, each reading the world but not
#         │                    each other (stigmergic coordination)
#         ▼
#   Movement 3 · Assembly      a DETERMINISTIC tool (no AI) folds the prose
#         │                    into one valid HTML page — the reliability
#         │                    floor: you always get a real website
#         ▼
#   Movement 4 · Polish        an agent reads that page + the story and
#                              tailors the design to what was actually told
#
# Mediums crossed: prose → parallel prose → a styled, openable web page.
# Pattern: Fan-out + Synthesis, plus a Tool-Chain seam (AI for content,
# a deterministic tool at the join) — the hybrid that makes a first run
# reliable even on a small local model.
#
# FREE BY DESIGN — the instrument is a deep fallback chain:
#   crush + free OpenRouter models  →  local Ollama (gemma4 via opencode)
# Whatever you have — an OpenRouter key, or just a local model — it runs.
# No paid API is required.
#
# Usage:
#   mzt start                                    # start the conductor
#   mzt run examples/getting-started/hello.yaml  # run the score
#   mzt status hello --watch                     # watch the orchestration
#   open workspaces/hello/the-sky-library.html   # read the result
#
# Output (workspaces/hello/):
#   01-world.md            the setting
#   02-character-1..3.md   three parallel vignettes
#   site-base.html         deterministic site (the guaranteed result)
#   the-sky-library.html   AI-polished site (open this one)
#
# Time: ~5-15 min (varies with model/fallback)  |  Cost: free  |  Sheets: 6

name: hello
description: "Orchestration across mediums — parallel agents write a story; tools and an agent build it into a website. Free, local-capable."

workspace: ../../workspaces/hello

# ── Instrument: a DEEP fallback chain — runs for anyone, with anything ────
# Targeting UNKNOWN systems: we don't know what you've installed or configured,
# so the chain spans every tier across several harnesses. Marianne skips any
# instrument that isn't installed (its binary isn't on PATH) and advances when
# one is unavailable / rate-limited / exhausted. You need ONLY ONE of these set
# up — the chain finds it. Free and local come first; paid is the last resort.
#
#   FREE cloud   crush / opencode / goose  +  free OpenRouter models
#   FREE local   opencode & a direct HTTP profile  →  local Ollama (no account)
#   PAID subs    Z.AI Coding Plan (opencode/glm) → Google (gemini-cli)
#                → Anthropic Max (claude-code)
#   PAID API     anthropic_api — the very last resort
#
# A new user with NOTHING set up: install Ollama and `ollama pull gemma2` (free,
# local, no account), OR set OPENROUTER_API_KEY (free). See the quickstart.
instrument: crush
instrument_config:
  model: "qwen/qwen3-coder:free"
  timeout_seconds: 600

instruments:
  # ── FREE cloud — free OpenRouter models, across harnesses ──
  cr-gemma:   { profile: crush,  config: { model: "google/gemma-4-31b-it:free", timeout_seconds: 600 } }
  cr-gptoss:  { profile: crush,  config: { model: "openai/gpt-oss-120b:free", timeout_seconds: 600 } }
  oc-free:    { profile: opencode, config: { model: "openrouter/qwen/qwen3-coder:free", timeout_seconds: 600 } }
  goose-free: { profile: goose,  config: { model: "openrouter/google/gemma-4-31b-it:free", timeout_seconds: 600 } }
  # ── FREE local — Ollama, no account at all ──
  oc-local:   { profile: opencode-gemma }                                    # opencode → local Ollama
  http-local: { profile: local-gemma4 }                                      # direct HTTP → local Ollama
  # ── PAID subscriptions (only if everything free is exhausted) ──
  zai:        { profile: opencode, config: { model: "zai-coding-plan/glm-5.1" } }   # Z.AI Coding Plan
  google:     { profile: gemini-cli }                                        # Google subscription
  anthropic:  { profile: claude-code }                                       # Anthropic Max subscription

instrument_fallbacks:
  [cr-gemma, cr-gptoss, oc-free, goose-free, oc-local, http-local, zai, google, anthropic, anthropic_api]

movements:
  1:
    name: "The World"
  2:
    name: "Three Vignettes"
  3:
    name: "Soundtrack"               # compose loopable music for the story
  4:
    name: "Assembly"
    instrument: cli                  # deterministic — no AI, always valid
  5:
    name: "Polish"

sheet:
  size: 1
  total_items: 5
  fan_out:
    2: 3                             # Movement 2 → three parallel characters
  dependencies:
    2: [1]                           # vignettes read the world
    3: [1]                           # the soundtrack reads the world's mood (parallel with vignettes)
    4: [2, 3]                        # assembly waits for the vignettes AND the soundtrack
    5: [4]                           # polish reads the assembled page
  cadenzas:
    # The Strudel technique corpus — injected ONLY into the soundtrack sheet, so
    # the composer writes valid patterns instead of inventing sample names (the
    # lesson of prior AI-music failures). Sheet 5 = movement 3, after movement 2's
    # fan-out expands to sheets 2-4.
    5:
      - file: "{{ workspace }}/../../examples/getting-started/assets/strudel-patterns.md"
        as: skill

parallel:
  enabled: true
  max_concurrent: 3

cross_sheet:
  auto_capture_stdout: true
  max_output_chars: 2000
  lookback_sheets: 5

retry:
  max_retries: 2                     # give the fallback chain room to advance

prompt:
  variables:
    setting: "a floating garden-city above the clouds, fifty years from now"
    characters:
      1:
        name: "Lira"
        role: "a wind-mapper who reads the sky like sheet music"
        secret: "she has been quietly repairing the oldest bridge — the one everyone says to tear down"
      2:
        name: "Fen"
        role: "a soil-singer who tends the deep gardens whose roots hold the city aloft"
        secret: "he is growing something in the lowest garden that should not survive at this altitude"
      3:
        name: "Cael"
        role: "a memory-keeper who maintains the archive of weather and old songs"
        secret: "she found that the city's founding song hides coordinates to something below the clouds"

  template: |
    {% if stage == 1 %}
    You are a fiction writer. Write the shared SETTING for a short story
    collection set in {{ setting }}.

    Write 250-400 words of vivid, sensory prose. Make the reader feel the
    place — the light, the air, a small everyday detail or two. End with one
    sentence hinting that something is quietly changing.

    Use simple markdown: a `#` title and short paragraphs. Write ONLY the
    setting. Save it to {{ workspace }}/01-world.md and stop.

    {% elif stage == 2 %}
    {% set char = characters[instance] %}
    You are a fiction writer. First read the shared world at
    {{ workspace }}/01-world.md and match its tone.

    Write a 200-350 word vignette for ONE character:
    - Name: {{ char.name }}
    - Role: {{ char.role }}
    - Quiet secret: {{ char.secret }}

    Show one small moment of their morning in this city, let the secret
    surface gently (don't explain it), and end on a beat that makes the
    reader want more. Use a `#` title with the character's name and short
    paragraphs. Write ONLY this vignette. Save it to
    {{ workspace }}/02-character-{{ instance }}.md and stop.

    {% elif stage == 3 %}
    You are a Strudel composer (Strudel is live-coding music — strudel.cc).
    First read the shared world at {{ workspace }}/01-world.md and feel its mood.

    Write ONE short, LOOPABLE, ambient background soundtrack for this story.
    Rules (a static checker rejects violations):
    - Use ONLY sounds documented in the injected Strudel reference — built-in
      samples (bd sd hh cp ...), drum-machine banks, or synth waveforms via
      .sound("sawtooth"/"sine"/"triangle"/"square"). Do NOT invent sample names.
    - Background music: keep it GENTLE and low — a modest .gain (≈0.3-0.5), a
      slow tempo (setcps around 0.35-0.5), a few layers via stack().
    - It must LOOP cleanly forever — no arrange()/one-shot, no silence().
    - Output ONLY valid Strudel code (no prose, no markdown fences). Start with a
      setcps(...) line. Save it to {{ workspace }}/soundtrack.strudel and stop.

    {% elif stage == 4 %}
    python3 "{{ workspace }}/../../examples/getting-started/assets/assemble-site.py" "{{ workspace }}"

    {% elif stage == 5 %}
    You are a web designer. A complete, valid website already exists at
    {{ workspace }}/site-base.html — it presents a short story (world +
    three vignettes in {{ workspace }}/01-world.md and 02-character-*.md) AND
    embeds a loopable music player (a hidden &lt;strudel-editor&gt; and a
    "play soundtrack" button — leave that block EXACTLY as-is).

    Read site-base.html and the story, then write an IMPROVED, single
    self-contained HTML file to {{ workspace }}/the-sky-library.html that:
    - keeps ALL the story text intact,
    - keeps the soundtrack player block and its script intact,
    - tailors the visual design (colors, headings, small touches) to the
      mood of THIS story,
    - keeps inline CSS only — the only external resource allowed is the
      Strudel module the player already imports,
    - begins with <!DOCTYPE html> and is valid HTML5.

    If you are unsure, copy site-base.html and refine it. Write ONLY the
    file {{ workspace }}/the-sky-library.html and stop.
    {% endif %}

validations:
  # Movement 1 — the world exists and has prose
  - type: file_exists
    path: "{workspace}/01-world.md"
    condition: "stage == 1"
    description: "World setting exists"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/01-world.md") -ge 120'
    condition: "stage == 1"
    description: "World has substantive prose (120+ words)"

  # Movement 2 — each parallel vignette exists
  - type: file_exists
    path: "{workspace}/02-character-{instance}.md"
    condition: "stage == 2"
    description: "Character vignette exists"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/02-character-{instance}.md") -ge 80'
    condition: "stage == 2"
    description: "Vignette has substantive prose (80+ words)"

  # Movement 3 — a loopable soundtrack, validated for REAL sounds (not invented)
  - type: file_exists
    path: "{workspace}/soundtrack.strudel"
    condition: "stage == 3"
    description: "The Strudel soundtrack exists"
  - type: command_succeeds
    command: 'grep -q "setcps" "{workspace}/soundtrack.strudel"'
    condition: "stage == 3"
    description: "Soundtrack has a tempo (setcps) — a runnable pattern"
  - type: command_succeeds
    command: 'python3 "{workspace}/../../examples/getting-started/assets/check-strudel-errors.py" "{workspace}/soundtrack.strudel"'
    condition: "stage == 3"
    description: "Soundtrack uses only valid sounds (the static reality check)"

  # Movement 4 — deterministic assembly produced a valid page (the floor)
  - type: file_exists
    path: "{workspace}/site-base.html"
    condition: "stage == 4"
    description: "Deterministic website assembled"
  - type: content_contains
    path: "{workspace}/site-base.html"
    pattern: "<!DOCTYPE html>"
    condition: "stage == 4"
    description: "Assembled output is valid HTML5"

  # Movement 5 — the AI-polished page exists and is valid HTML
  - type: file_exists
    path: "{workspace}/the-sky-library.html"
    condition: "stage == 5"
    description: "Final website exists"
  - type: content_contains
    path: "{workspace}/the-sky-library.html"
    pattern: "<!DOCTYPE html>"
    condition: "stage == 5"
    description: "Final website is valid HTML5"
