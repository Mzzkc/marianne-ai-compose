# hello.yaml — Your First Marianne Score (free, local-capable, orchestrated)
#
# Marianne is an ORCHESTRATOR, not a prompt wrapper. This score proves it:
# it coordinates several AI agents across stages AND mediums to build one
# artifact no single prompt could — a self-contained website telling a short
# story, written by agents working in parallel and woven together.
#
#   Movement 1 · The World     one agent writes the shared setting (prose)
#         │
#         ▼   fan-out (parallel)
#   Movement 2 · Vignettes     three agents each write one character AND, at the
#         │                    same time, one agent composes a Strudel soundtrack
#         │  ┌─ Movement 3 ····· tuned to the world's mood (parallel with the
#         │  │                   vignettes; a corpus is injected so it writes
#         ▼  ▼                   real, valid music — not invented gibberish)
#   Movement 4 · The Finale    one agent reads the world AND all three vignettes
#         │                    and writes the CLOSING chapter — braiding the three
#         │                    separately-written secrets into one revelation. This
#         ▼                    is the synthesis: the payoff no single vignette could
#                              reach, because each author never saw the others.
#   Movement 5 · The Page      a DETERMINISTIC tool (no AI) builds the FINAL,
#                              hand-designed HTML page from the world, the cards,
#                              the finale, and the soundtrack — always valid, always
#                              pretty, embedding the music VERBATIM so nothing
#                              corrupts it, then opens it in your browser.
#
# Mediums crossed: prose → parallel prose → playable music → synthesis → an openable
# web page. Pattern: Fan-out + Synthesis, plus a Tool-Chain seam — the convergence
# lives in the finale agent, the design lives in the deterministic tool, so a new
# user's first result is reliably beautiful no matter how small the model.
#
# FREE BY DESIGN — a deep fallback chain: free OpenRouter (crush) → local Ollama
# → paid subs/API. You need only ONE of them. (Tip: run hello-setup.yaml instead
# and Marianne discovers which you have, then runs this for you.)
#
# Usage:
#   mzt start
#   mzt run examples/getting-started/hello.yaml
#   # it opens the-sky-library.html for you; the soundtrack autoplays on first click
#
# Output (workspaces/hello/): 01-world.md · 02-character-1..3.md ·
#   soundtrack.strudel · finale.md · the-sky-library.html (the finished page)
#
# Time: ~5-15 min (varies with model/fallback)  |  Cost: free  |  Sheets: 7

name: hello
description: "Orchestration across mediums — parallel agents write a story; tools and an agent build it into a website. Free, local-capable."

workspace: ../../workspaces/hello

# ── Instrument: a DEEP fallback chain — runs for anyone, with anything ────
# Targeting UNKNOWN systems: we don't know what you've installed or configured,
# so the chain spans every tier across several harnesses. Marianne skips any
# instrument that isn't installed (its binary isn't on PATH) and advances when
# one is unavailable / rate-limited / exhausted. You need ONLY ONE of these set
# up — the chain finds it. Free and local come first; paid is the last resort.
#
#   FREE cloud   crush / opencode / goose  +  free OpenRouter models
#   FREE local   opencode & a direct HTTP profile  →  local Ollama (no account)
#   PAID subs    Z.AI Coding Plan (opencode/glm) → Google (gemini-cli)
#                → Anthropic Max (claude-code)
#   PAID API     anthropic_api — the very last resort
#
# A new user with NOTHING set up: install Ollama and `ollama pull gemma2` (free,
# local, no account), OR set OPENROUTER_API_KEY (free). See the quickstart.
instrument: crush
instrument_config:
  model: "qwen/qwen3-coder:free"
  timeout_seconds: 600

instruments:
  # ── FREE cloud — free OpenRouter models via crush (fails fast on no key /
  #    rate-limit, so it never stalls the chain) ──
  cr-gemma:   { profile: crush,  config: { model: "google/gemma-4-31b-it:free", timeout_seconds: 600 } }
  cr-gptoss:  { profile: crush,  config: { model: "openai/gpt-oss-120b:free", timeout_seconds: 600 } }
  # ── FREE local — Ollama, no account at all. opencode and goose each get a
  #    free (local) option here, before any paid tier. ──
  oc-local:    { profile: opencode-gemma }                                   # opencode → local Ollama
  http-local:  { profile: local-gemma4 }                                     # direct HTTP → local Ollama
  goose-local: { profile: goose, config: { model: "ollama/gemma4:26b" } }    # goose → local Ollama
  # ── PAID subscriptions (only if everything free is exhausted) ──
  zai:        { profile: opencode, config: { model: "zai-coding-plan/glm-5.1" } }   # Z.AI Coding Plan
  google:     { profile: gemini-cli }                                        # Google subscription
  anthropic:  { profile: claude-code }                                       # Anthropic Max subscription

# NOTE: crush goes first because it fails fast (no OpenRouter key → instant
# error; rate-limited → quick advance). The local-Ollama options follow. We do
# NOT route OpenRouter through opencode/goose: when their backend isn't
# configured they HANG to the timeout instead of erroring, which would stall a
# first run — and crush already covers free OpenRouter.
instrument_fallbacks:
  [cr-gemma, cr-gptoss, oc-local, http-local, goose-local, zai, google, anthropic, anthropic_api]

movements:
  1:
    name: "The World"
  2:
    name: "Three Vignettes"
  3:
    name: "Soundtrack"               # compose loopable music for the story
  4:
    name: "The Finale"               # synthesis — braid the three secrets into one ending
  5:
    name: "The Page"
    instrument: cli                  # deterministic — builds the FINAL page, no AI

sheet:
  size: 1
  total_items: 5
  fan_out:
    2: 3                             # Movement 2 → three parallel characters
  dependencies:
    2: [1]                           # vignettes read the world
    3: [1]                           # the soundtrack reads the world's mood (parallel with vignettes)
    4: [2]                           # the finale reads the world AND all three vignettes
    5: [3, 4]                        # the page waits for the soundtrack AND the finale
  cadenzas:
    # Complete, tested soundtrack RECIPES — injected ONLY into the soundtrack
    # sheet. The model PICKS one that fits the mood and lightly adapts it, instead
    # of composing from primitives (which a small model does badly). This is the
    # technique-injection lesson of prior AI-music failures, taken further: give
    # known-good examples, not just syntax. Sheet 5 = movement 3, after movement
    # 2's fan-out expands to sheets 2-4.
    5:
      - file: "{{ workspace }}/../../examples/getting-started/assets/soundtrack-recipes.md"
        as: skill

parallel:
  enabled: true
  max_concurrent: 3

cross_sheet:
  auto_capture_stdout: true
  max_output_chars: 2000
  lookback_sheets: 5

retry:
  max_retries: 2                     # give the fallback chain room to advance

prompt:
  variables:
    setting: "a floating garden-city above the clouds, fifty years from now"
    characters:
      1:
        name: "Lira"
        role: "a wind-mapper who reads the sky like sheet music"
        secret: "she has been quietly repairing the oldest bridge — the one everyone says to tear down"
      2:
        name: "Fen"
        role: "a soil-singer who tends the deep gardens whose roots hold the city aloft"
        secret: "he is growing something in the lowest garden that should not survive at this altitude"
      3:
        name: "Cael"
        role: "a memory-keeper who maintains the archive of weather and old songs"
        secret: "she found that the city's founding song hides coordinates to something below the clouds"

  template: |
    {% if stage == 1 %}
    You are a fiction writer. Write the shared SETTING for a short story
    collection set in {{ setting }}.

    Write 250-400 words of vivid, sensory prose. Make the reader feel the
    place — the light, the air, a small everyday detail or two. End with one
    sentence hinting that something is quietly changing.

    Use simple markdown: a `#` title and short paragraphs. Write ONLY the
    setting. Save it to {{ workspace }}/01-world.md and stop.

    {% elif stage == 2 %}
    {% set char = characters[instance] %}
    You are a fiction writer. First read the shared world at
    {{ workspace }}/01-world.md and match its tone.

    Write a 200-350 word vignette for ONE character:
    - Name: {{ char.name }}
    - Role: {{ char.role }}
    - Quiet secret: {{ char.secret }}

    Show one small moment of their morning in this city, let the secret
    surface gently (don't explain it), and end on a beat that makes the
    reader want more. Use a `#` title with the character's name and short
    paragraphs. Write ONLY this vignette. Save it to
    {{ workspace }}/02-character-{{ instance }}.md and stop.

    {% elif stage == 3 %}
    You are scoring this story with music (Strudel — live-coding music, strudel.cc).
    First read the shared world at {{ workspace }}/01-world.md and feel its
    DOMINANT mood (serene? mysterious? hopeful? wistful? wondrous?).

    You have been given a set of complete, tested soundtrack RECIPES (in your
    skill material) — each a full, good-sounding ambient track tagged by mood.
    Do NOT compose from scratch: good ambient music is hard to invent and easy to
    get wrong. Instead:
      1. Pick the ONE recipe whose mood best fits the world.
      2. Copy it EXACTLY. You may change only the note letters inside note("...")
         to shift the key — keep every effect, number, and the structure.
      3. Do not raise any .gain — keep it quiet.
    Output ONLY the Strudel code, starting at setcps(. No prose, no code fences.
    Save it to {{ workspace }}/soundtrack.strudel and stop.

    {% elif stage == 4 %}
    {% set c1 = characters[1] %}{% set c2 = characters[2] %}{% set c3 = characters[3] %}
    You are the fiction writer composing the CLOSING chapter — the synthesis.

    Read ALL of these first, and hold them together:
    - the shared world:  {{ workspace }}/01-world.md
    - vignette one:      {{ workspace }}/02-character-1.md   ({{ c1.name }})
    - vignette two:      {{ workspace }}/02-character-2.md   ({{ c2.name }})
    - vignette three:    {{ workspace }}/02-character-3.md   ({{ c3.name }})

    Each character was written by a different author who never saw the others, so
    none of them knows yet how their quiet secrets connect. But the three secrets
    point the SAME way — downward, below the clouds:
    - {{ c1.name }}: {{ c1.secret }}
    - {{ c2.name }}: {{ c2.secret }}
    - {{ c3.name }}: {{ c3.secret }}

    Write a 250-400 word FINALE that braids the three threads into ONE quiet
    revelation — the moment the city sees that the bridge, the garden, and the
    song are the same discovery from three sides — and lands a resonant, hopeful
    conclusion. Don't summarize the vignettes; carry them forward and let them
    meet. Match the world's tone. Use a `#` title and short paragraphs. Write ONLY
    the finale. Save it to {{ workspace }}/finale.md and stop.

    {% elif stage == 5 %}
    python3 "{{ workspace }}/../../examples/getting-started/assets/assemble-site.py" "{{ workspace }}"
    {% endif %}

validations:
  # Movement 1 — the world exists and has prose
  - type: file_exists
    path: "{workspace}/01-world.md"
    condition: "stage == 1"
    description: "World setting exists"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/01-world.md") -ge 120'
    condition: "stage == 1"
    description: "World has substantive prose (120+ words)"

  # Movement 2 — each parallel vignette exists
  - type: file_exists
    path: "{workspace}/02-character-{instance}.md"
    condition: "stage == 2"
    description: "Character vignette exists"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/02-character-{instance}.md") -ge 80'
    condition: "stage == 2"
    description: "Vignette has substantive prose (80+ words)"

  # Movement 3 — a loopable soundtrack, validated for REAL sounds (not invented)
  - type: file_exists
    path: "{workspace}/soundtrack.strudel"
    condition: "stage == 3"
    description: "The Strudel soundtrack exists"
  - type: command_succeeds
    command: 'grep -q "setcps" "{workspace}/soundtrack.strudel"'
    condition: "stage == 3"
    description: "Soundtrack has a tempo (setcps) — a runnable pattern"
  - type: command_succeeds
    command: 'python3 "{workspace}/../../examples/getting-started/assets/check-strudel-errors.py" "{workspace}/soundtrack.strudel"'
    condition: "stage == 3"
    description: "Soundtrack uses only valid sounds (the static reality check)"

  # Movement 4 — the synthesis chapter that braids the three secrets together
  - type: file_exists
    path: "{workspace}/finale.md"
    condition: "stage == 4"
    description: "The finale (synthesis) exists"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/finale.md") -ge 120'
    condition: "stage == 4"
    description: "The finale has substantive prose (120+ words)"

  # Movement 5 — the deterministic tool built the FINAL page (always valid +
  # embeds the soundtrack verbatim, so no model can corrupt it)
  - type: file_exists
    path: "{workspace}/the-sky-library.html"
    condition: "stage == 5"
    description: "Final website built"
  - type: content_contains
    path: "{workspace}/the-sky-library.html"
    pattern: "<!DOCTYPE html>"
    condition: "stage == 5"
    description: "Final website is valid HTML5"
  - type: content_contains
    path: "{workspace}/the-sky-library.html"
    pattern: "strudel-editor"
    condition: "stage == 5"
    description: "The soundtrack player is embedded"
