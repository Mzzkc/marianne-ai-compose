name: condorcet-six-letterheads
description: "Condorcet's Premise proven on this host's real fleet (revised against three adversarial reviews): a 10-seat jury (six GLM letterheads under six instrument names, plus GPT, Claude, Gemma-free and Gemini seats — the HTTP-only ollama seat replaced by file-capable gemini-cli) is calibrated against K=72 sealed-answer items whose 48 mechanical rows are generated by CLI joins over pinned bytes and whose key is sealed OUTSIDE the workspace while jurors answer (a gate asserts its absence), censused (full pairwise error co-occurrence M, CENTERED rho-bar so fallible-but-independent jurors score ~0, design effect, n_eff capped at n, family census DERIVED from probed routes — with the naive letterhead census recorded beside it from minute one), demoted down a PRE-REGISTERED ladder by join, put to work on 40 seat×frame experiential accessibility reviews (four Rashomon frames over one pinned evidence base, findings admitted only by reproduction pointer and re-derived against pinned bytes by a CLI oracle with an empty fallback chain), shipped as TWO labeled fan-ins (the naive CELL-LEVEL majority over all 40 cells generated by script; the demoted editorial verdict with recorded dissents — the typecheck recounts every cell and no longer forces the rules to differ), audited so a majority-citing fixture verdict FAILS in the same invocation that passes the real one, and published as a live GitHub Pages review whose deployed bytes must pass the very engines it wields (axe clean, build-nonce-joined fetch, live recompute of rho-bar/n_eff from published raw answers, keyboard spot-check) — plus the reusable census/demote harness, this fleet's citable panel-manifest, PID-custody demobilization, and a machine-checkable walkthrough upgrading cathedral's family gate and the dispensary's corroboration_min from asserted to measured."

# workspace: intentionally omitted — auto-managed at <workspace-root>/condorcet-six-letterheads,
# following the precedent-bench convention. HOST-COUPLED BY DESIGN: the jury, the
# seat→instrument routing and the six-GLM block ARE the experiment and are NOT
# --var knobs. github_owner/repo_name are --var overridable; movement 1 derives
# site_url from them and refuses an independent mismatched value (the cross-tenant
# trap cannot be configured by accident). A host whose fleet lacks the diversity
# theater this experiment measures (instrument letterheads <= derived model
# families) is out of scope: movement 2 says PREMISE FAIL and names the fact.

instrument: claude-code            # score default; every deterministic movement
instrument_config:                 # and every juror sheet overrides below
  timeout_seconds: 3600

# Score-level fallback chain is EMPTY (the safe default): movements that may
# fall back across vendors declare their own chain; every gate and every juror
# sheet runs with NO fallback by design — see the movements block.
instrument_fallbacks: []

movements:
  # ── M1 · Commission engines + substrate (Canary Probe / Etiquette Law) ────────
  1:
    name: "Commission (M1)"
    instrument: cli            # npm install, engine fixture runs, heredoc
    instrument_fallbacks: []   # authoring of the ENTIRE deterministic substrate:
    instrument_config:         # gates, fixtures, frames, renderer. Engines must
      timeout_seconds: 3600    # fire on planted violations and pass a clean page
                               # BEFORE any live site is touched; every gate is
                               # commissioned with its designed failure OBSERVED
                               # FIRING — a control never seen failing is not a
                               # control (the precedent-bench convention)
  # ── M2 · Probe seats (Gate on Environmental Readiness) ────────────────────────
  2:
    name: "Probe Seats (M2)"
    instrument: cli            # liveness is BODY-asserted: timeout exit codes are
    instrument_fallbacks: []   # deliberately ignored for crush-class instruments
    instrument_config:         # and the response body is the assertion; routes
      timeout_seconds: 1800    # stamped from `mzt instruments check`; the
                               # letterhead-vs-family divergence is COMPUTED HERE,
                               # before any measurement — the theater is visible
                               # from minute one
  # ── M3 · Prereg freeze (The Freeze) ───────────────────────────────────────────
  3:
    name: "Prereg Freeze (M3)"
    instrument: claude-code    # the only judgment: selecting real sites, phrasing
    instrument_fallbacks: [gemini-cli]   # user tasks, composing K and the TOTAL
    instrument_config:         # threshold table with stated arithmetic. The
      timeout_seconds: 3600    # freeze itself is a git fact, not prose
  # ── M4 · Pin evidence (Shipyard foundation) ───────────────────────────────────
  4:
    name: "Pin Evidence (M4)"
    instrument: cli            # playwright rendering + sha256 pinning are
    instrument_fallbacks: []   # deterministic; robots.txt dispositions were
    instrument_config:         # probed and archived at M3; verdicts will bind to
      timeout_seconds: 3600    # these BYTES, timestamped, never to the live site
  # ── M5 · Engine scan (Etiquette Law — the ground-truth generators) ────────────
  5:
    name: "Engine Scan (M5)"
    instrument: cli            # axe + pa11y over the PINNED bytes via a
    instrument_fallbacks: []   # short-lived EPHEMERAL-PORT local server; the axe
    instrument_config:         # double-run diff = 0 is the determinism credential
      timeout_seconds: 3600    # that makes engine output ground-truth-ELIGIBLE
                               # for the mechanical subset. lighthouse is
                               # COMMISSION-ONLY (M1 fixtures, where its output
                               # is actually asserted) — it no longer runs per
                               # page just to be discarded [R1/R2]
  # ── M6 · Author calibration (Prefabrication: contracts before finishers) ──────
  6:
    name: "Author Calibration (M6)"
    instrument: claude-code    # judgment-laden authoring (bait items must encode
    instrument_fallbacks: [gemini-cli]   # real documented misconceptions), but
    instrument_config:         # every mechanical derivation is a jq join and K3
      timeout_seconds: 3600    # answers REGENERATE from a script — the LLM
                               # authors, CLI verifies; the key is sealed + git-
                               # committed BEFORE any juror sheet can be
                               # scheduled (DAG-enforced, re-derived at M9)
  # ── M7 · Gate self-tests (Exploit Failure as Signal) ──────────────────────────
  7:
    name: "Gate Self-Tests (M7)"
    instrument: cli            # every designed failure OBSERVED FIRING, every
    instrument_fallbacks: []   # single-error mutation flips its outcome — the
    instrument_config:         # gates are proven able to fail BEFORE any real
      timeout_seconds: 1800    # juror token is spent; a self-test judged by an
                               # LLM would be the coordination layer vouching
                               # for itself
  # ── M8 · Calibrate (skeleton stage 1 — Condorcet's Premise) ───────────────────
  8:
    name: "Calibrate (M8)"
    instrument_fallbacks: []   # NO movement instrument: all 10 expanded sheets
    instrument_config:         # pin their juror below (one sheet, one seat). The
      timeout_seconds: 3600    # EMPTY chain is the point: a juror is NEVER
                               # silently rerouted — on this host a claude→
                               # opencode fallback is seat 1 falling back to
                               # seat 2's model. A juror that runs but cannot
                               # decide a row emits a declared UNANSWERED cell;
                               # a juror that DIES halts the run loudly for host
                               # remediation (fail_fast is deliberate; M2's
                               # all-seat body probe is the precondition that
                               # makes death rare) [R3: claim reconciled with
                               # config]. The sealed key is OUTSIDE the
                               # workspace while these sheets run — a gate
                               # asserts its absence [R2: structural blinding]
  # ── M9 · Census (skeleton stage 2 — Condorcet + Concurrent Count) ─────────────
  9:
    name: "Census (M9)"
    instrument: cli            # the coordination layer auditing the coordination
    instrument_fallbacks: []   # layer: an LLM here could hallucinate the very
    instrument_config:         # correlation being measured. A SECOND, separately
      timeout_seconds: 1800    # written implementation must reproduce M, ρ̄, n_eff
                               # EXACTLY or the manifest is void (two independent
                               # enumerations of the same quantity; mismatch aborts)
  # ── M10 · Panel (skeleton stage 3 — Rashomon Gate layering) ───────────────────
  10:
    name: "Panel (M10)"
    instrument_fallbacks: []   # 40 sheets = 10 seats × 4 frames; the frame lens
    instrument_config:         # arrives as a REQUIRED cadenza (versioned content,
      timeout_seconds: 5400    # blindness-gated — each sheet sees only its own
                               # frame); governance arrives via the manifest every
                               # verdict must cite; same seats, same assignment
                               # rule as calibration — the correlation estimate's
                               # validity depends on it
  # ── M11 · Reconstruct + naive fan-in (Skeptical Oracle + Dead Letter) ─────────
  11:
    name: "Reconstruct + Naive Fan-In (M11)"
    instrument: cli            # re-derivation against pinned bytes is mechanical
    instrument_fallbacks: []   # by construction — this is where proposals become
    instrument_config:         # evidence; non-reproducing findings become a
      timeout_seconds: 1800    # STRUCTURALLY SEPARATE quarantine, never trash.
                               # The naive fan-in is generated by SCRIPT in this
                               # same movement — exactly what an un-audited score
                               # would ship, mechanical truth, never a
                               # hand-authored strawman
  # ── M12 · Demoted fan-in (The Dropped Axiom / Typed Force) ────────────────────
  12:
    name: "Demoted Fan-In (M12)"
    instrument: claude-code    # ONE editorial synthesist working UNDER the
    instrument_fallbacks: [gemini-cli]   # demoted rule — judgment inside the
    instrument_config:         # pattern's own use condition; the typed header
      timeout_seconds: 3600    # {input_type, aggregation_rule, axioms_dropped,
                               # declared_authority} is mandatory and an empty
                               # axioms_dropped is perjury (typecheck fails)
  # ── M13 · Audit (skeleton stage 4 — the constitutive gate) ────────────────────
  13:
    name: "Audit (M13)"
    instrument: cli            # "no vote ships before its own audit passes": the
    instrument_fallbacks: []   # majority-citing FIXTURE verdict must FAIL in the
    instrument_config:         # same invocation that passes the real verdict —
      timeout_seconds: 1800    # production rides the same path as the fixture
  # ── M14 · Publish + live gates (The Gas-Free Certificate) ─────────────────────
  14:
    name: "Publish + Live Gates (M14)"
    instrument: cli            # static build + gh Pages deploy is deterministic
    instrument_fallbacks: []   # (no pandoc — stdlib templating, the precedent-
    instrument_config:         # bench lesson). Pages enablement nests branch/path
      timeout_seconds: 3600    # in source[] [R1/R2: top-level params 422 and the
                               # 900s poll died]; an existing foreign gh-pages
                               # tip REFUSES unless allow_force_publish [R3];
                               # ONE push — digests are computed pre-push so the
                               # deployed revision IS the verified revision
                               # [R1/R2]; the axe-clean, build-nonce-joined and
                               # live-recompute gates run against the DEPLOYED
                               # URL, so a tampered or stale local copy cannot
