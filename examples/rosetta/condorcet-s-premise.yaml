      grep -q "OBSERVED FIRING: correlated" "{workspace}/run/m7-census.txt"
      grep -q "OBSERVED FIRING" "{workspace}/run/m7-repro.txt"
      jq -e '.mutations | length >= 1 and all(.[]; .flipped == true)' "{workspace}/run/self-test-log.json" >/dev/null
    condition: "stage == 7"
    stage: 2
    description: "Self-test transcripts on disk; the single-error mutation demonstrably flips the rung"

  # ── M8 · Calibrate (per seat): schema + completeness grid ───────────────────
  - type: command_succeeds
    command: 'bash "{workspace}/scripts/movement-gate.sh" 8 {instance}'
    condition: "stage == 8"
    stage: 1
    description: "Answer file exists with exactly 72 schema-valid rows"
  - type: command_succeeds
    command: |
      python3 -c "
      import json
      items = set(r['item_id'] for r in map(json.loads, open('{workspace}/calibration/items.jsonl')) if r)
      ans = set(r['item_id'] for r in map(json.loads, open('{workspace}/calibration/answers-{instance}.jsonl')) if r)
      holes = items - ans
      assert not holes, 'silent holes (should be declared UNANSWERED rows): %s' % sorted(holes)
      print('seat {instance}: complete grid, %d items' % len(items))
      "
    condition: "stage == 8"
    stage: 2
    description: "Item-instance grid has no silent holes — every id answered or explicitly UNANSWERED"

  # ── M9 · Census: exact recheck + applied-never-judged demotion ──────────────
  - type: command_succeeds
    command: 'bash "{workspace}/scripts/movement-gate.sh" 9'
    condition: "stage == 9"
    stage: 1
    description: "Manifest exists; the independent enumeration matched exactly"
  - type: command_succeeds
    command: |
      python3 -c "
      import yaml
      th = yaml.safe_load(open('{workspace}/prereg/thresholds.yaml'))
      man = yaml.safe_load(open('{workspace}/panel-manifest.yaml'))
      rho, ratio, rung = man['rho_bar'], man['n_eff_ratio'], man['aggregation_rule_demoted_to']
      expect = None
      for band in th['bands']:
          ok = True
          if 'rho_bar_lt' in band and not (rho < band['rho_bar_lt']):
              ok = False
          if 'n_eff_ratio_ge' in band and not (ratio >= band['n_eff_ratio_ge']):
              ok = False
          if ok:
              expect = band['rung']
              break
      assert expect == rung, 'demotion judged, not applied: table says %s, manifest says %s' % (expect, rung)
      print('demotion applied by join: %s (rho=%s ratio=%s)' % (rung, rho, ratio))
      "
    condition: "stage == 9"
    stage: 2
    description: "The demoted rung equals the prereg table's mapping — applied, never judged"
  - type: command_succeeds
    command: 'test "$(sha256sum "{workspace}/calibration/ground-truth.jsonl" | cut -d" " -f1)" = "$(cut -d" " -f1 "{workspace}/calibration/ground-truth.sha256)"'
    condition: "stage == 9"
    stage: 3
    description: "The runtime join half of never-soften edge #1: the scored key is the sealed key"

  # ── M10 · Panel (per cell): header contract + governed rule citation ────────
  - type: command_succeeds
    command: 'bash "{workspace}/scripts/movement-gate.sh" 10 {instance}'
    condition: "stage == 10"
    stage: 1
    description: "Panel review exists with SEAT/FRAME stamp and Task headings"
  - type: command_succeeds
    command: |
      R=$(python3 -c "import yaml; print(yaml.safe_load(open('{workspace}/panel-manifest.yaml'))['aggregation_rule_demoted_to'])")
      grep -q "Rule: $R" "{workspace}/panel/panel-{instance}.md" \
        || { echo "no verdict cites the demoted rung '$R'"; exit 1; }
      if grep -E '^Rule: ' "{workspace}/panel/panel-{instance}.md" | grep -vq "Rule: $R"; then
        echo "a verdict cites a rung other than the demoted one"; exit 1
      fi
    condition: "stage == 10"
    stage: 2
    description: "Every Rule line cites exactly the demoted rung — no verdict above the measured authority"
  - type: command_succeeds
    command: |
      jq -s 'length == 0 or all(.[]; (has("finding_id") and has("kind") and (.kind == "axe-rule" or .kind == "dom-invariant" or .kind == "script") and has("ref") and has("expected")))' \
        "{workspace}/findings/panel-{instance}.jsonl" >/dev/null \
        || { echo "pointer schema violation in findings/panel-{instance}.jsonl"; exit 1; }
    condition: "stage == 10"
    stage: 3
    description: "Every mechanical proposal is a schema-valid reproduction pointer (or the file is empty)"

  # ── M11 · Reconstruct + naive fan-in ─────────────────────────────────────────
  - type: command_succeeds
    command: 'bash "{workspace}/scripts/movement-gate.sh" 11'
    condition: "stage == 11"
    stage: 1
    description: ">=1 verified finding; naive verdict carries the majority header"
  - type: command_succeeds
    command: |
      python3 -c "
      import glob, json
      proposals = set()
      for p in glob.glob('{workspace}/findings/panel-*.jsonl'):
          for line in open(p):
              if line.strip():
                  proposals.add(json.loads(line)['finding_id'])
      verified = json.load(open('{workspace}/verified-manifest.json'))
      quarantined = set(json.loads(l)['finding_id'] for l in open('{workspace}/leads-quarantine.jsonl') if l.strip())
      done = set(v['finding_id'] for v in verified['verified']) | quarantined
      lost = proposals - done
      assert not lost, 'proposals neither verified nor quarantined (silently dropped): %s' % sorted(lost)
      print('oracle: %d proposals -> %d verified + %d quarantined, none lost' % (len(proposals), len(verified['verified']), len(quarantined)))
      "
    condition: "stage == 11"
    stage: 2
    description: "Every proposal is EITHER reproduced or quarantined — the oracle loses nothing silently"
  - type: command_succeeds
    command: 'grep -q "OBSERVED FIRING" "{workspace}/run/repro-fixture.txt" && grep -q "axioms_dropped" "{workspace}/verdict-naive.md"'
    condition: "stage == 11"
    stage: 3
    description: "The corrupted pointer quarantined via the production path; the naive artifact declares its dropped axiom"

  # ── M12 · Demoted fan-in: typed headers on BOTH artifacts ───────────────────
  - type: command_succeeds
    command: 'bash "{workspace}/scripts/movement-gate.sh" 12'
    condition: "stage == 12"
    stage: 1
    description: "Verdict + divergence section + triangulation all exist"
  - type: command_succeeds
    command: |
      bash "{workspace}/scripts/fanin-typecheck.sh" "{workspace}/verdict.md" "{workspace}/verdict-naive.md" \
        "{workspace}/panel-manifest.yaml" "{workspace}/triangulation.yaml" "{workspace}/panel" "{workspace}/votes.json"
    condition: "stage == 12"
    stage: 2
    description: "fanin-typecheck: headers typed, axioms non-empty, rules joined, categories permitted, tally recounted"
  - type: command_succeeds
    command: |
      grep -q "## Divergence" "{workspace}/verdict.md"
      grep -q "aggregation_rule: majority" "{workspace}/verdict.md"
      R=$(python3 -c "import yaml; print(yaml.safe_load(open('{workspace}/panel-manifest.yaml'))['aggregation_rule_demoted_to'])")
      grep -q "aggregation_rule: $R" "{workspace}/verdict.md"
    condition: "stage == 12"
    stage: 3
    description: "The divergence section quotes BOTH rules verbatim"

  # ── M13 · Audit: fixture refused, production passed, same path ──────────────
  - type: command_succeeds
    command: 'bash "{workspace}/scripts/movement-gate.sh" 13'
    condition: "stage == 13"
    stage: 1
    description: "Audit report: fixture_refused AND production.passed — same invocation"
  - type: command_succeeds
    command: |
      grep -q "OVERCITES" "{workspace}/run/audit-fixture.txt"
      jq -e '.production.passed == true and (.production.findings_dangling | length == 0)' "{workspace}/run/audit-report.json" >/dev/null
    condition: "stage == 13"
    stage: 2
    description: "The majority-citing fixture died with OVERCITES; the shipped verdict has zero dangling findings"

  # ── M14 · Publish: gates against the DEPLOYED, RUNNING artifact ─────────────
  - type: command_succeeds
    command: 'bash "{workspace}/scripts/movement-gate.sh" 14'
    condition: "stage == 14"
    stage: 1
    description: "Live seam verified receipt + published data bundle present"
  - type: command_succeeds
    command: |
      URL=$(jq -r .site_url "{workspace}/run/review-config.json")
      BID=$(sed -n 's/.*data-build-id="\([a-f0-9]*\)".*/\1/p' "{workspace}/site/index.html" | head -1)
      [ -n "$BID" ] || { echo "local build carries no nonce"; exit 1; }
      curl -sf --max-time 60 "$URL" | grep -q "data-build-id=\"$BID\"" \
        || { echo "the deployed review did not answer with THIS build's bytes (nonce $BID absent)"; exit 1; }
      curl -sf --max-time 60 "$URL/data/panel-manifest.yaml" | grep -q "aggregation_rule_demoted_to"
    condition: "stage == 14"
    stage: 2
    description: "The RUNNING deployed review answers over HTTP at THIS build's nonce, with its manifest served alongside [R2: stale bytes cannot pass]"
  - type: command_succeeds
    command: |
      jq -e '.violations | length == 0' "{workspace}/run/deployed-axe.json" >/dev/null
      grep -q "independent enumeration matches" "{workspace}/run/live-recompute.txt"
      jq -e '.focusable_count >= 1 and .first_tab_focus != "none"' "{workspace}/run/keyboard-probe.json" >/dev/null
      grep -q "ONE push" "{workspace}/run/deploy-log.txt" || \
        grep -q "one push" "{workspace}/run/deploy-log.txt" \
        || { echo "deploy receipt is not the single-push receipt"; exit 1; }
    condition: "stage == 14"
    stage: 3
    description: "Gas-Free Certificate: deployed page axe-clean, census recomputes FROM deployed bytes, keyboard spot-check green, single-push receipt"

  # ── M15 · Re-absorb + checkout ───────────────────────────────────────────────
  - type: command_succeeds
    command: 'bash "{workspace}/scripts/movement-gate.sh" 15'
    condition: "stage == 15"
    stage: 1
    description: "Teardown re-run independently by the gate over recorded PIDs/ports — NO RESIDUAL PROCESSES is earned, not written; walkthrough carries upgrade_map + measured"
  - type: command_succeeds
    command: |
      python3 -c '
      import re, yaml
      txt = open("{workspace}/examples/upgrade-walkthrough.md").read()
      m = re.search(r"```yaml\n(.*?)```", txt, re.S)
      assert m, "no machine-checkable yaml block"
      blk = yaml.safe_load(m.group(1))
      assert "measured" in blk, "no measured: block — the walkthrough must carry the manifest numbers, not prose"
      um = blk["upgrade_map"]
      man = yaml.safe_load(open("{workspace}/panel-manifest.yaml"))
      mm = blk["measured"]
      assert abs(float(mm["rho_bar"]) - float(man["rho_bar"])) < 1e-6, "measured.rho_bar %r != manifest %r" % (mm.get("rho_bar"), man["rho_bar"])
      assert abs(float(mm["n_eff"]) - float(man["n_eff"])) < 1e-6, "measured.n_eff %r != manifest %r" % (mm.get("n_eff"), man["n_eff"])
      assert mm["demoted_to"] == man["aggregation_rule_demoted_to"], "measured.demoted_to mismatch"
      assert len(um) >= 2, "upgrade map must cover both corpus consumers"
      assert all(u["manifest_ref"] == "panel-manifest.yaml" for u in um)
      print("upgrade map joins the measured manifest NUMERICALLY (2 consumers, exact values)")
      '
    condition: "stage == 15"
    stage: 2
    description: "The re-absorption mapping is mechanically checkable — measured block matches the manifest to 1e-6 [R1: no float-string grep], both consumers covered"
  - type: command_succeeds
    command: |
      for L in "## The Finding" "## The Measurement" "## The Demotion" "## The Divergence" "## What Changes For The Next Concert"; do
        grep -q "$L" "{workspace}/report.md" || { echo "report.md missing section: $L"; exit 1; }
      done
    condition: "stage == 15"
    stage: 3
    description: "Campaign report carries all five literal sections"
