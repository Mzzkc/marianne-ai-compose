    cat > scripts/_demote.py <<'SCRIPTEOF'
    #!/usr/bin/env python3
    """Audit gate: joins every shipped verdict's CITED aggregation rule against
    the manifest's DEMOTED rule — the verdict must sit at the demoted rung or
    LOWER authority on the ladder — requires recorded dissents when the rung
    demands them, verifies the header's manifest_sha256 against the manifest
    BYTES [R2], checks every task carries a verdict heading when a site list is
    supplied [R2: the audit checked metadata, not the vote], and verifies every
    finding id the verdict ASSERTS joins a PASSED reproduction in the verified
    manifest. Mechanical findings are asserted ONLY in the literal
    `## Cited findings` section — one F-NNNN per line — so quarantined leads may
    be DISCUSSED in prose without being mistaken for assertions [R1/R2: a bare
    F-\\d+ regex over the whole text failed honest verdicts that mentioned
    quarantined ids]. --self-test proves the gate can refuse: a majority-citing
    verdict over a correlated manifest MUST fail."""
    import hashlib, json, os, re, sys
    import yaml

    LADDER = ["majority", "weighted-correlation", "editorial-with-dissents", "refusal"]

    def read_header(verdict_path):
        text = open(verdict_path).read()
        m = re.search(r"```yaml\n(.*?)```", text, re.S)
        if not m:
            sys.exit("AUDIT REFUSED: no typed yaml header block in %s" % verdict_path)
        return yaml.safe_load(m.group(1)), text

    def audit(manifest_path, verdict_path, verified_path, report_path, site_list=None):
        man = yaml.safe_load(open(manifest_path))
        man_sha = hashlib.sha256(open(manifest_path, "rb").read()).hexdigest()
        hdr, text = read_header(verdict_path)
        demoted = man["aggregation_rule_demoted_to"]
        cited = hdr.get("aggregation_rule")
        problems = []
        if hdr.get("manifest_sha256") != man_sha:
            problems.append("header manifest_sha256 %r != sha256 of the manifest bytes" % hdr.get("manifest_sha256"))
        if cited not in LADDER:
            problems.append("cited rule '%s' not on the ladder" % cited)
        else:
            if LADDER.index(cited) < LADDER.index(demoted):
                problems.append("VERDICT OVERCITES: cited '%s' above demoted '%s'" % (cited, demoted))
            if LADDER.index(cited) >= LADDER.index("editorial-with-dissents"):
                seg = text.split("## Dissents", 1)
                if len(seg) < 2 or len(seg[1].strip()) < 40:
                    problems.append("rung '%s' requires recorded dissents (## Dissents, substantive)" % cited)
        if site_list:
            sites = json.load(open(site_list))
            expect = [t["task_id"] for s in sites["sites"] for t in s["tasks"]]
            missing_tasks = [t for t in expect if ("### Task %s" % t) not in text]
            if missing_tasks:
                problems.append("tasks with no verdict heading: %s" % ", ".join(missing_tasks))
        passed_ids = set()
        if verified_path:
            verified = json.load(open(verified_path))
            for v in verified.get("verified", []):
                if v.get("status") == "PASSED":
                    passed_ids.add(v["finding_id"])
        seg = text.split("## Cited findings", 1)
        cited_ids = set(re.findall(r"F-\d+", seg[1])) if len(seg) > 1 else set()
        dangling = sorted(cited_ids - passed_ids)
        if dangling:
            problems.append("findings not reproduction-verified: %s" % ", ".join(dangling))
        diss_req = None
        if cited in LADDER:
            diss_req = LADDER.index(cited) >= LADDER.index("editorial-with-dissents")
        report = {"verdict": verdict_path, "cited_rule": cited, "demoted_rule": demoted,
                  "manifest_sha256_ok": hdr.get("manifest_sha256") == man_sha,
                  "dissents_required": diss_req, "findings_cited": sorted(cited_ids),
                  "findings_dangling": dangling, "problems": problems, "passed": not problems}
        if report_path:
            json.dump(report, open(report_path, "w"), indent=2)
        if problems:
            print("AUDIT FAIL: " + "; ".join(problems))
        else:
            print("AUDIT PASS: cited %s <= demoted %s, %d finding(s) verified" % (cited, demoted, len(cited_ids)))
        return 0 if not problems else 3

    def main():
        a = sys.argv[1:]
        base = os.path.join(os.path.dirname(__file__), "..", "fixtures")
        if a and a[0] == "--self-test":
            rc = audit(os.path.join(base, "st-manifest-correlated.yaml"),
                       os.path.join(base, "st-verdict-majority.md"), None, "/tmp/st-audit-report.json")
            if rc == 0:
                print("SELF-TEST FAIL: the majority-citing fixture PASSED audit — the gate cannot refuse")
                return 1
            print("OBSERVED FIRING: majority-citing fixture verdict REFUSED by audit")
            return 0
        if len(a) < 3:
            sys.exit("demote: <manifest> <verdict> <verified-manifest> [report] [site-list] or --self-test")
        report = a[3] if len(a) > 3 else None
        site_list = a[4] if len(a) > 4 else None
        return audit(a[0], a[1], a[2], report, site_list)

    if __name__ == "__main__":
        sys.exit(main())
