    {{ strict() }}
    # ══ M14 · Publish + live gates (The Gas-Free Certificate) ══
    # The build is deterministic stdlib templating (no pandoc — that lesson is
    # paid). ONE push: digests are computed BEFORE the push and travel in the
    # published commit, so the deployed revision IS the verified revision
    # [R1/R2: the old flow pushed again after verifying, invalidating the
    # exact bytes the gates had just certified]. Pages enablement nests
    # branch/path inside source[] [R1/R2: top-level params 422'd and the poll
    # died 900s later]; an existing foreign gh-pages tip REFUSES unless
    # allow_force_publish [R3]; every live gate joins the deployed bytes to
    # THIS build's nonce, so neither a tampered local copy nor a stale
    # deployment can certify itself [R2].
    OWNER=$(jq -r .github_owner run/review-config.json)
    REPO=$(jq -r .repo_name run/review-config.json)
    URL=$(jq -r .site_url run/review-config.json)
    # NEVER-SOFTEN EDGE #2, runtime join half: the publish gate RE-RUNS the
    # audit command — no orchestration-layer bug can skip audit-before-publish
    bash scripts/demote.sh panel-manifest.yaml verdict.md verified-manifest.json /tmp/publish-audit.json prereg/site-list.json >/dev/null \
      || { echo "PUBLISH REFUSED: the audit does not pass against the current bytes"; exit 1; }
    python3 scripts/render-site.py "{{ workspace }}" site
    grep -q "Six Letterheads" site/index.html
    BID=$(sed -n 's/.*data-build-id="\([a-f0-9]*\)".*/\1/p' site/index.html | head -1)
    [ -n "$BID" ] || { echo "PUBLISH REFUSED: rendered site carries no build id"; exit 1; }
    LOCAL_SHA=$(sha256sum site/index.html | cut -d' ' -f1)
    # Digests computed PRE-push and shipped inside the single publish commit
    PUB=run/publish-repo
    rm -rf "$PUB"
    mkdir -p "$PUB"
    cp -r site/* "$PUB"/
    ( cd "$PUB"
      sha256sum index.html data/* > deployed.sha256
      git init -q -b gh-pages
      git add -A
      git -c user.name="six-letterheads" -c user.email="six-letterheads@users.noreply.github.com" \
        commit -qm "publish: the measured review (build $BID)"
    )
    # Force protection [R3]: refuse to overwrite an existing foreign gh-pages tip
    REMOTE_TIP=$(git ls-remote "https://github.com/$OWNER/$REPO.git" gh-pages 2>/dev/null | cut -f1)
    if [ -n "$REMOTE_TIP" ] && [ "$(jq -r .allow_force_publish run/review-config.json)" != "true" ]; then
      echo "PUBLISH REFUSED: $OWNER/$REPO already has a gh-pages branch (tip ${REMOTE_TIP:0:12}) — this gate will not force-overwrite it; pass --var allow_force_publish=true to override"
      exit 1
    fi
    gh repo create "$OWNER/$REPO" --public --source "$PUB" --remote origin --push >/dev/null 2>&1 || {
      ( cd "$PUB"
        git remote add origin "https://github.com/$OWNER/$REPO.git" 2>/dev/null || true
        if [ -n "$REMOTE_TIP" ]; then git push -q -f origin gh-pages; else git push -q origin gh-pages; fi )
    }
    gh api -X POST "repos/$OWNER/$REPO/pages" -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null 2>&1 \
      || gh api -X PUT "repos/$OWNER/$REPO/pages" -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null 2>&1 \
      || true
    DEADLINE=$(( SECONDS + 1800 ))
    until curl -sf "$URL" -o run/deployed.html 2>/dev/null; do
      if [ $SECONDS -ge $DEADLINE ]; then echo "PUBLISH FAIL: $URL did not go live within 1800s"; exit 1; fi
      sleep 15
    done
    grep -q "Six Letterheads" run/deployed.html || { echo "PUBLISH FAIL: deployed bytes are not the review"; exit 1; }
    grep -q "data-build-id=\"$BID\"" run/deployed.html || {
      echo "LIVE GATE FAIL: deployed bytes are build-stale (nonce $BID absent) — an old deployment answered"; exit 1; }
    DEPLOYED_SHA=$(sha256sum run/deployed.html | cut -d' ' -f1)
    [ "$DEPLOYED_SHA" = "$LOCAL_SHA" ] || {
      echo "LIVE GATE FAIL: deployed index bytes differ from the verified local build ($DEPLOYED_SHA != $LOCAL_SHA)"; exit 1; }
    # LIVE SEAM 1 — the deployed review passes the very engine it wields
    node scripts/engine-run.js --axe "$URL" > run/deployed-axe.json
    NV=$(jq '.violations | length' run/deployed-axe.json)
    if [ "$NV" != "0" ]; then
      echo "LIVE GATE FAIL: the deployed review carries $NV axe violation(s) — an inaccessible accessibility review is self-refuting"
      jq -r '.violations[] | .rule + " " + .selector' run/deployed-axe.json
      exit 1
    fi
    # LIVE SEAM 2 (Gas-Free) — recompute the census FROM THE DEPLOYED BYTES
    TMP=$(mktemp -d)
    curl -sf "$URL/data/raw-answers.jsonl" -o "$TMP/raw-answers.jsonl"
    curl -sf "$URL/data/ground-truth.jsonl" -o "$TMP/ground-truth.jsonl"
    curl -sf "$URL/data/panel-manifest.yaml" -o "$TMP/deployed-manifest.yaml"
    curl -sf "$URL/data/prereg-thresholds.yaml" -o "$TMP/th.yaml"
    python3 - "$TMP" <<'PYEOF'
    import json, os, sys
    d = sys.argv[1]
    seats = {}
    for line in open(os.path.join(d, "raw-answers.jsonl")):
        if not line.strip():
            continue
        row = json.loads(line)
        seats.setdefault(row["seat"], []).append(row)
    for sid, rows in sorted(seats.items()):
        with open(os.path.join(d, "answers-%d.jsonl" % sid), "w") as fh:
            for r in rows:
                fh.write(json.dumps(r) + "\n")
    print("reconstructed %d seat answer files from deployed bytes" % len(seats))
    PYEOF
    python3 scripts/census-recheck.py "$TMP" "$TMP/ground-truth.jsonl" "$TMP/th.yaml" "$TMP/deployed-manifest.yaml" | tee run/live-recompute.txt
    grep -q "independent enumeration matches" run/live-recompute.txt || {
      echo "LIVE GATE FAIL: the deployed data does not recompute the published numbers — tampered or drifted bytes"; exit 1; }
    # Keyboard spot-check — recorded, asserted on the DEPLOYED page
    URLVAL="$URL" node - <<'JSEOF' > run/keyboard-probe.json
    const path = require('path');
    const pwPath = require.resolve('playwright', { paths: [path.join(process.cwd(), 'engines')] });
    const { chromium } = require(pwPath);
    (async () => {
      const b = await chromium.launch();
      const p = await b.newPage();
      await p.goto(process.env.URLVAL, { waitUntil: 'load', timeout: 90000 });
      const count = await p.evaluate(() => document.querySelectorAll('a[href], button, input, select, textarea').length);
      await p.keyboard.press('Tab');
      const first = await p.evaluate(() => document.activeElement ? document.activeElement.tagName : 'none');
      console.log(JSON.stringify({ url: process.env.URLVAL, build_id: document.documentElement.getAttribute('data-build-id'), focusable_count: count, first_tab_focus: first }));
      await b.close();
    })().catch(e => { console.error(e.message); process.exit(2); });
    JSEOF
    jq -e ".build_id == \"$BID\" and (.focusable_count >= 1) and (.first_tab_focus != \"none\")" run/keyboard-probe.json >/dev/null || {
      echo "KEYBOARD SPOT-CHECK FAIL: wrong build answered, or the first Tab press focuses nothing"; exit 1; }
    echo "LIVE SEAM VERIFIED (one push): $URL answers at build $BID with byte-identical index; axe clean; census recomputes from deployed bytes; keyboard spot-check recorded" | tee run/deploy-log.txt
    git add -A
    git diff --cached --quiet || git commit -qm "publish: live gates green against the deployed URL (one push, build $BID)"

    {% elif stage == 15 %}
    You are the campaign closer: the corpus consumes its own proof, and the
    concert leaves nothing running behind it.
    Read {{ workspace }}/panel-manifest.yaml, verdict.md, verdict-naive.md,
    run/seat-matrix.json, and the published URL from run/review-config.json.

    {{ ai_ground_rules() }}

    ## Movement 15 · Re-absorb + checkout (Proof-Carrying Artifact + Demobilization)

    ### Deliverables
    1. `{{ workspace }}/examples/upgrade-walkthrough.md` — the corpus
       re-absorption, opening with a machine-checkable fenced ```yaml block
       shaped EXACTLY like (substitute the REAL measured values — the
       validation parses this block NUMERICALLY against the manifest [R1: no
       more float-as-string grep], so copy the numbers from
       panel-manifest.yaml exactly):
       measured:
         rho_bar: <real value from panel-manifest.yaml>
         n_eff: <real value from panel-manifest.yaml>
         demoted_to: <real aggregation_rule_demoted_to>
       upgrade_map:
         - consumer: cathedral-family-gate
           asserted_before: "distinct vendor family asserted from instrument names"
           measured_after: "join on panel-manifest family_census (rho_bar=<real>, n_eff=<real>)"
           manifest_ref: panel-manifest.yaml
         - consumer: dispensary-corroboration-min
           asserted_before: "corroboration_min: 2, counted from vendors"
           measured_after: "corroboration_min derived from measured n_eff"
           manifest_ref: panel-manifest.yaml
       followed by the worked example prose: exactly how each score's gate
       config changes shape, with the join it would run.
    2. `{{ workspace }}/report.md` — the campaign report with literal sections
       `## The Finding`, `## The Measurement`, `## The Demotion`, `## The
       Divergence`, `## What Changes For The Next Concert` — the six
       letterheads finding stated plainly (one model family voting six times
       under six instrument names, one wearing Anthropic branding), both
       censuses (letterheads vs DERIVED families), the CENTERED rho_bar /
       n_eff / the demoted rung, any leak_suspect seats, and where the naive
       cell-majority and demoted fan-ins disagree.
    3. Teardown — RECORDED CUSTODY, not ambient pattern matching, and no LLM
       discretion in the kill decision [R1/R2/R3]: run exactly
       bash {{ workspace }}/scripts/teardown.sh | tee {{ workspace }}/run/teardown.txt
       The script kills exactly the PIDs the movements recorded under run/pids/
       and verifies every recorded port (run/ports.txt) is free; it prints
       NO RESIDUAL PROCESSES only when that is true. Do not kill anything the
       script did not name. The movement gate re-runs the script
       independently, so a hand-written receipt proves nothing.
    4. `git add -A && git commit -m "closeout: re-absorption walkthrough + campaign report"`

    {% endif %}

# ═══════════════════════════════════════════════════════════════════════════════
# VALIDATIONS — staged fail-fast (Commissioning Cascade: receipt before
# structure before join). Every movement's generic outcome gate runs FIRST
# (scripts/movement-gate.sh N — the validation-layer macro); movement-specific
# command rules follow. `condition: stage == N` selects the movement; the
# `stage:` field orders fail-fast WITHIN a sheet. file_exists proves nothing
# here; every rule asserts on bodies, digests, diffs or joins.
# ═══════════════════════════════════════════════════════════════════════════════

validations:
  # ── M1 · Commission: engines fire, gates refuse, everything OBSERVED ────────
  - type: command_succeeds
    command: 'bash "{workspace}/scripts/movement-gate.sh" 1'
    condition: "stage == 1"
    stage: 1
    description: "Commissioning receipts: 3 engines + >=6 designed checks observed firing + freeze"
  - type: command_succeeds
    command: |
      for R in image-alt html-has-lang label color-contrast; do
        jq -e --arg r "$R" '.violations | map(select(.rule == $r)) | length >= 1' "{workspace}/run/bad-axe.json" >/dev/null \
          || { echo "planted rule $R did not fire"; exit 1; }
      done
      jq -e '.violations | length == 0' "{workspace}/run/good-axe.json" >/dev/null
    condition: "stage == 1"
    stage: 2
    description: "Engine joins: every planted violation fired on the bad fixture; the clean fixture is clean"
  - type: command_succeeds
    command: |
      grep -q "OBSERVED FIRING: correlated" "{workspace}/run/st-census.txt"
      grep -q "OBSERVED FIRING" "{workspace}/run/st-demote.txt"
      grep -q "OBSERVED FIRING" "{workspace}/run/st-fanin.txt"
      grep -q "OBSERVED FIRING" "{workspace}/run/st-repro.txt"
    condition: "stage == 1"
    stage: 3
    description: "Every gate commissioned with its designed failure observed firing"
  - type: command_succeeds
    command: |
      for k in sr kb cog aud; do
        p="{score_dir}/frames/frame-$k.md"
        test -s "$p" || { echo "missing frame $p"; exit 1; }
        grep -q "^FRAME: $k$" "$p" || { echo "no marker in frame $k"; exit 1; }
        for o in sr kb cog aud; do
          if [ "$o" != "$k" ] && grep -q "^FRAME: $o$" "$p"; then
            echo "blindness violation: frame $k names frame $o"; exit 1
          fi
        done
        grep -q "Verdict: PASS" "$p" || { echo "no output contract in frame $k"; exit 1; }
      done
      echo "blindness gate ok: four frames, each naming only itself"
    condition: "stage == 1"
    stage: 3
    description: "Blindness gate: each shipped frame cadenza carries only its own lens marker + its contract"

  # ── M2 · Seat matrix: body-asserted liveness + the divergence recorded ──────
  - type: command_succeeds
    command: 'bash "{workspace}/scripts/movement-gate.sh" 2'
    condition: "stage == 2"
    stage: 1
    description: "Seat matrix: 10 seats, all live, letterhead census > probed family census"
  - type: command_succeeds
    command: |
      jq -s 'all(.[]; .model_route != "" and .model_route != "unresolved" and .probe_body == true)' "{workspace}/run/seat-matrix.jsonl" >/dev/null \
        || { echo "a seat's probed route is unresolved or its body probe never asserted"; exit 1; }
      jq -s 'all(.[]; .family_source == "derived-from-probed-route" and .family == .declared_family)' "{workspace}/run/seat-matrix.jsonl" >/dev/null \
        || { echo "a seat's family is not derived from its route, or derived != declared (roster drift)"; exit 1; }
      jq -e '.divergence.recorded_before_measurement == true' "{workspace}/run/seat-matrix.json" >/dev/null
    condition: "stage == 2"
    stage: 2
    description: "Every seat body-probed with a resolved route; families DERIVED from routes and matching the declared roster; the divergence predates all measurement"

  # ── M3 · The Freeze: total thresholds, robots probed, user tasks ────────────
  - type: command_succeeds
    command: 'bash "{workspace}/scripts/movement-gate.sh" 3'
    condition: "stage == 3"
    stage: 1
    description: "Freeze receipt: FREEZE.sha + freeze commit + >=6 sites in the list"
  - type: command_succeeds
    command: |
      python3 - <<'PYEOF'
      import sys
      import yaml
      th = yaml.safe_load(open("{workspace}/prereg/thresholds.yaml"))
      ladder, bands = th["ladder"], th["bands"]
      def match(rho, ratio):
          for band in bands:
              ok = True
              if "rho_bar_lt" in band and not (rho < band["rho_bar_lt"]):
                  ok = False
              if "n_eff_ratio_ge" in band and not (ratio >= band["n_eff_ratio_ge"]):
                  ok = False
              if ok:
                  return band["rung"]
          return None
      reached = set()
      pts = 0
      rank = {r: i for i, r in enumerate(ladder)}
      for i in range(21):
          for j in range(21):
              rho, ratio = i * 0.05, j * 0.05
              r = match(rho, ratio)
              pts += 1
              if r is None:
                  sys.exit("threshold table NOT TOTAL at rho=%s ratio=%s" % (rho, ratio))
              reached.add(r)
      missing = [r for r in ladder if r not in reached]
      if missing:
          sys.exit("threshold table not exhaustive — unreachable rungs: %s" % missing)
      for j in range(21):
          ratio = j * 0.05
          prev = -1
          for i in range(21):
              rho = i * 0.05
              cur = rank[match(rho, ratio)]
              if cur < prev:
                  sys.exit("threshold table not monotone: authority INCREASES as rho grows at ratio=%s (rho=%s -> %s)" % (ratio, rho, ladder[cur]))
              prev = cur
      print("thresholds total, exhaustive and monotone over %d grid points" % pts)
      PYEOF
    condition: "stage == 3"
    stage: 2
    description: "Demotion table is total, exhaustive (all rungs reachable) and MONOTONE (authority never increases as correlation grows)"
  - type: command_succeeds
    command: |
      for f in "{workspace}"/prereg/robots/*.txt; do test -s "$f" || { echo "empty robots transcript: $f"; exit 1; }; done
      jq -e '[.sites[].pages[] | select(.robots_disposition == "disallowed")] | length == 0' "{workspace}/prereg/site-list.json" >/dev/null
      python3 - <<'PYEOF'
      import json, os
      from urllib.robotparser import RobotFileParser
      sites = json.load(open(os.path.join("{workspace}", "prereg", "site-list.json")))
      for s in sites["sites"]:
          rp = RobotFileParser()
          rp.parse(open(os.path.join("{workspace}", "prereg", "robots", s["slug"] + ".txt")).read().splitlines())
          for p in s["pages"]:
              if not rp.can_fetch("*", p["url"]):
                  sys_exit = "robots PARSER refutes the disposition: %s disallows %s" % (s["slug"], p["url"])
                  raise SystemExit(sys_exit)
          pages = [p["page_id"] for p in s["pages"]]
          assert len(pages) == len(set(pages)), "duplicate page_id in site %s" % s["slug"]
          for t in s["tasks"]:
              assert t.get("page") in pages, "task %s names page %r which site %s does not declare" % (t["task_id"], t.get("page"), s["slug"])
      print("robots join: every archived transcript PARSES and allows every selected url; every task joins a declared page")
      PYEOF
    condition: "stage == 3"
    stage: 2
    description: "Robots transcripts are PARSED against the selected URLs (not self-attested); page ids unique; every task joins a declared page"
  - type: command_succeeds
    command: |
      python3 -c "
      import json, re
      sites = json.load(open('{workspace}/prereg/site-list.json'))
      phrases = [t['phrasing'] for s in sites['sites'] for t in s['tasks']]
      assert phrases, 'no tasks declared'
      empty = [p for p in phrases if not p or not p.strip()]
      assert not empty, 'empty task phrasings: %d' % len(empty)
      actorless = [p for p in phrases if not re.search(r'(?i)(user|person|visitor|rider|reader|someone|anyone)', p)]
      assert not actorless, 'phrasings with no person as actor (must be user tasks, not checklist items): %s' % actorless[:3]
      print('phrasing: %d user-task phrasings, all name a person' % len(phrases))
      "
    condition: "stage == 3"
    stage: 3
    description: "Task phrasings are user tasks naming a person, none empty"

  # ── M4 · Pinned evidence: sha round-trip + task coverage ────────────────────
  - type: command_succeeds
    command: 'bash "{workspace}/scripts/movement-gate.sh" 4'
    condition: "stage == 4"
    stage: 1
    description: "sha256 round-trip clean; >=15 pages pinned; task coverage join green"
  - type: command_succeeds
    command: |
      jq -e 'all(.pages[]; (.file | endswith(".dom.html")) and has("pinned_at"))' "{workspace}/evidence/pinned.json" >/dev/null
      grep -l '<!-- pinned' "{workspace}"/evidence/*.dom.html | wc -l | grep -qv '^0$'
    condition: "stage == 4"
    stage: 2
    description: "Every pinned page carries an embedded fetch timestamp"

