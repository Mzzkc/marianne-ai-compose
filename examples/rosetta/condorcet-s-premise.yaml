         jq -e '.mutations | map(select(.flipped == true)) | length >= 1' run/self-test-log.json >/dev/null ;;
      8) F="calibration/answers-${2:?instance}.jsonl"
         test -s "$F"
         jq -s 'length == 72 and all(.[]; has("item_id") and has("answer"))' "$F" >/dev/null
         test ! -e calibration/ground-truth.jsonl || { echo "gate 8: the sealed key must be ABSENT while jurors answer"; exit 1; } ;;
      9) test -s panel-manifest.yaml
         grep -q "independent enumeration matches" run/census-recheck.txt ;;
      10) F="panel/panel-${2:?instance}.md"
           test -s "$F"
           grep -q "^SEAT .\+ FRAME" "$F"
           for T in $(jq -r '.sites[].tasks[].task_id' prereg/site-list.json); do
             grep -q "^### Task $T\$" "$F" || { echo "gate 10: task $T missing from $F"; exit 1; }
           done ;;
      11) jq -e '.counts.verified >= 1' verified-manifest.json >/dev/null
           test -s verdict-naive.md
           grep -q "aggregation_rule: majority" verdict-naive.md ;;
      12) test -s verdict.md
           grep -q "## Divergence" verdict.md
           test -s triangulation.yaml ;;
      13) jq -e '.fixture_refused == true' run/audit-report.json >/dev/null
         jq -e '.production.passed == true' run/audit-report.json >/dev/null ;;
      14) grep -q "LIVE SEAM VERIFIED" run/deploy-log.txt
          test -s site/data/panel-manifest.yaml ;;
      15) bash scripts/teardown.sh > run/teardown-verify.txt 2>&1
          grep -q "NO RESIDUAL PROCESSES" run/teardown-verify.txt
          grep -q "upgrade_map:" examples/upgrade-walkthrough.md
          grep -q "measured:" examples/upgrade-walkthrough.md ;;
      *) echo "movement-gate: unknown movement $M"; exit 1 ;;
    esac
    echo "movement-gate $M: outcome gate PASS"
    SCRIPTEOF

