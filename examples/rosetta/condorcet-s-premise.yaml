        fi
      elif [ "$kind" = "dom-invariant" ]; then
        pat=$(echo "$1" | jq -r .ref.pattern)
        dom="$EVDIR/$page.dom.html"
        if [ ! -f "$dom" ]; then echo "FAILED:no-pinned-page"; return; fi
        if grep -q -- "$pat" "$dom"; then echo "PASSED"; else echo "FAILED:dom-invariant-not-found"; fi
      elif [ "$kind" = "script" ]; then
        scr=$(echo "$1" | jq -r .ref.script); exp=$(echo "$1" | jq -r .ref.expect)
        case "$scr" in
          scripts/*) ;;
          *) echo "FAILED:script-out-of-scope"; return ;;
        esac
        case "$scr" in
          *..*) echo "FAILED:script-out-of-scope"; return ;;
        esac
        if [ ! -f "$scr" ]; then echo "FAILED:script-missing"; return; fi
        if bash "$scr" 2>/dev/null | grep -q -- "$exp"; then echo "PASSED"; else echo "FAILED:script-expectation-missed"; fi
      else
        echo "FAILED:unknown-kind"
      fi
