    #!/usr/bin/env node
    // Renders every declared page from prereg/site-list.json, saves a DOM snapshot
    // (+ fetch-timestamp comment), screenshot, and a PER-PAGE HAR (a fresh
    // context per page) [R2: one session-wide HAR was not the promised per-page
    // record]. Per-page fault isolation [R1/R2: one slow or hostile civic page
    // used to abort the entire capture] — a failed page is RECORDED and the
    // sweep continues; the run fails only if fewer than 15 pages pin. Refuses
    // (skips, loudly) any page whose robots disposition is not 'allowed' — the
    // disposition itself was probed and archived at M3.
    const { chromium } = require(require.resolve('playwright', { paths: [require('path').join(__dirname, '..', 'engines')] }));
    const fs = require('fs');
    const path = require('path');
    function arg(k, d) { const i = process.argv.indexOf(k); return i > -1 ? process.argv[i + 1] : d; }
    (async () => {
      const sites = JSON.parse(fs.readFileSync(arg('--sites', 'prereg/site-list.json'), 'utf8'));
      const outDir = arg('--out', 'evidence');
      fs.mkdirSync(outDir, { recursive: true });
      const browser = await chromium.launch();
      const ts = new Date().toISOString();
      const pinned = [];
      const failed = [];
      for (const s of sites.sites) {
        for (const p of s.pages) {
          if (p.robots_disposition !== 'allowed') { console.error('SKIP robots=' + p.robots_disposition + ': ' + p.url); continue; }
          const base = path.join(outDir, s.slug + '.' + p.page_id);
          const ctx = await browser.newContext({ recordHar: { path: base + '.har' } });
          try {
            const page = await ctx.newPage();
            await page.goto(p.url, { waitUntil: 'load', timeout: 90000 });
            const html = await page.content();
            fs.writeFileSync(base + '.dom.html', '<!-- pinned ' + ts + ' -->\n' + html);
            await page.screenshot({ path: base + '.png' });
            pinned.push({ site: s.slug, page: p.page_id, url: p.url, file: base + '.dom.html', pinned_at: ts });
          } catch (e) {
            const first = String(e).split('\n')[0];
            failed.push({ site: s.slug, page: p.page_id, url: p.url, error: first });
            console.error('FETCH FAILED (recorded, continuing): ' + p.url + ' — ' + first);
          } finally {
            await ctx.close().catch(() => {});
          }
        }
      }
      await browser.close();
      fs.writeFileSync(path.join(outDir, 'pinned.json'), JSON.stringify({ pinned_at: ts, pages: pinned, failed: failed }, null, 2));
      console.log('pinned ' + pinned.length + ' pages at ' + ts + ' (' + failed.length + ' failed fetches recorded)');
      if (pinned.length < 15) { console.error('PIN FAIL: only ' + pinned.length + ' pages pinned (< 15)'); process.exit(1); }
    })().catch(e => { console.error('pin-pages.js:', e.message); process.exit(2); });
