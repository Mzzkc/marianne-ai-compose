    #!/usr/bin/env python3
    """Typed-Force fan-in typecheck, run on BOTH fan-ins. Enforces the frozen
    header contract {input_type, aggregation_rule, axioms_dropped,
    declared_authority}; an EMPTY axioms_dropped is PERJURY (the aggregation
