    quote both rule lines verbatim, which is one line twice when they agree.
    Recounts the vote FROM the panel files at CELL granularity — every
    (seat, frame) cell conserved and compared EXACTLY against votes.json
    [R2: the old tally keyed votes[task][seat] and silently overwrote three of
    every seat's four frames]; recomputes each task's naive_category from the
    votes and joins it against triangulation; and admits demoted_category only
    where the demoted rung permits — genuine MAJORITY is shippable under
    editorial rungs [R1], and under refusal the task list must be EMPTY with a
    stated refusal_reason [R2: the prompt and checker used to contradict]."""
    import glob, json, os, re, sys
    import yaml

    LADDER = ["majority", "weighted-correlation", "editorial-with-dissents", "refusal"]
    PERMITTED = {"majority": {"UNANIMOUS", "MAJORITY", "SPLIT", "UNIQUE"},
                 "weighted-correlation": {"MAJORITY", "SPLIT", "UNIQUE"},
                 "editorial-with-dissents": {"MAJORITY", "SPLIT", "UNIQUE"},
                 "refusal": set()}

    def header_of(path):
        text = open(path).read()
        m = re.search(r"```yaml\n(.*?)```", text, re.S)
        if not m:
            return None, text
        return yaml.safe_load(m.group(1)), text

    def header_problems(name, hdr):
        probs = []
        if hdr is None:
            return ["%s fan-in has no typed yaml header" % name]
        for k in ("input_type", "aggregation_rule", "axioms_dropped", "declared_authority"):
            if not hdr.get(k):
                probs.append("%s fan-in header missing/empty %s%s" % (name, k, " — empty axioms_dropped is perjury" if k == "axioms_dropped" else ""))
        return probs

    def tally_cells(panel_dir):
        votes = {}
        files = 0
        for path in sorted(glob.glob(os.path.join(panel_dir, "panel-*.md"))):
            text = open(path).read()
            hm = re.search(r"SEAT (\d+) FRAME (\w+)", text)
            if not hm:
                continue
            files += 1
            cell = "%s:%s" % (hm.group(1), hm.group(2))
            for tm in re.finditer(r"### Task ([\w.-]+)", text):
                task = tm.group(1)
                seg = text[tm.end():].split("### Task")[0]
                vm = re.search(r"Verdict: (PASS|FAIL|ABSTAIN)", seg)
                if vm:
                    votes.setdefault(task, {})[cell] = vm.group(1)
        return votes, files

    def naive_category(per):
        vals = list(per.values())
        counts = {}
        for v in vals:
            counts[v] = counts.get(v, 0) + 1
        non_abstain = [v for v in vals if v != "ABSTAIN"]
        if non_abstain and len(non_abstain) == len(vals) and len(counts) == 1:
            return "UNANIMOUS", counts
        for v, c in counts.items():
            if v != "ABSTAIN" and c * 2 > len(vals):
                return "MAJORITY", counts
        if len(non_abstain) == 1:
            return "UNIQUE", counts
        return "SPLIT", counts

    def main():
        a = sys.argv[1:]
        base = os.path.join(os.path.dirname(__file__), "..", "fixtures")
        if a and a[0] == "--self-test":
            hdr, _ = header_of(os.path.join(base, "st-verdict-empty-axioms.md"))
            probs = header_problems("fixture", hdr)
            if probs:
                print("OBSERVED FIRING: empty-axioms fixture refused (%s)" % probs[0])
                return 0
            print("SELF-TEST FAIL: the empty-axioms fixture PASSED typecheck")
            return 1
        verdict, naive, manifest, triangulation, panel_dir, votes_json = a[0:6]
        problems = []
        hdr_v, text_v = header_of(verdict)
        hdr_n, text_n = header_of(naive)
        problems += header_problems("demoted", hdr_v)
        problems += header_problems("naive", hdr_n)
        if hdr_n:
            if hdr_n.get("aggregation_rule") != "majority":
                problems.append("naive fan-in must cite exactly 'majority' (it is what an un-audited score ships)")
            if hdr_n.get("input_type") != "cell-verdicts":
                problems.append("naive fan-in input_type must be 'cell-verdicts' (40 seat×frame cells as voters)")
            if not str(hdr_n.get("declared_authority", "")).startswith("cell-count"):
                problems.append("naive fan-in declared_authority must start 'cell-count'")
        if hdr_v:
            if hdr_v.get("input_type") != "seat-synthesis-under-rule":
                problems.append("demoted verdict input_type must be 'seat-synthesis-under-rule'")
            if hdr_v.get("declared_authority") != "measured-panel":
                problems.append("demoted verdict declared_authority must be 'measured-panel'")
        votes, files = tally_cells(panel_dir)
        vj = json.load(open(votes_json))
        if votes != vj.get("votes", {}):
            problems.append("vote recount mismatch: panel files and votes.json disagree")
        if files == 0:
            problems.append("no stamped panel files found")
        else:
            for t, per in votes.items():
                if len(per) != files:
                    problems.append("task %s: %d cells recounted across %d panel files — cells lost" % (t, len(per), files))
        man = yaml.safe_load(open(manifest))
        demoted = man["aggregation_rule_demoted_to"]
        if hdr_v:
            cited = hdr_v.get("aggregation_rule")
            if cited in LADDER and LADDER.index(cited) < LADDER.index(demoted):
                problems.append("demoted verdict cites '%s' above manifest rung '%s'" % (cited, demoted))
        if "## Divergence" not in text_v:
            problems.append("divergence section (## Divergence) missing")
        if ("aggregation_rule: majority" not in text_v) or (("aggregation_rule: %s" % demoted) not in text_v):
            problems.append("divergence section must quote both rule lines verbatim (they may coincide — quote the line either way)")
        tri = yaml.safe_load(open(triangulation)) or {}
        rows = tri.get("tasks") or []
        if demoted == "refusal":
            if rows:
                problems.append("under refusal no task may ship a category — tasks must be empty with refusal_reason stated")
            if not str(tri.get("refusal_reason") or "").strip():
                problems.append("refusal requires a stated refusal_reason")
        else:
            vtasks = set(votes)
            ttasks = set(r.get("task_id") for r in rows)
            if vtasks != ttasks:
                problems.append("triangulation task set (%d) != vote task set (%d)" % (len(ttasks), len(vtasks)))
            for r in rows:
                per = votes.get(r.get("task_id"), {})
                cat, _ = naive_category(per)
                if r.get("naive_category") != cat:
                    problems.append("task %s naive_category %s != recomputed %s" % (r.get("task_id"), r.get("naive_category"), cat))
                if r.get("demoted_category") not in PERMITTED.get(demoted, set()):
                    problems.append("task %s ships category %s not permitted under %s" % (r.get("task_id"), r.get("demoted_category"), demoted))
        for task, per in votes.items():
            rec = (vj.get("tally", {}).get(task, {}) or {}).get("counts", {})
            counts = naive_category(per)[1]
            if counts != rec:
                problems.append("tally drift at %s (recount %s vs votes.json %s)" % (task, counts, rec))
                break
        print("fanin-typecheck: " + ("PASS" if not problems else "FAIL: " + "; ".join(problems)))
        return 0 if not problems else 4

    if __name__ == "__main__":
        sys.exit(main())
