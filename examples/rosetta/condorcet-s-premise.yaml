        non_abstain = [v for v in vals if v != "ABSTAIN"]
        if non_abstain and len(non_abstain) == len(vals) and len(counts) == 1:
            return "UNANIMOUS", counts
        for v, c in counts.items():
            if v != "ABSTAIN" and c * 2 > len(vals):
                return "MAJORITY", counts
        if len(non_abstain) == 1:
            return "UNIQUE", counts
        return "SPLIT", counts

    def main():
        panel_dir, manifest_path, out_md, out_votes = sys.argv[1:5]
        man = yaml.safe_load(open(manifest_path))
        votes = {}
        for path in sorted(glob.glob(os.path.join(panel_dir, "panel-*.md"))):
            text = open(path).read()
            hm = re.search(r"SEAT (\d+) FRAME (\w+)", text)
            if not hm:
                continue
            cell = "%s:%s" % (hm.group(1), hm.group(2))
            for tm in re.finditer(r"### Task ([\w.-]+)", text):
                task = tm.group(1)
                seg = text[tm.end():].split("### Task")[0]
                vm = re.search(r"Verdict: (PASS|FAIL|ABSTAIN)", seg)
                if vm:
                    votes.setdefault(task, {})[cell] = vm.group(1)
        n_cells = sum(len(v) for v in votes.values())
        lines = []
        lines.append("```yaml")
        lines.append("input_type: cell-verdicts")
        lines.append("aggregation_rule: majority")
        lines.append("axioms_dropped:")
