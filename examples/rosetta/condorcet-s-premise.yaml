    cat > scripts/census-recheck.py <<'SCRIPTEOF'
    #!/usr/bin/env python3
    """Concurrent Count: a SECOND, independently written census path. Computes
    pairwise joint-error counts ITEM-MAJOR (per item, over the SET of wrong
    seats) instead of seat-major set intersections, rebuilds marginals, the
    CENTERED rho_bar, design effect and n_eff, re-applies the threshold join,
    and compares against the manifest EXACTLY (tolerance 1e-6) over the FULL
    matrix M — every diagonal and every ordered pair, not one representative
    cell [R2] — plus mean_joint_error, rho_bar, n_eff and the rung. Any
    mismatch VOIDS the manifest."""
    import json, os, sys
    import yaml

    def load_jsonl(path):
        rows = []
        with open(path) as fh:
            for line in fh:
                if line.strip():
                    rows.append(json.loads(line))
        return rows

    def main():
        answers_dir, gt_path, th_path, man_path = sys.argv[1:5]
        man = yaml.safe_load(open(man_path))
        key = {}
        for r in load_jsonl(gt_path):
            key[r["item_id"]] = r["answer"]
        seat_ids = man["seats"]
        n = len(seat_ids)
        K = len(key)
        per_item = {}
        for iid in key:
            per_item[iid] = set()
        for sid in seat_ids:
            path = os.path.join(answers_dir, "answers-%d.jsonl" % sid)
            if not os.path.exists(path):
                for iid in key:
                    per_item[iid].add(sid)
                continue
            ans = {}
            for row in load_jsonl(path):
                ans[row["item_id"]] = row.get("answer", "UNANSWERED")
            for iid in key:
                v = ans.get(iid, "UNANSWERED")
                if v == "UNANSWERED" or v != key[iid]:
                    per_item[iid].add(sid)
        pair = {}
        marg = dict((sid, 0) for sid in seat_ids)
        for iid in key:
            ws = sorted(per_item[iid])
            for s in ws:
                marg[s] += 1
            for x in range(len(ws)):
                for y in range(x + 1, len(ws)):
                    pk = (ws[x], ws[y])
                    pair[pk] = pair.get(pk, 0) + 1
        p = dict((s, (marg[s] / K) if K else 0.0) for s in seat_ids)
        Mchk = {}
        for x in seat_ids:
            for y in seat_ids:
                if x == y:
                    Mchk["%d,%d" % (x, y)] = p[x]
                else:
                    k1, k2 = (x, y) if x < y else (y, x)
                    Mchk["%d,%d" % (x, y)] = (pair.get((k1, k2), 0) / K) if K else 0.0
        off = [Mchk["%d,%d" % (x, y)] for i, x in enumerate(seat_ids) for j, y in enumerate(seat_ids) if i != j]
        mean_joint = (sum(off) / len(off)) if off else 0.0
        rhos = []
        for i in range(n):
            for j in range(i + 1, n):
                x, y = seat_ids[i], seat_ids[j]
                den = (p[x] * (1 - p[x]) * p[y] * (1 - p[y])) ** 0.5
                if den <= 0.0:
                    r = 0.0
                else:
                    r = (Mchk["%d,%d" % (x, y)] - p[x] * p[y]) / den
                rhos.append(max(-1.0, min(1.0, r)))
        rho = (sum(rhos) / len(rhos)) if rhos else 0.0
        deff = 1.0 + (n - 1) * rho
        n_eff = (n / deff) if deff > 1.0 else float(n)
        ratio = (n_eff / n) if n else 0.0
        th = yaml.safe_load(open(th_path))
        rung = None
        for band in th["bands"]:
            ok = True
            if "rho_bar_lt" in band and not (rho < band["rho_bar_lt"]):
                ok = False
            if "n_eff_ratio_ge" in band and not (ratio >= band["n_eff_ratio_ge"]):
                ok = False
            if ok:
                rung = band["rung"]
                break
        errs = []
        mkeys = set(man["M"].keys()) | set(Mchk.keys())
        for mk in sorted(mkeys):
            got = Mchk.get(mk)
            exp = man["M"].get(mk)
            if got is None or exp is None:
                errs.append("M[%s]: present on one side only (recheck %r vs manifest %r)" % (mk, got, exp))
            elif abs(got - exp) > 1e-6:
                errs.append("M[%s]: recheck %.6f != manifest %.6f" % (mk, got, exp))
        if abs(rho - man["rho_bar"]) > 1e-6:
            errs.append("rho_bar: recheck %.6f != manifest %.6f" % (rho, man["rho_bar"]))
        if abs(mean_joint - man.get("mean_joint_error", 0.0)) > 1e-6:
            errs.append("mean_joint_error: recheck %.6f != manifest %.6f" % (mean_joint, man.get("mean_joint_error", 0.0)))
        if abs(n_eff - man["n_eff"]) > 1e-6:
            errs.append("n_eff: recheck %.6f != manifest %.6f" % (n_eff, man["n_eff"]))
        if rung != man["aggregation_rule_demoted_to"]:
            errs.append("rung: recheck %s != manifest %s" % (rung, man["aggregation_rule_demoted_to"]))
        if errs:
            print("RECHECK VOIDED THE MANIFEST:")
            for e in errs:
                print("  " + e)
            return 5
        print("recheck: independent enumeration matches the FULL matrix (%d cells), rho, n_eff, rung" % len(Mchk))
        return 0

    if __name__ == "__main__":
        sys.exit(main())
