    #!/usr/bin/env node
    // axe-core over a file or a LIVE url. Exit 1 when a --rule/--selector probe
    // does NOT reproduce — that exit code is the reproducer harness's evidence.
    const path = require('path');
    const pwPath = require.resolve('playwright', { paths: [path.join(__dirname, '..', 'engines')] });
    const { chromium } = require(pwPath);
    function arg(k, d) { const i = process.argv.indexOf(k); return i > -1 ? process.argv[i + 1] : d; }
    (async () => {
      const target = arg('--axe', null);
      if (!target) { console.error('engine-run.js: --axe <file-or-url> required'); process.exit(2); }
      const rule = arg('--rule', null);
      const sel = arg('--selector', null);
      const url = target.startsWith('http') ? target : 'file://' + path.resolve(target);
      const browser = await chromium.launch();
      const page = await browser.newPage();
      await page.goto(url, { waitUntil: 'load', timeout: 90000 });
      await page.addScriptTag({ path: path.join(__dirname, '..', 'engines', 'node_modules', 'axe-core', 'axe.min.js') });
      const results = await page.evaluate(async () => {
        const r = await window.axe.run(document, { runOnly: { type: 'tag', values: ['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa'] } });
        return r.violations.map(v => ({
          rule: v.id,
          selector: (v.nodes && v.nodes[0] && v.nodes[0].target) ? v.nodes[0].target.join(' ') : '',
          severity: v.impact || 'other', help: v.help
        }));
      });
      let hit = rule ? results.filter(v => v.rule === rule) : results;
      if (sel) hit = hit.filter(v => v.selector === sel || v.selector.indexOf(sel) > -1);
      console.log(JSON.stringify({ engine: 'axe-core', url: target, rule: rule, selector: sel, count: hit.length, violations: hit }, null, 2));
      await browser.close();
      if (rule && hit.length === 0) process.exit(1);
    })().catch(e => { console.error('engine-run.js:', e.message); process.exit(2); });
