    #!/usr/bin/env python3
    """Builds the published review. THE DIVERGENCE BANNER IS THE FIRST CONTENT
    BLOCK (a practitioner must see what was reviewed, how sure the panel is,
    and why that level of sure within ten seconds). The page carries a
    per-build nonce (sha of manifest+verdict bytes, embedded as data-build-id)
    so the M14 live gates join the DEPLOYED bytes to THIS build — stale bytes
    cannot satisfy them [R2]. The data/ bundle publishes the reproduction
    substrate — raw answers, ground truth, votes, verified pointers, the
    census recheck + reproducer scripts, engine pins, evidence digests and the
    original finding pointers [R2: 'reproduce any finding from its pointer'
    used to be a promise with no shipped machinery]. The page itself must be
    accessible — lang, skip link, semantic landmarks, contrast-safe palette —
    because an inaccessible accessibility review is self-refuting; M14 runs
    the very engines we wield against the DEPLOYED page."""
    import hashlib, json, os, shutil, sys
    import yaml

    def esc(s):
        return (str(s).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;"))

    def main():
        ws, out = sys.argv[1], sys.argv[2]
        man = yaml.safe_load(open(os.path.join(ws, "panel-manifest.yaml")))
        naive = open(os.path.join(ws, "verdict-naive.md")).read()
        verdict = open(os.path.join(ws, "verdict.md")).read()
        verified = json.load(open(os.path.join(ws, "verified-manifest.json")))
        bid = hashlib.sha256(open(os.path.join(ws, "panel-manifest.yaml"), "rb").read()
                             + open(os.path.join(ws, "verdict.md"), "rb").read()).hexdigest()[:16]
        data_dir = os.path.join(out, "data")
        os.makedirs(data_dir, exist_ok=True)
        os.makedirs(os.path.join(data_dir, "findings"), exist_ok=True)
        for src, dst in (("panel-manifest.yaml", "data/panel-manifest.yaml"),
                         ("verdict.md", "data/verdict.md"),
                         ("verdict-naive.md", "data/verdict-naive.md"),
                         ("votes.json", "data/votes.json"),
                         ("triangulation.yaml", "data/triangulation.yaml"),
                         ("verified-manifest.json", "data/verified-manifest.json"),
                         ("leads-quarantine.jsonl", "data/leads-quarantine.jsonl"),
                         ("prereg/thresholds.yaml", "data/prereg-thresholds.yaml"),
                         ("prereg/site-list.json", "data/site-list.json"),
                         ("calibration/ground-truth.jsonl", "data/ground-truth.jsonl"),
                         ("evidence/pinned.json", "data/pinned.json"),
                         ("evidence/SHA256SUMS", "data/evidence-SHA256SUMS"),
                         ("engines/package-freeze.txt", "data/package-freeze.txt"),
                         ("run/seat-matrix.json", "data/seat-matrix.json"),
                         ("scripts/census-recheck.py", "data/census-recheck.py"),
                         ("scripts/reproducer-harness.sh", "data/reproducer-harness.sh"),
                         ("scripts/engine-run.js", "data/engine-run.js"),
                         ("scripts/naive-fanin.py", "data/naive-fanin.py")):
            p = os.path.join(ws, src)
            if os.path.exists(p):
                shutil.copy(p, os.path.join(out, dst))
        import glob as _glob
        for fp in sorted(_glob.glob(os.path.join(ws, "findings", "*.jsonl"))):
            shutil.copy(fp, os.path.join(data_dir, "findings", os.path.basename(fp)))
        answers = []
        adir = os.path.join(ws, "calibration")
        for name in sorted(os.listdir(adir)):
            if name.startswith("answers-") and name.endswith(".jsonl"):
                answers.extend(open(os.path.join(adir, name)).read().splitlines())
        open(os.path.join(data_dir, "raw-answers.jsonl"), "w").write("\n".join(answers) + "\n")
        rung = man["aggregation_rule_demoted_to"]
        fam_rows = "".join("<tr><th scope=\"row\">%s</th><td>%s</td></tr>" % (esc(f), esc(", ".join(v))) for f, v in sorted(man["family_census"].items()))
        pair_keys = sorted(man["M"].keys(), key=lambda s: tuple(map(int, s.split(","))))
        m_rows = "".join("<tr>" + "".join("<td>%s</td>" % esc(x) for x in [k, "%.3f" % man["M"][k]]) + "</tr>" for k in pair_keys)
        html = []
        html.append("<!doctype html><html lang=\"en\" data-build-id=\"%s\"><head><meta charset=\"utf-8\">" % bid)
        html.append("<meta name=\"build-id\" content=\"%s\">" % bid)
        html.append("<title>Six Letterheads, One Review — a measured-independence accessibility review</title>")
        html.append("<style>body{font-family:system-ui,sans-serif;margin:0 auto;max-width:60rem;padding:0 1rem;line-height:1.5}.skip{position:absolute;left:-9999px}.skip:focus{left:0}table{border-collapse:collapse;width:100%}th,td{border:1px solid #767676;padding:.4rem;text-align:left}caption{text-align:left;padding:.4rem 0}.banner{background:#1a4a7a;color:#ffffff;padding:1rem}pre{overflow-x:auto;background:#f5f5f5;padding:1rem}header,main,footer{display:block;padding:.5rem 0}</style></head>")
        html.append("<body><a class=\"skip\" href=\"#main\">Skip to content</a>")
        html.append("<header><h1>Six Letterheads, One Review</h1>")
        html.append("<p>A family-audited accessibility review of public cultural and civic sites.</p></header>")
        html.append("<main id=\"main\">")
        html.append("<section id=\"divergence\"><h2>How sure is this panel, and why</h2>")
        html.append("<p class=\"banner\">The naive majority (what an un-audited score would ship) and the measured-panel verdict <strong>disagree in authority</strong>: %d instrument letterheads sit over %d probed model families; measured rho_bar = %.3f (centered), effective panel size n_eff = %.2f of %d seats. Aggregation was therefore demoted to <strong>%s</strong>, with dissents recorded.</p></section>" % (man["naive_letterhead_census"], man["probed_family_census"], man["rho_bar"], man["n_eff"], man["seat_count"], esc(rung)))
        html.append("<section id=\"census\"><h2>The census</h2><p>Every number below recomputes from the published raw answers — see Verify it yourself.</p>")
        html.append("<h3>Family census</h3><table><caption>Instrument seats by probed model family</caption><tr><th scope=\"col\">Family</th><th scope=\"col\">Seats</th></tr>%s</table>" % fam_rows)
        html.append("<h3>Pairwise error co-occurrence M(i,j)</h3><table><caption>M(i,j) = P(seats i and j both wrong), K = %d items</caption><tr><th scope=\"col\">pair</th><th scope=\"col\">M</th></tr>%s</table></section>" % (man["items"], m_rows))
        html.append("<section id=\"verdicts\"><h2>The two verdicts, side by side</h2>")
        html.append("<h3>Naive majority (un-audited)</h3><pre>%s</pre>" % esc(naive))
        html.append("<h3>Measured-panel verdict</h3><pre>%s</pre></section>" % esc(verdict))
        html.append("<section id=\"findings\"><h2>Verified findings</h2><p>%d mechanical finding(s) admitted by reproduction pointer; see data/verified-manifest.json — each verified record KEEPS its full pointer. Reproduce any of them against the pinned bytes with data/reproducer-harness.sh and the engine pins in data/package-freeze.txt.</p></section>" % verified["counts"]["verified"])
        html.append("<section id=\"verify\"><h2>Verify it yourself</h2><p>Raw answers, the answer key, the manifest, votes, the threshold table and the census recheck script are published under <code>data/</code>. Recompute rho_bar and n_eff from <code>data/raw-answers.jsonl</code> with <code>python3 data/census-recheck.py</code> — the deployed recompute gate does exactly that against this URL (build %s).</p></section>" % bid)
        html.append("</main><footer><p>Verdicts bind to sha256-pinned page snapshots at fetch time, not to the live sites. Build %s.</p></footer></body></html>" % bid)
        open(os.path.join(out, "index.html"), "w").write("\n".join(html) + "\n")
        print("site rendered: %s/index.html (divergence banner first, build %s)" % (out, bid))

    if __name__ == "__main__":
        main()
    SCRIPTEOF

