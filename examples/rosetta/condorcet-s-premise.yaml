    cat > scripts/_census.py <<'SCRIPTEOF'
    #!/usr/bin/env python3
    """Condorcet census: pairwise error co-occurrence M(i,j) (off-diagonals are
    P(i and j both wrong); diagonal is i's marginal error rate), CENTERED
    rho_bar — the mean pairwise Pearson correlation of the per-item error
    indicators, (P_ij - p_i*p_j)/sd_i/sd_j, so independent-but-fallible jurors
    score ~0 instead of p_i*p_j [R1/R2: the uncentered mean joint error rate
    conflated incompetence with correlation and demoted independent panels] —
    design effect 1+(n-1)*rho_bar, n_eff = n/design_effect CAPPED at n
    (negative dependence cannot mint voters), family census, and demotion
    selected by ORDERED JOIN against the pre-registered threshold table —
    applied, never judged. Missing answers count as errors, DECLARED, per the
    pattern's rule. Publishes per-seat accuracy and a leak_suspect list
    (accuracy >= 0.97) so a key leak is a visible anomaly, never a silent
    score."""
    import argparse, hashlib, json, os, sys
    import yaml

    def load_jsonl(path):
        rows = []
        with open(path) as fh:
            for line in fh:
                line = line.strip()
                if line:
                    rows.append(json.loads(line))
        return rows

    def run_census(answers_dir, ground_truth, thresholds, seat_matrix, emit):
        key = {}
        for r in load_jsonl(ground_truth):
            key[r["item_id"]] = r["answer"]
        seats = load_jsonl(seat_matrix)
        seat_ids = [r["seat"] for r in seats]
        n = len(seat_ids)
        K = len(key)
        wrong = {}
        missing = {}
        for r in seats:
            sid = r["seat"]
            path = os.path.join(answers_dir, "answers-%d.jsonl" % sid)
            w = set()
            m = 0
            if os.path.exists(path):
                ans = {}
                for row in load_jsonl(path):
                    ans[row["item_id"]] = row.get("answer", "UNANSWERED")
                for iid in key:
                    v = ans.get(iid, "UNANSWERED")
                    if v == "UNANSWERED":
                        m += 1
                        w.add(iid)
                    elif v != key[iid]:
                        w.add(iid)
            else:
                m = K
                w = set(key)
            wrong[sid] = w
            missing[sid] = m
        M = {}
        p = {}
        for si in seat_ids:
            p[si] = (len(wrong[si]) / K) if K else 0.0
        for i, si in enumerate(seat_ids):
            for j, sj in enumerate(seat_ids):
                if i == j:
                    M["%d,%d" % (si, sj)] = p[si]
                else:
                    both = len(wrong[si] & wrong[sj])
                    M["%d,%d" % (si, sj)] = (both / K) if K else 0.0
        # raw mean joint error — published for transparency, NOT the ladder input
        off = []
        for i, si in enumerate(seat_ids):
            for j, sj in enumerate(seat_ids):
                if i != j:
                    off.append(M["%d,%d" % (si, sj)])
        mean_joint = (sum(off) / len(off)) if off else 0.0
        # CENTERED pairwise correlation — the dependence statistic the ladder joins on
        rhos = []
        for i in range(n):
            for j in range(i + 1, n):
                si, sj = seat_ids[i], seat_ids[j]
                den = (p[si] * (1 - p[si]) * p[sj] * (1 - p[sj])) ** 0.5
                if den <= 0.0:
                    rho_ij = 0.0  # a perfect or all-wrong seat carries no correlation information
                else:
                    rho_ij = (M["%d,%d" % (si, sj)] - p[si] * p[sj]) / den
                rhos.append(max(-1.0, min(1.0, rho_ij)))
        rho = (sum(rhos) / len(rhos)) if rhos else 0.0
        deff = 1.0 + (n - 1) * rho
        n_eff = (n / deff) if deff > 1.0 else float(n)
        ratio = (n_eff / n) if n else 0.0
        th = yaml.safe_load(open(thresholds))
        rung = None
        for band in th["bands"]:
            ok = True
            if "rho_bar_lt" in band and not (rho < band["rho_bar_lt"]):
                ok = False
            if "n_eff_ratio_ge" in band and not (ratio >= band["n_eff_ratio_ge"]):
                ok = False
            if ok:
                rung = band["rung"]
                break
        if rung is None:
            sys.exit("CENSUS REFUSED: threshold table not total — no band matched")
        fam = {}
        for r in seats:
            fam.setdefault(r["family"], []).append(r["instrument"])
        gt_sha = hashlib.sha256(open(ground_truth, "rb").read()).hexdigest()
        Mpub = {}
        for k, v in M.items():
            Mpub[k] = round(v, 6)
        acc = dict([(str(s), round(1.0 - (len(wrong[s]) / K), 6) if K else 0.0) for s in seat_ids])
        leak = [str(s) for s in seat_ids if K and (1.0 - len(wrong[s]) / K) >= 0.97]
        man = {
            "seat_count": n, "seats": seat_ids, "items": K,
            "rho_bar": round(rho, 6), "rho_definition": "centered-pearson-over-error-indicators",
            "mean_joint_error": round(mean_joint, 6),
            "design_effect": round(deff, 6),
            "n_eff": round(n_eff, 6), "n_eff_ratio": round(ratio, 6),
            "M": Mpub, "family_census": fam,
            "naive_letterhead_census": len(set(r["instrument"] for r in seats)),
            "probed_family_census": len(fam),
            "aggregation_rule_demoted_to": rung,
            "missing_answer_counts": dict([(str(s), missing[s]) for s in seat_ids]),
            "seat_accuracy": acc, "leak_suspect": leak,
            "ground_truth_sha256": gt_sha, "ladder": th["ladder"],
        }
        with open(emit, "w") as fh:
            yaml.safe_dump(man, fh, sort_keys=True)
        print("census: seats=%d K=%d rho_bar=%.4f (centered; raw joint=%.4f) n_eff=%.2f rule=%s" % (n, K, rho, mean_joint, n_eff, rung))
        return man

    def self_test():
        base = os.path.join(os.path.dirname(__file__), "..", "fixtures")
        ok = True
        m1 = run_census(os.path.join(base, "st-correlated"), os.path.join(base, "st-key.jsonl"),
                        os.path.join(base, "st-thresholds.yaml"), os.path.join(base, "st-seats.jsonl"),
                        "/tmp/st-correlated-manifest.yaml")
        if m1["aggregation_rule_demoted_to"] in ("editorial-with-dissents", "refusal"):
            print("OBSERVED FIRING: correlated panel demoted to %s" % m1["aggregation_rule_demoted_to"])
        else:
            print("SELF-TEST FAIL: correlated panel shipped '%s'" % m1["aggregation_rule_demoted_to"])
            ok = False
        m2 = run_census(os.path.join(base, "st-independent"), os.path.join(base, "st-key.jsonl"),
                        os.path.join(base, "st-thresholds.yaml"), os.path.join(base, "st-seats.jsonl"),
                        "/tmp/st-independent-manifest.yaml")
        if m2["aggregation_rule_demoted_to"] in ("majority", "weighted-correlation"):
            print("OBSERVED FIRING: independent panel NOT over-demoted (%s)" % m2["aggregation_rule_demoted_to"])
        else:
            print("SELF-TEST FAIL: independent panel over-demoted to '%s'" % m2["aggregation_rule_demoted_to"])
            ok = False
        return 0 if ok else 1

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--answers-dir")
        ap.add_argument("--ground-truth")
        ap.add_argument("--thresholds")
        ap.add_argument("--seat-matrix")
        ap.add_argument("--emit")
        ap.add_argument("--self-test", action="store_true")
        a = ap.parse_args()
        if a.self_test:
            sys.exit(self_test())
        for req in (a.answers_dir, a.ground_truth, a.thresholds, a.seat_matrix, a.emit):
            if not req:
                sys.exit("census: --answers-dir --ground-truth --thresholds --seat-matrix --emit required")
        run_census(a.answers_dir, a.ground_truth, a.thresholds, a.seat_matrix, a.emit)

    if __name__ == "__main__":
        main()
    SCRIPTEOF
    cat > scripts/census.sh <<'SCRIPTEOF'
    #!/usr/bin/env bash
    # Census wrapper — deterministic gate, EMPTY fallback chain by score config.
    #   census.sh --self-test
    #   census.sh --answers-dir D --ground-truth F --thresholds F --seat-matrix F --emit F
    set -euo pipefail
    cd "$(dirname "$0")/.."
