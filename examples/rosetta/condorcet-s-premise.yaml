parallel:
  enabled: true             # the DAG is the serializer; the two fan-outs are the
  max_concurrent: 4         # only wide windows — concurrency is a BUDGET over
  fail_fast: true           # expanded sheets (40-panel window queues under it),
                            # not a property of the movement
# cross_sheet: deliberately ABSENT — the workspace IS the shared memory (corpus
# precedent), and the panel sheets must receive their frame through the CADENZA
# contract (required: true), not through stdout soup; the census reads answer
# FILES, never captured stdout.

retry:
  max_retries: 1            # gates fail loudly for diagnosis, not blind retry:
  base_delay_seconds: 30    # a typed refusal is this design's failure semantics,
                            # and a retried juror must not double-answer (missing
                            # answers are the census's declared cells)

stale_detection:
  enabled: true
  idle_timeout_seconds: 1800   # CLI movements run silent jq/node/git fans

workspace_lifecycle:
  archive_on_fresh: true    # a fresh re-run ARCHIVES the old workspace — the
  max_archives: 5           # evidence chain is never silently destroyed

prompt:
  variables:
    # ── Deployment inputs (overridable --var; movement 1 writes them to         ──
    #    run/review-config.json and every script reads DISK from there; site_url
    #    is DERIVED from owner/repo and an independent mismatched value is
    #    REFUSED — the cross-tenant trap cannot be configured by accident).
    github_owner: "Mzzkc"
    repo_name: "six-letterheads"
    site_url: "https://mzzkc.github.io/six-letterheads/"
    # ── The jury roster (the rendered twin of per_sheet_instruments; movement 2  ──
    #    stamps live routes against it, movement 3 freezes it, movement 9 joins
    #    every answer file's STAMPED instrument_name back onto it). family is the
    #    DECLARED expectation, cross-checked at M2 against the family DERIVED
    #    from the probed route by scripts/derive-family.py — a mismatch HALTS
    #    (roster drift is a host change, not a rounding error) [R2/R3: the
    #    family census is now measured, not declared]. EVERY seat carries a
    #    body-asserted semantic probe [R1/R2: six seats were never body-probed;
    #    seat 3's probe now passes --model so it probes its own route] — run
    #    with timeout, exit code DELIBERATELY ignored, the BODY is the
    #    assertion (the crush lesson: exit 0 lies).
    seats:
      1:  { instrument: "claude-code", family: "GLM", probe: "claude -p 'Reply with exactly this token and nothing else: SEATPROBE_OK'" }
      2:  { instrument: "opencode", family: "GLM", probe: "opencode run 'Reply with exactly this token and nothing else: SEATPROBE_OK'" }
      3:  { instrument: "opencode-glm-5.3-flash", family: "GLM", probe: "opencode run --model zai-coding-plan/glm-5.3-flash 'Reply with exactly this token and nothing else: SEATPROBE_OK'" }
      4:  { instrument: "musician-void", family: "GLM", probe: "opencode run --model zai-coding-plan/glm-5-turbo 'Reply with exactly this token and nothing else: SEATPROBE_OK'" }
      5:  { instrument: "flowspec-q5c2-sandbox", family: "GLM", probe: "/home/emzi/Projects/SCORES/flowspec-launch/scripts/run_q5c2_sandboxed_opencode.sh run 'Reply with exactly this token and nothing else: SEATPROBE_OK'" }
      6:  { instrument: "agents-registry-restricted-worker", family: "GLM", probe: "printf '%s' 'Reply with exactly this token and nothing else: SEATPROBE_OK' | python3 /home/emzi/Projects/SCORES/agents-registry-migration-v1/scripts/restricted_model_launcher.py worker" }
      7:  { instrument: "gpt-5.6-repair", family: "GPT", probe: "/home/emzi/.nvm/versions/node/v20.19.5/bin/codex exec 'Reply with exactly this token and nothing else: SEATPROBE_OK'" }
      8:  { instrument: "music-critic", family: "CLAUDE", probe: "claude -p --model claude-opus-4-7 'Reply with exactly this token and nothing else: SEATPROBE_OK'" }
      9:  { instrument: "crush", family: "GEMMA", probe: "crush run --quiet 'Reply with exactly this token and nothing else: SEATPROBE_OK'" }
      10: { instrument: "gemini-cli", family: "GEMINI", probe: "gemini -p 'Reply with exactly this token and nothing else: SEATPROBE_OK'" }
    # ── The four Rashomon frames — cadenza files SHIP WITH THE SCORE at      ──
    #    {score_dir}/frames/frame-<key>.md (authored statically from this table,
    #    reviewable before first run, blindness-gated by the M1 validation      ──
    #    each frame file names only itself)
    frames:
      1: { key: "sr",  name: "Screen reader / blind-low vision" }
      2: { key: "kb",  name: "Keyboard-only / motor" }
      3: { key: "cog", name: "Cognitive load" }
      4: { key: "aud", name: "Auditory / captions" }
    # ── Calibration shape (prereg M3 authors the full protocol; these are the    ──
    #    frozen composition bounds the protocol must match EXACTLY)
    k_items: 72
    k_mech: 24
    k_bait: 24
    k_dom: 24
    # ── Fleet precondition (decomposition falsifier 2): halt for host           ──
    #    remediation below this many live distinct families
    min_live_families: 5
    # ── Engine pins (movement 1 installs exactly these and freezes the resolved
    #    versions to engines/package-freeze.txt — generated, never typed).
    #    lighthouse is COMMISSION-ONLY: it runs on the M1 fixtures, where its
    #    score is actually asserted, and never on the pinned pages [R1/R2].
    #    Local evidence servers bind EPHEMERAL ports (recorded to run/ports.txt
    #    for the M15 PID/port-custody teardown) [R1: no fixed-port collision].
    pin_playwright: "1.49.1"
    pin_axe: "4.10.2"
    pin_pa11y: "8.0.0"
    pin_lighthouse: "12.2.1"
    # ── Publish safety [R3]: refuse to force-push over an existing foreign
    #    gh-pages tip unless explicitly overridden on the command line.
    allow_force_publish: "false"

  # ═════════════════════════ Macros: the house style ═══════════════════════════
  template: |
    {# — Macros are the repeated-block mechanism at the prompt layer; the
       validation-layer macro is scripts/movement-gate.sh, called first in every
       movement's validation block. — #}
    {% macro strict() %}set -euo pipefail
    cd "{{ workspace }}"{% endmacro %}

    {% macro ai_ground_rules() %}
    ## Ground Rules (non-negotiable)
    - Fabrication wears completion's clothes: never write a placeholder where a
      real artifact is owed, and never claim a command ran without running it.
    - The deterministic gates are the coordination. If a gate fails against your
      work, fix the work — never the gate, never the record.
    - Every file you author is evidence in a published artifact: exact labels
      and exact field names, no loose prose where a parser expects a field.
    - Work only inside {{ workspace }} unless a step explicitly fetches a
      declared public resource.
    {% endmacro %}

    {% macro juror_stamp(block) %}SEAT {{ block }} FRAME{% endmacro %}

    {% macro task_verdict_contract() %}
    ### Task contract (exact labels — downstream scripts parse them)
    For EVERY task id from the prereg task list, emit a heading exactly
    `### Task {task_id}` followed by a line exactly
    `Verdict: PASS` or `Verdict: FAIL` or `Verdict: ABSTAIN (reason)` —
    an abstention is a declared cell, never an omission — then a line
    `Rule: {aggregation rule you are working under}` and 2–5 sentences of
    task-phrased reasoning ("a screen-reader user cannot locate...", not
    "SC 1.3.1 advisory").
    {% endmacro %}

    {% macro pointer_contract() %}
    ## Finding-proposal contract (Skeptical Oracle: propose, never assert)
    Mechanical findings enter the record ONLY as reproduction pointers — you
    propose, a deterministic harness re-derives against the pinned bytes, and
    non-reproducing proposals land in a visible quarantine. Emit one JSON line
    per proposal:
    {"finding_id": "F-NNNNN", "seat": <your seat>, "frame": "<frame key>",
     "kind": "axe-rule|dom-invariant|script",
     "ref": {"page": "<site.page>", "rule": "...", "selector": "..."} or
            {"page": "<site.page>", "pattern": "..."} or
            {"script": "scripts/....sh", "expect": "..."},
     "expected": "<what the re-derivation must reproduce>"}
    Never state a mechanical finding as prose fact in the review body without a
    pointer line; prose findings without pointers are experiential observations
    and must be phrased as such.
    {% endmacro %}

    {% if stage == 1 %}
    {{ strict() }}
    # ══ M1 · Commission engines + substrate (Canary Probe / Etiquette Law) ══
    # The ENTIRE deterministic substrate is heredoc-authored here, by CLI, at
    # run time: the score is GENERIC and self-contained — a fresh workspace plus
    # gh-as-owner plus this YAML is the complete input. Probes fail LOUDLY
    # before any expensive token is spent; every gate is commissioned with its
    # designed failure OBSERVED FIRING before anything trusts it.
    mkdir -p engines fixtures scripts prereg evidence engine-findings \
             calibration panel findings run site examples fixtures/st-correlated \
             fixtures/st-independent fixtures/st-evidence run/determinism run/pids
    : > run/ports.txt

    # ── Probes (Gate on Environmental Readiness — refusal is the mechanism) ────
    for tool in node npm python3 git gh jq sha256sum curl ss timeout; do
      command -v "$tool" >/dev/null 2>&1 || { echo "PROBE FAIL: $tool missing"; exit 1; }
    done
    python3 -c "import yaml" 2>/dev/null || { echo "PROBE FAIL: python3 yaml module missing"; exit 1; }
    gh auth status >/dev/null 2>&1 || { echo "PROBE FAIL: gh not authenticated"; exit 1; }
