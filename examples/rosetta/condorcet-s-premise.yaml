    cat > scripts/mech-truth-gen.py <<'SCRIPTEOF'
    #!/usr/bin/env python3
    """K1 (mechanical) ground-truth generator — authored at M1, LLM-free [R2:
    the calibration author used to write the very mechanical key rows it would
    later be scored against]. For every items.jsonl row of class "mechanical",
    re-derives the answer by joining its ref {page, rule, selector} against the
    unified engine findings (engine-findings/<page>.json): the answer is "yes"
    iff that page carries a violation of that rule whose selector contains the
    ref selector. --emit writes the rows; --check regenerates and compares
    against the mechanical rows of --truth EXACTLY (exit 5 on any drift)."""
    import argparse, json, os, sys

    def load_jsonl(path):
        rows = []
        with open(path) as fh:
            for line in fh:
                if line.strip():
                    rows.append(json.loads(line))
        return rows

    def derive(items_path, findings_dir):
        items = [r for r in load_jsonl(items_path) if r.get("class") == "mechanical"]
        out = []
        for it in items:
            ref = it.get("ref") or {}
            page, rule, sel = ref.get("page"), ref.get("rule"), ref.get("selector", "")
            if not page or not rule:
                sys.exit("mech-truth-gen: item %s has no complete ref {page, rule, selector}" % it["item_id"])
            fpath = os.path.join(findings_dir, page + ".json")
            if not os.path.exists(fpath):
                sys.exit("mech-truth-gen: no engine findings for page %r (item %s)" % (page, it["item_id"]))
            data = json.load(open(fpath))
            hit = any(v.get("rule") == rule and (not sel or sel in (v.get("selector") or ""))
                      for v in data.get("findings", []))
            out.append({"item_id": it["item_id"], "answer": "yes" if hit else "no",
                        "derivation": "engine", "citation": ""})
        return out

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--items", default="calibration/items.jsonl")
        ap.add_argument("--findings", default="engine-findings")
        ap.add_argument("--emit")
        ap.add_argument("--check", action="store_true")
        ap.add_argument("--truth", default="calibration/ground-truth.jsonl")
        a = ap.parse_args()
        rows = derive(a.items, a.findings)
        if a.emit:
            with open(a.emit, "w") as fh:
                for r in rows:
                    fh.write(json.dumps(r) + "\n")
            print("mech-truth-gen: %d mechanical rows emitted" % len(rows))
            return 0
        if a.check:
            truth = dict((r["item_id"], r) for r in load_jsonl(a.truth) if r.get("derivation") == "engine")
            got = dict((r["item_id"], r["answer"]) for r in rows)
            bad = sorted(k for k in got if truth.get(k, {}).get("answer") != got[k])
            missing = sorted(k for k in truth if k not in got)
            if bad or missing:
                print("mech-truth CHECK FAIL: drift=%s missing=%s" % (bad[:5], missing[:5]))
                return 5
            print("mech-truth-gen: %d mechanical rows regenerate identically" % len(rows))
        return 0

    if __name__ == "__main__":
        sys.exit(main())
    SCRIPTEOF
    cat > scripts/dom-count-gen.py <<'SCRIPTEOF'
    #!/usr/bin/env python3
    """K3 (DOM-count) ground-truth generator — authored at M1, LLM-free [R1:
    the old design delegated generator CODE to the calibration LLM]. For every
    items.jsonl row of class "dom", counts elements matching ONE compound
    selector (tag, #id, .class, [attr] or [attr=value], e.g. "img", "#main",
    "button.primary", "[aria-label]") in the pinned DOM evidence/<page>.dom.html
    via html.parser, and answers the comparison ref.op in {">", ">=", "==", "<"}
    against ref.n. --emit / --check like the mechanical generator; --check
    exits 5 on any drift. Deterministic by construction."""
    import argparse, json, os, re, sys
    from html.parser import HTMLParser

    def load_jsonl(path):
        rows = []
        with open(path) as fh:
            for line in fh:
                if line.strip():
                    rows.append(json.loads(line))
        return rows

    def parse_selector(sel):
        m = re.match(r'^([a-zA-Z][\w-]*)?(?:#([\w-]+))?(?:\.([\w-]+))?(?:\[([\w:-]+)(?:=([^\]]+))?\])?$', (sel or "").strip())
        if not m or not any(m.groups()):
            sys.exit("dom-count-gen: unsupported selector %r (use one compound: tag, #id, .class, [attr], [attr=val], tag.class)" % sel)
        return {"tag": (m.group(1) or "").lower(), "id": m.group(2), "cls": m.group(3),
                "attr": m.group(4), "val": m.group(5)}

    class Counter(HTMLParser):
        def __init__(self, spec):
            super().__init__()
            self.spec = spec
            self.n = 0

        def handle_starttag(self, tag, attrs):
            s = self.spec
            if s["tag"] and tag.lower() != s["tag"]:
                return
            d = dict(attrs)
            if s["id"] and d.get("id") != s["id"]:
                return
            if s["cls"]:
                if s["cls"] not in (d.get("class") or "").split():
                    return
            if s["attr"]:
                if s["attr"] not in d:
                    return
                if s["val"] is not None and d.get(s["attr"]) != s["val"]:
                    return
            self.n += 1

    def derive(items_path, evidence_dir):
        pages = {}
        rows = []
        for it in load_jsonl(items_path):
            if it.get("class") != "dom":
                continue
            ref = it.get("ref") or {}
            page = ref.get("page")
            if not page:
                sys.exit("dom-count-gen: item %s has no ref.page" % it["item_id"])
            if page not in pages:
                p = os.path.join(evidence_dir, page + ".dom.html")
                if not os.path.exists(p):
                    sys.exit("dom-count-gen: no pinned DOM for page %r (item %s)" % (page, it["item_id"]))
                pages[page] = open(p, encoding="utf-8", errors="replace").read()
            c = Counter(parse_selector(ref.get("selector")))
            c.feed(pages[page])
            c.close()
            op, val = ref.get("op", ">"), ref.get("n", 0)
            ok = ((op == ">" and c.n > val) or (op == ">=" and c.n >= val) or
                  (op == "==" and c.n == val) or (op == "<" and c.n < val))
            rows.append({"item_id": it["item_id"], "answer": "yes" if ok else "no",
                         "derivation": "dom-count", "citation": "", "counted": c.n})
        return rows

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--items", default="calibration/items.jsonl")
        ap.add_argument("--evidence", default="evidence")
        ap.add_argument("--emit")
        ap.add_argument("--check", action="store_true")
        ap.add_argument("--truth", default="calibration/ground-truth.jsonl")
        a = ap.parse_args()
        rows = derive(a.items, a.evidence)
        if a.emit:
            with open(a.emit, "w") as fh:
                for r in rows:
                    fh.write(json.dumps(r) + "\n")
            print("dom-count-gen: %d dom rows emitted" % len(rows))
            return 0
        if a.check:
            truth = dict((r["item_id"], r) for r in load_jsonl(a.truth) if r.get("derivation") == "dom-count")
            got = dict((r["item_id"], r["answer"]) for r in rows)
            bad = sorted(k for k in got if truth.get(k, {}).get("answer") != got[k])
            missing = sorted(k for k in truth if k not in got)
            if bad or missing:
                print("dom-count CHECK FAIL: drift=%s missing=%s" % (bad[:5], missing[:5]))
                return 5
            print("dom-count-gen: %d dom rows regenerate identically" % len(rows))
        return 0

    if __name__ == "__main__":
