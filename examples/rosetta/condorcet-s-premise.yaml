    #!/usr/bin/env python3
    """Writes the synthetic gate fixtures: a CORRELATED 3-seat panel (seats 1,2
    wrong together on items 1-15; seat 3 wrong on item 1 only — planted
    co-occurrence), an INDEPENDENT panel modeling CHANCE overlap [R1/R2: the
    old fixture used mutually disjoint errors, which is negative dependence,
    not independence] — each seat wrong on 4 of 20 items with pairwise overlaps
    of exactly one item, so P_ij = 0.05 ≈ p_i·p_j = 0.04 and the CENTERED rho
    lands at 0.0625 (< 0.10, majority) instead of a fabricated zero — plus the
    shared 20-item key, the fixture threshold table (weighted band boundary at
    0.40, chosen so the M7 single-error mutation crosses it: 0.4217 → 0.3882
    flips editorial → weighted), the 3-seat matrix, the correlated manifest
    stub, the majority-citing verdict fixture, the empty-axioms ranking
    fixture, and the corrupted reproduction pointer + its evidence page.
    Deterministic: re-running writes byte-identical files (M7 asserts)."""
    import json, os, sys

    BASE = sys.argv[1] if len(sys.argv) > 1 else "fixtures"
    K = 20

    def w(path, text):
        p = os.path.join(BASE, path)
        os.makedirs(os.path.dirname(p), exist_ok=True)
        open(p, "w").write(text)

    key = "".join(json.dumps({"item_id": "K-%03d" % i, "answer": "no", "derivation": "fixture"}) + "\n" for i in range(1, K + 1))
    w("st-key.jsonl", key)
    w("st-thresholds.yaml", (
        "ladder: [majority, weighted-correlation, editorial-with-dissents, refusal]\n"
        "bands:\n"
        "  - rung: majority\n    rho_bar_lt: 0.10\n    n_eff_ratio_ge: 0.80\n"
        "  - rung: weighted-correlation\n    rho_bar_lt: 0.40\n"
        "  - rung: editorial-with-dissents\n    rho_bar_lt: 0.70\n"
        "  - rung: refusal\n"))
    seats = "".join(json.dumps(s) + "\n" for s in [
        {"seat": 1, "instrument": "fixture-a", "family": "FAM-X"},
        {"seat": 2, "instrument": "fixture-b", "family": "FAM-X"},
        {"seat": 3, "instrument": "fixture-c", "family": "FAM-Y"}])
    w("st-seats.jsonl", seats)

    def answers(sid, wrong_ids):
        rows = []
        for i in range(1, K + 1):
            ans = "yes" if i in wrong_ids else "no"
            rows.append(json.dumps({"item_id": "K-%03d" % i, "answer": ans, "instrument": "fixture", "seat": sid}))
        return "\n".join(rows) + "\n"

    os.makedirs(os.path.join(BASE, "st-correlated"), exist_ok=True)
    os.makedirs(os.path.join(BASE, "st-independent"), exist_ok=True)
    shared = set(range(1, 16))
    w("st-correlated/answers-1.jsonl", answers(1, shared))
    w("st-correlated/answers-2.jsonl", answers(2, shared))
    w("st-correlated/answers-3.jsonl", answers(3, {1}))
    # independent-with-chance-overlap: pairwise intersections of exactly one item
    w("st-independent/answers-1.jsonl", answers(1, {1, 2, 3, 4}))
    w("st-independent/answers-2.jsonl", answers(2, {4, 5, 6, 7}))
    w("st-independent/answers-3.jsonl", answers(3, {1, 5, 8, 9}))
    w("st-manifest-correlated.yaml", "aggregation_rule_demoted_to: editorial-with-dissents\nladder: [majority, weighted-correlation, editorial-with-dissents, refusal]\n")
    w("st-verdict-majority.md", (
        "```yaml\ninput_type: per-task-experiential-verdicts\naggregation_rule: majority\n"
        "axioms_dropped:\n  - none-declared\n"
        "declared_authority: letterhead-count\n```\n\n## Verdict\n\nConsensus of three.\n"))
    w("st-verdict-empty-axioms.md", (
        "```yaml\ninput_type: ranking\naggregation_rule: weighted-correlation\n"
        "axioms_dropped: []\ndeclared_authority: neutral-aggregation\n```\n\n## Ranking\n\nA, B, C.\n"))
    w("st-pointer-bad.jsonl", json.dumps({"finding_id": "F-99001", "seat": 1, "frame": "sr", "kind": "axe-rule",
                                          "ref": {"page": "stpage", "rule": "image-alt", "selector": "#does-not-exist"},
                                          "expected": "planted corrupted pointer — MUST quarantine"}) + "\n")
    w("st-pointer-dup.jsonl", json.dumps({"finding_id": "F-99002", "seat": 1, "frame": "sr", "kind": "dom-invariant",
                                          "ref": {"page": "stpage", "pattern": "Fixture evidence page"},
                                          "expected": "duplicate-id must be quarantined"}) + "\n"
                      + json.dumps({"finding_id": "F-99002", "seat": 2, "frame": "kb", "kind": "dom-invariant",
                                    "ref": {"page": "stpage", "pattern": "Fixture evidence page"},
                                    "expected": "duplicate-id must be quarantined"}) + "\n")
    w("st-evidence/stpage.dom.html", "<!doctype html>\n<!-- pinned fixture -->\n<html lang=\"en\">\n<body><main><h1>Fixture evidence page</h1><img src=\"x\" alt=\"ok\"></main></body>\n</html>\n")
    print("fixtures written under %s (deterministic)" % BASE)

    if __name__ == "__main__":
        pass
