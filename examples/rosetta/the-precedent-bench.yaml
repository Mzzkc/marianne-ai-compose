    cat > scripts/md-to-html.py <<'GATEEOF'
    #!/usr/bin/env python3
    """md-to-html.py — markdown → HTML for the bench, stdlib only. Covers the
    memo's actual shape: ATX headings, paragraphs, bold/italic/code, links,
    unordered lists, blockquotes, horizontal rules."""
    import html, pathlib, re, sys

    def inline(s):
        s = html.escape(s, quote=False)
        s = re.sub(r"\*\*(.+?)\*\*", r"<strong>\1</strong>", s)
        s = re.sub(r"(?<!\*)\*([^*]+)\*(?!\*)", r"<em>\1</em>", s)
        s = re.sub(r"`([^`]+)`", r"<code>\1</code>", s)
        s = re.sub(r"\[([^\]]+)\]\(([^)]+)\)", r'<a href="\2">\1</a>', s)
        return s

    def render(md):
        out, in_list = [], False
        for line in md.splitlines():
            m = re.match(r"^(#{1,6})\s+(.*)$", line)
            if m:
                if in_list:
                    out.append("</ul>"); in_list = False
                level = len(m.group(1))
                out.append("<h" + str(level) + ">" + inline(m.group(2)) + "</h" + str(level) + ">")
                continue
            if re.match(r"^\s*[-*]\s+", line):
                if not in_list:
                    out.append("<ul>"); in_list = True
                item = re.sub(r"^\s*[-*]\s+", "", line)
                out.append("<li>" + inline(item) + "</li>")
                continue
            if in_list:
                out.append("</ul>"); in_list = False
            if line.startswith(">"):
                out.append("<blockquote>" + inline(line.lstrip("> ").strip()) + "</blockquote>")
                continue
            if re.match(r"^\s*---+\s*$", line):
                out.append("<hr>")
                continue
            if not line.strip():
                continue
            out.append("<p>" + inline(line.strip()) + "</p>")
        if in_list:
            out.append("</ul>")
        return "\n".join(out)

    if __name__ == "__main__":
        if len(sys.argv) != 3:
            print("usage: md-to-html.py <src.md> <dst.html>", file=sys.stderr); sys.exit(2)
        body = render(pathlib.Path(sys.argv[1]).read_text())
        doc = ('<!doctype html><html lang="en"><head><meta charset="utf-8">'
               "<title>memo</title></head><body>\n" + body + "\n</body></html>\n")
        pathlib.Path(sys.argv[2]).write_text(doc)
        print("md-to-html: " + sys.argv[1] + " -> " + sys.argv[2] + " (" + str(len(body.splitlines())) + " block(s))")
    GATEEOF

    cat > scripts/html-to-text.py <<'GATEEOF'
    #!/usr/bin/env python3
    """html-to-text.py — HTML → plain text for the reader page, stdlib only
    (html.parser). Block elements break lines so the reader's cadenza reads
    like a page, not a blob; script/style content is dropped."""
    import pathlib, re, sys
    from html.parser import HTMLParser

    class PageText(HTMLParser):
        BLOCK = {"p", "div", "h1", "h2", "h3", "h4", "h5", "h6", "li", "tr",
                 "br", "hr", "table", "ul", "ol", "blockquote", "footer", "title"}
        def __init__(self):
            super().__init__()
            self.out = []
            self.skip = 0
        def handle_starttag(self, tag, attrs):
            if tag in ("script", "style"):
                self.skip += 1
            if tag in self.BLOCK:
                self.out.append("\n")
            if tag == "td":
                self.out.append(" | ")
        def handle_endtag(self, tag):
            if tag in ("script", "style") and self.skip:
                self.skip -= 1
            if tag in self.BLOCK:
                self.out.append("\n")
        def handle_data(self, data):
            if not self.skip:
                self.out.append(data)

    if __name__ == "__main__":
        if len(sys.argv) != 3:
            print("usage: html-to-text.py <src.html> <dst.txt>", file=sys.stderr); sys.exit(2)
        p = PageText()
        p.feed(pathlib.Path(sys.argv[1]).read_text())
        text = "".join(p.out)
        text = re.sub(r"[ \t]+", " ", text)
        text = re.sub(r"\n\s*\n+", "\n\n", text).strip()
        pathlib.Path(sys.argv[2]).write_text(text + "\n")
        print("html-to-text: " + sys.argv[1] + " -> " + sys.argv[2] + " (" + str(len(text.split())) + " words)")
    GATEEOF

