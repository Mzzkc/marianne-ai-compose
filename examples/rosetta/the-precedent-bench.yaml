  - type: command_succeeds
    command: 'cd "{workspace}" && jq -e ".disposition == \"grant\" and (.force == \"binding\" or .force == \"persuasive\") and (.assigned_by | length >= 3) and (.seat_family | length >= 2)" rulings/term-1/ruling.json >/dev/null'
    condition: "stage == 6"
