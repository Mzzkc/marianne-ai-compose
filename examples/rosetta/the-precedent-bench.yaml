    #!/usr/bin/env python3
    """digest-verify.py — every doctrine row's provenance digest must recompute
    against the archived body (normalized: sorted keys, compact — drift in key
    order is upstream noise, drift in CONTENT is not). --live re-runs the query
    against the API and compares LIVE normalized bytes: the Gas-Free discipline
    — the certificate holds at the moment of live verification."""
    import hashlib, json, os, pathlib, subprocess, sys

    def norm_digest(path_or_bytes):
        raw = path_or_bytes.read_bytes() if isinstance(path_or_bytes, pathlib.Path) else path_or_bytes
        return hashlib.sha256(json.dumps(json.loads(raw), sort_keys=True, separators=(",", ":")).encode()).hexdigest()

    def main():
        argv = sys.argv[1:]
        live = "--live" in argv
        if live and not os.environ.get("CL_TOKEN"):
            print("DIGEST-VERIFY LIVE REFUSED: CL_TOKEN is not exported — a live check re-verifies its own preconditions", file=sys.stderr)
            sys.exit(1)
        idx = pathlib.Path(argv[argv.index("--index") + 1]) if "--index" in argv else \
              pathlib.Path(__file__).resolve().parent.parent / "precedent" / "index.jsonl"
        rows = [json.loads(l) for l in idx.read_text().splitlines() if l.strip()]
        bad = 0
        for r in rows:
            if r.get("layer") != "doctrine":
                continue
            prov = r["provenance"]
            arch = idx.parent.parent / prov["archive_path"]
            if not arch.exists():
                print(f"DIGEST-VERIFY REFUSED: row {r['id']} archive missing: {arch}", file=sys.stderr); bad += 1; continue
            if norm_digest(arch) != prov["response_sha256"]:
                print(f"DIGEST-VERIFY REFUSED: row {r['id']} digest mismatch vs {prov['archive_path']}", file=sys.stderr); bad += 1
            if live:
                # Token confinement: index rows are append-only but authored by
                # earlier movements; the token goes ONLY to the pinned origin.
                if not str(prov["query_url"]).startswith("https://www.courtlistener.com/api/rest/v4/"):
                    print(f"DIGEST-VERIFY LIVE REFUSED: row {r['id']} query_url is off-origin — token not sent: {prov['query_url']}", file=sys.stderr); bad += 1; continue
                out = subprocess.run(["curl", "-sf", "-H", f"Authorization: Token {os.environ['CL_TOKEN']}",
                                      prov["query_url"]], capture_output=True)
                if out.returncode != 0:
                    print(f"DIGEST-VERIFY LIVE REFUSED: row {r['id']} query failed: {prov['query_url']}", file=sys.stderr); bad += 1
                elif norm_digest(out.stdout) != prov["response_sha256"]:
                    print(f"DIGEST-VERIFY LIVE REFUSED: row {r['id']} — upstream bytes moved since capture ({prov['query_url']}); the vintage pin is stale: file a re-pin motion", file=sys.stderr); bad += 1
        print(f"digest-verify{' --live' if live else ''}: {sum(1 for r in rows if r.get('layer') == 'doctrine')} doctrine row(s) verified")
        sys.exit(1 if bad else 0)

    if __name__ == "__main__":
        main()
    GATEEOF

    cat > scripts/errata-commit.py <<'GATEEOF'
    #!/usr/bin/env python3
    """errata-commit.py — The Errata Ledger arm. An erratum commits the PAIR:
    corrected canon + ledger row, hash-joined (ledger new_hash == sha256 of the
    corrected canon), fsynced, committed with a CHECKED git commit under an
    errata lock, and journaled with a MONOTONIC watermark (seq 1..N, verified
    contiguous — the watermark the architecture promised, now implemented). A
    half-written pair is refused on verify. The DEFAULT canon is memo/memo.html
    — the file the movement actually corrects (the stage-4 default hashed
    memo.md while the ledger recorded the HTML: two validators disagreeing,
    review-2 finding). Contrast with supersession: an erratum CHANGES bytes
    and records it; an overrule changes no old byte and records an edge."""
    import datetime, fcntl, hashlib, json, os, pathlib, subprocess, sys

    def sha(s): return hashlib.sha256(s.encode()).hexdigest()

    def load(ledger):
        return [json.loads(l) for l in ledger.read_text().splitlines() if l.strip()] if ledger.exists() else []

    def check_watermark(rows):
        seqs = sorted(r["seq"] for r in rows)
        if seqs != list(range(1, len(rows) + 1)):
            print(f"ERRATA VERIFY REFUSED: watermark is not contiguous 1..{len(rows)} — got {seqs}", file=sys.stderr)
            sys.exit(1)

    def main():
        WS = pathlib.Path(__file__).resolve().parent.parent
        argv = sys.argv[1:]
        if "--verify-join" in argv:
            ledger = pathlib.Path(argv[argv.index("--ledger") + 1]) if "--ledger" in argv else WS / "errata" / "ledger.jsonl"
            canon = pathlib.Path(argv[argv.index("--canon") + 1]) if "--canon" in argv else WS / "memo" / "memo.html"
            rows = load(ledger)
            if not rows:
                print("ERRATA VERIFY REFUSED: the ledger is empty — nothing to join", file=sys.stderr); sys.exit(1)
            check_watermark(rows)
            last = {}
            for r in rows:
                last[r["claim_id"]] = r
            bad = 0
            for cid, r in last.items():
                if sha(canon.read_text()) != r["new_hash"]:
                    print(f"ERRATA VERIFY REFUSED: claim {cid} new_hash does not join the corrected canon {canon} — half-written pair", file=sys.stderr); bad += 1
            if bad:
                sys.exit(1)
            print(f"errata verify-join: {len(last)} claim(s) joined against {canon.name}; watermark 1..{len(rows)} contiguous")
            return
        if not argv:
            print("usage: errata-commit.py <entry.json> | --verify-join [--ledger F] [--canon F]", file=sys.stderr); sys.exit(2)
        entry = json.loads(pathlib.Path(argv[0]).read_text())
        canon = WS / entry["canon_path"]
        text = canon.read_text()
        if sha(text) == entry["prior_hash"]:
            print("ERRATA COMMIT REFUSED: the canon bytes did not change — there is nothing to correct", file=sys.stderr); sys.exit(1)
        ledger = WS / "errata" / "ledger.jsonl"
        ledger.parent.mkdir(parents=True, exist_ok=True)
        lockf = ledger.parent / ".errata.lock"
        with open(lockf, "w") as lk:
            fcntl.flock(lk, fcntl.LOCK_EX)
            rows = load(ledger)
            check_watermark(rows)
            prior_seq = max((r["seq"] for r in rows), default=0)
            row = {"id": f"ER-{entry['claim_id']}-{datetime.datetime.now().strftime('%Y%m%dT%H%M%S')}",
                   "seq": prior_seq + 1,
                   "claim_id": entry["claim_id"], "prior_hash": entry["prior_hash"],
                   "new_hash": sha(text), "date": datetime.date.today().isoformat(), "note": entry["note"]}
            with open(ledger, "a") as f:
                f.write(json.dumps(row, sort_keys=True) + "\n")
                f.flush(); os.fsync(f.fileno())
            if os.environ.get("BENCH_ENROLL_GIT") != "0" and (WS / ".git").exists():
                try:
                    subprocess.run(["git", "add", "-A"], cwd=WS, check=True, capture_output=True, text=True)
                    subprocess.run(["git", "commit", "-qm",
                                    f"erratum: {row['claim_id']} — canon+ledger pair, hash-joined, watermark {row['seq']}"],
                                   cwd=WS, check=True, capture_output=True, text=True)
                    sha_out = subprocess.run(["git", "rev-parse", "HEAD"], cwd=WS, capture_output=True, text=True).stdout.strip()
                    jf = WS / "run" / "commit-journal.jsonl"
                    with open(jf, "a") as f:
                        f.write(json.dumps({"sha": sha_out, "kind": "erratum", "claim": row["claim_id"],
                                            "at": datetime.datetime.now(datetime.timezone.utc).isoformat()}, sort_keys=True) + "\n")
                        f.flush(); os.fsync(f.fileno())
                except subprocess.CalledProcessError as e:
                    print(f"ERRATA COMMIT REFUSED: git refused: {(e.stderr or e.stdout or '').strip()[:200]}", file=sys.stderr)
                    sys.exit(1)
        print(f"erratum committed: {row['id']} (prior {row['prior_hash'][:12]}… → new {row['new_hash'][:12]}…, watermark {row['seq']})")

    if __name__ == "__main__":
        main()
    GATEEOF

