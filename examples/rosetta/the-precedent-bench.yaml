# ═══════════════════ Validations (Commissioning Cascade: staged fail-fast) ═══════════════════
# Every movement carries the GENERIC outcome gate (one enforcement point that
# dispatches by movement number — the macro at the validation layer) plus
# movement-specific rules: stage 1 receipt → stage 2 structure → stage 3 join.
# Evidence asserts on bodies, digests, joins — never on exit codes alone,
# never file_exists alone. The movement-16 rules test the RUNNING deployed
# artifact, not local files.
validations:
  # ── The generic gate: applies to ALL 18 movements ────────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && bash scripts/movement-gate.sh {sheet_num}'
    stage: 2
    description: "Outcome gate for this movement (dispatches by number; refuses loudly)"

  # ── Movement 1 · Commission + Capture ─────────────────────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && jq -e ".controls | length >= 10" run/commissioning-log.json >/dev/null && test -x scripts/enroll.py -a -x scripts/cite-join.sh -a -x scripts/live-gate.sh -a -x scripts/md-to-html.py -a -x scripts/html-to-text.py -a -x scripts/publish-site.sh -a -x scripts/force-push-fixture.sh -a -x scripts/history-check.sh -a -x scripts/consumer-ack.py'
    condition: "stage == 1"
    stage: 1
    description: "M0: the substrate exists — the commissioned gate scripts (incl. the pandoc-free converters and the publish/fixture/history helpers) on disk"
  - type: command_succeeds
    command: 'cd "{workspace}" && jq -e ".controls | map(select(.expect == \"nonzero\")) | all(.[]; .exit != 0)" run/commissioning-log.json >/dev/null && jq -e ".family_inequality and .reader_third_family" run/seat-matrix.json >/dev/null'
    condition: "stage == 1"
    stage: 3
    description: "M0: every designed failure observed firing; bench/brief families unequal; reader third-family (Condorcet + Unprimed-Falsifier seams)"
  - type: command_succeeds
    command: 'cd "{workspace}" && jq -e ".files | to_entries | map(select(.key | startswith(\"cite-\"))) | length >= 4" run/field-map.json >/dev/null && for S in schema/*.json; do python3 -m json.tool "$S" >/dev/null || exit 1; done'
    condition: "stage == 1"
    stage: 3
    description: "M0: the jq-GENERATED field map covers four bodies; the frozen contracts parse (The Freeze)"
  - type: command_succeeds
    command: 'cd "{workspace}" && test -s fixtures/unauth-401.json && jq -e "has(\"detail\")" fixtures/unauth-401.json >/dev/null'
    condition: "stage == 1"
    stage: 3
    description: "M0: the 401 negative control is on disk — an exit-0 curl with a 401 body can never pass for evidence (crush lesson)"

  # ── Movement 2 · Seed the bench ───────────────────────────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && test "$(jq -s "map(select(.layer == \"doctrine\")) | length" precedent/index.jsonl)" -ge 6 && test "$(jq -s "map(select(.layer == \"campaign\")) | length" precedent/index.jsonl)" -ge 4'
