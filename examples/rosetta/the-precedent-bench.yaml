    description: "M5: the bench seat's family differs from the brief emitter's — from disk receipts, not from the prompt's say-so (Condorcet's Premise)"
  - type: content_contains
    path: "{workspace}/rulings/term-1/ruling.md"
    pattern: "## Reasons"
    condition: "stage == 6"
    stage: 2
    description: "M5: the argued bench memo states its reasons on the record"

  # ── Movement 7 · Enroll t1 (the headline assertion) ───────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && jq -s "map(select(.id == \"P-002\")) | length == 1" precedent/index.jsonl >/dev/null && jq -s "map(select(.id == \"P-006\")) | length == 1" precedent/index.jsonl >/dev/null'
    condition: "stage == 7"
    stage: 2
    description: "M6: BOTH rows remain in the index — the overruled precedent stays on the books"
  - type: command_succeeds
    command: 'cd "{workspace}" && jq -s -e "map(select(.motion_id == \"MOT-T1-001\"))[0] | .scope == \"CSLI\" and .from == \"P-002\" and .to == \"P-006\"" precedent/edges.jsonl >/dev/null'
    condition: "stage == 7"
    stage: 3
    description: "M6: the scoped supersession edge carries scope CSLI, Smith → Carpenter — jq -s (a map over a raw JSONL stream exits 5; the stage-4 form failed every run)"
  - type: command_succeeds
    command: 'cd "{workspace}" && test "$(git log --oneline --grep \"^enroll: MOT-T1-001\" | wc -l)" -eq 1'
    condition: "stage == 7"
    stage: 3
    description: "M6: EXACTLY one enrollment commit for the motion (at-least-one let duplicates pass; the writer journals every sha)"

  # ── Movement 8 · Notify t1 ────────────────────────────────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && jq -e ".flags | length >= 1" site/data/consumers.json >/dev/null && jq -e ".supersession_flags | length >= 1" site/data/consumer-render.json >/dev/null'
    condition: "stage == 8"
    stage: 2
    description: "M7: consumers carry the supersession flag — they learned it moved"

  # ── Movement 9 · Errata arm ───────────────────────────────────────────────────
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/memo/memo.md") -ge 400'
    condition: "stage == 9"
    stage: 2
    description: "M8: the research memo is an argued document (400+ words)"
  - type: command_succeeds
    command: 'cd "{workspace}" && python3 scripts/errata-commit.py --verify-join'
    condition: "stage == 9"
    stage: 3
    description: "M8: the atomic pair joins — ledger new_hash == sha256 of the corrected canon (The Errata Ledger's own semantics)"
  - type: command_succeeds
    command: 'cd "{workspace}" && WANT=$(jq -s "last | .new_hash" errata/ledger.jsonl); GOT=$(sha256sum memo/memo.html | cut -d" " -f1); test "$WANT" = "$GOT"'
    condition: "stage == 9"
    stage: 3
    description: "M8: the hash-join recomputed independently at the validation layer (diverse observers)"

  # ── Movement 10 · Term-2 motions ──────────────────────────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && jq -e ".type == \"overrule\" and (.factors | length >= 1) and .target == \"H-002\"" motions/term-2/MOT-T2-001.json >/dev/null && jq -e ".target == \"H-001\"" motions/term-2/MOT-T2-002.json >/dev/null'
    condition: "stage == 10"
    stage: 2
    description: "M2': BOTH motions target the campaign's OWN holdings — the self-referential bind, filed as typed packets"
  - type: command_succeeds
    command: 'cd "{workspace}" && jq -e ".files | length >= 4" evidence/recapture/recapture-field-map.json >/dev/null'
    condition: "stage == 10"
    stage: 2
    description: "M2': fresh capture bytes + generated digests exist (the re-pin cites evidence, not vibes)"

  # ── Movement 11 · Cite-check t2 (the YAML-anchored repeat of the control) ─────
  - <<: *dangling_control
    condition: "stage == 11"
  - type: command_succeeds
    command: 'cd "{workspace}" && grep -q "every citation joins" run/cite-check-term-2.txt'
    condition: "stage == 11"
    stage: 2
    description: "M3': term-2 citations all join"

  # ── Movement 12 · Brief t2 ────────────────────────────────────────────────────
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/briefs/term-2/brief.md") -ge 400 && test $(grep -c "## Disposition Requested" "{workspace}/briefs/term-2/brief.md") -ge 2'
    condition: "stage == 12"
    stage: 2
    description: "M4': both motions argued, each with its own disposition request"

  # ── Movement 13 · Bench t2 ────────────────────────────────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && jq -e ".disposition == \"grant\"" rulings/term-2/ruling-grant.json >/dev/null && jq -e ".disposition == \"deny\" and (.reasons | length >= 80)" rulings/term-2/ruling-deny.json >/dev/null && BF=$(jq -r .brief_family run/seat-matrix.json) && jq -e --arg bf "$BF" ".seat_family != $bf" rulings/term-2/ruling-grant.json >/dev/null && jq -e --arg bf "$BF" ".seat_family != $bf" rulings/term-2/ruling-deny.json >/dev/null'
    condition: "stage == 13"
    stage: 2
    description: "M5': one grant AND one denial with real reasons, BOTH rulings family-checked against the brief emitter — the denial rode unchecked at stage 4 (review-2 finding)"

  # ── Movement 14 · Enroll t2 ───────────────────────────────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && jq -s "map(select(.id == \"H-002\")) | length == 1 and (.[0].layer == \"campaign\")" precedent/index.jsonl >/dev/null && jq -s "map(select(.id == \"H-005\")) | length == 1" precedent/index.jsonl >/dev/null'
    condition: "stage == 14"
    stage: 2
    description: "M6': the superseded term-1 vintage pin remains READABLE and the new H-005 row enrolled — accumulation across terms"
  - type: command_succeeds
    command: 'cd "{workspace}" && jq -s -e "map(select(.motion_id == \"MOT-T2-001\")) | length == 1" precedent/edges.jsonl >/dev/null && jq -s -e "map(select(.motion_id == \"MOT-T2-002\")) | length == 0" precedent/edges.jsonl >/dev/null && test "$(git log --oneline --grep \"^enroll: MOT-T2-001\" | wc -l)" -eq 1'
    condition: "stage == 14"
    stage: 3
    description: "M6': the granted motion has its edge and exactly one journaled commit; the DENIED motion enrolled NOTHING (jq -s — the stage-4 stream form exited 5)"
  - type: command_succeeds
    command: 'cd "{workspace}" && test -s run/deny-refusal.txt && grep -qi "disposition" run/deny-refusal.txt'
    condition: "stage == 14"
    stage: 3
    description: "M6': the serialized writer's refusal of the denied motion is on the record"

  # ── Movement 15 · Notify t2 ───────────────────────────────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && jq -e ".flags | length >= 2" site/data/consumers.json >/dev/null'
    condition: "stage == 15"
    stage: 2
    description: "M7': both supersession edges flagged"

  # ── Movement 16 · Publish + live gate (RUNNING-artifact validations) ──────────
  - type: command_succeeds
    command: 'cd "{workspace}" && python3 -c "import json,urllib.request; u=json.load(open(\"run/deployment.json\"))[\"url\"]; body=urllib.request.urlopen(u, timeout=180).read().decode(); assert \"superseded for CSLI\" in body, \"the deployed page lost the scoped-supersession flag\"; assert \"Precedent\" in body"'
    condition: "stage == 16"
    stage: 3
    retry_count: 6
    retry_delay_ms: 5000
    description: "M9: the DEPLOYED page serves the scoped-supersession flag — tested against the running artifact, not local files (retried through Pages propagation)"
  - type: command_succeeds
    command: 'cd "{workspace}" && bash scripts/live-gate.sh --file=fixtures/tampered-verify.json >/dev/null 2>&1; test $? -ne 0'
    condition: "stage == 16"
    stage: 3
    description: "M9: a TAMPERED verify panel fails the gate — tamper-detection is proven, not assumed"
  - type: command_succeeds
    command: 'cd "{workspace}" && test -s run/force-push-rejection.txt && gh api "repos/$(python3 -c "import json;c=json.load(open(\"run/bench-config.json\"));print(c[\"github_owner\"]+\"/\"+c[\"repo_name\"])")/branches/main/protection" | jq -e ".allow_force_pushes == false and .enforce_admins.enabled == true" >/dev/null && jq -e ".source_branch == \"gh-pages\" and .source_path == \"/\"" run/deployment.json >/dev/null'
    condition: "stage == 16"
    stage: 3
    description: "M9: main is protected INCLUDING admins, the DIVERGENT force-push rejection is on record, and Pages serves the orphan gh-pages branch at / — the only source path the REST API accepts (all three were stage-4 run-killers)"

  # ── Movement 17 · Controls published ──────────────────────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && jq -e "length >= 11" run/controls.json >/dev/null && jq -e "map(select(.expect == \"nonzero\")) | all(.[]; .exit != 0)" run/controls.json >/dev/null && jq -e "(map(select(.expect == \"observed\")) + map(select(.expect == \"exactly-one\"))) | all(.[]; .exit == 0)" run/controls.json >/dev/null && bash scripts/history-check.sh'
    condition: "stage == 17"
    stage: 2
    description: "M10a: eleven controls re-ran end-to-end — every designed failure refused, every expected behavior observed (incl. the genuinely divergent force-push rejection) — and rewrite-detection passes by ANCESTRY"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/run/reader-page.md") -ge 100'
    condition: "stage == 17"
    stage: 2
    description: "M10a: the reader's only input — the deployed page as text — is fetched and substantial"

  # ── Movement 18 · Unprimed reader ─────────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/reader/answers.md"
    condition: "stage == 18"
    stage: 1
    description: "M10b: the reader answered"
  - type: command_succeeds
    command: 'cd "{workspace}" && grep -q "## Q1" reader/answers.md && grep -q "## Q2" reader/answers.md && grep -q "## Q3" reader/answers.md'
    condition: "stage == 18"
    stage: 2
    description: "M10b: all three battery answers present (exact labels)"
  - type: command_succeeds
    command: 'cd "{workspace}" && python3 -c "import pathlib,re; t=pathlib.Path(\"reader/answers.md\").read_text(); q1=re.search(r\"## Q1.*?## Q2\", t, re.S).group(0); q2=re.search(r\"## Q2.*?## Q3\", t, re.S).group(0); q3=re.search(r\"## Q3.*\", t, re.S).group(0); assert re.search(r\"(?i)smith\", q1) and re.search(r\"(?i)(superseded|no longer|not.{0,20}good law)\", q1), \"Q1 must state Smith not still good law for CSLI (with the scoped nuance)\"; assert re.search(r\"(?i)carpenter\", q2), \"Q2 must name Carpenter\"; assert re.search(r\"(?i)(verif|digest|query|sha|curl)\", q3), \"Q3 must point at the verify panel\""'
    condition: "stage == 18"
    stage: 3
    description: "M10b: the unprimed reader got the status, the why, and the verification path — from the page alone (below threshold would mean the page, not the reader, must be rebuilt)"
  - type: command_succeeds
    command: 'cd "{workspace}" && python3 -c "import json,pathlib,re; t=pathlib.Path(\"reader/answers.md\").read_text(); q4=re.search(r\"## Q4.*\",t,re.S).group(0); fence=chr(96)*3; m=re.search(fence+r\"json\s*(\{.*?\})\s*\"+fence,q4,re.S); assert m, \"Q4 needs a fenced json block\"; a=json.loads(m.group(1)); assert a.get(\"smith_good_law_for_csli\")==\"no\", a; assert a.get(\"smith_still_citable_outside_csli\")==\"yes\", a; assert \"carpenter\" in str(a.get(\"which_case_changed_it\",\"\")).lower(), a; assert a.get(\"verify_method\")==\"recompute-digest\", a; print(\"reader battery: structured answers exact, including the inversion question\")"'
    condition: "stage == 18"
    stage: 3
    description: "M10b: the STRUCTURED battery scores exact answers — including the INVERSION question (Smith still citable OUTSIDE CSLI: yes) whose correct answer runs OPPOSITE to the page's dominant 'superseded' vocabulary; lexical echo passes the prose checks and dies here"
  - type: command_succeeds
    command: 'cd "{workspace}" && jq -e ".family == \"GEMMA-LOCAL\" and (.exposure | contains(\"published page only\"))" run/reader-provenance.json >/dev/null'
    condition: "stage == 18"
    stage: 2
    description: "M10b: the reader's provenance is recorded — third family, published page only"
