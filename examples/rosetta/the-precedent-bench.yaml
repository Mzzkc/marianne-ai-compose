    #!/usr/bin/env bash
    # live-gate.sh — the Gas-Free Certificate. Runs against the DEPLOYED public
    # URL (default) or a local copy (--file): extracts query URLs + normalized
    # digests from the SERVED verify panel, re-runs the queries, re-hashes
    # normalized bytes, compares. A tampered copy must FAIL. The certificate is
    # gas-free only at the moment of live verification.
    set -euo pipefail
    WS="$(cd "$(dirname "$0")/.." && pwd)"
    # fail LOUD with a named refusal, never bash's anonymous "unbound variable"
    : "${CL_TOKEN:?LIVE GATE REFUSED: CL_TOKEN is not exported — movement 1 probed it once; a gate re-verifies its own preconditions (Etiquette Law: fail loud, never default)}"
    BASE="$(python3 -c "import json;print(json.load(open('$WS/run/bench-config.json'))['site_url'])")"
    MODE="url"; FILE=""
    for a in "$@"; do
      case "$a" in --file=*) MODE="file"; FILE="${a#--file=}";; --url=*) BASE="${a#--url=}";; esac
    done
    TMP=$(mktemp -d); trap 'rm -rf "$TMP"' EXIT
    if [ "$MODE" = "url" ]; then
      echo "live-gate: fetching the deployed verify panel from $BASE ..."
      for _ in $(seq 1 60); do
        CODE=$(curl -sL -o "$TMP/verify.json" -w '%{http_code}' "$BASE/data/verify.json" || echo 000)
        [ "$CODE" = "200" ] && jq -e 'type == "array"' "$TMP/verify.json" >/dev/null 2>&1 && break
        echo "  pages propagation: HTTP $CODE — waiting 20s"; sleep 20
      done
      [ -s "$TMP/verify.json" ] && jq -e 'type == "array" and length >= 4' "$TMP/verify.json" >/dev/null \
        || { echo "LIVE GATE REFUSED: the deployed verify panel never served >= 4 rows"; exit 1; }
    else
      jq -e 'type == "array" and length >= 4' "$FILE" >/dev/null \
        || { echo "LIVE GATE REFUSED: local verify panel malformed"; exit 1; }
      cp "$FILE" "$TMP/verify.json"
    fi
    jq -c '.[]' "$TMP/verify.json" | while IFS= read -r ROW; do
      URL=$(echo "$ROW" | jq -r '.query_url')
      WANT=$(echo "$ROW" | jq -r '.normalized_sha256')
      RID=$(echo "$ROW" | jq -r '.row')
      # Token confinement: verify.json is fetched from a published site and
      # query_url is attacker-influenceable there. The CL_TOKEN header is sent
      # ONLY to the pinned CourtListener origin — never to a URL the page names.
      case "$URL" in
        https://www.courtlistener.com/api/rest/v4/*) ;;
        *) echo "LIVE GATE REFUSED: row $RID query_url is off-origin ($URL) — token not sent"; exit 1;;
      esac
      CODE=$(curl -s -o "$TMP/body.json" -w '%{http_code}' -H "Authorization: Token $CL_TOKEN" "$URL")
      [ "$CODE" = "200" ] || { echo "LIVE GATE REFUSED: row $RID query returned HTTP $CODE"; exit 1; }
      # -j (joined): NO trailing newline — jq -Sc alone appends one, which
      # changes the sha256 and made the stage-4 gate compare two DIFFERENT
      # normalizations of identical bytes; it could never pass (caught by
      # sheet-8 commissioning, missed by three reviews)
      GOT=$(jq -jSc . "$TMP/body.json" | sha256sum | cut -d' ' -f1)
      [ "$GOT" = "$WANT" ] || { echo "LIVE GATE REFUSED: row $RID — served digest $WANT, live recompute $GOT"; exit 1; }
      echo "  row $RID: served digest == live recompute ✓"
    done
    echo "live-gate: every served digest recomputes from live queries — the certificate is gas-free NOW"
    GATEEOF

