    stage: 2
    description: "M1: the two-layer corpus is seeded — six doctrine rows (incl. both concurrences typed persuasive) + four campaign holdings"
  - type: command_succeeds
    command: 'cd "{workspace}" && python3 scripts/digest-verify.py && grep -q "P-002" precedent/INDEX.md && grep -q "H-002" precedent/INDEX.md'
    condition: "stage == 2"
    stage: 3
    description: "M1: every doctrine digest recomputes against archived bytes; the cadenza source renders both layers"
  - type: command_succeeds
    command: 'cd "{workspace}" && python3 -c "import json,pathlib; rows=[json.loads(l) for l in open(\"precedent/index.jsonl\") if l.strip()]; order=json.load(open(\"run/case-order.json\")); exp={c[\"url\"] for c in order.values()}; got={r[\"provenance\"][\"query_url\"] for r in rows if r.get(\"layer\")==\"doctrine\"}; assert exp<=got, f\"doctrine rows lost exact movement-1 URLs: {sorted(exp-got)}\"; print(\"URL join:\", len(got), \"doctrine URLs, all byte-equal to movement 1 captures")"'
    condition: "stage == 2"
    stage: 3
    description: "M1: provenance URLs are byte-equal to movement 1's computed URLs — re-implemented here independently of the gate's join (no LLM-retyped URL survives seeding; the drift review-3 flagged now dies at movement 2, not 16)"

  # ── Movement 3 · Term-1 motion ────────────────────────────────────────────────
