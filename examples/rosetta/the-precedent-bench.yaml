    python3 - <<'PYEOF'
    import json, pathlib, subprocess
    cfg = json.load(open("run/bench-config.json"))
    BIN = {"claude-code": "claude", "codex-cli": "codex",
           "opencode-gemma": "opencode", "cli": "bash"}
    def probe(instr):
        b = BIN.get(instr, instr)
        try:
            v = subprocess.run([b, "--version"], capture_output=True, text=True, timeout=60)
            out = ((v.stdout or "") + (v.stderr or "")).strip().splitlines()
            return {"instrument": instr, "binary": b, "live": v.returncode == 0,
