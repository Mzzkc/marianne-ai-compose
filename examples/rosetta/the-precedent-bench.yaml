name: precedent-bench
description: "The Precedent Bench proof — a typed-force precedent index over the real Fourth Amendment third-party-doctrine line (Miller 1976, Smith 1979, Jones 2012, Carpenter 2018), every doctrine row admitted with CourtListener provenance captured live (exact citation-lookup query bytes with sha256 over normalized bytes, plus best-effort cluster and opinion samples recorded either way; jq-generated field map; bench dispositions pinned to the historical record — re-enactment, with the refusal and enrollment mechanics as the claim), seeded alongside the campaign's own first holdings so the orchestration binds itself; two full motion terms run the five-stage skeleton (CLI cite-check that refuses dangling citations before any reasoning is paid for → pinned-family AI brief → one named bench authority whose binary and version output were probed at commissioning → fcntl-serialized enroll that refuses factor-less overrules and denied motions, verifies referential integrity, and appends immutable rows plus scoped supersession edges in exactly one journaled git commit → CLI notify flags acknowledged by every consumer manifest), demonstrating scoped supersession (Smith superseded FOR CSLI by Carpenter, both rows still readable), an errata-vs-precedent contrast arm on the same corpus (hash-joined canon+ledger pair with a monotonic watermark vs. no-old-byte-changes edge), a denial on the record, and a vintage re-pin of the campaign's own holding — published as the live GitHub Pages bench itself (force badges, supersession graph, argued memo, verify-it-yourself panel with full digests, published negative-control table with per-control verdicts) on a protected main branch with a genuinely divergent rejected force-push on the record, whose served bytes are proven against re-run queries by the live recompute gate, whose history is rewrite-checked by journaled-commit ancestry, and which is read back correctly by an unprimed third-family reader scored on inversion questions page-parroting cannot pass."

# workspace: intentionally omitted — auto-managed at <workspace-root>/precedent-bench.
# The score is GENERIC: workspace path is the only project-specific input. The
# case line, deployment target, seat matrix and family table are prompt
# variables; movement 1 writes them to run/bench-config.json and every script
# reads DISK (never a hardcoded case list). Override with --var github_owner=…

instrument: claude-code            # score default; every deterministic movement
instrument_config:                 # overrides to cli / codex-cli below
  timeout_seconds: 2400

# Judgment movements whose vendor identity is NOT load-bearing may fall back
# across vendors (seeding, motions drafting, errata intake). The brief emitter
# (5, 12) and the bench seat (6, 13) pin EMPTY chains — their families are the
# Condorcet gate's evidence, and a fallback that silently swapped families
# would counterfeit the independence the proof exists to demonstrate.
instrument_fallbacks: [codex-cli]

movements:
  # ── M0 · Commission + authenticated capture (Dormancy Gate / Etiquette Law) ──
  1:
    name: "Commission + Capture (M0)"
    instrument: cli            # the ENTIRE deterministic substrate is heredoc-
    instrument_fallbacks: []   # authored here at run time; the CL_TOKEN canary
    instrument_config:         # asserts HTTP 200 FROM THE BODY (a 401 with a
      timeout_seconds: 2700    # curl exit 0 is NOT evidence — the live-
                               # regenerated 401 fixture proves the canary
                               # cannot be fooled); the field map is GENERATED
                               # by jq from the payloads, never typed; every
                               # gate script is commissioned with its designed
                               # failure OBSERVED FIRING before anything trusts it
  # ── M1 · Seed the bench (Typed Force emit + typecheck + digest + enroll) ──────
  2:
    name: "Seed the Bench (M1)"
    instrument: claude-code    # drafting holding_text and campaign holdings is
    instrument_fallbacks: [codex-cli]   # semantic legal judgment; ADMISSION is
    instrument_config:         # mechanical — force-typecheck, digest-verify
      timeout_seconds: 3000    # and enroll admit or refuse. The drafting
                               # sheet does NOT fetch: it reads ARCHIVED bytes
  # ── M2 · Term-1 typed motion packets (the Carpenter move re-enacted) ──────────
  3:
    name: "Term-1 Motion (M2)"
    instrument: claude-code    # motion argument scaffolding is semantic; the
    instrument_fallbacks: [codex-cli]   # packet SCHEMA is a frozen contract
    instrument_config:
      timeout_seconds: 1800
  # ── M3 · Cite-check, term 1 (bench stage 1; Graduate & Filter) ────────────────
  4:
    name: "Cite-Check t1 (M3)"
    instrument: cli            # a join is jq's job; an LLM cite-check would
    instrument_fallbacks: []   # hallucinate joins — The Etiquette Law's exact
    instrument_config:         # case. The dangling fixture dies HERE, in the
      timeout_seconds: 600     # same movement, before reasoning is paid for
  # ── M4 · Brief, term 1 (bench stage 2 — the semantic advocacy seat) ───────────
  5:
    name: "Brief t1 (M4)"
    instrument: claude-code    # the brief is legal argument — the one movement
    instrument_fallbacks: []   # that IS advocacy; family GLM is load-bearing
    instrument_config:         # for the Condorcet gate, so the chain is EMPTY;
      timeout_seconds: 2700    # live index arrives by REQUIRED cadenza
  # ── M5 · Bench, term 1 (bench stage 3 — ONE named authority) ──────────────────
  6:
    name: "Bench t1 (M5)"
    instrument: codex-cli      # adjudication is judgment, and family
    instrument_fallbacks: []   # independence from every brief emitter is the
    instrument_config:         # point (GLM briefs, GPT bench — probed at M0,
      timeout_seconds: 2400    # recorded in run/seat-matrix.json); the seat
                               # never argues a motion — it rules on the record
  # ── M6 · Enroll, term 1 (bench stage 4 — THE serialized writer) ───────────────
  7:
    name: "Enroll t1 (M6)"
    instrument: cli            # fcntl-locked, atomic append, ONE commit; an
    instrument_fallbacks: []   # LLM writer would make the serialized-writer
    instrument_config:         # claim theater; refuses a factor-less overrule
      timeout_seconds: 900     # and any motion whose ruling is not a GRANT
  # ── M7 · Notify, term 1 (bench stage 5 — supersession flags) ──────────────────
  8:
    name: "Notify t1 (M7)"
    instrument: cli            # flag propagation is mechanical; consumers
    instrument_fallbacks: []   # learn a holding moved through FLAGS, never
    instrument_config:         # by re-reading prose
      timeout_seconds: 600
  # ── M8 · Errata contrast arm (+ the argued research memo) ─────────────────────
  9:
    name: "Errata Arm (M8)"
    instrument: claude-code    # the memo and the erratum intake are semantic;
    instrument_fallbacks: [codex-cli]   # the atomic canon+ledger pair commit
    instrument_config:         # is the serialized CLI (errata-commit.py),
      timeout_seconds: 2700    # hash-joined and verified by validation
  # ── M2' · Term-2 motions (against the campaign's OWN holdings) ────────────────
  10:
    name: "Term-2 Motions (M2')"
    instrument: claude-code    # two packets: the vintage re-pin (overrule +
    instrument_fallbacks: [codex-cli]   # factor, fresh bytes via the
    instrument_config:         # deterministic recapture helper) and the
      timeout_seconds: 2400    # jurisdiction expansion that will be DENIED
  # ── M3' · Cite-check, term 2 ──────────────────────────────────────────────────
  11:
    name: "Cite-Check t2 (M3')"
    instrument: cli
    instrument_fallbacks: []
    instrument_config:
      timeout_seconds: 600
  # ── M4' · Brief, term 2 (pinned family — the Condorcet fact must hold) ────────
  12:
    name: "Brief t2 (M4')"
    instrument: claude-code
    instrument_fallbacks: []   # family GLM, pinned: the bench's inequality
    instrument_config:         # gate reads this from disk at movement 13
      timeout_seconds: 2700
  # ── M5' · Bench, term 2 (one grant AND one denial on the record) ──────────────
  13:
    name: "Bench t2 (M5')"
    instrument: codex-cli      # the same named seat rules both motions; the
    instrument_fallbacks: []   # DENIAL with reasons is the demonstration that
    instrument_config:         # the bar is real
      timeout_seconds: 2400
  # ── M6' · Enroll, term 2 (granted motion enrolls; denied enrolls NOTHING) ─────
  14:
    name: "Enroll t2 (M6')"
    instrument: cli
    instrument_fallbacks: []
    instrument_config:
      timeout_seconds: 900
  # ── M7' · Notify, term 2 ──────────────────────────────────────────────────────
  15:
    name: "Notify t2 (M7')"
    instrument: cli
    instrument_fallbacks: []
    instrument_config:
      timeout_seconds: 600
  # ── M9 · Publish + live recompute gate (Gas-Free Certificate) ─────────────────
  16:
    name: "Publish + Live Gate (M9)"
    instrument: cli            # build, fenced gh deploy with Pages-propagation
    instrument_fallbacks: []   # poll, branch protection + REJECTED force-push
    instrument_config:         # fixture recorded, then the live gate against
      timeout_seconds: 3600    # the PUBLIC URL: extract query URLs + digests
                               # from the SERVED page, re-run, re-hash
                               # normalized bytes, compare; a tampered local
                               # copy must FAIL the gate
  # ── M10a · Negative controls end-to-end, published ────────────────────────────
  17:
    name: "Controls Published (M10a)"
    instrument: cli            # every fixture re-run against the live system;
    instrument_fallbacks: []   # git history checked for zero rewrites; the
    instrument_config:         # results table republished; the reader page
      timeout_seconds: 1800    # fetched for the unprimed reader
  # ── M10b · The unprimed reader (The Unprimed Falsifier) ───────────────────────
  18:
    name: "Unprimed Reader (M10b)"
    instrument: opencode-gemma # a THIRD family (GEMMA-LOCAL via ollama) that
    instrument_fallbacks: []   # never saw the build reads the published page
    instrument_config:         # by REQUIRED cadenza and answers the CSLI
      timeout_seconds: 2400    # battery; below threshold FAILS LOUD — the
                               # page is rebuilt by a human, never silently

sheet:
  size: 1
  total_items: 18          # movements = sheets (no fan-out: the runtime is
                           # strictly serial BY DESIGN — see header)
  dependencies:            # each movement's validation is the next movement's
    2: [1]                 # precondition (architecture §4 dependency spine)
    3: [2]
    4: [3]
    5: [4]
    6: [5]
    7: [6]
    8: [7]
    9: [8]
    10: [9]
    11: [10]
    12: [11]
    13: [12]
    14: [13]
    15: [14]
    16: [15]
    17: [16]
    18: [17]

  # Cadenza placement — the pattern's Review-1 narrowing, enforced: the LIVE
  # index (precedent/INDEX.md, re-rendered after every enrollment) injects as
  # REQUIRED context into the BRIEF and BENCH sheets ONLY. Cite-check joins
  # mechanically and receives NO rendering it does not need. The unprimed
  # reader receives the published page and NOTHING else — no score-level
  # prelude exists, so priming has no path in.
  cadenzas:
    5:
      - file: "{{ workspace }}/precedent/INDEX.md"
        as: context
        required: true
    6:
      - file: "{{ workspace }}/precedent/INDEX.md"
        as: context
        required: true
    12:
      - file: "{{ workspace }}/precedent/INDEX.md"
        as: context
        required: true
    13:
      - file: "{{ workspace }}/precedent/INDEX.md"
        as: context
        required: true
    18:
      - file: "{{ workspace }}/run/reader-page.md"
        as: context
        required: true

parallel:
  enabled: true            # the linear dependency block renders this serial in
  max_concurrent: 3        # effect; declared for the engine, honored by the DAG
  fail_fast: true

# cross_sheet: deliberately ABSENT — the workspace IS the shared memory (corpus
# precedent), and the brief/bench must receive the index through the CADENZA
# contract (required:true — a missing index fails the sheet BEFORE execution),
# not through stdout soup. The reader must receive ONLY the published page.

retry:
  max_retries: 1           # gates fail loudly for diagnosis, not blind retry:
  base_delay_seconds: 30   # a typed refusal is this design's failure semantics

stale_detection:
  enabled: true
  idle_timeout_seconds: 1800   # CLI movements run silent jq/git/curl fans

workspace_lifecycle:
  archive_on_fresh: true   # a fresh re-run ARCHIVES the old bench — the chain's
  max_archives: 5          # history is never silently destroyed

prompt:
  variables:
    # ── Deployment inputs (overridable via --var; movement 1 writes them to    ──
    #    run/bench-config.json, which is what scripts and validations read —
    #    never an unexpandable placeholder). Movement 1 refuses to start unless
    #    gh is authenticated AS github_owner: the authorization failure that
    #    would otherwise surface at movement 16 surfaces before any token spend.
    github_owner: "Mzzkc"
    repo_name: "precedent-bench"
    site_url: "https://mzzkc.github.io/precedent-bench/"
    # ── The doctrinal line (the ONLY case data in the score; movement 1 writes  ──
    #    run/case-order.txt and every script reads THAT). Carpenter is queried
    #    by its parallel cite — 138 S. Ct. 2206 — which resolves reliably while
    #    the U.S. Reports slip cite was unbound; display keeps the slip form.
    cases:
      1: {slug: miller,    cite: "425 U.S. 435",    display: "425 U.S. 435 (1976)",              name: "United States v. Miller"}
      2: {slug: smith,     cite: "442 U.S. 735",    display: "442 U.S. 735 (1979)",              name: "Smith v. Maryland"}
      3: {slug: jones,     cite: "565 U.S. 400",    display: "565 U.S. 400 (2012)",              name: "United States v. Jones"}
      4: {slug: carpenter, cite: "138 S. Ct. 2206", display: "585 U.S. ___ (2018) (parallel cite 138 S. Ct. 2206)", name: "Carpenter v. United States"}
    # ── The pinned scope (a campaign holding — contradicting it takes a motion)──
    jurisdiction_pin: "U.S. federal, Fourth Amendment third-party doctrine, one doctrinal line, four cases"
    # ── Vendor-family table (Condorcet's Premise). run/seat-matrix.json maps   ──
    #    the seats through THIS table plus probed binary liveness; inequality of
    #    bench vs. every brief emitter is the gate at movements 6 and 13.
    families:
      claude-code: "GLM"
      codex-cli: "GPT"
      opencode-gemma: "GEMMA-LOCAL"
      cli: "DETERMINISTIC"
    bench_seat: "codex-cli"        # the ONE named adjudication authority
    brief_seat: "claude-code"      # the advocate of record at the bench
    reader_seat: "opencode-gemma"  # the unprimed third-family reader
    reader_model: "gemma4:26b"     # the ollama model movement 1 requires present
    # ── Corpus shape (validated, not assumed) ────────────────────────────────────
    min_doctrine_rows: 6           # Miller, Smith, Jones majority, 2 concurrences, Carpenter
    min_campaign_rows: 4           # jurisdiction pin, vintage pin, seat assignment, no-fallback rule
    api_vintage: "courtlistener-rest-v4"
  template: |
    {# ══════════ Macros: the house style, defined once ════════════════════════ #}
    {% macro strict() %}set -euo pipefail
    cd "{{ workspace }}"{% endmacro %}

    {% macro ai_ground_rules() %}
    ## Ground Rules (non-negotiable)
    - Fabrication wears completion's clothes: never write a placeholder where a
      real artifact is owed, and never claim a command ran without running it.
    - The deterministic gates are the coordination. If a gate fails against your
      work, fix the work — never the gate, never the record.
    - You are an advocate or a drafter, never a gate: every admission decision
      belongs to the CLI instruments, and they refuse, not advise.
    - Every file you author is evidence in a published legal-research artifact:
      exact labels and exact field names, no loose prose where a parser expects
      a field.
    {% endmacro %}

    {% macro force_discipline() %}
    ## Typed Force discipline (the frozen contract, schema/precedent-row.json)
    - Every row carries `force` (binding|persuasive) and `assigned_by` (a named
      authority string) AT CREATION. A row without both is refused by
      force-typecheck.py — persuasive suggestions and binding holdings never
      enter the index undifferentiated.
    - `necessary_to_outcome: true` marks holdings (they bind later sheets);
      `false` marks dicta (they persuade). The Jones concurrences are dicta —
      type them honestly.
    - You never retype an enrolled row. Supersession is an EDGE appended by
      enroll.py, never an edit to a byte that already entered the index.
    {% endmacro %}

    {% macro motion_packet_spec(term) %}
    ## Motion packet contract (schema/motion.json, frozen)
    Write `motions/term-{{ term }}/MOT-T{{ term }}-NNN.json`:
    ```json
    {"motion_id": "MOT-T{{ term }}-NNN", "type": "distinguish|overrule|follow",
     "cites": ["<enrolled row ids, every one must join>"],
     "target": "<row id this motion operates on>",
     "successor": "<row id that supersedes target, for grant-enrollment>",
     "scope": "<the precise scope of supersession, e.g. 'CSLI'>",
     "factors": ["changed-circumstances|reliance|workability"],
     "argument_ref": "motions/term-{{ term }}/MOT-T{{ term }}-NNN.md",
     "proposed_row": {"<full precedent-row JSON, campaign layer only, when the motion enrolls a new holding>"}}
    ```
    - An OVERRULE motion MUST name at least one factor from
      {reliance, workability, changed-circumstances} — enroll.py refuses an
      empty factor list structurally; the overrule bar is higher than the
      distinguish bar BY TYPE, not by exhortation.
    - A DISTINGUISH motion carries its scope honestly: "Smith, as applied to
      cell-site location information" — not "Smith".
    - Write the argued motion to the `argument_ref` markdown file: facts,
      the enrolled rows it stands on (cite row ids), the factor argument, the
      precise disposition requested.
    {% endmacro %}

    {% macro brief_spec(term) %}
    ## Brief contract (bench stage 2 — you are the advocate of record)
    Write `briefs/term-{{ term }}/brief.md` — an argued appellate brief, register
    and all, that:
    - cites ONLY enrolled rows (their ids, e.g. `[P-002]`); cite-join re-runs
      over every `[P-###]`/`[H-###]` token in your brief and a dangling token
      fails the movement;
    - argues the motion on the record before the bench (the cadenza-injected
      live index IS the record — if it contradicts your draft, the index wins);
    - names and argues the factor for any overrule-type motion from
      {reliance, workability, changed-circumstances};
    - ends with a literal `## Disposition Requested` section.
    {% endmacro %}

    {% macro bench_oath(term) %}
    ## Bench contract (bench stage 3 — ONE named authority; you never argue)
    You hold the adjudication seat. The brief sheet argued; you rule on the
    record. You do NOT advocate for either disposition, and you do not rewrite
    the motion: adjudicate what was filed.
    Write `rulings/term-{{ term }}/ruling.json`:
    ```json
    {"motion_id": "...", "term": "{{ term }}", "motion_file": "motions/term-{{ term }}/MOT-T{{ term }}-NNN.json",
     "disposition": "grant|deny", "force": "binding|persuasive",
     "assigned_by": "{{ bench_seat }} ({{ term }} seat)",
     "seat_id": "{{ bench_seat }}", "seat_family": "<from run/seat-matrix.json>",
     "reasons": "<2-6 sentences, on the record>", "enroll": {"authorized": true|false}}
    ```
    `enroll.authorized` is true ONLY for grants — enroll.py independently
    refuses anything else, so a slip here is caught structurally.
    Also write `rulings/term-{{ term }}/ruling.md` — the argued bench memo,
    ending with a literal `## Disposition` section and a literal
    `## Reasons` section. A DENIAL states its reasons on the record: the bar
    must be visibly real.
    {% endmacro %}

    {% macro cite_check_block(term) %}
    {{ strict() }}
    # ══ Cite-check, term {{ term }} (bench stage 1 — Graduate & Filter) ══
    # A dangling citation dies HERE, before any reasoning is paid for. The
    # dangling fixture re-fires in this same movement: a gate trusted in this
    # movement is proven able to refuse in this movement.
    {
      for M in motions/term-{{ term }}/*.json; do
        bash scripts/cite-join.sh "$M" || exit 1
      done
      if bash scripts/cite-join.sh fixtures/dangling-motion.json 2>/dev/null; then
        echo "CITE-CHECK LEAK: the dangling fixture JOINED — the gate cannot refuse"; exit 1
      fi
      echo "cite-join term {{ term }}: every citation joins; the dangling fixture still refuses"
    } 2>&1 | tee run/cite-check-term-{{ term }}.txt
    grep -q "every citation joins" run/cite-check-term-{{ term }}.txt
    python3 scripts/render-index.py   # refresh the cadenza source after any draft touched packets
    {% endmacro %}

    {% macro enroll_block(term) %}
    {{ strict() }}
    # ══ Enroll, term {{ term }} (bench stage 4 — THE serialized writer) ══
    # Only GRANTED motions enroll. Denied motions enroll NOTHING — that is the
    # demonstration, not a gap. Notify is movement {{ term == 1 and 8 or 15 }}'s own identity:
    # enrollment appends; propagation flags. enroll.py makes THE enrollment
    # commit (checked, journaled); this block only renders and commits the
    # index refresh — never a second enrollment commit, never '|| true'.
    {% if term == 1 %}
    python3 scripts/enroll.py rulings/term-1/ruling.json
    {% else %}
    python3 scripts/enroll.py rulings/term-2/ruling-grant.json
    if python3 scripts/enroll.py rulings/term-2/ruling-deny.json 2>run/deny-refusal.txt; then
      echo "ENROLL LEAK: a DENIED motion enrolled"; cat run/deny-refusal.txt; exit 1
    fi
    grep -q "disposition" run/deny-refusal.txt || { echo "the deny-refusal reason is missing"; exit 1; }
    {% endif %}
    python3 scripts/render-index.py
    git add -A
    git diff --cached --quiet || git commit -qm "M6: term {{ term }} — render the live index after enrollment"
    git log --oneline | head -5
    {% endmacro %}

    {% macro notify_block(term) %}
    {{ strict() }}
    # ══ Notify, term {{ term }} (bench stage 5 — supersession flags, ACKED) ══
    python3 scripts/notify.py
    python3 scripts/consumer-ack.py
    python3 scripts/render-index.py
    # Propagation is a BIJECTION with receipts: every enrolled edge flagged
    # exactly once, every flag acknowledged by every consumer manifest with a
    # digest over the edge bytes — flags nobody acked are not propagation.
    python3 - <<'PYEOF'
    import json, sys
    edges = [json.loads(l) for l in open("precedent/edges.jsonl") if l.strip()]
    flags = json.load(open("site/data/consumers.json"))
    seen = [f["edge_id"] for f in flags["flags"]]
    missing = [e["id"] for e in edges if e["id"] not in seen]
    dupes = {e for e in seen if seen.count(e) > 1}
    unacked = [f["edge_id"] for f in flags["flags"] if not f.get("acknowledged") or "receipt_sha256" not in f]
    if missing or dupes or unacked:
        print(f"NOTIFY FAIL: missing={missing} duplicate={sorted(dupes)} unacked={unacked}", file=sys.stderr)
        sys.exit(1)
    print(f"notify term {{ term }}: {len(edges)} edge(s) flagged 1:1 and acknowledged across consumers")
    PYEOF
    git add -A
    git diff --cached --quiet || git commit -qm "M7: term {{ term }} notify — supersession flags acked with receipts"
    {% endmacro %}

    {% if stage == 1 %}
    {{ strict() }}
    # ══ Movement 1 · Commission + Capture (M0) — Dormancy Gate / Etiquette Law ══
    # The ENTIRE deterministic substrate is heredoc-authored here, by CLI, at
    # run time: the score is GENERIC and self-contained — a fresh workspace plus
    # CL_TOKEN plus gh-as-owner is the complete input. Probes fail LOUDLY before
    # any expensive token is spent. The authenticated field map is GENERATED by
    # code from the payloads, never typed — dead-field-name insurance.
    mkdir -p scripts fixtures precedent motions/term-1 motions/term-2 \
             briefs/term-1 briefs/term-2 rulings/term-1 rulings/term-2 \
             memo errata evidence/authenticated site/data run reader schema

    # ── Probes (Gate on Environmental Readiness — refusal is the mechanism) ─────
    # pandoc is deliberately NOT probed and NOT used: the score renders markdown
    # and strips HTML with its own stdlib scripts (md-to-html.py, html-to-text.py),
    # commissioned below — a missing host binary must never again be a silent
    # prerequisite discovered at movement 9 (review-1 finding).
    for tool in python3 git gh jq sha256sum curl; do
      command -v "$tool" >/dev/null 2>&1 \
        || { echo "PROBE FAIL: $tool missing"; exit 1; }
    done
    gh auth status >/dev/null 2>&1 || { echo "PROBE FAIL: gh not authenticated"; exit 1; }
    GH_LOGIN=$(gh api user --jq .login 2>/dev/null) \
      || { echo "PROBE FAIL: gh api user refused"; exit 1; }
    [ "$GH_LOGIN" = "{{ github_owner }}" ] \
      || { echo "PROBE FAIL: gh is authenticated as $GH_LOGIN but github_owner={{ github_owner }} — rerun with --var github_owner=\$GH_LOGIN (site_url is DERIVED from owner/repo; never pass it independently)"; exit 1; }
    # the reader's third-family instrument profile: the score never writes into
    # ~/.marianne/ — it probes and records, failing loud with instructions
    if [ ! -f "$HOME/.marianne/instruments/{{ reader_seat }}.yaml" ]; then
      echo "PROBE NOTE: no ~/.marianne/instruments/{{ reader_seat }}.yaml on disk — the conductor must resolve this instrument another way; recorded in run/seat-matrix.json either way"
    fi
    command -v codex >/dev/null 2>&1 || { echo "PROBE FAIL: codex missing (the bench seat needs it)"; exit 1; }
    test -n "${OPENAI_API_KEY:-}" || { echo "PROBE FAIL: OPENAI_API_KEY not set (codex-cli needs it)"; exit 1; }
    command -v claude >/dev/null 2>&1 || { echo "PROBE FAIL: claude missing (the brief seat needs it)"; exit 1; }
    command -v opencode >/dev/null 2>&1 || { echo "PROBE FAIL: opencode missing (the reader needs it)"; exit 1; }
    curl -fsS --max-time 10 http://localhost:11434/api/tags >/dev/null 2>&1 \
      || { echo "PROBE FAIL: ollama daemon not reachable (opencode-gemma needs it)"; exit 1; }
    curl -fsS --max-time 10 http://localhost:11434/api/tags 2>/dev/null | grep -q "{{ reader_model }}" \
      || { echo "PROBE FAIL: ollama is not serving {{ reader_model }} (pull it first)"; exit 1; }
    test -n "${CL_TOKEN:-}" \
      || { echo "PROBE FAIL: CL_TOKEN not set — register the free CourtListener token at accounts.courtlistener.com and export CL_TOKEN=<token>. There is NO fallback by design: a substitute source would gut the provenance story."; exit 1; }

    if [ -f .commissioned ]; then
      echo "bench already commissioned — probes re-run above, substrate stands"
    else

    # ── The Dormancy-Gate canary: unauthenticated MUST 401 (the live-regenerated
    #    negative control — a curl exit 0 carrying a 401 body is NOT success) ────
    CODE=$(curl -s -o fixtures/unauth-401.json -w '%{http_code}' \
      'https://www.courtlistener.com/api/rest/v4/citation-lookup/?citations=442+U.S.+735')
    [ "$CODE" = "401" ] \
      || { echo "CANARY FAIL: unauthenticated lookup returned HTTP $CODE, expected 401 — API behavior changed; investigate, do not proceed"; exit 1; }
    jq -e 'has("detail")' fixtures/unauth-401.json >/dev/null \
      || { echo "CANARY FAIL: the 401 body shape is unexpected"; exit 1; }

    # ── Authenticated capture: four citations, HTTP asserted from -w, payload
    #    shape asserted from the BODY (Etiquette Law: never the exit code alone)─
    : > run/capture-log.jsonl
    {% for c in cases.values() %}
    CODE=$(curl -s -o "evidence/authenticated/cite-{{ c.slug }}.json" -w '%{http_code}' \
      -H "Authorization: Token $CL_TOKEN" \
      'https://www.courtlistener.com/api/rest/v4/citation-lookup/?citations={{ c.cite | replace(' ', '+') }}')
    [ "$CODE" = "200" ] \
      || { echo "CANARY FAIL: authenticated lookup for {{ c.slug }} returned HTTP $CODE — token refused or endpoint moved"; exit 1; }
    jq -e 'if type == "object" and has("detail") then false else true end' "evidence/authenticated/cite-{{ c.slug }}.json" >/dev/null \
      || { echo "CANARY FAIL: {{ c.slug }} body carries an error envelope"; exit 1; }
    echo "{\"slug\": \"{{ c.slug }}\", \"cite\": \"{{ c.cite }}\", \"http\": $CODE}" >> run/capture-log.jsonl
    # cluster/opinion sample: BEST-EFFORT, RECORDED EITHER WAY — the jq-generated
    # field map (never a guess) is the authority on what the payload exposes
    CLUSTER_ID=$(jq -r '[.. | objects | select(has("cluster_id")) | .cluster_id][0] // empty' \
      "evidence/authenticated/cite-{{ c.slug }}.json" 2>/dev/null || true)
    if [ -n "$CLUSTER_ID" ]; then
      curl -sf -H "Authorization: Token $CL_TOKEN" \
        "https://www.courtlistener.com/api/rest/v4/clusters/$CLUSTER_ID/" \
        -o "evidence/authenticated/cluster-{{ c.slug }}.json" \
        && echo "{\"slug\": \"{{ c.slug }}\", \"sample\": \"cluster\", \"id\": \"$CLUSTER_ID\"}" >> run/capture-log.jsonl \
        || echo "{\"slug\": \"{{ c.slug }}\", \"sample\": \"cluster\", \"id\": \"$CLUSTER_ID\", \"note\": \"capture refused, recorded\"}" >> run/capture-log.jsonl
    else
      echo "{\"slug\": \"{{ c.slug }}\", \"sample\": \"cluster\", \"note\": \"no cluster_id exposed at top of payload — field map is the authority\"}" >> run/capture-log.jsonl
    fi
    {% endfor %}

    # one opinion sample off the first cluster that exposed an id (same rule)
    FIRST_CLUSTER=$(jq -r 'select(.sample == "cluster" and has("id")) | .id' run/capture-log.jsonl | head -1 || true)
    if [ -n "$FIRST_CLUSTER" ]; then
      OP_ID=$(curl -sf -H "Authorization: Token $CL_TOKEN" \
        "https://www.courtlistener.com/api/rest/v4/clusters/$FIRST_CLUSTER/" \
        | jq -r '[.. | objects | select(has("id")) | .id][0] // empty' || true)
      if [ -n "$OP_ID" ]; then
        curl -sf -H "Authorization: Token $CL_TOKEN" \
          "https://www.courtlistener.com/api/rest/v4/opinions/$OP_ID/" \
          -o evidence/authenticated/sample-opinion.json \
