    #!/usr/bin/env python3
    """consumer-ack.py — the consumption half of notify (bench stage 5b). Flags
    existing is not propagation: each consumer manifest READS its flags and
    acknowledges them with a receipt digest over the edge bytes. A flag nobody
    acked means a holding moved and no consumer can prove it saw the move —
    notify gates refuse that state (review-2 finding: 'nonempty flags presented
    as consumer notification')."""
    import datetime, hashlib, json, pathlib, sys

    WS = pathlib.Path(__file__).resolve().parent.parent
    cons_f = WS / "site" / "data" / "consumers.json"
    m = json.loads(cons_f.read_text())
    edges = {json.loads(l)["id"]: json.loads(l)
             for l in (WS / "precedent" / "edges.jsonl").read_text().splitlines() if l.strip()} \
        if (WS / "precedent" / "edges.jsonl").exists() else {}
    acked = 0
    for f in m.get("flags", []):
        if f.get("acknowledged"):
            continue
        e = edges.get(f["edge_id"])
        if e is None:
            print(f"CONSUMER-ACK REFUSED: flag {f['edge_id']} matches no enrolled edge", file=sys.stderr)
            sys.exit(1)
        f["acknowledged"] = True
        f["acked_at"] = datetime.datetime.now(datetime.timezone.utc).isoformat()
        f["receipt_sha256"] = hashlib.sha256(json.dumps(e, sort_keys=True).encode()).hexdigest()
        acked += 1
    cons_f.write_text(json.dumps(m, indent=2) + "\n")
    for c in m.get("consumers", []):
        p = WS / c
        p.parent.mkdir(parents=True, exist_ok=True)
        p.write_text(json.dumps({"supersession_flags": m["flags"]}, indent=2) + "\n")
    print(f"consumer-ack: {acked} flag(s) acknowledged with receipt digests; "
          f"{len(m.get('consumers', []))} consumer manifest(s) refreshed")
