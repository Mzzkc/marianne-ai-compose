          "reader_binary_third": seats["reader"]["binary"] not in
                                 (seats["bench"]["binary"], seats["brief"]["binary"]),
          "reader_profile": reader_profile}
    json.dump(sm, open("run/seat-matrix.json", "w"), indent=2)
    assert all(s["live"] for s in seats.values()), "a seat BINARY failed its liveness probe (see binary/version_probe fields)"
    assert sm["family_inequality"] and sm["binary_inequality"], \
        "bench and brief seats share a family OR mechanically indistinguishable dispatchers — Condorcet violation"
    assert sm["reader_third_family"] and sm["reader_binary_third"], \
        "the reader shares a family or binary with bench or brief — priming risk"
    PYEOF

