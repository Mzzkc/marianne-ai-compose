    # ══ The six gate scripts (The Tool Chain; every one commissioned below) ═════

    cat > scripts/cite-join.sh <<'GATEEOF'
    #!/usr/bin/env bash
    # cite-join.sh — bench stage 1 (Graduate & Filter). Joins EVERY referential
    # claim in a motion packet against precedent/index.jsonl: each cited row id,
    # the target (which must also be CITED — you operate on a record you put on
    # the table), and the successor (which must be enrolled or be the packet's
    # own proposed_row.id). REFUSES with a named error BEFORE any reasoning is
    # paid for. This is a join — jq's job, never an LLM's.
    set -euo pipefail
    WS="$(cd "$(dirname "$0")/.." && pwd)"
    INDEX="$WS/precedent/index.jsonl"
    [ -s "$INDEX" ] || { echo "CITE-JOIN REFUSED: index missing or empty: $INDEX" >&2; exit 2; }
    has_row() { jq -e --arg c "$1" 'select(.id == $c)' "$INDEX" >/dev/null 2>&1; }
    FAIL=0
    for MOTION in "$@"; do
      [ -s "$MOTION" ] || { echo "CITE-JOIN REFUSED: motion file missing: $MOTION" >&2; exit 2; }
      MID=$(jq -r '.motion_id // "unnamed"' "$MOTION")
      while IFS= read -r CITE; do
        [ -n "$CITE" ] || continue
        if ! has_row "$CITE"; then
          echo "CITE-JOIN REFUSED: motion $MID cites dangling row id: $CITE — file a motion against an ENROLLED row, or enroll it first" >&2
          FAIL=1
        fi
      done < <(jq -r '.cites[]' "$MOTION")
      TARGET=$(jq -r '.target // empty' "$MOTION")
      if [ -n "$TARGET" ]; then
        has_row "$TARGET" || { echo "CITE-JOIN REFUSED: motion $MID targets $TARGET, which is not enrolled" >&2; FAIL=1; }
        jq -e --arg t "$TARGET" '(.cites // []) | index($t) != null' "$MOTION" >/dev/null 2>&1 \
          || { echo "CITE-JOIN REFUSED: motion $MID targets $TARGET without citing it — the record it operates on must be on the table" >&2; FAIL=1; }
      fi
      SUCC=$(jq -r '.successor // empty' "$MOTION")
      if [ -n "$SUCC" ]; then
        PROP=$(jq -r '.proposed_row.id // empty' "$MOTION")
        if [ "$SUCC" != "$PROP" ] && ! has_row "$SUCC"; then
          echo "CITE-JOIN REFUSED: motion $MID names successor $SUCC, which is neither enrolled nor the motion's own proposed_row.id ($PROP) — referential integrity starts HERE, not at enrollment" >&2
          FAIL=1
        fi
      fi
    done
    [ "$FAIL" -eq 0 ] || exit 1
    echo "cite-join: OK ($# motion packet(s), every citation joins; every target and successor joins too)"
    GATEEOF

    cat > scripts/force-typecheck.py <<'GATEEOF'
    #!/usr/bin/env python3
    """force-typecheck.py — the Typed Force gate. Joins on the type; never
    judges it. A row missing {force, assigned_by} at creation is REFUSED:
    binding holdings and persuasive dicta never enter the index
    undifferentiated. Also lints motion packets (the overrule/factor bar).

    Dispatch is STRUCTURAL, never by filename: a JSON object carrying
    {motion_id, type} rides the motion path; JSONL rows ride the row path.
    The stage-4 version dispatched on 'motion' appearing in the FILENAME —
    the production packet MOT-T1-001.json contains no such substring, so the
    real motion would have been typechecked as rows and refused, while the
    conveniently-named fixture exercised the motion path: a counterfeit
    control (review-2 finding). Both now ride the same structural dispatch."""
    import json, pathlib, sys

    FORCES = {"binding", "persuasive"}
    FACTORS = {"reliance", "workability", "changed-circumstances"}
    TYPES = {"follow", "distinguish", "overrule"}
    PROV_KEYS = {"query_url", "captured_at", "response_sha256", "api_vintage", "archive_path"}

    def refuse(msg):
        print(f"FORCE-TYPECHECK REFUSED: {msg}", file=sys.stderr)
        return 1

    def strip_fences(text):
        lines = text.splitlines()
        if lines and lines[0].lstrip().startswith("```"):
            lines = lines[1:]
            while lines and lines[-1].strip() == "":
                lines = lines[:-1]
            if lines and lines[-1].lstrip().startswith("```"):
                lines = lines[:-1]
        return "\n".join(lines)

    def check_rows(path):
        bad = 0
        seen_ids = set()
        lines = [l for l in strip_fences(pathlib.Path(path).read_text()).splitlines() if l.strip()]
        for n, line in enumerate(lines, 1):
            try:
                r = json.loads(line)
            except json.JSONDecodeError as e:
                bad += refuse(f"{path}:{n} is not JSON ({e})"); continue
            rid = r.get("id", f"{path}:{n}")
            if rid in seen_ids:
                bad += refuse(f"row {rid} appears twice in {path} — enrolled ids are unique")
            seen_ids.add(rid)
            missing = {"force", "assigned_by", "layer", "necessary_to_outcome"} - r.keys()
            if missing:
                bad += refuse(f"row {rid} missing {sorted(missing)}"); continue
            if r["force"] not in FORCES:
                bad += refuse(f"row {rid} force {r['force']!r} not in {sorted(FORCES)}")
            if not isinstance(r["assigned_by"], str) or not r["assigned_by"].strip():
                bad += refuse(f"row {rid} carries no assigned_by authority")
            if r["layer"] not in {"doctrine", "campaign"}:
                bad += refuse(f"row {rid} layer {r['layer']!r} unknown")
            if not isinstance(r["necessary_to_outcome"], bool):
                bad += refuse(f"row {rid} necessary_to_outcome must be boolean (holding vs. dictum), got {r['necessary_to_outcome']!r}")
            for f in ("case_name", "cite", "holding_text"):
                if not isinstance(r.get(f), str) or not r[f].strip():
                    bad += refuse(f"row {rid} carries no {f}")
            prov = r.get("provenance") or {}
            if not PROV_KEYS <= prov.keys():
                bad += refuse(f"row {rid} ({r['layer']}) provenance incomplete (needs {sorted(PROV_KEYS)})")
        return bad

    def check_motion(path):
        m = json.loads(strip_fences(pathlib.Path(path).read_text()))
        bad = 0
        mid = m.get("motion_id", path)
        if m.get("type") not in TYPES:
            bad += refuse(f"motion {mid} type {m.get('type')!r} not in {sorted(TYPES)}")
        if m.get("type") == "overrule" and not m.get("factors"):
            bad += refuse(f"overrule motion {mid} names NO factor — the overrule bar is structurally higher than the distinguish bar")
        for f in m.get("factors", []):
            if f not in FACTORS:
                bad += refuse(f"motion {mid} factor {f!r} not in {sorted(FACTORS)}")
        if not m.get("cites"):
            bad += refuse(f"motion {mid} cites nothing — a motion stands on enrolled rows")
        if not isinstance(m.get("target"), str) or not m["target"].strip():
            bad += refuse(f"motion {mid} names no target row")
        if not isinstance(m.get("scope"), str) or len(m["scope"].strip()) < 2:
            bad += refuse(f"motion {mid} carries no scope")
        return bad

    if __name__ == "__main__":
        bad = 0
        for p in sys.argv[1:]:
            text = strip_fences(pathlib.Path(p).read_text())
            try:
                obj = json.loads(text)
            except json.JSONDecodeError:
                obj = None
            if isinstance(obj, dict) and "motion_id" in obj and "type" in obj:
                bad += check_motion(p)
            else:
                bad += check_rows(p)
        sys.exit(1 if bad else 0)
    GATEEOF

    cat > scripts/enroll.py <<'GATEEOF'
    #!/usr/bin/env python3
    """enroll.py — bench stage 4. THE single serialized writer of the index:
    fcntl-locked, per-file atomic (temp + fsync + rename) with BOTH ledgers
    written under one lock, exactly one CHECKED git commit per enrollment, and
    every commit journaled to run/commit-journal.jsonl so rewrite detection has
    ancestry to test (history-check.sh). Appends IMMUTABLE rows to
    precedent/index.jsonl and append-only supersession edges to
    precedent/edges.jsonl — it never rewrites an enrolled byte. Honest
    atomicity (review-2 finding): a crash BETWEEN the two renames can leave
    row-without-edge (additive, reconcilable) — the reverse, edge-without-row,
    is what corrupts meaning, and the NEXT writer DETECTS both directions on
    load and refuses (fail-closed recovery, damage visible in the git chain).
    Refuses: a ruling whose disposition is not GRANT; an overrule with an empty
    factors list; a target or successor that does not resolve (referential
    integrity starts at cite-check and is RE-verified here); a ruling already
    enrolled (the concurrency property: exactly one enrollment can ever land)."""
    import fcntl, json, os, pathlib, subprocess, sys, tempfile, datetime

    def refuse(msg):
        print(f"ENROLL REFUSED: {msg}", file=sys.stderr)
        sys.exit(1)

    def ws_default():
        return pathlib.Path(__file__).resolve().parent.parent

    def git_commit(root, msg):
        """Checked commit — never '|| true'. Returns the new sha, or None when
        nothing was staged (callers treat that as an error for enrollments)."""
        try:
            subprocess.run(["git", "add", "-A"], cwd=root, check=True, capture_output=True, text=True)
            st = subprocess.run(["git", "status", "--porcelain"], cwd=root, capture_output=True, text=True)
            if not st.stdout.strip():
                return None
            subprocess.run(["git", "commit", "-qm", msg], cwd=root, check=True, capture_output=True, text=True)
        except subprocess.CalledProcessError as e:
            refuse(f"git commit refused: {(e.stderr or e.stdout or '').strip()[:200]} — custody is part of the write, not an afterthought")
        return subprocess.run(["git", "rev-parse", "HEAD"], cwd=root, capture_output=True, text=True).stdout.strip()

    def journal(root, entry):
        jf = root / "run" / "commit-journal.jsonl"
        jf.parent.mkdir(parents=True, exist_ok=True)
        with open(jf, "a") as f:
            f.write(json.dumps(entry, sort_keys=True) + "\n")
            f.flush(); os.fsync(f.fileno())

    def load_state(idx_dir, rows_f, edges_f):
        rows = [json.loads(l) for l in rows_f.read_text().splitlines() if l.strip()] if rows_f.exists() else []
        edges = [json.loads(l) for l in edges_f.read_text().splitlines() if l.strip()] if edges_f.exists() else []
        ids = [r.get("id") for r in rows]
        if len(set(ids)) != len(ids):
            refuse("index.jsonl carries duplicate row ids — the append-only ledger is inconsistent; inspect the git chain")
        eids = [e.get("id") for e in edges]
        if len(set(eids)) != len(eids):
            refuse("edges.jsonl carries duplicate edge ids — the append-only ledger is inconsistent; inspect the git chain")
        have = set(ids)
        for e in edges:
            if e.get("from") not in have or e.get("to") not in have:
                refuse(f"edge {e.get('id')} references an unenrolled row ({e.get('from')} -> {e.get('to')}) — "
                       "half-enrollment or tampering detected; refuse and reconcile from the git chain")
        return rows, edges

    def resolve_motion(ref):
        base = ws_default()
        cands = [base / ref]
        if not ref.startswith("/"):
            cands += [base / "motions" / ref,
                      base / "motions" / pathlib.Path(ref).name,
                      base / pathlib.Path(ref).name]
        for c in cands:
            if c.is_file():
                return c
        refuse(f"ruling's motion_file {ref!r} resolves under no known spelling of {base} "
               "(workspace-relative, basename and motions/ variants all tried)")

    def append_locked(idx_dir, path, records):
        tmp = tempfile.NamedTemporaryFile("w", dir=idx_dir, delete=False)
        for r in records:
            tmp.write(json.dumps(r, sort_keys=True) + "\n")
        tmp.flush(); os.fsync(tmp.fileno()); tmp.close()
        os.replace(tmp.name, path)

    def seed(seed_file, root):
        """--seed mode: the composition-act admission path (movement 2). The
        score itself is the recorded human-authorized act — assigned_by reads
        'composer-registration'. Same lock, same atomicity, same journal."""
        chk = subprocess.run(["python3", str(pathlib.Path(__file__).parent / "force-typecheck.py"), str(seed_file)],
                             capture_output=True, text=True)
        if chk.returncode != 0:
            refuse(f"seed file refused by force-typecheck:\n{chk.stderr}")
        rows_in = [json.loads(l) for l in pathlib.Path(seed_file).read_text().splitlines() if l.strip()]
        idx_dir = root / "precedent"; idx_dir.mkdir(parents=True, exist_ok=True)
        rows_f = idx_dir / "index.jsonl"
        with open(idx_dir / ".enroll.lock", "w") as lk:
            fcntl.flock(lk, fcntl.LOCK_EX)
            rows, _ = load_state(idx_dir, rows_f, idx_dir / "edges.jsonl")
            have = {r["id"] for r in rows}
            for r in rows_in:
                if r["id"] in have:
                    refuse(f"seed row {r['id']} already enrolled — the serialized writer is idempotent by refusal")
            append_locked(idx_dir, rows_f, rows + rows_in)
            sha = None
            if os.environ.get("BENCH_ENROLL_GIT") != "0" and (root / ".git").exists():
                sha = git_commit(root, f"seed: {len(rows_in)} row(s) enrolled — the composition act")
                if sha is None:
                    refuse("seed committed nothing — the rows did not land in the tree")
                journal(root, {"sha": sha, "kind": "seed", "rows": len(rows_in),
                               "at": datetime.datetime.now(datetime.timezone.utc).isoformat()})
        print(f"seed: {len(rows_in)} row(s) enrolled under the serialized writer")

    def main():
        args = [a for a in sys.argv[1:] if not a.startswith("--")]
        root = ws_default()
        for a in sys.argv[1:]:
            if a.startswith("--root="):
                root = pathlib.Path(a.split("=", 1)[1])
            elif a.startswith("--seed="):
                return seed(a.split("=", 1)[1], root)
        if not args:
            refuse("usage: enroll.py [--root=DIR] [--seed=rows.jsonl] <ruling.json>")
        ruling_path = pathlib.Path(args[0])
        ruling = json.loads(ruling_path.read_text())
        if ruling.get("disposition") != "grant":
            refuse(f"motion {ruling.get('motion_id')} disposition is {ruling.get('disposition')!r} — only GRANTED motions enroll; a denial enrolls NOTHING")
        motion = json.loads(resolve_motion(ruling.get("motion_file", "")).read_text())
        if motion.get("type") == "overrule" and not motion.get("factors"):
            refuse("overrule motion carries no named factor ({reliance, workability, changed-circumstances})")
        idx_dir = root / "precedent"
        idx_dir.mkdir(parents=True, exist_ok=True)
        lock = idx_dir / ".enroll.lock"
        rows_f, edges_f = idx_dir / "index.jsonl", idx_dir / "edges.jsonl"
        new_rows, new_edges = [], []
        with open(lock, "w") as lk:
            fcntl.flock(lk, fcntl.LOCK_EX)
            rows, edges = load_state(idx_dir, rows_f, edges_f)
            have = {r["id"] for r in rows}
            if any(e.get("motion_id") == ruling["motion_id"] for e in edges) or \
               any(r.get("enrolled_motion") == ruling["motion_id"] for r in rows):
                refuse(f"motion {ruling['motion_id']} is ALREADY enrolled — the serialized writer is idempotent by refusal")
            if motion.get("target") and motion["target"] not in have:
                refuse(f"motion target {motion['target']} is not enrolled — referential integrity re-verified at the writer")
            prop = motion.get("proposed_row")
            if motion.get("successor"):
                if prop and motion["successor"] == prop.get("id"):
                    pass  # the successor is the row this enrollment appends
                elif motion["successor"] not in have:
                    refuse(f"motion successor {motion['successor']} is neither enrolled nor the proposed row's id")
            now = datetime.datetime.now(datetime.timezone.utc).isoformat()
            if prop:
                if prop["id"] in have:
                    refuse(f"proposed row {prop['id']} already exists")
                rec = dict(prop)
                rec["enrolled_motion"] = ruling["motion_id"]
                rec["enrolled_at"] = now
                new_rows.append(rec)
            if motion.get("target") and motion.get("successor"):
                new_edges.append({
                    "id": f"E-{len(edges) + 1:03d}",
                    "from": motion["target"], "to": motion["successor"],
                    "scope": motion.get("scope", "unscoped"),
                    "motion_id": ruling["motion_id"], "enrolled_by": ruling["assigned_by"],
                    "enrolled_at": now})
            append_locked(idx_dir, rows_f, rows + new_rows)
            append_locked(idx_dir, edges_f, edges + new_edges)
            sha = None
            if os.environ.get("BENCH_ENROLL_GIT") != "0" and (root / ".git").exists():
                sha = git_commit(root, f"enroll: {ruling['motion_id']} ({ruling['disposition']}) — append-only rows + scoped edge")
                if sha is None:
                    refuse("enrollment committed nothing — the append did not land in the tree")
                journal(root, {"sha": sha, "kind": "enroll", "motion": ruling["motion_id"],
                               "rows": len(new_rows), "edges": len(new_edges),
                               "at": datetime.datetime.now(datetime.timezone.utc).isoformat()})
        print(f"enroll: {ruling['motion_id']} — {len(new_rows)} row(s), {len(new_edges)} edge(s), one journaled commit")

    if __name__ == "__main__":
        main()
    GATEEOF

