  - type: command_succeeds
    command: |
      cd {workspace}
      uv run --quiet --with polib=={polib_pin} python - <<'PY'
      import json, re
      from html.parser import HTMLParser
      from pathlib import Path
      import polib
      census = json.load(open('contract/segment-census.json'))
      by_path = {}
      for s in census:
          by_path.setdefault(s['source_path'], []).append(s)
      class Text(HTMLParser):
          def __init__(self):
              super().__init__(); self.buf = []
          def handle_data(self, d):
              self.buf.append(d)
      def page_text(p):
          t = Text(); t.feed(Path(p).read_text(encoding='utf-8'))
          return re.sub(r'\s+', ' ', ' '.join(t.buf))
      for loc in ['en', 'es', 'fr', 'de', 'pt-BR', 'ar']:
          cat = {}
          if loc != 'en':
              cat = {e.msgid: (e.msgstr or e.msgid) for e in polib.pofile('joined/%s.po' % loc)
                     if e.msgid.strip()}
          for src, segs in by_path.items():
              stem = Path(src).stem
              html = page_text('buffer-B/%s/%s.html' % (loc, stem))
              for s in segs:
                  rendered = cat.get(s['msgid'], s['msgid'])
                  rendered = re.sub(r'\s+', ' ', rendered).strip()
                  if rendered:
                      assert rendered[:60] in html, \
                          '%s/%s: segment not rendered: %r' % (loc, stem, rendered[:40])
      print('every census segment renders into every edition — no silent empty pages')
      PY
    condition: "stage == 12"
    stage: 2
    description: "CONTENT COVERAGE: every census segment's rendered text appears in its edition's page (rev 1's exp-gate --links checks hrefs, not content — a drifted census produced a green, empty site)"
