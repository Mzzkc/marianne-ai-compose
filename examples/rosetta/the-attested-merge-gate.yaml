name: babel-release
description: "The Attested Merge Gate proof — five vendor-diverse writers against a frozen localization contract, admitted by a deterministic sweep, merged by one serial authority, cut over atomically to live GitHub Pages subpaths with gettext catalogs as a release asset."

# workspace: intentionally omitted — auto-managed at <workspace-root>/babel-release (#58).
# The score never writes outside its workspace except the two HERALDED external
# effects, both gated: the gh-pages subpath push + release asset at GO (armed
# first), and the evidence-page seal push at movement 17.

instrument: claude-code
instrument_config:
  timeout_seconds: 1800

# Judgment movements WITHOUT a calibration role may fall back across vendors.
# The calibration chain (5, 6, 9, 10, 18) overrides this with empty chains —
# see per-movement instrument_fallbacks below.
instrument_fallbacks: [codex-cli, opencode]

movements:
  # ── Phase 0-1 · Pin the world, then manufacture the interface ────────────────
  1:
    name: "Pin the World"
    instrument: claude-code    # license clause-by-clause reading is genuine
                               # legal-semantic judgment; every probe around it
                               # is prescribed CLI the validation re-runs
  2:
    name: "Canonical Census"
    instrument: claude-code    # extraction is tooling; segment-boundary curation
                               # (what IS a translatable unit in prose) is where
                               # quality lives — semantic
  3:
    name: "Contract Authoring"
    instrument: claude-code
    instrument_config:
      timeout_seconds: 3600    # glossary × 6 locales + 5 registers + RTL spec
                               # + threshold pre-registration, one sitting
  # ── Phase 1-2 · The gate's frozen interface and its ruler ────────────────────
  4:
    name: "Pin + Ruler Factory"
    instrument: cli            # Etiquette Law: hashing and ruler materialization
    instrument_fallbacks: []   # are deterministic; an LLM touching the manifest
                               # would violate the law at the boundary's root
  # ── Phase 2 · First article, characterized by a different family ─────────────
  5:
    name: "First Article (es)"
    instrument: claude-code    # family A — the article being characterized
    instrument_fallbacks: []   # ANY fallback collapses the family separation
    instrument_config:         # and voids the calibration claim: fail loudly
      timeout_seconds: 3600
  6:
    name: "Characterize (es)"
    instrument: codex-cli      # family B ≠ writer family — mandatory anti-fraud
    instrument_fallbacks: []   # structure, not preference; empty by the same law
    instrument_config:
      timeout_seconds: 3600
  7:
    name: "Reference Freeze"
    instrument: cli            # stamping a hash is a command
    instrument_fallbacks: []
  # ── Phase 2-3 · Teeth before volume ──────────────────────────────────────────
  8:
    name: "Gate Teeth"
    instrument: cli            # fixtures must fail against commands, not opinions
    instrument_fallbacks: []
  # ── Phase 3 · Volume fan-out ─────────────────────────────────────────────────
  9:
    name: "Volume Writers"
    instrument: opencode       # instance 1 (fr); instances 2/3 overridden below —
    instrument_fallbacks: []   # pinned vendor spread (idiomatic range); the
    instrument_config:         # sweep measures them, they never measure themselves
      timeout_seconds: 3600
  10:
    name: "Arabic Writer"
    instrument: opencode
    instrument_fallbacks: []
    instrument_config:
      timeout_seconds: 3600
  # ── Phase 4-5 · Algebra, then the composite the algebra cannot join ──────────
  11:
    name: "Lattice Join"
    instrument: cli            # Join-Semilattice Merge: NO LLM participates in
    instrument_fallbacks: []   # merging — this is the proof's Etiquette centerpiece
  12:
    name: "Build Buffer B"
    instrument: cli            # a static build is a function of its inputs
    instrument_fallbacks: []
    instrument_config:
      timeout_seconds: 1800    # six editions + RSS + hreflang matrix
  13:
    name: "EXP Battery + Sweep"
    instrument: cli            # the sweep GRANTS the merge; empty fallback —
    instrument_fallbacks: []   # a fallback for a clock is a second clock
    instrument_config:
      timeout_seconds: 1800    # pseudo-loc edition build + full sweep
  # ── Phase 6-8 · Authority, cutover, live seam ────────────────────────────────
  14:
    name: "Merge Authority"
    instrument: claude-code    # conflict adjudication + disposition prose are
    instrument_config:         # judgment; admission power is mechanically bounded
      timeout_seconds: 1800    # by jq-checkable preconditions — a full-CLI merge
                               # would silently overwrite the dissent the corpus
                               # says to preserve
  15:
    name: "Ack Set + Arm-Gate"
    instrument: cli            # Standby-GO: ack arithmetic + fingerprint compare
    instrument_fallbacks: []   # must be mechanical; hold-fail leaves A serving
  16:
    name: "GO"
    instrument: cli            # pointer flip + release attach are API calls with
    instrument_fallbacks: []   # exit codes; exactly-once by cue-log construction
    instrument_config:
      timeout_seconds: 2400    # includes the bounded Pages deploy poll
  17:
    name: "Live Verify + Seal"
    instrument: cli            # curl the DEPLOYED artifact; recompute from the
    instrument_fallbacks: []   # PUBLISHED bytes alone
    instrument_config:
      timeout_seconds: 1200
  18:
    name: "Back-Translation Oracle"
    instrument: opencode-gemma # family C (Gemma, local) ≠ writer-of-record (GLM)
    instrument_fallbacks: []   # and ≠ characterizer (GPT) — the third family;
    instrument_config:         # empty chain so any collapse fails loudly. The
      timeout_seconds: 2400    # family join is validated from pin/instrument-
                               # families.json, not from instrument names.

sheet:
  size: 1
  total_items: 18            # movements pre-expansion; engine expands to 20 sheets
  fan_out:
    9: 3                     # volume writers: fr / de / pt-BR (sheets 9-11)
  dependencies:              # movement-keyed; engine expands to the sheet DAG
    2: [1]
    3: [2]
    4: [3]
    5: [4]
    6: [5]
    7: [6]
    8: [7]
    9: [8, 7]                # teeth before ALL volume (rev 2: rev 1 gated only
                             # ar behind movement 8 — the three LTR writers ran
                             # parallel to the teeth, spending tokens against
                             # gates that might be dead). Every writer now
                             # depends on PROVEN teeth; movement-keyed
                             # dependencies make pre-gate admission
                             # structurally unrenderable, not merely discouraged
    10: [8, 7]               # ar: same gate, plus the RTL tooth
    11: [9, 10]              # join waits for ALL writers (fan-in)
    12: [11]
    13: [12]
    14: [13]
    15: [14]
    16: [15]
    17: [16]
    18: [16]                 # oracle is post-GO by design: an LLM opinion must
                             # never be a cutover condition; oracle failure
                             # routes to the errata path, not a half-served state

  # Vendor assignment table, pinned as score data (load-bearing — see header).
  # Families (probed at movement 1 into pin/instrument-families.json):
  #   es=claude-code(GLM)[A] · characterize=codex-cli(GPT)[B] · oracle=
  #   opencode-gemma(Gemma)[C] — pairwise distinct. Volume spread: fr=opencode
  #   (GLM) · de=codex-cli(GPT) · pt-BR=claude-code(GLM) · ar=opencode(GLM);
  #   merge authority=claude-code (no calibration role, fallback allowed).
  per_sheet_instruments:
    9: opencode               # expanded sheet 9  = volume instance 1 (fr)
    10: codex-cli             # expanded sheet 10 = volume instance 2 (de)
    11: claude-code           # expanded sheet 11 = volume instance 3 (pt-BR)

  skip_when:
    7:                        # reference-freeze fingerprint probe, command-form:
      command: '[ -f {workspace}/reference/manifest.json ] && jq -e --arg h "$(jq -r .config_fingerprint {workspace}/contract/MANIFEST.json 2>/dev/null)" ''.config_hash == $h'' {workspace}/reference/manifest.json >/dev/null 2>&1'
      description: "Skip re-freeze when the reference already binds the CURRENT contract fingerprint"
      timeout_seconds: 30

  cadenzas:
    # Contract slices — each writer receives ONLY its interface slice (skeleton
    # + glossary + own register + reference thresholds), never another locale's
    # work. Injected as skill: methodology BEFORE the body; required: a missing
    # contract file fails the sheet before execution. NOTE: the architecture
    # proposed spec_dir/spec_tags for this wiring, but the spec corpus loads at
    # job REGISTRATION from the workspace — before movement 3 authors the
    # contract — so the runtime-negotiated contract rides cadenzas, which are
    # read at sheet-execution time. Intent preserved; mechanism corrected.
    5:                        # es first article — NO reference exists yet
      - file: "{{ workspace }}/contract/canonical-en.pot"
        as: skill
        required: true
      - file: "{{ workspace }}/contract/glossary.json"
        as: skill
        required: true
      - file: "{{ workspace }}/contract/register-es.md"
        as: skill
        required: true
      - file: "{{ workspace }}/contract/thresholds.json"
        as: skill
        required: true
    9:                        # fr — volume writer, reference in hand
      - file: "{{ workspace }}/contract/canonical-en.pot"
        as: skill
        required: true
      - file: "{{ workspace }}/contract/glossary.json"
        as: skill
        required: true
      - file: "{{ workspace }}/contract/register-fr.md"
        as: skill
        required: true
      - file: "{{ workspace }}/reference/manifest.json"
        as: skill
        required: true
    10:                       # de
      - file: "{{ workspace }}/contract/canonical-en.pot"
        as: skill
        required: true
      - file: "{{ workspace }}/contract/glossary.json"
        as: skill
        required: true
      - file: "{{ workspace }}/contract/register-de.md"
        as: skill
        required: true
      - file: "{{ workspace }}/reference/manifest.json"
        as: skill
        required: true
    11:                       # pt-BR
      - file: "{{ workspace }}/contract/canonical-en.pot"
        as: skill
        required: true
      - file: "{{ workspace }}/contract/glossary.json"
        as: skill
        required: true
      - file: "{{ workspace }}/contract/register-pt-BR.md"
        as: skill
        required: true
      - file: "{{ workspace }}/reference/manifest.json"
        as: skill
        required: true
    12:                       # ar — plus the RTL specification
      - file: "{{ workspace }}/contract/canonical-en.pot"
        as: skill
        required: true
      - file: "{{ workspace }}/contract/glossary.json"
        as: skill
        required: true
      - file: "{{ workspace }}/contract/register-ar.md"
        as: skill
        required: true
      - file: "{{ workspace }}/contract/rtl-spec.md"
        as: skill
        required: true
      - file: "{{ workspace }}/reference/manifest.json"
        as: skill
        required: true

  descriptions:
    1: "Pin the world — clone@sha, license verdict, buffer-A fingerprint, host inventory, three-family self-canary"
    2: "Canonical census — POT skeleton + segment-census.json from the frozen docs subset"
    3: "Contract authoring — glossary ×6 locales, registers, RTL spec, threshold PRE-registration"
    4: "Pin the contract (MANIFEST + config fingerprint) + materialize the static measurement ruler"
    5: "First article — es translation + attestation (family A, no reference yet)"
    6: "Characterize es — keyed manifest + first-article statistics + negative control (family B)"
    7: "Reference freeze — config-hash stamp; skips iff the fingerprint is unchanged"
    8: "Gate teeth — nine corrupted fixtures, each failing exactly its intended gate"
    9: "Volume writer — fr (opencode, instance-tagged namespace)"
    10: "Volume writer — de (codex-cli, instance-tagged namespace)"
    11: "Volume writer — pt-BR (claude-code, instance-tagged namespace)"
    12: "Arabic writer — ar, gated behind proven RTL teeth (opencode)"
    13: "Lattice join — union by msgid, conflict detection, idempotence + commutativity probes"
    14: "Build buffer B — six editions, hreflang matrix, per-locale RSS, portal, evidence stub, dir=rtl"
    15: "EXP battery + the deterministic sweep that grants the merge (pseudo-loc no-clip, plurals, RTL DOM)"
    16: "Merge authority — admit attestation-AND-sweep passers; adjudicate the planted conflict; dispositions"
    17: "Ack-set completion + arm-gate incl. buffer-A re-fingerprint (hold, never fire, on drift)"
    18: "GO — exactly-once cue, one non-force subpath push, release asset, bounded deploy poll"
    19: "Live verify + terminal recompute seal from served URLs; evidence page completed"
    20: "Back-translation oracle — seeded stratified sample, scripted recall (family C)"

parallel:
  enabled: true
  max_concurrent: 4          # the DAG's widest level is 4: gate teeth + the
  fail_fast: true            # 3-way writer fan-out, all independent of each other

# cross_sheet: deliberately ABSENT — the workspace IS the shared memory (the
# contract, attestations, reports), and writers must not see each other's
# stdout: independence is the mechanism, not a limitation.

retry:
  max_retries: 1             # GO is idempotent by cue-log construction (a retry
  base_delay_seconds: 30     # of an already-fired GO re-verifies, never re-fires)

stale_detection:
  enabled: true
  idle_timeout_seconds: 1800 # CLI movements run silent subprocess fans; the #1
                             # cause of stuck verification stages is a tight idle

prompt:
  variables:
    # ── The only project-specific inputs (GENERICITY) ─────────────────────────
    github_owner: "Mzzkc"
    docs_repo: "marianne-ai-compose"
    pinned_sha: "802f9903f0068310d21124a97f9fea3b759a00ea"
    pages_base: "mzzkc.github.io"
    site_url: "https://mzzkc.github.io/marianne-ai-compose"
    gh_pages_ref: "refs/heads/gh-pages"
    # ── Corpus shape ───────────────────────────────────────────────────────────
    docs_subset:
      - "docs/getting-started.md"
      - "docs/README.md"
    locales: ["es", "fr", "de", "pt-BR", "ar"]
    volume_locale_by_instance: {1: "fr", 2: "de", 3: "pt-BR"}
    locale_direction: {es: "ltr", fr: "ltr", de: "ltr", "pt-BR": "ltr", ar: "rtl"}
    # ── Tool pins (host facts re-probed by movement 1; msgfmt/hugo/linkchecker
    #    are ABSENT — polib compiles .mo, the build is pure-Python, links are
    #    checked by the shipped checker) ───────────────────────────────────────
    polib_pin: "1.2.0"
    babel_pin: "2.18.0"
    ruler_py: "uv run --quiet --with polib==1.2.0 --with babel==2.18.0 python"
    # ── Oracle sample frame (auditable denominator — scope decision 4) ─────────
    oracle_seed: 42
    oracle_sample_per_locale: 15
    # ── Standby-GO cue identity (TWO armed cues, both disclosed in the header) ─
    cue: "babel-go-1"
    evidence_cue: "babel-evidence-1"

  template: |
    {# ══════════ Macros: the house style, defined once ══════════════════════ #}
    {% macro strict() %}
    set -euo pipefail
    cd "{{ workspace }}"
    {% endmacro %}

    {% macro ruler(py = ruler_py) %}{{ py }}{% endmacro %}

    {% macro ai_ground_rules() %}
    ## Ground Rules (non-negotiable)
    - Fabrication wears completion's clothes: never write a placeholder where a
      real artifact is owed, and never claim a command ran without running it.
    - Stamp every JSON artifact you author with `"instrument": "{{ instrument_name }}"`
      — the evidence page renders the ACTUAL vendor table from these stamps.
    - The deterministic gates are the coordination. If a gate fails against your
      work, fix the work or route the disagreement to a disposition record —
      never the gate.
    {% endmacro %}

    {% macro attestation_contract() %}
    ## Attestation (write exactly this schema, real hashes — recomputed later)
    `work/locale-{{ '*' }}/attestation.json` — replace {{ '*' }} with your locale:
    ```json
    {
      "locale": "<your locale>",
      "instrument": "{{ instrument_name }}",
      "consumed_spec_hashes": {"<contract file>": "<sha256 of the file you READ>"},
      "output_files": ["work/locale-<X>/<X>.po"],
      "output_hashes": {"work/locale-<X>/<X>.po": "<sha256>"},
      "conformance_claim": "one honest sentence: what you conformed to, and any dissent"
    }
    ```
    Compute hashes with `sha256sum`. The validation recomputes every one.
    {% endmacro %}

    {% macro writer_mission(locale, has_reference, is_rtl) %}
    # Translation Writer — locale `{{ locale }}`

    Your cadenza (injected above) is your ENTIRE interface: the canonical
    English skeleton, the negotiated bilingual glossary, your locale's style
    register{% if is_rtl %}, and the Arabic RTL/bidi specification{% endif %}{% if has_reference %}, plus the frozen
    reference manifest (keyed checks + first-article statistics + thresholds){% endif %}.
    You receive no other locale's work. Nobody receives yours.

    ## Task
    Translate EVERY msgid in the skeleton into `{{ locale }}`, writing a valid
    gettext catalog to `{{ workspace }}/work/locale-{{ locale }}/{{ locale }}.po`:
    - metadata header with `Language: {{ locale }}` and a `Plural-Forms:` line
      whose `nplurals` matches babel's rule for `{{ locale }}`
      ({{ locale_direction[locale] }}{% if is_rtl %} — RTL: bidi, mirroring, and numeral rules are gated, see the spec{% endif %});
    - one entry per skeleton msgid, `msgstr` carrying the translation;
    - glossary decisions are CONTRACT: `keep` means the English term appears
      verbatim; `translate`/`hybrid` means the glossary's term appears
      (hybrid may gloss it on first use);
    - format-string tokens (`%s`, `%(name)s`, `{name}`) pass through EXACTLY;
    - register rules govern voice, address form, and idiom-vs-calque.
    {% if has_reference %}
    ## Self-measurement (the ruler is not your judge — the sweep is)
    Run the ruler on your own output and iterate until it passes:
    ```
    cd {{ workspace }} && {{ ruler() }} scripts/catalog-validate.py \
      --po work/locale-{{ locale }}/{{ locale }}.po \
      --skeleton contract/canonical-en.pot --glossary contract/glossary.json \
      --thresholds contract/thresholds.json --locale {{ locale }} \
      --reference reference/manifest.json{% if is_rtl %} --rtl{% endif %} \
      --report work/locale-{{ locale }}/self-check.json
    ```
    {% else %}
    ## Self-measurement (no reference exists yet — you ARE the reference)
    Run the ruler without `--reference` (the z-score check will be born from
    your output; the band checks still apply):
    ```
    cd {{ workspace }} && {{ ruler() }} scripts/catalog-validate.py \
      --po work/locale-{{ locale }}/{{ locale }}.po \
      --skeleton contract/canonical-en.pot --glossary contract/glossary.json \
      --thresholds contract/thresholds.json --locale {{ locale }} \
      --report work/locale-{{ locale }}/self-check.json
    ```
    {% endif %}
    ## Namespace discipline
    Write ONLY inside `work/locale-{{ locale }}/`. Touching any other locale's
    namespace (or the contract tree) is a boundary violation the attestation
    cannot hide.

    ## Ack
    When your catalog passes the ruler, write `{{ workspace }}/ready-{{ locale }}.json`:
    `{"locale": "{{ locale }}", "instrument": "{{ instrument_name }}", "po_sha256": "<hash>"}`.
    If you cannot complete, write NOTHING — a missing ack holds the cue (the
    arm-gate counts acks, it does not beg for them).

    {{ attestation_contract() }}
    {{ ai_ground_rules() }}
    {% endmacro %}

    {% if stage == 1 %}
    # Movement 1 · Pin the World — nothing downstream may move until this lands

    You hold FIVE probes and one judgment. Run the probes exactly as given
    (their validations re-run them), then make the judgment.

    ## 1. Clone + pin the source
    ```bash
    {{ strict() }}
    mkdir -p pin
    if [ ! -d repo/.git ]; then
      git clone -q "https://github.com/{{ github_owner }}/{{ docs_repo }}.git" repo
    fi
    git -C repo checkout -q {{ pinned_sha }}
    echo "$(git -C repo rev-parse HEAD)" > pin/clone-head.txt
    ```
    `pin/clone-head.txt` must equal `{{ pinned_sha }}`.

    ## 2. Buffer-A fingerprint (the live English site we must never break)
    ```bash
    {{ strict() }}
    curl -sfL "{{ site_url }}/" -o pin/buffer-A-index.html
    idx="$(sha256sum pin/buffer-A-index.html | cut -d' ' -f1)"
    head="$(git ls-remote "https://github.com/{{ github_owner }}/{{ docs_repo }}.git" {{ gh_pages_ref }} | cut -f1)"
    jq -n --arg i "$idx" --arg h "$head" --arg u "{{ site_url }}/" \
      '{served_index_sha256: $i, gh_pages_head: $h, url: $u,
        probed_at: (now | todate)}' > pin/buffer-A-fingerprint.json
    ```

    ## 3. Host inventory (every tool any shipped script names — PROBED, absences
    ##    included; a score whose identity is "probe, never assume" must not
    ##    ship an inventory that asserts its absences instead of probing them)
    ```bash
    {{ strict() }}
    present() { command -v "$1" >/dev/null 2>&1 && echo true || echo false; }
    jq -n \
      --argjson git "$(present git)" --argjson curl "$(present curl)" \
      --argjson jq "$(present jq)" --argjson gh "$(present gh)" \
      --argjson uv "$(present uv)" --argjson sha256sum "$(present sha256sum)" \
      --argjson msgfmt "$(present msgfmt)" --argjson hugo "$(present hugo)" \
      --argjson linkchecker "$(present linkchecker)" --argjson xmllint "$(present xmllint)" \
      --arg babel "$({{ ruler() }} -c 'import babel; print(babel.__version__)' 2>/dev/null || echo absent)" \
      --arg polib "$({{ ruler() }} -c 'import polib; print(polib.__version__)' 2>/dev/null || echo absent)" \
      '{git: $git, curl: $curl, jq: $jq, gh: $gh, uv: $uv, sha256sum: $sha256sum,
        msgfmt: $msgfmt, hugo: $hugo, linkchecker: $linkchecker, xmllint: $xmllint,
        babel: $babel, polib: $polib}' > pin/host-inventory.json
    ```
    (On this host msgfmt/hugo/linkchecker/xmllint are expected ABSENT — the
    substitutions are polib-compiled `.mo`, a pure-Python build, and the
    shipped link checker. The inventory records what the PROBE says; if a
    tool is present where a substitution assumed absence, the score still
    uses its own substitution — but the record is true.)

    ## 4. Vendor-family probe — instrument names prove nothing; model strings do
    ```bash
    {{ strict() }}
    mzt instruments list --json > pin/instruments-raw.json
    python3 - <<'PY'
    import json, sys
    raw = json.load(open("pin/instruments-raw.json"))
    # Instruments without a pinned default model route by their own vendor
    # construction (codex-cli is OpenAI's Codex CLI), so the brand is the
    # family source of record for them; pinned models outrank brands. The
    # family_source field keeps the provenance auditable either way.
    BRAND = {"codex-cli": "GPT"}
    def fam(model):
        m = (model or "").lower()
        if any(k in m for k in ("glm", "zai", "z.ai")): return "GLM"
        if any(k in m for k in ("gpt", "openai", "o3", "o4", "codex")): return "GPT"
        if any(k in m for k in ("gemma", "gemini", "google")): return "GEMMA"
        if "claude" in m: return "ANTHROPIC"
        return None
    want = ["claude-code", "codex-cli", "opencode-gemma", "opencode"]
    rows = {}
    for r in raw:
        if r.get("name") not in want:
            continue
        model = r.get("default_model")
        by_model = fam(model)
        by_brand = BRAND.get(r["name"])
        rows[r["name"]] = {
            "status": r.get("status"), "default_model": model,
            "family": by_model or by_brand or "UNKNOWN",
            "family_source": "model-pin" if by_model else
                             ("instrument-brand" if by_brand else "none")}
    missing = [n for n in want if n not in rows]
    if missing:
        sys.exit("FAIL: instruments not configured: %s" % missing)
    chain = {"writer_es": "claude-code", "characterizer": "codex-cli",
             "oracle": "opencode-gemma"}
    fams = {role: rows[inst]["family"] for role, inst in chain.items()}
    if len(set(fams.values())) != 3:
        sys.exit("FAIL: calibration-family collapse: %s — instrument names are "
                 "not vendor separation; fix the profiles' default models" % fams)
    for role, inst in chain.items():
        if rows[inst]["status"] != "ready":
            sys.exit("FAIL: %s (%s) not ready" % (inst, role))
    json.dump({"instruments": rows, "calibration_chain": chain,
               "calibration_families": fams},
              open("pin/instrument-families.json", "w"), indent=2, sort_keys=True)
    print("families:", fams)
    PY
    ```

    ## 5. Self-canary — the publish identity (re-run verbatim by the validation)
    ```bash
    {{ strict() }}
    gh auth status >/dev/null 2>&1 || { echo "FAIL: gh not authenticated"; exit 1; }
    [ "$(gh api user -q .login)" = "{{ github_owner }}" ] || { echo "FAIL: gh is $(gh api user -q .login), score publishes as {{ github_owner }}"; exit 1; }
    for bin in claude codex opencode; do
      command -v "$bin" >/dev/null 2>&1 || { echo "FAIL: $bin missing — its pinned sheet would die mid-run"; exit 1; }
    done
    echo "self-canary ok"
    ```

    ## 5. License clearance (the judgment)
    Read `repo/LICENSE` and `repo/LICENSE-AGPL` clause by clause, for
    derivative-translation rights and notice-carry-through obligations on the
    `{{ docs_subset | join(", ") }}` subset. Write `{{ workspace }}/pin/license-clearance.md`
    with: the exact clauses relied on, the notices the multilingual edition must
    carry, and a final line, verbatim one of:
    `VERDICT: AGPL-COMPLIANT-WITH-NOTICES`
    `VERDICT: FALLBACK-TRIGGERED`
    If (and only if) the verdict is FALLBACK-TRIGGERED: write the file first,
    then exit NONZERO with a message naming the blocking clause — the run holds
    loudly with buffer A still serving and no translation token spent; the
    canonical-source fallback is a composer decision, not a sheet's.

    {{ ai_ground_rules() }}

    {% elif stage == 2 %}
    # Movement 2 · Canonical Census — measure N, never assume it

    The frozen docs subset is `{{ docs_subset | join(", ") }}` inside `{{ workspace }}/repo`
    (already pinned to `{{ pinned_sha }}`). Produce the gettext skeleton the
    five writers will translate against.

    ## Task
    1. Author `{{ workspace }}/scripts/segment-markdown.py`: split each document
       into translatable units — headings, paragraphs, list items, table cells,
       blockquote prose — leaving code fences, inline code, URLs, and YAML
       front-matter verbatim. Record `{msgid, source_path, line, kind,
       msgid_sha}` per segment, where `msgid_sha` is the first 16 hex chars of
       `sha256(msgid)` — the RSS guids, the oracle sample frame, and the
       characterization spot-checks all key on it, so it must be present and
       exact. Curate the boundaries: a segment too long loses glossary
       precision; too short loses register. You choose the grain; the census
       records it.
    2. Write the POT with polib (one POEntry per segment, empty msgstr,
       occurrences `(source_path, line)`) to `{{ workspace }}/contract/canonical-en.pot`.
    3. Write `{{ workspace }}/contract/segment-census.json`: the full segment
       list. Then append to `{{ workspace }}/pin/pin-record.json`:
       `{"canonical_pot_sha256": "<sha256>", "segment_count": <N>}`.
    4. Print the census table (kind → count) to stdout.

    COVERAGE IS THE OUTCOME: the census must carry every heading and ≥85% of
    the prose words of each subset document (code fences excluded) — the
    validation measures both against the pinned bytes, not against your own
    output. A bijective POT/census pair that omits half a document is process
    hygiene, not a census.

    Every msgid must be traceable to a source path and line; the count in the
    census must equal the POT's entry count exactly.

    {{ ai_ground_rules() }}

    {% elif stage == 3 %}
    # Movement 3 · Contract Authoring — the interface, frozen BEFORE any writer

    Everything you author here is pinned by hash in the next movement and
    gated downstream. Nothing in this contract may reference any translation —
    none exists. Thresholds are PRE-REGISTRATION: declare what good looks like
    before the first article is measured, and know that moving one afterward is
    detectable by construction (the contract is hash-pinned).

    ## 1. `{{ workspace }}/contract/glossary.json` — the bilingual terminology contract
    Enumerate the project's orchestral jargon from the skeleton (at minimum:
    score, movement, sheet, concert, conductor, composer, musician, instrument,
    prelude, cadenza, venue — plus every domain term the docs carry). Schema,
    exactly:
    ```json
    {"terms": [{"term_id": "...", "en": "...",
      "translations": {"es": {"term": "...", "note": "...", "decision": "keep|translate|hybrid"},
                       "fr": {...}, "de": {...}, "pt-BR": {...}, "ar": {...}}}]}
    ```
    Every locale × every term carries a decision. `keep` ⇒ `term` equals `en`.

    ## 2. `{{ workspace }}/contract/register-{es,fr,de,pt-BR,ar}.md` — voice per market
    Address form, tone, idiom-vs-calque policy, code-term handling. Each file's
    first line: `REGISTER: <locale>`.

    ## 3. `{{ workspace }}/contract/rtl-spec.md` — Arabic as a first-class surface
    Bidirectional punctuation, numeral rendering, mirroring. Every checkable
    property on its own line: `PROP: <machine-checkable statement>` (catalog
    level: bracket balance per msgstr, numeral policy; page level: `dir="rtl"`,
    mirrored navigation order — the gates implement exactly these).

    ## 4. `{{ workspace }}/contract/thresholds.json` — PRE-REGISTERED metrology
    Exactly these keys, numeric, each with a one-sentence rationale in a
    sibling `_rationale` field:
    ```json
    {"terminology_hit_rate_min": 0.90,
     "terminology_hit_rate_min_rationale": "...",
     "length_ratio_z_max": 4.0,
     "length_ratio_z_max_rationale": "...",
     "length_ratio_bounds_by_locale": {"es": {"min": 0.6, "max": 1.8},
                                        "fr": {"min": 0.6, "max": 1.8},
                                        "de": {"min": 0.7, "max": 2.0},
                                        "pt-BR": {"min": 0.6, "max": 1.9},
                                        "ar": {"min": 0.5, "max": 1.8}},
     "length_ratio_bounds_rationale": "one sentence: the linguistics behind
                                       each per-locale band (German expansion,
                                       Arabic contraction, ...)",
     "oracle_recall_floor": 0.85,
     "oracle_recall_floor_rationale": "..."}
    ```
    You choose the numbers; you defend them in the rationales; the sweep
    enforces them verbatim. The per-locale absolute bands matter: the z-score
    against the Spanish first article is a RELATIVE instrument, and a
    typologically distant locale can be honestly outside it for linguistics,
    not quality — the absolute bands are the pre-registered per-locale truth,
    the z-score the drift detector. Floors are bounded by the validation
    (a pre-registration of 0.05 is pre-registration-shaped, not
    pre-registration-strong).

    {{ ai_ground_rules() }}

    {% elif stage == 4 %}
    {{ strict() }}
    # ── Movement 4 · Pin the contract + materialize the ruler ──────────────────
    # Deterministic. No LLM fallback (empty chain). The ruler is STATIC so the
    # characterizer can select and restate checks but never machine the ruler.
    mkdir -p scripts reference
    python3 - <<'PY'
    import hashlib, json, subprocess, sys
    from pathlib import Path
    ws = Path(".")
    contract_files = sorted(p for p in (ws / "contract").iterdir()
                            if p.is_file() and p.name != "MANIFEST.json")
    files = {str(p.relative_to(ws)): hashlib.sha256(p.read_bytes()).hexdigest()
             for p in contract_files}
    def tool_ver():
        return subprocess.run(
            ["uv", "run", "--quiet", "--with", "polib=={{ polib_pin }}",
             "--with", "babel=={{ babel_pin }}", "python", "-c",
             "import babel, polib; print(babel.__version__, polib.__version__)"],
            capture_output=True, text=True).stdout.strip()
    tv = tool_ver()
    if not tv:
        sys.exit("FAIL: pinned toolchain did not answer")
    fp_src = json.dumps([tv, files["contract/canonical-en.pot"],
                         files["contract/thresholds.json"]], sort_keys=True)
    manifest = {
        "files": files,
        "toolchain": tv,
        "config_fingerprint": hashlib.sha256(fp_src.encode()).hexdigest(),
    }
    (ws / "contract" / "MANIFEST.json").write_text(json.dumps(manifest, indent=2, sort_keys=True))
    print("pinned", len(files), "contract files; fingerprint", manifest["config_fingerprint"][:16])
    PY

    # ── The ruler: catalog-validate.py ─────────────────────────────────────────
    cat > scripts/catalog-validate.py <<'PY'
    #!/usr/bin/env python3
    """The deterministic catalog ruler. One locale per invocation.
    Checks (keys): format_parity, plural_coverage, skeleton_coverage (unless
    --partial), terminology_hit_rate, length_ratio_abs (per-locale absolute
    band — the pre-registered per-locale truth), length_ratio_z (only with
    --reference — the drift detector). --rtl adds the bidi balance gate.
    Exit 0 iff every applicable check passes; JSON report either way."""
    import argparse, json, re, sys
    import polib
    from babel.messages.plurals import get_plural

    TOKEN_RE = re.compile(r"%\([^)]+\)[sd]|%[sd]|\{[A-Za-z_][A-Za-z0-9_]*\}")

    def tokens(s):
        return sorted(TOKEN_RE.findall(s or ""))

    def wordish(term):
        return re.compile(r"(?<!\w)" + re.escape(term) + r"(?!\w)", re.IGNORECASE)

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--po", required=True)
        ap.add_argument("--skeleton", required=True)
        ap.add_argument("--glossary", required=True)
        ap.add_argument("--thresholds", required=True)
        ap.add_argument("--locale", required=True)
        ap.add_argument("--reference")
        ap.add_argument("--rtl", action="store_true")
        ap.add_argument("--partial", action="store_true",
                        help="skip skeleton bijection (single-defect fixture mode)")
        ap.add_argument("--report")
        a = ap.parse_args()

        th = json.load(open(a.thresholds))
        po = polib.pofile(a.po)
        skel = polib.pofile(a.skeleton)
        checks = {}
        entries = [e for e in po if e.msgid.strip() and not e.obsolete]

        # skeleton_coverage — bijection: nothing dropped, nothing invented
        # (skipped only in --partial fixture mode; every real catalog is whole)
        if not a.partial:
            sk_ids = {e.msgid for e in skel if e.msgid.strip()}
            po_ids = {e.msgid for e in entries}
            missing_n = len(sk_ids - po_ids)
            invented_n = len(po_ids - sk_ids)
            checks["skeleton_coverage"] = {
                "verdict": (missing_n == 0 and invented_n == 0),
                "measured": {"missing": missing_n, "invented": invented_n},
                "threshold": {"missing": 0, "invented": 0}}

        # format_parity — strict multiset bijection of format tokens
        bad_fmt = []
        for e in entries:
            src = tokens(e.msgid) + tokens(e.msgid_plural or "")
            dst = tokens(e.msgstr or "") + tokens("".join((e.msgstr_plural or {}).values()))
            if src != dst:
                bad_fmt.append(e.msgid[:40])
        checks["format_parity"] = {"verdict": not bad_fmt, "measured": len(bad_fmt),
                                   "threshold": 0, "failures": bad_fmt[:5]}

        # plural_coverage — header nplurals matches babel's rule for the locale
        loc = a.locale.replace("-", "_")
        try:
            nplurals, _expr = get_plural(loc)
        except Exception:
            nplurals = None
        header = po.metadata.get("Plural-Forms", "")
        m = re.search(r"nplurals\s*=\s*(\d+)", header)
        declared = int(m.group(1)) if m else None
        plural_ok = (nplurals is not None and declared == nplurals)
        short_plurals = [e.msgid[:40] for e in entries
                         if e.msgid_plural and len(e.msgstr_plural or {}) < nplurals]
        checks["plural_coverage"] = {
            "verdict": bool(plural_ok and not short_plurals),
            "babel_nplurals": nplurals, "declared_nplurals": declared,
            "threshold": nplurals, "short_entries": short_plurals[:5]}

        # terminology_hit_rate — word-boundary aware (never 'score' in 'scoreboard')
        gl = json.load(open(a.glossary))["terms"]
        denom, hits, misses = 0, 0, []
        for t in gl:
            tr = t["translations"].get(a.locale)
            if not tr:
                continue
            expected = t["en"] if tr["decision"] == "keep" else tr["term"]
            src_re, dst_re = wordish(t["en"]), wordish(expected)
            for e in entries:
                if src_re.search(e.msgid):
                    denom += 1
                    if dst_re.search(e.msgstr or ""):
                        hits += 1
                    else:
                        misses.append({"term_id": t["term_id"], "msgid": e.msgid[:40]})
        rate = (hits / denom) if denom else 1.0
        floor = float(th["terminology_hit_rate_min"])
        checks["terminology_hit_rate"] = {
            "verdict": rate >= floor, "measured": round(rate, 4), "threshold": floor,
            "n": denom, "misses": misses[:8]}

        # length_ratio_abs — per-locale ABSOLUTE band, pre-registered in the
        # contract (the per-locale truth; independent of any reference locale)
        ratios = [len(e.msgstr or "") / len(e.msgid) for e in entries
                  if (e.msgstr or "").strip() and len(e.msgid) >= 8]
        bounds = th.get("length_ratio_bounds_by_locale", {}).get(
            a.locale, {"min": 0.5, "max": 2.5})
        lo, hi = float(bounds["min"]), float(bounds["max"])
        out_of_band = [r for r in ratios if r < lo or r > hi]
        worst_abs = max(ratios) if ratios else None
        checks["length_ratio_abs"] = {
            "verdict": not out_of_band, "measured": round(worst_abs, 3) if worst_abs else None,
            "threshold": {"min": lo, "max": hi},
            "n_out_of_band": len(out_of_band)}

        # length_ratio_z — against the first-article distribution, if referenced
        if a.reference:
            ref = json.load(open(a.reference))
            fa = ref["first_article"]["length_ratio"]
            mean, sd = float(fa["mean"]), float(fa["sd"])
            zmax = float(th["length_ratio_z_max"])
            worst = max(abs((r - mean) / sd) for r in ratios) if ratios and sd > 0 else 0.0
            checks["length_ratio_z"] = {
                "verdict": worst <= zmax, "measured": round(worst, 3), "threshold": zmax,
                "n": len(ratios)}
        else:
            checks["length_ratio_z"] = {
                "verdict": True, "measured": None, "threshold": None,
                "note": "no reference supplied (first article)"}

        # rtl — bidi balance: mirrored pairs must balance per msgstr
        if a.rtl:
            unbal = []
            for e in entries:
                s = e.msgstr or ""
                if s.count("(") != s.count(")") or s.count("[") != s.count("]"):
                    unbal.append(e.msgid[:40])
            checks["rtl_bidi_balance"] = {"verdict": not unbal, "measured": len(unbal),
                                          "threshold": 0, "failures": unbal[:5]}

        report = {"locale": a.locale, "checks": checks,
                  "pass": all(c["verdict"] for c in checks.values())}
        if a.report:
            import os
            rdir = os.path.dirname(a.report)
            if rdir:
                os.makedirs(rdir, exist_ok=True)
            json.dump(report, open(a.report, "w"), indent=2, sort_keys=True)
        print(("PASS " if report["pass"] else "FAIL ") + a.locale +
              " " + ",".join(k for k, c in checks.items() if not c["verdict"]))
        sys.exit(0 if report["pass"] else 1)
    main()
    PY

    # ── The algebraic join: join-catalogs.py (authored here, teeth at mv 8,
    #    executed for real at mv 11 — no LLM ever participates) ─────────────────
    cat > scripts/join-catalogs.py <<'PY'
    #!/usr/bin/env python3
    """Join-Semilattice Merge at the catalog layer: union by msgid per locale,
    dedupe by content digest, CONFLICT DETECTION for same-locale/same-msgid
    divergence. Deterministic: sorted iteration, content-addressed. Probes
    (idempotence, commutativity) are run by the caller on this script's output."""
    import argparse, hashlib, json
    from pathlib import Path
    import polib

    def digest(entry):
        return hashlib.sha256((entry.msgid + "\x00" + (entry.msgstr or "") +
                               "\x00" + (entry.msgid_plural or "")).encode()).hexdigest()

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--inputs", nargs="+", required=True,
                        help="po files; basename-minus-.po is the claimed locale")
        ap.add_argument("--out-dir", required=True)
        ap.add_argument("--conflicts-out", required=True)
        a = ap.parse_args()
        out = Path(a.out_dir); out.mkdir(parents=True, exist_ok=True)
        by_locale = {}
        for p in a.inputs:
            locale = Path(p).name[:-3]
            by_locale.setdefault(locale, []).append(Path(p))
        conflicts, merged, metas = [], {}, {}
        for locale in sorted(by_locale):
            best, seen = None, {}
            for path in sorted(by_locale[locale]):
                po = polib.pofile(str(path))
                if best is None:
                    best = po
                    # carry the writer's metadata VERBATIM — Plural-Forms above
                    # all: a joined catalog that loses it declares nplurals=None
                    # and the sweep red-flags every locale for a join artifact,
                    # not a translation defect
                    metas[locale] = dict(po.metadata)
                for e in po:
                    if not e.msgid.strip() or e.obsolete:
                        continue
                    d = digest(e)
                    if e.msgid in seen and seen[e.msgid][0] != d:
                        conflicts.append({
                            "locale": locale, "msgid": e.msgid,
                            "digests": sorted([seen[e.msgid][0], d]),
                            "sources": sorted([seen[e.msgid][1], str(path)])})
                    elif e.msgid not in seen:
                        seen[e.msgid] = (d, str(path))
            if best is not None:
                keep = {mid: d for mid, (d, _) in seen.items()}
                for e in best:
                    if e.msgid in keep and e.msgid.strip() and not e.obsolete:
                        merged.setdefault(locale, []).append(e)
        for locale, entries in merged.items():
            po = polib.POFile()
            po.metadata = metas.get(locale, {"Language": locale})
            for e in sorted(entries, key=lambda x: x.msgid):
                po.append(e)
            po.save(str(out / (locale + ".po")))
        Path(a.conflicts_out).write_text(json.dumps(conflicts, indent=2, sort_keys=True))
        print("joined", sorted(merged), "locales;", len(conflicts), "conflicts")
    main()
    PY

    # ── The EXP gate: exp-gate.py (no-clip, RTL DOM, hreflang, links) ──────────
    cat > scripts/exp-gate.py <<'PY'
    #!/usr/bin/env python3
    """EXP battery. Modes: --noclick DIR (pseudo-loc strings render COMPLETE +
    CSS never truncates) · --rtl PAGE BASE (dir=rtl + nav mirror) ·
    --hreflang DIR (reciprocal alternate matrix) · --links DIR (internal hrefs
    resolve). Exit 0 iff the mode passes."""
    import argparse, json, re, sys
    from pathlib import Path
    from xml.etree import ElementTree

    def pages(d):
        return sorted(Path(d).rglob("*.html"))

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--noclick", dest="noclick")
        ap.add_argument("--strings", help="JSON list of pseudo strings that must appear IN FULL")
        ap.add_argument("--rtl", nargs=2, metavar=("AR_PAGE", "BASE_PAGE"))
        ap.add_argument("--hreflang"); ap.add_argument("--links")
        a = ap.parse_args()
        if a.noclick:
            strings = json.load(open(a.strings))
            css = ""
            union = ""
            for p in pages(a.noclick):
                html = p.read_text(encoding="utf-8")
                union += html
                css += "\n".join(re.findall(r"<style[^>]*>(.*?)</style>", html, re.S))
            def esc(t):
                return t.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
            missing = [s for s in strings
                       if s not in union and esc(s) not in union]
            if missing:
                sys.exit("FAIL noclip: %d stress strings truncated or absent, e.g. %r"
                         % (len(missing), missing[0][:50]))
            for forbidden in ("text-overflow:ellipsis", "text-overflow: ellipsis"):
                if forbidden in css:
                    sys.exit("FAIL noclip: truncating CSS policy: " + forbidden)
            if "overflow-wrap" not in css and "word-break" not in css:
                sys.exit("FAIL noclip: no overflow-wrap/word-break policy in CSS")
            print("noclip ok:", len(strings), "stress strings render complete; CSS non-truncating")
        elif a.rtl:
            ar = Path(a.rtl[0]).read_text(encoding="utf-8")
            base = Path(a.rtl[1]).read_text(encoding="utf-8")
            if 'dir="rtl"' not in ar:
                sys.exit("FAIL rtl: dir=rtl absent")
            if 'lang="ar"' not in ar:
                sys.exit("FAIL rtl: lang=ar absent")
            nav = lambda h: re.findall(r'<nav[^>]*>.*?</nav>', h, re.S)
            def order(h):
                m = nav(h)
                if not m:
                    sys.exit("FAIL rtl: no nav element")
                return re.findall(r'href="([^"]+)"', m[0])
            if order(ar) != list(reversed(order(base))):
                sys.exit("FAIL rtl: navigation is not mirrored")
            print("rtl ok: dir=rtl, lang=ar, mirrored navigation")
        elif a.hreflang:
            # FULL RECIPROCITY over EDITION pages, not matrix-shape. An
            # EDITION page is one whose self-language alternate resolves to
            # itself (the hreflang definition of a translation equivalent).
            # For every edition page P and every language l it declares:
            # resolve to a concrete page T, and T's alternate for P's own
            # language must resolve back to P. Auxiliary pages (portal,
            # evidence: language-neutral hubs whose en-alternate is the
            # canonical en home, never themselves) must still declare the
            # full language set and resolve every alternate — but they
            # participate in no equivalence clique, so no back-link is
            # required of them. The root must be the WHOLE site tree.
            import posixpath
            root = Path(a.hreflang)
            matrix = {}
            for p in pages(a.hreflang):
                html = p.read_text(encoding="utf-8")
                m = re.search(r'<html[^>]+lang="([^"]+)"', html)
                alts = re.findall(r'<link[^>]+rel="alternate"[^>]+hreflang="([^"]+)"[^>]+href="([^"]+)"', html)
                alts += re.findall(r'<link[^>]+hreflang="([^"]+)"[^>]+rel="alternate"[^>]+href="([^"]+)"', html)
                if alts:
                    matrix[p.relative_to(root).as_posix()] = {
                        "lang": m.group(1) if m else "?", "alts": dict(alts)}
            if not matrix:
                sys.exit("FAIL hreflang: no alternates declared anywhere")
            def resolve(page_rel, href):
                if href.startswith(("http://", "https://", "mailto:")):
                    return None
                base = posixpath.dirname(page_rel)
                joined = posixpath.join(base, href) if base else href
                tgt = posixpath.normpath(joined)
                if href.endswith("/"):
                    tgt += "/index.html"
                elif tgt == ".":
                    tgt = "index.html"
                return tgt
            canon = sorted(next(iter(matrix.values()))["alts"])
            editions = 0
            for p, info in matrix.items():
                if sorted(info["alts"]) != canon:
                    sys.exit("FAIL hreflang: alternate set diverges at %s" % p)
                own = info["alts"].get(info["lang"])
                is_edition = own is not None and resolve(p, own) == p
                for l, href in info["alts"].items():
                    if l == "x-default":
                        continue
                    tgt = resolve(p, href)
                    if tgt is None or tgt not in matrix:
                        sys.exit("FAIL hreflang: dangling alternate %s at %s -> %s"
                                 % (l, p, href))
                    if not is_edition or l == info["lang"]:
                        continue
                    back = matrix[tgt]["alts"].get(info["lang"])
                    if back is None:
                        sys.exit("FAIL hreflang: %s (%s) -> %s, but target "
                                 "declares no %s back-alternate"
                                 % (p, info["lang"], tgt, info["lang"]))
                    if resolve(tgt, back) != p:
                        sys.exit("FAIL hreflang: not reciprocal: %s -> %s, "
                                 "back-alternate resolves to %s"
                                 % (p, tgt, resolve(tgt, back)))
                if is_edition:
                    editions += 1
            if not editions:
                sys.exit("FAIL hreflang: no edition pages found — nothing reciprocal")
            print("hreflang ok: %d pages, %d edition pages pairwise-reciprocal"
                  % (len(matrix), editions))
        elif a.links:
            root = Path(a.links)
            for p in pages(root):
                for href in re.findall(r'href="([^"#][^"]*)"', p.read_text(encoding="utf-8")):
                    if href.startswith(("http://", "https://", "mailto:")):
                        continue
                    target = (p.parent / href).resolve()
                    if not target.exists():
                        sys.exit("FAIL links: %s -> %s does not resolve" % (p, href))
            for rss in sorted(root.rglob("*.xml")):
                ElementTree.parse(str(rss))
            print("links ok: internal hrefs resolve; RSS well-formed")
        else:
            ap.error("choose a mode")
    main()
    PY
    # ── The oracle SAMPLE FRAME (rev 2: authored HERE, deterministically —     ─
    #    rev 1 let the oracle author its own sampler, so the judged party drew
