          tb = sample['term_bearing'][loc]
          assert tb >= 1, '%s: no term-bearing segments — denominator unguaranteed' % loc
      print('frame auditable: seeded, exact counts, census-valid, stratified, term-bearing everywhere')
      PY
    condition: "stage == 18"
