  # ── Movement 14 · Merge authority ──────────────────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}
      set -e
      python3 - <<'PY'
      import hashlib, json
      from pathlib import Path
      rm_ = json.load(open('release-manifest.json'))
      sweep = json.load(open('sweep-report.json'))
      overall = sweep['overall']
      admitted = set(rm_['admitted'])
      green = {loc for loc, ok in overall.items() if ok is True}
      assert admitted, 'empty admitted set — no positive release candidate'
      assert admitted == green, 'admitted %s != both-green set %s' % (sorted(admitted), sorted(green))
      for loc in sorted(admitted):
          at = json.load(open('work/locale-%s/attestation.json' % loc))
          man = json.load(open('contract/MANIFEST.json'))
          for rel, want in at['consumed_spec_hashes'].items():
              assert man['files'].get(rel) == want, 'attested contract hash drifted: %s' % rel
          for rel, want in at['output_hashes'].items():
              got = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              assert got == want, 'attestation stale against bytes at authority time: %s' % rel
          checks = sweep[loc]['checks']
          ref_keys = {c['key'] for c in json.load(open('reference/manifest.json'))['checks']}
          ref_keys |= {'skeleton_coverage'}
          assert ref_keys <= set(checks), '%s sweep missing reference keys: %s' % (loc, ref_keys - set(checks))
          for k in ref_keys:
              assert checks[k]['verdict'] is True, '%s: reference check %s not green' % (loc, k)
      rogue = json.load(open('join-conflicts.json'))[0]
      disp = sorted(Path('dispositions').glob('*.json'))
      subjects = ' '.join(Path(d).read_text() for d in disp)
      assert rogue['msgid'][:30] in subjects, 'planted conflict has no disposition citing it'
      non_admitted = set(overall) - admitted
      assert non_admitted == set(rm_['rejected']), 'rejected list != non-admitted set'
      for rel, want in rm_['content_digests'].items():
          got = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
          assert got == want, 'release digest mismatch: %s' % rel
          assert rel.startswith(('joined/', 'buffer-B/')), 'unknown digest domain: %s' % rel
          assert not rel.startswith('buffer-B/evidence'), 'evidence page must NOT be sealed — it is completed after the seal computes'
      print('authority bounded: admitted == both-green exactly; attestations re-verified against bytes at authority time; digests bind')
      PY
      if grep -rqF '[rogue divergent]' joined/ buffer-B/; then
        echo 'FAIL: rogue marker string present in release bytes'
        exit 1
      fi
      jq -e '.rogue_marker_absent == true' release-manifest.json
    condition: "stage == 14"
    stage: 1
    description: "Admitted set == the both-green set EXACTLY (rev 1 allowed an empty admitted set and never required equality); attestations RE-VERIFIED at authority time against current bytes; every admitted locale carries the characterizer's reference keys green (the keyed list now bites); rogue absence proven BYTES-WISE — its marker string greps empty across joined/ and buffer-B/ (rev 1 compared entry digests against page digests: different hash domains, structurally empty intersection)"

