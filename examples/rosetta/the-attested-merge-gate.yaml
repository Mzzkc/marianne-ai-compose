  # ── Movement 18 · Back-translation oracle ──────────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}
      python3 - <<'PY'
      import json, re
      th = json.load(open('contract/thresholds.json'))
      sample = json.load(open('oracle-sample.json'))
      gl = {t['term_id']: t for t in json.load(open('contract/glossary.json'))['terms']}
      census = {s['msgid_sha']: s for s in json.load(open('contract/segment-census.json'))}
      def wordish(term):
          return re.compile(r'(?<!\w)' + re.escape(term) + r'(?!\w)', re.IGNORECASE)
      floor = float(th['oracle_recall_floor'])
      results = {}
      for loc in ['es', 'fr', 'de', 'pt-BR', 'ar']:
          entries = json.load(open('oracle-%s.json' % loc))['entries']
          drawn = {e['msgid_sha'] for e in sample['per_locale'][loc]}
          assert {e['msgid_sha'] for e in entries} >= drawn, 'oracle skipped sampled segments: %s' % loc
          denom = hits = 0
          for e in entries:
              seg = census[e['msgid_sha']]
              # the back-translation is ENGLISH: the recovered target is the
              # glossary's ENGLISH term for keep AND translate decisions alike
              # (rev 1 searched the LOCALIZED term inside the English text —
              # structurally unmatchable when translation did its job, so
              # recall measured the glossary's keep/translate mix, not
              # semantic fidelity)
              src_terms = [t for t in gl.values() if wordish(t['en']).search(seg['msgid'])]
              for t in src_terms:
                  denom += 1
                  if wordish(t['en']).search(e['back_translation']):
                      hits += 1
          assert denom > 0, 'zero denominator for %s — the frame guarantees term-bearing coverage' % loc
          recall = hits / denom
          results[loc] = round(recall, 4)
          assert recall >= floor, 'oracle recall %s: %.3f < floor %.3f' % (loc, recall, floor)
      print('oracle recall per locale:', results, 'floor', floor)
      PY
    condition: "stage == 18"
    stage: 1
    description: "SCRIPTED recall (never the oracle's prose): every sampled segment answered; ENGLISH-term recovery from ENGLISH back-translations, per (segment, term) pair; denominator > 0 STRUCTURALLY (rev 1's degenerate-frame escape awarded recall 1.0 when denom was 0)"
  - type: command_succeeds
    command: |
      cd {workspace}
