            locale, ' dir="rtl"' if direction == "rtl" else "", links, esc(title), CSS,
            esc(title), nav, " · ".join(sorted(alts)), body,
            "Marianne AI Compose — dual-licensed (see LICENSE, LICENSE-AGPL). "
            "Translated edition produced by The Babel Release; notices carried per contract.")

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--catalog-dir", default="joined")
        ap.add_argument("--census", default="contract/segment-census.json")
        ap.add_argument("--out", default="buffer-B")
        ap.add_argument("--sweep", help="sweep-report.json; renders evidence verdicts when given")
        a = ap.parse_args()
        out = Path(a.out)
        census = json.load(open(a.census))
        by_path = seg_text(census)
        for locale in ["en"] + LOCALES:
            catalog = {}
            if locale != "en":
                for e in polib.pofile("%s/%s.po" % (a.catalog_dir, locale)):
                    if e.msgid.strip():
                        catalog[e.msgid] = e.msgstr or e.msgid
            t = lambda s: catalog.get(s, s)
            (out / locale).mkdir(parents=True, exist_ok=True)
            for src in SUBSET:
                segs = sorted(by_path.get(src, []), key=lambda s: s["line"])
                parts = []
                for seg in segs:
                    if seg["kind"] == "heading":
                        parts.append("<h2>%s</h2>" % esc(t(seg["msgid"])))
                    else:
                        parts.append("<p>%s</p>" % esc(t(seg["msgid"])))
                stem = Path(src).stem
                alts = {"en": "../en/%s.html" % stem if locale != "en" else "%s.html" % stem}
                for l in LOCALES:
                    alts[l] = ("%s.html" % stem) if l == locale else "../%s/%s.html" % (l, stem)
                alts["x-default"] = "../en/%s.html" % stem if locale != "en" else "%s.html" % stem
                nav_base = [("index.html", "Home")] + [
                    ("%s.html" % Path(s).stem, Path(s).stem.replace("-", " ")) for s in SUBSET]
                nav = nav_base if locale == "en" or DIRS[locale] == "ltr" else list(reversed(nav_base))
                (out / locale / ("%s.html" % stem)).write_text(
                    page(locale, t("Marianne AI Compose — %s" % Path(src).stem),
                         "\n".join(parts), alts, DIRS.get(locale, "ltr"), nav),
                    encoding="utf-8")
            # edition home — every page's nav links here; the links gate
            # resolves it, so it must EXIST, carry the hreflang matrix, and
            # mirror for ar like every other page
            idx_alts = {"en": "../en/" if locale != "en" else "./"}
            for l in LOCALES:
                idx_alts[l] = ("./") if l == locale else "../%s/" % l
            idx_alts["x-default"] = "../en/" if locale != "en" else "./"
            nav_base = [("index.html", "Home")] + [
                ("%s.html" % Path(s).stem, Path(s).stem.replace("-", " ")) for s in SUBSET]
            nav = nav_base if locale == "en" or DIRS[locale] == "ltr" else list(reversed(nav_base))
            listing = "".join('<li><a href="%s.html">%s</a></li>'
                              % (Path(s).stem, t(Path(s).stem.replace("-", " ")))
                              for s in SUBSET)
            (out / locale / "index.html").write_text(
                page(locale, t("Marianne AI Compose"),
                     '<ul>%s</ul>' % listing, idx_alts, DIRS.get(locale, "ltr"), nav),
                encoding="utf-8")
            # per-locale RSS (stdlib XML; xmllint absent — ElementTree writes it)
            rss = ET.Element("rss", version="2.0")
            ch = ET.SubElement(rss, "channel")
            ET.SubElement(ch, "title").text = "Marianne AI Compose (%s)" % locale
            ET.SubElement(ch, "link").text = "../%s/" % locale
            ET.SubElement(ch, "description").text = t("Documentation edition")
            for seg in sorted((s for s in census if s["kind"] == "heading"),
                              key=lambda s: (s["source_path"], s["line"]))[:10]:
                item = ET.SubElement(ch, "item")
                ET.SubElement(item, "title").text = t(seg["msgid"])[:80]
                ET.SubElement(item, "guid").text = "%s#%s" % (seg["source_path"], seg["msgid_sha"])
            ET.ElementTree(rss).write(str(out / locale / "rss.xml"), encoding="utf-8", xml_declaration=True)
        # portal (full alternate matrix: a language-neutral page still declares
        # every edition so the global reciprocity clique closes through it)
        (out / "portal").mkdir(parents=True, exist_ok=True)
        rows = "\n".join('<li><a href="../%s/">%s</a></li>' % (l, l) for l in LOCALES)
        portal_alts = {"en": "../en/", "x-default": "../en/"}
        for l in LOCALES:
            portal_alts[l] = "../%s/" % l
        (out / "portal" / "index.html").write_text(page(
            "en", "The Babel Release — choose your edition",
            '<ul>%s</ul><p><a href="../en/">English (canonical)</a></p>' % rows,
            portal_alts, "ltr", [("../en/", "English")]), encoding="utf-8")
        # evidence page: stub here, verdicts with --sweep, completed at movement 17
        ev_alts = {"en": "../en/", "x-default": "../en/"}
        for l in LOCALES:
            ev_alts[l] = "../%s/" % l
        verdicts = "<p>Verdicts render after the sweep (movement 13).</p>"
        if a.sweep:
            rep = json.load(open(a.sweep))
            rows = []
            for loc in LOCALES:
                cells = "".join("<td>%s</td>" % c["verdict"] for c in rep[loc]["checks"].values())
                rows.append("<tr><td>%s</td>%s<td>%s</td></tr>" % (loc, cells, rep[loc]["checks"] and rep["overall"].get(loc, "")))
            verdicts = "<table><tr><th>locale</th><th colspan=\"4\">checks</th></tr>%s</table>" % "".join(rows)
        (out / "evidence").mkdir(parents=True, exist_ok=True)
        (out / "evidence" / "index.html").write_text(page(
            "en", "The Babel Release — evidence",
            """<h2>Methodology</h2><p>Frozen contract (glossary, skeleton, registers, RTL
            spec, PRE-registered thresholds) → five writers across three model
            families → deterministic
            sweep → one serial merge authority → atomic cutover. No writer judged its own
            admission; no LLM judged any merge.</p>
            <h2>Verdicts</h2>%s
            <h2>Honesty caveats</h2><p>This multilingual edition lives on ADDITIVE subpaths
            of the gh-pages branch. The next upstream mkdocs deploy may remove them; the
            durable artifacts are the release-asset catalogs, the build recipe, and the
            sealed digests. Pseudo-loc no-clip is verified structurally (full-string
            presence + non-truncating CSS), not in a visual browser.</p>""" % verdicts,
            ev_alts, "ltr", [("../en/", "English")]), encoding="utf-8")
        print("buffer B built:", sorted(p.name for p in out.iterdir()))
    main()
