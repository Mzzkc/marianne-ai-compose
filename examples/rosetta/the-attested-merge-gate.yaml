    cat > scripts/oracle-sample.py <<'PY'
    #!/usr/bin/env python3
    """Deterministic stratified sample frame for the back-translation oracle.
    Seeded; stratified by census kind; GUARANTEED term-bearing coverage per
    locale (the recall denominator cannot be zero by construction). Output:
    {"seed": S, "per_locale": {loc: [{"msgid_sha", "kind", "term_ids"}]},
     "term_bearing": {loc: n}}"""
    import argparse, hashlib, json, random, re, sys

    def wordish(term):
        return re.compile(r"(?<!\w)" + re.escape(term) + r"(?!\w)", re.IGNORECASE)

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--census", required=True)
        ap.add_argument("--glossary", required=True)
        ap.add_argument("--per-locale", type=int, default=15)
        ap.add_argument("--seed", type=int, default=42)
        ap.add_argument("--min-term-bearing", type=int, default=5)
        ap.add_argument("--out", required=True)
        a = ap.parse_args()
        census = json.load(open(a.census))
        terms = json.load(open(a.glossary))["terms"]
        for s in census:
            s["msgid_sha"] = hashlib.sha256(s["msgid"].encode()).hexdigest()[:16]
        for seg in census:
            seg["term_ids"] = sorted(
                t["term_id"] for t in terms if wordish(t["en"]).search(seg["msgid"]))
        by_kind = {}
        for seg in census:
            by_kind.setdefault(seg["kind"], []).append(seg)
        tb = [s for s in census if s["term_ids"]]
        need_tb = min(a.min_term_bearing, len(tb))
        if need_tb < 1:
            sys.exit("FAIL: census carries no glossary-term-bearing segments — "
                     "the oracle recall denominator cannot be guaranteed")
        out = {"seed": a.seed, "per_locale": {}, "term_bearing": {}}
        for loc in ["es", "fr", "de", "pt-BR", "ar"]:
            rng = random.Random("%s:%d" % (loc, a.seed))
            picked, seen = [], set()
            tb_pool = [s for s in tb if id(s) not in seen]
            for seg in rng.sample(sorted(tb_pool, key=lambda s: s["msgid_sha"]), need_tb):
                picked.append(seg); seen.add(id(seg))
            rest = [s for s in census if id(s) not in seen]
            kinds = sorted(by_kind)
            while len(picked) < a.per_locale and rest:
                kind = kinds[len(picked) % len(kinds)] if kinds else None
                pool = sorted((s for s in rest if kind is None or s["kind"] == kind),
                              key=lambda s: s["msgid_sha"]) or \
                       sorted(rest, key=lambda s: s["msgid_sha"])
                seg = pool[rng.randrange(len(pool))]
                picked.append(seg); seen.add(id(seg))
                rest = [s for s in rest if id(s) is not id(seg)]
            out["per_locale"][loc] = [
                {"msgid_sha": s["msgid_sha"], "kind": s["kind"],
                 "term_ids": s["term_ids"]} for s in sorted(picked, key=lambda x: x["msgid_sha"])]
            out["term_bearing"][loc] = sum(1 for s in picked if s["term_ids"])
        json.dump(out, open(a.out, "w"), indent=2, sort_keys=True)
        print("sample frame:", {k: len(v) for k, v in out["per_locale"].items()},
              "term-bearing:", out["term_bearing"])
    main()
    PY
