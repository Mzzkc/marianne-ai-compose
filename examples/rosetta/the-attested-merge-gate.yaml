# ║                    statistics) · Publishing (git, gh authenticated as        ║
# ║                    the owner, GitHub Pages subpaths + Releases) ·            ║
# ║                    Testing (the in-score gate-teeth movement + this          ║
# ║                    file's validation battery). 9 of 18 movements are         ║
# ║                    CLI with EMPTY fallback chains. The calibration          ║
# ║                    chain (5, 6, 18) carries empty fallback chains — any      ║
# ║                    silent family collapse voids the calibration claim,      ║
# ║                    so those sheets fail loudly instead.                      ║
# ║                                                                              ║
# ║  PREREQUISITES   : (the price, stated before you pay it)                    ║
# ║                    - three vendor CLIs on PATH with working auth:            ║
# ║                      `claude` (GLM route), `codex` (GPT route), and         ║
