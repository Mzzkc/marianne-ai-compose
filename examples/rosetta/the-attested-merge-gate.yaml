# ═══════════════════════════════════════════════════════════════════════════════
# VALIDATIONS — staged fail-fast (Commissioning Cascade). `condition: stage == N`
# selects the movement; the `stage:` field orders rules WITHIN a sheet. Every
# load-bearing claim is a command with an exit code — The Etiquette Law. The
# fan-out movement validates per-instance via {instance}; writer locales are
# derived inside the command (the .format engine cannot map instance→locale).
# ═══════════════════════════════════════════════════════════════════════════════

validations:
  # ── Movement 1 · Pin the World ─────────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/pin/license-clearance.md"
    condition: "stage == 1"
    stage: 1
    description: "License clearance document exists"
  - type: command_succeeds
    command: |
      grep -qxE 'VERDICT: (AGPL-COMPLIANT-WITH-NOTICES|FALLBACK-TRIGGERED)' {workspace}/pin/license-clearance.md
      test "$(cat {workspace}/pin/clone-head.txt)" = "{pinned_sha}"
    condition: "stage == 1"
    stage: 2
    description: "Verdict is one of the two allowed literals; clone HEAD is the pinned sha"
  - type: command_succeeds
    command: |
      grep -qxE 'VERDICT: AGPL-COMPLIANT-WITH-NOTICES' {workspace}/pin/license-clearance.md
    condition: "stage == 1"
    stage: 3
    description: "The hold is MECHANICAL: a FALLBACK-TRIGGERED verdict fails the sheet even if the writer exited 0 — the run must never continue into translations of a source the score itself declared legally blocked"
  - type: command_succeeds
    command: |
      set -e
      idx="$(curl -sfL {site_url}/ | sha256sum | cut -d' ' -f1)"
      pin="$(jq -r .served_index_sha256 {workspace}/pin/buffer-A-fingerprint.json)"
      test "$idx" = "$pin"
      test "$(gh api user -q .login)" = "{github_owner}"
    condition: "stage == 1"
    stage: 2
    description: "Buffer-A fingerprint REPRODUCES against the live site; the gh identity is RE-PROBED by the validation, not trusted from the inventory"
  - type: command_succeeds
    command: |
      set -e
      jq -e '.git and .curl and .jq and .gh and .uv and .sha256sum' {workspace}/pin/host-inventory.json
      jq -e '.babel == "{babel_pin}" and .polib == "{polib_pin}"' {workspace}/pin/host-inventory.json
      jq -e 'has("msgfmt") and has("hugo") and has("linkchecker") and has("xmllint")' {workspace}/pin/host-inventory.json
      for bin in claude codex opencode; do command -v "$bin" >/dev/null; done
    condition: "stage == 1"
    stage: 3
    description: "Inventory: every tool any shipped script names is PROBED (absences recorded from probes, matching the named substitutions); pinned versions answer; all three vendor CLIs canaried"
  - type: command_succeeds
    command: |
      set -e
      jq -e '(.calibration_families | to_entries | map(.value) | unique | length) == 3' {workspace}/pin/instrument-families.json
      jq -e '.instruments["opencode-gemma"].family == "GEMMA" and .instruments["codex-cli"].family == "GPT" and .instruments["claude-code"].family == "GLM"' {workspace}/pin/instrument-families.json
