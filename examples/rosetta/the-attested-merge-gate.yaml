      assert sorted(ids) == sorted(cids), 'census %d != pot %d' % (len(cids), len(ids))
      assert len(ids) == len(set(ids)), 'duplicate msgids in skeleton'
      for s in census:
          assert s.get('source_path') and s.get('line') and s.get('kind'), s
      pin = json.load(open('pin/pin-record.json'))
