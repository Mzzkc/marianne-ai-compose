# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║      THE BABEL RELEASE — The Attested Merge Gate proof score (rev 2)         ║
# ║     revised against 05-review-1 (Practitioner), 05-review-2 (Skeptic),      ║
# ║                       05-review-3 (Newcomer) — all "needs revision"         ║
# ║                                                                              ║
# ║  PRIMARY PATTERN : The Attested Merge Gate — a frozen interface writable     ║
# ║                    before the work starts, N writers attesting              ║
# ║                    consumed/produced hashes, a deterministic sweep          ║
# ║                    (CLI, empty fallback) whose REPORT-COMPLETENESS is       ║
# ║                    itself gated, one serial authority that GRANTS the       ║
# ║                    merge only to attestation-AND-sweep passers, and         ║
# ║                    post-merge verification bound to the served bytes.       ║
# ║                    Babel done right: the tower ships.                       ║
# ║                                                                              ║
# ║  COMPOSING       : First Article Characterization (es is produced, then      ║
# ║                    measured by a DIFFERENT vendor family into a keyed        ║
# ║                    reference manifest whose thresholds were pre-registered   ║
# ║                    BEFORE volume — an instrument calibrating itself is not   ║
# ║                    calibration), Join-Semilattice Merge (the catalog layer   ║
# ║                    joins algebraically — union by msgid, dedupe by digest,   ║
# ║                    NO LLM — while the gate governs the composite layer       ║
# ║                    algebra cannot), Standby–GO (buffer A — the live          ║
# ║                    English site — keeps serving while buffer B builds; arm   ║
# ║                    verifies the complete ack set + every B-artifact passing  ║
# ║                    sweep + buffer A unchanged; GO is one non-force pointer   ║
# ║                    flip, whole-or-old, never half-translated — TWO armed     ║
# ║                    cues total, disclosed here and enforced by the same       ║
# ║                    cue-log discipline: `babel-go-1` ships the editions,      ║
# ║                    `babel-evidence-1` completes the evidence page AFTER      ║
# ║                    the seal is computed, so no sealed surface is ever        ║
# ║                    mutated after sealing), The Etiquette Law (every gate     ║
# ║                    below is a command with an exit code and an empty         ║
# ║                    fallback chain — the LLM never judges its own merge       ║
# ║                    admission; a fallback for a clock is a second clock).     ║
# ║                                                                              ║
# ║  PROBLEM SOLVED  : The public Mzzkc/marianne-ai-compose docs ship in         ║
# ║                    English only. Five writers on four instruments            ║
# ║                    spanning three model families produce es/fr/de/pt-BR/ar  ║
# ║                    editions against a frozen glossary + skeleton +           ║
# ║                    register contract; none of the five is trusted; one      ║
# ║                    admissible multilingual release emerges — live on         ║
# ║                    GitHub Pages with hreflang + per-locale RSS + mirrored    ║
# ║                    RTL Arabic, plus installable gettext catalogs as a        ║
# ║                    GitHub release asset, plus an evidence page making        ║
# ║                    every quality claim recomputable from the served bytes.   ║
# ║                    Arabic is first-class: text direction, mirroring, and     ║
# ║                    bidi balance are GATED properties.                        ║
# ║                                                                              ║
# ║  VENDOR TRUTH    : the calibration chain is THREE MODEL FAMILIES, probed     ║
# ║                    from the live conductor config at movement 1 and         ║
# ║                    recorded in pin/instrument-families.json (default        ║
# ║                    models, derived family per instrument):                   ║
# ║                      es writer     = claude-code      → GLM (Z.AI)  [A]     ║
# ║                      characterizer = codex-cli        → GPT (OpenAI)[B]     ║
# ║                      oracle        = opencode-gemma   → Gemma (local)[C]    ║
# ║                    A/B/C pairwise distinct; movement 1 REFUSES to start      ║
# ║                    if any two collapse to one family. Volume writers         ║
# ║                    (fr=opencode/GLM, de=codex-cli/GPT, pt-BR=claude-         ║
# ║                    code/GLM, ar=opencode/GLM) and the merge authority        ║
# ║                    (claude-code) have NO calibration role and may fall      ║
# ║                    back across vendors. Instrument-name inequality           ║
# ║                    proves nothing on a host where two CLIs default to        ║
# ║                    one family — so the family join is made from the         ║
# ║                    config's own model strings, not from names.              ║
# ║                                                                              ║
# ║  PRODUCES        : <auto-workspace>/babel-release/ → repo/ (pinned clone) · ║
# ║                    pin/ (buffer-A-fingerprint, host-inventory,              ║
# ║                    instrument-families, license-clearance) · contract/       ║
# ║                    (canonical-en.pot, glossary.json, register-*.md,          ║
# ║                    rtl-spec.md, thresholds.json incl. per-locale length      ║
# ║                    bounds, MANIFEST) · work/locale-*/ (writers' .po +        ║
# ║                    attestations + acks) · reference/manifest.json ·          ║
# ║                    fixtures/negative/ (TEN corrupted artifacts, each        ║
# ║                    failing exactly its intended gate FOR THE RECORDED       ║
# ║                    REASON) · .namespace-baseline (pre-volume fingerprint)   ║
# ║                    · joined/ + join-conflicts.json · buffer-B/ (six          ║
# ║                    editions, portal, evidence, RSS) · sweep-report.json ·    ║
# ║                    release-manifest.json + dispositions/ · armed-*.json ·    ║
# ║                    cue-log.jsonl · recompute-seal.json — and the LIVE        ║
# ║                    multilingual site + release assets a human opens.         ║
# ║                                                                              ║
# ║  INSTRUMENTS     : AI (semantic transfer only — contract authoring, five     ║
# ║                    translation writers, first-article characterization by    ║
# ║                    family B, merge adjudication with jq-bounded admission,   ║
# ║                    back-translation oracle by family C) · Localization       ║
# ║                    (babel 2.18.0 plural rules, polib==1.2.0 via uv —         ║
# ║                    msgfmt/hugo/linkchecker/xmllint probed and recorded,      ║
