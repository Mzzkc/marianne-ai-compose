  - type: command_succeeds
    command: |
      cd {workspace}
      python3 - <<'PY'
      import hashlib, json, re, subprocess
      census = json.load(open('contract/segment-census.json'))
      for s in census:
          want = hashlib.sha256(s['msgid'].encode()).hexdigest()[:16]
          assert s.get('msgid_sha') == want, 'msgid_sha stale at %s:%s' % (s['source_path'], s['line'])
      # census paths == the declared docs subset exactly (drift gate)
      subset = sorted({docs_subset})
      assert sorted({s['source_path'] for s in census}) == subset, 'census paths != docs_subset'
      # SOURCE COVERAGE, not generated-file consistency: every markdown
      # heading of every subset document appears as a census msgid, and >=85%
      # of prose words (outside code fences) are carried by census msgids
      for rel in subset:
          raw = subprocess.run(['git', '-C', 'repo', 'show', '{pinned_sha}:' + rel],
                               capture_output=True, text=True, check=True).stdout
          lines = raw.splitlines()
          headings, words, fence = [], [], False
          for ln in lines:
              if ln.lstrip().startswith('```'):
                  fence = not fence; continue
              if fence:
                  continue
              if ln.lstrip().startswith('#'):
                  headings.append(re.sub(r'^#+\s*', '', ln).strip())
              else:
                  words += re.findall(r'[A-Za-z]{3,}', ln)
          msgids_l = ' \n '.join(s['msgid'] for s in census
                                 if s['source_path'] == rel).lower()
          for h in headings:
              assert h.lower() in msgids_l, 'heading not in census: %r' % h[:60]
          uniq = set(words)
          have = sum(1 for w in uniq if w.lower() in msgids_l)
          assert uniq and have / len(uniq) >= 0.85, \
              '%s: word coverage %.2f < 0.85' % (rel, have / max(1, len(uniq)))
          # line traceability against the pinned bytes
          for s in (x for x in census if x['source_path'] == rel):
              assert 1 <= s['line'] <= len(lines), 'line out of range: %s:%d' % (rel, s['line'])
              probe = re.sub(r'\s+', ' ', s['msgid'])[:24].strip().lower()
              window = re.sub(r'\s+', ' ',
                              ' '.join(lines[max(0, s['line'] - 2):s['line'] + 8])).lower()
              assert not probe or probe in window, \
                  'msgid text not found near recorded line: %s:%d' % (rel, s['line'])
      print('census covers source: headings 100%, words >=85%, lines traceable')
      PY
    condition: "stage == 2"
    stage: 2
    description: "COVERAGE IS THE OUTCOME: every subset heading in the census, >=85% prose-word coverage against the PINNED bytes, msgid_sha exact, census paths == docs_subset (the drift gate that lets downstream derive page filenames from the census)"

