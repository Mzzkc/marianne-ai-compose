    #!/usr/bin/env bash
    set -euo pipefail
    cd "$(dirname "$0")/.."
    GBIF="{{ gbif_base }}"
    INAT="{{ inat_base }}"
    FAIL=0
    note() { echo "[taxa] $*"; }
    die() { echo "TAXA-FAIL: $*" >&2; exit 1; }

    : > data/taxon-probes.tsv
    # GBIF: family-rank match (superfamilies are UNRESOLVABLE — Correction 3),
    # key must equal the pinned expectation, and count>0 (Correction 4).
    tail -n +2 data/expected-families.tsv | while IFS='|' read -r g fam key; do
      [ -n "$g" ] || continue
      j="$(curl -sS --get "$GBIF/species/match" --data-urlencode "name=$fam" --data-urlencode "rank=FAMILY")"
      conf="$(jq -r '.confidence // 0' <<<"$j")"
      mtype="$(jq -r '.matchType // "NONE"' <<<"$j")"
      ukey="$(jq -r '.usageKey // empty' <<<"$j")"
      note "$g/$fam conf=$conf type=$mtype key=$ukey (expect $key)"
      [ "$conf" -ge 90 ] || die "$fam confidence $conf < 90"
      { [ "$mtype" = "EXACT" ] || [ "$mtype" = "HIGHERRANK" ]; } || die "$fam matchType $mtype"
      [ "$ukey" = "$key" ] || die "$fam usageKey $ukey != pinned $key (backbone drift — investigate, do not patch silently)"
      cnt="$(curl -sS --get "$GBIF/occurrence/search" --data-urlencode "taxon_key=$key" --data-urlencode "country=US" --data-urlencode "limit=0" | jq -r '.count')"
      note "$g/$fam US count=$cnt"
      [ "$cnt" -gt 0 ] || die "$fam key $key probes count=0 (Correction 4: silent wrong key)"
      printf '%s\t%s\t%s\n' "$g" "$fam" "$cnt" >> data/taxon-probes.tsv
      sleep 1.1
    done
    [ -s data/taxon-probes.tsv ] || die "no family probes recorded"

    # Apis subtraction key (wild-bee editorial policy — visible, keyed)
    apis="$(curl -sS --get "$GBIF/species/match" --data-urlencode "name=Apis mellifera")"
    apis_key="$(jq -r '.usageKey // empty' <<<"$apis")"
    apis_conf="$(jq -r '.confidence // 0' <<<"$apis")"
    [ -n "$apis_key" ] && [ "$apis_conf" -ge 90 ] || die "Apis mellifera unresolved"
    apis_cnt="$(curl -sS --get "$GBIF/occurrence/search" --data-urlencode "taxon_key=$apis_key" --data-urlencode "country=US" --data-urlencode "limit=0" | jq -r '.count')"
    [ "$apis_cnt" -gt 0 ] || die "Apis subtraction key probes count=0"
    note "Apis mellifera key=$apis_key US count=$apis_cnt"

    # iNat: taxon_id via /v1/taxa ONLY (Correction 2 — taxon_name above genus
    # undercounts Apoidea 245x). Pinned ids must match; monotonicity asserted.
    : > data/inat-resolution.tsv
    tail -n +2 data/expected-inat.tsv | while IFS='|' read -r g taxon exp child; do
      [ -n "$g" ] || continue
      j="$(curl -sS --get "$INAT/taxa" --data-urlencode "q=$taxon" --data-urlencode "is_active=true")"
      tid="$(jq -r --arg t "$taxon" '[.results[] | select(.name == $t)][0].id // empty' <<<"$j")"
      [ -n "$tid" ] || die "iNat taxon $taxon unresolved"
      [ "$tid" = "$exp" ] || die "iNat $taxon id $tid != pinned $exp"
      cid="$(curl -sS --get "$INAT/taxa" --data-urlencode "q=$child" --data-urlencode "is_active=true" | jq -r --arg t "$child" '[.results[] | select(.name == $t)][0].id // empty')"
      [ -n "$cid" ] || die "iNat child $child unresolved"
      pt="$(curl -sS --get "$INAT/observations" --data-urlencode "taxon_id=$tid" --data-urlencode "place_id={{ boulder_place_id }}" --data-urlencode "per_page=1" | jq -r '.total_results')"
      ct="$(curl -sS --get "$INAT/observations" --data-urlencode "taxon_id=$cid" --data-urlencode "place_id={{ boulder_place_id }}" --data-urlencode "per_page=1" | jq -r '.total_results')"
      note "iNat $taxon(id $tid)@$pt vs child $child(id $cid)@$ct"
      [ "$pt" -ge "$ct" ] || die "MONOTONICITY VIOLATED: $taxon($pt) < $child($ct) — the 245x undercount signature"
      printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$g" "$taxon" "$tid" "$child" "$cid" "$pt" >> data/inat-resolution.tsv
      sleep 1.1
    done
    [ -s data/inat-resolution.tsv ] || die "no iNat resolutions recorded"

    jq -n --rawfile fam data/expected-families.tsv --rawfile probes data/taxon-probes.tsv \
          --rawfile inat data/inat-resolution.tsv --argjson apis_key "$apis_key" --argjson apis_cnt "$apis_cnt" \
      '{apis_subtraction: {scientific_name: "Apis mellifera", key: $apis_key, us_count: $apis_cnt,
        policy: "ledger carries ALL Apoidea; wild-bee views subtract by this key — pre-registered, visible"},
        raw: {families: $fam, probes: $probes, inat: $inat},
        correction_notes: ["iNat: taxon_id via /v1/taxa only, never taxon_name above genus (245x undercount)",
                           "GBIF: family key-sets; superfamilies unresolvable", "every key probed count>0"]}' \
