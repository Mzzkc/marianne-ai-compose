    cat > scripts/reconcile.py <<'PY'
    #!/usr/bin/env python3
    """Keyed-set reconciliation (Concurrent Count): server vs ledger per
    partition x source — compared as KEYED SETS, not totals. Mismatch ->
    bounded split-search (re-walk the raw pages; if needed the caller re-runs
    the server arm) -> verdict bijective | drift | quarantined(reason).
    Never unknown. This proof release has no degraded completeness tier: any
    omission or quarantine blocks release and remains visible for diagnosis."""
    import json, os, sys

    tol_abs, tol_pct = int(sys.argv[1]), float(sys.argv[2])
    report_path = sys.argv[3]
    server = {k: v["count"] for k, v in json.load(open("counts/server-side.json")).items()}
    ledger_file = json.load(open("counts/ledger-side.json"))
    ledger = {k: v["count"] for k, v in ledger_file.items()}
    parts = {p["id"]: p for p in json.load(open("partitions.json"))["partitions"]}
    fam_of = {}
    for line in open("data/expected-families.tsv"):
        if line.startswith("group|"):
            continue
        g, fam, key = line.strip().split("|")
        fam_of.setdefault(g, []).append(fam)

    def raw_count(pid, src):
        # Re-walk the pinned raw response bytes, not the normalized ledger.
        # GBIF has one numeric family-key directory; capped iNat walks have
        # one complete directory per observed year.
        import glob
        base = "raw/%s/%s" % (pid, src)
        if src == "gbif":
            dirs = sorted(d for d in glob.glob(base + "/*") if os.path.isdir(d))
        elif os.path.isfile(base + "/walk-manifest.json"):
            dirs = [base]
        else:
            dirs = sorted(d for d in glob.glob("raw/%s/inat-Y*" % pid) if os.path.isdir(d))
        if not dirs:
            return -1
        n = 0
        for d in dirs:
            for f in sorted(os.listdir(d)):
                if f.startswith("page-") and f.endswith(".json"):
                    n += len(json.load(open(os.path.join(d, f))).get("results", []))
        return n

    keys = sorted(set(server) | set(ledger))
    verdicts = {}
    for k in keys:
        s, l = server.get(k), ledger.get(k)
        if s is None or l is None:
            verdicts[k] = "omission-confirmed" if (s is None) != (l is None) else "unknown"
            continue
        if s == l:
            verdicts[k] = "bijective"
            continue
        tol = max(tol_abs, tol_pct / 100.0 * max(s, l))
        if abs(s - l) <= tol:
            verdicts[k] = "drift"
            continue
        pid, _, tail = k.partition("|")
        src = tail.split("|")[0]
        r = raw_count(pid, src)
        if r == l and r != s:
            verdicts[k] = "drift(server-index-moved)"
        elif r == s and r != l:
            verdicts[k] = "omission-confirmed"
        else:
            verdicts[k] = "quarantined(reason=raw:%d,ledger:%d,server:%d)" % (r, l, s)
    report = {"tolerance": {"abs": tol_abs, "pct": tol_pct},
              "verdicts": verdicts,
              "summary": {v: sum(1 for x in verdicts.values() if x == v or x.startswith(v)) for v in ("bijective", "drift", "omission-confirmed", "quarantined", "unknown")}}
    json.dump(report, open(report_path, "w"), indent=2)
    print(json.dumps(report["summary"]))
    bad = [k for k, v in verdicts.items() if v in ("omission-confirmed", "unknown") or v.startswith("quarantined")]
    sys.exit(1 if bad else 0)
    PY

