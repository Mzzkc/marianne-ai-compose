    #!/usr/bin/env python3
    """Structural gate over one writer namespace (canary | wN). Per assigned
    partition x source: walk-manifest present, page files match manifest page
    count, zero unhandled throttles, per-record schema (required fields
    non-null except the source-legitimate omission set), query_sha256
    joinable to a pinned raw page digest, namespace purity (no foreign
    partitions under records/<ns>/). Canary namespaces must be fully green;
    volume namespaces are green-or-visible-debt (a debt.jsonl entry carrying
    namespace+partition+error exempts exactly that partition)."""
    import json, hashlib, os, sys

    ns = sys.argv[1]
    parts = json.load(open("partitions.json"))["partitions"]
    assigned = [p for p in parts if p["writer"] == ns]
    assert assigned, "namespace %s has no assigned partitions" % ns
    REQ = ["source", "native_id", "occurrenceID", "eventDate", "taxon_key",
           "scientificName", "license", "attribution", "datasetName",
           "quality_grade", "lat", "lng", "county_slug", "taxon_group",
           "retrieval_ts", "query_sha256", "content_digest"]
