    # Writer usage — fetch-pages.sh + the record contract

    ## GBIF walk (per partition, per family key from data/taxa.json)
    WKT="$(.venv/bin/python -c "import urllib.parse; print(urllib.parse.quote(open('counties/<slug>.wkt').read().strip()))")"
    Q="taxon_key=<KEY>&geometry=$WKT&year={{ year_start }},{{ year_partial }}&country=US"
