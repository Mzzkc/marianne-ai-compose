    cat > site/mkdocs.yml <<'MK'
    site_name: The September Almanac
    site_description: What a decade of Front Range pollinator observations says is flying now, and what to plant this fall.
    docs_dir: builddocs
    theme:
      name: mkdocs
      locale: en
    extra:
      almanac: pollinator-ledger {{ release_tag }}
    MK

    # The anchored source is the authorial artifact. Gate it before resolution,
    # then build from a disposable copy so movements 22 and 23 require compatible
    # states. Recheck every surface the editor was forbidden to change.
    sha256sum -c gates/lattice.sha256
    sha256sum -c gates/oracle-subject.sha256
    sha256sum -c gates/count-subject.sha256
    sha256sum -c pin/scripts.sha256
    sha256sum -c gates/full-kernel.sha256
    "$PY" scripts/bijection-gate.py site/content/docs site/data/stats.json "{{ counties | map(attribute='slug') | join(',') }}"
    rm -rf site/builddocs
    cp -a site/content/docs site/builddocs
    mkdir -p site/builddocs/assets
    cp site/figs/records-by-county.png site/builddocs/assets/

    "$PY" - <<'PY'
    """Resolve [[stat:key]] anchors against stats.json (display value = the
    JSON value) in the build copy, retaining a location/key/value ledger."""
    import json, os, re, sys

    def flat(d, p=""):
        out = {}
        for k, v in d.items():
            kk = "%s.%s" % (p, k) if p else k
            if isinstance(v, dict):
                out.update(flat(v, kk))
            else:
                out[kk] = v
        return out

    vals = flat(json.load(open("site/data/stats.json")))
    n, anchors = 0, []
    for root, _, files in os.walk("site/builddocs"):
        for fn in files:
            if not fn.endswith(".md"):
                continue
            path = os.path.join(root, fn)
            text = open(path).read()
            def sub(m):
                k = m.group(1)
                if k not in vals:
                    sys.exit("unresolved anchor %s in %s" % (k, path))
                v = vals[k]
                if isinstance(v, list):
                    v = ", ".join(str(x) for x in v)
                anchors.append({"path": os.path.relpath(path, "site/builddocs"),
                                "key": k, "value": v})
                return str(v)
            new = re.sub(r"\[\[stat:([^\]]+)\]\]", sub, text)
            if new != text:
                open(path, "w").write(new)
                n += 1
    json.dump(sorted(anchors, key=lambda x: (x["path"], x["key"])),
              open("site/data/anchor-ledger.json", "w"), indent=2, sort_keys=True)
    print("resolved %d anchors in %d files" % (len(anchors), n))
    PY

    mkdir -p site/builddocs/evidence
    cp site/data/stats.json site/data/anchor-ledger.json dist/pollinator-ledger.db site/builddocs/evidence/
    cat > site/builddocs/evidence/recompute.py <<'RC'
    #!/usr/bin/env python3
    """Re-execute every numeric anchor actually published, using only the
    SQLite, stats, and anchor ledger served beside this script."""
    import json, os, sqlite3, sys

    here = os.path.dirname(os.path.abspath(__file__))
    stats = json.load(open(os.path.join(here, "stats.json")))
    anchors = json.load(open(os.path.join(here, "anchor-ledger.json")))
    con = sqlite3.connect(os.path.join(here, "pollinator-ledger.db"))

    def get(d, key):
        cur = d
        for p in key.split("."):
            cur = cur[p]
        return cur

    failures, checked = [], []
    for key in sorted({a["key"] for a in anchors}):
        if not key.endswith(".value"):
            failures.append({"key": key, "error": "published numeric anchor is not a query-backed value"})
            continue
        spec = get(stats, key[:-6])
        if not isinstance(spec, dict) or not {"value", "query", "params", "transform"} <= set(spec):
            failures.append({"key": key, "error": "missing query specification"})
            continue
        rows = con.execute(spec["query"], spec["params"]).fetchall()
        if spec["transform"] == "scalar":
            actual = rows[0][0] if rows else None
        elif spec["transform"] == "name-list":
            actual = [r[0] for r in rows]
        else:
            failures.append({"key": key, "error": "unsupported transform " + spec["transform"]})
            continue
        ok = actual == spec["value"]
        checked.append({"key": key, "actual": actual, "expected": spec["value"], "match": ok})
        if not ok: failures.append(checked[-1])
    report = {"anchors": len(anchors), "unique_keys": len(checked), "failures": failures,
              "verdict": "RECOMPUTED" if anchors and not failures else "FAILED"}
    print(json.dumps(report, sort_keys=True))
    sys.exit(0 if report["verdict"] == "RECOMPUTED" else 1)
    RC

    cat > site/builddocs/evidence/index.md <<'EVD'
    # Evidence — check every number yourself

    Every numeric anchor actually published in this almanac is listed in
    `anchor-ledger.json`. Download it with `stats.json`,
    `pollinator-ledger.db`, and `recompute.py`; run the script and it executes
    each anchor's embedded SQL and parameters against the served SQLite bytes.
    Success requires every displayed value to equal its fresh query result.
    EVD

    ( cd site && mkdocs build -q -d ../site-html )
    test -f site-html/index.html
    ! grep -r "\[\[stat:" site-html/ > /dev/null 2>&1
    ( cd site-html/evidence && "$PY" recompute.py )
    echo "MOVEMENT-23-OK: anchored source gated; build copy resolved; every published numeric anchor recomputes from built bytes"

    {% elif stage == 24 %}
    {{ sh() }}

    # ── Movement 24 · Deploy + live verify — the proof ends at the served byte
    # Instrument: cli (mkdocs gh-deploy, curl). Deploy is the second and last
    # irreversible action. Verification: HTTP 200, served index hash == built
    # hash (staleness-proof), evidence recompute re-executed against LIVE
    # downloaded bytes.

    OWNER="{{ github_owner }}"
    REPO="{{ repo_name }}"
    URL="https://$OWNER.github.io/$REPO/"
    ROOT="$PWD"
    cd site
    git init -q 2>/dev/null || true
    git -c user.name="pollinator-ledger" -c user.email="pollinator-ledger@users.noreply.github.com" \
      commit -qm "almanac build" --allow-empty || true
    git branch -M gh-pages-src 2>/dev/null || true
    git remote remove origin 2>/dev/null || true
    git remote add origin "https://github.com/$OWNER/$REPO.git"
    mkdocs gh-deploy --force --remote-name origin --branch gh-pages
    cd "$ROOT"

    # enable Pages on gh-pages if not already (idempotent)
    gh api "repos/$OWNER/$REPO/pages" > /dev/null 2>&1 || \
      gh api "repos/$OWNER/$REPO/pages" -X POST -f "source[branch]=gh-pages" -f "source[path]=/" > /dev/null 2>&1 || true

    BUILT_SHA="$(sha256sum site-html/index.html | awk '{print $1}')"
    ok=""
    for i in $(seq 1 20); do
      code="$(curl -sL -o /tmp/live-index.html -w '%{http_code}' "$URL" || echo 000)"
      live_sha="$(sha256sum /tmp/live-index.html 2>/dev/null | awk '{print $1}' || true)"
      if [ "$code" = "200" ] && [ "$live_sha" = "$BUILT_SHA" ]; then ok=yes; break; fi
      echo "waiting for Pages (try $i/20, http $code)"
      sleep 30
    done
    [ "$ok" = "yes" ] || { echo "LIVE-FAIL: served bytes never matched the built site" >&2; exit 1; }

    # the evidence recompute, re-executed against LIVE served bytes
    LIVE_DIR="$(mktemp -d)"
    for f in recompute.py anchor-ledger.json stats.json pollinator-ledger.db; do
      curl -sfL "$URL/evidence/$f" -o "$LIVE_DIR/$f"
    done
    ( cd "$LIVE_DIR" && "$PY" recompute.py ) | tee "$LIVE_DIR/recompute-result.json"
    grep -q '"verdict": "RECOMPUTED"' "$LIVE_DIR/recompute-result.json"

    jq -n --arg url "$URL" --arg index_sha "$BUILT_SHA" \
      --arg evidence_sha "$(sha256sum "$LIVE_DIR/recompute-result.json" | awk '{print $1}')" \
      '{url:$url, index_sha256:$index_sha, http:200, evidence_recompute:"downloaded-script-and-data", evidence_result_sha256:$evidence_sha, verdict:"LIVE-VERIFIED"}' \
      > gates/live-verification.json
    rm -rf "$LIVE_DIR"
    echo "MOVEMENT-24-OK — the ledger is published, the almanac is live, and the bytes answer:"
    echo "  $URL"
    echo "  release: $(cat gates/release-url.txt)"
    {% endif %}

