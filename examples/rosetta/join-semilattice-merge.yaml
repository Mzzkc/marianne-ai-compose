    #!/usr/bin/env python3
    """Per county x taxon: day-of-year histograms over complete years,
    flying-now (observations within +/-%(doy)d DOY of the release's pinned
    baseline), first/last flight DOY, top species. Every stat embeds the
    SQL/query that produced it. Deterministic: --selftest runs twice and
    byte-compares. Dates are locality-local strings as given — no UTC
    arithmetic (the temporal-coordinate lesson)."""
    import json, sqlite3, sys
    from datetime import date

    DOY = {{ doy_window }}
    AS_OF = date.fromisoformat("{{ release_as_of_date }}")
    TODAY_DOY = AS_OF.timetuple().tm_yday
    con = sqlite3.connect("dist/pollinator-ledger.db")
    con.row_factory = sqlite3.Row

    def q(sql, args=()):
        return con.execute(sql, args).fetchall()

    def species_spec(slug, group):
        sql = ("SELECT scientificName AS name, COUNT(*) AS n FROM records "
               "WHERE county_slug = ? AND taxon_group = ? AND eventDate IS NOT NULL "
               "AND eventDate < '%d-01-01' GROUP BY scientificName ORDER BY n DESC, name LIMIT 12" % {{ year_partial }})
        return {"value": [r["name"] for r in q(sql, (slug, group))],
                "query": sql, "params": [slug, group], "transform": "name-list"}

    stats = {"generated_for": "pollinator-ledger {{ release_tag }}",
             "complete_years": [{{ year_start }}, {{ year_full_end }}], "partial_year_excluded": {{ year_partial }},
             "as_of_date": AS_OF.isoformat(), "today_doy": TODAY_DOY, "doy_window": DOY, "counties": {}, "headline": {}}
    slugs = [r["county_slug"] for r in q("SELECT DISTINCT county_slug FROM records ORDER BY county_slug")]
    for slug in slugs:
        stats["counties"][slug] = {"groups": {}}
        groups = [r["taxon_group"] for r in q("SELECT DISTINCT taxon_group FROM records ORDER BY taxon_group")]
        for group in groups:
            base_sql = ("SELECT eventDate FROM records WHERE county_slug=? AND taxon_group=? "
                        "AND eventDate IS NOT NULL AND eventDate >= '%d-01-01' AND eventDate < '%d-01-01'" % ({{ year_start }}, {{ year_partial }}))
            doys = []
            for r in q(base_sql, (slug, group)):
                try:
                    d = r["eventDate"][:10]
                    y, m, dd = int(d[:4]), int(d[5:7]), int(d[8:10])
                    doys.append(date(y, m, dd).timetuple().tm_yday)
                except Exception:
                    continue
            n_dec = len(doys)
            flying_sql = base_sql + " AND CAST(strftime('%j', substr(eventDate,1,10)) AS INTEGER) BETWEEN ? AND ?"
            fn = q(flying_sql, (slug, group, TODAY_DOY - DOY, TODAY_DOY + DOY))
            fn_species_sql = ("SELECT DISTINCT scientificName AS name FROM records WHERE county_slug=? AND taxon_group=? "
                              "AND eventDate IS NOT NULL AND eventDate < '%d-01-01' "
                              "AND CAST(strftime('%j', substr(eventDate,1,10)) AS INTEGER) BETWEEN ? AND ? ORDER BY name" % {{ year_partial }})
            flying = [r["name"] for r in q(fn_species_sql, (slug, group, TODAY_DOY - DOY, TODAY_DOY + DOY))]
            total_sql = "SELECT COUNT(*) AS n FROM records WHERE county_slug=? AND taxon_group=?"
            count_base_sql = base_sql.replace("SELECT eventDate", "SELECT COUNT(*) AS n")
            min_sql = base_sql.replace("SELECT eventDate", "SELECT MIN(CAST(strftime('%j', substr(eventDate,1,10)) AS INTEGER)) AS n")
            max_sql = base_sql.replace("SELECT eventDate", "SELECT MAX(CAST(strftime('%j', substr(eventDate,1,10)) AS INTEGER)) AS n")
            params = [slug, group]
            g = {"decade_records": {"value": q(total_sql, (slug, group))[0]["n"], "query": total_sql, "params": params, "transform": "scalar"},
                 "baseline_records": {"value": n_dec, "query": count_base_sql, "params": params, "transform": "scalar"},
                 "flying_now_species": {"value": flying, "query": fn_species_sql, "params": [slug, group, TODAY_DOY - DOY, TODAY_DOY + DOY], "transform": "name-list"},
                 "first_flight_doy": {"value": min(doys) if doys else None, "query": min_sql, "params": params, "transform": "scalar"},
                 "last_flight_doy": {"value": max(doys) if doys else None, "query": max_sql, "params": params, "transform": "scalar"},
                 "top_species": species_spec(slug, group)}
            stats["counties"][slug]["groups"][group] = g
        total_sql2 = "SELECT COUNT(*) AS n FROM records WHERE county_slug=?"
        stats["counties"][slug]["decade_records"] = {"value": q(total_sql2, (slug,))[0]["n"], "query": total_sql2, "params": [slug], "transform": "scalar"}
    head_sql = "SELECT COUNT(*) AS n, COUNT(DISTINCT scientificName) AS s FROM records"
    r = q(head_sql)[0]
    stats["headline"] = {"records": {"value": r["n"], "query": "SELECT COUNT(*) AS n FROM records", "params": [], "transform": "scalar"},
                         "species": {"value": r["s"], "query": "SELECT COUNT(DISTINCT scientificName) AS n FROM records", "params": [], "transform": "scalar"}}
    json.dump(stats, open("site/data/stats.json", "w"), indent=2, sort_keys=True)
    print("stats: %d counties, %d records" % (len(slugs), stats["headline"]["records"]["value"]))

    # headline extract for the evidence page (recomputable from served bytes)
    extract = {}
    for slug, c in stats["counties"].items():
        extract[slug] = {g: v["decade_records"]["value"] for g, v in c["groups"].items()}
    json.dump({"headline_counts_by_county_group": extract,
               "headline_totals": stats["headline"]["records"]["value"]},
              open("site/data/headline-extract.json", "w"), indent=2, sort_keys=True)
    print("headline extract written")
    PY

    "$PY" scripts/phenology_stats.py
    cp site/data/stats.json /tmp/stats-run1.json
    "$PY" scripts/phenology_stats.py
