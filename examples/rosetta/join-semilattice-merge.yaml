    propose_families:
      1: {key: "claude", family: "anthropic", prefix: "FND-CL", name: "music-critic / claude-opus-4-7", profile: "music-critic", model: "claude-opus-4-7"}
      2: {key: "codex", family: "openai", prefix: "FND-CX", name: "gpt-5.6-repair / gpt-5.6-terra", profile: "gpt-5.6-repair", model: "gpt-5.6-terra"}
      3: {key: "glm", family: "zai", prefix: "FND-GL", name: "opencode-glm-5.3-flash / zai-coding-plan/glm-5.3-flash", profile: "opencode-glm-5.3-flash", model: "zai-coding-plan/glm-5.3-flash"}
    findings_min_per_family: 3

  # ══════════════════════════ PROMPT TEMPLATE ═══════════════════════════════
  # One Jinja template, 24 movement branches. CLI movements render to BASH
  # (V307: raw cli sheets execute as shell); AI movements render to markdown.
  # Scripts are heredoc-authored into the workspace AT RUN TIME with quoted
  # delimiters — the deterministic substrate ships inside this one file.
  template: |
    {# ── Macros: the house style, defined once ──────────────────────────── #}
    {% macro sh() %}set -euo pipefail
    WS="{{ workspace }}"
    REPO="$WS/repo"
    PY="$REPO/.venv/bin/python"
    mkdir -p "$REPO"
    cd "$REPO"{% endmacro %}

    {% macro output_spec(filename, min_words) %}
    ---
    **Output:** `{{ workspace }}/{{ filename }}`
    **Length:** {{ min_words }}+ words. Cite specifics. No hedging.
    {% endmacro %}

    {# The writer discipline — shared verbatim by the canary (movement 4) and
       the volume writers (movement 9). One contract, two scopes: the pattern's
       isolated-writers construction lives or dies on this being identical. #}
    {% macro writer_contract(ns, escape) %}## Writer discipline (Join-Semilattice Merge — the writers stage)

    You are writer namespace **{{ ns }}**. Work ONLY inside your namespace:
    `repo/records/{{ ns }}/<partition-id>/<source>.jsonl` and the shared read-only
    partition raw stores `repo/raw/<partition-id>/<source>/`. Never write into
    another writer's namespace, never modify anything under `repo/scripts/` —
    the gates there are not yours to touch (they were authored and proven
    discriminative before you ran).
    
    For each assigned partition, walk BOTH sources with the paced paginator:
    `repo/scripts/fetch-pages.sh --source gbif|inat --out-dir raw/<pid>/<src> --query "<url-encoded-query>"`.
    Read `repo/scripts/USAGE.md` FIRST — it has the exact query recipes
    (GBIF: backbone family keys from data/taxa.json + URL-encoded county WKT from
    counties/<slug>.wkt, year window {{ year_start }}–{{ year_partial }};
    iNat: taxon_id + place_id, never taxon_name above genus — the 245× undercount
    is pinned history). The paginator handles pacing, Retry-After, backoff,
    verbatim page saves, and the walk manifest. If it exits 5 (iNat page cap),
    re-walk that source in year slices per USAGE and record the slicing in your
    stats. If it exits 2 (persistent throttle) after its own retries: {{ escape }}.
    
    Normalize each fetched page into provenance-bearing JSONL records with EXACTLY
    these fields (see check-writer.py's contract): `source` (gbif|inaturalist),
    `native_id` (GBIF: gbifID; iNat: id), `occurrenceID`, `eventDate`,
    `taxon_key` (GBIF backbone key or iNat taxon id), `scientificName`, `license`,
    `attribution`, `datasetName`, `quality_grade`, `lat`, `lng`, `county_slug`,
    `taxon_group`, `retrieval_ts` (ISO-8601 UTC), `query_sha256` (the sha256 of
    the raw page file the record came from — `sha256sum` the page), and
    `content_digest`. Judgment is YOUR job here and only here: when a source
    legitimately omits a field, carry null and count it in
    `records/{{ ns }}/<pid>/stats.json` (an omission is a completeness statistic,
    not a schema error). `license` and `attribution` must resolve for every
    record — that is the license gate's substrate.
    
    Public counts count DISTINCT native observations. You do not dedupe across
    sources — overlap is the join's business (corroboration edges), never yours.
    Do not merge, do not sort-and-squash, do not "clean up" duplicates: append
    additive facts into your namespace and stop.{% endmacro %}

    {% if stage == 1 %}
    {{ sh() }}

    # ── Movement 1 · Commissioning — Shipyard Sequence + Etiquette Law + Teeth
    # Instrument: cli. This movement manufactures the deterministic substrate:
    # locked environment (Correction 1), doctor that EXECUTES imports, family
    # probe (refuses on vendor collapse), the paced paginator, and EVERY gate
    # that will guard AI output — each proven discriminative with fixtures
    # before any AI sheet runs. The gated never author their own gates.

    mkdir -p scripts/reproducers queries data counties raw records joined \
             counts gates oracle reference profile dist pin debt \
             tests/fixtures tests/scratch site/content/docs site/data site/figs

    cat > requirements.txt <<'REQ'
    pandas
    pyarrow
    shapely
    matplotlib
    pytest
    REQ

    # Check the bootstrap tool before trying to use it, so a missing uv is a
    # named commissioning failure rather than an opaque shell error.
    command -v uv >/dev/null 2>&1 || { echo "DOCTOR-FAIL: uv missing" >&2; exit 1; }
    # Locked environment — the host lies about having these libraries; the
    # doctor will EXECUTE the imports, not check for them.
    uv venv .venv
    uv pip install --python "$PY" -r requirements.txt
    uv pip freeze --python "$PY" > requirements.lock.txt

    # ── doctor.sh: tools present, auth live, imports EXECUTED ──────────────────
    cat > scripts/doctor.sh <<'SH'
    #!/usr/bin/env bash
    set -euo pipefail
    REPO="$(cd "$(dirname "$0")/.." && pwd)"
    mkdir -p "$REPO/pin"
    fail() { echo "DOCTOR-FAIL: $*" >&2; exit 1; }
    need() { command -v "$1" >/dev/null 2>&1 || fail "$1 missing"; }
    need jq; need sqlite3; need curl; need gh; need mkdocs; need git; need uv
    jqver="$(jq --version | sed 's/jq-//')"
    [ "$(printf '%s\n1.7\n' "$jqver" | sort -V | head -1)" = "1.7" ] || fail "jq >= 1.7 required, got $jqver"
    sqver="$(sqlite3 --version | awk '{print $1}')"
    [ "$(printf '%s\n3.45\n' "$sqver" | sort -V | head -1)" = "3.45" ] || fail "sqlite3 >= 3.45 required, got $sqver"
    gh auth status >/dev/null 2>&1 || fail "gh not authenticated"
    GH_LOGIN="$(gh api user --jq .login 2>/dev/null || true)"
    [ -n "$GH_LOGIN" ] || fail "gh cannot read account (gh api user failed)"
    test -x "$REPO/.venv/bin/python" || fail "locked venv missing"
    "$REPO/.venv/bin/python" - <<'PY' || fail "locked-environment imports FAILED (Correction 1: a missing library is a failure, not a warning)"
    import pandas, pyarrow, shapely, matplotlib, pytest
    print("imports-ok")
    PY
    "$REPO/.venv/bin/python" - <<'PY' > "$REPO/pin/host-inventory.json"
    import json, subprocess
    def out(cmd):
        try:
            return subprocess.run(cmd, shell=True, capture_output=True, text=True).stdout.strip().splitlines()[0]
        except Exception:
            return "ERROR"
    pkgs = {}
    for m in ("pandas", "pyarrow", "shapely", "matplotlib", "pytest"):
        pkgs[m] = __import__(m).__version__
    print(json.dumps({
        "jq": out("jq --version"), "sqlite3": out("sqlite3 --version"),
        "curl": out("curl --version"), "gh": out("gh --version"),
        "mkdocs": out("mkdocs --version"), "uv": out("uv --version"),
        "gh_login": out("gh api user --jq .login"),
        "python_packages": pkgs}, indent=2))
    PY
    echo "doctor-ok (gh account: $GH_LOGIN)"
    SH
    chmod +x scripts/doctor.sh
    bash scripts/doctor.sh

    # ── exact profile probe: dispatch names + model pins + readiness ───────────
    cat > scripts/family-derive.py <<'PY'
    """Verify the exact registered profiles used by the two calibration roles
    and three oracle voices. Family is an explicit score contract joined to an
    exact profile+model pair; no substring heuristic is accepted."""
    import json, sys
    listing = json.load(open(sys.argv[1]))
    expected = json.load(open(sys.argv[2]))
    live = {it.get("name"): it for it in listing}
    missing = set(expected) - set(live)
    if missing:
        print("FAMILY-PROBE-FAIL: exact profiles missing:", sorted(missing))
        sys.exit(1)
    checked, errors = {}, []
    for name, contract in expected.items():
        got = live[name]
        rec = {"family": contract["family"], "expected_model": contract["model"],
               "live_model": got.get("default_model"), "ready": got.get("ready") is True}
        checked[name] = rec
        if not rec["ready"]:
            errors.append("%s not ready" % name)
        if rec["live_model"] != rec["expected_model"]:
            errors.append("%s model %r != %r" % (name, rec["live_model"], rec["expected_model"]))
    oracle_names = ["music-critic", "gpt-5.6-repair", "opencode-glm-5.3-flash"]
    fams = [expected[n]["family"] for n in oracle_names]
    if len(set(fams)) != 3:
        errors.append("oracle family contract is not pairwise distinct")
    calibration = [expected["opencode-glm-5.3-flash"]["family"],
                   expected["gpt-5.6-repair"]["family"]]
    if len(set(calibration)) != 2:
        errors.append("first article would self-calibrate")
    report = {"profiles": checked, "oracle_profiles": oracle_names,
              "oracle_families": fams, "proposers_pairwise_distinct": len(set(fams)) == 3,
              "first_article_families": calibration,
              "first_article_pair_distinct": len(set(calibration)) == 2,
              "errors": errors}
    json.dump(report, open(sys.argv[3], "w"), indent=2, sort_keys=True)
    print(json.dumps(report, indent=2, sort_keys=True))
    sys.exit(1 if errors else 0)
    PY
    cat > pin/proposer-pins.json <<'PINS'
    {
      "music-critic": {"family":"anthropic","model":"claude-opus-4-7"},
      "gpt-5.6-repair": {"family":"openai","model":"gpt-5.6-terra"},
      "opencode-glm-5.3-flash": {"family":"zai","model":"zai-coding-plan/glm-5.3-flash"}
    }
    PINS
    mzt instruments list --json > pin/conductor-instruments.json
    "$PY" scripts/family-derive.py pin/conductor-instruments.json pin/proposer-pins.json pin/instrument-families.json

    # ── fetch-pages.sh: the paced paginator (Dormancy Gate discipline) ─────────
    cat > scripts/fetch-pages.sh <<'SH'
    #!/usr/bin/env bash
    # Paced resumable paginator: ~1 req/s, Retry-After respect, bounded retry,
    # atomic verbatim page saves, heartbeat per page, exact walk manifest.
    # Exit codes: 0 walked | 2 persistent throttle | 3 HTTP error | 4 bad response
    #             5 iNat page cap exceeded (narrow by year slices — see USAGE)
    set -euo pipefail
    SOURCE=""; OUT=""; QUERY=""
    while [ $# -gt 0 ]; do
      case "$1" in
        --source) SOURCE="$2"; shift 2;;
        --out-dir) OUT="$2"; shift 2;;
        --query) QUERY="$2"; shift 2;;
        *) echo "unknown arg: $1" >&2; exit 64;;
      esac
    done
    [ -n "$SOURCE" ] && [ -n "$OUT" ] && [ -n "$QUERY" ] || { echo "usage: fetch-pages.sh --source gbif|inat --out-dir D --query Q" >&2; exit 64; }
    mkdir -p "$OUT"
    GBIF="{{ gbif_base }}/occurrence/search"
    INAT="{{ inat_base }}/observations"

    fetch() {
      local url="$1" f="$2" code ra wait tries=0
      while :; do
        code="$(curl -sS -D "$f.hdr" -o "$f.part" -w '%{http_code}' --get "$url" || echo 000)"
        if [ "$code" = "200" ]; then
          jq -e . "$f.part" >/dev/null || { rm -f "$f.part"; echo "invalid JSON $url" >&2; exit 4; }
          mv "$f.part" "$f"
          return 0
        fi
        rm -f "$f.part"
        if [ "$code" = "429" ] || [ "$code" = "503" ]; then
          ra="$(tr 'A-Z' 'a-z' < "$f.hdr" 2>/dev/null | awk '/^retry-after:/{gsub("\r", ""); print $2}' || true)"
          case "$ra" in ''|*[!0-9]*) ra=0;; esac
          wait=$(( ra > 2 ? ra : 2 ))
          tries=$((tries + 1))
          if [ "$tries" -gt 6 ]; then echo "UNHANDLED-THROTTLE http-$code $url" >&2; exit 2; fi
          echo "throttled (http-$code) — sleeping ${wait}s (try $tries/6)"
          sleep "$wait"
          continue
        fi
        echo "HTTP-$code $url" >&2
        exit 3
      done
    }

    if [ "$SOURCE" = "gbif" ]; then
      offset=0; page=0; total=""
      # Resume only complete, parseable pages. A prior partial response never
      # advances custody because fetch writes through .part + atomic rename.
      for old in "$OUT"/page-*.json; do
        [ -f "$old" ] || continue
        jq -e '.results | type == "array"' "$old" >/dev/null || { echo "bad checkpoint $old" >&2; exit 4; }
        [ -n "$total" ] || total="$(jq -r '.count // empty' "$old")"
        n="$(jq '.results | length' "$old")"
        offset=$((offset + n)); page=$((page + 1))
      done
      while :; do
        [ -n "$total" ] && [ "$offset" -ge "$total" ] && break
        f="$OUT/page-$(printf '%04d' "$page").json"
        fetch "$GBIF?$QUERY&limit=300&offset=$offset" "$f"
        if [ -z "$total" ]; then
          total="$(jq -r '.count // empty' "$f")"
          [ -n "$total" ] || { echo "no count field in first page" >&2; exit 4; }
        fi
        echo "gbif page $page offset $offset / total $total"
        n="$(jq '.results | length' "$f")"
        if [ "$n" -eq 0 ]; then rm -f "$f" "$f.hdr"; break; fi
        offset=$((offset + n)); page=$((page + 1))
        [ "$offset" -ge "$total" ] && break
        sleep 1.1
      done
      jq -n --argjson t "$total" --argjson p "$page" --argjson r "$offset" \
        '{source:"gbif",total:$t,pages:$p,records:$r,unhandled_429:0}' > "$OUT/walk-manifest.json"
      echo "GBIF-WALK-DONE pages=$page records=$offset total=$total"
    elif [ "$SOURCE" = "inat" ]; then
      pg=1; total=""; records=0
      for old in "$OUT"/page-*.json; do
        [ -f "$old" ] || continue
        jq -e '.results | type == "array"' "$old" >/dev/null || { echo "bad checkpoint $old" >&2; exit 4; }
        [ -n "$total" ] || total="$(jq -r '.total_results // empty' "$old")"
        n="$(jq '.results | length' "$old")"
        records=$((records + n)); pg=$((pg + 1))
      done
      while :; do
        [ -n "$total" ] && [ "$records" -ge "$total" ] && break
        f="$OUT/page-$(printf '%04d' $((pg - 1))).json"
