  1:
    name: "Commission: Env + Doctor + Teeth"
    instrument: cli            # Etiquette Law: environment and gate-authoring
    instrument_fallbacks: []   # are deterministic; an LLM reinterpreting a
                               # failed probe would counterfeit commissioning
  2:
    name: "Taxon Authority"
    instrument: cli            # Corrections 2–4 enforced mechanically:
    instrument_fallbacks: []   # taxon_id-only, family key-sets, count>0 probes
