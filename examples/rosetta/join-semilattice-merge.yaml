    #!/usr/bin/env python3
    """Almanac bijection gate: every [[stat:key]] anchor in the editorial
    prose must resolve in stats.json, and prose may carry numerals ONLY
    inside anchors (code fences and image targets exempt). The editor cannot
    re-merge or re-count the lattice: any number not flowing through
    stats.json fails here — structural, not volitional."""
    import json, os, re, sys

    docs_dir, stats_path = sys.argv[1], sys.argv[2]
    need = [c for c in sys.argv[3].split(",") if c] if len(sys.argv) > 3 else []
    stats = json.load(open(stats_path))

    def flat(d, p=""):
        out = {}
        for k, v in d.items():
            kk = "%s.%s" % (p, k) if p else k
            if isinstance(v, dict):
                out.update(flat(v, kk))
            else:
                out[kk] = v
        return out

    # Only values with a complete executable query specification may appear in
    # prose. Metadata such as release year/day cannot masquerade as recomputed.
    def query_keys(d, p=""):
        out = set()
        if isinstance(d, dict):
            if {"value", "query", "params", "transform"} <= set(d):
                out.add(p + ".value")
            for k, v in d.items():
                if isinstance(v, dict):
                    out |= query_keys(v, "%s.%s" % (p, k) if p else k)
        return out
    keys = query_keys(stats)
    bad_res, bad_bare, pages = [], [], []
    for root, _, files in os.walk(docs_dir):
        for fn in files:
            if not fn.endswith(".md"):
                continue
            path = os.path.join(root, fn)
            pages.append(path)
            fence = False
            for ln, line in enumerate(open(path), 1):
                if line.strip().startswith("```"):
                    fence = not fence
                    continue
                if fence:
                    continue
                for m in re.finditer(r"\[\[stat:([^\]]+)\]\]", line):
                    if m.group(1) not in keys:
                        bad_res.append("%s:%d %s" % (path, ln, m.group(1)))
                stripped = re.sub(r"\[\[stat:[^\]]+\]\]", "", line)
                stripped = re.sub(r"!\[[^\]]*\]\([^)]*\)", "", stripped)
                if re.search(r"\d", stripped):
                    bad_bare.append("%s:%d: %s" % (path, ln, line.strip()[:80]))
    missing = [c for c in need if not any("/%s.md" % c in p for p in pages)]
    print("pages %d, unresolved %d, bare-number lines %d, missing county pages %s" % (len(pages), len(bad_res), len(bad_bare), missing))
    for x in (bad_res + bad_bare)[:10]:
        print("  ", x)
    sys.exit(1 if (bad_res or bad_bare or missing) else 0)
