    instrument_fallbacks: []   # records where source-legitimate omissions are
    instrument_config:         # completeness stats, not schema errors; a
      timeout_seconds: 5400    # fallback would collapse the family separation
  5:
    name: "Join (canary) — canonical form frozen"
    instrument: cli            # THE pattern's own instrument guidance: no LLM
    instrument_fallbacks: []   # participates in merging, empty fallback chain
