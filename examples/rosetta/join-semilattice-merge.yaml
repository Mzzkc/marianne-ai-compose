    #!/usr/bin/env python3
    """Join-Semilattice Merge — converge an additive observation lattice.
    Union by canonical identity (source, native_id); within-source dedupe by
    content digest (a retry re-delivering identical bytes collapses);
    cross-source overlap becomes CORROBORATION EDGES (GBIF's iNat-sourced
    copy <-> the iNat original) — preserved, never deleted. Canonical
    serialization: sort_keys + compact separators + canonical (source,
    native_id) sort, so the output bytes are a function of the shard SET,
    not its arrival order — which is exactly what the semilattice gate
    proves. Usage: join.py --out DIR FILE [FILE ...]"""
    import hashlib, json, os, re, sys

    args = sys.argv[1:]
    oi = args.index("--out")
    out, files = args[oi + 1], args[oi + 2:]

    def digest(rec):
        # The producer-owned content digest excludes delivery metadata such as
        # retrieval timestamp/query page. Re-delivery therefore collapses,
        # while two normalized payloads for one identity remain a collision.
        return str(rec["content_digest"])

    by_key, collisions = {}, []
    for path in files:
        for line in open(path):
            line = line.strip()
            if not line:
                continue
            rec = json.loads(line)
            key = (rec["source"], str(rec["native_id"]))
            if key not in by_key:
                by_key[key] = rec
            elif digest(by_key[key]) != digest(rec):
                collisions.append({"key": list(key),
                                   "kept": digest(by_key[key])[:16],
                                   "dropped": digest(rec)[:16]})
    pat = re.compile(r"inaturalist\.org/observations/(\d+)")
    edges, unmatched = [], []
    for key in sorted(by_key):
        rec = by_key[key]
        if rec["source"] == "gbif" and "inaturalist" in str(rec.get("datasetName", "")).lower():
            m = pat.search(str(rec.get("occurrenceID", "")) or "")
            if m:
                ik = ("inaturalist", m.group(1))
                if ik in by_key:
                    edges.append({"gbif": {"source": key[0], "native_id": key[1]},
                                  "inaturalist": {"source": ik[0], "native_id": ik[1]}})
                else:
                    unmatched.append({"kind": "inat-sourced-unmatched",
                                      "gbif_native_id": key[1],
                                      "referenced_inat_id": m.group(1)})
    os.makedirs(out, exist_ok=True)
    with open(os.path.join(out, "ledger.jsonl"), "w") as f:
        for key in sorted(by_key):
            f.write(json.dumps(by_key[key], sort_keys=True, separators=(",", ":")) + "\n")
    for name, rows in (("corroboration-edges.jsonl", edges),
                       ("collisions.jsonl", collisions),
                       ("unmatched-inat-sourced.jsonl", unmatched)):
        with open(os.path.join(out, name), "w") as f:
            for r in sorted(rows, key=lambda x: json.dumps(x, sort_keys=True)):
                f.write(json.dumps(r, sort_keys=True, separators=(",", ":")) + "\n")
    print("join: %d records, %d corroboration edges, %d collisions, %d unmatched inat-sourced" % (
        len(by_key), len(edges), len(collisions), len(unmatched)))
    PY

