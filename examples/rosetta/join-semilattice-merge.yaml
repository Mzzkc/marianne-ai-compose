  # ── Phase 2 · Volume fan-out (Fan-out + Synthesis, fan wing) ────────────────
  9:
    name: "Volume Writers (w1…w9)"
    instrument: claude-code    # instance default; sheets 9–17 overridden below
    instrument_config:         # across three profiles (V308 coverage). This is
      timeout_seconds: 5400    # NO movement-level fallback override: writers
                               # fallback-friendly per the pattern file, so
