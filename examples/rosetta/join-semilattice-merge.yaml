                npages = len([f for f in os.listdir(walk_dir) if f.startswith("page-") and f.endswith(".json")])
                if npages != int(m.get("pages", -1)):
                    issues.setdefault(pid, []).append("%s: page-chain gap in %s (%d files vs manifest %s)" % (src, walk_dir, npages, m.get("pages")))
                ds.update(page_digests(walk_dir))
                walked_records += int(m.get("records", -1))
