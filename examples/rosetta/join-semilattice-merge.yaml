sheet:
  size: 1
  total_items: 24            # movements pre-expansion; engine expands to 34 sheets
  fan_out:
    9: 9                     # volume writers w1…w9 (sheets 9–17)
    15: 3                    # oracle propose, one per vendor family (sheets 23–25)
  dependencies:              # movement-keyed; engine expands to the sheet DAG
    2: [1]
    3: [2]
    4: [3]
    5: [4]
    6: [5]
    7: [5]
    8: [6, 7]                # characterize the counted + profiled article
    9: [8]                   # volume BLOCKED by the ratifier gate (dep 8)
    10: [9]
    11: [10]
    12: [11]
    13: [12]
    14: [13]
    15: [14]                 # oracle sees a fully frozen lattice + count branch
    16: [15]
    17: [16]
    18: [12, 14, 17]         # export waits for every observer/editor touching
                             # the pre-export workspace; then re-hashes subjects
    19: [18]
    20: [17, 19]             # publish after interpretation + license gate
    21: [18]
    22: [21]
    23: [22]
    24: [23, 20]             # deploy after site built + release published
                             # (the evidence page links release assets)

  # Profile scheduling spread — sheets 9–17 are movement 9's instances w1–w9.
  # This improves operational fit but is not evidence of vendor diversity:
  # writers intentionally inherit the fallback chain.
  # Full coverage (V308): every expanded sheet of the fan-out is assigned.
  # Writers carry NO fallback override — the score-level chain applies,
  # exactly as the pattern file specifies (writers: fallback-friendly).
  per_sheet_instruments:
    9: claude-code            # w1
    10: codex-cli             # w2
    11: opencode              # w3
    12: claude-code           # w4
    13: codex-cli             # w5
    14: opencode              # w6
    15: claude-code           # w7
    16: codex-cli             # w8
    17: opencode              # w9
    23: music-critic                 # exact model-pinned Anthropic profile
    24: gpt-5.6-repair               # exact model-pinned OpenAI profile
    25: opencode-glm-5.3-flash       # exact model-pinned Z.AI profile

  cadenzas:
    # First-article characterizer — the measured article's profile, injected;
    # the characterizer reads the ledger + raw bytes with its own tools.
    8:
      - file: "{{ workspace }}/repo/profile/boulder-wildbees.json"
        as: context
        required: true
    # Oracle proposers — the stratification plan authored by movement 11's CLI
    # (deterministic): the judged never author their own denominator.
    23:
      - file: "{{ workspace }}/repo/oracle/stratification-plan.json"
        as: context
        required: true
    24:
      - file: "{{ workspace }}/repo/oracle/stratification-plan.json"
        as: context
        required: true
    25:
      - file: "{{ workspace }}/repo/oracle/stratification-plan.json"
        as: context
        required: true
    # Interpret — the VERIFIED manifest only; leads are quarantined and citing
    # one as a finding fails the bijection gate.
    27:
      - file: "{{ workspace }}/repo/oracle/verified-manifest.json"
        as: context
        required: true
    # Almanac editor — stats.json is the only injected numeric source. The
    # output bijection and frozen-subject hashes enforce the claim mechanically.
    32:
      - file: "{{ workspace }}/repo/site/data/stats.json"
        as: context
        required: true

  descriptions:
    1: "Commission — locked venv, doctor EXECUTES imports, family probe, AI-guard gates proven discriminative (teeth)"
    2: "Taxon authority — family key-sets, Apis subtraction key, iNat taxon_ids, count>0 probes, monotonicity"
    3: "Geometry authority — shared county polygons, two-way probes, partition table, writer round-robin"
    4: "Canary writer — Boulder × wild bees, both sources, raw pages pinned verbatim (family A)"
    5: "Join canary — join.py born; canonical serialization frozen; idempotence probe"
    6: "Canary counts — server arm vs ledger arm, keyed reconcile, score-default tolerances"
    7: "Canary profile — license presence, NC fraction, corroboration band, zero date-parse failures"
    8: "First-article characterization — family B pre-registers EXECUTABLE thresholds (ratifier gate blocks volume)"
    9: "Volume writer w1 — claude-code, instance-tagged namespace records/w1/"
    10: "Volume writer w2 — codex-cli, records/w2/"
    11: "Volume writer w3 — opencode, records/w3/"
    12: "Volume writer w4 — claude-code, records/w4/"
    13: "Volume writer w5 — codex-cli, records/w5/"
    14: "Volume writer w6 — opencode, records/w6/"
    15: "Volume writer w7 — claude-code, records/w7/"
    16: "Volume writer w8 — codex-cli, records/w8/"
    17: "Volume writer w9 — opencode, records/w9/"
    18: "Admission sweep — structural gate over all writers; join input == admitted set"
    19: "Lattice join — one primitive converges the volume lattice; corroboration invariant; stratification plan"
    20: "Semilattice gate — K=7 adversarial delivery orders, byte-identical sha256, join∘join identity"
    21: "Count arms — server counter + ledger walk per partition × source, pinned query bytes"
    22: "Count reconciliation — keyed bijection, split-search, bijective|drift|quarantined verdicts"
    23: "Oracle propose — family 1 (Anthropic route) stratified findings with reproduction pointers"
    24: "Oracle propose — family 2 (OpenAI route)"
    25: "Oracle propose — family 3 (Z.AI route)"
    26: "Oracle reconstruct — every pointer EXECUTED; seeded control dies by id; drop rate recorded"
    27: "Oracle interpret — severity + release notes over the verified manifest only"
    28: "Store + export — SQLite + Parquet + CSV, integrity check, four-way rowcount parity"
    29: "License gate — zero-missing license+attribution, NC policy visible"
    30: "Publish v2026.09 — public repo + tagged release; assets re-downloaded + digest-checked"
    31: "Phenology stats — complete-year baselines, flying-now ±15 DOY, deterministic regeneration"
    32: "Almanac editor — named voice, county pages, every numeral a [[stat:…]] anchor"
    33: "Evidence page + build — recompute against the BUILT site's bundled bytes"
    34: "Deploy + live verify — Pages; served hash == built hash; recompute from live bytes"

parallel:
  enabled: true
  max_concurrent: 4          # rendered fan-out width is 9; runtime admission
  fail_fast: true            # is capped at 4 concurrent sheets — distinct facts
                             # invariant 6). fail_fast: a structurally dead
                             # writer ends the run rather than silently
                             # shrinking the ledger.

retry:
  max_retries: 1
  base_delay_seconds: 60

rate_limit:
  wait_minutes: 60
  max_waits: 24

circuit_breaker:
  enabled: true
  failure_threshold: 5       # parent parity — repeated instrument failure
  recovery_timeout_seconds: 600

stale_detection:
  enabled: true
  idle_timeout_seconds: 1800 # paced fetch loops heartbeat one line per page;
                             # silent subprocess fans still need headroom

# cross_sheet: deliberately ABSENT — the workspace IS the shared memory
# (partitions, raw pins, records, gates), and writers must not see each
# other's stdout: independence is the mechanism, not a limitation.

