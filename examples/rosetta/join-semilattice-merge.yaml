    #!/usr/bin/env python3
    """K adversarial delivery orders: canonical, reverse, 2 seeded shuffles,
    full duplicate delivery (every shard twice), a simulated retry
    re-delivering namespace w1's ENTIRE output three times, and a seeded
    round-robin interleave across namespaces. Each order stages the same
    shard CONTENTS under permuted arrival names in a scratch dir, runs the
    join, and digests the ledger. All K digests must agree; then the
    idempotence probe (join of the join = the join)."""
    import hashlib, json, random, shutil, subprocess, sys
    from pathlib import Path

    files = [Path(l.strip()) for l in open("data/join-input.txt") if l.strip()]
    K = len(files)
    assert K > 0

    def stage(order_name, seq):
        d = Path("gates/semilattice-scratch") / order_name
        if d.exists():
            shutil.rmtree(d)
        d.mkdir(parents=True)
        staged = []
        for i, src in enumerate(seq):
            dst = d / ("%06d.jsonl" % i)
            shutil.copyfile(src, dst)
            staged.append(dst)
        out = d / "out"
        r = subprocess.run([".venv/bin/python", "scripts/join.py", "--out", str(out)] +
                           [str(p) for p in staged], capture_output=True, text=True)
        if r.returncode != 0:
            print(r.stdout, r.stderr)
            sys.exit("join failed under order " + order_name)
        return hashlib.sha256((out / "ledger.jsonl").read_bytes()).hexdigest()

    names = {f: "%s:%s" % (f.parent.parent.name, f.name) for f in files}
    orders = {}
    orders["canonical"] = sorted(files, key=lambda f: names[f])
    orders["reverse"] = list(reversed(orders["canonical"]))
    s1 = list(files); random.Random(11).shuffle(s1); orders["shuffle-11"] = s1
    s2 = list(files); random.Random(22).shuffle(s2); orders["shuffle-22"] = s2
    orders["duplicate-delivery"] = [f for f in orders["shuffle-11"] for _ in range(2)]
    w1 = [f for f in files if "/w1/" in str(f)]
    orders["retry-redelivery-w1"] = files + w1 + w1
    by_ns = {}
    for f in orders["shuffle-22"]:
        by_ns.setdefault(f.parent.parent.name, []).append(f)
    inter = []
    rng = random.Random(33)
    pools = [list(v) for v in by_ns.values()]
    while any(pools):
        i = rng.randrange(len(pools))
        if pools[i]:
            inter.append(pools[i].pop(0))
        pools = [p for p in pools if p]
    orders["interleave-33"] = inter

    digests = {name: stage(name, seq) for name, seq in orders.items()}
    uniq = sorted(set(digests.values()))
    base = Path("gates/semilattice-scratch/canonical/out/ledger.jsonl").read_bytes()
    idem_dir = Path("gates/semilattice-scratch/idempotence")
    idem_dir.mkdir(parents=True, exist_ok=True)
    (idem_dir / "input.jsonl").write_bytes(base)
    r = subprocess.run([".venv/bin/python", "scripts/join.py", "--out", str(idem_dir / "out"),
                        str(idem_dir / "input.jsonl")], capture_output=True, text=True)
    if r.returncode != 0:
        sys.exit("idempotence join failed")
    idem = hashlib.sha256((idem_dir / "out" / "ledger.jsonl").read_bytes()).hexdigest()
    idempotent = idem == digests["canonical"]
    report = {"orders": [{"name": n, "sha256": d} for n, d in digests.items()],
              "unique_digests": uniq, "all_equal": len(uniq) == 1,
              "idempotent": idempotent,
              "verdict": "EQUAL" if (len(uniq) == 1 and idempotent) else "INEQUAL"}
    json.dump(report, open("gates/semilattice-report.json", "w"), indent=2)
    for n, d in digests.items():
        print("%s %s" % (d[:16], n))
    print("verdict:", report["verdict"])
    shutil.rmtree("gates/semilattice-scratch")
    sys.exit(0 if report["verdict"] == "EQUAL" else 1)
