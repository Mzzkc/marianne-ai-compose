name: pollinator-ledger
description: "The Join-Semilattice Merge proof — a county-grain, license-complete, order-invariant merge of real GBIF + iNaturalist pollinator occurrence data from two live keyless public APIs, published with the admitted shards and canonical join needed for byte-identical replay, plus The September Almanac whose published numeric anchors are re-executed against the SQLite bytes served beside it."

# workspace: intentionally omitted — auto-managed at <workspace-root>/pollinator-ledger (#58).
# The score never writes outside its workspace except the ONE heralded external
# effect: the public repo + tagged release + Pages deploy (movements 20, 24),
# each gated behind every verification gate.

# The oracle wing uses three globally registered, model-pinned profiles. This
# is deliberate: movement 1 can verify the exact profiles that dispatch will
# use (ready=true and exact default_model), rather than inspecting unrelated
# base profiles and guessing family from substrings. Empty proposer fallbacks
# make the configured profile the executed authority or fail the sheet.

instrument: claude-code
instrument_config:
  timeout_seconds: 1800

# AI movements WITHOUT a calibration role may fall back across vendors
# (volume writers — the join-semilattice pattern's own guidance: writers are
# fallback-friendly). Movements 4, 8, and 15 override this with EMPTY chains:
# the canary writer, the characterizer, and the proposers carry family-
# identity claims that any fallback would silently void — they fail loudly.
instrument_fallbacks: [codex-cli, opencode]

