    #!/usr/bin/env python3
    """Evaluate an allow-listed metric manifest. The characterizer selects
    thresholds, never commands: no AI-authored string reaches a shell. The
    checker owns every measurement and can be audited independently."""
    import datetime, glob, json, os, sys
    from shapely.geometry import Point
    from shapely import wkt

    man = json.load(open("reference/first-article-manifest.json"))
    ths = man.get("thresholds", [])
    assert ths, "manifest has no thresholds"
    allowed = {"license_attribution_presence", "date_parse_failures",
               "eventdate_completeness", "coordinate_completeness",
               "coordinate_in_polygon_rate", "corroboration_rate",
               "drift_tolerance_abs", "drift_tolerance_pct"}
    required = {"license_attribution_presence", "date_parse_failures",
                "eventdate_completeness", "coordinate_completeness",
                "coordinate_in_polygon_rate", "corroboration_rate",
                "drift_tolerance_abs", "drift_tolerance_pct"}
    names = {t.get("metric") for t in ths}
    assert required <= names, "required metrics missing: %s" % sorted(required - names)
    assert names <= allowed, "unknown metrics: %s" % sorted(names - allowed)
    assert all("measure_cmd" not in t for t in ths), "executable manifest fields are forbidden"

    records = [json.loads(l) for l in open("joined/canary/ledger.jsonl") if l.strip()]
    assert records, "canary ledger empty"

    def fraction(pred):
        return sum(1 for r in records if pred(r)) / len(records)

    def measure(t):
        metric = t["metric"]
        if metric == "license_attribution_presence":
            return fraction(lambda r: bool(r.get("license")) and bool(r.get("attribution")))
        if metric == "date_parse_failures":
            bad = 0
            for r in records:
                if not r.get("eventDate"):
                    continue
                try: datetime.date.fromisoformat(str(r["eventDate"])[:10])
                except ValueError: bad += 1
            return bad
        if metric == "eventdate_completeness":
            return fraction(lambda r: bool(r.get("eventDate")))
        if metric == "coordinate_completeness":
            return fraction(lambda r: r.get("lat") is not None and r.get("lng") is not None)
        if metric == "coordinate_in_polygon_rate":
            located = [r for r in records if r.get("lat") is not None and r.get("lng") is not None]
            assert len(located) >= 50, "fewer than 50 located records"
            poly = wkt.loads(open("counties/boulder.wkt").read())
            sample = sorted(located, key=lambda r: (r["source"], str(r["native_id"])))[:max(50, min(500, len(located)))]
            return sum(1 for r in sample if poly.covers(Point(float(r["lng"]), float(r["lat"])))) / len(sample)
        if metric == "corroboration_rate":
            edges = sum(1 for l in open("joined/canary/corroboration-edges.jsonl") if l.strip())
            return edges / len(records)
        if metric == "drift_tolerance_abs":
            v = float(t["value"]); assert v <= {{ drift_tolerance_abs }}; return v
        if metric == "drift_tolerance_pct":
            v = float(t["value"]); assert v <= {{ drift_tolerance_pct }}; return v
        raise AssertionError("unreachable metric " + metric)

    bad = []
    for t in ths:
        try:
            val = float(measure(t))
        except Exception:
            bad.append((t.get("name", t.get("metric")), "unmeasurable"))
            continue
        lo, hi = t.get("floor"), t.get("ceiling")
        okv = (lo is None or val >= lo) and (hi is None or val <= hi)
        print("%s %s = %s (floor %s, ceiling %s)" % ("PASS" if okv else "FAIL", t["metric"], val, lo, hi))
        if not okv:
            bad.append((t["metric"], val))
    sys.exit(1 if bad else 0)
    PY

