    """GeoJSON -> WKT via shapely; validity enforced; simplification with a
    PUBLISHED area delta only when the vertex count demands it (GBIF WKT
    comfort). Two-way probes per county; geometry manifest written."""
    import json, os, sys
    from shapely.geometry import shape
    from shapely.ops import transform
    try:
        import urllib.parse
        import urllib.request
    except ImportError:
        sys.exit("stdlib broken")

    gbif = "{{ gbif_base }}/occurrence/search"
    inat = "{{ inat_base }}/observations"
    manifest = {}
    slugs = []
    for line in open("data/counties.txt"):
        line = line.strip()
        if not line or line.startswith("name|"):
            continue
        name, slug = line.split("|")
        slugs.append(slug)
        gj = json.load(open("counties/%s.geojson" % slug))
        geom = shape(gj["geometry"])
        if not geom.is_valid:
            sys.exit("geometry-invalid: %s" % slug)
        verts = len(geom.exterior.coords) if geom.geom_type == "Polygon" else sum(len(p.exterior.coords) for p in geom.geoms)
        delta_pct = 0.0
        wkt_geom = geom
        if verts > 150:
            wkt_geom = geom.simplify(0.002, preserve_topology=True)
            delta_pct = 100.0 * (geom.area - wkt_geom.area) / geom.area
            if not wkt_geom.is_valid or delta_pct > 2.0:
                sys.exit("simplification of %s invalid or delta %.3f%% > 2%%" % (slug, delta_pct))
        wkt = wkt_geom.wkt
