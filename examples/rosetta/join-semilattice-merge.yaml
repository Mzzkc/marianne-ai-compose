    #!/usr/bin/env python3
    """Server-side enumeration: read each index's OWN counter. GBIF:
    count-via-search (limit=0 — the bare occurrence/count endpoint rejects
    geometry and scientificName; pinned history) per county-WKT x family key,
    group total = sum over the family set. iNat: total_results per place x
    taxon_id. Paced ~1 req/s; every count PINS its exact query bytes and
    response digest — an unpinnable count is inadmissible. Writes
    counts/server-side.json keyed "<pid>|<source>"."""
    import hashlib, json, sys, time, urllib.parse, urllib.request

    scope = sys.argv[1] if len(sys.argv) > 1 else "--all"
    parts = json.load(open("partitions.json"))["partitions"]
    taxa = json.load(open("data/taxa.json"))
    fam_of_group = {}
    for line in open("data/expected-families.tsv"):
        if line.startswith("group|"):
            continue
        g, fam, key = line.strip().split("|")
        fam_of_group.setdefault(g, []).append((fam, int(key)))
    inat_of_group = {}
    for line in open("data/expected-inat.tsv"):
        if line.startswith("group|"):
            continue
        g, taxon, tid, child = line.strip().split("|")
        inat_of_group[g] = int(tid)

    def get(url):
        for attempt in range(6):
            try:
                with urllib.request.urlopen(url, timeout=90) as r:
                    body = r.read()
                    return body, r.headers.get("Retry-After")
            except urllib.error.HTTPError as e:
                if e.code in (429, 503):
                    ra = e.headers.get("Retry-After") or "2"
                    time.sleep(max(int(ra), 2))
                    continue
                raise
        raise RuntimeError("throttled past retries: " + url)

    out, provenance = {}, {}
    if scope == "--all":
        sel = parts
    else:
        sel = [p for p in parts if p["id"] == scope.split("--partition=")[-1]]
    for p in sel:
        pid, group = p["id"], p["taxon_group"]
        wkt = open("counties/%s.wkt" % p["county_slug"]).read().strip()
        geo = urllib.parse.quote(wkt)
        total = 0
        for fam, key in fam_of_group[group]:
            q = "taxon_key=%d&geometry=%s&country=US&limit=0&year=%d,%d" % (key, geo, {{ year_start }}, {{ year_partial }})
            body, _ = get("{{ gbif_base }}/occurrence/search?" + q)
            c = json.loads(body)["count"]
            total += c
            provenance["%s|gbif|%s" % (pid, fam)] = {"count": c, "query": q,
                                                     "response_sha256": hashlib.sha256(body).hexdigest()}
            print("server %s gbif %s = %d" % (pid, fam, c))
            time.sleep(1.1)
        # Only rolled-up partition totals enter the compared key space. Family
        # sub-counts remain in a separate provenance sidecar.
        fam_digs = "".join(provenance["%s|gbif|%s" % (pid, fam)]["response_sha256"] for fam, _ in fam_of_group[group])
        out["%s|gbif" % pid] = {"count": total,
                                "query": "aggregate: sum of this partition's family sub-queries (each pinned individually)",
                                "response_sha256": hashlib.sha256(fam_digs.encode()).hexdigest()}
        q = "taxon_id=%d&place_id=%s&d1=%d-01-01&d2=%d-12-31" % (inat_of_group[group], p["place_id"], {{ year_start }}, {{ year_partial }})
        body, _ = get("{{ inat_base }}/observations?" + q + "&per_page=1")
        c = json.loads(body)["total_results"]
        out["%s|inaturalist" % pid] = {"count": c, "query": q,
