    description: "Four-way rowcount, 17-field schema, and record-identity digest parity"
  - type: command_succeeds
    command: 'cd {workspace}/repo/dist && sha256sum -c SHA256SUMS'
    condition: "stage == 18"
    stage: 2
    description: "Release assets digest-clean"

  # ── Movement 19 · License gate ──────────────────────────────────────────────
  - type: command_succeeds
    command: 'test "$(sqlite3 {workspace}/repo/dist/pollinator-ledger.db "SELECT COUNT(*) FROM records WHERE license IS NULL OR license = '''' OR attribution IS NULL OR attribution = '''';")" -eq 0'
    condition: "stage == 19"
    stage: 2
    description: "License gate re-proved by the validator: zero records missing license+attribution"
  - type: command_succeeds
    command: 'jq -e ''.source_specific_attribution_failures.gbif == 0 and .source_specific_attribution_failures.inaturalist == 0 and .records > 0'' {workspace}/repo/gates/license-report.json'
    condition: "stage == 19"
    stage: 2
    description: "Source-specific attribution forms are independently re-proved for GBIF and iNaturalist"

  # ── Movement 20 · Publish ───────────────────────────────────────────────────
  - type: command_succeeds
    command: 'cd {workspace}/repo && SLUG=$(cat gates/release-slug.txt); TAG=$(cat gates/release-tag.txt); gh release view "$TAG" -R "$SLUG" --json assets -q ''.assets[].name'' | sort > /tmp/remote-assets.txt && diff release-assets/EXPECTED-ASSETS.txt /tmp/remote-assets.txt'
    condition: "stage == 20"
    stage: 2
    timeout_seconds: 300
    description: "Public release has exactly the declared asset set — no omission or stale extra"
  - type: command_succeeds
    command: 'bash {workspace}/repo/scripts/verify-release-assets.sh'
    condition: "stage == 20"
    stage: 3
    timeout_seconds: 900
    description: "Custody transfer: shipped bytes re-downloaded and digest-equal to the gated bytes"

  # ── Movement 21 · Phenology stats ───────────────────────────────────────────
  - type: command_succeeds
    command: 'cd {workspace}/repo && cp site/data/stats.json /tmp/val-stats-1.json && .venv/bin/python scripts/phenology_stats.py > /dev/null && diff /tmp/val-stats-1.json site/data/stats.json'
    condition: "stage == 21"
    stage: 2
    timeout_seconds: 300
    description: "Stats deterministic: independent regeneration is byte-equal"
  - type: command_succeeds
    command: 'jq -e ''[.. | objects | select(has("query"))] | length > 100'' {workspace}/repo/site/data/stats.json'
    condition: "stage == 21"
    stage: 2
    description: "Every published stat embeds the query that produced it"

  # ── Movement 22 · Almanac editor ────────────────────────────────────────────
  - type: command_succeeds
    command: 'cd {workspace}/repo && SLUGS=$(tail -n +2 data/counties.txt | cut -d''|'' -f2 | paste -sd, -); .venv/bin/python scripts/bijection-gate.py site/content/docs site/data/stats.json "$SLUGS"'
    condition: "stage == 22"
    stage: 2
    timeout_seconds: 300
    description: "Bijection gate: every numeral anchored and resolving; all 10 county pages present"
  - type: command_succeeds
    command: 'test $(wc -w < {workspace}/repo/site/content/docs/index.md) -ge 300'
    condition: "stage == 22"
    stage: 2
    description: "Almanac front page substantive"

  # ── Movement 23 · Evidence page + build ─────────────────────────────────────
  - type: command_succeeds
    command: 'test -f {workspace}/repo/site-html/index.html && ! grep -rq "\[\[stat:" {workspace}/repo/site-html/'
    condition: "stage == 23"
    stage: 2
    description: "Site built with zero unresolved anchors"
  - type: command_succeeds
    command: 'cd {workspace}/repo/site-html/evidence && {workspace}/repo/.venv/bin/python recompute.py'
    condition: "stage == 23"
    stage: 2
    timeout_seconds: 120
    description: "Evidence recompute green against the BUILT site's own bundled bytes"

  # ── Movement 24 · Deploy + live verify ──────────────────────────────────────
  - type: command_succeeds
    command: 'B=$(jq -r ''.index_sha256'' {workspace}/repo/gates/live-verification.json); U=$(jq -r ''.url'' {workspace}/repo/gates/live-verification.json); L=$(curl -sfL "$U" | sha256sum | awk ''{print $1}''); test -n "$B" && test "$B" = "$L"'
    condition: "stage == 24"
    stage: 2
    timeout_seconds: 300
    description: "RUNNING artifact verified independently: live served index hash == built hash"
  - type: command_succeeds
    command: 'jq -e ''.verdict == "LIVE-VERIFIED" and .evidence_recompute == "downloaded-script-and-data" and (.evidence_result_sha256|length)==64'' {workspace}/repo/gates/live-verification.json && U=$(jq -r ''.url'' {workspace}/repo/gates/live-verification.json) && for f in recompute.py anchor-ledger.json stats.json pollinator-ledger.db; do curl -sfL "$U/evidence/$f" -o /dev/null || exit 1; done'
    condition: "stage == 24"
    stage: 2
    timeout_seconds: 300
    description: "Live evidence bytes served — the proof ends at the served byte"
