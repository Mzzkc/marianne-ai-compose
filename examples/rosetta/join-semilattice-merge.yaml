    #!/usr/bin/env python3
    """Small read-only kernel for the oracle's fixed reproduction language.
    It opens only declared in-repo data paths and never starts a subprocess."""
    import hashlib, json, os, re, sys
    from shapely.geometry import Point
    from shapely import wkt

    args = sys.argv[1:]
    out_v, out_d, out_s = args[-3], args[-2], args[-1]
    admitted_files = args[:-3]
    findings = []
    for a in admitted_files:
        findings += [json.loads(l) for l in open(a) if l.strip()]
    findings.append({"finding_id": "CTL-SEEDED-0001", "family": "control",
                     "kind": "seeded-hallucination-control", "check": "jsonl-field-predicate",
                     "args": {"path": "joined/ledger.jsonl", "field": "native_id", "op": "eq", "value": "__IMPOSSIBLE_CONTROL_ID__"},
                     "expected": "a fabricated native id exists"})

    def safe(path):
        if os.path.isabs(path) or ".." in path.split("/") or not path.startswith(("raw/", "joined/", "counts/")):
            raise ValueError("path outside read-only subject: " + path)
        real = os.path.realpath(path); root = os.path.realpath(".") + os.sep
        if not real.startswith(root) or not os.path.isfile(real):
            raise ValueError("missing or escaping path: " + path)
        return real

    def field(obj, dotted):
        cur = obj
        for part in dotted.split("."):
            cur = cur[part]
        return cur

    def compare(actual, op, want):
        if op == "eq": return actual == want
        if op == "ne": return actual != want
        if op == "lt": return actual < want
        if op == "le": return actual <= want
        if op == "gt": return actual > want
        if op == "ge": return actual >= want
        if op == "contains": return str(want) in str(actual)
        if op == "regex": return bool(re.search(str(want), str(actual)))
        raise ValueError("unsupported comparator " + op)

    ledger_cache = None
    def run(f):
        nonlocal_ledger = None
        c, a = f["check"], f["args"]
        if c == "jsonl-field-predicate":
            rows = [json.loads(l) for l in open(safe(a["path"])) if l.strip()]
            return any(compare(field(r, a["field"]), a["op"], a["value"]) for r in rows)
        if c == "json-field-predicate":
            return compare(field(json.load(open(safe(a["path"]))), a["field"]), a["op"], a["value"])
        if c == "edge-endpoints-exist":
            keys = {(r["source"], str(r["native_id"])) for r in (json.loads(l) for l in open(safe("joined/ledger.jsonl")) if l.strip())}
            edges = [json.loads(l) for l in open(safe(a.get("path", "joined/corroboration-edges.jsonl"))) if l.strip()]
            return any((e["gbif"]["source"], str(e["gbif"]["native_id"])) not in keys or
                       (e["inaturalist"]["source"], str(e["inaturalist"]["native_id"])) not in keys for e in edges)
        if c == "record-outside-county":
            rows = [json.loads(l) for l in open(safe("joined/ledger.jsonl")) if l.strip()]
            for r in rows:
                if r.get("lat") is None or r.get("lng") is None: continue
                slug = str(r["county_slug"])
                if not re.fullmatch(r"[a-z0-9-]+", slug):
                    raise ValueError("unsafe county slug: " + slug)
                county_path = os.path.realpath("counties/%s.wkt" % slug)
                county_root = os.path.realpath("counties") + os.sep
                if not county_path.startswith(county_root) or not os.path.isfile(county_path):
                    raise ValueError("missing or escaping county geometry: " + slug)
                poly = wkt.loads(open(county_path).read())
                if not poly.covers(Point(float(r["lng"]), float(r["lat"]))): return True
            return False
        if c == "duplicate-key-conflict":
            return any(True for l in open(safe(a.get("path", "joined/collisions.jsonl"))) if l.strip())
        if c == "count-verdict-present":
            report = json.load(open(safe(a.get("path", "counts/server-side.json"))))
            return compare(field(report[a["key"]], a.get("field", "count")), a["op"], a["value"])
        raise ValueError("unknown check " + c)

    verified, dropped = [], []
    for f in findings:
        try:
            ok = bool(run(f)); detail = "predicate=%s" % ok
        except Exception as e:
            ok = False; detail = "checker-error:%s" % e
        rec = dict(f, exec_exit=0 if ok else 1, exec_tail=detail)
        (verified if ok else dropped).append(rec)
    with open(out_v, "w") as fh:
        for x in verified:
            fh.write(json.dumps(x, sort_keys=True) + "\n")
    with open(out_d, "w") as fh:
        for x in dropped:
            fh.write(json.dumps(x, sort_keys=True) + "\n")
    by_family = {fam: sum(1 for x in verified if x.get("family") == fam)
                 for fam in ("anthropic", "openai", "zai")}
    stats = {"total": len(findings), "verified": len(verified), "dropped": len(dropped),
             "drop_rate": round(len(dropped) / len(findings), 4) if findings else 0.0,
             "verified_by_family": by_family,
             "control_dropped": any(d["finding_id"] == "CTL-SEEDED-0001" for d in dropped)}
    json.dump(stats, open(out_s, "w"), indent=2)
    print(json.dumps(stats))
    sys.exit(0 if stats["control_dropped"] else 1)
