    #!/usr/bin/env bash
    set -euo pipefail
    cd "$(dirname "$0")/.."
    INAT="{{ inat_base }}"
    GBIF="{{ gbif_base }}"
    die() { echo "GEOMETRY-FAIL: $*" >&2; exit 1; }
