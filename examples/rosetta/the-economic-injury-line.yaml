    Honesty clause (machine-carried, never retyped): aphid-pressure data is a
    SEEDED RECONSTRUCTION driven by pinned degree-day weather and calibrated to
    published growth rates — declared modeled data, never field observation.
    Commodity price and weather are real and pinned bytes.
    {% endmacro %}

    {% macro ai_ground_rules() %}
    ## Ground Rules (non-negotiable)
    - Fabrication wears completion's clothes: never write a placeholder where a
      real artifact is owed, and never claim a command ran without running it.
    - The deterministic gates are the coordination. If a gate fails against your
      work, fix the work — never the gate, never the record.
    - Stamp every JSON artifact you author with `"instrument": "{{ instrument_name }}"`.
    {% endmacro %}

    {% if stage == 1 %}
    {{ strict() }}
    # ── Movement 1 · The Tool Chain (M0) — Etiquette Law / The Tool Chain ──────
    # The ENTIRE deterministic substrate is heredoc-authored here, by CLI, at run
    # time. Failure-mode teeth are authored AND PROVEN before any expensive
    # token is spent. REVISION ADDITIONS: mkdocs RESOLUTION (the literal-tilde
    # bug dies here), the RUN NONCE (gas-free freshness), and deployment.json
    # (every validation reads config from disk, never from a prompt placeholder).
    mkdir -p shed-wall/scripts shed-wall/specs shed-wall/docs/data shed-wall/docs/verdict-tool run pin fixtures review reference
    if [ ! -d shed-wall/.git ]; then git init -q -b main shed-wall; fi

    # ── The one honesty constant (binding rule 5: template-generated, machine-checked) ──
    cat > shed-wall/specs/reconstruction-clause.txt <<'CLAUSE'
    RECONSTRUCTION CLAUSE: aphid-pressure data in this artifact is a SEEDED
    RECONSTRUCTION driven by pinned degree-day weather and calibrated to
    published growth rates — declared modeled data, never field observation.
    Commodity price and weather are real and pinned bytes. The scouting
    verdicts govern that reconstruction; the economics are real.
    CLAUSE

    # ── yamlmini.py — schema-strict YAML subset (stdlib only, controlled schema) ──
    cat > shed-wall/scripts/yamlmini.py <<'PY'
    #!/usr/bin/env python3
    """yamlmini.py — schema-strict YAML subset for Shed Wall specs (stdlib only).
    Supports nested mappings, lists of flat mappings or scalars, and scalars
    (int/float/bool/null/quoted-or-bare strings). Refuses tabs and multiline
    scalars. dump() is canonical: sorted keys, 2-space indent, ALL strings
    double-quoted — so round-trips are byte-identical and digests are stable."""
    def _parse_scalar(s):
        s = s.strip()
        if len(s) >= 2 and s[0] == s[-1] and s[0] in "\"'":
            return s[1:-1]
        if s == "[]":
            return []
        if s == "{}":
            return dict()
        if s == "true":
            return True
        if s == "false":
            return False
        if s == "null":
            return None
        try:
            return int(s)
        except ValueError:
            pass
        try:
            return float(s)
        except ValueError:
            pass
        return s

    def load(path):
        with open(path, "r", encoding="utf-8") as fh:
            lines = fh.read().splitlines()
        for i, ln in enumerate(lines):
            if "\t" in ln:
                raise AssertionError("tab at %s line %d" % (path, i + 1))
        value, idx = _block(lines, 0, 0)
        if idx != len(lines):
            raise AssertionError("unparseable content at %s line %d" % (path, idx + 1))
        return value

    def _block(lines, i, indent):
        while i < len(lines) and (not lines[i].strip() or lines[i].lstrip().startswith("#")):
            i += 1
        if i == len(lines):
            return None, i
        cur = len(lines[i]) - len(lines[i].lstrip(" "))
        if cur < indent:
            return None, i
        if lines[i].lstrip().startswith("- "):
            return _list(lines, i, cur)
        return _map(lines, i, cur)

    def _map(lines, i, indent):
        out = dict()
        while i < len(lines):
            ln = lines[i]
            if not ln.strip() or ln.lstrip().startswith("#"):
                i += 1
                continue
            cur = len(ln) - len(ln.lstrip(" "))
            if cur < indent or ln.lstrip().startswith("- "):
                break
            if cur > indent:
                raise AssertionError("bad indent at line %d" % (i + 1))
            key, sep, rest = ln.partition(":")
            if not sep:
                raise AssertionError("no colon at line %d" % (i + 1))
            key = key.strip()
            rest = rest.strip()
            if rest:
                out[key] = _parse_scalar(rest)
                i += 1
            else:
                child, i = _block(lines, i + 1, indent + 1)
                out[key] = child
        return out, i

    def _list(lines, i, indent):
        out = []
        while i < len(lines):
            ln = lines[i]
            if not ln.strip() or ln.lstrip().startswith("#"):
                i += 1
                continue
            cur = len(ln) - len(ln.lstrip(" "))
            if cur < indent or not ln.lstrip().startswith("- "):
                break
            item = ln.lstrip()[2:].strip()
            if ":" in item and not item[:1] in ("\"", "'"):
                obj = dict()
                k, _, v = item.partition(":")
                if v.strip():
                    obj[k.strip()] = _parse_scalar(v)
                i += 1
                while i < len(lines):
                    nx = lines[i]
                    if not nx.strip():
                        i += 1
                        continue
                    c2 = len(nx) - len(nx.lstrip(" "))
                    if c2 <= indent or nx.lstrip().startswith("- "):
                        break
                    k2, _, v2 = nx.partition(":")
                    obj[k2.strip()] = _parse_scalar(v2)
                    i += 1
                out.append(obj)
            else:
                out.append(_parse_scalar(item))
                i += 1
        return out, i

    def dump(value):
        return "\n".join(_dump(value, 0)) + "\n"

    def _dump(value, indent):
        pad = "  " * indent
        if isinstance(value, dict):
            lines = []
            for k in sorted(value):
                v = value[k]
                if isinstance(v, (dict, list)) and len(v):
                    lines.append("%s%s:" % (pad, k))
                    lines.extend(_dump(v, indent + 1))
                elif isinstance(v, list):
                    lines.append("%s%s: []" % (pad, k))
                elif isinstance(v, dict):
                    lines.append("%s%s: {}" % (pad, k))
                else:
                    lines.append("%s%s: %s" % (pad, k, _scalar(v)))
            return lines
        if isinstance(value, list):
            lines = []
            for item in value:
                if isinstance(item, dict):
                    keys = sorted(item)
                    for j, k in enumerate(keys):
                        if j == 0:
                            lines.append("%s- %s: %s" % (pad, k, _scalar(item[k])))
                        else:
                            lines.append("%s  %s: %s" % (pad, k, _scalar(item[k])))
                else:
                    lines.append("%s- %s" % (pad, _scalar(item)))
            return lines
        return ["%s%s" % (pad, _scalar(value))]

    def _scalar(v):
        if isinstance(v, bool):
            return "true" if v else "false"
        if v is None:
            return "null"
        if isinstance(v, (int, float)):
            return str(v)
        return '"%s"' % str(v).replace("\\", "\\\\").replace("\"", "\\\"")
    PY

    # ── eil.py — the deterministic heart (the ONLY file containing EIL arithmetic) ──
    cat > shed-wall/scripts/eil.py <<'PY'
    #!/usr/bin/env python3
    """eil.py — the deterministic heart of The Shed Wall (python3 stdlib only).

    EIL = C / (V * I_D * K) — Stern et al. 1959, operationalized for soybean
    aphid by Ragsdale et al. 2007.

    Laws encoded here (The Etiquette Law):
      - `derive` (authoring) and `verify` (the run's SINGLE legal re-derivation,
        nonce-bound, compared against the sha256 pin) are the only code paths
        that compute EIL. scout and verdict consume the frozen table read-only,
        and every verdict carries the table digest it obeyed.
      - `digest-ledger` prints the LOGICAL ledger digest (canonical dump of the
        days+metadata tables — NOT the sqlite file bytes). Spray events live in
        a separate table and CANNOT move the logical digest, so the treat path
        no longer breaks the replay arms.
      - every refusal is a nonzero exit with the reason on stdout.
      - the tier bar and the effectivity admit gate (county list AND crop year,
        enforced inside verdict) are executable constraints, not prose."""
    import argparse, hashlib, json, os, random, sqlite3, sys

    HERE = os.path.dirname(os.path.abspath(__file__))
    REPO = os.path.dirname(HERE)
    INPUTS = os.path.join(REPO, "specs", "eil-inputs.yaml")
    TABLE = os.path.join(REPO, "specs", "eil-table.yaml")
    MANIFEST = os.path.join(REPO, "specs", "SPEC-MANIFEST.json")
    sys.path.insert(0, HERE)
    import yamlmini as Y

    REQUIRED_COEFFS = ["management_cost_C", "management_cost_C_cross", "damage_I_D",
                       "k_tier1", "k_tier2", "response_lag_multiplier",
                       "aphid_dev_base", "paper_scenario_C", "paper_scenario_V",
                       "growth_r_base"]

    def die(msg, code=2):
        print(msg)
        sys.exit(code)

    def sha256_file(path):
        h = hashlib.sha256()
        with open(path, "rb") as fh:
            for chunk in iter(lambda: fh.read(65536), b""):
                h.update(chunk)
        return h.hexdigest()

    def coeff_scalars(inputs):
        return dict((c["name"], float(c["value"])) for c in inputs["coefficients"])

    def eil_of(c_usd_ac, v_usd_bu, i_d, k):
        return c_usd_ac / (v_usd_bu * i_d * k)

    def ledger_digest(path):
        """Logical digest: canonical dump of days+metadata. spray_events are
        deliberately EXCLUDED — recording a treatment must not invalidate the
        evidence the replay arms assert against."""
        con = sqlite3.connect(path)
        days = con.execute("select date, gdd, cum_gdd, density, r_stage from days order by date").fetchall()
        meta = sorted(con.execute("select key, value from metadata").fetchall())
        con.close()
        canonical = "\n".join(",".join(repr(x) for x in row) for row in days)
        canonical += "\n##\n" + "\n".join("%s=%s" % kv for kv in meta)
        return hashlib.sha256(canonical.encode("utf-8")).hexdigest()

    def pinned_table_sha(table_path, manifest_path):
        if os.path.exists(manifest_path):
            return json.load(open(manifest_path))["files"]["specs/eil-table.yaml"]
        return sha256_file(table_path)

    def derive_table(inputs):
        co = coeff_scalars(inputs)
        v = float(inputs["price_snapshot"]["v_usd_bu"])
        c = co["management_cost_C"]
        i_d = co["damage_I_D"]
        k1 = co["k_tier1"]
        lag = co["response_lag_multiplier"]
        k_floor = float(inputs.get("tier_rules", {}).get("k_floor_incremental", 0.8))
        eil = eil_of(c, v, i_d, k1)
        sens = []
        for label, mult in (("V-10%", 0.9), ("pinned", 1.0), ("V+10%", 1.1)):
            vv = v * mult
            sens.append(dict(scenario=label, v_usd_bu=round(vv, 4),
                             eil_aphids_per_plant=round(eil_of(c, vv, i_d, k1), 2)))
        return {
            "eil_aphids_per_plant": round(eil, 2),
            "action_threshold_aphids_per_plant": round(eil / lag, 2),
            "response_lag_multiplier": lag,
            "sensitivity": sens,
            "tier_order": ["tier-1-incremental", "tier-2-broad"],
            "tier_2_reachable_while_tier1_effective": bool(k1 < k_floor),
            "k_floor_incremental": k_floor,
            "sampling": inputs["sampling"],
            "effectivity": inputs["effectivity"],
            "price_pin": {
                "v_usd_bu": v,
                "v_cents_bu": inputs["price_snapshot"]["v_cents_bu"],
                "price_date": inputs["price_snapshot"].get("price_date", ""),
                "captured_at": inputs["price_snapshot"]["captured_at"],
                "response_sha256": inputs["price_snapshot"]["response_sha256"],
            },
        }

    def cmd_check_coefficients(a):
        data = Y.load(a.file)
        coeffs = data.get("coefficients")
        if not isinstance(coeffs, list) or len(coeffs) < len(REQUIRED_COEFFS):
            die("FAIL: fewer coefficient entries (%s) than required names (%d)"
                % (len(coeffs) if isinstance(coeffs, list) else 0, len(REQUIRED_COEFFS)))
        names = set()
        for c in coeffs:
            for f in ("name", "value", "unit", "source", "locator", "quote"):
                if not str(c.get(f, "")).strip():
                    die("FAIL: coefficient %r missing %s — a number without provenance does not enter" % (c.get("name"), f))
            if len(str(c.get("quote", "")).strip()) < 15:
                die("FAIL: coefficient %r quote too short to be a verbatim excerpt" % c.get("name"))
            names.add(c["name"])
        missing = [n for n in REQUIRED_COEFFS if n not in names]
        if missing:
            die("FAIL: missing required coefficients: %s" % ", ".join(missing))
        print("check-coefficients ok: %d coefficients, every one provenanced + quoted" % len(coeffs))

    def cmd_fixture(a):
        inputs = Y.load(a.inputs or INPUTS)
        co = coeff_scalars(inputs)
        eil = eil_of(co["paper_scenario_C"], co["paper_scenario_V"],
                     co["damage_I_D"], co["k_tier1"])
        published = float(a.published)
        tol = float(a.tolerance_pct) / 100.0
        dev = abs(eil - published) / published
        print("fixture: pipeline(paper C=%.2f USD/ac, paper V=%.2f USD/bu) -> EIL %.1f aphids/plant; published %.1f; deviation %.2f%%"
              % (co["paper_scenario_C"], co["paper_scenario_V"], eil, published, dev * 100.0))
        if dev > tol:
            die("FAIL: re-derivation deviates %.2f%% from the published EIL — an extraction error is loaded; authoring aborts" % (dev * 100.0), 3)
        print("fixture: implied ET one lag below: %.1f aphids/plant" % (eil / co["response_lag_multiplier"]))

    def cmd_derive(a):
        inputs = Y.load(a.inputs or INPUTS)
        table = derive_table(inputs)
        out = a.out or TABLE
        os.makedirs(os.path.dirname(out), exist_ok=True)
        with open(out, "w", encoding="utf-8") as fh:
            fh.write(Y.dump(table))
        print("derive: EIL %.2f / AT %.2f aphids per plant -> %s"
              % (table["eil_aphids_per_plant"], table["action_threshold_aphids_per_plant"], out))

    def cmd_selftest(a):
        inputs = Y.load(a.inputs or INPUTS)
        co = coeff_scalars(inputs)
        v = float(inputs["price_snapshot"]["v_usd_bu"])
        c, i_d, k1 = co["management_cost_C"], co["damage_I_D"], co["k_tier1"]
        assert eil_of(c, v * 1.1, i_d, k1) < eil_of(c, v, i_d, k1), "EIL not decreasing in V"
        assert eil_of(c * 1.1, v, i_d, k1) > eil_of(c, v, i_d, k1), "EIL not increasing in C"
        t1 = derive_table(inputs)
        assert t1["action_threshold_aphids_per_plant"] < t1["eil_aphids_per_plant"], "AT must sit strictly below EIL"
        assert t1["tier_2_reachable_while_tier1_effective"] == (k1 < t1["k_floor_incremental"]), "tier-bar flag inconsistent"
        assert Y.dump(derive_table(Y.load(a.inputs or INPUTS))) == Y.dump(derive_table(Y.load(a.inputs or INPUTS))), "derive not byte-idempotent"
        c2 = co["management_cost_C_cross"]
        cross = abs(c - c2) / c
        assert cross <= a.cross_tolerance, "cost triangulation failed: C=%.2f vs C_cross=%.2f (%.1f%% apart)" % (c, c2, cross * 100.0)
        print("selftest ok: monotone in V and C, AT < EIL, tier-bar consistent, derive byte-idempotent, C triangulated within %.0f%%" % (a.cross_tolerance * 100.0))

    def cmd_verify(a):
        inputs_path = a.inputs or INPUTS
        table_path = a.table or TABLE
        manifest_path = a.manifest or MANIFEST
        derived_sha = hashlib.sha256(Y.dump(derive_table(Y.load(inputs_path))).encode("utf-8")).hexdigest()
        table_sha = sha256_file(table_path)
        inputs_sha = sha256_file(inputs_path)
        pinned_t, pinned_i = table_sha, inputs_sha
        if os.path.exists(manifest_path):
            man = json.load(open(manifest_path))
            pinned_t = man["files"]["specs/eil-table.yaml"]
            pinned_i = man["files"]["specs/eil-inputs.yaml"]
        match = (derived_sha == table_sha == pinned_t) and (inputs_sha == pinned_i)
        out = a.out or "run/verify.json"
        os.makedirs(os.path.dirname(out), exist_ok=True)
        json.dump({"instrument": "cli", "run_nonce": a.run_nonce or "",
                   "rederived_table_sha256": derived_sha,
                   "table_file_sha256": table_sha, "pinned_table_sha256": pinned_t,
                   "inputs_match_pin": inputs_sha == pinned_i, "match": match},
                  open(out, "w"), indent=2, sort_keys=True)
        print("verify: match=%s (rederived %s, pinned %s)" % (match, derived_sha[:12], pinned_t[:12]))
        if not match:
            sys.exit(3)

    def cmd_digest_ledger(a):
        print(ledger_digest(a.ledger))

    def cmd_scout(a):
        table = Y.load(a.table or TABLE)
        plan = table["sampling"]
        plants = int(plan["plants_per_pass"])
        interval = int(plan["pass_interval_days"])
        import datetime
        con = sqlite3.connect(a.ledger)
        rows = con.execute("select date, density, r_stage from days order by date").fetchall()
        meta = dict(con.execute("select key, value from metadata").fetchall())
        county = meta.get("county", "unknown")
        first = str(plan["first_pass_date"])
        passes, prev = [], "GENESIS"
        last_date = None
        for date, density, stage in rows:
            if date < first:
                continue
            if last_date is not None and (datetime.date.fromisoformat(date) - datetime.date.fromisoformat(last_date)).days < interval:
                continue
            rng = random.Random("scout:%s:%s:%d" % (county, date, a.seed))
            counts = []
            for _ in range(plants):
                counts.append(max(0, int(round(rng.gauss(density, max(1.0, density * 0.25))))))
            mean = round(sum(counts) / float(len(counts)), 2)
            base = {"pass": len(passes) + 1, "date": date, "plants": plants,
                    "mean_aphids_per_plant": mean, "r_stage": stage}
            payload = json.dumps(base, sort_keys=True)
            h = hashlib.sha256((prev + " " + payload).encode("utf-8")).hexdigest()
            rec = dict(base)
            rec["prev_hash"] = prev
            rec["hash"] = h
            passes.append(rec)
            prev = h
            last_date = date
        os.makedirs(os.path.dirname(a.out) or ".", exist_ok=True)
        with open(a.out, "w", encoding="utf-8") as fh:
            for p in passes:
                fh.write(json.dumps(p, sort_keys=True) + "\n")
        print("scout: %d passes, %d plants each, hash-chained -> %s" % (len(passes), plants, a.out))

    def cmd_verify_chain(a):
        table = Y.load(a.table or TABLE)
        plan = table["sampling"]
        prev = "GENESIS"
        n = 0
        for line in open(a.scout, encoding="utf-8"):
            rec = json.loads(line)
            base = dict((k, rec[k]) for k in ("pass", "date", "plants", "mean_aphids_per_plant", "r_stage"))
            want = hashlib.sha256((rec["prev_hash"] + " " + json.dumps(base, sort_keys=True)).encode("utf-8")).hexdigest()
            assert rec["prev_hash"] == prev, "chain break at pass %s" % rec.get("pass")
            assert rec["hash"] == want, "hash mismatch at pass %s" % rec.get("pass")
            assert int(rec["plants"]) == int(plan["plants_per_pass"]), "plant count drift at pass %s" % rec.get("pass")
            prev = rec["hash"]
            n += 1
        print("chain ok: %d append-only passes, plant counts match the frozen plan" % n)

    def cmd_verdict(a):
        table = Y.load(a.table or TABLE)
        manifest_path = a.manifest or MANIFEST
        t_sha = pinned_table_sha(a.table or TABLE, manifest_path)
        at = float(table["action_threshold_aphids_per_plant"])
        tier2 = bool(table["tier_2_reachable_while_tier1_effective"])
        con = sqlite3.connect(a.ledger)
        stages = dict(con.execute("select date, r_stage from days").fetchall())
        meta = dict(con.execute("select key, value from metadata").fetchall())
        con.close()
        year = int(table["effectivity"]["crop_year"])
        bad = sorted(d for d in stages if not str(d).startswith(str(year)))
        if bad:
            die("REFUSED: ledger dates outside the effectivity crop year %d: %s — the table does not govern this season" % (year, bad[:3]), 5)
        vpasses, final, decided = [], "not-yet", None
        for line in open(a.scout, encoding="utf-8"):
            rec = json.loads(line)
            st = str(stages.get(rec["date"], ""))
            num = int(st[1:]) if st.startswith("R") and st[1:].isdigit() else 0
            in_window = 1 <= num <= 5
            if rec["mean_aphids_per_plant"] >= at and in_window:
                act = "treat-tier-2" if tier2 else "treat-tier-1"
                final, decided = act, rec["date"]
            else:
                act = "not-yet"
            vpasses.append({"pass": rec["pass"], "date": rec["date"],
                            "mean_aphids_per_plant": rec["mean_aphids_per_plant"],
                            "r_stage": st, "action": act, "table_sha256": t_sha})
        out = a.out or "run/verdict.json"
        os.makedirs(os.path.dirname(out), exist_ok=True)
        json.dump({"instrument": "cli", "county": meta.get("county", "unknown"),
                   "action": final, "decided_at": decided, "table_sha256": t_sha,
                   "passes": vpasses}, open(out, "w"), indent=2, sort_keys=True)
        print("verdict: %s (obeyed table %s)" % (final, t_sha[:12]))

    def cmd_authorize(a):
        table = Y.load(a.table or TABLE)
        if a.tier == 2 and not bool(table["tier_2_reachable_while_tier1_effective"]):
            die("REFUSED: tier-2 (broad-spectrum) is barred while the incremental tier retains efficacy (k_tier1 >= k_floor) — conservation is an executable constraint, not prose", 4)
        receipt = {"instrument": "cli", "tier": a.tier, "authorized": True,
                   "table_sha256": sha256_file(a.table or TABLE)}
        os.makedirs(os.path.dirname(a.out) or ".", exist_ok=True)
        json.dump(receipt, open(a.out, "w"), indent=2, sort_keys=True)
        print("authorized tier %d -> %s" % (a.tier, a.out))

    def cmd_record_spray(a):
        receipt = json.load(open(a.receipt))
        if receipt.get("table_sha256") != sha256_file(a.table or TABLE):
            die("REFUSED: receipt does not bind the frozen table digest", 6)
        con = sqlite3.connect(a.ledger)
        con.execute("insert into spray_events(date, tier, receipt_sha) values (?, ?, ?)",
                    (a.date, a.tier, sha256_file(a.receipt)))
        con.commit()
        n = con.execute("select count(*) from spray_events").fetchone()[0]
        print("spray recorded: tier %d on %s (season total %d)" % (a.tier, a.date, n))

    def cmd_admit(a):
        table = Y.load(a.table or TABLE)
        counties = table["effectivity"]["counties"]
        if a.county not in counties:
            die("REFUSED: %r is outside the table's effectivity block (crop year %s, price pin %s, %d counties) — re-author the table visibly or admit a bounded county"
                % (a.county, table["effectivity"]["crop_year"],
                   table["effectivity"]["price_pin_date"], len(counties)), 5)
        print("admitted: %s" % a.county)

    def main():
        ap = argparse.ArgumentParser(prog="eil.py")
        sub = ap.add_subparsers(dest="cmd", required=True)
        p = sub.add_parser("check-coefficients"); p.add_argument("file"); p.set_defaults(fn=cmd_check_coefficients)
        p = sub.add_parser("fixture"); p.add_argument("--inputs"); p.add_argument("--published", type=float, default={{ published_eil }}); p.add_argument("--tolerance-pct", type=float, default={{ fixture_tolerance_pct }}); p.set_defaults(fn=cmd_fixture)
        p = sub.add_parser("derive"); p.add_argument("--inputs"); p.add_argument("--out"); p.set_defaults(fn=cmd_derive)
        p = sub.add_parser("selftest"); p.add_argument("--inputs"); p.add_argument("--cross-tolerance", type=float, default={{ cost_cross_tolerance_pct }} / 100.0); p.set_defaults(fn=cmd_selftest)
        p = sub.add_parser("verify"); p.add_argument("--inputs"); p.add_argument("--table"); p.add_argument("--manifest"); p.add_argument("--out"); p.add_argument("--run-nonce"); p.set_defaults(fn=cmd_verify)
        p = sub.add_parser("digest-ledger"); p.add_argument("--ledger", required=True); p.set_defaults(fn=cmd_digest_ledger)
        p = sub.add_parser("scout"); p.add_argument("--inputs"); p.add_argument("--table"); p.add_argument("--ledger", required=True); p.add_argument("--out", required=True); p.add_argument("--seed", type=int, default={{ run_seed }}); p.set_defaults(fn=cmd_scout)
        p = sub.add_parser("verify-chain"); p.add_argument("--table"); p.add_argument("--scout", required=True); p.set_defaults(fn=cmd_verify_chain)
        p = sub.add_parser("verdict"); p.add_argument("--table"); p.add_argument("--manifest"); p.add_argument("--ledger", required=True); p.add_argument("--scout", required=True); p.add_argument("--out"); p.set_defaults(fn=cmd_verdict)
        p = sub.add_parser("authorize-tier"); p.add_argument("--table"); p.add_argument("--tier", type=int, required=True); p.add_argument("--out", default="run/tier-receipt.json"); p.set_defaults(fn=cmd_authorize)
        p = sub.add_parser("record-spray"); p.add_argument("--table"); p.add_argument("--ledger", required=True); p.add_argument("--tier", type=int, required=True); p.add_argument("--date", required=True); p.add_argument("--receipt", required=True); p.set_defaults(fn=cmd_record_spray)
        p = sub.add_parser("admit-county"); p.add_argument("--table"); p.add_argument("--county", required=True); p.set_defaults(fn=cmd_admit)
        a = ap.parse_args()
        try:
            a.fn(a)
        except AssertionError as exc:
            die("FAIL: %s" % exc)

    if __name__ == "__main__":
        main()
    PY

    # ── weather.py — pin Open-Meteo archive bytes ONCE; GDD arithmetic with hand-verified fixtures ──
    cat > shed-wall/scripts/weather.py <<'PY'
    #!/usr/bin/env python3
    """weather.py — pin Open-Meteo archive bytes and compute GDD (stdlib only).
    GDD = max(0, (Tmax + Tmin)/2 - base). A failed fetch is a nonzero exit —
    never a zero-filled day (Partial Failure -> Exploit Failure as Signal)."""
    import argparse, hashlib, json, os, sys, urllib.parse, urllib.request

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--api", default="{{ weather_api }}")
        ap.add_argument("--latitude", type=float, default={{ latitude }})
        ap.add_argument("--longitude", type=float, default={{ longitude }})
        ap.add_argument("--timezone", default="{{ timezone }}")
        ap.add_argument("--start", default="{{ season_start }}")
        ap.add_argument("--end", default="{{ season_end }}")
        ap.add_argument("--gdd-base", type=float, default={{ gdd_base }})
        ap.add_argument("--url-override", default=None, help="tests only: stub server URL")
        ap.add_argument("--raw-out", required=True)
        ap.add_argument("--csv-out", required=True)
        ap.add_argument("--expect", action="append", default=[], help="date=gdd fixture, exact within 0.01")
        a = ap.parse_args()
        if a.url_override:
            url = a.url_override
        else:
            url = a.api + "?" + urllib.parse.urlencode({
                "latitude": a.latitude, "longitude": a.longitude,
                "start_date": a.start, "end_date": a.end,
                "temperature_unit": "fahrenheit", "timezone": a.timezone,
                "daily": "temperature_2m_max,temperature_2m_min"})
        req = urllib.request.Request(url, headers={"User-Agent": "shed-wall/1.0"})
        with urllib.request.urlopen(req, timeout=180) as r:
            body = r.read()
        if not body:
            print("FAIL: empty weather response")
            return 1
        os.makedirs(os.path.dirname(a.raw_out) or ".", exist_ok=True)
        with open(a.raw_out, "wb") as fh:
            fh.write(body)
        doc = json.loads(body.decode("utf-8"))
        daily = doc.get("daily") or {}
        times = daily.get("time") or []
        tmax = daily.get("temperature_2m_max") or []
        tmin = daily.get("temperature_2m_min") or []
        if not times or len(times) != len(tmax) or len(times) != len(tmin):
            print("FAIL: weather response missing complete daily arrays")
            return 1
        rows, cum = [], 0.0
        for i, date in enumerate(times):
            gdd = max(0.0, (float(tmax[i]) + float(tmin[i])) / 2.0 - a.gdd_base)
            cum += gdd
            rows.append((date, float(tmin[i]), float(tmax[i]), gdd, cum))
        os.makedirs(os.path.dirname(a.csv_out) or ".", exist_ok=True)
        with open(a.csv_out, "w", encoding="utf-8") as fh:
            fh.write("date,tmin_f,tmax_f,gdd,cum_gdd\n")
            for r in rows:
                fh.write("%s,%.1f,%.1f,%.2f,%.2f\n" % r)
        fails = []
        for spec in a.expect:
            date, _, want = spec.partition("=")
            got = [r[3] for r in rows if r[0] == date]
            if not got or abs(got[0] - float(want)) > 0.01:
                fails.append("%s: got %s want %s" % (date, got or "missing", want))
        if fails:
            print("FAIL: GDD fixtures: %s" % "; ".join(fails))
            return 1
        prev = -1.0
        for r in rows:
            if r[4] < prev - 1e-9:
                print("FAIL: cumulative GDD not monotone at %s" % r[0])
                return 1
            prev = r[4]
        print("weather pinned: %d days, response sha256 %s" % (len(rows), hashlib.sha256(body).hexdigest()[:12]))
        return 0

    if __name__ == "__main__":
        sys.exit(main())
    PY

    # ── fetch_price.sh — the EX-ANTE V pin: the HISTORICAL February close, verbatim bytes ──
    cat > shed-wall/scripts/fetch_price.sh <<'SH'
    #!/usr/bin/env bash
    # fetch_price.sh — pin the commodity value ONCE, as the HISTORICAL daily
    # close of the declared pre-season date. REVISION (reviewers 1+2): Yahoo
    # 429'd the original single-shot Chrome UA, so this sends Accept headers,
    # alternates two browser UAs across 4 backoff attempts, then hard-fails.
    # The pin is BYTES (verbatim response + extraction + sha256) and it is
    # IMMUTABLE — a retry re-fetches the same February candle. V outside the
    # declared range aborts. The last bar must be stamped on the pin date.
    set -euo pipefail
    PIN_DATE="{{ price_pin_date }}"
    # 7-day lookback so the window ALWAYS holds >=2 trading closes (weekends,
    # holidays); the LAST close in [pin-7d, pin+1d) is the pin date's own close.
    P1="$(date -u -d "$PIN_DATE 00:00:00 UTC - 7 days" +%s)"
    P2="$(date -u -d "$PIN_DATE 00:00:00 UTC + 1 day" +%s)"
    URL="${PRICE_URL_OVERRIDE:-https://query1.finance.yahoo.com/v8/finance/chart/{{ price_symbol }}?period1=${P1}&period2=${P2}&interval=1d}"
    OUT_DIR="${1:-.}"
    RESP="$OUT_DIR/price-response.json"
    CODE="000"
    for attempt in 1 2 3 4; do
      UA="{{ browser_ua }}"
      if [ "$attempt" -ge 3 ]; then UA="{{ fallback_ua }}"; fi
      CODE="$(curl -sSL -A "$UA" \
        -H "Accept: application/json,text/plain,*/*" \
        -H "Accept-Language: en-US,en;q=0.9" \
        -w '%{http_code}' -o "$RESP" "$URL" || true)"
      if [ "$CODE" = "200" ]; then break; fi
      sleep $((attempt * 6))
    done
    if [ "$CODE" != "200" ]; then
      echo "FAIL: HTTP $CODE from Yahoo after 4 attempts (two browser UAs, Accept headers, backoff) — a failed pin must abort, never zero-fill"
      exit 1
    fi
    CLOSES="$(jq -c '[.chart.result[0].indicators.quote[0].close[]? | select(. != null)]' "$RESP")"
    if [ "$(jq 'length' <<<"$CLOSES")" -lt 2 ]; then
      echo "FAIL: fewer than 2 daily closes in the pin window"
      exit 1
    fi
    CLOSE_C="$(jq '.[-1]' <<<"$CLOSES")"
    PREV_C="$(jq '.[-2]' <<<"$CLOSES")"
    TS="$(jq -r '.chart.result[0].timestamp | last' "$RESP")"
    TS_DATE="$(date -u -d @"$TS" +%F 2>/dev/null || echo unknown)"
    NEXT_DATE="$(date -u -d "$PIN_DATE + 1 day" +%F)"
    if [ "$TS_DATE" != "$PIN_DATE" ] && [ "$TS_DATE" != "$NEXT_DATE" ]; then
      echo "FAIL: last bar stamped $TS_DATE, expected $PIN_DATE (or +1d) — refusing a pin from the wrong day"
      exit 1
    fi
    if ! jq -e '. >= {{ price_floor_cents }} and . <= {{ price_ceiling_cents }}' <<<"$CLOSE_C" >/dev/null; then
      echo "FAIL: V=$CLOSE_C cents/bu outside [{{ price_floor_cents }}, {{ price_ceiling_cents }}] — a failed pin must abort, never zero-fill"
      exit 1
    fi
    SHA="$(sha256sum "$RESP" | cut -d' ' -f1)"
    NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    jq -n --argjson cents "$CLOSE_C" --argjson prev "$PREV_C" --arg sha "$SHA" --arg now "$NOW" --arg pdate "$PIN_DATE" \
      '{symbol: "{{ price_symbol }}", v_cents_bu: $cents, v_usd_bu: ($cents / 100),
        prev_close_cents_bu: $prev, price_date: $pdate, response_sha256: $sha, captured_at: $now}' > "$OUT_DIR/price-snapshot.json"
    echo "price pinned: $CLOSE_C cents/bu — the $PIN_DATE close (prev $PREV_C), response sha256 $SHA"
    SH

