    #!/usr/bin/env python3
    """reconstruct.py — seeded aphid-pressure reconstruction driven by pinned
    GDD. DECLARED MODELED DATA (specs/reconstruction-clause.txt): colonization
    at n0 on the declared date, GDD-scaled logistic growth calibrated by a
    deterministic two-pass so the season peak lands on the declared ABSOLUTE
    target (a survey envelope, never a table-relative value — the pressure
    counties declare 700, the mild counties 180), and an R-stage track from
    declared cumulative-GDD bands. --dump-equal proves content-reproducibility
    against a re-run; --check enforces the envelope."""
    import argparse, datetime, hashlib, math, os, random, sqlite3, sys
    sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
    import yamlmini as Y

    R_BANDS = [(0, "VE"), (300, "V4"), (700, "R1"), (1050, "R2"),
               (1250, "R3"), (1450, "R4"), (1600, "R5"), (1800, "R6")]

    def read_csv(path):
        rows = []
        for ln in open(path, encoding="utf-8").read().splitlines()[1:]:
            parts = ln.split(",")
            rows.append((parts[0], float(parts[3]), float(parts[4])))
        return rows

    def simulate(rows, n0, r_base, kmax, col_date):
        dens = dict()
        n, started = 0.0, False
        for date, gdd, cum in rows:
            if date < col_date:
                dens[date] = 0.0
                continue
            if not started:
                n, started = n0, True
            else:
                rate = r_base * min(1.0, gdd / 15.0)
                if kmax > 0:
                    n = n * math.exp(rate * (1.0 - n / kmax))
            dens[date] = n
        return dens

    def r_stage_for(cum):
        stage = "VE"
        for threshold, name in R_BANDS:
            if cum >= threshold:
                stage = name
        return stage

    def dump_of(path):
        con = sqlite3.connect(path)
        out = "\n".join(con.iterdump())
        con.close()
        return out

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--weather-csv")
        ap.add_argument("--inputs", default="shed-wall/specs/eil-inputs.yaml")
        ap.add_argument("--county", default="{{ first_article_county }}")
        ap.add_argument("--out-db")
        ap.add_argument("--seed", type=int, default={{ run_seed }})
        ap.add_argument("--target-peak", type=float, default={{ target_peak_aphids }})
        ap.add_argument("--n0", type=float, default={{ initial_density }})
        ap.add_argument("--colonization", default="{{ colonization_date }}")
        ap.add_argument("--clause", default="shed-wall/specs/reconstruction-clause.txt")
        ap.add_argument("--check", action="store_true")
        ap.add_argument("--dump-equal", nargs=2, metavar=("A", "B"))
        a = ap.parse_args()
        if a.dump_equal:
            sys.exit(0 if dump_of(a.dump_equal[0]) == dump_of(a.dump_equal[1]) else 7)
        inputs = Y.load(a.inputs)
        co = dict((c["name"], float(c["value"])) for c in inputs["coefficients"])
        r_base = co["growth_r_base"]
        rows = read_csv(a.weather_csv)
        dens1 = simulate(rows, a.n0, r_base, 500.0, a.colonization)
        peak1 = max(dens1.values()) or 1.0
        kmax = 500.0 * (a.target_peak / peak1)
        dens = simulate(rows, a.n0, r_base, kmax, a.colonization)
        peak = max(dens.values())
        if a.check:
            assert a.target_peak * 0.75 <= peak <= a.target_peak * 1.25, \
                "peak %.1f outside calibration envelope around %.1f" % (peak, a.target_peak)
            vals = [dens[d] for d in sorted(dens)]
            pi = vals.index(max(vals))
            assert all(vals[i] <= vals[i + 1] + 1e-9 for i in range(pi)), "density not monotone rising to peak"
            growth = [vals[i + 1] / vals[i] for i in range(len(vals) - 1) if vals[i] > 1.0]
            assert all(g <= math.exp(r_base * 1.05) for g in growth), "growth rate exceeds the published envelope"
            print("reconstruction check ok: peak %.1f (target %.1f), monotone rise, growth within envelope" % (peak, a.target_peak))
            return 0
        clause_sha = hashlib.sha256(open(a.clause, "rb").read()).hexdigest()
        out = a.out_db
        if os.path.exists(out):
            os.remove(out)
        con = sqlite3.connect(out)
        con.execute("pragma page_size=4096")
        con.execute("create table days(date text, gdd real, cum_gdd real, density real, r_stage text)")
        con.execute("create table spray_events(id integer primary key, date text, tier integer, receipt_sha text)")
        con.execute("create table metadata(key text primary key, value text)")
        for date, gdd, cum in rows:
            con.execute("insert into days values (?, ?, ?, ?, ?)",
                        (date, gdd, cum, round(dens[date], 2), r_stage_for(cum)))
        for k, v in (("county", a.county), ("seed", str(a.seed)),
                     ("target_peak_aphids", str(a.target_peak)), ("clause_sha256", clause_sha)):
            con.execute("insert into metadata values (?, ?)", (k, v))
        con.commit()
        con.close()
        print("ledger written: %d days, peak %.1f aphids/plant, county %s" % (len(rows), peak, a.county))
        return 0

    if __name__ == "__main__":
        sys.exit(main())
    PY

