    #!/usr/bin/env python3
    """accounting_check.py — independent recompute of one arm's accounting
    (stdlib only). Rebuilds every cost component from the arm's replay events +
    the pinned inputs + the ledger by a different code path than replay.py, and
    diffs. Two hands on the arithmetic, by rule (same-author seam acknowledged
    in the release notes: both scripts were authored in one heredoc; the check
    is a code-path separation, not a personnel separation)."""
    import argparse, json, os, sqlite3, sys
    sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
    import yamlmini as Y

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--arm", required=True)
        ap.add_argument("--replay", default=None)
        ap.add_argument("--ledger", default="run/season-ledger.sqlite")
        ap.add_argument("--inputs", default="shed-wall/specs/eil-inputs.yaml")
        a = ap.parse_args()
        path = a.replay or ("run/replay-%s.yaml" % a.arm)
        rep = json.load(open(path))
        inputs = Y.load(a.inputs)
        co = dict((c["name"], float(c["value"])) for c in inputs["coefficients"])
        v = float(inputs["price_snapshot"]["v_usd_bu"])
        i_d, k1, c_cost = co["damage_I_D"], co["k_tier1"], co["management_cost_C"]
        rp = inputs["replay"]
        scout_cost = float(rp["scout_pass_cost_usd_ac"])
        con = sqlite3.connect(a.ledger)
        rows = con.execute("select date, density, r_stage from days order by date").fetchall()
        con.close()
        sprays = [(s["date"], k1) for s in rep["sprays"]]
        spray_map = dict()
        for date, k in sprays:
            spray_map[date] = spray_map.get(date, 1.0) * (1.0 - k)
        f, aphid_days = 1.0, 0.0
        for date, density, stage in rows:
            if date in spray_map:
                f *= spray_map[date]
            aphid_days += density * f
        damage = i_d * aphid_days * v
        spray_cost = 0.0 if a.arm == "ladder" else len(sprays) * c_cost
        if a.arm == "calendar":
            scouting = 0.0
        elif a.arm == "ladder":
            rent = sum(scout_cost for e in rep["events"] if str(e.get("action", "")).startswith("scout-rent"))
            committed = any(str(e.get("action", "")) == "commit-prophylactic" for e in rep["events"])
            scouting = rent + (float(rp["ladder_B_usd_ac"]) if committed else 0.0)
        else:
            scouting = len(rep["events"]) * scout_cost
        want = rep["costs_usd_ac"]
        diffs = dict(scouting=abs(scouting - float(want["scouting"])),
                     spray=abs(spray_cost - float(want["spray"])),
                     damage_modeled=abs(damage - float(want["damage_modeled"])))
        bad = [k for k, x in diffs.items() if x > 0.005]
        total = scouting + spray_cost + damage
        if abs(total - float(want["total"])) > 0.01:
            bad.append("total")
        if bad:
            print("FAIL: %s accounting disagrees: %s (recomputed total %.2f vs %.2f)" % (a.arm, bad, total, want["total"]))
            return 1
        print("accounting ok: %s total %.2f USD/ac reproduced independently" % (a.arm, total))
        return 0

    if __name__ == "__main__":
        sys.exit(main())
    PY

