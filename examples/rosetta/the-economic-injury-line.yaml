    #!/usr/bin/env python3
    """stub_server.py — failure-mode stub: /http500 hard 500, /truncated 200
    with a cut-off JSON body (Content-Length lies), /ok control."""
    import sys
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.startswith("/http500"):
                self.send_response(500)
                self.end_headers()
                self.wfile.write(b"server error")
            elif self.path.startswith("/truncated"):
                body = b'{"chart": {"result": [{"meta": {"reg'
