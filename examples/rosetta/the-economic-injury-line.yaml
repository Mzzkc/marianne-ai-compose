    cat > shed-wall/scripts/replay.py <<'PY'
    #!/usr/bin/env python3
    """replay.py — one control arithmetic over the CLOSED ledger (stdlib only).
    Arms: eil | ladder | ema | calendar. REVISIONS (reviewer-2 kills 20-24):
      - the asserted ledger digest is LOGICAL (canonical dump of days+metadata,
        via eil.ledger_digest) — a treat-path spray event cannot break it;
      - the eil and ladder arms CONSUME the governed scout-ledger observations:
        identical evidence for every arm, no arm-seeded resampling;
      - the ema arm is CLOSED-LOOP — it observes its own mitigated world
        through the governed sampling process (county+date seeded), so churn
        is genuine delayed-feedback oscillation, demonstrated at pressure;
      - the ladder arm reports its actual break-even rule and an informational
        ratio vs the clairvoyant optimum. The 2-competitive framing is GONE:
        the season horizon is fixed, so that theorem's premise is absent.
    Damage is modeled yield loss = I_D * mitigated aphid-days/plant priced at
    the pinned V. Per-arm parameters come from the PINNED inputs file."""
    import argparse, datetime, json, os, random, sqlite3, sys
    sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
    import yamlmini as Y
    import eil

    def d(s):
        return datetime.date.fromisoformat(s)

    def in_window(stage):
        s = str(stage)
        return s.startswith("R") and s[1:].isdigit() and 1 <= int(s[1:]) <= 5

    def load_days(ledger):
        con = sqlite3.connect(ledger)
        rows = con.execute("select date, gdd, cum_gdd, density, r_stage from days order by date").fetchall()
        meta = dict(con.execute("select key, value from metadata").fetchall())
        con.close()
        return rows, meta

    def mitigate(rows, sprays, k):
        spray_map = dict()
        for date, eff in sprays:
            spray_map[date] = spray_map.get(date, 1.0) * (1.0 - eff)
        f, out = 1.0, []
        for date, gdd, cum, density, stage in rows:
            if date in spray_map:
                f *= spray_map[date]
            out.append((date, density * f, stage))
        return out

    def aphid_days(series):
        return sum(x[1] for x in series)

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--arm", required=True, choices=["eil", "ladder", "ema", "calendar"])
        ap.add_argument("--ledger", default="run/season-ledger.sqlite")
        ap.add_argument("--digest", default="run/ledger-digest.txt")
        ap.add_argument("--inputs", default="shed-wall/specs/eil-inputs.yaml")
        ap.add_argument("--table", default="shed-wall/specs/eil-table.yaml")
        ap.add_argument("--scout", default="run/scout-ledger.jsonl")
        ap.add_argument("--seed", type=int, default={{ run_seed }})
        ap.add_argument("--out", default=None)
        a = ap.parse_args()
        want = open(a.digest, encoding="utf-8").read().split()[0]
        got = eil.ledger_digest(a.ledger)
        if want != got:
            print("FAIL: logical ledger digest %s != recorded %s — this arm refuses a moved ledger" % (got[:12], want[:12]))
            return 8
        obs = []
        for line in open(a.scout, encoding="utf-8"):
            rec = json.loads(line)
            obs.append((rec["date"], float(rec["mean_aphids_per_plant"])))
        if not obs:
            print("FAIL: empty scout ledger — no observations to govern with")
            return 9
        inputs = Y.load(a.inputs)
        table = Y.load(a.table)
        co = dict((c["name"], float(c["value"])) for c in inputs["coefficients"])
        v = float(inputs["price_snapshot"]["v_usd_bu"])
        i_d, k1, c_cost = co["damage_I_D"], co["k_tier1"], co["management_cost_C"]
        rp = inputs["replay"]
        scout_cost = float(rp["scout_pass_cost_usd_ac"])
        at = float(table["action_threshold_aphids_per_plant"])
        eil_val = float(table["eil_aphids_per_plant"])
        rows, meta = load_days(a.ledger)
        county = meta.get("county", "unknown")
        dens_by = dict((r[0], r[3]) for r in rows)
        stage_by = dict((r[0], r[4]) for r in rows)

        sprays, events = [], []
        metrics = dict()
        scouting = 0.0
        if a.arm == "eil":
            last_spray = None
            for date, x in obs:
                scouting += scout_cost
                if x >= at and in_window(stage_by.get(date, "")) and \
                        (last_spray is None or (d(date) - d(last_spray)).days >= 14):
                    sprays.append((date, k1))
                    events.append(dict(date=date, action="treat-tier-1", sampled_mean=x))
                    last_spray = date
                else:
                    events.append(dict(date=date, action="not-yet", sampled_mean=x))
            metrics = dict(decisions="one-bit verdicts against the frozen AT on the governed scout observations",
                           retrigger_days=14, evidence="run/scout-ledger.jsonl (hash-chained, shared by all arms)")
        elif a.arm == "ladder":
            B = float(rp["ladder_B_usd_ac"])
            rent, committed, commit_date = 0.0, False, None
            for date, x in obs:
                rent += scout_cost
                events.append(dict(date=date, action="scout-rent", sampled_mean=x, cumulative_rent=round(rent, 2)))
                if not committed and rent >= B:
                    committed, commit_date = True, date
                    sprays.append((date, k1))
                    events.append(dict(date=date, action="commit-prophylactic", settlement_usd_ac=B, cumulative_rent=round(rent, 2)))
            scouting = rent + (B if committed else 0.0)
            opt = i_d * aphid_days(mitigate(rows, [], k1)) * v
            for date, x in obs:
                opt = min(opt, c_cost + i_d * aphid_days(mitigate(rows, [(date, k1)], k1)) * v)
            for cdate in str(rp["calendar_dates"]).split(","):
                cd = cdate.strip()
                if cd not in dens_by:
                    continue
                second = None
                for xdate in sorted(dens_by):
                    if abs((d(xdate) - d(cd)).days - 26) < 8:
                        second = xdate
                        break
                if second is not None:
                    opt = min(opt, 2 * c_cost + i_d * aphid_days(mitigate(rows, [(cd, k1), (second, k1)], k1)) * v)
            metrics = dict(settlement_B_usd_ac=B, committed=committed, commit_date=commit_date,
                           break_even_rule="commit when cumulative scouting rent >= B (the ski-rental break-even rule)",
                           ratio_definition="ladder total / clairvoyant optimum over {no action, single tier-1 at any observed pass date, calendar pair}; INFORMATIONAL — fixed horizon, so this is NOT a test of the 2-competitive bound",
                           clairvoyant_opt_usd_ac=round(opt, 2))
        elif a.arm == "ema":
            alpha = float(rp["ema_alpha"])
            e_val, churn, state_on, last_spray = None, 0, False, None
            mit, prev_x = 1.0, None
            for date, _governed in obs:
                if prev_x is not None:
                    e_val = prev_x if e_val is None else alpha * prev_x + (1.0 - alpha) * e_val
                scouting += scout_cost
                fires = (e_val is not None and e_val >= eil_val
                         and in_window(stage_by.get(date, ""))
                         and (last_spray is None or (d(date) - d(last_spray)).days >= 7))
                if fires and not state_on:
                    churn += 1
                    state_on = True
                elif not fires and state_on and e_val is not None and e_val < eil_val * 0.5:
                    churn += 1
                    state_on = False
                if fires:
                    sprays.append((date, k1))
                    mit *= (1.0 - k1)
                    events.append(dict(date=date, action="treat-reactive", ema=round(e_val, 2)))
                    last_spray = date
                else:
                    events.append(dict(date=date, action="idle", ema=(round(e_val, 2) if e_val is not None else None)))
                true_mit = dens_by.get(date, 0.0) * mit
                rng = random.Random("scout:%s:%s:%d" % (county, date, a.seed))
                prev_x = round(max(0.0, rng.gauss(true_mit, max(1.0, true_mit * 0.25))), 2)
            series_pre = mitigate(rows, sprays, k1)
            post = [x[1] for x in series_pre if sprays and x[0] >= sprays[0][0]]
            metrics = dict(ema_alpha=alpha, reactive_line="EIL", scout_lag_passes=1,
                           closed_loop="observations are the controller's OWN mitigated world, measured by the governed sampling process",
                           churn_transitions=churn,
                           overshoot_frac=round(max([0.0] + [(y - eil_val) / eil_val for y in post]), 3))
        elif a.arm == "calendar":
            for cdate in str(rp["calendar_dates"]).split(","):
                cd = cdate.strip()
                if cd in dens_by:
                    sprays.append((cd, k1))
                    events.append(dict(date=cd, action="calendar-pass", density=dens_by[cd]))
            metrics = dict(policy="fixed passes regardless of sampled density", scouting="none")
        series = mitigate(rows, sprays, k1)
        damage = i_d * aphid_days(series) * v
        spray_cost = 0.0 if a.arm == "ladder" else len(sprays) * c_cost
        total = scouting + spray_cost + damage
        if a.arm == "ladder":
            opt = float(metrics["clairvoyant_opt_usd_ac"])
            metrics["ratio_vs_clairvoyant"] = round(total / opt if opt > 0 else 0.0, 3)
        out = dict(arm=a.arm, county=county, ledger_sha256=got,
                   sprays=[dict(date=s[0], k=k1) for s in sprays],
                   events=events,
                   costs_usd_ac=dict(scouting=round(scouting, 2), spray=round(spray_cost, 2),
                                     damage_modeled=round(damage, 2), total=round(total, 2)),
                   metrics=metrics)
        path = a.out or ("run/replay-%s.yaml" % a.arm)
        os.makedirs(os.path.dirname(path) or ".", exist_ok=True)
        # JSON body under a .yaml name: JSON is valid YAML, this artifact is
        # machine-consumed only, and the validation battery reads it with jq
        with open(path, "w", encoding="utf-8") as fh:
            json.dump(out, fh, indent=2, sort_keys=True)
        print("replay %s: sprays=%d scouting=%.2f spray=%.2f damage=%.2f total=%.2f USD/ac"
              % (a.arm, len(sprays), scouting, spray_cost, damage, total))
        return 0

    if __name__ == "__main__":
        sys.exit(main())
    PY

