      python3 shed-wall/scripts/eil.py verify --out run/verify-post-review-{instance}.json --run-nonce "$(cat pin/run-nonce)"
      jq -e '.match == true' run/verify-post-review-{instance}.json
    condition: "stage == 11"
    stage: 2
    description: "Refusal probes RE-EXECUTED for all three forbidden classes (re-derive, tamper, out-of-block) with INSTANCE-ISOLATED paths (no fan-out collisions), plus the immune guard: the review left the workspace with custody still verified, nonce-bound"

  # ── Movement 12 · Review Adjudication (M7) — the fan-in ────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}
      jq -e '(.instances | length) == 3 and all(.instances[]; .refused >= 1 and .succeeded == 0)' review/adjudication.json
      jq -e '(.p0_findings | length) == 0' review/adjudication.json
      jq -e '.release_disposition == "stand"' review/adjudication.json
      jq -e --arg n "$(cat pin/run-nonce)" '.run_nonce == $n' review/adjudication.json
      test "$(wc -w < review/adjudication.md)" -ge 30
    condition: "stage == 12"
    stage: 1
    description: "THE FAN-IN HAS TEETH: three classes adjudicated, every class refused at least once, ZERO succeeded violations (a P0 would have failed the run at the movement itself — this re-proves it), nonce-bound, synthesis rendered"

  # ── Movement 13 · First Article Characterization (M8) ──────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}
      cp shed-wall/specs/reconstruction-clause.txt run/RECONSTRUCTION-CLAUSE.txt
      python3 shed-wall/scripts/manifest_runner.py --dir run
      python3 - <<'PY'
      import hashlib, json, sqlite3, subprocess, sys
      ch = json.load(open("reference/characterization.json"))
      checks = ch["checks"]
      assert len(checks) >= 6, "fewer than 6 keyed checks"
      REQUIRED = {"verdict-binds-pinned-digest", "ledger-digest-recorded", "scout-chain-verifies",
                  "weather-coverage-monotone", "verdict-action-enum", "clause-byte-carried"}
      keys = set(str(c.get("key")) for c in checks)
      assert REQUIRED <= keys, "mandated keys missing: %s" % sorted(REQUIRED - keys)
      for c in checks:
          assert c.get("key") and str(c.get("recompute_command", "")).strip(), "check missing key or recompute_command: %s" % c
      man = json.load(open("shed-wall/specs/SPEC-MANIFEST.json"))
      v = json.load(open("run/verdict.json"))
      digest = subprocess.run([sys.executable, "shed-wall/scripts/eil.py", "digest-ledger", "--ledger", "run/season-ledger.sqlite"],
                              capture_output=True, text=True).stdout.strip()
      n = sqlite3.connect("run/season-ledger.sqlite").execute("select count(*) from spray_events").fetchone()[0]
      f = ch["story_county_facts"]
      assert f["table_sha256"] == man["files"]["specs/eil-table.yaml"], "characterizer restated a foreign table digest"
      assert f["ledger_sha256"] == digest, "characterizer restated a foreign LOGICAL ledger digest"
      assert f["spray_events"] == n and f["final_action"] == v["action"], "characterizer restated facts that do not hold"
      print("characterization: %d keyed checks (6 mandated present); manifest runner passes on Story County; restated facts MEASURED true" % len(checks))
      PY
    condition: "stage == 13"
    stage: 1
    description: "The manifest EXECUTES (runner exit 0 on Story County, with the clause staged symmetrically with the volume counties), the six mandated keys are present, and the characterizer's restated facts are recomputed from bytes — self-report is not admission"
  - type: command_succeeds
    command: |
      cd {workspace}
      python3 - <<'PY'
      import json
      fam = json.load(open("pin/instrument-families.json"))
      ch = json.load(open("reference/characterization.json"))
      c_fam = fam["instruments"][ch["instrument"]]["family"]
      x_fam = fam["instruments"][fam["calibration_chain"]["extractor"]]["family"]
      assert c_fam != x_fam, "CALIBRATION FRAUD: characterizer family (%s) == authoring family (%s)" % (c_fam, x_fam)
      print("family separation holds: authoring %s / characterizer %s" % (x_fam, c_fam))
      PY
    condition: "stage == 13"
    stage: 2
    description: "DIFFERENT FAMILY, joined through the movement-1 probe of live conductor config: the characterizer is not the authoring hand — whatever the two families actually are"

  # ── Movement 14 · Volume Counties (M8, per instance) ───────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}
      NAME="$(jq -r ".counties[{instance} - 1].name" pin/deployment.json)"
      SLUG="$(jq -r ".counties[{instance} - 1].slug" pin/deployment.json)"
      PEAK="$(jq -r ".counties[{instance} - 1].target_peak" pin/deployment.json)"
      python3 shed-wall/scripts/eil.py admit-county --county "$NAME"
      python3 - "$SLUG" "$PEAK" <<'PY'
      import hashlib, json, sqlite3, sys
      slug, peak = sys.argv[1], float(sys.argv[2])
      d = "run/counties/" + slug
      pinned = json.load(open("shed-wall/specs/SPEC-MANIFEST.json"))["files"]["specs/eil-table.yaml"]
      v = json.load(open(d + "/verdict.json"))
      assert v["action"] in ("not-yet", "treat-tier-1", "treat-tier-2"), v["action"]
      assert v["table_sha256"] == pinned, "county verdict does not obey the frozen digest"
      assert all(p["table_sha256"] == pinned for p in v["passes"])
      import subprocess
      digest = subprocess.run(
          [sys.executable, "shed-wall/scripts/eil.py", "digest-ledger", "--ledger", d + "/season-ledger.sqlite"],
          capture_output=True, text=True).stdout.strip()
      assert open(d + "/ledger-digest.txt").read().split()[0] == digest, "county ledger digest stale"
      meta = dict(sqlite3.connect(d + "/season-ledger.sqlite").execute("select key, value from metadata").fetchall())
      assert abs(float(meta["target_peak_aphids"]) - peak) < 0.01, "county ran the wrong declared envelope"
      rows = sum(1 for _ in open(d + "/weather.csv")) - 1
      assert rows >= 130, "weather coverage too thin: %d days" % rows
      years = set(ln.split(",")[0][:4] for ln in open(d + "/weather.csv").read().splitlines()[1:])
      assert years == {"2026"}, "weather dates outside the effectivity crop year: %s" % sorted(years)
      clause = open("shed-wall/specs/reconstruction-clause.txt", "rb").read()
      assert open(d + "/RECONSTRUCTION-CLAUSE.txt", "rb").read() == clause, "clause not byte-carried"
      print("%s obeys the frozen digest at the declared %.0f peak; %d weather days in 2026; clause byte-carried" % (slug, peak, rows))
      PY
    condition: "stage == 14"
    stage: 1
    description: "SAME FROZEN DIGEST at volume, name/slug/envelope from deployment.json (no prompt-validation desync): admit gate passes, every verdict pass binds the pinned table, LOGICAL digest recorded, declared envelope honored, >=130 real weather days INSIDE the crop year, clause byte-carried"
  - type: command_succeeds
    command: |
      cd {workspace}
      SLUG="$(jq -r ".counties[{instance} - 1].slug" pin/deployment.json)"
      REPLAY="$(jq -r ".counties[{instance} - 1].replay" pin/deployment.json)"
      python3 shed-wall/scripts/manifest_runner.py --dir "run/counties/$SLUG"
      if [ "$REPLAY" = "true" ]; then
        for ARM in $(jq -r '.arms | join(" ")' pin/deployment.json); do
          python3 shed-wall/scripts/accounting_check.py --arm "$ARM" --replay "run/counties/$SLUG/replay-$ARM.yaml" --ledger "run/counties/$SLUG/season-ledger.sqlite"
          D="$(python3 shed-wall/scripts/eil.py digest-ledger --ledger "run/counties/$SLUG/season-ledger.sqlite")"
          jq -e --arg d "$D" '.ledger_sha256 == $d' "run/counties/$SLUG/replay-$ARM.yaml"
        done
        jq -e '.metrics.churn_transitions != null and .metrics.closed_loop != null' "run/counties/$SLUG/replay-ema.yaml"
      fi
    condition: "stage == 14"
    stage: 2
    description: "VOLUME ADMISSION IS THE RUNNER (depth-portable, mandated keys, denied verbs) — and on PRESSURE counties the four arms replay with independently-recomputed accounting and digest-asserted ledgers"

  # ── Movement 15 · County Synthesis (M8) ────────────────────────────────────
  - type: command_succeeds
    command: |
      cd {workspace}
      python3 - <<'PY'
      import json
      dep = json.load(open("pin/deployment.json"))
      sm = open("run/counties/summary.md", encoding="utf-8").read()
      for c in dep["counties"]:
          assert c["name"] in sm, "county missing from the synthesis: %s" % c["name"]
          assert c["slug"] in sm, "slug missing from the synthesis: %s" % c["slug"]
      pressure = [c for c in dep["counties"] if c.get("replay")]
      assert pressure, "no pressure counties configured — the crossing branch went unexercised"
      for c in pressure:
          for arm in dep["arms"]:
              assert sm.count("| %s | %s |" % (c["slug"], arm)) == 1, "pressure replay row missing: %s/%s" % (c["slug"], arm)
      assert "SEEDED" in sm, "the honesty clause is not carried into the synthesis"
      print("synthesis: %d counties, %d pressure counties with four-arm rows, clause carried" % (len(dep["counties"]), len(pressure)))
      PY
    condition: "stage == 15"
    stage: 1
    description: "The terminal fan-IN is real: every county (names from deployment.json) appears, pressure counties carry four-arm rows, the honesty clause travels — no private fragments"
  - type: command_succeeds
    command: |
      cd {workspace}
      TAG="$(jq -r .release_tag pin/deployment.json)"
      SITE="$(jq -r .site_url pin/deployment.json)"
      test "$(gh release view "$TAG" --json assets -q '.assets | length')" -ge 13
      gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "counties-summary.md"
      test "$(git -C shed-wall rev-parse HEAD)" = "$(git -C shed-wall rev-parse origin/main)"
      curl -sfL "$SITE/counties/" | grep -q "Warren"
      curl -sfL "$SITE/counties/" | grep -q "SEEDED"
    condition: "stage == 15"
    stage: 2
    description: "VOLUME REACHED THE PUBLIC ARTIFACT: counties-summary.md is a checksummed release asset (>=13 now — counted with a REAL test), the repo is pushed (HEAD == origin/main), and the LIVE /counties/ page serves the synthesis with the honesty clause"
