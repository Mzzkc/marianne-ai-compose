  template: |
    {# ══════════ Macros: the house style, defined once ══════════════════════ #}
    {% macro strict() %}set -euo pipefail
    cd "{{ workspace }}"{% endmacro %}

    {# The reconstruction clause lives ON DISK (specs/reconstruction-clause.txt,
       authored movement 1, embedded by scripts, grep-gated by validation).
       This macro only tells agents what it says — nobody retypes it. #}
