name: shed-wall
description: "The Economic Injury Line proof (revised) — Stern 1959's EIL = C/(V*I_D*K) computed before the 2026 season from a pinned HISTORICAL February soybean close (ex-ante gate enforced) and published damage coefficients, frozen under sha256, obeyed as one-bit verdicts for a reconstructed Story County season (skip is a first-class green exit), replayed under four control arithmetics over one digest-asserted ledger with shared scout observations, adversarially reviewed with a deterministic fan-in, characterized by a different model family, extended to six counties under pressure variation, and published as a live scouting-verdict tool plus county synthesis whose every number recomputes from served bytes."

# workspace: intentionally omitted — auto-managed at <workspace-root>/shed-wall (#58).
# The score never writes outside its workspace except the ONE heralded external
# effect: the public repo push + tagged release v2026.09 + Pages deploy at
# movement 10 (redeployed with the county synthesis at movement 15), gated
# gas-free on this run's own nonce-bound custody evidence.

instrument: claude-code
instrument_config:
  timeout_seconds: 1800

# Judgment movements WITHOUT a calibration role may fall back across vendors.
# The February extractor (2), the three review instances (14-16), and the
# first-article characterizer (18) pin EMPTY chains below — their vendor
# identity is load-bearing evidence; a fallback would collapse it silently.
instrument_fallbacks: [codex-cli]

movements:
  # ── M0 · Substrate commissioning ─────────────────────────────────────────────
  1:
    name: "The Tool Chain (M0)"
    instrument: cli            # Etiquette Law: the entire deterministic substrate
    instrument_fallbacks: []   # is heredoc-authored by CLI at run time; failure
    instrument_config:         # teeth are authored AND PROVEN here. This movement
      timeout_seconds: 1500    # also resolves mkdocs (tilde → PATH → local venv),
                               # mints the RUN NONCE, and materializes
                               # pin/deployment.json so validations never see an
                               # unexpandable prompt-variable placeholder
  # ── M1 · February: author-and-pin (the single serialization point) ───────────
  2:
    name: "February: Extraction (M1)"
    instrument: claude-code    # literature reading is genuine document
    instrument_fallbacks: []   # comprehension; output admitted ONLY through the
    instrument_config:         # CLI provenance gate (10 named coefficients, each
      timeout_seconds: 3600    # with a verbatim QUOTE; live cost triangulated),
                               # then proven by the anti-hallucination fixture
  3:
    name: "February: Pin + Freeze (M1)"
    instrument: cli            # Validity Window: weather pinned ONCE as verbatim
    instrument_fallbacks: []   # bytes; V pinned as the HISTORICAL 2026-02-13
    instrument_config:         # close (immutable — a retry cannot move it); the
      timeout_seconds: 1800    # EX-ANTE GATE refuses a pin that postdates the
                               # season; fixture -> derive -> FREEZE (claim incl.)
  # ── M2 · Verify + corruption self-test ──────────────────────────────────────
  4:
    name: "Verify + Gate Teeth (M2)"
    instrument: cli            # the run's SINGLE legal re-derivation, nonce-bound,
    instrument_fallbacks: []   # compared against the pin; then the teeth battery
    instrument_config:         # (corruption / admit / tier), each failing for its
      timeout_seconds: 900     # recorded reason — before any volume
  # ── M3 · The governed season ─────────────────────────────────────────────────
  5:
    name: "Season: Reconstruct, Scout, Verdict (M3)"
    instrument: cli            # Economic Injury Line runtime OBEY: seeded
    instrument_fallbacks: []   # reconstruction, bounded sampling (hash-chained
    instrument_config:         # JSONL), one-bit digest-bearing verdicts with a
      timeout_seconds: 1800    # crop-year tooth; the LOGICAL ledger digest is
                               # recorded here (survives treat-path sprays)
  6:
    name: "Treat | Skip (M3)"
    instrument: claude-code    # the executor's only decision IS the skip gate —
    instrument_fallbacks: [codex-cli]   # a jq expression over verdict.json; may
    instrument_config:         # fall back (no calibration role); executes only
      timeout_seconds: 900     # through authorize-tier + record-spray if
                               # authorized. Both branches now survive: the
                               # replay digest is logical, not file bytes
  # ── M4 · Four-arm replay on one ledger ───────────────────────────────────────
  7:
    name: "Four-Arm Replay (M4)"
    instrument: cli            # Frame Multiplication, executed: each arm runs
    instrument_fallbacks: []   # over the SAME digest-asserted closed ledger and
    instrument_config:         # the SAME scout-ledger observations (no arm-
      timeout_seconds: 1200    # seeded resampling); the EMA arm alone observes
                               # its own mitigated world (closed loop); per-arm
                               # $/ac recomputed by an INDEPENDENT script
  # ── M5 · Negative control ────────────────────────────────────────────────────
  8:
    name: "Negative Control (M5)"
    instrument: cli            # the PREREGISTERED claim (frozen inside the
    instrument_fallbacks: []   # inputs at movement 3): no spray event before
    instrument_config:         # the first threshold-crossing pass — proven by
      timeout_seconds: 900     # SQL. Also renders published-numbers.md; runs
                               # AFTER movement 7 (dependency 8: [7]) because
                               # the renderer reads all four replay files
  # ── M6 · Publication ─────────────────────────────────────────────────────────
  9:
    name: "The Bulletin (M6)"
    instrument: claude-code    # CULT: land-grant extension genre PROSE with a
    instrument_fallbacks: [codex-cli]   # single <!--NUMBERS-BLOCK--> placeholder;
    instrument_config:         # the numbers are stitched by CLI at movement 10,
      timeout_seconds: 1800    # so no LLM ever touches number bytes. May fall
                               # back; the numbers gate is mechanical
  10:
    name: "Publish: Release + Shed Wall (M6)"
    instrument: cli            # Proof-Carrying Artifact + Gas-Free Certificate:
    instrument_fallbacks: []   # stitch, build (RESOLVED mkdocs), refuse without
    instrument_config:         # THIS run's nonce-bound evidence, push repo +
      timeout_seconds: 2700    # release v2026.09 + Pages, then verify LIVE from
                               # served bytes
  # ── M7 · Adversarial review + fan-in ─────────────────────────────────────────
  11:
    name: "Adversarial Review (M7)"
    instrument: claude-code    # Red Team / Blue Team: three vendor families,
    instrument_fallbacks: []   # each attempting a forbidden-action class;
    instrument_config:         # evidence is the CAPTURED refusal exit code —
      timeout_seconds: 1800    # reviewer prose is never itself evidence. This
                               # fan-out is also the execution canary for the
                               # three configured families (empty chains)
  12:
    name: "Review Adjudication (M7)"
    instrument: cli            # THE FAN-IN: every class must show refusal
    instrument_fallbacks: []   # evidence; any verdict == "succeeded" is a P0 —
    instrument_config:         # the run FAILS here and a compensation runbook
      timeout_seconds: 600     # is written. The review has teeth: it can stop
                               # the score's own green
  # ── M8 · First article, volume, synthesis ────────────────────────────────────
  13:
    name: "First Article Characterization (M8)"
    instrument: codex-cli      # family != authoring family — an instrument
    instrument_fallbacks: []   # calibrating itself is not calibration. Selection
    instrument_config:         # of check statements is judgment; ADMISSION is
      timeout_seconds: 1800    # the manifest runner: six MANDATED keys,
                               # $SHED_WALL-absolute paths, shell-verb denylist
  14:
    name: "Volume Counties (M8)"
    instrument: cli            # Incremental Exposure with a real experimental
    instrument_fallbacks: []   # axis: four counties at the declared mild
    instrument_config:         # envelope, TWO at a declared PRESSURE envelope
      timeout_seconds: 1800    # (crossing season — the four arms replay there,
                               # so Hutchinson's churn actually churns). Every
                               # instance validated by the manifest runner
  15:
    name: "County Synthesis (M8)"
    instrument: cli            # the terminal fan-IN: six-county table rendered
    instrument_fallbacks: []   # from county products, published to the repo,
    instrument_config:         # the LIVE site (/counties/), and the release —
      timeout_seconds: 1500    # volume reaches the public artifact, not a
                               # private fragment

sheet:
  size: 1
  total_items: 15           # movements pre-expansion; engine expands to 25 sheets
  fan_out:
    7: 4                    # replay arms: eil / ladder / ema / calendar (sheets 7-10)
    11: 3                   # reviewers: three forbidden-action classes (sheets 14-16)
