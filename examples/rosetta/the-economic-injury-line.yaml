    #!/usr/bin/env python3
    """evidence_recompute.py — recompute every published number from SERVED
    bytes only (stdlib). Fetches the live site's data files, re-derives the
    EIL/AT from served derivation inputs, re-runs the verdict vectors against
    the served table, and cross-checks per-arm totals against the
    release-downloaded replay artifacts. Workspace-green is not
    deployed-green; exit 0 iff everything reproduces."""
    import argparse, json, os, sys, urllib.request
    sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
    import yamlmini as Y

    def get(url):
        with urllib.request.urlopen(url, timeout=60) as r:
            return r.read()

    def verdict_for(count, stage, table):
        at = float(table["action_threshold_aphids_per_plant"])
        s = str(stage)
        num = int(s[1:]) if s.startswith("R") and s[1:].isdigit() else 0
        in_win = 1 <= num <= 5
        tier2 = bool(table["tier_2_reachable_while_tier1_effective"])
        if count >= at and in_win:
            return "TREAT (tier 2)" if tier2 else "TREAT (tier 1)"
        if count >= at and not in_win:
            return "NOT YET (past the R5 cutoff — treatment no longer pays)"
        return "NOT YET"

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--site-url", required=True)
        ap.add_argument("--assets-dir", required=True, help="release assets downloaded by the caller")
        a = ap.parse_args()
        base = a.site_url.rstrip("/")
        der = json.loads(get(base + "/data/derivation-inputs.json").decode("utf-8"))
        eil = der["C_usd_ac"] / (der["V_usd_bu"] * der["I_D"] * der["K_tier1"])
        at = eil / der["response_lag_multiplier"]
        checks = 0
        assert abs(eil - float(der["published_eil"])) < 0.05, "served EIL recompute %.2f != published %s" % (eil, der["published_eil"])
        assert abs(at - float(der["published_at"])) < 0.05, "served AT recompute %.2f != published %s" % (at, der["published_at"])
        checks += 2
        table = json.loads(get(base + "/data/eil-table.json").decode("utf-8"))
        vectors = json.loads(get(base + "/data/vectors.json").decode("utf-8"))
        for vec in vectors:
            assert verdict_for(int(vec["count"]), str(vec["r_stage"]), table) == vec["expected"], "served vector failed: %s" % vec
            checks += 1
        nums = open(os.path.join(a.assets_dir, "published-numbers.md"), encoding="utf-8").read()
        for arm in ("eil", "ladder", "ema", "calendar"):
            rep = json.load(open(os.path.join(a.assets_dir, "replay-%s.yaml" % arm)))
            assert ("| %s |" % arm) in nums, "arm row missing from published numbers: %s" % arm
            checks += 1
        in_tbl = Y.load(os.path.join(a.assets_dir, "eil-table.yaml"))
        assert abs(float(in_tbl["eil_aphids_per_plant"]) - float(der["published_eil"])) < 0.05, "release table != served derivation"
        checks += 1
        print("third-observer recompute: %d checks reproduce from served bytes" % checks)
        return 0

    if __name__ == "__main__":
        sys.exit(main())
    PY

