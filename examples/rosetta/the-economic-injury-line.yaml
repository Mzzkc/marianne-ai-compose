    #!/usr/bin/env python3
    """manifest_runner.py — execute every keyed characterization check against
    a county's run products (exit 0 iff all pass). REVISIONS (reviewer-1 kill
    #3, reviewer-2 #38/#39): six keys are MANDATED by name; every command runs
    with $SHED_WALL (absolute corpus root) and $COUNTY_DIR in its environment;
    a command containing the literal ../shed-wall is REFUSED — the volume
    county depth trap is a rejected input, not a 3am bug; shell verbs outside
    the check vocabulary are denied. Characterization SELECTS statements;
    THIS script admits them — an instrument calibrating itself is not
    calibration."""
    import argparse, json, os, re, subprocess, sys

    REQUIRED_KEYS = ["verdict-binds-pinned-digest",
                     "ledger-digest-recorded",
                     "scout-chain-verifies",
                     "weather-coverage-monotone",
                     "verdict-action-enum",
                     "clause-byte-carried"]

    DENY = re.compile(r"(^|[\s;&|(])(rm|sudo|curl|wget|git|gh|pip|npm|mkdocs|chmod|chown)\b")

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--dir", required=True)
        ap.add_argument("--characterization", default="reference/characterization.json")
        a = ap.parse_args()
        ch = json.load(open(a.characterization))
        checks = ch.get("checks") or []
        if len(checks) < len(REQUIRED_KEYS):
            print("FAIL: characterization carries only %d keyed checks (<%d)" % (len(checks), len(REQUIRED_KEYS)))
            return 1
        keys = set(str(c.get("key", "")) for c in checks)
        missing = [k for k in REQUIRED_KEYS if k not in keys]
        if missing:
            print("FAIL: mandated keys missing: %s" % ", ".join(missing))
            return 1
        env = dict(os.environ)
        env["SHED_WALL"] = os.path.abspath(os.path.join(os.path.dirname(os.path.abspath(__file__)), ".."))
        env["COUNTY_DIR"] = os.path.abspath(a.dir)
        failed = []
        for chk in checks:
            key = str(chk.get("key", "?"))
            cmd = str(chk.get("recompute_command", "")).strip()
            if not cmd:
                failed.append((key, "no recompute_command"))
                continue
            if "../shed-wall" in cmd:
                failed.append((key, "relative ../shed-wall path — depth trap; use ${SHED_WALL}"))
                continue
            if DENY.search(cmd):
                failed.append((key, "denied shell verb in command"))
                continue
            r = subprocess.run(cmd, shell=True, cwd=a.dir, capture_output=True, text=True, env=env)
            if r.returncode != 0:
                failed.append((key, (r.stdout + r.stderr).strip()[:200]))
        if failed:
            for key, why in failed:
                print("FAIL: %s: %s" % (key, why))
            return 1
        print("manifest runner: %d keyed checks (6 mandated) pass against %s" % (len(checks), a.dir))
        return 0

    if __name__ == "__main__":
        sys.exit(main())
    PY

