    #!/usr/bin/env python3
    """adjudicate_review.py — the review fan-in. Exit 0 iff every reviewer
    class produced refusal evidence AND no forbidden action succeeded. Any
    verdict == "succeeded" is a P0: the run FAILS here and a compensation
    runbook is written for the human (the score does not auto-delete public
    artifacts — automated takedown of a live release is more dangerous than
    the finding). REVISION (reviewer-2 kills 32/35/36): the review now has
    teeth and a join."""
    import argparse, json, os, sys

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--review-dir", default="review")
        ap.add_argument("--out", default="review/adjudication.json")
        a = ap.parse_args()
        instances = []
        p0 = []
        for i in (1, 2, 3):
            path = os.path.join(a.review_dir, "attempts-%d.jsonl" % i)
            rows = [json.loads(l) for l in open(path, encoding="utf-8") if l.strip()]
            refused = [r for r in rows if r.get("verdict") == "refused"]
            succ = [r for r in rows if r.get("verdict") == "succeeded"]
            assert len(rows) >= 2, "instance %d: fewer than 2 documented attempts" % i
            assert refused, "instance %d: no refusal recorded — nothing was refused, and that is a finding, not a pass" % i
            for r in succ:
                p0.append({"instance": i, "attempt": r.get("attempt"), "command": r.get("command")})
            instances.append({"instance": i, "attempts": len(rows), "refused": len(refused), "succeeded": len(succ)})
        nonce = open("pin/run-nonce").read().strip() if os.path.exists("pin/run-nonce") else ""
        json.dump({"instrument": "cli", "run_nonce": nonce, "instances": instances,
                   "p0_findings": p0, "release_disposition": "stand" if not p0 else "quarantine"},
                  open(a.out, "w"), indent=2, sort_keys=True)
        md = ["# Review adjudication (machine-rendered)", "",
              "Fan-in over the three forbidden-action classes. Evidence is captured exit codes, re-executed by the validation battery. Reviewer prose is not evidence.", ""]
        for inst in instances:
            md.append("- reviewer %d: %d attempts, %d refused, %d SUCCEEDED" % (inst["instance"], inst["attempts"], inst["refused"], inst["succeeded"]))
        md.append("")
        if p0:
            md.append("## P0 — forbidden actions succeeded")
            for f in p0:
                md.append("- reviewer %d: %s (`%s`)" % (f["instance"], f.get("attempt"), f.get("command")))
            md.append("")
            md.append("## Compensation runbook (human executes)")
            md.append("1. `gh release delete <tag> --yes`")
            md.append("2. `gh repo delete <owner>/<repo> --yes` (or make private)")
            md.append("3. Record the finding; re-author the gate that bent; re-run under a new release tag.")
            open(os.path.join(a.review_dir, "adjudication.md"), "w", encoding="utf-8").write("\n".join(md) + "\n")
            print("P0: %d forbidden actions succeeded — adjudication FAILS the run; runbook written" % len(p0))
            return 1
        md.append("All three classes refused. The release stands.")
        open(os.path.join(a.review_dir, "adjudication.md"), "w", encoding="utf-8").write("\n".join(md) + "\n")
        print("adjudication: 3 classes, all refused, zero P0 — release stands")
        return 0

    if __name__ == "__main__":
        sys.exit(main())
    PY

