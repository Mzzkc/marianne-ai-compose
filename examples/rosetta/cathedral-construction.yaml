    ## Convergence Ledger — jq-sourced table of every iteration
      (churn_pct, maturity verdict, gates failed), plus convergence depth used.
    ## The Divergence Iteration — the recorded churn-low/maturity-FAIL row
      from divergence-report.json, quoted by iteration number.
    ## Depth & Chain Provenance — iterations consumed, terminator swap,
      instrument families from reports/instrument-families.json, and this
      concert's semantic-binding finding (WHS4_100 is DTP3 coverage, not
      life expectancy) and its correction at commissioning.
    ## What This Proof Did NOT Establish — teaching quality beyond its
      proxies (Flesch ≠ comprehension; graph closure ≠ a good teacher);
      the maturity index's blind spots, stated plainly.

    The report MUST end with these exact machine lines (they are validated
    against the live ledger — derive them with jq, never from memory):
        iterations_consumed: <jq '.iterations | length' build-ledger.json>
        divergence_iteration: <jq -r '.[0].iteration' divergence-report.json>
        churn_threshold_pct: {{ churn_threshold_pct }}
        edition: <first 12 hex of .blueprint_sha256>

    {{ quality_bar("standard") }}
    {% elif stage == 21 %}
    # T8 — Chain Terminator Swap
    # Deterministic termination: once converged AND delivered, the staged
    # chain copy becomes a validated one-sheet terminator. The job ends
    # COMPLETED; the concert simply has no next cycle. The issue-solver
    # "gate fails by design" idiom was rejected — it would mark a successful
    # run FAILED.
    set -euo pipefail
    WS="{{ workspace }}"
    if [ ! -f "$WS/.converged" ]; then echo "not converged — leaving chain intact"; exit 0; fi
    if [ ! -s "$WS/proof-report.md" ]; then echo "proof report absent — leaving chain intact"; exit 0; fi
    TMP="$WS/.terminator-candidate.yaml"
    cat > "$TMP" <<'EOFX'
    name: denominator-terminal
    description: Terminal absorber for the converged Denominator concert.
    instrument: cli
    instrument_fallbacks: []
    sheet:
      size: 1
      total_items: 1
    prompt:
      template: |
        set -euo pipefail
        echo "The Denominator converged and delivered; chain terminated by design." > "{{ '{{' }} workspace {{ '}}' }}/.chain-terminated"
    validations:
      - type: file_exists
        path: "{workspace}/.chain-terminated"
    EOFX
    mzt validate "$TMP" && mv "$TMP" "$WS/self-chain.yaml" || {
      echo "terminator candidate failed validation — chain left intact"; exit 1; }
    echo "chain terminator installed; the concert ends after this cycle."
    {{ etiquette_law("mzt validate before swap") }}
    {% endif %}

validations:
  # ── Sheet 1 · C1 scaffold + host/auth/family gates ─────────────────────────
  - type: file_exists
    path: "{workspace}/tools/check-host.sh"
    condition: "sheet_num == 1"
    description: "Host checker exists"
  - type: command_succeeds
    command: 'bash "{workspace}/tools/check-host.sh"'
    condition: "sheet_num == 1"
    stage: 2
    description: "Host gate RUNS: every named binary present AND gh authenticated (nonzero on any missing)"
  - type: command_succeeds
    command: 'bash "{workspace}/tools/check-host.sh" --self-test'
    condition: "sheet_num == 1"
    stage: 2
    description: "NEGATIVE CONTROL (rev 2): the checker proves it detects a bogus binary — a checker that cannot fail certifies nothing"
  - type: command_succeeds
    command: |-
      bash -c 'cd "{workspace}" && ORIGIN=$(cat .score-origin) && test "$(basename "$ORIGIN")" = "cathedral-construction.yaml" && test -f "$ORIGIN" && A=$(sha256sum self-chain.yaml | awk "{print \$1}") && B=$(sha256sum "$ORIGIN" | awk "{print \$1}") && test "$A" = "$B" && test -d .git'
    condition: "sheet_num == 1"
    stage: 2
    description: "Chain custody (rev 2): staged copy byte-identical to the recorded origin, origin basename correct, git repo initialized"
  - type: command_succeeds
    command: 'test -f "{workspace}/reports/instrument-families.json" && jq -e ''.assessor_family_distinct == true and .named["assessor-author"].ready == true'' "{workspace}/reports/instrument-families.json"'
    condition: "sheet_num == 1"
    stage: 2
    description: "FAMILY GATE (rev 2): live-registry probe shows the assessor family is READY and DISTINCT from the builder family — the load-bearing claim has a load-bearing gate"
  - type: command_succeeds
    command: 'cd "{workspace}" && git log --oneline | head -1 >/dev/null 2>&1 || test -d "{workspace}/.git"'
    condition: "sheet_num == 1"
    stage: 2
    description: "Workspace git repo present for churn diffs"

  # ── Sheet 2 · C2 data commissioning + semantic pin gate ───────────────────
  - type: file_exists
    path: "{workspace}/data/pins.yaml"
    condition: "sheet_num == 2"
    description: "Pin registry exists"
  - type: command_succeeds
    command: 'python3 "{workspace}/tools/pin_verify.py"'
    condition: "sheet_num == 2"
    stage: 2
    description: "Pin verifier RUNS fail-closed over all admitted bytes"
  - type: command_succeeds
    command: 'test $(wc -l < "{workspace}/data/raw/owid-life-expectancy.csv") -ge 1000'
    condition: "sheet_num == 2"
    stage: 2
    description: "OWID CSV row floor (live-verified 21,565 rows at composition)"
  - type: command_succeeds
    command: |-
      bash -c 'jq -e ''.value | length >= 500'' "{workspace}/data/raw/who-MORT_100.json" && jq -e ''.value | length >= 100'' "{workspace}/data/raw/who-MDG_0000000007.json" && jq -e ''.value | length >= 50'' "{workspace}/data/raw/who-WHS4_117.json" && jq -e ''.value | length >= 50'' "{workspace}/data/raw/who-WHS4_100.json"'
    condition: "sheet_num == 2"
    stage: 3
    description: "ALL FOUR WHO extracts carry real rows (rev 2: WHS4 floors added; live counts 672/280/66/66)"
  - type: command_succeeds
    command: |-
      bash -c 'grep -qi "deaths in children aged" "{workspace}/data/pins.yaml" && grep -qi "Under-five mortality rate" "{workspace}/data/pins.yaml" && grep -qi "Hepatitis B" "{workspace}/data/pins.yaml" && grep -qi "pertussis" "{workspace}/data/pins.yaml"'
    condition: "sheet_num == 2"
    stage: 3
    description: "Every semantic title recorded in pins — the WHS4_100 correction and the under-5 population match survive on disk"
  - type: command_succeeds
    command: 'jq -e ''[.value[].Dim3] | length >= 500'' "{workspace}/data/raw/who-MORT_100.json" >/dev/null && jq -e ''[.value[].Dim3] | unique | length >= 10'' "{workspace}/data/raw/who-MORT_100.json" >/dev/null'
    condition: "sheet_num == 2"
    stage: 3
    description: "MORT_100 carries the cause dimension the chapter-1 aggregation sums over (16 causes live-verified)"

  # ── Sheet 3 · C3 extracts + determinism ───────────────────────────────────
  - type: file_exists
    path: "{workspace}/data/extracts/manifest.json"
    condition: "sheet_num == 3"
    description: "Extract manifest exists"
  - type: command_succeeds
    command: 'cd "{workspace}" && uv run --with pandas --with numpy python scripts/recompute.py --check-determinism'
    condition: "sheet_num == 3"
    stage: 2
    description: "Determinism probe RUNS: double-extract digests identical"
  - type: command_succeeds
    command: 'cd "{workspace}" && uv run --with pandas --with numpy python scripts/recompute.py --check-fail-closed'
    condition: "sheet_num == 3"
    stage: 3
    description: "Fail-closed ordering probe RUNS: corrupted byte trips the pin gate before regeneration"
  - type: command_succeeds
    command: 'cd "{workspace}" && uv run --with pytest --with pandas --with numpy python -m pytest scripts/tests/test_extracts.py -q'
    condition: "sheet_num == 3"
    stage: 4
    description: "Extract invariant suite (independent in-test recomputation)"
  - type: content_contains
    path: "{workspace}/scripts/tests/test_extracts.py"
    pattern: "data/raw"
    condition: "sheet_num == 3"
    stage: 4
    description: "REV 2: the independent-oracle test reads RAW bytes, not the extracts it polices"

  # ── Sheet 4 · C4 harness + toolchain ──────────────────────────────────────
  - type: file_exists
    path: "{workspace}/harness/run_exercises.py"
    condition: "sheet_num == 4"
    description: "Exercise grader exists"
  - type: file_exists
    path: "{workspace}/harness/band_check.py"
    condition: "sheet_num == 4"
    description: "REV 2: band checker exists at commissioning, not discovered at the loop edge"
  - type: file_exists
    path: "{workspace}/tools/provenance_join.py"
    condition: "sheet_num == 4"
    description: "REV 2: provenance joiner exists at commissioning"
  - type: file_exists
    path: "{workspace}/tools/verify_gate.sh"
    condition: "sheet_num == 4"
    description: "REV 2: the L4 composition exists at commissioning"
  - type: file_exists
    path: "{workspace}/tools/cache_check.py"
    condition: "sheet_num == 4"
    description: "REV 2: the cache tool exists with its consumer contract"
  - type: file_exists
    path: "{workspace}/harness/question-bank.yaml"
    condition: "sheet_num == 4"
    description: "REV 2: seed question bank exists"
  - type: file_exists
    path: "{workspace}/harness/tolerances.yaml"
    condition: "sheet_num == 4"
    description: "REV 2: tolerance registry pre-registered with the harness"
  - type: command_succeeds
    command: 'cd "{workspace}" && uv run --with pytest --with pyyaml --with pandas python harness/run_exercises.py --self-test'
    condition: "sheet_num == 4"
    stage: 2
    description: "Grader mutation-calibrates: sound fixture GREEN AND corrupted fixture RED"
  - type: command_succeeds
    command: 'cd "{workspace}" && uv run --with genanki --with pyyaml python deck/build_deck.py --self-test'
    condition: "sheet_num == 4"
    stage: 3
    description: "Deck compiler self-test: fixture bank round-trips as zip"
  - type: command_succeeds
    command: 'test -f "{workspace}/.harness-calibrated"'
    condition: "sheet_num == 4"
    stage: 4
    description: "Calibration marker written (thresholds frozen)"

  # ── Sheet 5 · C5 blueprint freeze ─────────────────────────
  - type: file_exists
    path: "{workspace}/cathedral/blueprint.yaml"
    condition: "sheet_num == 5"
    description: "Blueprint frozen"
  - type: file_exists
    path: "{workspace}/cathedral/voice-canon.md"
    condition: "sheet_num == 5"
    description: "Voice canon frozen"
  - type: command_succeeds
    command: 'python3 "{workspace}/tools/blueprint_check.py" --slate 11'
    condition: "sheet_num == 5"
    stage: 2
    description: "REV 2: slate check is YAML-owned (the column-zero grep false-failed valid nested layouts); schema + DAG acyclicity + prerequisite closure + exactly 11 chapters"
  - type: command_succeeds
    command: |-
      bash -c 'cd "{workspace}" && L=$(jq -r .blueprint_sha256 build-ledger.json) && A=$(sha256sum cathedral/blueprint.yaml | awk "{print \$1}") && test "$L" = "$A"'
    condition: "sheet_num == 5"
    stage: 3
    description: "REV 2: the ledger digest EQUALS the live blueprint bytes — a stale or hand-edited digest is caught, not just a missing one"
  - type: command_succeeds
    command: 'jq -e ''(.blueprint_sha256 | length) == 64'' "{workspace}/build-ledger.json"'
    condition: "sheet_num == 5"
    stage: 3
    description: "Ledger born with the blueprint digest"

  # ── Sheet 6 · C6 assessor authorship + calibration ────────────────────────
  - type: file_exists
    path: "{workspace}/tools/maturity_assessor.py"
    condition: "sheet_num == 6"
    description: "Maturity assessor exists"
  - type: file_exists
    path: "{workspace}/tools/thresholds.yaml"
    condition: "sheet_num == 6"
    description: "Pre-registered thresholds exist"
  - type: command_succeeds
    command: 'python3 "{workspace}/tools/maturity_assessor.py" --calibrate'
    condition: "sheet_num == 6"
    stage: 2
    description: "Assessor calibrates BOTH directions: mature fixture PASSES, shallow fixture FAILS"
  - type: command_succeeds
    command: 'test -f "{workspace}/tools/assessor-lineage.json" && jq -e ''.distinct == true'' "{workspace}/tools/assessor-lineage.json"'
    condition: "sheet_num == 6"
    stage: 2
    description: "REV 2: assessor lineage JOINED on disk — the family separation is a recorded, checkable fact, not an assertion"
  - type: command_succeeds
    command: |-
      bash -c 'cd "{workspace}" && L=$(jq -r .assessor_family tools/assessor-lineage.json) && F=$(jq -r .default_family reports/instrument-families.json) && test "$L" != "$F"'
    condition: "sheet_num == 6"
    stage: 2
    description: "REV 2: the assessor family in the lineage record is distinct from the builder family in the C1 registry probe"
  - type: command_succeeds
    command: 'jq -e ''(.thresholds_sha256 | length) == 64'' "{workspace}/build-ledger.json"'
    condition: "sheet_num == 6"
    stage: 3
    description: "Thresholds digest recorded — later edits are visible events"
  - type: command_succeeds
    command: 'test -f "{workspace}/.assessor-calibrated"'
    condition: "sheet_num == 6"
    stage: 4
    description: "Calibration marker written"

  # ── Sheet 7 · C7 meters ───────────────────────────────────────────────────
  - type: command_succeeds
    command: 'test -x "{workspace}/tools/churn.sh" -a -x "{workspace}/tools/chain_control.sh" -a -f "{workspace}/tools/cache_check.py"'
    condition: "sheet_num == 7"
    description: "Meters exist and are executable"
  - type: command_succeeds
    command: 'bash "{workspace}/tools/churn.sh" --self-test'
    condition: "sheet_num == 7"
    stage: 2
    description: "Churn meter proves verdicts on synthetic tree pairs INCLUDING the empty-history first cycle"
  - type: command_succeeds
    command: 'python3 "{workspace}/tools/cache_check.py" --self-test'
    condition: "sheet_num == 7"
    stage: 3
    description: "Cache live-invalidation probe: injected pin change forces the miss; unchanged green stays skipped"
  - type: command_succeeds
    command: 'bash "{workspace}/tools/chain_control.sh" --self-test'
    condition: "sheet_num == 7"
    stage: 4
    description: "Chain control proves CONVERGED / CONTINUE / FAILED_CONVERGENCE branches AND detects a tampered ledger row"
  - type: command_succeeds
    command: 'test -f "{workspace}/.meters-proven"'
    condition: "sheet_num == 7"
    stage: 5
    description: "Meters marker written"

  # ── Sheet 8 · L1 plan-iteration ───────────────────────────────────────────
  - type: command_succeeds
    command: 'test -s "{workspace}/plan.md"'
    condition: "sheet_num == 8"
    description: "Plan exists and is non-empty (output path named in the prompt — rev 2)"
  - type: command_succeeds
    command: 'grep -qE ''^(PLAN|REWORK):'' "{workspace}/plan.md"'
    condition: "sheet_num == 8"
    stage: 2
    description: "Plan carries its machine line (PLAN: or REWORK:)"
  - type: command_succeeds
    command: |-
      bash -c 'cd "{workspace}" && if ! grep -q "^REWORK:" plan.md; then exit 0; fi; grep -E "^REWORK:.*(chapter-[0-9]+ §|gate:)" plan.md >/dev/null || { echo "WASTE-GUARD BYPASS: REWORK carries no finding or gate citation"; exit 1; }'
    condition: "sheet_num == 8"
    stage: 2
    description: "REV 2: a REWORK line MUST cite a FINDING (chapter-NN §…) or a failed gate (gate:…) — the generic-REWORK bypass is closed"
  - type: command_succeeds
    command: |-
      bash -c 'cd "{workspace}" && if grep -q "^REWORK:" plan.md; then exit 0; fi;
      planned=$(grep -oE "chapter-[0-9]+" plan.md | sort -u);
      test -n "$planned" || exit 1;
      for c in $planned; do
        jq -e --arg c "$c" ''(.verified // []) | index($c) | not'' build-ledger.json >/dev/null && exit 0;
      done;
      echo "WASTE GUARD: plan re-drafts only verified-and-cached chapters without a REWORK cause"; exit 1'
    condition: "sheet_num == 8"
    stage: 3
    description: "Waste guard: the increment touches un-done work or carries a cause"

  # ── Sheet 9 · L2 build ────────────────────────────────────────────────────
  - type: command_succeeds
    command: |-
      bash -c 'cd "{workspace}" && planned=$(grep -oE "chapter-[0-9]+" plan.md | sort -u);
      test -n "$planned" || exit 1;
      for c in $planned; do
        f="cathedral/chapters/$c.md";
        test -s "$f" || { echo "missing $f"; exit 1; };
        grep -q "{num:" "$f" || { echo "no provenance anchor in $f"; exit 1; };
        test $(wc -w < "$f") -ge 800 || { echo "$f below word floor"; exit 1; };
      done'
    condition: "sheet_num == 9"
    description: "Every planned chapter exists, carries anchors, and has substance"
  - type: command_succeeds
    command: |-
      bash -c 'cd "{workspace}" && planned=$(grep -oE "chapter-[0-9]+" plan.md | sort -u);
      changed=$(git status --porcelain -- cathedral/chapters/ | awk "{print \$NF}" | sed "s|cathedral/chapters/||; s|\.md$||" | sort -u);
      for c in $changed; do
        echo "$planned" | grep -qx "$c" || { echo "UNPLANNED CHAPTER TOUCHED: $c (not in plan.md)"; exit 1; };
      done'
    condition: "sheet_num == 9"
    stage: 2
    description: "REV 2: build scope is git-audited — only planned chapters changed under cathedral/ (added OR modified)"

  # ── Sheet 10 · L3 inspect ─────────────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/inspection-report.md"
    condition: "sheet_num == 10"
    description: "Inspection report exists"
  - type: command_succeeds
    command: 'bash -c ''grep -qE "^FINDING: chapter-[0-9]+ §" "{workspace}/inspection-report.md" || grep -q "^INTEGRATION: PASS" "{workspace}/inspection-report.md"'''
    condition: "sheet_num == 10"
    stage: 2
    description: "Specificity gate: cited findings or an explicit integration pass"
  - type: command_succeeds
    command: |-
      bash -c 'cd "{workspace}" && if ! grep -q "^INTEGRATION: PASS" inspection-report.md; then exit 0; fi;
      planned=$(grep -oE "chapter-[0-9]+" plan.md | sort -u);
      test -n "$planned" || exit 1;
      for c in $planned; do
        grep -q "$c" inspection-report.md || { echo "PASS line does not account for planned chapter $c — boilerplate pass"; exit 1; };
      done'
    condition: "sheet_num == 10"
    stage: 2
    description: "REV 2: an INTEGRATION: PASS must name every planned chapter — a generic pass that could describe anything fails"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/inspection-report.md") -ge 150'
    condition: "sheet_num == 10"
    stage: 2
    description: "Inspection has substantive content"

  # ── Sheet 11 · L4 verify-gate (red-tolerant) ───────────────────────────────
  - type: command_succeeds
    command: 'test -s "{workspace}/gate-report.json" && jq -e ''.checks | length >= 5'' "{workspace}/gate-report.json"'
    condition: "sheet_num == 11"
    description: "REV 2: the typed gate report is the sheet's contract — verify-gate RAN and enumerated its sub-checks (a red sub-check is a recorded verdict, not a dead concert)"
  - type: command_succeeds
    command: 'jq -e ''has("cache_skipped")'' "{workspace}/gate-report.json"'
    condition: "sheet_num == 11"
    stage: 2
    description: "REV 2: the report names which chapters were legitimately cache-skipped — the cache's work-avoidance is visible, not decorative"

  # ── Sheet 12 · L5 convergence-check (verdict survives) ─────────────────────
  - type: command_succeeds
    command: 'bash -c ''bash "{workspace}/tools/churn.sh" "{workspace}"; rc=$?; test $rc -le 1'''
    condition: "sheet_num == 12"
    description: "Churn meter RUNS and returns a verdict (0 converged / 1 not), not a crash"
  - type: command_succeeds
    command: 'test -s "{workspace}/churn-report.json" && jq -e ''(.churn_pct == null) or ((.churn_pct | type) == "number")'' "{workspace}/churn-report.json"'
    condition: "sheet_num == 12"
    stage: 2
    description: "Churn report carries the number (or the explicit first-cycle null), not a paraphrase"
  - type: command_succeeds
    command: 'jq -e ''(.first_cycle == true and .churn_pct == null) or (.first_cycle != true and (.churn_pct | type) == "number")'' "{workspace}/churn-report.json"'
    condition: "sheet_num == 12"
    stage: 2
    description: "First cycles declare themselves (first_cycle:true with null pct) instead of impersonating a measured verdict"

  # ── Sheet 13 · L6 maturity + chain control ────────────────────────────────
  - type: command_succeeds
    command: 'bash -c ''python3 "{workspace}/tools/maturity_assessor.py" --workspace "{workspace}"; rc=$?; test $rc -le 1'''
    condition: "sheet_num == 13"
    description: "Assessor RUNS and returns a verdict, not a crash"
  - type: command_succeeds
    command: 'test -s "{workspace}/maturity-report.json" && jq -e ''.gates | length >= 6'' "{workspace}/maturity-report.json"'
    condition: "sheet_num == 13"
    stage: 2
    description: "Per-gate enumeration so a FAIL is diagnosable (Andon)"
  - type: command_succeeds
    command: 'jq -e ''.iterations | length >= 1'' "{workspace}/build-ledger.json"'
    condition: "sheet_num == 13"
    stage: 3
    description: "Ledger row appended for this cycle by chain control"

  # ── Sheet 14 · T1 divergence audit ────────────────────────────────────────
  - type: command_succeeds
    command: 'jq -e ''[.iterations[] | select(.churn_converged == true and .maturity_pass == false)] | length >= 1'' "{workspace}/build-ledger.json"'
    condition: "sheet_num == 14"
    description: "DIVERGENCE CLAUSE: a churn-low/maturity-FAIL row exists — or the run fails its own hypothesis"
  - type: command_succeeds
    command: 'test -s "{workspace}/divergence-report.json"'
    condition: "sheet_num == 14"
    stage: 2
    description: "Divergence record written"
  - type: command_succeeds
    command: 'jq -e ''. as $d | all(.iterations[]; .thresholds_sha256 == $d.thresholds_sha256)'' "{workspace}/build-ledger.json"'
    condition: "sheet_num == 14"
    stage: 2
    description: "REV 2 anti-manufacturing: EVERY iteration row was judged under the SAME pre-registered thresholds digest as the ledger's"
  - type: command_succeeds
    command: 'jq -e ''[.iterations[].iteration] as $i | ($i | length) == ($i | unique | length) and ($i | sort) == [range(1; (($i | max) + 1))]'' "{workspace}/build-ledger.json"'
    condition: "sheet_num == 14"
    stage: 2
    description: "REV 2 anti-manufacturing: iteration numbers are strictly sequential 1..N — no spliced or skipped cycles"

  # ── Sheet 15 · T2 mkdocs site ─────────────────────────────────────────────
  - type: command_succeeds
    command: 'mkdocs build --strict -f "{workspace}/site-src/mkdocs.yml" -d "{workspace}/site"'
    condition: "sheet_num == 15"
    description: "Strict site build RUNS (broken links/missing assets are failures)"
  - type: command_succeeds
    command: 'python3 "{workspace}/tools/blueprint_check.py" --nav-check "{workspace}/site-src/mkdocs.yml"'
    condition: "sheet_num == 15"
    stage: 2
    description: "REV 2: nav order equals the blueprint prerequisite order — navigation embodies pedagogy, mechanically"
  - type: command_succeeds
    command: |-
      bash -c 'cd "{workspace}" && E=$(jq -r .blueprint_sha256 build-ledger.json | cut -c1-12) && grep -q "Edition: $E" site/index.html'
    condition: "sheet_num == 15"
    stage: 2
    description: "REV 2: the built index carries this build's edition stamp — the wire smoke has something true to check"
  - type: command_succeeds
    command: 'bash -c ''! grep -rnE "!\[[[:space:]]*\]\(" "{workspace}/site-src/docs/"'''
    condition: "sheet_num == 15"
    stage: 2
    description: "No chart image without alt text"
  - type: command_succeeds
    command: 'cd "{workspace}" && uv run --with textstat python harness/band_check.py --rendered "{workspace}/site"'
    condition: "sheet_num == 15"
    stage: 3
    description: "Reading band re-asserted on RENDERED text"

  # ── Sheet 16 · T3 deck ────────────────────────────────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && uv run --with genanki --with pyyaml python deck/build_deck.py --workspace "{workspace}" --output "{workspace}/deck/denominator.apkg"'
    condition: "sheet_num == 16"
    description: "Deck build RUNS (deterministic IDs — rebuild is stable)"
  - type: command_succeeds
    command: 'cd "{workspace}" && uv run --with genanki --with pyyaml python deck/build_deck.py --workspace "{workspace}" --verify "{workspace}/deck/denominator.apkg"'
    condition: "sheet_num == 16"
    stage: 2
    description: "Bijection gate + .apkg zip round-trip against the bank"
  - type: command_succeeds
    command: 'test -s "{workspace}/deck/denominator.apkg"'
    condition: "sheet_num == 16"
    stage: 3
    description: "Deck artifact non-empty"

  # ── Sheet 17 · T4 provenance page ─────────────────────────────────────────
  - type: command_succeeds
    command: 'python3 "{workspace}/tools/provenance_join.py" --check --workspace "{workspace}"'
    condition: "sheet_num == 17"
    description: "Zero unresolved anchors; N random rows re-derived live from the pin"
  - type: command_succeeds
    command: 'test -s "{workspace}/site-src/docs/provenance.md" && mkdocs build --strict -f "{workspace}/site-src/mkdocs.yml" -d "{workspace}/site"'
    condition: "sheet_num == 17"
    stage: 2
    description: "Provenance page exists and is inside a strict-rebuilt site"

  # ── Sheet 18 · T5 publish + wire smoke ────────────────────────────────────
  - type: command_succeeds
    command: 'jq -e ''.pages_http_200 == true and .asset_bytes > 0 and .asset_fetch_ok == true and .edition_stamp_found == true'' "{workspace}/live-smoke.json"'
    condition: "sheet_num == 18"
    description: "Typed wire-smoke record: Pages 200, asset bytes > 0, end-to-end fetch, and the SERVED edition stamp matches this build"
  - type: command_succeeds
    command: |-
      bash -c 'cd "{workspace}" && URL=$(jq -r .pages_url live-smoke.json) && TITLE=$(jq -r .course_title live-smoke.json) && E=$(jq -r .edition live-smoke.json) && curl -sfL "$URL" -o /tmp/independent-probe.html && grep -q "$TITLE" /tmp/independent-probe.html && grep -q "Edition: $E" /tmp/independent-probe.html'
    condition: "sheet_num == 18"
    stage: 2
    description: "REV 2: independent live probe reads URL/title/stamp FROM THE ARTIFACT — fully repointable (no hardcoded author URL), and it cannot pass against someone else's website because the edition stamp must match this ledger"

  # ── Sheet 19 · T6 two-path install ────────────────────────────────────────
  - type: command_succeeds
    command: 'jq -e ''.digests_equal == true and (.validated == ["ok", "ok"])'' "{workspace}/two-path-report.json"'
    condition: "sheet_num == 19"
    description: "Both installed copies byte-identical and mzt-validated from their own paths"
  - type: command_succeeds
    command: 'test -s "{workspace}/two-path-report.json"'
    condition: "sheet_num == 19"
    stage: 2
    description: "Install report exists"

  # ── Sheet 20 · T7 proof write-up ──────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/proof-report.md"
    condition: "sheet_num == 20"
    description: "Proof report exists"
  - type: content_contains
    path: "{workspace}/proof-report.md"
    pattern: "## Convergence Ledger"
    condition: "sheet_num == 20"
    stage: 2
    description: "Ledger section present"
  - type: content_contains
    path: "{workspace}/proof-report.md"
    pattern: "## The Divergence Iteration"
    condition: "sheet_num == 20"
    stage: 2
    description: "Divergence section present"
  - type: content_contains
    path: "{workspace}/proof-report.md"
    pattern: "## What This Proof Did NOT Establish"
    condition: "sheet_num == 20"
    stage: 2
    description: "Honesty section present — the report names its own limits"
  - type: command_succeeds
    command: |-
      bash -c 'cd "{workspace}" && N=$(jq ".iterations | length" build-ledger.json) && grep -q "iterations_consumed: $N" proof-report.md'
    condition: "sheet_num == 20"
    stage: 3
    description: "REV 2 ledger join: the reported iteration count EQUALS the live ledger value"
  - type: command_succeeds
    command: |-
      bash -c 'cd "{workspace}" && D=$(jq -r ".[0].iteration" divergence-report.json) && grep -q "divergence_iteration: $D" proof-report.md'
    condition: "sheet_num == 20"
    stage: 3
    description: "REV 2 ledger join: the reported divergence iteration EQUALS the divergence record"
  - type: command_succeeds
    command: |-
      bash -c 'cd "{workspace}" && E=$(jq -r .blueprint_sha256 build-ledger.json | cut -c1-12) && grep -q "edition: $E" proof-report.md && grep -q "churn_threshold_pct: 2" proof-report.md'
    condition: "sheet_num == 20"
    stage: 3
    description: "REV 2 ledger join: the reported edition stamp and churn threshold EQUAL the frozen contract values"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/proof-report.md") -ge 600'
    condition: "sheet_num == 20"
    stage: 3
    description: "Proof report has substance"

  # ── Sheet 21 · T8 chain terminator swap ───────────────────────────────────
  - type: command_succeeds
    command: 'bash -c ''test ! -f "{workspace}/.converged" || grep -q "denominator-terminal" "{workspace}/self-chain.yaml"'''
    condition: "sheet_num == 21"
    description: "Termination custody: converged runs leave the terminator installed in the staged chain copy"
  - type: command_succeeds
    command: 'bash -c ''test ! -f "{workspace}/.converged" || mzt validate "{workspace}/self-chain.yaml"'''
    condition: "sheet_num == 21"
    stage: 2
    description: "REV 2: the SWAPPED-IN terminator itself validates — the file the next cycle would execute is proven pronounceable before the chain trusts it"
