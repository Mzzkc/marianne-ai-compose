name: denominator
description: >
  The Denominator — a self-chaining Cathedral Construction proof: an open,
  machine-verified data-literacy curriculum for working journalists, converged
  by measured churn + pedagogical maturity, never by a writer declaring victory.

# workspace: intentionally omitted — auto-managed at ~/workspaces/denominator (#58).
# This is the maximally generic form: ZERO project-specific inputs. The score is
# portable across hosts; every path below is workspace-templated, score_dir-
# anchored, or ~-relative (V004-clean).

instrument: claude-code
instrument_config:
  timeout_seconds: 3600

# Named instruments — vendor separation is LOAD-BEARING at two points:
#   assessor-author (sheet 6): a different model family than the chapter
#     drafts (sheet 9). EMPTY fallback chain — if this family is missing the
#     run fails loudly, because a silently collapsed family would void the
#     separation-of-authorship claim. REV 2: the separation is also GATED —
#     sheet 1 probes the live instrument registry, records resolved families
#     to reports/instrument-families.json, and a validation FAILS the run at
#     commissioning if assessor and builder families are equal. A load-bearing
#     claim now has a load-bearing gate (review 3: "the empty fallback only
#     catches a missing instrument, not a same-family one").
#   inspector (sheet 10): vendor-diverse from the builder "where feasible"
#     (03-architecture.md) — falls back to claude-code gracefully.
instruments:
  assessor-author:
    profile: codex-cli
    config:
      timeout_seconds: 3600
  inspector:
    profile: codex-cli
    config:
      timeout_seconds: 3600

movements:
  1:
    name: "Commissioning"
  2:
    name: "Cathedral Loop"
  3:
    name: "Termination & Deliverables"

sheet:
  size: 1
  total_items: 21

  descriptions:
    1: "C1 scaffold + host/auth/family gates + chain staging"
    2: "C2 data commissioning + semantic pin gate"
    3: "C3 extract scripts + determinism probes"
    4: "C4 exercise harness + deterministic toolchain"
    5: "C5 blueprint + voice canon freeze"
    6: "C6 maturity assessor authorship + calibration"
    7: "C7 meters: churn + cache + chain control"
    8: "L1 plan-iteration (ledger-driven)"
    9: "L2 build chapters + bank + cards"
    10: "L3 inspect (vendor-diverse)"
    11: "L4 verify-gate (red-tolerant verdict)"
    12: "L5 convergence-check (verdict survives)"
    13: "L6 maturity-check + chain control"
    14: "T1 divergence-clause audit"
    15: "T2 mkdocs site build"
    16: "T3 Anki deck build"
    17: "T4 provenance page join"
    18: "T5 publish + wire smoke"
    19: "T6 two-path proof install"
    20: "T7 proof write-up"
    21: "T8 chain terminator swap"

  # Serial DAG — recorded declension: parallel chapter drafting was evaluated
  # and rejected (03-architecture.md, Movement 1); the depth budget fits serial.
  dependencies:
    2: [1]
    3: [2]
    4: [3]
    5: [4]
    6: [5]
    7: [6]
    8: [7]
    9: [8]
    10: [9]
    11: [10]
    12: [11]
    13: [12]
    14: [13]
    15: [14]
    16: [15]
    17: [16]
    18: [17]
    19: [18]
    20: [19]
    21: [20]

  # Read-and-React skin over the chain: sheets skip themselves on the workspace
  # state their own outputs describe. Commissioning sheets are idempotence-
  # guarded (run once, skip on every later cycle); loop sheets yield to the
  # convergence marker; termination sheets run ONLY on the converged cycle.
  # Semantics: exit 0 = SKIP, fail-open on error.
  skip_when:
    1:
      command: 'test -x "{workspace}/tools/check-host.sh" -a -f "{workspace}/self-chain.yaml"'
      description: "Skip when scaffolded and the chain copy is staged"
    2:
      command: 'test -f "{workspace}/data/pins.yaml"'
      description: "Skip when data is commissioned and pinned"
    3:
      command: 'test -f "{workspace}/data/extracts/manifest.json"'
      description: "Skip when extracts exist"
    4:
      command: 'test -f "{workspace}/.harness-calibrated"'
      description: "Skip when the harness is calibrated"
    5:
      command: 'test -f "{workspace}/cathedral/blueprint.yaml"'
      description: "Skip when the blueprint is frozen"
    6:
      command: 'test -f "{workspace}/.assessor-calibrated"'
      description: "Skip when the assessor is calibrated"
    7:
      command: 'test -f "{workspace}/.meters-proven"'
      description: "Skip when the meters are proven"
    8:
      command: 'test -f "{workspace}/.converged"'
      description: "Loop yields once converged"
    9:
      command: 'test -f "{workspace}/.converged"'
      description: "Loop yields once converged"
    10:
      command: 'test -f "{workspace}/.converged"'
      description: "Loop yields once converged"
    11:
      command: 'test -f "{workspace}/.converged"'
      description: "Loop yields once converged"
    12:
      command: 'test -f "{workspace}/.converged"'
      description: "Loop yields once converged"
    13:
      command: 'test -f "{workspace}/.converged"'
      description: "Loop yields once converged"
    14:
      command: 'test ! -f "{workspace}/.converged"'
      description: "Termination runs only when converged"
    15:
      command: 'test ! -f "{workspace}/.converged"'
      description: "Termination runs only when converged"
    16:
      command: 'test ! -f "{workspace}/.converged"'
      description: "Termination runs only when converged"
    17:
      command: 'test ! -f "{workspace}/.converged"'
      description: "Termination runs only when converged"
    18:
      command: 'test ! -f "{workspace}/.converged"'
      description: "Termination runs only when converged"
    19:
      command: 'test ! -f "{workspace}/.converged"'
      description: "Termination runs only when converged"
    20:
      command: 'test ! -f "{workspace}/.converged"'
      description: "Termination runs only when converged"
    21:
      command: 'test ! -f "{workspace}/.converged"'
      description: "Termination runs only when converged"

  per_sheet_instruments:
    2: cli
    6: assessor-author
    10: inspector
    11: cli
    12: cli
    13: cli
    14: cli
    15: cli
    16: cli
    17: cli
    18: cli
    19: cli
    21: cli

  # THE ETIQUETTE LAW, WRITTEN AS CONFIG: every deterministic gate carries an
  # explicit EMPTY fallback chain — no AI may reinterpret a failed gate, and a
  # gate that falls back is this proof's named sin. Sheet 6 joins the empty
  # set: assessor authorship without its distinct vendor family is a void
  # calibration, so it fails loudly instead of degrading.
  per_sheet_fallbacks:
    2: []
    6: []
    11: []
    12: []
    13: []
    14: []
    15: []
    16: []
    17: []
    18: []
    19: []
    21: []

  per_sheet_instrument_config:
    2: {timeout_seconds: 900}
    9: {timeout_seconds: 5400}
    11: {timeout_seconds: 2400}
    13: {timeout_seconds: 2400}
    15: {timeout_seconds: 1800}
    18: {timeout_seconds: 2400}
    21: {timeout_seconds: 300}

  # Cadenzas carry the frozen contracts to the judgment sheets. required: true
  # — a missing contract fails BEFORE execution, not after.
  cadenzas:
    8:
      - file: "{{ workspace }}/build-ledger.json"
        as: context
        required: true
    9:
      - file: "{{ workspace }}/cathedral/voice-canon.md"
        as: skill
        required: true
      - file: "{{ workspace }}/cathedral/blueprint.yaml"
        as: context
        required: true
    10:
      - file: "{{ workspace }}/cathedral/voice-canon.md"
        as: skill
        required: true
    20:
      - file: "{{ workspace }}/build-ledger.json"
        as: context
        required: true

retry:
  max_retries: 2
  base_delay_seconds: 30
  max_delay_seconds: 900

circuit_breaker:
  enabled: true
  failure_threshold: 6
  recovery_timeout_seconds: 600

# CLI gates run silent subprocesses (pytest, mkdocs, genanki) — stale detection
# must not kill a healthy verification stage (essentials pitfall 24).
stale_detection:
  enabled: true
  idle_timeout_seconds: 1800

cross_sheet:
  auto_capture_stdout: true
  max_output_chars: 1500
  lookback_sheets: 2

# Durable state across fresh cycles: the cathedral, its ledger, its pins, its
# tools and the staged chain copy survive; per-cycle ephemera (plan.md,
# inspection-report.md, gate reports) is archived per iteration and the durable
# copies live under reports/. The workspace git repo (.git) is what churn.sh
# diffs against — losing it would lose the fixed point.
workspace_lifecycle:
  archive_on_fresh: true
  max_archives: 25
  preserve_patterns:
    - ".iteration"
    - ".marianne-*"
    - ".converged"
    - ".harness-calibrated"
    - ".assessor-calibrated"
    - ".meters-proven"
    - ".score-origin"
    - ".chain-terminated"
    - "self-chain.yaml"
    - "build-ledger.json"
    - "memo-cache.yaml"
    - "HOSTS.md"
    - "proof-report.md"
    - "divergence-report.json"
    - "live-smoke.json"
    - "two-path-report.json"
    - "cathedral/**"
    - "data/**"
    - "harness/**"
    - "tools/**"
    - "scripts/**"
    - "deck/**"
    - "site/**"
    - "site-src/**"
    - "reports/**"
    - "archive/**"
    - ".worktrees/**"
    - ".git/**"

concert:
  enabled: true
  max_chain_depth: 20
  cooldown_between_jobs_seconds: 30
  inherit_workspace: true

# Self-chain: the staged copy (sheet 1) is the target — the chain is pinned to
# the bytes that started it. Termination is the deterministic swap in sheet 21.
on_success:
  - type: run_job
    job_path: "{workspace}/self-chain.yaml"
    description: "Chain to the next cathedral iteration (ends via the sheet-21 terminator swap)"
    detached: true
    fresh: true

prompt:
  variables:
    course_title: "The Denominator"
    course_subtitle: "Statistical moves your beat actually demands"
    audience: "working journalists and science communicators on deadline"
    repo_slug: "Mzzkc/denominator"
    pages_url: "https://mzzkc.github.io/denominator/"
    deck_asset: "denominator.apkg"
    license: "CC BY-SA 4.0"
    depth_bound: 20
    churn_threshold_pct: 2
    min_exercises_per_chapter: 3
    flesch_reading_min: 40
    flesch_reading_max: 65
    owid_life_expectancy_url: "https://ourworldindata.org/grapher/life-expectancy.csv"
    who_odata_base: "https://ghoapi.azureedge.net/api"
    # Semantic expectations moved OUT of the template body into variables
    # (rev 2, review 3: "changing datasets should mean editing variables,
    # not score code"). Phrases verified against live IndicatorName titles
    # on 2026-09-04. NOTE the indicator change from rev 1: the rate is
    # MDG_0000000007 (UNDER-FIVE mortality rate) — rev 1 paired the under-5
    # death count with the INFANT rate (MDG_0000000001): mismatched
    # populations for chapter 1's count-vs-rate comparison.
    semantic_expectations:
      MORT_100: "deaths in children aged <5"
      MDG_0000000007: "Under-five mortality rate"
      WHS4_117: "Hepatitis B"
      WHS4_100: "pertussis"
    chapters:
      - id: "chapter-01"
        title: "Counts versus rates"
        focus: "The same country-year as TOTAL under-5 deaths (WHO MORT_100, both-sex 0-4, aggregated across the 16 cause codes in the extract) and as the under-5 mortality rate per 1,000 live births (MDG_0000000007) — matched populations, the denominator made visible before any formula."
      - id: "chapter-02"
        title: "Denominators"
        focus: "Who is in the bottom of the fraction, who is missing from it, and what each choice does to the story."
      - id: "chapter-03"
        title: "Age standardization"
        focus: "Why two populations with identical health can show different rates, and how to standardize on real pinned data."
      - id: "chapter-04"
        title: "Absolute versus relative risk"
        focus: "Relative always alongside absolute — the risk-communication rule as a non-negotiable gate, not a style preference."
      - id: "chapter-05"
        title: "Base rates and the screening paradox"
        focus: "Real coverage denominators (DTP3 WHS4_100, HepB3 WHS4_117) and herd-threshold arithmetic; the screening paradox built from natural-frequency tables whose test characteristics are LABELED ASSUMPTIONS, never smuggled in as if they were data."
      - id: "chapter-06"
        title: "Excess mortality"
        focus: "Comparing observed to expected deaths; why excess mortality sees what cause-of-death counts miss."
      - id: "chapter-07"
        title: "Uncertainty intervals"
        focus: "Reading and reporting ranges without punting the story; small-sample wiggle on real data."
      - id: "chapter-08"
        title: "Sampling bias"
        focus: "Who never made it into the sample; convenience samples and their lies."
      - id: "chapter-09"
        title: "The ecological fallacy"
        focus: "Country-level patterns that evaporate (or invert) at the individual level."
      - id: "chapter-10"
        title: "Preprints versus peer review"
        focus: "What a preprint does and does not certify; timing a story against the evidence pipeline."
      - id: "chapter-11"
        title: "Reading a methods section"
        focus: "The five questions to ask any study in ninety seconds."

  template: |
    {% macro output_spec(filename, format="markdown") -%}
    ## Output Specification
    - **File**: {{ workspace }}/{{ filename }}
    - **Format**: {{ format }}
    - The file must be complete and parseable — a downstream exit-coded tool
      consumes it, not a forgiving reader.
    {%- endmacro %}

    {% macro quality_bar(level="standard") -%}
    {% if level == "gating" -%}
    DETERMINISM BAR: everything you author here is later EXECUTED as a gate.
    It must fail loudly and specifically (exit nonzero, named reason) — a
    checker that cannot fail certifies nothing. No judgment calls at runtime.
    {%- elif level == "craft" -%}
    CRAFT BAR: newsroom-native register. Plain, verb-forward sentences doing
    real work. Absolute risk always alongside relative. Natural frequencies
    over probabilities. Every denominator named. One worked "click moment"
    per concept on real pinned data before any formula appears.
    {%- else -%}
    STANDARD BAR: correct, complete, calibrated to the audience. Mark
    uncertainties with [?] rather than smoothing them over.
    {%- endif %}
    {%- endmacro %}

    {% macro anchor_rule() -%}
    PROVENANCE ANCHORS: every number in chapter prose exists ONLY as an anchor
    of the form {{ '{{' }}num:extract-key{{ '}}' }} — never as a bare literal.
    Each anchor must resolve to a key in data/extracts/manifest.json; the
    verify-gate joins them by regex and fails on any unresolved anchor.
    {%- endmacro %}

    {% macro etiquette_law(gate_cmd) -%}
    # ETIQUETTE LAW (deterministic sheet — no fallback chain): {{ gate_cmd }}
    # decides by exit code. If a check fails, fail loudly with the failing
    # output on stderr. Never invent a workaround for a red gate.
    {%- endmacro %}

    {% macro constitution() -%}
    THE CONSTITUTION OF THIS RUN: the LLM writes the course; the scaffolding
    decides when it stands. Every judgment sheet (planning, writing,
    inspecting) is bounded by exit-coded gates it does not own. Never edit
    tools/thresholds.yaml, cathedral/blueprint.yaml, or build-ledger.json to
    make a gate pass — those are frozen contracts; mutating one is a visible
    errata event, not a fix.
    {%- endmacro %}

    {% macro verdict_rule() -%}
    # VERDICT RULE (rev 2): an exit-1 from this sheet's meter is a VERDICT,
    # not an error. Capture it with `cmd || RC=$?` — never let a verdict kill
    # the sheet under errexit. Write the typed report; exit 0. Only exit >= 2
    # (meter malfunction) fails the sheet. The verdict is consumed downstream
    # by chain_control via the report file.
    {%- endmacro %}

    {% if stage not in [2, 11, 12, 13, 14, 15, 16, 17, 18, 19, 21] %}
    {{ constitution() }}
    {% endif %}

    {% if stage == 1 %}
    # C1 — Scaffold, Host/Auth/Family Gates, Chain Staging
    (Shipyard Sequence: prove the environment — binaries AND credentials AND
    instrument families — can run the remaining steps, before the expensive
    loop pays for anything. Rev 2: the riskiest external credential is gated
    HERE, not discovered at sheet 18 after the whole cathedral is paid for.)

    Create the repository skeleton under {{ workspace }}: cathedral/chapters/,
    data/raw/, data/extracts/, scripts/tests/, harness/fixtures/, tools/,
    deck/, site-src/docs/, reports/. Run `git init` and configure a local
    identity so later commits never depend on ambient host config:
    `git config user.name "denominator-builder"; git config user.email
    "denominator@invalid"` (the workspace git repo is what churn.sh diffs
    across iterations — treat it as load-bearing).
    Write HOSTS.md recording the host capability snapshot.

    Author `tools/check-host.sh`: it verifies EVERY binary later stages name —
    git, curl, sha256sum, jq, python3, uv, mkdocs, gh — plus `mzt`, AND the
    two credential gates: `gh auth status` must exit 0 (the publish path at
    sheet 18 dies without it — die HERE instead), and `mzt` must resolve
    (instrument readiness is checked below). Exit nonzero naming each missing
    item. Prove it can fail: include a `--self-test` mode that asserts a
    bogus binary is detected as missing (the self-test is itself validated).

    Record the live instrument-family truth AND gate the load-bearing
    inequality: run `mzt instruments list` (fall back to `mzt config` if the
    subcommand is absent), resolve the default model and the named profiles
    (assessor-author → codex-cli, inspector → codex-cli), and derive each
    vendor family from the RESOLVED MODEL NAME (glm/gpt/gemini/claude/llama/
    qwen/...), never from the profile label — instrument-name inequality is
    not vendor diversity. Save to `reports/instrument-families.json`:
    {"default_profile","default_model","default_family","named":{...
    {"profile","model","family","ready"}},"assessor_family_distinct":bool,
    "inspector_family_distinct":bool} where the distinct flags are computed
    as named-family != default-family. If assessor_family_distinct is false,
    FAIL THIS SHEET with a named reason: the sheet-6 calibration claim is
    void without a second family, and an empty fallback chain is exactly the
    loud failure this design chooses. (A validation re-checks the recorded
    JSON, so the gate is on disk, not on your word.)

    Stage the self-chain copy and record custody of the original:
    ```
    cp "{{ score_dir }}/cathedral-construction.yaml" "{{ workspace }}/self-chain.yaml"
    readlink -f "{{ score_dir }}/cathedral-construction.yaml" > "{{ workspace }}/.score-origin"
    ```
    If the copy fails, STOP — the chain cannot be pinned, and running further
    would orphan every cycle after the first. (A validation asserts the staged
    copy is byte-identical to the recorded origin and that the origin basename
    really is cathedral-construction.yaml — a stale sibling cannot silently
    become the chain authority.)

    {{ output_spec("HOSTS.md") }}
    {{ quality_bar("standard") }}
    {% elif stage == 2 %}
    # C2 — Data Commissioning + Semantic Pin Gate
    # Effectivity pins: admitted data carries url, sha256, timestamp, license,
    # and a semantic title bound via the metadata endpoint.
    # REV 2: every fetch form below was EXECUTED against the live endpoints at
    # composition time (2026-09-04). Query separators are LITERAL `&` (rev 1's
    # %26 forms returned HTTP 400 — the server splits on literal & before
    # decoding). $top stays within the server's hard cap of 1000 (rev 1 asked
    # 2000 → HTTP 400). MORT_100 is pinned to SEX_BTSX + AGEGROUP_YEARS0-4 +
    # 2015–2021 → 672 rows in ONE fetch (unfiltered it is 1890 rows and would
    # be silently truncated by the cap). The rate indicator is
    # MDG_0000000007 (under-five mortality rate) so count and rate describe
    # the SAME population.
    set -euo pipefail
    WS="{{ workspace }}"
    BASE='{{ who_odata_base }}'
    mkdir -p "$WS/data/raw"

    # --- OWID grapher CSV (verified live: HTTP 200, text/csv, header check) ---
    curl -sfL '{{ owid_life_expectancy_url }}' -o "$WS/data/raw/owid-life-expectancy.csv"

    # --- WHO GHO OData (every form below verified live 2026-09-04; literal &) ---
    fetch_who() {
      code="$1"; filt="$2"
      curl -sfL "${BASE}/${code}?${filt}" -o "$WS/data/raw/who-${code}.json"
    }
    # MORT_100: under-5 DEATH COUNTS by cause; pinned to both-sex 0-4 so the
    # chapter-1 extract aggregates a well-defined 16-cause total per country-year.
    fetch_who MORT_100         '%24filter=TimeDim%20ge%202015%20and%20TimeDim%20le%202021%20and%20SpatialDim%20in%20(%27GBR%27,%27JPN%27,%27NGA%27,%27BRA%27,%27SWE%27,%27USA%27)%20and%20Dim1%20eq%20%27SEX_BTSX%27%20and%20Dim2%20eq%20%27AGEGROUP_YEARS0-4%27&%24select=SpatialDim,TimeDim,Dim3,NumericValue'
    # MDG_0000000007: under-five mortality RATE per 1000 live births — same
    # population as the count above (rev 1 used the INFANT rate: mismatched).
    fetch_who MDG_0000000007   '%24filter=TimeDim%20ge%202015%20and%20SpatialDim%20in%20(%27GBR%27,%27JPN%27,%27NGA%27,%27BRA%27,%27SWE%27,%27USA%27)&%24select=SpatialDim,TimeDim,NumericValue'
    # Coverage indicators for chapter 5's real denominators (filtered to the
    # six course countries: 66 rows each — small, targeted, under the cap).
    fetch_who WHS4_117         '%24filter=TimeDim%20ge%202015%20and%20SpatialDim%20in%20(%27GBR%27,%27JPN%27,%27NGA%27,%27BRA%27,%27SWE%27,%27USA%27)&%24select=SpatialDim,TimeDim,NumericValue'
    fetch_who WHS4_100         '%24filter=TimeDim%20ge%202015%20and%20SpatialDim%20in%20(%27GBR%27,%27JPN%27,%27NGA%27,%27BRA%27,%27SWE%27,%27USA%27)&%24select=SpatialDim,TimeDim,NumericValue'

    # --- Semantic binding: each indicator's TITLE from the metadata endpoint,
    #     asserted against the expected phrase (from score variables) BEFORE
    #     the pin is admitted. (The WHS4_100 lesson: a 200 with rows is not a
    #     verified semantic claim — this concert's sheet 2 found WHS4_100 is
    #     DTP3 coverage, not life expectancy.)
    python3 - <<'PYEOF'
    import json, subprocess, sys, datetime, hashlib, pathlib
    ws = pathlib.Path("{{ workspace }}")
    base = "{{ who_odata_base }}"
    expected = {
    {% for code, phrase in semantic_expectations.items() %}
        "{{ code }}": "{{ phrase }}",
    {% endfor %}
    }
    pins = []
    for code, phrase in expected.items():
        url = f"{base}/Indicator?%24filter=IndicatorCode%20eq%20%27{code}%27"
        meta = json.loads(subprocess.run(["curl", "-sfL", url],
                                         capture_output=True, check=True).stdout)
        title = meta["value"][0]["IndicatorName"]
        if phrase.lower() not in title.lower():
            sys.exit(f"SEMANTIC GATE FAILED for {code}: expected '{phrase}' in '{title}'")
        raw = ws / "data" / "raw" / f"who-{code}.json"
        pins.append((f"who-{code}.json", url, title, raw))
    owid = ws / "data" / "raw" / "owid-life-expectancy.csv"
    head = owid.read_text(errors="replace").splitlines()[0]
    if "Life expectancy" not in head:
        sys.exit(f"SEMANTIC GATE FAILED for OWID csv: header lacks 'Life expectancy': {head!r}")
    lines = [
        "pins:",
        f"  - file: owid-life-expectancy.csv",
        f"    url: {{ owid_life_expectancy_url }}",
        f"    sha256: {hashlib.sha256(owid.read_bytes()).hexdigest()}",
        f"    fetched_utc: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",
        f"    license: CC BY (Our World in Data)",
        f"    semantic_title: OWID grapher life-expectancy (header-verified)",
    ]
    for fname, url, title, raw in pins:
        lines += [
            f"  - file: {fname}",
            f"    url: {url}",
            f"    sha256: {hashlib.sha256(raw.read_bytes()).hexdigest()}",
            f"    fetched_utc: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",
            f"    license: CC BY-NC-SA 3.0 IGO (WHO GHO)",
            f"    semantic_title: {title}",
        ]
    (ws / "data" / "pins.yaml").write_text("\n".join(lines) + "\n")
    print("pins.yaml written:", len(lines) // 7, "pins, all semantically bound")
    PYEOF

    # --- The fail-closed verifier (stdlib only; parses the pins format it
    #     just wrote — the format is an EDITION contract: pins are snapshots,
    #     and bytes that move under a frozen pin force re-commissioning as a
    #     NEW edition, never a quiet mutation. `--live` re-probes the SEMANTIC
    #     claims (metadata titles + OWID header) over the network so a renamed
    #     or repurposed upstream indicator is caught at commissioning even
    #     though bytes are allowed to differ across editions).
    #     Re-run offline by this score's validation on the commissioning cycle.
    mkdir -p "$WS/tools"
    cat > "$WS/tools/pin_verify.py" <<'PYEOF'
    #!/usr/bin/env python3
    """Fail-closed pin verifier: every admitted dataset byte-matches its pin.
    Exits 1 naming the first mismatch. Stdlib only.
    --live additionally re-fetches semantic claims (WHO Indicator titles,
    OWID csv header) and asserts the expected phrases still hold."""
    import hashlib, json, pathlib, re, subprocess, sys
    ws = pathlib.Path(__file__).resolve().parent.parent
    EXPECTED = {
    {% for code, phrase in semantic_expectations.items() %}
        "{{ code }}": "{{ phrase }}",
    {% endfor %}
    }
    pins_text = (ws / "data" / "pins.yaml").read_text()
    entries = re.findall(r"- file: (\S+)\n\s+url: (\S+)\n\s+sha256: ([0-9a-f]{64})\n"
                         r"\s+fetched_utc: (\S+)\n\s+license: ([^\n]+)\n"
                         r"\s+semantic_title: ([^\n]+)", pins_text)
    if len(entries) < 5:
        sys.exit(f"pin_verify: expected >= 5 pins, parsed {len(entries)} — pins.yaml malformed")
    ok = 0
    for fname, url, digest, fetched, lic, title in entries:
        raw = ws / "data" / "raw" / fname
        if not raw.exists():
            sys.exit(f"pin_verify MISSING: {fname} (pinned {fetched})")
        actual = hashlib.sha256(raw.read_bytes()).hexdigest()
        if actual != digest:
            sys.exit(f"pin_verify MISMATCH: {fname} pinned {digest[:12]}… got {actual[:12]}… "
                     f"— the bytes moved under a frozen pin; re-commission as a NEW edition, never mutate")
        ok += 1
    print(f"pin_verify: {ok}/{len(entries)} pins verified fail-closed")
    if "--live" in sys.argv:
        base = "{{ who_odata_base }}"
        for code, phrase in EXPECTED.items():
            u = f"{base}/Indicator?%24filter=IndicatorCode%20eq%20%27{code}%27"
            meta = json.loads(subprocess.run(["curl", "-sfL", u],
                                             capture_output=True, check=True).stdout)
            title = meta["value"][0]["IndicatorName"]
            if phrase.lower() not in title.lower():
                sys.exit(f"pin_verify LIVE SEMANTIC DRIFT: {code} title no longer "
                         f"contains '{phrase}': '{title}' — re-commission as a NEW edition")
            print(f"live semantic ok: {code} -> {title}")
        head = (ws / "data" / "raw" / "owid-life-expectancy.csv"
                ).read_text(errors="replace").splitlines()[0]
        if "Life expectancy" not in head:
            sys.exit("pin_verify LIVE: OWID header drifted — re-commission as a NEW edition")
        print("live semantic ok: OWID header")
    PYEOF
    python3 "$WS/tools/pin_verify.py"
    python3 "$WS/tools/pin_verify.py" --live
    {{ etiquette_law("tools/pin_verify.py (+ --live semantic re-probe)") }}
    {% elif stage == 3 %}
    # C3 — Extract Scripts with Provenance Headers
    (Shipyard: extracts are trustworthy because determinism is PROVEN, not assumed)

    Author `scripts/recompute.py` (run via `uv run --with pandas --with numpy`):
    transforms the pinned raw data into per-chapter canonical extract files in
    `data/extracts/` — including `under5_deaths_total` (who-MORT_100.json
    grouped by SpatialDim×TimeDim and SUMMED across the Dim3 cause codes —
    the aggregation contract chapter 1 depends on; the fetch is pinned to
    SEX_BTSX + AGEGROUP_YEARS0-4 so the sum cannot double-count), rates per
    1,000 (who-MDG_0000000007.json), and coverage fractions (WHS4_*).
    Every extract header embeds the pin digest it derived from. Emit
    `data/extracts/manifest.json` joining extract → pin digest → script
    version → extract keys (the keys chapter anchors reference). Also author
    `scripts/tests/test_extracts.py` (pytest) asserting extract invariants:
    expected columns present, row floors, monotone years, consistent country
    sets between count and rate extracts, and spot values recomputed IN THE
    TEST from data/raw — not from your extracts (the test is the independent
    oracle; it must read data/raw directly, and a validation checks that it
    does). Include one test asserting the 16-cause sum reproduces a hand-
    checked country-year total from the raw JSON.

    The script must expose two deterministic modes the gates call:
    - `--check-determinism`: run the full extraction twice into temp dirs,
      assert byte-identical digests, exit nonzero on any difference.
    - `--check-fail-closed`: copy one pinned raw file to a temp workspace,
      corrupt one byte, and prove that pin verification FAILS BEFORE any
      extract regenerates (ordering is the safety property). Exit nonzero if
      the corruption does not trip the pin gate first.

    Run both modes now and paste their exit codes into HOSTS.md's extract row.
    {{ output_spec("scripts/recompute.py", "python") }}
    {{ quality_bar("gating") }}
    {% elif stage == 4 %}
    # C4 — Exercise Harness + Deterministic Toolchain
    (Shipyard + Andon: the grader exists BEFORE the chapters, and must be
    shown able to FAIL before it is trusted to pass)

    Author the full deterministic toolchain the loop and deliverables execute:

    1. `harness/run_exercises.py` — pytest-based grader that loads the
       question-bank YAML (harness/question-bank.yaml — you also author a
       seed bank for the fixtures), recomputes every reference answer from
       data/extracts within the tolerance registry (harness/tolerances.yaml,
       pre-registered NOW, before any chapter exists), and grades candidate
       answers. Modes:
       - `--grade`: grade the bank (exit nonzero on any wrong answer).
       - `--self-test`: run the sound fixture (must pass ALL) AND the
         corrupted fixture (must FAIL — a grader that cannot fail certifies
         nothing). Exit nonzero unless BOTH directions hold.
    2. `harness/fixtures/` — one sound chapter-shaped fixture and one subtly
       wrong fixture (an off-by-a-denominator answer).
    3. `harness/band_check.py` — textstat reading band checker (sources mode
       and --rendered mode over built site text; band {{ flesch_reading_min }}–
       {{ flesch_reading_max }} Flesch pre-registered here).
    4. `deck/build_deck.py` — genanki deck compiler from the question bank +
       glossary; deterministic deck/model IDs; `--self-test` compiles a
       fixture bank and round-trips the .apkg as a zip asserting card count
       and fields; `--verify` re-checks bijection (cards ↔ glossary 1:1) and
       the round-trip against the real bank.
    5. `tools/provenance_join.py` — joins every {{ '{{' }}num:key{{ '}}' }}
       anchor in chapter prose to its extract row; `--check` mode asserts
       zero unresolved anchors (count equality: anchors in prose == rows on
       the page) and re-derives N random rows live from the pin; exit-coded.
    6. `tools/cache_check.py` — the Memoization Cache, now LOAD-BEARING (rev
       2: rev 1 ran it and discarded the verdict — decorative). Interface:
       `--stage verify|maturity --workspace PATH` recomputes per-chapter
       {input_hash = dataset-pin sha256 × chapter-content digest,
       context_hash = blueprint/voice-canon/thresholds digests} against
       memo-cache.yaml and writes `cache-verdict.json`
       {"skip": [chapters whose stored entry matches ALL hashes AND whose
       stored verdict is green], "recheck": [all others]}; exit 0 normally,
       exit 2 on internal error (a crash can never impersonate a verdict).
       `--record-green CHAPTERS` appends/updates green entries after a fully
       green check. `--self-test`: inject a synthetic pin change and assert
       the affected chapter moves to recheck (forced miss); assert an
       unchanged green chapter stays in skip — a cache that never misses is
       indistinguishable from a cache that never checks.
    7. `tools/verify_gate.sh` — the L4 composition, and the cache's CONSUMER:
       first run `cache_check.py --stage verify`, read cache-verdict.json,
       and run the expensive sub-checks (exercise grading, band, anchor
       join) ONLY on the recheck set PLUS one audit chapter drawn from the
       skip set (round-robin: a cached chapter is re-verified at least once
       every N gates — trust, but sample, so a lying cache is caught within
       one N-gate window). After a fully green run for a chapter, call
       `cache_check.py --record-green`. Emit the typed gate-report.json (one
       row per sub-check, pass/fail + numbers, plus a "cache_skipped" array
       naming the chapters whose expensive checks were legitimately skipped);
       exit 0 all green / 1 any sub-check red / 2+ internal error. This is
       the gate the loop's writers are bounded by — it composes the tools
       above, it invents no judgments of its own, and its red exit is a
       VERDICT consumed downstream (see L4), never a reason for the sheet to
       die.
       (chain_control later merges cache-verdict.json's skip set into
       ledger.verified — that merge is what makes L1's waste guard real.)

    On success write the marker `.harness-calibrated` containing the sha256
    of harness/tolerances.yaml (thresholds are frozen from this moment).
    {{ output_spec("harness/run_exercises.py", "python") }}
    {{ quality_bar("gating") }}
    {% elif stage == 5 %}
    # C5 — Blueprint + Voice Canon Freeze
    (Contract at Interfaces: the frozen blueprint is what every downstream
    stage consumes; freeze-time checks catch in chapter 1 what would otherwise
