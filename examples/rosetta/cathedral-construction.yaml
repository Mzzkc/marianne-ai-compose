# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║        THE DENOMINATOR — Cathedral Construction proof score (rev 2)          ║
# ║       composed from 03-architecture.md, revised against three adversarial    ║
# ║     reviews (05-review-1/2/3.md, rosetta-prove concert, 2026-09-04)           ║
# ║                                                                                ║
# ║  PRIMARY PATTERN : Cathedral Construction — an artifact too large for one     ║
# ║                    context window is built incrementally toward a frozen     ║
# ║                    blueprint across bounded self-chaining cycles              ║
# ║                    (plan-iteration → build → inspect → verify-gate →          ║
# ║                    convergence-check → maturity-check). The writer never      ║
# ║                    decides when the course is done: churn (structural) ∧     ║
# ║                    maturity (pedagogical) decide, both as exit codes.        ║
# ║                                                                                ║
# ║  COMPOSING       : Fixed-Point Iteration (tools/churn.sh diffs                ║
# ║                    cathedral/** between git iteration snapshots; verdict     ║
# ║                    exit-coded; "no fixed iteration count, no performer's     ║
# ║                    fatigue"), Soil Maturity Index (tools/maturity_assessor.  ║
# ║                    py, authored from the FROZEN blueprint by a DIFFERENT     ║
# ║                    vendor family than any chapter draft — the family          ║
# ║                    inequality is now GATED, not asserted (sheet-1             ║
# ║                    instrument-families.json + sheet-6 lineage join);          ║
# ║                    thresholds pre-registered before the first chapter         ║
# ║                    exists; exit code controls chain termination),             ║
# ║                    Memoization Cache (tools/cache_check.py keyed on           ║
# ║                    dataset-pin sha256 × chapter digest × context hash).      ║
# ║                    REV 2: the cache is now LOAD-BEARING, not decorative —     ║
# ║                    verify_gate.sh consults it to SKIP expensive re-checks     ║
# ║                    of verified-and-unchanged chapters (with an audit          ║
# ║                    sample so a lying cache is caught), records new            ║
# ║                    greens, and chain_control merges cached greens into        ║
# ║                    ledger.verified — the exact set L1's waste guard           ║
# ║                    consumes. Cache hits skip real work; misses pay.           ║
# ║                    The Etiquette Law is the substrate: every gate below       ║
# ║                    is a command with an exit code and an EMPTY fallback       ║
# ║                    chain — the course's authors never judge their own         ║
# ║                    convergence. Scaffolding movements: Shipyard Sequence      ║
# ║                    (commissioning validates the foundation with real         ║
# ║                    tools before the expensive loop runs) and Andon            ║
# ║                    discipline (every meter must PROVE it can fail —           ║
# ║                    mutation fixtures, two-direction calibration, forced       ║
# ║                    cache miss — before it is trusted to pass).                ║
# ║                                                                                ║
# ║  PROBLEM SOLVED  : No proof in the corpus had ever run the Iteration scale    ║
# ║                    (zero self-chaining anywhere in proof-scores/ —            ║
# ║                    verified by grep in all three reviews). This score is      ║
# ║                    the corpus's first self-chaining build loop: it            ║
# ║                    produces The Denominator, a complete open                  ║
# ║                    machine-verified data-literacy curriculum (~11             ║
# ║                    chapters) for working journalists and science              ║
# ║                    communicators, whose every number is re-derived from       ║
# ║                    sha256-pinned real datasets (OWID grapher CSV + WHO        ║
# ║                    GHO OData, live-verified and semantically bound via        ║
# ║                    the metadata endpoint — the WHS4_100 lesson: a HTTP        ║
# ║                    200 with rows is not a verified semantic claim), whose     ║
# ║                    exercises are auto-graded against recomputed               ║
# ║                    reference answers, and whose COMPLETENESS is decided       ║
# ║                    by measured convergence plus pedagogical maturity —        ║
# ║                    never by a writer declaring victory. The                   ║
# ║                    composition's falsifiability clause is a gate: the         ║
# ║                    run FAILS unless the ledger records at least one           ║
# ║                    iteration where structural churn was below threshold       ║
# ║                    while pedagogical maturity FAILED (if the two gates        ║
# ║                    never disagree, the composition was redundant).            ║
# ║                                                                                ║
# ║  PRODUCES        : ~/workspaces/denominator/ (auto-managed, #58) →            ║
# ║                    cathedral/ (blueprint.yaml frozen + voice-canon.md +      ║
# ║                    chapters/*.md with {{num:key}} provenance anchors) ·      ║
# ║                    data/ (raw/ fetched bytes + pins.yaml with url/sha256/    ║
# ║                    timestamp/license/semantic-title + extracts/ + manifest)   ║
# ║                    · scripts/recompute.py + tests · harness/ (pytest         ║
# ║                    exercise grader + band check + deck compiler +            ║
# ║                    provenance joiner) · tools/ (check-host.sh, pin_verify.   ║
# ║                    py, blueprint_check.py, maturity_assessor.py,             ║
# ║                    thresholds.yaml, churn.sh, cache_check.py,                ║
# ║                    chain_control.sh, verify_gate.sh, provenance_join.py)      ║
# ║                    · build-ledger.json + memo-cache.yaml + cache-verdict.     ║
# ║                    json + churn/maturity/gate reports · site-src/ +           ║
# ║                    site/ (mkdocs --strict, edition-stamped) ·                ║
# ║                    deck/denominator.apkg (genanki) · proof-report.md · and   ║
# ║                    the LIVE course: GitHub Pages site + release asset,       ║
# ║                    proven at the wire (HTTP 200 + end-to-end asset fetch     ║
# ║                    + served edition stamp == this build's ledger digest).    ║
# ║                                                                                ║
# ║  INSTRUMENTS     : 10 AI-judgment sheets (1 scaffold, 3 extracts, 4           ║
# ║                    harness, 5 blueprint, 6 assessor authorship by             ║
# ║                    codex-cli — vendor family GPT, EMPTY fallback:            ║
# ║                    silent family collapse voids the calibration              ║
# ║                    claim — 7 meters, 8 planning, 9 chapter drafting          ║
# ║                    by claude-code, 10 inspection by codex-cli with           ║
# ║                    graceful fallback, 20 write-up) · 11 deterministic        ║
# ║                    CLI sheets (2, 11–19, 21: data commissioning,             ║
# ║                    verify-gate, churn, maturity+chain control,               ║
# ║                    divergence audit, mkdocs build, deck build,               ║
# ║                    provenance join, publish+wire smoke, two-path             ║
# ║                    install, chain terminator — ALL with empty                ║
# ║                    fallback chains). In the repeating loop (the part         ║
# ║                    that runs up to 20×), three of six stages are pure        ║
# ║                    CLI. (Header arithmetic corrected in rev 2 — rev 1        ║
# ║                    said 11 AI / 10 CLI, off by one in both directions.)       ║
# ║                                                                                ║
# ║  CHAIN MECHANICS : Self-chaining via on_success run_job → the staged copy     ║
# ║                    at self-chain.yaml in the workspace (sheet 1 copies the    ║
# ║                    running score via its score_dir and the copy's            ║
# ║                    byte-identity to the recorded origin is VALIDATED —        ║
# ║                    the chain is pinned to the bytes that started it).        ║
# ║                    fresh: true + workspace_lifecycle.preserve_patterns      ║
# ║                    keep the cathedral/ledger/pins/tools across cycles while  ║
# ║                    per-cycle ephemera is archived per iteration.             ║
# ║                    VERDICT SURVIVAL (rev 2, the review-1/-2 kill fix):       ║
# ║                    a red sub-check at L4 or a not-converged verdict at       ║
# ║                    L5 is a VERDICT, not an error — both sheets capture        ║
# ║                    the exit code with `|| RC=$?` (no set -e suicide),         ║
# ║                    write their typed report, and exit 0. The verdict is       ║
# ║                    consumed downstream: maturity re-runs the harness          ║
# ║                    (a red L4 guarantees a maturity FAIL), chain_control       ║
# ║                    records CONTINUE, and the next cycle's L1 reads the        ║
# ║                    failed gates to route rework. Correction is cheap;         ║
# ║                    the loop survives the defect class it exists to            ║
# ║                    iterate on. Only meter ERRORS (exit ≥ 2) and depth         ║
# ║                    exhaustion fail a sheet.                                   ║
# ║                    TERMINATION (deterministic): (a) convergence — sheet       ║
# ║                    21 (CLI) swaps self-chain.yaml for a validated            ║
# ║                    one-sheet terminator once .converged ∧ the proof          ║
# ║                    report exists → the chain ends with the job COMPLETED     ║
# ║                    (the "chain gate fails by design" idiom was REJECTED:      ║
# ║                    it would mark a successful run FAILED); (b) depth          ║
# ║                    exhaustion — chain_control.sh records an explicit          ║
# ║                    FAILED_CONVERGENCE ledger row and exits nonzero at         ║
# ║                    iteration 20 without convergence → the run dies           ║
# ║                    loud, never a quiet success; (c) divergence                ║
# ║                    violation — T1 fails the run if the gates never           ║
# ║                    disagreed. Recovery: a T-stage failure on the              ║
# ║                    converged cycle dead-ends the chain by design;            ║
# ║                    recover with `mzt resume <job-id>` (composer action,      ║
# ║                    visible).                                                  ║
# ║                                                                                ║
# ║  ON_FAILURE      : Evaluated (as 03-architecture.md directed) and            ║
# ║                    deliberately NOT used: the depth-exhaustion path           ║
# ║                    already has durable, visible custody via the               ║
# ║                    chain_control FAILED_CONVERGENCE ledger row +              ║
# ║                    nonzero exit, and stacking an on_failure hook on a         ║
# ║                    self-chaining score adds an engine interleaving            ║
# ║                    (on_failure × on_success × fresh) that no proof            ║
# ║                    has executed yet. Loud-and-simple beats novel-            ║
# ║                    and-unproven at the failure boundary. Decision             ║
# ║                    recorded here so the next composer does not re-            ║
# ║                    derive it blind.                                          ║
# ║                                                                                ║
# ║  PREREQUISITES   : mkdocs, jq, curl, sha256sum, git, python3, uv on PATH      ║
# ║                    AND `gh` AUTHENTICATED (check-host.sh runs `gh auth       ║
# ║                    status` — rev 2: the riskiest credential is gated at       ║
# ║                    sheet 1, not discovered at sheet 18) and the              ║
# ║                    assessor-author instrument family READY (sheet 1          ║
# ║                    probes mzt instruments and the family-inequality          ║
# ║                    gate fails the run at commissioning if assessor and        ║
# ║                    builder collapse to one vendor); network for OWID/WHO     ║
# ║                    + uv packages (pandas, numpy, pytest, pyyaml,             ║
# ║                    textstat, genanki). Rough cost: ~10 AI sheets per         ║
# ║                    commissioning cycle (once) + 3 AI sheets per loop         ║
# ║                    cycle (≤20) ≈ $10-40 depending on subscriptions.          ║
# ║                                                                                ║
# ║  SIDE EFFECTS    : (unadvertised in rev 1 — now on the tin) Sheet 18          ║
# ║                    CREATES A PUBLIC GitHub repo under repo_slug if            ║
# ║                    absent, force-pushes a gh-pages branch, enables            ║
# ║                    Pages, and cuts a release with the deck attached.          ║
# ║                    These are irreversible external effects. Sheet 19          ║
# ║                    writes a second copy of this score into the                ║
# ║                    marianne-ai-compose checkout it runs from (that is        ║
# ║                    the two-path proof). Read PREREQUISITES before            ║
# ║                    running on any host that is not the composer's.            ║
# ║                                                                                ║
# ║  TWO-PATH RULE   : Canonical install TODAY: scores/rosetta-corpus/           ║
# ║                    proof-scores/cathedral-construction.yaml (this            ║
# ║                    file, post-review rev 2). The examples/rosetta/           ║
# ║                    copy does NOT exist until the RUN creates it at           ║
# ║                    sheet 19 (T6), which proves sha256 equality and           ║
# ║                    mzt-validates each copy FROM ITS INSTALLED PATH.          ║
# ║                    (Rev 1's header described this run-time outcome           ║
# ║                    as a present fact — review 3's first finding.             ║
# ║                    Fixed by saying what is true now.) The self-chain          ║
# ║                    staging in sheet 1 references the score by its            ║
# ║                    slug basename via {{ score_dir }} — the file must be       ║
# ║                    named cathedral-construction.yaml wherever it runs.        ║
# ║                                                                                ║
# ║  LIVE-PROBED     : Every data-fetch form in sheet 2 was executed             ║
# ║                    against the live endpoints at composition time            ║
# ║                    (2026-09-04, this revision): literal `&` query            ║
# ║                    separators (rev 1's %26 forms returned HTTP 400),         ║
# ║                    $top within the server's 1000 cap (rev 1 asked            ║
# ║                    2000 → HTTP 400), MORT_100 pinned to                      ║
# ║                    Dim1=SEX_BTSX ∧ Dim2=AGEGROUP_YEARS0-4 ∧ 2015–2021        ║
# ║                    → exactly 672 rows, single fetch, no pagination           ║
# ║                    (unfiltered it is 1890 rows — over the cap); the          ║
# ║                    rate indicator is MDG_0000000007 (under-five              ║
# ║                    mortality rate, 280 rows) — rev 1 paired the              ║
# ║                    under-5 death COUNT with the INFANT rate                  ║
# ║                    (MDG_0000000001): mismatched populations; WHS4_100        ║
# ║                    (DTP3) and WHS4_117 (HepB3) filtered to the six          ║
# ║                    course countries → 66 rows each; OWID grapher CSV         ║
# ║                    header + 21,565 rows confirmed. The grammar was           ║
# ║                    verified by EXECUTION this time, not extrapolated.        ║
# ║                                                                                ║
# ║  EXECUTION MAP   : (3 movements → 21 sheets, serial; no fan-out — the        ║
# ║                    parallel-drafting declension is recorded in 03-           ║
# ║                    architecture.md: longitudinal coherence and voice         ║
# ║                    consistency are what serial drafting protects)            ║
# ║                                                                                ║
# ║      1  C1 Scaffold + host/auth/family gates + chain staging [AI]            ║
# ║      2  C2 Data commissioning + semantic pin gate        [CLI, no fallback]  ║
