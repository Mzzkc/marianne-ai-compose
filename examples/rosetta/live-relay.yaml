    def record(kind, name, r, expect_text=None):
        observed = "pass" if r.returncode == 0 else "fail"
        matched = True
        if kind == "negative":
            ok = r.returncode != 0
            if expect_text:
                matched = expect_text in (r.stdout + r.stderr)
                ok = ok and matched
        else:
            ok = r.returncode == 0
        controls.append({"control": name, "kind": kind, "expected": "pass" if kind == "positive" else "fail",
