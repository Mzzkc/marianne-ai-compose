        (out / ("episode-%d.chapters.json" % i)).write_text(json.dumps(chapters, indent=2))
        after = len(text.split())
        if abs(after - expected_words) > 0.03 * max(1, expected_words):
            print("FAIL: episode %d spoken-word drift %d -> %d" % (i, expected_words, after))
