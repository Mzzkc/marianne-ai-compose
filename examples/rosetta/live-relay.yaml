    import json, sys
    from pathlib import Path
    chapters = json.loads(Path(sys.argv[1]).read_text())
    pauses = json.loads(Path(sys.argv[2]).read_text())
    words = len(Path(sys.argv[3]).read_text(encoding="utf-8").split())
    dur = float(sys.argv[4])
    out = Path(sys.argv[5])
    rate = dur / max(1, words)
    centers = [(a + b) / 2.0 for a, b in pauses]
