    {{ strict() }}
    # The pre-registered band: max cross-vendor adjacent drift <= max
    # intra-episode baseline drift, over z-scored signatures (features
    # standardized across the episode corpus — Burrows' own normalization;
    # rev 1's raw absolute distances were uncalibrated). Intra halves are the
    # baseline precisely so flattening one's own voice into generic prose
    # does not pass. This is a rupture detector, and says so in its output.
    cat > scripts/stylometry.py <<'PY'
    import json, re, statistics, sys
    from pathlib import Path
    import numpy as np
    ws = Path(sys.argv[1])
    N = {{ n_episodes }}
    FUNC = ["the", "and", "of", "to", "in", "a", "it", "that", "was", "is", "he",
            "she", "for", "on", "with", "as", "her", "his", "at", "but", "not",
            "this", "there", "from", "they", "which", "one", "all", "would",
            "so", "even", "into", "than", "when", "what", "up", "out", "if",
            "no", "then"]
    def signature(text):
        words = re.findall(r"[A-Za-z']+", text.lower())
        n = max(1, len(words))
        freqs = [words.count(w) / n for w in FUNC]
        sents = [len(re.findall(r"[A-Za-z']+", s)) for s in re.split(r"[.!?\n]+", text) if s.strip()]
        mean = statistics.mean(sents) if sents else 0.0
        std = statistics.pstdev(sents) if len(sents) > 1 else 0.0
        ttr = len(set(words)) / n
        punct = (text.count(",") + text.count(";") + text.count(":")) / max(1, len(text)) * 100.0
        return np.array(freqs + [mean / 30.0, std / 30.0, ttr, punct / 10.0], dtype=float)
    eps = [(ws / ("episode-%d.md" % i)).read_text(encoding="utf-8") for i in range(1, N + 1)]
    sigs = [signature(t) for t in eps]
    A = np.array(sigs)
    mu = A.mean(axis=0)
    sd = np.maximum(A.std(axis=0), 1e-3)
    def z(s):
        return (s - mu) / sd
    def dist(a, b):
        return float(np.abs(a - b).sum())
    zsigs = [z(s) for s in sigs]
    intra = []
    for t in eps:
        w = t.split()
        mid = len(w) // 2
        intra.append(dist(z(signature(" ".join(w[:mid]))), z(signature(" ".join(w[mid:])))))
    cross = [dist(zsigs[i], zsigs[i + 1]) for i in range(N - 1)]
    ok = max(cross) <= max(intra)
    table = {
        "band": "max cross-vendor adjacent-episode drift <= max intra-episode baseline drift",
        "method": "Manhattan distance over function-word/rhythm signatures, z-scored across the episode corpus (Burrows-delta-lite); rupture detector, not listener-experience proof; n=%d episodes" % N,
        "features_zscored": True,
        "intra_episode_baseline": [round(x, 6) for x in intra],
        "cross_vendor_adjacent": [round(x, 6) for x in cross],
        "max_intra": round(max(intra), 6),
        "max_cross": round(max(cross), 6),
        "verdict": "PASS" if ok else "FAIL",
    }
    (ws / "drift-table.json").write_text(json.dumps(table, indent=2))
    lines = ["# Voice-drift table (Burrows-delta-lite, z-scored)", "",
             "Band (pre-registered): " + table["band"], "",
             "Method: " + table["method"], "",
             "| measure | value |", "|---|---|"]
    for i, x in enumerate(intra, 1):
        lines.append("| intra-episode %d baseline | %.6f |" % (i, x))
    for i, x in enumerate(cross, 1):
        lines.append("| cross-vendor episodes %d-%d | %.6f |" % (i, i + 1, x))
    lines += ["", "max intra %.6f / max cross %.6f -> %s"
              % (table["max_intra"], table["max_cross"], table["verdict"])]
    (ws / "drift-table.md").write_text("\n".join(lines) + "\n")
    print("stylometry:", table["verdict"], "cross", table["max_cross"], "<= intra", table["max_intra"])
    sys.exit(0 if ok else 1)
    PY
