    items = SafeET.parse(tmp / "feed.rss").getroot().findall("./channel/item")
    chk("deployed feed carries %d items" % N, len(items) == N, str(len(items)))
    if len(items) != N:
        seal["ok"] = False
        (ws / "recompute-seal.json").write_text(json.dumps(seal, indent=2))
        sys.exit(1)
    enclosures = [it.find("enclosure").get("url") for it in items]
    for n in range(1, N + 1):
        fetch(origin + ("evidence/episode-%d.md" % n), tmp / ("episode-%d.md" % n))
    fetch(origin + "scripts/stylometry.py", tmp / "stylometry.py")
    r = subprocess.run([sys.executable, str(tmp / "stylometry.py"), str(tmp)],
                       capture_output=True, text=True)
    chk("published stylometry script passes on published texts", r.returncode == 0,
        (r.stdout + r.stderr)[-200:])
    run_drift = json.loads((tmp / "drift-table.json").read_text())
    own_drift = json.loads((ws / "drift-table.json").read_text())
    same = (run_drift["intra_episode_baseline"] == own_drift["intra_episode_baseline"]
            and run_drift["cross_vendor_adjacent"] == own_drift["cross_vendor_adjacent"]
            and run_drift["verdict"] == own_drift["verdict"] == "PASS")
    chk("published episode bytes reproduce the drift table exactly", same,
        "cross %s vs %s" % (run_drift.get("max_cross"), own_drift.get("max_cross")))
    own_loud = json.loads((ws / "dist" / "loudness.json").read_text())
    worst = 0.0
    for n in range(1, N + 1):
        p = tmp / ("episode-%d.m4a" % n)
        fetch(enclosures[n - 1], p)
        digest = hashlib.sha256(p.read_bytes()).hexdigest()
        local = hashlib.sha256((ws / "dist" / ("episode-%d.m4a" % n)).read_bytes()).hexdigest()
        seal["published"]["episode-%d.m4a" % n] = digest
        chk("enclosure %d bytes identical to local dist (sha256)" % n, digest == local,
            "%s vs %s" % (digest[:16], local[:16]))
        r = subprocess.run(["ffmpeg", "-hide_banner", "-nostats", "-i", str(p),
                            "-filter_complex", "ebur128=peak=true", "-f", "null", "-"],
                           capture_output=True, text=True)
        i = re.search(r"Integrated loudness:\s*\n\s*I:\s+(-?\d+\.?\d*)\s*LUFS", r.stderr)
        assert i, "ebur128 summary missing for published episode %d" % n
        worst = max(worst, abs(float(i.group(1)) - own_loud["dist/episode-%d.m4a" % n]["lufs"]))
    chk("published audio loudness matches the run within 0.1 LU", worst <= 0.1,
        "worst delta %.3f LU" % worst)
    seal["recomputed"]["max_lufs_delta"] = worst
    seal["ok"] = all(c["ok"] for c in seal["checks"])
    (ws / "recompute-seal.json").write_text(json.dumps(seal, indent=2))
    print("recompute seal:", "PASS" if seal["ok"] else "FAIL")
    sys.exit(0 if seal["ok"] else 1)
