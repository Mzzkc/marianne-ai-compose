    # Proof-Carrying Artifact closes: a seal that stays in the workspace
    # proves nothing. The recompute seal, receipts, live gate, link check,
    # canary, and both verdicts are pushed to evidence/terminal/, the Pages
    # build is bound to the pushed commit, and every seal is re-fetched and
