      cd {workspace}
      curl -sf --retry 4 --retry-delay 5 "$(cat validation/site-url.txt)feed.rss" -o validation/live-refeed.rss
      .venv/bin/python -c "
      import os, subprocess
      import defusedxml.ElementTree as ET
      items = ET.parse('validation/live-refeed.rss').getroot().findall('./channel/item')
      enc = items[0].find('enclosure')
      head = subprocess.run(['curl', '-sI', '--retry', '3', enc.get('url')], capture_output=True, text=True).stdout
      status = head.splitlines()[0].strip() if head else ''
      clen = [l.split(':', 1)[1].strip() for l in head.splitlines()
              if l.lower().startswith('content-length:')][0]
      assert status.endswith(' 200'), status
      assert clen == str(os.path.getsize('dist/episode-1.m4a')), (clen, os.path.getsize('dist/episode-1.m4a'))
      print('fresh live probe: the RUNNING deployment serves exact bytes')
