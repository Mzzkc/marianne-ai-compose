        for n in range(1, N + 1):
            shutil.copy(ws / "dist" / ("episode-%d.m4a" % n), t / "dist" / ("episode-%d.m4a" % n))
            size = os.path.getsize(t / "dist" / ("episode-%d.m4a" % n)) + (777 if n == 3 else 0)
            parts.append('<item><itunes:author>x</itunes:author><enclosure url="https://example.invalid/a.m4a" length="%d" type="audio/x-m4a"/></item>' % size)
        parts.append('</channel></rss>')
        (t / "dist" / "feed.rss").write_text("".join(parts))
        record("negative", "feed gate refuses an inflated enclosure length",
               run([VENV, str(ws / "scripts" / "build_feed.py"), str(t), "check",
