        return r
    def measure(wav):
        r = cap(["ffmpeg", "-hide_banner", "-nostats", "-i", wav,
                 "-af", "loudnorm=I=%d:TP=%.1f:LRA=%d:print_format=json" % (I_T, TP_C, LRA_T),
                 "-f", "null", "-"])
        m = re.search(r"\{[^{}]*\"input_i\"[^{}]*\}", r.stderr, re.S)
        assert m, "loudnorm measurement JSON missing for " + wav
        d = json.loads(m.group(0))
        return d["input_i"], d["input_tp"], d["input_lra"], d["input_thresh"]
    def ebur128(p):
        r = cap(["ffmpeg", "-hide_banner", "-nostats", "-i", p,
                 "-filter_complex", "ebur128=peak=true", "-f", "null", "-"])
        i = re.search(r"Integrated loudness:\s*\n\s*I:\s+(-?\d+\.?\d*)\s*LUFS", r.stderr)
        tp = re.search(r"True peak:\s*\n\s*Peak:\s+(-?\d+\.?\d*)\s*dBFS", r.stderr)
        assert i and tp, "ebur128 summary missing for " + p
        return float(i.group(1)), float(tp.group(1))
    receipt = {}
    for n in range(1, N + 1):
        wav = "audio/episode-%d.mixed.wav" % n
        mi, mtp, mlra, mth = measure(wav)
        accepted = None
        for rung in (x * 0.5 for x in range(-4, -9, -1)):
            af = ("loudnorm=I=%d:TP=%.1f:LRA=%d:measured_I=%s:measured_TP=%s:"
                  "measured_LRA=%s:measured_thresh=%s"
                  % (I_T, rung, LRA_T, mi, mtp, mlra, mth))
            pre = "dist/episode-%d.pre.m4a" % n
            cap(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", wav,
                 "-af", af, "-ar", "44100", "-c:a", "aac", "-b:a", "{{ aac_bitrate }}", pre])
            lufs, tp = ebur128(pre)
            if LO <= lufs <= HI and tp <= TP_C:
                accepted = (pre, rung, lufs, tp)
                break
            Path(pre).unlink()
        assert accepted, "episode %d: no TP rung in [-2.0,-4.0] landed both bands" % n
        pre, rung, lufs, tp = accepted
        cap(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", pre,
             "-f", "ffmetadata", "-i", "audio/episode-%d.ffmeta" % n,
             "-map", "0", "-map_metadata", "0", "-map_chapters", "1", "-c", "copy",
             "dist/episode-%d.m4a" % n])
        Path(pre).unlink()
        receipt["dist/episode-%d.m4a" % n] = {"lufs": lufs, "true_peak_dbfs": tp, "tp_rung": rung}
        print("episode %d mastered: %.1f LUFS, %.2f dBTP (TP rung %.1f)" % (n, lufs, tp, rung))
    Path("dist/loudness.json").write_text(json.dumps(receipt, indent=2))
    print("loudness receipt:", json.dumps(receipt))
