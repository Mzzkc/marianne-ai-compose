    cat > scripts/normalize_tts.py <<'PY'
    import json, re, sys
    from pathlib import Path
    ws = Path(sys.argv[1])
    N = {{ n_episodes }}
    for i in range(1, N + 1):
        src = (ws / ("episode-%d.md" % i)).read_text(encoding="utf-8")
        lines = src.splitlines()
        if lines and lines[0].startswith("Written by:"):
            lines = lines[1:]
        oq_idx = [k for k, ln in enumerate(lines) if ln.startswith("OPEN QUESTION:")]
        if oq_idx:
            k = oq_idx[-1]
            lines = lines[:k] + lines[k + 1:]
        cleaned = "\n".join(lines)
        expected_words = len(cleaned.split())
        parts = re.split(r"^##\s+(.+)$", cleaned, flags=re.M)
        chapters = []
        body = parts[0]
        offset = len(parts[0].split())
        if parts[0].strip():
            chapters.append({"chapter": "Cold open", "word_offset": 0})
        for j in range(1, len(parts), 2):
            title = parts[j].strip()
            seg = parts[j + 1] if j + 1 < len(parts) else ""
            chapters.append({"chapter": title, "word_offset": offset})
            offset += 1 + len(seg.split())
            body += "\n\n" + title + ".\n" + seg
