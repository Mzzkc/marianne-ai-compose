    .venv/bin/python - <<'PY'
    import hashlib, json, time, urllib.request
    from pathlib import Path
    origin = Path("validation/site-url.txt").read_text().strip()
    names = ["recompute-seal.json", "receipts-report.json", "live-gate.json",
             "link-check.json", "canary-report.json", "identity-verdict.json",
             "continuity-verdict.json"]
    def fetch(url, tries=6, delay=10):
        for _ in range(tries):
            try:
                with urllib.request.urlopen(url, timeout=30) as r:
                    return r.read()
            except Exception:
                time.sleep(delay)
        raise SystemExit("live fetch failed: " + url)
    receipt = {"deployed_commit": Path("validation/deployed-sha.txt").read_text().strip(),
               "artifacts": []}
    for name in names:
        local = (Path("publish/evidence/terminal") / name).read_bytes()
        remote = fetch(origin + "evidence/terminal/" + name)
        digest = hashlib.sha256(local).hexdigest()
        live_ok = hashlib.sha256(remote).hexdigest() == digest
        receipt["artifacts"].append({"artifact": name, "sha256": digest, "live_ok": live_ok})
        assert live_ok, name + " differs live"
    receipt["ok"] = all(a["live_ok"] for a in receipt["artifacts"])
    Path("terminal-publish.json").write_text(json.dumps(receipt, indent=2))
    print("terminal publish: %d seals live and hash-exact at commit %s"
          % (len(names), receipt["deployed_commit"][:12]))
