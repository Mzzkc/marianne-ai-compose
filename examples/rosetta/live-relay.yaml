    seal = {"surface": "live feed + deployed site", "published": {}, "recomputed": {}, "checks": []}
    def chk(name, ok, detail=""):
        seal["checks"].append({"check": name, "ok": bool(ok), "detail": str(detail)})
    def fetch(url, dest, tries=5, delay=8):
        last = ""
        for _ in range(tries):
            try:
                urllib.request.urlretrieve(url, str(dest))
                return
            except Exception as e:
                last = str(e)
                time.sleep(delay)
        raise SystemExit("fetch failed after %d tries: %s (%s)" % (tries, url, last))
