# =============================================================================
# VALIDATIONS — staged fail-fast (Commissioning Cascade): coarse before fine
# per movement, and every load-bearing claim is a deterministic command with
# an exit code, never LLM judgment. `condition: sheet_num == N` selects the
# movement (no fan-out, so sheet_num == movement); the `stage:` field orders
# rules within a sheet. Values, not shapes: LUFS, wpm, byte counts, sha256s,
# commit shas — never bare file existence.
# =============================================================================
validations:
  # ── M1 · runtime-build ────────────────────────────────────────────────────
  - type: command_succeeds
    command: '{workspace}/.venv/bin/python -c "import numpy, scipy, PIL, yaml, jsonschema, edge_tts, defusedxml; print(''stack importable'')"'
    condition: "sheet_num == 1"
    stage: 1
    description: "Pinned stack importable in the dedicated venv (never the ambient interpreter)"
  - type: command_succeeds
    command: |
      for pkg in numpy scipy Pillow PyYAML jsonschema edge-tts piper-tts defusedxml; do
        grep -q "^${pkg}==" {workspace}/data/requirements.freeze
      done
      test -s {workspace}/voices/MANIFEST.sha256
      test -s "{workspace}/voices/{piper_model_name}.onnx"
      echo "{piper_onnx_sha256}  {workspace}/voices/{piper_model_name}.onnx" | sha256sum -c -
      echo "{piper_json_sha256}  {workspace}/voices/{piper_model_name}.onnx.json" | sha256sum -c -
    condition: "sheet_num == 1"
    stage: 1
    description: "Every load-bearing package pinned in the freeze; voice model bytes match the composition-time digests (source authenticity)"

  # ── M2 · self-canary: identity and calibration, not command success ──────
  - type: command_succeeds
    command: |
      test "$(gh api user -q .login)" = {github_owner}
      command -v jq >/dev/null
      {workspace}/.venv/bin/python -c "
      import json
      r = json.load(open('{workspace}/canary-report.json'))
      assert r['gh_user'] == '{github_owner}', r['gh_user']
      assert r['jq'] == 'ready', r['jq']
      for k in ('claude-code', 'codex-cli', 'opencode'):
          assert r['instruments'][k] == 'ready', (k, r['instruments'])
      assert r['edge_tts']['duration_s'] >= 1.0, r['edge_tts']
      assert r['piper']['duration_s'] >= 1.0, r['piper']
      m = r['master_landing']
      assert abs(m['lufs'] - ({lufs_target})) <= {lufs_tol}, m
      assert m['true_peak_dbfs'] <= {tp_ceiling}, m
      print('canary evidence ok: owner, instruments, jq, both TTS paths, measured master landing')
      "
    condition: "sheet_num == 2"
    stage: 1
    description: "Self-canary: gh identity matches the publisher, relay instruments ready, jq present, both TTS paths real, master chain landed in band on real TTS bytes"

  # ── M3 · tune: structure only — the story is the performer's authority ────
  - type: file_exists
    path: "{workspace}/performance-identity.md"
    condition: "sheet_num == 3"
    stage: 1
    description: "Performance identity exists"
  - type: file_exists
    path: "{workspace}/relay-packet-0.yaml"
    condition: "sheet_num == 3"
    stage: 1
    description: "Seed relay packet exists"
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      from pathlib import Path
      import yaml
      ident = Path('{workspace}/performance-identity.md')
      size = ident.stat().st_size
      text = ident.read_text(encoding='utf-8')
      assert size <= {identity_cap_bytes}, '%d bytes over the Identity-as-script cap' % size
      assert len(text.strip()) >= {identity_min_chars}, 'identity too thin'
      assert text.lstrip().startswith('# '), 'identity must open with the title heading'
      p = yaml.safe_load(Path('{workspace}/relay-packet-0.yaml').read_text())
      assert isinstance(p, dict) and p.get('beat') == 0, repr(p.get('beat'))
      for k in ('unresolved_motifs', 'tonal_commitments', 'hazards'):
          v = p.get(k)
          assert isinstance(v, list) and v and all(isinstance(x, str) and x.strip() for x in v), k
      assert isinstance(p.get('continuation_point'), str) and len(p['continuation_point'].strip()) >= 20
      print('tune output structurally admitted')
      "
    condition: "sheet_num == 3"
    stage: 2
    description: "Identity inside the compactness cap with title heading; packet-0 beat 0, all contract fields TYPED (lists of non-empty strings)"

  # ── M4 · identity gate: verdict + re-run + staged relay gates ─────────────
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import json
      v = json.load(open('{workspace}/identity-verdict.json'))
      assert v['ok'] is True, [c for c in v['checks'] if not c['ok']]
      print('identity verdict admitted')
      "
    condition: "sheet_num == 4"
    stage: 1
    description: "Identity verdict admitted by the deterministic gate"
  - type: command_succeeds
    command: '{workspace}/.venv/bin/python {workspace}/scripts/check_identity.py {workspace} {identity_cap_bytes} {identity_min_chars} && {workspace}/.venv/bin/python -c "import ast; [ast.parse(open(''{workspace}/scripts/'' + f).read()) for f in (''check_identity.py'', ''check_episode.py'')]; print(''gate re-run reproduces the verdict; episode gate staged and parseable'')"'
    condition: "sheet_num == 4"
    stage: 2
    description: "Gate re-run reproduces the verdict; the typed episode gate is staged and parseable; rotation/count consistency asserted in the movement"

  # ── M5-M9 · voices: the relay's per-sheet contract ────────────────────────
  # (attribution joins the declared rotation; stepwise handoff + closed-loop
  # pickup prove consumption; method is never graded — Mission Command)
  - type: command_succeeds
    command: '{workspace}/.venv/bin/python {workspace}/scripts/check_episode.py {workspace} {sheet_num} {words_lo} {words_hi}'
    condition: "sheet_num >= 5 and sheet_num <= 9"
    stage: 1
    description: "Episode gate: attribution matches the rotation, calibrated word window, >=2 chapters, open question in the final fifth, outgoing beat == incoming + 1, every incoming motif carried, an incoming motif played by name"

  # ── M10 · continuity gate: the pattern's named seam ───────────────────────
  - type: command_succeeds
    command: '{workspace}/.venv/bin/python {workspace}/scripts/check_relay.py {workspace}'
    condition: "sheet_num == 10"
    stage: 1
    description: "Continuity gate: chain 0-5 unbroken, beats monotonic, typed packets, STEPWISE motif custody at every handoff, resolutions reference open motifs, attribution on all five"
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import json
      ledger = json.load(open('{workspace}/relay-ledger.json'))
      assert len(ledger['packets']) == 6
      assert [p['beat'] for p in ledger['packets']] == [0, 1, 2, 3, 4, 5]
      assert all(p['sha256'] and len(p['sha256']) == 64 for p in ledger['packets'])
      assert len(ledger['episodes']) == 5
      assert 'attribution_basis' in ledger, 'ledger must state what attribution does and does not prove'
      print('derived ledger consistent')
      "
    condition: "sheet_num == 10"
    stage: 2
    description: "Derived relay ledger: six sealed packets in beat order, five attributed episodes, attribution basis disclosed"

  # ── M11 · stylometry: the pre-registered band ─────────────────────────────
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import json
      t = json.load(open('{workspace}/drift-table.json'))
      assert t['verdict'] == 'PASS', t
      assert t['features_zscored'] is True, t.get('method')
      assert len(t['intra_episode_baseline']) == 5 and len(t['cross_vendor_adjacent']) == 4
      assert t['max_cross'] <= t['max_intra'], t
      assert 'rupture detector' in t['method'], 'method must state its own scope'
      "
      test -s {workspace}/drift-table.md
    condition: "sheet_num == 11"
    stage: 1
    description: "Drift verdict PASS against the pre-registered band over z-scored signatures; method self-describes as a rupture detector"

  # ── M12 · assembler: mechanical joins, verbatim containment ───────────────
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      from pathlib import Path
      ws = Path('{workspace}')
      whole = (ws / 'performance.md').read_text(encoding='utf-8')
      assert whole.count('## Episode ') >= 5, 'not five episode sections'
      missing = []
      for n in range(1, 6):
          text = (ws / ('episode-%d.md' % n)).read_text(encoding='utf-8')
          paras = [p.strip() for p in text.split('\n\n') if len(p.strip()) >= 25]
          assert len(paras) >= 3, 'episode %d has only %d substantive paragraphs' % (n, len(paras))
          for p in paras:
              if p not in whole:
                  missing.append((n, p[:60]))
      assert not missing, missing[:3]
      print('assembly contains every episode paragraph verbatim')
      "
    condition: "sheet_num == 12"
    stage: 1
    description: "Anti-laundering gate: every substantive episode paragraph appears verbatim in the assembly — rewording fails"

  # ── M13 · TTS normalization: markers never spoken, offsets on spoken words ─
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import json
      from pathlib import Path
      ws = Path('{workspace}')
      for n in range(1, 6):
          src = (ws / ('episode-%d.md' % n)).read_text(encoding='utf-8')
          lines = src.splitlines()
          if lines and lines[0].startswith('Written by:'):
              lines = lines[1:]
          oq = [k for k, ln in enumerate(lines) if ln.startswith('OPEN QUESTION:')]
          if oq:
              k = oq[-1]
              lines = lines[:k] + lines[k + 1:]
          expected = len('\n'.join(lines).split())
          txt = (ws / 'audio' / ('episode-%d.txt' % n)).read_text(encoding='utf-8')
          low = txt.lower()
          assert 'written by:' not in low, (n, 'byline would be spoken')
          assert 'open question:' not in low, (n, 'marker would be spoken')
          assert abs(len(txt.split()) - expected) <= 0.03 * max(1, expected), (n, expected, len(txt.split()))
          ch = json.loads((ws / 'audio' / ('episode-%d.chapters.json' % n)).read_text())
          assert len(ch) >= 2, (n, ch)
          assert all(0 <= c['word_offset'] <= len(txt.split()) for c in ch), n
      print('normalization: markers stripped from speech, chapters on spoken words, all five round-trip')
      "
    condition: "sheet_num == 13"
    stage: 1
    description: "Speech text contains neither machine marker; spoken-word count round-trips within 3% against the marker-stripped source; chapter offsets map into the spoken text"

  # ── M14 · synthesis: measured experience predicates at pinned rates ───────
  - type: command_succeeds
    command: |
      cd {workspace}
      for n in 1 2 3 4 5; do
        .venv/bin/python scripts/check_audio.py "audio/episode-$n.voice.audio" "audio/episode-$n.txt" {dead_air_s} {cold_open_s} {dur_lo_s} {dur_hi_s} {wpm_lo} {wpm_hi}
        test -s "audio/episode-$n.pauses.json"
      done
      test "$(jq length audio/tts-choices.json)" -eq 5
    condition: "sheet_num == 14"
    stage: 1
    description: "Every episode: audio stream, 4-7 min, rate in the calibrated diagnostic band, first speech <=15s, no mid-episode dead air >3s; engine choice and pause map recorded"

  # ── M15 · bed and mix: level relationships measured per episode ───────────
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import re, subprocess
      from pathlib import Path
      ws = Path('{workspace}')
      def mean_volume(p):
          r = subprocess.run(['ffmpeg', '-hide_banner', '-nostats', '-i', str(p),
                              '-af', 'volumedetect', '-f', 'null', '-'],
                             capture_output=True, text=True)
          m = re.search(r'mean_volume:\s*(-?[\d.]+) dB', r.stderr + r.stdout)
          return float(m.group(1))
      def dur(p):
          out = subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                                '-of', 'csv=p=0', str(p)], capture_output=True, text=True)
          return float(out.stdout.strip())
      for n in range(1, 6):
          v = ws / ('audio/episode-%d.voice.audio' % n)
          m = ws / ('audio/episode-%d.mixed.wav' % n)
          b = ws / ('audio/episode-%d.bed.wav' % n)
          assert abs(dur(v) - dur(m)) <= 0.5, n
          assert abs(mean_volume(v) - mean_volume(m)) <= 3.0, n
          assert mean_volume(b) <= mean_volume(m) - 8.0, (n, mean_volume(b), mean_volume(m))
      print('mix gates: durations preserved, voice level preserved, bed >=8dB under the mix for EVERY episode')
      "
    condition: "sheet_num == 15"
    stage: 1
    description: "Per-episode mix duration within 0.5s of voice; level preserved; bed at least 8 dB under the mix — measured for all five, not extrapolated from one"

  # ── M16 · mastering: calibrated AES window on the ENCODED files ───────────
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import json, subprocess
      from pathlib import Path
      ws = Path('{workspace}')
      loud = json.loads((ws / 'dist' / 'loudness.json').read_text())
      LO = {lufs_target} - {lufs_tol}
      HI = {lufs_target} + {lufs_tol}
      for n in range(1, 6):
          key = 'dist/episode-%d.m4a' % n
          assert key in loud, key
          assert LO <= loud[key]['lufs'] <= HI, (key, loud[key]['lufs'])
          assert loud[key]['true_peak_dbfs'] <= {tp_ceiling}, (key, loud[key]['true_peak_dbfs'])
          r = subprocess.run(['ffprobe', '-v', 'error', '-show_chapters', '-of', 'json',
                              str(ws / key)], capture_output=True, text=True)
          chapters = json.loads(r.stdout)['chapters']
          assert len(chapters) >= 2, (key, len(chapters))
          starts = [float(c['start_time']) for c in chapters]
          ends = [float(c['end_time']) for c in chapters]
          assert starts[0] <= 1.0, (key, starts[0])
          for i in range(len(chapters) - 1):
              assert starts[i + 1] >= ends[i], (key, i, 'overlapping chapters')
          d = subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                              '-of', 'csv=p=0', str(ws / key)], capture_output=True, text=True)
          assert ends[-1] <= float(d.stdout.strip()) + 0.1, (key, ends[-1])
      print('mastering gates: LUFS band, encoded true peak <= ceiling, chapters ordered and non-overlapping')
      "
    condition: "sheet_num == 16"
    stage: 1
    description: "Encoded files: integrated loudness in the AES window (anchored summary parse), true peak <= -1.5 dBFS with the -2.0 loudnorm target, chapters ordered, non-overlapping, inside the file"
  - type: command_succeeds
