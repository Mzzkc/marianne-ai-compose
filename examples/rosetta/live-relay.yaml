            "across three vendors, with open per-episode machine attribution.")
        ET.SubElement(channel, "language").text = "en"
        ET.SubElement(channel, it("author")).text = "Five Hands relay (machine-authored)"
        ET.SubElement(channel, it("image"), {"href": origin + "audio/cover-feed.png"})
