    identity for a five-episode serialized audio drama, plus the first relay
    packet. You are the only writer this run who sees the whole intent; every
    later voice sees only what you leave on disk.

    ### Commander's intent (this is intent, NOT a plot — do not script episodes)
    - PURPOSE: prove that a serial's living identity can be carried by
