        if i == 0:
            t = 0.0
        else:
            cands = [x for x in centers if abs(x - pred) <= 6.0]
            t = min(cands, key=lambda x: abs(x - pred)) if cands else pred
        floor = (times[-1] + 1.0) if times else 0.0
        if t <= floor:
            t = floor
        times.append(min(t, max(0.0, dur - 1.0)))
    assert all(times[i] < times[i + 1] for i in range(len(times) - 1)), \
        "chapter starts not strictly increasing: %s" % times
    lines = [";FFMETADATA1"]
    for i, c in enumerate(chapters):
        start = times[i]
