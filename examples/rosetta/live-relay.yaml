      built="$(gh api "repos/{{ github_owner }}/{{ repo_name }}/pages/builds/latest" --jq '"\(.status) \(.commit)"' 2>/dev/null || true)"
      status="${built%% *}"; built_sha="${built#* }"
      if [ "$status" = "built" ] && [ -n "$built_sha" ]; then
        case "$local_sha" in "$built_sha"*) ok=1; break;; esac
