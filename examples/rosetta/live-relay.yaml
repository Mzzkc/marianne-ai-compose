    cat > scripts/check_relay.py <<'PY'
    import hashlib, json, sys
    from pathlib import Path
    import yaml
    ws = Path(sys.argv[1])
    ROTATION = {{ rotation }}
    N = {{ n_episodes }}
    report = {"checks": []}
    def chk(name, ok, detail=""):
        report["checks"].append({"check": name, "ok": bool(ok), "detail": str(detail)})
    def typed(p):
        if not isinstance(p, dict):
            return False
        for k in ("unresolved_motifs", "tonal_commitments", "hazards"):
            v = p.get(k)
            if not (isinstance(v, list) and v and all(isinstance(x, str) and x.strip() for x in v)):
                return False
        r = p.get("resolved_motifs")
        if r is not None and not (isinstance(r, list) and all(isinstance(x, str) and x.strip() for x in r)):
            return False
        return (isinstance(p.get("continuation_point"), str)
                and len(p["continuation_point"].strip()) >= 20)
    packets = []
    for i in range(0, N + 1):
        path = ws / ("relay-packet-%d.yaml" % i)
        if not path.exists():
            chk("packet-%d exists" % i, False)
            packets.append(None)
            continue
        raw = path.read_bytes()
        p = yaml.safe_load(raw.decode("utf-8"))
        packets.append((i, p, hashlib.sha256(raw).hexdigest()))
        chk("packet-%d parses" % i, isinstance(p, dict))
        if isinstance(p, dict):
