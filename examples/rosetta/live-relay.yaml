# =============================================================================
# FIVE HANDS, ONE VOICE — Live Relay proof score (rev 2)
# Revised 2026-09-04 by rosetta-prove sheet 8 against three adversarial
# reviews (05-review-1.md Practitioner, 05-review-2.md Skeptic,
# 05-review-3.md Newcomer — all "needs revision"). Composed from
# 01-selection.md / 02-decomposition.md / 03-architecture.md /
# 04-composition-notes.md.
#
# PRIMARY PATTERN : Live Relay — a serial authored by rotating instruments
#                   across THREE vendors (claude-code -> codex-cli -> opencode
#                   -> codex-cli -> claude-code), where identity is
#                   workspace-resident, not context-resident. Each voice sheet
#                   receives ONLY the performance identity plus the incoming
#                   relay packet (a playable cue; beat = incoming + 1).
# COMPOSING       : Stigmergic Workspace (the filesystem is the one channel
#                   three vendors share — packets, episodes, and the derived
#                   ledger live on disk; successors read disk, never messages),
#                   The Etiquette Law (every continuity / stylometric /
#                   acoustic / feed / live check is a CLI command with an exit
#                   code and an EMPTY fallback chain — a tool stage that
#                   silently falls back to an LLM is a lie with a receipt),
#                   Mission Command (gates validate outcomes, never method; the
#                   tune sheet authors identity under an intent envelope and
#                   may NOT plot the episodes — the identity size cap is the
#                   anti-Identity-as-script gate),
#                   Canary Probe (movement 2 probes gh identity-as-owner, the
#                   THREE RELAY INSTRUMENTS via mzt, jq, both TTS paths, and a
#                   full master->encode->measure landing pass — identity and
#                   calibration, not command success — before any LLM token),
#                   Closed-Loop Call (the beat rule PLUS a mechanical
#                   consumption readback: every incoming motif must be carried
#                   by the outgoing packet, and at least one incoming motif
#                   must appear by name in the episode text — a guessable beat
#                   number alone proves nothing),
#                   Succession Pipeline, scoped to the audio chain only
#                   (script -> TTS text -> voice audio -> mixed WAV -> mastered
#                   m4a -> feed item -> deployed enclosure),
#                   Proof-Carrying Artifact (evidence page, the recompute seal
#                   from the LIVE FEED SURFACE, and movement 24's terminal
#                   publish — every seal the header promises is public before
#                   the run can pass).
#
# PROBLEM SOLVED  : Serialized audio drama loses its living identity when
#                   authorship changes hands — unless the handoff itself
#                   carries the performance. This score manufactures the hard
#                   case honestly (three vendors, no shared context), then
#                   measures whether the seam is survivable: cross-vendor
#                   inter-episode drift must not exceed intra-episode baseline
#                   drift, or the run FAILS. Continuity is carried by
#                   artifacts (identity score, packet chain, ledger), never by
#                   any author's latent context — the claim is only falsifiable
#                   because the author changes.
#
# PRODUCES        : <auto-workspace>/five-hands-one-voice/ ->
#                   performance-identity.md, relay-packet-0..5.yaml,
#                   episode-1..5.md, identity/continuity verdicts,
#                   relay-ledger.json, drift-table.json/.md, performance.md,
#                   audio/*.{txt,chapters.json,pauses.json,voice.audio,
#                   mixed.wav,bed.wav}, dist/episode-N.m4a + covers +
#                   loudness.json + feed.rss, scripts/*.py (the exact gates),
#                   canary-report.json, live-gate.json, link-check.json,
#                   recompute-seal.json, receipts-report.json,
#                   terminal-publish.json — and a PUBLIC repo + GitHub Pages
#                   deployment with the audio, a subscribable RSS 2.0 podcast
#                   feed with byte-exact enclosures, the full evidence ledger
#                   (packet sha256 chain, per-episode attribution, drift table,
#                   freeze receipt, ALL terminal seals), the gate scripts
#                   published beside the art, and a scope-and-limits section
#                   that states exactly what the proof does not establish.
#
# INSTRUMENTS     : 5 categories — agents (claude-code / codex-cli / opencode
#                   as ROTATING primaries, never a fallback chain: a vendor
#                   fallback would launder the relay claim), audio (edge-tts
#                   primary / piper offline secondary at pinned rate, ffmpeg
#                   mix + loudnorm two-target mastering, ffprobe for every
#                   measurement), analysis (numpy/scipy stylometry, PyYAML
#                   schema gates, stdlib XML + defusedxml), publishing (git,
#                   gh, GitHub Pages, curl), visual (Pillow covers — flat
#                   geometric garnish).
#                   17 of 24 movements are CLI movements with EMPTY fallback
#                   chains; the 7 LLM movements (tune, five voices, assemble)
#                   also carry empty chains — the rotation IS the claim.
#
# EXECUTION MAP   : 24 serial movements, zero fan-out (the relay is serial by
#                   hypothesis; parallel authorship would be the pattern's own
#                   named failure, False Fan-out). Expanded sheets == 24.
#
#     M1  runtime-build        pinned venv + pinned-digest voice model [CLI]
#     M2  self-canary          identity + instruments + jq + TTS + master [CLI]
#     M3  tune                 performance identity + packet 0  [claude-code]
#     M4  identity-gate        compactness + typing + staged gates    [CLI]
#     M5  voice-one            episode 1 + packet 1             [claude-code]
#     M6  voice-two            episode 2 + packet 2             [codex-cli]
#     M7  voice-three          episode 3 + packet 3             [opencode]
#     M8  voice-four           episode 4 + packet 4             [codex-cli]
#     M9  voice-five           episode 5 + packet 5             [claude-code]
#     M10 continuity-gate      chain, stepwise custody, attribution  [CLI]
#     M11 stylometry           z-scored drift vs pre-registered band    [CLI]
#     M12 assemble             mechanical joins, verbatim       [codex-cli]
#     M13 tts-normalize        speech text (markers stripped) + chapters [CLI]
#     M14 synthesize           edge/piper at pinned rates + pauses  [CLI]
#     M15 bed-and-mix          ffmpeg sine bed + per-episode refs    [CLI]
#     M16 master-and-package   loudnorm + non-overlapping chapters   [CLI]
#     M17 site-and-repo        publish tree + guarded repo push      [CLI]
#     M18 feed-build           RSS 2.0, byte-exact enclosures        [CLI]
#     M19 deploy-and-wait      Pages deploy bound to commit sha      [CLI]
#     M20 live-gate            the DEPLOYED feed answers             [CLI]
#     M21 evidence-page        ledger + scope limits + build wait   [CLI]
#     M22 recompute-seal       LIVE FEED bytes reproduce the numbers [CLI]
#     M23 receipts-harness     every gate provably failable           [CLI]
#     M24 terminal-publish     seals published + verified live        [CLI]
#
# PRE-REGISTERED BAND (committed before any episode is written):
#     max cross-vendor adjacent-episode drift <= max intra-episode baseline
#     drift, over z-scored function-word/rhythm signatures. Intra-episode
#     halves are the baseline precisely so flattening one's own voice into
#     generic prose does not game the gate. This is a RUPTURE DETECTOR, not
#     proof that a listener experiences one living voice — stated on the
#     published evidence page.
#
# CALIBRATION TABLE (every constant measured on this host, 2026-09-03/04,
# by rev-2 commissioning; the Practitioner's independent measurements are
# cross-checked in 06-proof-notes.md):
#     edge-tts en-US-AriaNeural --rate=+0% : 142 wpm (dialogue) .. 192 wpm
#       (narration) — style variance ratio 1.35 makes any band narrower than
#       that ratio a deterministic run-killer (rev 1's 140-175 gate died
#       here; reproduced by reviewer AND by rev-2 commissioning).
#     piper lessac medium --length_scale 1.3 : 189 wpm (narration) — nested
#       inside edge's band so both engines honor one word window.
#     word window 790-960: 790 words @ 196 wpm = 242 s >= 240 s;
#       960 @ 138 = 417 s <= 420 s — the window GUARANTEES the duration
#       window for any style either engine speaks.
#     wpm band 135-200 is a DIAGNOSTIC of the measured voice range, not a
#       style gate; the listener-facing gates are duration and words.
#     mastering encode: AAC 192k. AAC at 128k overshoots the pre-encode
#       true peak by up to +2.4 dB on loudness-limited speech+bed content
#       (encoded +0.4 dBTP from a -2.00 dBTP WAV — rev-2 commissioning);
#       at 192k the overshoot is +0.1 dB (all five synthetic episodes
#       encoded -16.7 LUFS / -1.90 dBTP at a -2.0 target). loudnorm two-pass
#       lands the WAV at exactly the TP target; a bounded 0.5 dB TP ladder
#       (-2.0 .. -4.0) remains as a per-episode backstop that accepts the
#       first rung landing BOTH bands. Rev 1 single-passed at TP -1.5 into
#       128k AAC with no encoded-file measurement — the Practitioner
#       reproduced encoded -1.2..-1.3, a deterministic run-killer.
#     integrated loudness -16 +- 2 LUFS: measured -16.4 LUFS (narration,
#       single-pass) and -16.7 LUFS (all five mixed episodes, two-pass) on
#       the encoded files; the ebur128 numbers come from the anchored
#       summary parse (see the parsing bullet).
#     ebur128 parsing: the FIRST 'I:' line in ffmpeg stderr is a momentary
#       sample (~-70 LUFS at t~0), NOT the summary. Rev 1 regex-matched it —
#       a third run-killer no reviewer caught; rev 2 anchors on
#       'Integrated loudness:' (found by rev-2 commissioning, verified: naive
#       parse returns -70.0, anchored parse returns -16.4).
#     piper model pinned to sha256 digests below (source authenticity, not
#       just in-run integrity — a replaced upstream file is refused).
#     bed prominence: measured bed 21 dB under the mix; gate requires >= 8.
#     chapter pauses: edge-tts inserts ~1 s pauses at headings (measured);
#       chapter starts snap to the nearest detected pause center within 6 s,
#       else keep the uniform-rate prediction; END[i] = START[i+1] by
#       construction (rev 1 set every END to file duration — overlapping
#       chapters).
#
# ANTI-FABRICATION SEAMS (all deterministic, never LLM judgment):
#     - beat monotonicity 0..5; packet schema TYPED (lists of non-empty
#       strings; substantial continuation) — truthiness alone admits junk
#     - stepwise motif custody at EVERY handoff (packet i's unresolved must
#       be carried by packet i+1 as unresolved or resolved; resolved must
#       reference previously-open motifs) — a motif cannot vanish for three
#       packets and reappear (rev 1's global-set check allowed exactly that)
#     - closed-loop consumption readback: an incoming motif appears by name
#       in the episode text — delivery plus a guessable beat is not a readback
#     - attribution headers name the WRITING instrument (engine-injected via
#       instrument_name, cross-checked against the declared rotation)
#     - drift table recomputed from PUBLISHED episode bytes via the LIVE FEED
#       surface (enclosure URLs from the deployed RSS, texts from the
#       deployed site) must equal the run's table; loudness recomputed from
#       the DOWNLOADED enclosures must match within 0.1 LU
#     - enclosure bytes sha256-verified against local dist files —
#       Content-Length equality is necessary, byte identity is sufficient
#     - assembler containment: every episode paragraph appears verbatim in
#       performance.md — voice laundering detectable by construction
#     - receipts harness corrupts fixtures and requires each intended gate
#       to fail WITH ITS INTENDED ERROR TEXT (bare exit codes proved the
#       wrong thing in rev 1); zero unexpected passes
#     - terminal publish: the recompute seal, receipts report, live gate,
#       and canary report are pushed, the Pages build is bound to the pushed
#       commit sha, and every published seal is re-fetched and hash-verified
#       — a seal that stays in the workspace proves nothing
#
# GENERICITY      : no workspace field — auto-managed (#58). github_owner /
#                   repo_name / TTS voices / loudness targets / drift and
#                   window constants / the system python are variables. The
#                   episode COUNT and the ROTATION are fixed by the relay
#                   design (five hands, three vendors) and are defined ONCE
#                   each — n_episodes in variables, the rotation list at the
#                   top of the template — with movement 4 refusing a mismatch
#                   between them. Change either and you are composing a
#                   different relay, deliberately. Engine dialect honored:
#                   total_items pre-expansion; dependencies movement-keyed;
#                   cadenzas expanded-sheet-keyed; movement instrument_
#                   fallbacks override by field presence; literal {key}
#                   substitution in validation commands; no score_dir in
#                   variables (it would shadow the baton's runtime anchor).
#
# PUBLICATION POLICY: each run pushes main of repo_name. The prior-run guard
#                   (README marker, empty-repo tolerated, foreign repo
#                   refused) runs at the canary AND AGAIN at movement 17
#                   immediately before the only force-push in the score —
#                   an hour of creative work must not stand between the
#                   guard and the push it guards. Point repo_name at a name
#                   you own outright.
#
# HONESTY CAVEATS (also published on the evidence page, movement 21):
#     - Voice-sheet isolation is PROMPT-CONTRACTUAL, not sandboxed: the
#       vendor CLIs can read the workspace if they choose; nothing mechanical
#       prevents peeking, and the drift gate cannot distinguish identity
#       carried by artifacts from identity gleaned by reading ahead.
#     - The heard voice is ONE TTS speaker (Aria or piper) for all five
#       episodes: audible one-voice is manufactured by synthesis; the relay
#       carries PROSE STYLE, and the drift gate measures diction, not audio.
#     - Stylometry is a rupture detector with n=5 episodes, not proof of
#       listener experience. The cold-open gate measures onset of speech,
#       not hook quality. Chapter markers are pause-snapped approximations.
#
# USAGE           : mzt run <this-file>.yaml ; mzt status five-hands-one-voice
#                   Installed at: scores/rosetta-corpus/proof-scores/live-relay.yaml
#                   (this score self-contains its scripts; nothing outside the
#                   workspace and the published repo is required at run time)
#
# Time: ~60-120 min (TTS + Pages builds dominate) | Cost: ~$2-6 (7 LLM sheets)
# =============================================================================

name: five-hands-one-voice
description: "Live Relay proof — a five-episode audio drama authored by rotating vendor instruments, measured for voice continuity, mastered to podcast loudness, published as a live subscribable feed with its full evidence ledger and terminal seals."

# workspace: intentionally omitted — auto-managed at <workspace-root>/five-hands-one-voice (#58).

instrument: claude-code
instrument_config:
  timeout_seconds: 1800

# No score-level fallback chain: EVERY movement below declares its instrument
# and an explicit empty replacement chain. For CLI movements this is the
# Etiquette Law (tools never fall back to minds). For the relay voices it is
# the pattern's own constraint — a vendor fallback would launder the claim
# that identity crossed a vendor boundary. Transient failures are handled by
# retry (same instrument), never by substitution.

movements:
  # ── Phase A · Substrate and readiness ────────────────────────────────────
  1:
    name: "runtime-build"        # Etiquette Law: package install is deterministic
    instrument: cli
    instrument_fallbacks: []
  2:
    name: "self-canary"          # Canary Probe: cheapest exposure to every death path
    instrument: cli
    instrument_fallbacks: []
  # ── Phase B · Identity substrate (Stigmergic Workspace begins) ───────────
  3:
    name: "tune"                 # Live Relay / Mission Command: identity is intent,
    instrument: claude-code      # judgment work — the pattern names this instrument
    instrument_fallbacks: []
  4:
    name: "identity-gate"        # Etiquette Law: schema + compactness are mechanical
    instrument: cli
    instrument_fallbacks: []
  # ── Phase C · The relay: five voices, zero shared context ────────────────
  5:
    name: "voice-one"            # Live Relay: opening performer
    instrument: claude-code
    instrument_fallbacks: []
  6:
    name: "voice-two"            # Live Relay: second vendor, continues not restarts
    instrument: codex-cli
    instrument_fallbacks: []
  7:
    name: "voice-three"          # Live Relay: third vendor — the proof's hard case
    instrument: opencode
    instrument_fallbacks: []
  8:
    name: "voice-four"           # Live Relay: return engagement, two hands colder
    instrument: codex-cli
    instrument_fallbacks: []
  9:
    name: "voice-five"           # Live Relay: closing under accumulated state
    instrument: claude-code
    instrument_fallbacks: []
  # ── Phase D · Measurement ────────────────────────────────────────────────
  10:
    name: "continuity-gate"      # Live Relay / Closed-Loop Call: the pattern's gate
    instrument: cli
    instrument_fallbacks: []
  11:
    name: "stylometry"           # Etiquette Law (measurement): drift is arithmetic
    instrument: cli
    instrument_fallbacks: []
  12:
    name: "assemble"             # Live Relay: the pattern's named assembler,
    instrument: codex-cli        # caged by a purely mechanical validation
    instrument_fallbacks: []
  # ── Phase E · Audio chain (Succession Pipeline, scoped) ──────────────────
  13:
    name: "tts-normalize"        # Succession Pipeline: md -> TTS-shaped text
    instrument: cli
    instrument_fallbacks: []
  14:
    name: "synthesize"           # Succession Pipeline: text -> voice audio
    instrument: cli
    instrument_fallbacks: []
    instrument_config:
      timeout_seconds: 3600      # five episodes through a network TTS endpoint
  15:
    name: "bed-and-mix"          # Succession Pipeline: ffmpeg generators, not sox
    instrument: cli              # (ffmpeg installed, sox absent — fit, not taste)
    instrument_fallbacks: []
  16:
    name: "master-and-package"   # Succession Pipeline: loudnorm + chapters + covers
    instrument: cli
    instrument_fallbacks: []
    instrument_config:
      timeout_seconds: 3600
  # ── Phase F · Publication and live proof ─────────────────────────────────
  17:
    name: "site-and-repo"        # Etiquette Law: git + gh are API calls
    instrument: cli
    instrument_fallbacks: []
  18:
    name: "feed-build"           # Etiquette Law: deterministic RSS assembly
    instrument: cli
    instrument_fallbacks: []
  19:
    name: "deploy-and-wait"      # Dormancy-shaped poll: deployment bound to commit
    instrument: cli
    instrument_fallbacks: []
    instrument_config:
      timeout_seconds: 3600      # includes the bounded Pages build poll
  20:
    name: "live-gate"            # Proof-Carrying Artifact: the deployed feed answers
    instrument: cli
    instrument_fallbacks: []
  21:
    name: "evidence-page"        # Proof-Carrying Artifact: ledger + scope, beside art
    instrument: cli
    instrument_fallbacks: []
    instrument_config:
      timeout_seconds: 3600      # includes the post-push build wait
  22:
    name: "recompute-seal"       # Proof-Carrying Artifact: LIVE FEED bytes re-derive
    instrument: cli
    instrument_fallbacks: []
    instrument_config:
      timeout_seconds: 3600      # re-downloads all published audio, with retries
  23:
    name: "receipts-harness"     # Exploit Failure as Signal: gates must be failable
    instrument: cli
    instrument_fallbacks: []
  24:
    name: "terminal-publish"     # Proof-Carrying Artifact: seals public + verified
    instrument: cli
    instrument_fallbacks: []
    instrument_config:
      timeout_seconds: 3600      # includes the final build wait + live verification

sheet:
  size: 1
  total_items: 24            # pre-expansion; no fan-out anywhere, so 24 sheets
  dependencies:              # movement-keyed; a single serial chain by design
    2: [1]
    3: [2]
    4: [3]
    5: [4]
    6: [5]
    7: [6]
    8: [7]
    9: [8]
    10: [9]
    11: [10]
    12: [11]
    13: [12]
    14: [13]
    15: [14]
    16: [15]
    17: [16]
    18: [17]
    19: [18]
    20: [19]
    21: [20]
    22: [21]
    23: [22]
    24: [23]
  # Required cadenzas, expanded-sheet-keyed (== movement numbers, no fan-out).
  # Each voice receives EXACTLY two documents as context: the performance
  # identity and the incoming packet. Not the other episodes — the relay's
  # information asymmetry is the experiment's independent variable. (The
  # isolation is prompt-contractual — see HONESTY CAVEATS — the cadenzas make
  # the CONTRACT structural, not the impossibility of peeking.)
  cadenzas:
    5:
      - file: "{{ workspace }}/performance-identity.md"
        as: context
        required: true
      - file: "{{ workspace }}/relay-packet-0.yaml"
        as: context
        required: true
    6:
      - file: "{{ workspace }}/performance-identity.md"
        as: context
        required: true
      - file: "{{ workspace }}/relay-packet-1.yaml"
        as: context
        required: true
    7:
      - file: "{{ workspace }}/performance-identity.md"
        as: context
        required: true
      - file: "{{ workspace }}/relay-packet-2.yaml"
        as: context
        required: true
    8:
      - file: "{{ workspace }}/performance-identity.md"
        as: context
        required: true
      - file: "{{ workspace }}/relay-packet-3.yaml"
        as: context
        required: true
    9:
      - file: "{{ workspace }}/performance-identity.md"
        as: context
        required: true
      - file: "{{ workspace }}/relay-packet-4.yaml"
        as: context
        required: true
  descriptions:
    1: "Pinned venv (uv, system python base) + digest-pinned offline voice model + freeze receipt"
    2: "Self-canary — gh identity-as-owner, three relay instruments, jq, both TTS paths, one measured master->encode->ebur128 pass"
    3: "Tune — performance identity + relay packet 0 under intent envelope"
    4: "Identity gate — compactness cap, typed packet schema, staged relay gates, rotation/count consistency"
    5: "Voice one (claude-code) — episode 1 + packet 1"
    6: "Voice two (codex-cli) — episode 2 + packet 2"
    7: "Voice three (opencode) — episode 3 + packet 3"
    8: "Voice four (codex-cli) — episode 4 + packet 4"
    9: "Voice five (claude-code) — episode 5 + packet 5"
    10: "Continuity gate — chain 0-5, beats, stepwise motif custody, attribution"
    11: "Stylometry — z-scored drift table against the pre-registered band"
    12: "Assemble (codex-cli) — mechanical joins, attribution preserved"
    13: "TTS normalization — markers stripped from speech text, chapter offsets on spoken words"
    14: "Synthesize — edge-tts/piper at pinned rates, choice + pauses recorded"
    15: "Bed and mix — sine bed, per-episode prominence references"
    16: "Master and package — loudnorm TP -2.0, pause-snapped non-overlapping chapters, covers, loudness receipt"
    17: "Site and repo — public repo, prior-run guard re-checked at the push, performance.md published"
    18: "Feed build — RSS 2.0 with byte-exact enclosures + attribution"
    19: "Deploy and wait — Pages build bound to the pushed commit sha, then live checks"
    20: "Live gate — the deployed feed answers as a podcatcher sees it"
    21: "Evidence page — packet chain, drift table, freeze, scripts, scope-and-limits"
    22: "Recompute seal — LIVE FEED enclosure bytes reproduce the run's numbers"
    23: "Receipts harness — every gate provably failable on its intended error, zero unexpected passes"
    24: "Terminal publish — seals pushed, build bound to sha, every seal hash-verified live"

retry:
  max_retries: 2
  base_delay_seconds: 30

# CLI movements run silent subprocesses (ffmpeg, uv, git) — stale detection
# must not kill a healthy mastering pass. Templates echo progress per episode.
stale_detection:
  enabled: true
  idle_timeout_seconds: 1800

# cross_sheet: deliberately ABSENT. No template branch references
# previous_outputs; the relay's context economics are structural (each voice
# receives exactly two files by required cadenza), and a voice sheet must
# never see another sheet's stdout — that would puncture the isolation the
# proof exists to test.

prompt:
  variables:
    # Single point of change for the publishing identity.
    github_owner: "Mzzkc"
    repo_name: "five-hands-one-voice"
    n_episodes: 5            # must equal the rotation list length (M4 refuses a mismatch)
    # Base interpreter — pinned to the SYSTEM python because ambient python3
    # on a conductor host resolves to Marianne's own venv. Linux FHS path;
    # change it per host, the movement probes it loudly.
    system_python: "/usr/bin/python3"
    # TTS — two independent deterministic executables (dual path because a
    # network TTS endpoint is this run's single point of death). Rates are
    # PINNED to the calibration table above: edge at +0% speaks 142-192 wpm
    # by style; piper at length_scale 1.3 speaks ~189 wpm — both inside the
    # 135-200 diagnostic band and jointly compatible with the word window.
    tts_voice: "en-US-AriaNeural"
    tts_rate: "+0%"
    piper_model_name: "en_US-lessac-medium"
    piper_length_scale: "1.3"
    # Canonical hosting verified 2026-09-03: HuggingFace serves the raw model
    # pair. Digests measured 2026-09-04 — a replaced upstream file is REFUSED
    # at movement 1 (source authenticity, not just in-run integrity).
    piper_voice_base: "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium"
    piper_onnx_sha256: "5efe09e69902187827af646e1a6e9d269dee769f9877d17b16b1b46eeaaf019f"
    piper_json_sha256: "efe19c417bed055f2d69908248c6ba650fa135bc868b0e6abb3da181dab690a0"
    # EXP predicates — the listener's experience as numbers, one source.
    # Window derivation (calibration table): 790 words @ 196 wpm = 242 s;
    # 960 @ 138 = 417 s. The wpm band is a diagnostic of the measured voice,
    # not a style gate — the audible contracts are duration and words.
    dur_lo_s: 240              # 4 minutes
    dur_hi_s: 420              # 7 minutes
    wpm_lo: 135
    wpm_hi: 200
    words_lo: 790
    words_hi: 960
    cold_open_s: 15
    dead_air_s: 3.0
    # Acoustic mastering (AES streaming-loudness recommendation). tp_target
    # feeds loudnorm PRE-encode; tp_ceiling is asserted on the ENCODED file.
    # aac_bitrate is calibrated: 128k AAC overshoots limited peaks by up to
    # +2.4 dB; 192k overshoots +0.1 (see the header's calibration table).
    lufs_target: -16
    lufs_tol: 2.0
    tp_target: -2.0
    tp_ceiling: -1.5
    lra_target: 11
    aac_bitrate: "192k"
    # Identity compactness — the anti-Identity-as-script gate.
    identity_cap_bytes: 4096
    identity_min_chars: 400
    # Music bed: deterministic garnish, pinned in the score (see notes).
    bed_freqs: [110, 165, 220]
    bed_gain: 0.055
    # Covers: flat geometric art from pinned palette (Pillow, no sudo).
    cover_bg: "#101418"
    cover_fg: "#e8e4d8"
    cover_accent: "#c89a4a"

  # The rotation is declared exactly ONCE in this score (single-source rule;
  # rev 1 hardcoded it in two gate scripts and the movement roster — three
  # places to forget). Movements 5-9's instruments above must match this list;
  # movement 4 renders it into every gate script and cross-checks attribution
  # against it, so a mismatch fails loudly at the first voice gate at the
  # latest. The episode count must equal its length — movement 4 refuses
  # anything else before a single creative token is spent.
  template: |
    {%- set rotation = ['claude-code', 'codex-cli', 'opencode', 'codex-cli', 'claude-code'] -%}
    {# ══ House macros — defined once, composed everywhere ═════════════════ #}
    {% macro strict() %}
    set -euo pipefail
    cd "{{ workspace }}"
    {% endmacro %}

    {% macro packet_schema(beat) %}
    ### Relay packet contract (machine-checked YAML — get the fields exactly right)
    - `beat: {{ beat }}` — integer, exactly this value.
    - `unresolved_motifs:` — list of short non-empty strings; the live threads
      the next voice must be able to pick up. Non-empty.
    - `resolved_motifs:` — optional list of non-empty strings; motifs this
      section deliberately closed. Every motif you resolve must have been
      open in an earlier packet — resolving a coining-of-your-own fails the
      gate. (A motif leaves the unresolved set only by appearing here or by
      surviving into the final packet — nothing vanishes silently.)
    - `tonal_commitments:` — list of non-empty strings; register, pacing, and
      sound promises in force for the next voice.
    - `hazards:` — list of non-empty strings; what would break the
      performance if ignored.
    - `continuation_point:` — one substantial paragraph (well over 20
      characters) naming where the story physically stands and the first
      playable beat the next voice picks up. A packet that is a synopsis
      instead of a playable cue is this pattern's first named failure mode.

    Every field must be a LIST OF STRINGS where a list is asked for — a bare
    string or a number fails the typed schema gate, even if non-empty.
    {% endmacro %}

    {% macro voice_rules() %}
    ### Ground rules (Mission Command — outcomes, not methods)
    - You are one performer in a relay. Two documents accompany this prompt
      as context: the performance identity and the incoming relay packet.
      They are your continuity. You cannot see the other episodes — continue
      from the packet alone; reading ahead would falsify the experiment this
      serial exists to prove.
    - CONTINUE the performance; do not restart it. Do not restate the
      premise beyond what a listener mid-serial needs.
    - Own your section. You may make irreversible artistic choices inside
      it. Preserve the identity without imitating any previous voice: the
      audience should hear variation, not rupture.
    - CARRY THE CUE (machine-checked): every motif in the incoming packet's
      `unresolved_motifs` must appear in YOUR outgoing packet — still
      unresolved, or moved to `resolved_motifs` if your episode genuinely
      closes it. And at least one incoming unresolved motif must appear BY
      NAME in your episode text — the gate proves the packet was consumed,
      not merely re-numbered.
    - Honor every hazard and tonal commitment in the incoming packet. (The
      gate cannot read prose for tone; the motifs and the beat are what it
      can and does verify.)
    - The quality of the fiction is YOUR authority. Nothing downstream
      grades taste; the gates measure rupture — continuity, structure,
      drift — never brilliance.
    {% endmacro %}

    {% macro episode_output(ep) %}
    ### Output — exactly two files, nothing else
    1. `{{ workspace }}/episode-{{ ep }}.md`
       - Line 1, exactly: `Written by: {{ instrument_name }}`
       - The episode script in markdown, structured with at least two
         `## ` chapter headings (scene breaks) — chapters are marked in the
         audio from these.
       - Open with a cold open: the first ~40 words must hook a listener
         within the episode's first 15 seconds of speech.
       - Final line, exactly: `OPEN QUESTION: <the question this episode
         leaves ringing>` — it must sit inside the final fifth of the file.
         (The attribution line and this marker are stripped from the spoken
         audio — the listener never hears them.)
       - Total length strictly between {{ words_lo }} and {{ words_hi }}
         words — this window is calibrated so that spoken at either engine's
         measured rate the episode lands inside {{ dur_lo_s }}-{{ dur_hi_s }}
         seconds. It is a listener-experience contract, not a formality.
    2. `{{ workspace }}/relay-packet-{{ ep }}.yaml` — your outgoing packet:
    {{ packet_schema(ep) }}
    {% endmacro %}

    {% if stage == 1 %}
    {{ strict() }}
    mkdir -p data voices scripts audio dist
    command -v uv >/dev/null 2>&1 || { echo "FAIL: uv not on PATH"; exit 1; }
    test -x "{{ system_python }}" || { echo "FAIL: system_python {{ system_python }} not executable — set the variable for this host (ambient python3 is the conductor's venv, deliberately not used)"; exit 1; }
    cat > requirements.lock <<'LOCK'
    numpy>=1.26,<3
    scipy>=1.11,<2
    Pillow>=10,<12
    PyYAML>=6,<7
    jsonschema>=4,<5
    edge-tts>=6,<8
    piper-tts>=1.2,<2
    defusedxml>=0.7,<1
    LOCK
    uv venv --python "{{ system_python }}" --quiet .venv
    uv pip install --quiet -r requirements.lock --python .venv/bin/python
    uv pip freeze --python .venv/bin/python > data/requirements.freeze
    .venv/bin/python -c "import numpy, scipy, PIL, yaml, jsonschema, edge_tts, defusedxml; print('stack importable')"
    for exe in edge-tts piper; do
      test -x ".venv/bin/$exe" || { echo "FAIL: .venv/bin/$exe missing"; exit 1; }
    done
    # EVERY load-bearing package pinned in the freeze — a resolution that
    # dropped one of these is not the environment this score was built for.
    for pkg in numpy scipy Pillow PyYAML jsonschema edge-tts piper-tts defusedxml; do
      grep -q "^${pkg}==" data/requirements.freeze || { echo "FAIL: freeze missing $pkg pin"; exit 1; }
    done
    # Offline voice model — pinned to the DIGESTS measured at composition
    # time. This is source authenticity: a future upstream replacement at
    # the same URL is refused here, not silently accepted and sealed (the
    # in-run MANIFEST re-check at M14 covers transport integrity).
    curl -sfL --retry 4 --retry-delay 5 "{{ piper_voice_base }}/{{ piper_model_name }}.onnx" -o "voices/{{ piper_model_name }}.onnx"
    curl -sfL --retry 4 --retry-delay 5 "{{ piper_voice_base }}/{{ piper_model_name }}.onnx.json" -o "voices/{{ piper_model_name }}.onnx.json"
    echo "{{ piper_onnx_sha256 }}  voices/{{ piper_model_name }}.onnx" | sha256sum -c - \
      || { echo "FAIL: voice model digest mismatch — upstream changed; re-pin deliberately"; exit 1; }
    echo "{{ piper_json_sha256 }}  voices/{{ piper_model_name }}.onnx.json" | sha256sum -c - \
      || { echo "FAIL: voice config digest mismatch — upstream changed; re-pin deliberately"; exit 1; }
    (cd voices && sha256sum *.onnx *.onnx.json > MANIFEST.sha256)
    echo "runtime built — frozen resolution:" && cat data/requirements.freeze

    {% elif stage == 2 %}
    {{ strict() }}
    mkdir -p canary
    VENV="{{ workspace }}/.venv"
    # Identity as owner, not command success: gh works against ANY account;
    # the mismatch would otherwise surface at M17, after five episodes exist.
    gh auth status >/dev/null 2>&1 || { echo "FAIL: gh not authenticated — the serial publishes at M17"; exit 1; }
    gh_user="$(gh api user -q .login)" || { echo "FAIL: gh api user did not answer"; exit 1; }
    [ "$gh_user" = "{{ github_owner }}" ] || { echo "FAIL: gh is '$gh_user' but the score publishes as {{ github_owner }}"; exit 1; }
    # Repo collision guard. An EMPTY pre-created repo (someone clicked "new
    # repository" first) is treated as fresh — a 404 readme is not a foreign
    # readme. A repo WITH a readme that lacks this score's marker is foreign
    # and refused; the refusal names the remedy.
    if gh repo view "{{ github_owner }}/{{ repo_name }}" >/dev/null 2>&1; then
      b64="$(gh api "repos/{{ github_owner }}/{{ repo_name }}/readme" -q .content 2>/dev/null || true)"
      if [ -n "$b64" ]; then
        if ! printf '%s' "$b64" | base64 -d 2>/dev/null | grep -q "Five Hands, One Voice"; then
          echo "REFUSING: {{ repo_name }} exists, has content, and is not a prior run of this score."
          echo "Remedy: delete/rename that repo, or point repo_name at a name you own outright."
          exit 1
        fi
      else
        echo "repo exists but is empty — treating as fresh"
      fi
    fi
    # The three relay instruments — the movements' own claimed scope ("every
    # death path"): a dead codex-cli credential must die HERE, not at M6
    # after three LLM sheets.
    command -v mzt >/dev/null 2>&1 || { echo "FAIL: mzt CLI not on PATH — cannot probe relay instruments"; exit 1; }
    for inst in claude-code codex-cli opencode; do
      mzt instruments check "$inst" >/dev/null 2>&1 \
        || { echo "FAIL: relay instrument '$inst' not ready — seven movements author through it"; exit 1; }
    done
    # jq is load-bearing at M14; probe it now, not by host luck.
    command -v jq >/dev/null 2>&1 || { echo "FAIL: jq not on PATH (load-bearing at M14)"; exit 1; }
    # TTS path A — network endpoint, at the pinned rate
    "$VENV/bin/edge-tts" --voice "{{ tts_voice }}" --rate="{{ tts_rate }}" --text "Relay canary. One voice, five hands." --write-media canary/edge.audio \
      || { echo "FAIL: edge-tts path dead"; exit 1; }
    # TTS path B — offline model, at the pinned length scale
    printf '%s\n' "Relay canary. One voice, five hands." \
      | "$VENV/bin/piper" --model "voices/{{ piper_model_name }}.onnx" --length_scale "{{ piper_length_scale }}" --output_file canary/piper.wav \
      || { echo "FAIL: piper path dead"; exit 1; }
    for f in canary/edge.audio canary/piper.wav; do
      d="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")"
      awk -v d="$d" 'BEGIN { exit !(d >= 1.0) }' || { echo "FAIL: $f too short (${d}s)"; exit 1; }
    done
    # One REAL landing pass: canary audio through the exact TWO-PASS
    # master->encode->measure chain M16 uses (measure with print_format=json,
    # re-apply with the measured values, encode, parse the ebur128 summary).
    # This proves the chain LANDS in the band on real TTS bytes, not merely
    # that the filter parses (rev 1's null-output pass proved nothing).
    "$VENV/bin/python" - <<'PY'
    import json, re, subprocess
    from pathlib import Path
    I_T, TP_C, LRA_T = {{ lufs_target }}, {{ tp_ceiling }}, {{ lra_target }}
    def dur(p):
        out = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration",
                              "-of", "csv=p=0", p], capture_output=True, text=True)
        return float(out.stdout.strip())
    def cap(args):
        r = subprocess.run(args, capture_output=True, text=True)
        assert r.returncode == 0, (args[:3], r.stderr[-300:])
        return r
    r = cap(["ffmpeg", "-hide_banner", "-nostats", "-i", "canary/edge.audio",
             "-af", "loudnorm=I=%d:TP=%.1f:LRA=%d:print_format=json" % (I_T, {{ tp_target }}, LRA_T),
             "-f", "null", "-"])
    m = re.search(r"\{[^{}]*\"input_i\"[^{}]*\}", r.stderr, re.S)
    assert m, "loudnorm measurement JSON missing"
    d = json.loads(m.group(0))
    af = ("loudnorm=I=%d:TP=%.1f:LRA=%d:measured_I=%s:measured_TP=%s:measured_LRA=%s:measured_thresh=%s"
          % (I_T, {{ tp_target }}, LRA_T, d["input_i"], d["input_tp"], d["input_lra"], d["input_thresh"]))
    cap(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", "canary/edge.audio",
         "-af", af, "-ar", "44100", "-c:a", "aac", "-b:a", "{{ aac_bitrate }}", "canary/encoded.m4a"])
    def ebur128_summary(p):
        r = subprocess.run(["ffmpeg", "-hide_banner", "-nostats", "-i", p,
                            "-filter_complex", "ebur128=peak=true", "-f", "null", "-"],
                           capture_output=True, text=True)
        log = r.stderr
        i = re.search(r"Integrated loudness:\s*\n\s*I:\s+(-?\d+\.?\d*)\s*LUFS", log)
        tp = re.search(r"True peak:\s*\n\s*Peak:\s+(-?\d+\.?\d*)\s*dBFS", log)
        assert i and tp, "ebur128 summary missing for " + p
        return float(i.group(1)), float(tp.group(1))
    lufs, tp = ebur128_summary("canary/encoded.m4a")
    report = {
        "gh_user": "{{ github_owner }}",
        "repo": "{{ github_owner }}/{{ repo_name }}",
        "instruments": {"claude-code": "ready", "codex-cli": "ready", "opencode": "ready"},
        "jq": "ready",
        "edge_tts": {"ok": True, "duration_s": dur("canary/edge.audio")},
        "piper": {"ok": True, "duration_s": dur("canary/piper.wav")},
        "master_landing": {"ok": True, "method": "two-pass", "lufs": lufs, "true_peak_dbfs": tp},
    }
    assert abs(lufs - I_T) <= {{ lufs_tol }}, "canary master landed %.1f LUFS" % lufs
    assert tp <= {{ tp_ceiling }}, "canary master landed %.2f dBTP" % tp
    Path("canary-report.json").write_text(json.dumps(report, indent=2))
    print("canary report:", json.dumps(report))
    PY
    echo "self-canary ok — identity, instruments, jq, both TTS paths, measured landing"

    {% elif stage == 3 %}
