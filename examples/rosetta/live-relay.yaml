            s = duration_s(audio)
            ET.SubElement(item, it("duration")).text = "%d:%02d" % (int(s // 60), int(s - 60 * int(s // 60)))
            ET.SubElement(item, "enclosure", {
                "url": origin + "audio/episode-%d.m4a" % n,
                "length": str(os.path.getsize(audio)),
                "type": "audio/x-m4a"})
            ET.SubElement(item, "guid").text = origin + "audio/episode-%d.m4a" % n
            ET.SubElement(item, "pubDate").text = time.strftime(
