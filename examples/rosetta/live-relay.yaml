        txt = t / "ep.txt"
        txt.write_text(" ".join(["word"] * 800))
        record("negative", "audio gate refuses mid-episode dead air (rate in band)",
               run([VENV, str(ws / "scripts" / "check_audio.py"), str(wav), str(txt),
                    "3.0", "15", "240", "420", "135", "200"]),
               "dead air")
    with tempfile.TemporaryDirectory() as td:
        t = Path(td)
        a = "The quick brown fox jumps over the lazy dog near the river bank at dawn. " * 30
        b = "Consequently; moreover: the committee's deliberations, ostensibly procedural, continued. " * 30
        for i, body in enumerate([a, b, a, b, a], 1):
            (t / ("episode-%d.md" % i)).write_text("Written by: x\n## C\n" + body + "\nOPEN QUESTION: q\n")
        record("negative", "stylometry gate refuses cross-vendor drift over baseline",
               run([VENV, str(ws / "scripts" / "stylometry.py"), str(t)]), "FAIL")
    with tempfile.TemporaryDirectory() as td:
