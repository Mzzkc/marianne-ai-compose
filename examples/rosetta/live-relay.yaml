        record("negative", "episode gate refuses a consumed-but-never-played motif (pickup)",
               run([VENV, str(ws / "scripts" / "check_episode.py"), str(t), "6", "790", "960"]),
               "pickup")
    with tempfile.TemporaryDirectory() as td:
        t = Path(td)
        wav = t / "deadair.wav"
