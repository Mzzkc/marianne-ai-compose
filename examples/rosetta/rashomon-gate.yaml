    {{ strict() }}
    mkdir -p scripts stats
    cat > scripts/compute_frames.py <<'PY'
    import argparse
    import json
    import pandas as pd
    from scipy import stats as sps

    WHO = {
        "pm2_5": ({{ who_limits.pm2_5 }}, "24-hour mean"),
        "nitrogen_dioxide": ({{ who_limits.nitrogen_dioxide }}, "24-hour mean"),
        "ozone": ({{ who_limits.ozone }}, "8-hour max"),
    }
    TZ = "{{ tz }}"

    ap = argparse.ArgumentParser()
    ap.add_argument("--data", default="data")
    ap.add_argument("--out", default="stats/frames.json")
    ap.add_argument("--md", default="stats/frames.md")
    a = ap.parse_args()

    sites = json.load(open("%s/sites.json" % a.data))
    probe = json.load(open("%s/resolution-probe.json" % a.data))
    df = pd.read_csv("%s/breathing-atlas.csv" % a.data)
    df["local_date"] = df["local_date"].astype(str)

    F = {"health": [], "equity": [], "meteorology": [], "trend": []}

    def add(frame, key, value, unit, n, note, **extra):
        rec = {"key": key, "frame": frame, "value": value, "unit": unit, "n": n, "note": note}
        rec.update(extra)
        F[frame].append(rec)

    def daily_metric(sub, pol):
        if pol != "ozone":
            return sub.groupby(["city", "site", "local_date"])["value"].mean()
        parts = []
        for sid, g in sub.groupby("site"):
            g = g.sort_values("timestamp_utc")
            idx = pd.DatetimeIndex(pd.to_datetime(g["timestamp_utc"], utc=True), name="ts")
            s = pd.Series(g["value"].to_numpy(), index=idx, name="value")
            r = s.rolling("8h", min_periods=6).mean().reset_index()
            r["site"] = sid
            r["city"] = g["city"].iloc[0]
            parts.append(r)
        roll = pd.concat(parts, ignore_index=True)
        roll["local_date"] = pd.to_datetime(roll["ts"], utc=True).dt.tz_convert(TZ).dt.date.astype(str)
        return roll.groupby(["city", "site", "local_date"])["value"].max()

    # Health frame: WHO 2021 exceedance days, counted in LOCAL days.
    for pol, (limit, window) in WHO.items():
        daily = daily_metric(df[df.pollutant == pol], pol)
        over = daily > float(limit)
        total_days = daily.groupby("city").size()
        exc_days = over.groupby("city").sum()
        for city in sorted(total_days.index):
            add("health", "health_%s_%s_exceed_days" % (city, pol), int(exc_days[city]), "days",
                int(total_days[city]), "%s vs WHO 2021 guideline %s %s ug/m3" % (window, pol, limit))

    # Equity frame: between-city burden always; intra-city ONLY if the probe allows.
    for pol in ("pm2_5", "nitrogen_dioxide"):
        means = df[df.pollutant == pol].groupby("city")["value"].mean()
        n = int((df.pollutant == pol).sum())
        for city in sorted(means.index):
            add("equity", "equity_%s_%s_mean" % (city, pol), round(float(means[city]), 2), "ug/m3", n,
                "period mean %s across all sites in city" % pol)
    site_means = df[df.pollutant == "pm2_5"].groupby(["city", "site"])["value"].mean()
    if probe["decision"] == "gradient_supported":
        for city in sorted(set(df.city)):
            g = site_means[city]
            add("equity", "equity_%s_gradient_pct" % city,
                round(float((g.max() - g.min()) / g.mean() * 100.0), 2), "percent", int(g.size),
                "intra-city PM2.5 spread across sites (grid supports a gradient)",
                lo=round(float(g.min()), 2), hi=round(float(g.max()), 2))
    else:
        add("equity", "equity_gradient_unsupported", 1, "flag", len(probe["probe_sites"]),
            "spatial probe found %d distinct grid cells across %d sites; intra-city gradient NOT claimable; burden compared between cities only"
            % (probe["distinct_grid_cells"], len(probe["probe_sites"])))

    # Meteorology frame: NO2:PM signature + wind/precipitation regression.
    for city in sorted(set(df.city)):
        c = df[df.city == city]
        no2 = c[c.pollutant == "nitrogen_dioxide"].groupby("local_date")["value"].mean()
        pm25 = c[c.pollutant == "pm2_5"].groupby("local_date")["value"].mean()
        ratio = (no2 / pm25).dropna()
        add("meteorology", "met_%s_no2_pm_ratio_mean" % city, round(float(ratio.mean()), 2), "ratio", int(ratio.size),
            "mean daily NO2:PM2.5 ratio; high = fresh local traffic, low = transported aerosol")
        exceed = (pm25 > float(WHO["pm2_5"][0])).astype(int)
        for name, series in (("wind", c.groupby("local_date")["wind_speed_10m"].mean()),
                             ("precip", c.groupby("local_date")["precipitation"].mean())):
            joined = pd.concat([exceed.rename("exc"), series.rename(name)], axis=1).dropna()
            if joined[name].std() > 0:
                lr = sps.linregress(joined[name], joined["exc"])
                add("meteorology", "met_%s_%s_slope" % (city, name), round(float(lr.slope), 5),
                    "exceed-prob per unit", int(len(joined)),
                    "regression of PM2.5 exceedance day on daily mean %s" % name,
                    r=round(float(lr.rvalue), 3), p=round(float(lr.pvalue), 4))

    # Trend frame: Theil-Sen slope of monthly means with confidence bounds.
    for city in sorted(set(df.city)):
        for pol in ("pm2_5", "nitrogen_dioxide", "ozone"):
            c = df[(df.city == city) & (df.pollutant == pol)].copy()
            c["month"] = c["local_date"].str.slice(0, 7)
            monthly = c.groupby("month")["value"].mean().sort_index()
            if len(monthly) >= 3:
                ts_ = sps.theilslopes(monthly.values, range(len(monthly)))
                add("trend", "trend_%s_%s_slope" % (city, pol), round(float(ts_.slope), 4),
                    "ug/m3 per month", int(len(monthly)),
                    "Theil-Sen slope over %d monthly points; window too short to separate trend from season — direction of travel only, never attribution; negative = improving within this window" % len(monthly),
                    ci_low=round(float(ts_.low_slope), 4), ci_high=round(float(ts_.high_slope), 4))

    for fr in F:
        assert len(F[fr]) >= 5, "frame %s has only %d findings" % (fr, len(F[fr]))
    json.dump(F, open(a.out, "w"), indent=2, sort_keys=True)

    with open(a.md, "w") as fh:
        fh.write("# Distilled frame statistics\n\n")
        fh.write("Spatial probe: %s (distinct grid cells: %d, spread: %s%%).\n\n"
                 % (probe["decision"], probe["distinct_grid_cells"], probe["max_intra_city_spread_pct"]))
        fh.write("Trend caveat: slopes span only the ~3-4 monthly points this window\n")
        fh.write("affords; trend and season are confounded at this length. Read them as\n")
        fh.write("direction of travel, never as attribution.\n\n")
        for fr in ("health", "equity", "meteorology", "trend"):
            fh.write("## Frame: %s\n\n" % fr)
            for rec in F[fr]:
                fh.write("- `%s` = %s %s (n=%s) — %s\n" % (rec["key"], rec["value"], rec["unit"], rec["n"], rec["note"]))
    print("frames computed:", sum(len(v) for v in F.values()), "findings")
    PY
    .venv/bin/python scripts/compute_frames.py

