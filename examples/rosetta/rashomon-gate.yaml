    argue it. Neutral aggregation is failure. Required sections, headed exactly:

    ## POSITION — which frame governs this atlas's story, and why
    ## SUPPORTING EVIDENCE — every item cites a triangulation finding id as (T-001)
    ## COUNTERARGUMENTS — the strongest case against your position, stated fairly
    ## CONCLUSION — what a resident should take away
    ## DISSENT — named minority positions, recorded, not outvoted
    ## Verdict — Amsterdam
    ## Verdict — Rotterdam
    ## Verdict — Eindhoven

    Each `## Verdict — <City>` section is ONE plain-language paragraph for that
    city's page: what the air means for a run today, a child's asthma, a street
    vs the one three kilometers over — answered before any methodology.

    Your editorial position is itself a frame. Say so, in the atlas's own voice.
    Minimum 400 words; at least three (T-xxx) citations.

    {% elif stage == 13 %}
    {{ strict() }}
    mkdir -p scripts
    cat > scripts/build_site.py <<'PY'
    import hashlib
    import json
    import re
    import shutil
    from pathlib import Path

    ws = Path(".")
    site = ws / "site"
    (site / "assets").mkdir(parents=True, exist_ok=True)

    editorial = (ws / "editorial-synthesis.md").read_text(encoding="utf-8")
    seal = hashlib.sha256(editorial.encode("utf-8")).hexdigest()
    dictionary = (ws / "data" / "dictionary.md").read_text(encoding="utf-8")
    fetch = re.search(r"^Fetched:\s*(\S+)", dictionary, re.M).group(1)

    LABELS = {{ frame_labels }}
    INSTANCE_FRAME = {{ frame_by_instance }}

    def esc(text):
        return text.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

    def md_to_html(text):
        out = []
        for line in text.split("\n"):
            line = line.rstrip()
            if not line:
                continue
            if line.startswith("XREF:"):
                # The Talmudic layer is presentation, not just validation:
                # cross-references render as visibly distinct marginalia.
                out.append('<p class="xref">cross-reference — ' + esc(line[5:].strip()) + "</p>")
                continue
            if line.startswith("## "):
                out.append("<h3>" + esc(line[3:]) + "</h3>")
            elif line.startswith("# "):
                out.append("<h3>" + esc(line[2:]) + "</h3>")
            elif line.startswith("- "):
                out.append("<li>" + esc(line[2:]) + "</li>")
            else:
                out.append("<p>" + esc(line) + "</p>")
        return "\n".join(out)

    def frame_section(city_slug, frame_id, commentary_text):
        img = "assets/%s-%s.png" % (city_slug, frame_id)
        body = md_to_html(commentary_text)
        return ('<section class="frame"><h2>%s</h2>\n%s\n<img src="%s" alt="%s chart" loading="lazy"></section>'
                % (LABELS[frame_id], body, img, LABELS[frame_id]))

    PAGE = """<!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="atlas-synthesis-sha256" content="__SEAL__">
    <title>The Breathing Atlas — __CITY__</title>
    <style>
    body{font-family:system-ui,sans-serif;max-width:46rem;margin:0 auto;padding:1rem;line-height:1.5}
    .stamp{color:#567}
    section.frame{margin-top:2.5rem;border-top:1px solid #ccc;padding-top:1rem}
    .xref{margin:.2rem 0 .2rem 1rem;padding-left:.6rem;border-left:3px solid #99a;color:#567;font-size:.92em}
    img{max-width:100%;height:auto}
    </style>
    </head>
    <body>
    <header>
    <h1>The Breathing Atlas — __CITY__</h1>
    <p class="stamp">Data fetched __DATE__ · CAMS model reanalysis via Open-Meteo ·
    <a href="dictionary.html">what these numbers are</a> · <a href="index.html">all cities</a></p>
    </header>
    <main>
    <section class="verdict"><h2>The short version</h2>
    __VERDICT__
    </section>
    __FRAMES__
    </main>
    <footer><p>The editorial position above is itself a frame — one judgment among four,
    argued openly, with dissent recorded. The dataset, dictionary, and scripts are
    published beside this page: recompute everything yourself.</p></footer>
    </body>
    </html>
    """

    verdicts = {}
    for city in ("Amsterdam", "Rotterdam", "Eindhoven"):
        m = re.search(r"## Verdict — %s\s*\n(.*?)(?=\n## |\Z)" % city, editorial, re.S)
        assert m, "missing verdict section for " + city
        verdicts[city] = md_to_html(m.group(1).strip())

    commentaries = {}
    for i in (1, 2, 3, 4):
        commentaries[i] = (ws / ("commentary-%d.md" % i)).read_text(encoding="utf-8")

    city_slug = {"Amsterdam": "amsterdam", "Rotterdam": "rotterdam", "Eindhoven": "eindhoven"}
    for city, slug in city_slug.items():
        sections = [frame_section(slug, INSTANCE_FRAME[i], commentaries[i]) for i in (1, 2, 3, 4)]
        html = (PAGE.replace("__SEAL__", seal).replace("__CITY__", city)
                    .replace("__DATE__", fetch).replace("__VERDICT__", verdicts[city])
                    .replace("__FRAMES__", "\n".join(sections)))
        (site / (slug + ".html")).write_text(html, encoding="utf-8")

    index_html = """<!DOCTYPE html>
    <html lang="en">
    <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="atlas-synthesis-sha256" content="__SEAL__">
    <title>The Breathing Atlas</title></head>
    <body>
    <header><h1>The Breathing Atlas</h1>
    <p class="stamp">Data fetched __DATE__ · CAMS model reanalysis via Open-Meteo ·
    <a href="dictionary.html">what these numbers are</a></p></header>
    <main>
    <ul>
    <li><a href="amsterdam.html">Amsterdam</a></li>
    <li><a href="rotterdam.html">Rotterdam</a></li>
    <li><a href="eindhoven.html">Eindhoven</a></li>
    </ul>
    <p>Each city page answers the felt questions first — what this air means for a
    run today, a child's asthma, a street vs the one three kilometers over — then
    shows the four frames that argued about it, cross-references visible, dissent
    recorded. The editorial position is itself a frame and says so.</p>
    </main>
    <footer><p>Recompute everything yourself: dataset, dictionary, and scripts are
    published beside the pages.</p></footer>
    </body>
    </html>
    """
    (site / "index.html").write_text(
        index_html.replace("__SEAL__", seal).replace("__DATE__", fetch), encoding="utf-8")

    dict_html = """<!DOCTYPE html>
    <html lang="en">
    <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="atlas-synthesis-sha256" content="__SEAL__">
    <title>The Breathing Atlas — data dictionary</title></head>
    <body>
    <header><h1>What these numbers are</h1>
    <p class="stamp"><a href="index.html">The Breathing Atlas</a> · Data fetched __DATE__</p></header>
    <main>
    __DICT__
    </main>
    </body>
    </html>
    """
    (site / "dictionary.html").write_text(
        dict_html.replace("__SEAL__", seal).replace("__DATE__", fetch)
                 .replace("__DICT__", md_to_html(dictionary)), encoding="utf-8")

    for p in (ws / "assets").glob("*.png"):
        shutil.copy(p, site / "assets" / p.name)
    print("site built:", sorted(x.name for x in site.glob("*.html")))
    PY
    python3 scripts/build_site.py

    {% elif stage == 14 %}
    {{ strict() }}
    mkdir -p validation publish
    cp -r site/. publish/
    mkdir -p publish/data publish/scripts publish/frames
    cp data/breathing-atlas.csv data/dictionary.md data/sites.json data/resolution-probe.json data/stack-freeze.txt publish/data/
    cp scripts/*.py publish/scripts/
    cp -r "{{ score_dir }}/frames" publish/frames
    cat > publish/README.md <<'EOF'
    # The Breathing Atlas

    Layered air-quality briefings for Amsterdam, Rotterdam, and Eindhoven:
    one shared evidence base, four independent frames (health, equity,
    meteorology, trend), measured disagreement, and an argued editorial
    synthesis with named dissent.

    - data/ — the published dataset, site table, spatial probe, dictionary,
      and the exact dependency freeze (stack-freeze.txt) the numbers were
      computed under
    - scripts/ — the exact scripts that produced every number and chart
    - frames/ — the four lens definitions the analysts were given

    Recompute every published number yourself:

        python scripts/compute_frames.py --data data --out /tmp/frames.json

    Data lineage: CAMS model reanalysis interpolated to coordinates, served by
    the Open-Meteo air-quality and forecast APIs (keyless). This is MODEL
    OUTPUT, not surface measurement-station data. WHO 2021 air quality
    guidelines are guidelines, not local law.

    PUBLICATION POLICY: every run of the score force-pushes `main` of this
    repository. The push is refused unless origin/main is empty or already a
    prior atlas. Point repo_name at a name you own outright.
    EOF
    printf "%s\n" "https://{{ github_owner }}.github.io/{{ repo_name }}/" > validation/site-url.txt
    printf "%s\n" "{{ github_owner }}/{{ repo_name }}" > validation/repo-slug.txt
    printf "%s\n" "https://raw.githubusercontent.com/{{ github_owner }}/{{ repo_name }}/main" > validation/repo-raw-base.txt
    cd publish
    git init -q -b main
    git add -A
    git -c user.name="The Breathing Atlas" -c user.email="atlas@localhost" commit -qm "The Breathing Atlas — data, scripts, frames, site"
    if gh repo view "{{ github_owner }}/{{ repo_name }}" >/dev/null 2>&1; then
      git remote remove origin 2>/dev/null || true
      git remote add origin "https://github.com/{{ github_owner }}/{{ repo_name }}.git"
      # Guard: force-push is reserved for overwriting a PRIOR atlas. An
      # existing repo of the same name that is not ours gets a loud refusal,
      # not a destruction.
      if git fetch -q origin main 2>/dev/null; then
        if git show FETCH_HEAD:README.md >/dev/null 2>&1; then
          git show FETCH_HEAD:README.md | grep -q "The Breathing Atlas" || { echo "REFUSING: origin/main exists and is not a Breathing Atlas — force-push would destroy someone's work"; exit 1; }
        fi
      fi
      git push -q --force origin main
    else
      gh repo create "{{ github_owner }}/{{ repo_name }}" --public --source=. --remote=origin --push
    fi
    if ! gh api "repos/{{ github_owner }}/{{ repo_name }}/pages" >/dev/null 2>&1; then
      gh api -X POST "repos/{{ github_owner }}/{{ repo_name }}/pages" -F "source[branch]=main" -F "source[path]=/" >/dev/null
    fi
    url="$(cat ../validation/site-url.txt)"
    code=""
    for i in $(seq 1 45); do
      code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
      [ "$code" = "200" ] && break
      sleep 20
    done
    [ "$code" = "200" ] || { echo "deploy did not go live: $code"; exit 1; }
    echo "published: $url"

    {% elif stage == 15 %}
    {{ strict() }}
    mkdir -p validation
    url="$(cat validation/site-url.txt)"
    raw="$(cat validation/repo-raw-base.txt)"
    curl -sf "$url" -o validation/live-index.html
    grep -q "The Breathing Atlas" validation/live-index.html
    expected="$(sha256sum editorial-synthesis.md | cut -d" " -f1)"
    for page in amsterdam rotterdam eindhoven; do
      curl -sf "$url$page.html" -o "validation/live-$page.html"
      grep -q "$expected" "validation/live-$page.html" || { echo "synthesis seal missing on $page"; exit 1; }
    done
    tmp="$(mktemp -d)"
    curl -sf "$raw/data/breathing-atlas.csv" -o "$tmp/breathing-atlas.csv"
    curl -sf "$raw/data/sites.json" -o "$tmp/sites.json"
    curl -sf "$raw/data/resolution-probe.json" -o "$tmp/resolution-probe.json"
    curl -sf "$raw/data/stack-freeze.txt" -o "$tmp/stack-freeze.txt"
    curl -sf "$raw/scripts/compute_frames.py" -o "$tmp/compute_frames.py"
    "{{ workspace }}/.venv/bin/python" "$tmp/compute_frames.py" --data "$tmp" --out "$tmp/frames.json" --md "$tmp/frames.md"
    diff stats/frames.json "$tmp/frames.json" > validation/recompute.diff || true
    if [ -s validation/recompute.diff ]; then
      echo "recompute drift — published data no longer produces published numbers:"
      cat validation/recompute.diff
      exit 1
    fi
    echo "LIVE SEAM VERIFIED: $url answers, and the published data recomputes the published numbers exactly"

    {% endif %}

# ═══════════════════════════════════════════════════════════════════════════════
# VALIDATIONS — staged fail-fast (Commissioning Cascade): per movement, coarse
# before fine, and every load-bearing claim is a deterministic command, never
# LLM judgment. `condition: stage == N` selects the movement; the `stage:`
# field orders rules WITHIN a sheet (fail-fast between stages).
# ═══════════════════════════════════════════════════════════════════════════════

validations:
  # ── M1 · Bootstrap + the blindness gate (runs before any fan-out token) ──
  - type: command_succeeds
    command: '{workspace}/.venv/bin/python -c "import pandas, scipy, matplotlib, yaml; print(''stack importable'')"'
    condition: "stage == 1"
    stage: 1
    description: "Data stack is importable, not merely installed"
  - type: command_succeeds
    command: |
      for f in health equity meteorology trend; do
        p="{score_dir}/frames/frame-$f.md"
        test -s "$p" || { echo "missing $p"; exit 1; }
        grep -q "^FRAME: $f$" "$p" || { echo "no marker in $f"; exit 1; }
        for o in health equity meteorology trend; do
          if [ "$o" != "$f" ] && grep -q "^FRAME: $o$" "$p"; then
            echo "blindness violation: $f names $o"; exit 1
          fi
        done
        grep -q "stat_ref" "$p" || { echo "no output contract in $f"; exit 1; }
      done
      echo "blindness gate ok"
    condition: "stage == 1"
    stage: 1
    description: "Blindness gate: each frame cadenza carries only its own marker + its contract"
  - type: command_succeeds
    command: |
      test "$(gh api user -q .login)" = {github_owner}
      test -s {workspace}/data/stack-freeze.txt
      grep -q "^pandas==" {workspace}/data/stack-freeze.txt
      grep -q "^scipy==" {workspace}/data/stack-freeze.txt
      grep -q "^matplotlib==" {workspace}/data/stack-freeze.txt
      command -v claude >/dev/null 2>&1 || command -v codex >/dev/null 2>&1 || command -v opencode >/dev/null 2>&1
    condition: "stage == 1"
    stage: 3
    description: "Self-canary: gh identity matches the publisher, stack freeze receipt exists, a judgment instrument is on PATH"

  # ── M2 · Air canary: shape gate on the real payload ─────────────────────
  - type: command_succeeds
    command: |
      jq -e '
        (.hourly.time | length) >= 48
        and (.hourly_units.pm2_5 == "μg/m³")
        and (.hourly | has("nitrogen_dioxide"))
        and (.hourly | has("ozone"))
        and (. as $doc | (["pm2_5", "pm10", "nitrogen_dioxide", "ozone"] | all(. as $p | (($doc.hourly[$p] | map(select(. == null))) | length) / ($doc.hourly[$p] | length) < 0.25)))
      ' {workspace}/canary/air.json > /dev/null
    condition: "stage == 2"
    stage: 1
    working_directory: "{workspace}"
    description: "Air payload has 48+ hours, μg/m³ units, NO₂/O₃ keys, every pollutant < 25% nulls"

  # ── M3 · Met canary: hour-exact joinability ─────────────────────────────
  - type: command_succeeds
    command: |
      python3 -c "
      import json
      air = json.load(open('{workspace}/canary/air.json'))
      met = json.load(open('{workspace}/canary/met.json'))
      assert air['hourly']['time'] == met['hourly']['time'], \
          'joinability broken: time arrays differ (%d vs %d points)' % (
              len(air['hourly']['time']), len(met['hourly']['time']))
      probe = json.load(open('{workspace}/canary/met-probe.json'))
      assert 'wind_speed_10m' in probe['fields'] and 'precipitation' in probe['fields']
      print('joinable: hour-exact timestamp arrays,', len(met['hourly']['time']), 'points')
      "
    condition: "stage == 3"
    stage: 1
    description: "Weather covariates join hour-exact to the air payload — arrays equal, not merely same length"

  # ── M4 · The Grid Oracle — KILL AUTHORITY over the equity frame ─────────
  - type: command_succeeds
    command: |
      python3 -c "
      import json
      sites = json.load(open('{workspace}/data/sites.json'))
      ams = sorted(k for k, v in sites.items() if v['city'] == 'amsterdam')
      d = json.load(open('{workspace}/canary/resolution-probe.json'))
      assert sorted(d['probe_sites']) == ams, 'probe must sample every Amsterdam site, exactly'
      assert d['decision'] in ('gradient_supported', 'gradient_unsupported'), d['decision']
      assert d['distinct_grid_cells'] >= 1, d
      if d['decision'] == 'gradient_supported':
          assert d['distinct_grid_cells'] >= 2, 'supported verdict with <2 cells'
          assert d['max_intra_city_spread_pct'] > 5.0, 'supported verdict with <=5% spread'
          assert d['max_intra_city_delta_ugm3'] > {min_spread_ugm3}, 'supported verdict at or below the absolute floor — noise must not fund a gradient'
      print('probe verdict:', d['decision'], d['distinct_grid_cells'], 'cells')
      "
    condition: "stage == 4"
    stage: 1
    description: "Kill authority: verdict is consistent, sampled every AMS site, and cleared BOTH the relative and absolute bars"

  # ── M5 · Full fetch: fail-closed per-file gates, no partial datasets ────
  # User variables DO reach validation commands (template_variables carries
  # them at lowest precedence, and the validation engine substitutes every
  # {key} literally) — so the gate states {min_hours} directly: one point of
  # change, no restated constants, no engine folklore.
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import json
      POLS = ('pm2_5', 'pm10', 'nitrogen_dioxide', 'ozone')
      METS = ('wind_speed_10m', 'wind_direction_10m', 'precipitation', 'temperature_2m')
      sites = json.load(open('{workspace}/data/sites.json'))
      fails = []
      for sid in sorted(sites):
          air = json.load(open('{workspace}/raw/%s-air.json' % sid))
          met = json.load(open('{workspace}/raw/%s-met.json' % sid))
          if len(air['hourly']['time']) < {min_hours} or len(met['hourly']['time']) < {min_hours}:
              fails.append(sid + ': under the hour floor')
          if air['hourly']['time'] != met['hourly']['time']:
              fails.append(sid + ': air/met time arrays differ')
          for doc, keys, tag in ((air, POLS, 'air'), (met, METS, 'met')):
              n = len(doc['hourly']['time'])
              for k in keys:
                  if sum(1 for v in doc['hourly'][k] if v is None) / n >= 0.25:
                      fails.append('%s-%s %s: nulls' % (sid, tag, k))
      assert not fails, fails
      print('raw gates ok:', len(sites), 'sites')
      "
    condition: "stage == 5"
    stage: 1
    description: "Every raw file: full hour floor, hour-exact air/met timestamp equality, all 4 pollutants + 4 covariates < 25% nulls"
  - type: command_succeeds
    command: |
      expected="$(python3 -c 'import json; print(len(json.load(open("{workspace}/data/sites.json"))) * 2)')"
      actual="$(ls {workspace}/raw/*.json | wc -l)"
      test "$actual" -eq "$expected"
    condition: "stage == 5"
    stage: 2
    description: "Raw file count equals sites × APIs exactly"

  # ── M6 · Clean + unify: the tidy contract ───────────────────────────────
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import json
      import pandas as pd
      sites = json.load(open('{workspace}/data/sites.json'))
      first = sorted(sites)[0]
      n_hours = len(json.load(open('{workspace}/raw/%s-air.json' % first))['hourly']['time'])
      df = pd.read_csv('{workspace}/data/breathing-atlas.csv')
      expected = len(sites) * n_hours * 4
      assert len(df) == expected, 'rows %d != expected %d' % (len(df), expected)
      assert df.duplicated(subset=['site', 'pollutant', 'timestamp_utc']).sum() == 0, 'duplicate keys'
      assert set(df.pollutant) == {'pm2_5', 'pm10', 'nitrogen_dioxide', 'ozone'}
      assert df.local_date.notna().all(), 'missing local dates'
      for col in ('wind_speed_10m', 'wind_direction_10m', 'precipitation', 'temperature_2m'):
          frac = float(df[col].isna().mean())
          assert frac < 0.25, '%s null fraction %.3f after the met join' % (col, frac)
      print('tidy:', len(df), 'rows, covariates joined')
      "
    condition: "stage == 6"
    stage: 1
    description: "Tidy CSV: exact row count, no duplicate keys, local dates complete, met covariates < 25% null after join"
  - type: command_succeeds
    command: |
      grep -q "MODEL OUTPUT" {workspace}/data/dictionary.md
      grep -q "^Fetched:" {workspace}/data/dictionary.md
      grep -q "Null fractions" {workspace}/data/dictionary.md
    condition: "stage == 6"
    stage: 2
    description: "Dictionary states lineage, fetch date, and null report"

  # ── M7 · Frame statistics: schema + the determinism gate ────────────────
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import json
      F = json.load(open('{workspace}/stats/frames.json'))
      assert set(F) == {'health', 'equity', 'meteorology', 'trend'}, sorted(F)
      keys = []
      for fr, recs in F.items():
          assert len(recs) >= 5, '%s has %d findings' % (fr, len(recs))
          for r in recs:
              for k in ('key', 'value', 'unit', 'n', 'note'):
                  assert k in r, (fr, k)
          keys.extend(r['key'] for r in recs)
      assert len(keys) == len(set(keys)), 'duplicate stat keys'
      print('frames schema ok:', len(keys), 'findings')
      "
    condition: "stage == 7"
    stage: 1
    description: "frames.json: four frames, ≥5 findings each, unique citable keys"
  - type: command_succeeds
    command: |
      cd {workspace}
      .venv/bin/python scripts/compute_frames.py --out stats/frames-rerun.json --md stats/frames-rerun.md
      cmp -s stats/frames.json stats/frames-rerun.json
    condition: "stage == 7"
    stage: 2
    description: "Determinism: same input bytes → byte-identical frames.json"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/stats/frames.md") -lt 2500'
    condition: "stage == 7"
    stage: 2
    description: "Distilled view stays small (LLM sheets read kilobytes)"

  # ── M8 · Charts: real rendered PNGs, not empty files ────────────────────
  - type: command_succeeds
    command: |
      python3 -c "
      import glob, os, struct
      paths = sorted(glob.glob('{workspace}/assets/*.png'))
      assert len(paths) >= 12, 'expected >=12 charts, got %d' % len(paths)
      for p in paths:
          d = open(p, 'rb').read()
          assert d[:8] == b'\x89PNG\r\n\x1a\n', p
          w, h = struct.unpack('>II', d[16:24])
          assert w >= 200 and h >= 150, (p, w, h)
          assert os.path.getsize(p) > 10240, p
      print('charts ok:', len(paths))
      "
    condition: "stage == 8"
    stage: 1
    description: "Rendering gate (not a visual-quality check): 12+ PNGs with magic bytes, real dimensions, >10KB each"

  # ── M9 · Blind frames: the anti-fabrication join (per fan-out sheet) ────
  - type: file_exists
    path: "{workspace}/analysis-{instance}.md"
    condition: "stage == 9"
    stage: 1
    description: "Blind analysis exists"
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import json, re
      F = json.load(open('{workspace}/stats/frames.json'))
      keys = set(r['key'] for recs in F.values() for r in recs)
      text = open('{workspace}/analysis-{instance}.md').read()
      refs = re.findall(r'stat_ref:\s*([A-Za-z0-9_.\-]+)', text)
      assert len(refs) >= 5, 'only %d stat_ref findings' % len(refs)
      missing = sorted(set(r for r in refs if r not in keys))
      assert not missing, 'fabricated stat refs: %s' % missing
      block = text.split('## FINDINGS')[-1]
      brefs = re.findall(r'stat_ref:\s*([A-Za-z0-9_.\-]+)', block)
      assert len(brefs) >= 5, 'FINDINGS block has only %d entries' % len(brefs)
      assert len(set(brefs)) >= 4, 'FINDINGS cite only %d distinct stats' % len(set(brefs))
      assert len(re.findall(r'^## §\d+', text, re.M)) >= 4, 'needs >=4 numbered sections'
      if {instance} == 2 and 'equity_gradient_unsupported' in keys:
          assert 'equity_gradient_unsupported' in brefs, \
              'the probe refused the intra-city gradient; the equity analysis must cite equity_gradient_unsupported'
      print('blind analysis {instance} ok:', len(refs), 'cited findings')
      "
    condition: "stage == 9"
    stage: 2
    description: "Every stat_ref joins to frames.json; FINDINGS block is full and distinct; the kill gate is cited when it fired"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/analysis-{instance}.md") -ge 300'
    condition: "stage == 9"
    stage: 2
    description: "Analysis is substantive (300+ words)"

  # ── M10 · Triangulation: the anti-keyword-slap count gate ───────────────
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import json, re
      import yaml
      t = yaml.safe_load(open('{workspace}/triangulation.yaml'))
      F = json.load(open('{workspace}/stats/frames.json'))
      keys = set(r['key'] for recs in F.values() for r in recs)
      ALL = set(('health', 'equity', 'meteorology', 'trend'))
      BIJ = {'UNANIMOUS': 4, 'MAJORITY': 3, 'SPLIT': 2, 'UNIQUE': 1}
      findings = t['findings']
      assert len(findings) > 0, 'no findings'
      ids = [f['id'] for f in findings]
      assert len(ids) == len(set(ids)), 'duplicate finding ids'
      for f in findings:
          assert f['category'] in BIJ, f
          fa = set(f['frames_agreeing'])
          assert fa, 'empty frames_agreeing: %s' % f['id']
          assert fa <= ALL, f
          assert len(fa) == BIJ[f['category']], 'category %s but %d frames agree: %s' % (f['category'], len(fa), f['id'])
          if f['category'] == 'UNANIMOUS':
              assert fa == ALL, 'UNANIMOUS must name all four frames: %s' % f['id']
          for ref in f.get('stat_refs', []):
              assert ref in keys, 'fabricated stat ref: %s' % ref
      sc = t['summary_counts']
      assert sum(sc.values()) == len(findings), 'counts %s != %d findings' % (sc, len(findings))
      covered = set()
      for f in findings:
          covered.update(f.get('stat_refs', []))
      cited = set()
      for i in range(1, 5):
          text = open('{workspace}/analysis-%d.md' % i).read()
          block = text.split('## FINDINGS')[-1]
          cited.update(re.findall(r'stat_ref:\s*([A-Za-z0-9_.\-]+)', block))
      dropped = sorted(cited - covered)
      assert not dropped, 'triangulation dropped cited findings: %s' % dropped
      print('triangulation ok:', len(findings), 'findings,', len(cited), 'cited stats covered')
      "
    condition: "stage == 10"
    stage: 1
    description: "Counts sum; category↔frames_agreeing is a bijection (4/3/2/1); every stat cited by any analysis is covered — no dropped voices"

  # ── M11 · Second hearing: cross-references must RESOLVE (per sheet) ─────
  - type: file_exists
    path: "{workspace}/commentary-{instance}.md"
    condition: "stage == 11"
    stage: 1
    description: "Cross-referenced commentary exists"
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import json, re
      F = json.load(open('{workspace}/stats/frames.json'))
      keys = set(r['key'] for recs in F.values() for r in recs)
      OWN = {1: 'health', 2: 'equity', 3: 'meteorology', 4: 'trend'}
      INSTANCE = {v: k for k, v in OWN.items()}
      text = open('{workspace}/commentary-{instance}.md').read()
      xrefs = re.findall(r'^XREF:\s*(rebutts|supports|extends)\s+(health|equity|meteorology|trend)\s+§(\d+)', text, re.M)
      assert len(xrefs) >= 2, 'only %d cross-references' % len(xrefs)
      for rel, frame, sec in xrefs:
          assert frame != OWN[{instance}], 'self-reference'
          target = open('{workspace}/analysis-%d.md' % INSTANCE[frame]).read()
          assert re.search(r'^## §%s\b' % sec, target, re.M), 'dangling xref: %s %s §%s' % (rel, frame, sec)
      assert len(re.findall(r'^## §\d+', text, re.M)) >= 4, 'commentary needs numbered sections'
      assert '## FINDINGS' in text, 'missing findings block'
      refs = re.findall(r'stat_ref:\s*([A-Za-z0-9_.\-]+)', text.split('## FINDINGS')[-1])
      assert len(refs) >= 5, 'commentary FINDINGS block has only %d stat_refs' % len(refs)
      missing = sorted(set(r for r in refs if r not in keys))
      assert not missing, 'commentary fabricated stat refs: %s' % missing
      print('commentary {instance} ok:', len(xrefs), 'resolvable cross-references,', len(refs), 'cited findings')
      "
    condition: "stage == 11"
    stage: 2
    description: "Every XREF target §anchor resolves; commentary FINDINGS stat_refs join to frames.json — revision cannot fabricate numbers either"

  # ── M12 · Editorial synthesis: argued, joined, non-neutral ──────────────
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import re
      import yaml
      t = yaml.safe_load(open('{workspace}/triangulation.yaml'))
      ids = set(f['id'] for f in t['findings'])
      text = open('{workspace}/editorial-synthesis.md').read()
      for marker in ('## POSITION', '## SUPPORTING EVIDENCE', '## COUNTERARGUMENTS', '## CONCLUSION', '## DISSENT'):
          assert marker in text, 'missing ' + marker
      for city in ('Amsterdam', 'Rotterdam', 'Eindhoven'):
          assert '## Verdict — ' + city in text, 'missing verdict for ' + city
      sup = text.split('## SUPPORTING EVIDENCE', 1)[1].split('## COUNTERARGUMENTS', 1)[0]
      assert re.findall(r'\((T-\d+)\)', sup), 'no (T-xxx) citations under SUPPORTING EVIDENCE — the position must stand on the measured agreement'
      dis = text.split('## DISSENT', 1)[1].split('## Verdict', 1)[0]
      assert len(dis.split()) >= 15, 'DISSENT section is empty — named dissent is required, not optional'
      cites = set(re.findall(r'\((T-\d+)\)', text))
      assert cites, 'no (T-xxx) citations'
      missing = sorted(c for c in cites if c not in ids)
      assert not missing, 'citations with no finding: %s' % missing
      print('editorial synthesis ok:', len(cites), 'joined citations')
      "
    condition: "stage == 12"
    stage: 1
    description: "All sections present; every (T-xxx) citation joins to a finding"
  - type: command_succeeds
    command: 'test $(wc -w < "{workspace}/editorial-synthesis.md") -ge 400'
    condition: "stage == 12"
    stage: 1
    description: "Synthesis is substantive (400+ words)"

  # ── M13 · Site build: structural gate on the RENDERED pages ─────────────
  # (The old html.parser "parse" gate was near-vacuous — HTMLParser.error
  # has been dead since Python 3.10. This gate checks structure: what the
  # page must SHOW, including that the XREF rendering transform ran.)
  - type: command_succeeds
    command: |
      python3 -c "
      from pathlib import Path
      site = Path('{workspace}/site')
      XREF_P = '<p class=' + chr(34) + 'xref' + chr(34) + '>'
      for city in ('amsterdam', 'rotterdam', 'eindhoven'):
          page = (site / (city + '.html')).read_text(encoding='utf-8')
          assert '<h1>' in page, city
          assert page.count('<img ') == 4, (city, 'expected 4 charts, got %d' % page.count('<img '))
          assert page.count(XREF_P) >= 2, (city, 'rendered cross-references missing — the Talmudic layer is not visible')
          assert '§' in page, (city, 'numbered section anchors missing')
          assert 'atlas-synthesis-sha256' in page, city
          assert 'dictionary.html' in page, city
      idx = (site / 'index.html').read_text(encoding='utf-8')
      for city in ('amsterdam', 'rotterdam', 'eindhoven'):
          assert (city + '.html') in idx, city
      assert 'dictionary.html' in idx
      assert 'Data fetched' in idx
      print('site structure ok: 3 city pages, 12 charts, cross-references rendered, sealed')
      "
    condition: "stage == 13"
    stage: 1
    description: "Per city page: h1, exactly 4 charts, ≥2 RENDERED cross-references, § anchors, seal, dictionary link; index links every city"

  # ── M14 · Publish: Pages enabled and the URL answers ────────────────────
  - type: command_succeeds
    command: 'gh api "repos/$(cat {workspace}/validation/repo-slug.txt)/pages" > /dev/null'
    condition: "stage == 14"
    stage: 1
    description: "GitHub Pages is enabled on the published repo"
  - type: command_succeeds
    command: 'curl -sf -o /dev/null "$(cat {workspace}/validation/site-url.txt)"'
    condition: "stage == 14"
    stage: 2
    description: "The deployed URL answers HTTP 200 — workspace-green is not deployed"

  # ── M15 · The live seam + the reproducibility seal ──────────────────────
  - type: command_succeeds
    command: |
      grep -q "The Breathing Atlas" {workspace}/validation/live-index.html
      python3 -c "
      import hashlib
      from glob import glob
      expected = hashlib.sha256(open('{workspace}/editorial-synthesis.md', 'rb').read()).hexdigest()
      pages = [p for p in glob('{workspace}/validation/live-*.html') if 'index' not in p]
      assert len(pages) == 3, pages
      for p in pages:
          assert expected in open(p).read(), 'seal missing on ' + p
      print('live seal verified on 3 city pages')
      "
    condition: "stage == 15"
    stage: 1
    description: "Deployed pages carry the exact editorial synthesis seal"
  - type: command_succeeds
    command: 'test -s {workspace}/validation/live-index.html && test ! -s {workspace}/validation/recompute.diff'
    condition: "stage == 15"
    stage: 2
    description: "Live page captured and recompute.diff is empty"
  - type: command_succeeds
    command: |
      raw="$(cat {workspace}/validation/repo-raw-base.txt)"
      curl -sf "$raw/data/breathing-atlas.csv" -o /dev/null
      curl -sf "$raw/data/stack-freeze.txt" -o /dev/null
      curl -sf "$raw/scripts/compute_frames.py" -o /dev/null
    condition: "stage == 15"
    stage: 3
    description: "Published repo serves the dataset, the dependency freeze, and the exact script — falsifiable by the reader"
