# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║          THE BREATHING ATLAS — Rashomon Gate proof score (rev 2)             ║
# ║          revised from three adversarial reviews, 2026-09-03                  ║
# ║                                                                              ║
# ║  PRIMARY PATTERN : Rashomon Gate — four independent analytical frames over   ║
# ║                    ONE shared deterministic evidence base; disagreement is   ║
# ║                    preserved, then resolved by an explicit editorial act.    ║
# ║  COMPOSING       : Sugya Weave (editorial synthesis with named dissent),     ║
# ║                    Talmudic Page (blind round, then cross-referenced second  ║
# ║                    round; the coordination structure is readable off the     ║
# ║                    published page — and the page is GATED on showing it),    ║
# ║                    The Tool Chain (deterministic CLI spine:                  ║
# ║                    fetch → clean → compute → chart → build → deploy → live   ║
# ║                    gate), Canary Probe + Threshold-Triggered Switch          ║
# ║                    (three cheap DATA probes plus a SELF-canary — gh          ║
# ║                    identity, judgment instrument, pinned stack — before     ║
# ║                    any LLM token is spent; the spatial probe carries kill    ║
# ║                    authority over the equity frame's design assumption,      ║
# ║                    and fails toward its SAFE verdict on noise: supported     ║
# ║                    requires ≥2 grid cells AND >5% spread AND >0.5 µg/m³).   ║
# ║                                                                              ║
# ║  PROBLEM SOLVED  : Single-frame analysis of urban air quality produces       ║
# ║                    unreliable conclusions because the right lens is unknown. ║
# ║                    Health counting, spatial equity, meteorological           ║
# ║                    attribution, and trend estimation give four different,    ║
# ║                    partially incompatible answers to "is the air here bad,   ║
# ║                    for whom, and why?". This score manufactures that         ║
# ║                    disagreement honestly (same bytes, different lenses),     ║
# ║                    measures it (triangulation), and resolves it editorially   ║
# ║                    (argued position, named dissent) — then PUBLISHES the     ║
# ║                    result as a public web page.                              ║
# ║                                                                              ║
# ║  PRODUCES        : ~/workspaces/breathing-atlas/ (auto-managed) →            ║
# ║                    canary/ · raw/ · data/{breathing-atlas.csv, dictionary.md,║
# ║                    sites.json, resolution-probe.json, stack-freeze.txt} ·    ║
# ║                    stats/{frames.json, frames.md} · assets/*.png ·           ║
# ║                    analysis-1..4.md · triangulation.yaml ·                   ║
# ║                    commentary-1..4.md · editorial-synthesis.md · site/ ·     ║
# ║                    publish/ — and a PUBLIC repo + GitHub Pages deployment    ║
# ║                    a resident actually opens, with the dataset, the exact    ║
# ║                    scripts, the lens definitions, and the dependency freeze  ║
# ║                    published beside it for reader-side recomputation.        ║
# ║                                                                              ║
# ║  INSTRUMENTS     : 5 categories — collection (curl), processing/storage      ║
# ║                    (jq, pandas, CSV), analysis/visual (scipy, matplotlib),   ║
# ║                    publishing (git, gh, GitHub Pages), agents (claude-code   ║
# ║                    with a client-diverse fallback chain codex-cli → opencode ║
# ║                    — judgment stages ONLY; client-diverse, not provider-     ║
# ║                    guaranteed: claude-code and opencode may route to the     ║
# ║                    same provider; codex-cli is the cross-vendor leg).        ║
# ║                    11 of 15 movements are CLI movements with EMPTY fallback  ║
# ║                    chains: a tool stage that silently falls back to an LLM   ║
# ║                    is a lie with a receipt. The byte volume (92 days × 4     ║
# ║                    pollutants × 11 sites × 2 APIs) flows entirely through    ║
# ║                    tools; LLM sheets see only the distilled stats/frames.md  ║
# ║                    (kilobytes, not months of rows) — Forward Observer        ║
# ║                    economics riding the Tool Chain.                          ║
# ║                                                                              ║
# ║  EXECUTION MAP   : (15 movements → 21 expanded sheets; fan-outs at 9 and 11) ║
# ║                                                                              ║
# ║      M1  Tuning the Instruments      venv bootstrap + SELF-CANARY [CLI]     ║
# ║      M2  First Breath — Air Canary   schema probe, 1 city, 2 d   [CLI]      ║
# ║      M3  First Breath — Met Canary   covariates + joinability    [CLI]      ║
# ║      M4  The Grid Oracle             spatial probe — KILL GATE   [CLI]      ║
# ║           │  (zero LLM tokens before M4 answers; gh identity, judgment     ║
# ║           │   instrument, and pinned stack verified at M1)                 ║
# ║      M5  The Deep Inhale             full fetch, fail-closed     [CLI]      ║
# ║      M6  Sorting the Air             tidy CSV, local days        [CLI]      ║
# ║      M7  The Counting House          frame stats + determinism   [CLI]      ║
# ║      M8  Painting the Numbers        12 matplotlib PNGs          [CLI]      ║
# ║      M9  Four Blind Listeners  ×4 ── Rashomon Gate ───────────── [LLM]      ║
# ║      M10 Where They Agree            triangulation + joins       [LLM]      ║
# ║      M11 The Second Hearing   ×4 ── Talmudic Page ────────────── [LLM]      ║
# ║      M12 The Editor's Verdict  ──── Sugya Weave ──────────────── [LLM]      ║
# ║      M13 Binding the Atlas           stdlib static site          [CLI]      ║
# ║      M14 Shipping the Atlas          gh repo + Pages             [CLI]      ║
# ║      M15 The Live Seam               deployed URL + recompute    [CLI]      ║
# ║                                                                              ║
# ║  ANTI-FABRICATION SEAMS (all deterministic joins, never LLM judgment):      ║
# ║    - every stat_ref in an analysis AND in a commentary joins to frames.json ║
# ║    - if the probe refused the intra-city gradient, the equity analysis must ║
# ║      cite the refusal finding itself (the kill gate is not advisory)        ║
# ║    - triangulation counts sum; category ↔ frames_agreeing is a bijection    ║
# ║      (UNANIMOUS=4, MAJORITY=3, SPLIT=2, UNIQUE=1); every stat cited by any  ║
# ║      analysis' FINDINGS block is covered by some finding (no dropped voices)║
# ║    - every XREF target §anchor exists in the named frame's analysis         ║
# ║    - every editorial citation (T-xxx) joins to a triangulation finding, at  ║
# ║      least one under SUPPORTING EVIDENCE; DISSENT is non-empty              ║
# ║    - the deployed page carries sha256(editorial-synthesis.md) as a seal     ║
# ║    - city pages must SHOW ≥2 rendered cross-references (the Talmudic layer  ║
# ║      is gated on being visible, not merely present as prose)                ║
# ║    - published CSV + published script + published freeze recompute          ║
# ║      frames.json exactly                                                    ║
# ║                                                                              ║
# ║  GENERICITY     : no workspace: field (auto-managed, #58); score-shipped    ║
# ║                    assets reference {{ score_dir }}; GitHub owner/repo are  ║
# ║                    variables. The two keyless APIs need no credentials;     ║
# ║                    `gh` must be authenticated AS github_owner (checked at   ║
# ║                    M1, not discovered broken at M14) and one judgment       ║
# ║                    instrument must be on PATH. PUBLICATION POLICY: each     ║
# ║                    run force-pushes `main` of repo_name — the push is       ║
# ║                    refused unless origin/main is empty or a prior atlas.    ║
# ║                    Point repo_name at a name you own outright.              ║
# ║                                                                              ║
# ║  USAGE          : mzt run <this-file>.yaml                                  ║
# ║                    mzt status breathing-atlas                               ║
# ║                    (frame cadenzas ship alongside: frames/frame-*.md)       ║
# ║                                                                              ║
# ║  Time: ~45-90+ min (first Pages deploy can add ~10 min)                     ║
# ║  Cost: ~$3-8 (10 LLM sheets)  |  Sheets: 21                                 ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: breathing-atlas
description: "Rashomon Gate proof — four blind frames over one deterministic air-quality evidence base, triangulated, cross-referenced, editorially synthesized, and published live."

# workspace: intentionally omitted — auto-managed at <workspace-root>/breathing-atlas (#58).
# This is the only path decision the score makes, and it makes it portably.

instrument: claude-code
instrument_config:
  timeout_seconds: 1800

# Vendor-diverse fallback chain for JUDGMENT sheets only. CLI movements below
# override this with an explicit empty chain — tools never fall back to minds.
instrument_fallbacks: [codex-cli, opencode]

movements:
  # ── Phase 0 · Canary battery — Canary Probe + Threshold-Triggered Switch ────
  # Instrument: cli across the whole phase. Why: these stages are pure
  # fetch/parse/decide work with exit codes; an LLM here would approximate
  # what curl+jq+python compute exactly. Zero LLM tokens before M4 answers.
  1:
    name: "Tuning the Instruments"
    instrument: cli            # Tool Chain: package install is deterministic
    instrument_fallbacks: []
  2:
    name: "First Breath — Air Canary"
    instrument: cli            # Canary Probe: cheapest exposure to the real API
    instrument_fallbacks: []
  3:
    name: "First Breath — Weather Canary"
    instrument: cli            # Canary Probe: covariate availability + joinability
    instrument_fallbacks: []
  4:
    name: "The Grid Oracle"
    instrument: cli            # Threshold-Triggered Switch: kill authority
    instrument_fallbacks: []
  # ── Phase 1 · Deterministic evidence substrate — The Tool Chain ─────────────
  5:
    name: "The Deep Inhale"
    instrument: cli            # volume fetch: curl is faster, cheaper, verifiable
    instrument_fallbacks: []
    instrument_config:
      timeout_seconds: 3600    # 22 files × ~92 days of hourly data
  6:
    name: "Sorting the Air"
    instrument: cli            # pandas row arithmetic, UTC→local, hour-exact join
    instrument_fallbacks: []
  7:
    name: "The Counting House"
    instrument: cli            # scipy statistics: exceedances, ratios, regressions
    instrument_fallbacks: []
  8:
    name: "Painting the Numbers"
    instrument: cli            # matplotlib Agg: rendering is a function of the stats
    instrument_fallbacks: []
  # ── Phase 2-4 · The Rashomon Gate, the Talmudic Page, the Sugya Weave ───────
  9:
    name: "Four Blind Listeners"
    instrument: claude-code    # Rashomon Gate: applying a LENS to distilled stats
                               # is judgment; the numbers stay machine-checked
  10:
    name: "Where They Agree"
    instrument: claude-code    # categorizing agreement across four texts is
                               # semantic; its ARITHMETIC is count-checked
  11:
    name: "The Second Hearing"
    instrument: claude-code    # Talmudic Page: rebut/support/extend after reading
                               # the others; anchor resolvability is joined
  12:
    name: "The Editor's Verdict"
    instrument: claude-code    # Sugya Weave: irreducible editorial judgment; every
                               # citation joins to a triangulation finding id
  # ── Phase 5 · Publication — The Tool Chain, ending at the live seam ─────────
  13:
    name: "Binding the Atlas"
    instrument: cli            # stdlib HTML assembly is a template render
    instrument_fallbacks: []
  14:
    name: "Shipping the Atlas"
    instrument: cli            # git + gh are API calls with exit codes
    instrument_fallbacks: []
    instrument_config:
      timeout_seconds: 1800    # includes the bounded Pages deploy poll
  15:
    name: "The Live Seam"
    instrument: cli            # curl the DEPLOYED artifact; recompute from the
    instrument_fallbacks: []   # PUBLISHED data alone. Workspace-green ≠ deployed.

sheet:
  size: 1
  total_items: 15          # movements pre-expansion; engine expands to 21 sheets
  fan_out:
    9: 4                   # Rashomon Gate: four blind frames (sheets 9-12)
    11: 4                  # Talmudic Page: four cross-referencing revisions (14-17)
  dependencies:            # movement-keyed; engine expands to sheet-keyed DAG
    2: [1]                 # canaries run serially — cheap, and failures diagnose clean
    3: [2]                 # met canary joins against the air canary's payload
    4: [1]                 # probe needs the venv python
    5: [2, 3, 4]           # full fetch gated on BOTH canaries + the probe verdict
    6: [5]
    7: [4, 6]              # statistics branch on the probe decision
    8: [7]
    9: [7, 8]              # blind frames read distilled stats + charts
    10: [9]                # triangulation reads ALL FOUR (fan-in)
    11: [10]               # second hearing reads the analyses + triangulation
    12: [11]               # the editor reads the commentaries
    13: [12]
    14: [13]
    15: [14]
  cadenzas:
    # Blind round (sheets 9-12 = instances 1-4 = health/equity/meteorology/trend).
    # Frame lens definitions ship WITH the score ({{ score_dir }}/frames/) —
    # authored statically, reviewable before first run, blindness-gated by the
    # movement-1 validation. Injected as skill: methodology BEFORE the body.
    9:
      - file: "{{ score_dir }}/frames/frame-health.md"
        as: skill
        required: true
    10:
      - file: "{{ score_dir }}/frames/frame-equity.md"
        as: skill
        required: true
    11:
      - file: "{{ score_dir }}/frames/frame-meteorology.md"
        as: skill
        required: true
    12:
      - file: "{{ score_dir }}/frames/frame-trend.md"
        as: skill
        required: true
    # Second hearing (sheets 14-17): the same lens definitions as context.
    14:
      - file: "{{ score_dir }}/frames/frame-health.md"
        as: context
        required: true
    15:
      - file: "{{ score_dir }}/frames/frame-equity.md"
        as: context
        required: true
    16:
      - file: "{{ score_dir }}/frames/frame-meteorology.md"
        as: context
        required: true
    17:
      - file: "{{ score_dir }}/frames/frame-trend.md"
        as: context
        required: true
  descriptions:
    1: "Bootstrap pinned data stack + self-canary (gh identity, judgment instrument, freeze receipt)"
    2: "Air canary — schema + all-pollutant null gate, one city, two days"
    3: "Weather canary — covariates + hour-exact timestamp-array joinability"
    4: "Spatial-resolution probe — 5 intra-city sites, kill authority over the equity frame"
    5: "Full fetch — 11 sites × 2 APIs × 92 days, fail-closed on every pollutant and covariate"
    6: "Clean + unify — tidy CSV, local days, met join, dictionary"
    7: "Frame statistics — deterministic compute + determinism gate"
    8: "Charts — 12 matplotlib PNGs"
    9: "Blind frame analysis — health lens"
    10: "Blind frame analysis — equity lens"
    11: "Blind frame analysis — meteorology lens"
    12: "Blind frame analysis — trend lens"
    13: "Triangulation — agreement distribution with count check"
    14: "Second hearing — health commentary with cross-references"
    15: "Second hearing — equity commentary with cross-references"
    16: "Second hearing — meteorology commentary with cross-references"
    17: "Second hearing — trend commentary with cross-references"
    18: "Editorial synthesis — argued position, named dissent"
    19: "Static site build — stdlib HTML with synthesis seal"
    20: "Publish — public repo + GitHub Pages"
    21: "Live seam — deployed URL answers; published data recomputes"

parallel:
  enabled: true
  max_concurrent: 4          # the two 4-way fan-outs are where concurrency lives
  fail_fast: true

# cross_sheet: deliberately ABSENT. auto_capture_stdout would merely make
# {{ previous_outputs }} available — no sheet template references it, so it
# was inert ballast. The real context economics are structural: judgment
# sheets read the distilled stats/frames.md directly (kilobytes), and the
# blind round must NOT see other sheets' stdout anyway.

retry:
  max_retries: 2
  base_delay_seconds: 30

prompt:
  variables:
    # Single point of change for the publishing identity.
    github_owner: "Mzzkc"
    repo_name: "breathing-atlas"
    # Exposure days are LOCAL days (Europe/Amsterdam) — a resident's day.
    tz: "Europe/Amsterdam"
    past_days: 92             # API cap ~92; the analysis floor is 90 (min_hours)
    min_hours: 2052           # 90 × 24 × 0.95 — the fail-closed fetch floor
    who_limits:
      pm2_5: 15               # WHO 2021, 24-hour mean, μg/m³
      nitrogen_dioxide: 25    # WHO 2021, 24-hour mean, μg/m³
      ozone: 100              # WHO 2021, 8-hour max, μg/m³
    cities:
      amsterdam: "Amsterdam"
      rotterdam: "Rotterdam"
      eindhoven: "Eindhoven"
    # 11 sites: 5 intra-city Amsterdam (probe spread), 3 Rotterdam, 3 Eindhoven.
    sites:
      ams-centrum:   {city: amsterdam, label: "Centrum — city core",            lat: 52.372, lon: 4.895}
      ams-west:      {city: amsterdam, label: "West — 19th-century belt",       lat: 52.376, lon: 4.815}
      ams-noord:     {city: amsterdam, label: "Noord — north of the IJ",        lat: 52.402, lon: 4.872}
      ams-zuidoost:  {city: amsterdam, label: "Zuidoost — southeast periphery", lat: 52.321, lon: 4.948}
      ams-durgerdam: {city: amsterdam, label: "Durgerdam — eastern water edge", lat: 52.386, lon: 5.008}
      rtm-centrum:   {city: rotterdam, label: "Centrum — city core",            lat: 51.922, lon: 4.479}
      rtm-zuid:      {city: rotterdam, label: "Zuid — south of the Maas",       lat: 51.882, lon: 4.477}
      rtm-west:      {city: rotterdam, label: "West — port edge",               lat: 51.918, lon: 4.405}
      ehn-centrum:   {city: eindhoven, label: "Centrum — city core",            lat: 51.441, lon: 5.469}
      ehn-noord:     {city: eindhoven, label: "Woensel — north",                lat: 51.489, lon: 5.453}
      ehn-zuid:      {city: eindhoven, label: "South — Strijp edge",            lat: 51.404, lon: 5.450}
    # The spatial probe: all five intra-city Amsterdam sites — the probe now
    # fetches exactly what it measures (the intra-city gradient claim).
    ams_probe_ids: [ams-centrum, ams-west, ams-zuidoost, ams-noord, ams-durgerdam]
    min_spread_ugm3: 0.5     # absolute floor on the intra-city delta: relative
                              # spread alone is unbounded as means approach
                              # zero, so noise must not fund a
                              # gradient_supported verdict
    frame_by_instance: {1: health, 2: equity, 3: meteorology, 4: trend}
    frame_labels:
      health: "Your health"
      equity: "Your neighborhood"
      meteorology: "Where it comes from"
      trend: "Which way it's heading"

  template: |
    {# ── Macros: the house style, defined once ─────────────────────────── #}
    {% macro strict() %}
    set -euo pipefail
    cd "{{ workspace }}"
    {% endmacro %}

    {% macro numbers_rule() %}
    ## Ground Rules (non-negotiable)
    - Every number you state MUST carry a `stat_ref:` line naming an existing
      key from stats/frames.json. A number you cannot cite is not yours to
      state — write instead that the record does not answer it.
    - You are one independent analyst. Do not speculate about other
      analytical lenses or what other analysts might conclude.
    {% endmacro %}

    {% macro findings_block() %}
    ## Required Output Shape
    - Numbered sections headed exactly `## §1 <title>` ... at least four of them.
    - End with a `## FINDINGS` block, one line per finding, exact format:
      `- stat_ref: <key from frames.json> — <resident-language meaning>`
    - Minimum 5 findings. Minimum 300 words total.
    {% endmacro %}

    {% if stage == 1 %}
    {{ strict() }}
    mkdir -p data
    # ── Self-canary ────────────────────────────────────────────────────────
    # A canary battery that probes only the DATA supply guards the cheap
    # half. The score's two most newcomer-fragile dependencies — publish
    # identity and judgment instruments — die at M14 and M9 respectively
    # if they are broken. Probe them here, at minute one, loudly.
    gh auth status >/dev/null 2>&1 || { echo "FAIL: gh is not authenticated — the atlas publishes at M14"; exit 1; }
    gh_owner="$(gh api user -q .login 2>/dev/null)" || { echo "FAIL: gh api user did not answer"; exit 1; }
    [ "$gh_owner" = "{{ github_owner }}" ] || { echo "FAIL: gh is authenticated as $gh_owner but the score publishes as {{ github_owner }} — fix github_owner or switch gh account"; exit 1; }
    command -v claude >/dev/null 2>&1 || command -v codex >/dev/null 2>&1 || command -v opencode >/dev/null 2>&1 || { echo "FAIL: no judgment instrument on PATH (claude/codex/opencode) — M9 would die after eight tool movements"; exit 1; }
    # ── Pinned data stack ──────────────────────────────────────────────────
    # Bounded pins: reproducible within a major series, and the exact
    # resolution is frozen to data/stack-freeze.txt and PUBLISHED, so the
    # reader recomputes under the environment that produced the numbers.
    if command -v uv >/dev/null 2>&1; then
      uv venv --quiet .venv
      uv pip install --quiet "pandas>=2.2,<3" "scipy>=1.11,<2" "matplotlib>=3.8,<4" "pyyaml>=6,<7"
      uv pip freeze --python .venv/bin/python > data/stack-freeze.txt
    else
      python3 -m venv .venv
      .venv/bin/pip install --quiet --disable-pip-version-check "pandas>=2.2,<3" "scipy>=1.11,<2" "matplotlib>=3.8,<4" "pyyaml>=6,<7"
      .venv/bin/pip freeze > data/stack-freeze.txt
    fi
    .venv/bin/python -c "import pandas, scipy, matplotlib, yaml; print('data stack ready')"
    test -s data/stack-freeze.txt
    grep -q "^pandas==" data/stack-freeze.txt || { echo "FAIL: freeze receipt missing the pandas pin"; exit 1; }
    echo "self-canary ok — gh=$gh_owner, stack frozen:" && cat data/stack-freeze.txt

    {% elif stage == 2 %}
    {{ strict() }}
    mkdir -p canary
    curl -sf "https://air-quality-api.open-meteo.com/v1/air-quality?latitude={{ sites['ams-centrum'].lat }}&longitude={{ sites['ams-centrum'].lon }}&hourly=pm2_5,pm10,nitrogen_dioxide,ozone&past_days=2&forecast_days=1" -o canary/air.json
    jq -e '
      (.hourly.time | length) >= 48
      and (.hourly_units.pm2_5 == "μg/m³")
      and (.hourly | has("nitrogen_dioxide"))
      and (.hourly | has("ozone"))
      and (. as $doc | (["pm2_5", "pm10", "nitrogen_dioxide", "ozone"] | all(. as $p | (($doc.hourly[$p] | map(select(. == null))) | length) / ($doc.hourly[$p] | length) < 0.25)))
    ' canary/air.json > /dev/null
    echo "air canary ok"

    {% elif stage == 3 %}
    {{ strict() }}
    curl -sf "https://api.open-meteo.com/v1/forecast?latitude={{ sites['ams-centrum'].lat }}&longitude={{ sites['ams-centrum'].lon }}&hourly=wind_speed_10m,wind_direction_10m,precipitation,temperature_2m&past_days=2&forecast_days=1" -o canary/met.json
    jq -e '.hourly | has("wind_speed_10m") and has("wind_direction_10m") and has("precipitation") and has("temperature_2m")' canary/met.json > /dev/null
    python3 - <<'PY'
    import json
    air = json.load(open("canary/air.json"))
    met = json.load(open("canary/met.json"))
    # Hour-exact joinability means the TIME ARRAYS are equal — equal
    # lengths are not a join contract. A shifted weather vector of
    # identical length would pass a length check and corrupt every
    # meteorological regression downstream.
    assert air["hourly"]["time"] == met["hourly"]["time"], \
        "joinability broken: time arrays differ (%d air vs %d met points)" % (
            len(air["hourly"]["time"]), len(met["hourly"]["time"]))
    report = {
        "hourly_points": len(met["hourly"]["time"]),
        "fields": sorted(k for k in met["hourly"] if k != "time"),
        "boundary_layer_height": "absent",
        "dispersion_proxy": "wind_speed_10m",
    }
    json.dump(report, open("canary/met-probe.json", "w"), indent=2, sort_keys=True)
    print("met canary ok: hour-exact timestamps verified, not just lengths")
    PY

    {% elif stage == 4 %}
    {{ strict() }}
    mkdir -p canary/probe
    {% for id in ams_probe_ids %}
    curl -sf "https://air-quality-api.open-meteo.com/v1/air-quality?latitude={{ sites[id].lat }}&longitude={{ sites[id].lon }}&hourly=pm2_5&past_days=5&forecast_days=1" -o "canary/probe/{{ id }}.json"
    {% endfor %}
    .venv/bin/python - <<'PY'
    import json
    ams_probe_ids = {{ ams_probe_ids }}
    MIN_SPREAD_UGM3 = {{ min_spread_ugm3 }}
    series = {}
    for sid in ams_probe_ids:
        doc = json.load(open("canary/probe/%s.json" % sid))
        vals = [v for v in doc["hourly"]["pm2_5"] if v is not None]
        assert vals, "probe site %s returned no non-null PM2.5 hours" % sid
        series[sid] = {
            "cell": (round(doc["latitude"], 2), round(doc["longitude"], 2)),
            "mean": sum(vals) / len(vals),
            "n": len(vals),
        }
    cells = set(s["cell"] for s in series.values())
    means = sorted(s["mean"] for s in series.values())
    delta = means[-1] - means[0]
    denom = max(abs(means[-1]), abs(means[0]), 1e-9)
    spread_pct = delta / denom * 100.0
    # TWO bars, not one. Relative spread alone goes unbounded as means
    # approach zero: in a clean-air window a few tenths of a ug/m3 of
    # interpolation wiggle yields a huge percentage and the probe would
    # fund the equity frame's most charged claim with noise. The absolute
    # floor makes the kill gate fail toward its SAFE verdict.
    supported = len(cells) >= 2 and spread_pct > 5.0 and delta > MIN_SPREAD_UGM3
    decision = "gradient_supported" if supported else "gradient_unsupported"
    json.dump({
        "probe_sites": ams_probe_ids,
        "distinct_grid_cells": len(cells),
        "max_intra_city_delta_ugm3": round(delta, 3),
        "max_intra_city_spread_pct": round(spread_pct, 2),
        "decision": decision,
        "decision_rule": "supported iff >=2 distinct grid cells and spread >5%% and delta >%s ug/m3" % MIN_SPREAD_UGM3,
    }, open("canary/resolution-probe.json", "w"), indent=2, sort_keys=True)
    print("grid oracle:", decision, "cells:", len(cells), "delta: %.2f ug/m3, spread: %.2f%%" % (delta, spread_pct))
    PY

