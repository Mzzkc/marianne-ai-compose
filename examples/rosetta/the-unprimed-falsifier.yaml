    cat > scripts/build-onepager.py <<'PYEOF'
    #!/usr/bin/env python3
    """build-onepager.py — reportlab one-pager from FROZEN bytes only."""
    import hashlib, json, re, sys
    from xml.sax.saxutils import escape
    from reportlab.lib.pagesizes import letter
    from reportlab.lib.styles import ParagraphStyle
    from reportlab.lib.units import inch
    from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer
    from pypdf import PdfReader

    def build(slug):
        cfg = json.load(open("run/deployment.json"))
        maxp = int(cfg["onepager_max_pages"])
        frozen = open("frozen/%s.md" % slug, encoding="utf-8").read()
        digest = hashlib.sha256(open("frozen/%s.md" % slug, "rb").read()).hexdigest()[:16]
        title_style = ParagraphStyle("t", fontName="Helvetica-Bold", fontSize=16, leading=20, spaceAfter=6)
        head_style = ParagraphStyle("h", fontName="Helvetica-Bold", fontSize=14, leading=18, spaceBefore=8, spaceAfter=3)
        body_style = ParagraphStyle("b", fontName="Helvetica", fontSize=14, leading=19)
        foot_style = ParagraphStyle("f", fontName="Helvetica", fontSize=9, leading=12, spaceBefore=10)
        story = [Paragraph(escape(slug.upper() + " — plain-language guide (comprehension aid)"), title_style)]
        for block in frozen.split("## "):
            if not block.strip():
                continue
            lines = block.strip().splitlines()
            head = escape(re.sub(r"^[A-Za-z0-9_-]+:\s*", "", lines[0]).strip())
            story.append(Paragraph(head, head_style))
            for ln in lines[1:]:
                s = ln.strip()
                if s.startswith("- "):
                    story.append(Paragraph("&#8226; " + escape(s[2:].strip()), body_style))
                elif s:
                    story.append(Paragraph(escape(s), body_style))
        story.append(Spacer(1, 6))
        story.append(Paragraph(
            "Source digest: %s | This guide accompanies --- do not replace --- your Medication Guide." % digest,
            foot_style))
        out = "dist/%s-onepager.pdf" % slug
        doc = SimpleDocTemplate(out, pagesize=letter,
                                leftMargin=0.7 * inch, rightMargin=0.7 * inch,
                                topMargin=0.6 * inch, bottomMargin=0.6 * inch,
                                title="Plain-language guide: %s" % slug)
        doc.build(story)
        r = PdfReader(out)
        text = "".join((p.extract_text() or "") for p in r.pages)
        ok = True
        if len(r.pages) > maxp:
            print("ONEPAGER FAIL: %s has %d pages (max %d) — shorten flagged-section prose" % (slug, len(r.pages), maxp)); ok = False
        if "accompan" not in text.lower():
            print("ONEPAGER FAIL: %s accompany clause missing from extractable text" % slug); ok = False
        if digest not in text:
            print("ONEPAGER FAIL: %s digest footer missing from extractable text" % slug); ok = False
        if ok:
            print("M10 ONEPAGER PASS: %s (%d pages, digest %s)" % (slug, len(r.pages), digest))
        return 0 if ok else 1

    if __name__ == "__main__":
        sys.exit(build(sys.argv[1]))
    PYEOF

