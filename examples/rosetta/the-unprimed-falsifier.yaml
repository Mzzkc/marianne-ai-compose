    #!/usr/bin/env python3
    """served-content.py <base-url> — served <main> text == normalized frozen md."""
    import difflib, hashlib, html as htmllib, json, re, sys, urllib.request

    def norm_md(text):
        out = []
        for ln in text.splitlines():
            s = ln.strip()
            if s.startswith("## "):
                s = s[3:]
            elif s.startswith("# "):
                s = s[2:]
            elif s.startswith("- "):
                s = s[2:]
            s = s.replace("**", "")
            if s:
                out.append(s)
        return re.sub(r"\s+", " ", " ".join(out)).strip()

    def norm_main(page_html):
        m = re.search(r"(?is)<main[^>]*>(.*?)</main>", page_html)
        t = m.group(1) if m else page_html
        t = re.sub(r"<[^>]+>", " ", t)
        return re.sub(r"\s+", " ", htmllib.unescape(t)).strip()

    def main():
        base = sys.argv[1].rstrip("/")
        drugs = [d["slug"] for d in json.load(open("run/drugs.json"))]
        ok = True
        for drug in drugs:
            frozen = norm_md(open("frozen/%s.md" % drug, encoding="utf-8").read())
            served = norm_main(urllib.request.urlopen("%s/%s.html" % (base, drug),
                                                      timeout=60).read().decode("utf-8", "replace"))
            fh, sh = hashlib.sha256(frozen.encode()).hexdigest(), hashlib.sha256(served.encode()).hexdigest()
            if fh == sh:
                print("SERVED-CONTENT PASS: %s.html exact (sha256 %s)" % (drug, fh[:16]))
            else:
                ok = False
                delta = next(difflib.unified_diff(frozen.split(), served.split(), lineterm=""), None)
                print("SERVED-CONTENT REFUSED: %s.html normalized content differs from frozen (first delta: %r)"
                      % (drug, delta))
        return 0 if ok else 1

    if __name__ == "__main__":
        sys.exit(main())
    PYEOF

    # ── scripts/live-gate.sh — M14: every check, against the DEPLOYED artifact ──
    # Revision replays the omitted checks too (review-2's list): rubric schema,
    # frozen provenance joins, readability determinism AND gate, per-round
    # coder determinism, PDF checks, panel gate, and all six negative
    # controls — alongside the digests, the narrow priming grep, claim
    # arithmetic, the rendered citation gate, WCAG2AA, the internal link
    # check, and the EXACT served-content join. Then the terminator swaps.
    cat > scripts/live-gate.sh <<'SHEOF'
    #!/usr/bin/env bash
    # Gas-Free discipline: yesterday's check authorizes nothing. Every gate
    # re-runs in THIS run against the LIVE URL; then the chain terminator swaps.
    set -euo pipefail
    URL=$(python3 -c 'import json;print(json.load(open("run/deployment.json"))["deployed_url"])')
    G=$(python3 -c 'import json;print(json.load(open("run/deployment.json"))["grade_target"])')
    test -n "$URL" || { echo "LIVE GATE REFUSED: no deployed_url"; exit 1; }
    DRUGS=$(python3 -c 'import json;print(" ".join(d["slug"] for d in json.load(open("run/drugs.json"))))')
    echo "[live-gate] 1/14 registration + freeze digests"
    sha256sum -c rubric.sha256
    sha256sum -c frozen.sha256
    echo "[live-gate] 2/14 rubric schema + thresholds gate replayed"
    .venv/bin/python scripts/rubric-gate.py
    echo "[live-gate] 3/14 provenance joins replayed on the FROZEN bytes"
    for D in $DRUGS; do
      .venv/bin/python scripts/provenance-join.py "$D" "frozen/$D.md" "frozen/$D.yaml"
    done
    echo "[live-gate] 4/14 readability determinism + bounds + grade gate on frozen bytes"
    FROZEN_FILES=$(for D in $DRUGS; do printf 'frozen/%s.md ' "$D"; done)
    .venv/bin/python scripts/readability.py --determinism --files $FROZEN_FILES
    .venv/bin/python scripts/readability.py --gate "$G" --files $FROZEN_FILES
    echo "[live-gate] 5/14 note-coder determinism replayed for EVERY executed round"
    for E in evidence/round-*.json; do
      R=${E#evidence/round-}; R=${R%.json}
      .venv/bin/python scripts/notes.py --check "$R"
    done
    echo "[live-gate] 6/14 one-pager PDFs re-checked (pages, text, footer, digest)"
    for D in $DRUGS; do
      D="$D" .venv/bin/python scripts/pdfcheck.py
    done
    echo "[live-gate] 7/14 panel family-inequality gate replayed"
    .venv/bin/python scripts/panel-manifest.py
    echo "[live-gate] 8/14 all six negative controls re-run"
    bash scripts/negative-controls.sh
    echo "[live-gate] 9/14 priming gate (narrow, path-shaped) replayed over ALL rounds' cards"
    if grep -rqE 'rubric\.yaml|provenance|self-assessment|thresholds\.yaml|battery/|verdict\.json|self-chain|panel-manifest|reader-arms|claims\.jsonl|notes\.py|answer_patterns|spl_medguide|pin-meta' cards/; then
      echo "LIVE GATE REFUSED: a card references an intent instrument"; exit 1
    fi
    echo "[live-gate] 10/14 claim arithmetic + window reclassification"
    .venv/bin/python scripts/claims-join.py --verify
    echo "[live-gate] 11/14 citation + quantifier + numeric-sentence gate on the PUBLISHED evidence page"
    .venv/bin/python scripts/citation-gate.py --rendered
    echo "[live-gate] 12/14 accessibility (WCAG 2 AA) on every served page"
    for p in index evidence $DRUGS; do
      ./node_modules/.bin/pa11y --config run/pa11y-config.json --standard WCAG2AA "$URL/$p.html" >/dev/null
    done
    echo "[live-gate] 13/14 internal link integrity on the live site"
    .venv/bin/python scripts/linkcheck.py "$URL"
    echo "[live-gate] 14/14 served-content EXACT join: the deployment serves the frozen bytes"
    .venv/bin/python scripts/served-content.py "$URL"
    bash scripts/chain-terminate.sh
    echo "M14 LIVE GATE PASS"
    SHEOF

    # ── scripts/chain-terminate.sh — the deterministic end of the concert ───────
    cat > scripts/chain-terminate.sh <<'SHEOF'
    #!/usr/bin/env bash
    # Live gate green => swap self-chain.yaml for a VALIDATED one-sheet
    # terminator. Atomic; a failed validation leaves the chain intact (loud).
    set -euo pipefail
    test -f done.stamp
    TMP="run/.terminator-candidate.yaml"
    cat > "$TMP" <<'TEOF'
    name: plsd-chain-terminator
    description: "Terminal no-op: the Plain-Language Dispensary concert ended by design."
    instrument: cli
    instrument_fallbacks: []
    sheet:
      size: 1
      total_items: 1
      skip_when:
        1:
          command: 'test -f "{{ '{{' }} workspace {{ '}}' }}/.chain-terminated"'
          description: "Already terminated"
          timeout_seconds: 30
    prompt:
      template: |
        set -euo pipefail
        cd "{{ '{{' }} workspace {{ '}}' }}"
        printf 'The Plain-Language Dispensary converged and delivered; chain terminated by design.\n' > .chain-terminated
    validations:
      - type: file_exists
        path: "{{ '{{' }} workspace {{ '}}' }}/.chain-terminated"
        description: "Termination marker written"
    TEOF
    mzt validate "$TMP" && mv "$TMP" self-chain.yaml || {
      echo "TERMINATOR REFUSED: candidate failed validation — chain left intact"; exit 1; }
    touch run/.terminator-swapped
    echo "CHAIN TERMINATOR INSTALLED"
    SHEOF

