    # ── scripts/claims-join.py — M11: The Declared Window's arithmetic ──────────
    # Revision: the independent recompute walks the UNION of task_correct and
    # task_misread keys (a task with zero correct answers is a severe finding,
    # not a verification failure); in-window rows must satisfy >=2 of four
