    # ── scripts/linkcheck.py — internal link integrity, in the venv ────────────
    # Replaces system linkchecker: same-host links only, so an external 404
    # (fda.gov, dailymed) can never fail a published run (review-3).
    cat > scripts/linkcheck.py <<'PYEOF'
    #!/usr/bin/env python3
    """linkcheck.py <base-url> — every same-host link on every page serves."""
    import json, re, sys, urllib.parse, urllib.request

    def check(base):
        drugs = [d["slug"] for d in json.load(open("run/drugs.json"))]
        pages = ["index.html", "evidence.html"] + ["%s.html" % d for d in drugs]
        problems, seen = [], set()
        for page in pages:
            url = base.rstrip("/") + "/" + page
            try:
                html = urllib.request.urlopen(url, timeout=60).read().decode("utf-8", "replace")
            except Exception as e:
                problems.append("%s unreachable: %s" % (page, e)); continue
            for m in re.finditer(r'(?:href|src)="([^"]+)"', html):
                target = urllib.parse.urljoin(url, m.group(1))
                t = urllib.parse.urlparse(target)
                if t.netloc != urllib.parse.urlparse(base).netloc:
                    continue
                if target in seen:
                    continue
                seen.add(target)
                try:
                    code = urllib.request.urlopen(urllib.request.Request(
                        target, method="HEAD"), timeout=60).getcode()
                    if code is not None and code >= 400:
                        problems.append("%s -> %s HTTP %s" % (page, target, code))
                except Exception as e:
                    problems.append("%s -> %s failed: %s" % (page, target, e))
        for p in problems:
            print("LINKCHECK REFUSED: %s" % p)
        print("LINKCHECK %s: %d internal links on %d pages" % ("PASS" if not problems else "FAIL", len(seen), len(pages)))
        return 1 if problems else 0

    if __name__ == "__main__":
        sys.exit(check(sys.argv[1]))
    PYEOF

