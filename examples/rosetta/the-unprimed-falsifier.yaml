    # ── scripts/notes.py — M7: cards -> typed, LOCATED evidence (the coder) ─────
    # Revision responds to all three reviews at the strongest seam:
    #   - QUORUM, not unanimity: a dead reader sheet is typed ABSENT (recorded,
    #     declared on the evidence page); below quorum_min per condition, or
    #     fewer than 2 vendor families per condition, the coder REFUSES.
    #   - CUSTODY: every card must carry this run's nonce; a stale card from a
    #     foreign concert refuses. Card path (drug/arm) must match the
    #     manifest row for its instance (bijection, no duplicates).
    #   - CORROBORATION is counted over the families that actually SUPPLIED
    #     misread-type events — one family's misreads plus another family's
    #     dead-zone note no longer promotes a finding.
    #   - The blind-spot join now grades the maker's own battery answers
    #     (own_answers — previously authored-but-unconsumed) alongside
    #     predicted clarity.
    #   - Unmapped section headings are counted and declared, not silently
    #     bucketed. Conservation, determinism, and the registration digest
    #     join are unchanged.
    cat > scripts/notes.py <<'PYEOF'
    #!/usr/bin/env python3
    """notes.py — deterministic card coder (instrument_fallbacks: [])."""
    import glob, hashlib, json, os, re, sys
    import yaml

    CARD_RE = re.compile(r"^section:\s*(.+?)\s*\|\s*(confusion|misread|dead-zone|correct)\s*\|\s*(.*)$")
    ANS_RE = re.compile(r"^answer-(\d+):\s*(.*)$")
    RUN_RE = re.compile(r"^run:\s*(\S+)\s*$")

    def digest_ok():
        expect = {}
        for line in open("rubric.sha256", encoding="utf-8"):
            parts = line.split()
            if len(parts) == 2:
                expect[parts[1]] = parts[0]
        for path, want in expect.items():
            got = hashlib.sha256(open(path, "rb").read()).hexdigest()
            if got != want:
                return "registration broken: %s digest mismatch" % path
        return None

    def canon_section(heading, section_map):
        for sid, pat in section_map.items():
            try:
                if re.search(pat, heading):
                    return sid, True
            except re.error:
                continue
        slug = re.sub(r"[^a-z0-9]+", "-", heading.lower()).strip("-")[:40]
        return "other:%s" % slug, False

    def parse_card(path):
        out = {"run": None, "medicine": None, "answers": {}, "sections": []}
        for line in open(path, encoding="utf-8", errors="replace").read().splitlines():
            s = line.strip()
            if s.startswith("```"):
                continue
            m = RUN_RE.match(s)
            if m:
                out["run"] = m.group(1); continue
            if s.lower().startswith("medicine:"):
                out["medicine"] = s.split(":", 1)[1].strip(); continue
            m = ANS_RE.match(s)
            if m:
                out["answers"][int(m.group(1))] = m.group(2).strip(); continue
            m = CARD_RE.match(s)
            if m:
                out["sections"].append((m.group(1).strip(), m.group(2), m.group(3).strip()))
        return out

    def active_conditions(manifest, R):
        conds = []
        for r in manifest["readers"]:
            key = (r["drug"], r["arm"])
            if key not in conds:
                conds.append(key)
        if R > 1 and os.path.exists("official-arm-measured.stamp"):
            conds = [c for c in conds if c[1] == "rebuilt"]
        return sorted(conds)

    def code_round():
        R = int(open("run/round.txt", encoding="utf-8").read().strip())
        rubric = yaml.safe_load(open("rubric.yaml", encoding="utf-8"))
        thresholds = yaml.safe_load(open("thresholds.yaml", encoding="utf-8"))
        manifest = yaml.safe_load(open("panel-manifest.yaml", encoding="utf-8"))
        nonce = open("run/run-nonce.txt", encoding="utf-8").read().strip()
        fam_by_instance = {r["instance"]: r for r in manifest["readers"]}
        quorum = int(thresholds.get("quorum_min", 5))
        cards = sorted(glob.glob("cards/*/*/r%d/card-*.md" % R))
        # ── custody + bijection ────────────────────────────────────────────────
        by_instance = {}
        for path in cards:
            instance = int(re.search(r"card-(\d+)\.md$", path).group(1))
            m = re.match(r"cards/([^/]+)/([^/]+)/r%d/card-%d\.md$" % (R, instance), path)
            if not m:
                raise SystemExit("CONSERVATION REFUSED: card path not in cards/<drug>/<arm>/r%d/ layout: %s" % (R, path))
            pdrug, parm = m.group(1), m.group(2)
            row = fam_by_instance.get(instance)
            if row is None:
                raise SystemExit("CONSERVATION REFUSED: card for unknown reader instance %d" % instance)
            if (row["drug"], row["arm"]) != (pdrug, parm):
                raise SystemExit("CONSERVATION REFUSED: card %d filed under %s/%s but the manifest arms it %s/%s"
                                 % (instance, pdrug, parm, row["drug"], row["arm"]))
            if instance in by_instance:
                raise SystemExit("CONSERVATION REFUSED: duplicate card for reader instance %d" % instance)
            card = parse_card(path)
            if card["run"] != nonce:
                raise SystemExit("CONSERVATION REFUSED: card %d run nonce %r != this run's %r (stale or foreign card)"
                                 % (instance, card["run"], nonce))
            by_instance[instance] = (card, row)
        # ── quorum per active condition ────────────────────────────────────────
        absent = []
        for cond in active_conditions(manifest, R):
            rows = [r for r in manifest["readers"] if (r["drug"], r["arm"]) == cond]
            present = [i for i in by_instance if (by_instance[i][1]["drug"], by_instance[i][1]["arm"]) == cond]
            fams = sorted({by_instance[i][1]["family"] for i in present})
            if len(present) < quorum:
                raise SystemExit("QUORUM REFUSED: condition %s/%s round %d has %d of %d cards (quorum %d) — absent: %s"
                                 % (cond[0], cond[1], R, len(present), len(rows), quorum,
                                    [r["instance"] for r in rows if r["instance"] not in present]))
            if len(fams) < 2:
                raise SystemExit("QUORUM REFUSED: condition %s/%s round %d carries a single family %s — corroboration impossible"
                                 % (cond[0], cond[1], R, fams))
            missing = [r["instance"] for r in rows if r["instance"] not in present]
            if missing:
                absent.append({"condition": "%s/%s" % cond, "instances": missing})
        # ── coding ──────────────────────────────────────────────────────────────
        per_condition = {}
        located = {}
        coded = 0
        calibration_failures = 0
        refused_answers = 0
        unmapped_events = 0
        for instance in sorted(by_instance):
            card, meta = by_instance[instance]
            drug, arm, family = meta["drug"], meta["arm"], meta["family"]
            spec = rubric["drugs"][drug]
            cond = per_condition.setdefault((drug, arm), {"n": 0, "task_correct": {}, "task_misread": {}, "task_dead": 0})
            cond["n"] += 1
            coded += 1
            calib = [t for t in spec["tasks"] if t["id"] == 0][0]
            calib_ok = card["medicine"] is not None and any(
                re.search(p, card["medicine"], re.I) for p in calib.get("answer_patterns", []))
            if not calib_ok:
                calibration_failures += 1
                cond["task_dead"] += 1
                for (h, _t, note) in card["sections"]:
                    sid, mapped = canon_section(h, spec["sections"])
                    unmapped_events += 0 if mapped else 1
                    key = (drug, arm, sid)
                    located.setdefault(key, {"families": set(), "misread_families": set(), "events": []})
                    located[key]["families"].add(family)
                    located[key]["events"].append({"type": "dead-zone", "family": family, "note": note[:200]})
                continue
            for t in sorted(spec["tasks"], key=lambda x: x["id"])[1:]:
                tid = t["id"]
                ans = card["answers"].get(tid)
                if ans is None or not ans.strip():
                    refused_answers += 1
                    continue
                if any(re.search(p, ans, re.I) for p in t.get("answer_patterns", [])):
                    cond["task_correct"][tid] = cond["task_correct"].get(tid, 0) + 1
                else:
                    cond["task_misread"][tid] = cond["task_misread"].get(tid, 0) + 1
                    key = (drug, arm, t["section"])
                    located.setdefault(key, {"families": set(), "misread_families": set(), "events": []})
                    located[key]["families"].add(family)
                    located[key]["misread_families"].add(family)
                    located[key]["events"].append({"type": "task-misread", "task": tid, "family": family,
                                                   "answer": ans[:200]})
            for (h, stype, note) in card["sections"]:
                if stype == "correct":
                    continue
                sid, mapped = canon_section(h, spec["sections"])
                unmapped_events += 0 if mapped else 1
                key = (drug, arm, sid)
                located.setdefault(key, {"families": set(), "misread_families": set(), "events": []})
                located[key]["families"].add(family)
                if stype in ("misread", "confusion"):
                    located[key]["misread_families"].add(family)
                located[key]["events"].append({"type": stype, "family": family, "note": note[:200]})
        cmin = int(thresholds.get("corroboration_min", 2))
        dthr = int(thresholds.get("density_threshold", 2))
        per_section, flagged = {}, []
        for (drug, arm, canon), data in sorted(located.items()):
            mis = [e for e in data["events"] if e["type"] in ("misread", "confusion", "task-misread")]
            mis_fams = sorted(data["misread_families"])
            corroborated = len(mis_fams) >= cmin
            entry = {"drug": drug, "arm": arm, "section": canon,
                     "families": sorted(data["families"]), "misread_families": mis_fams,
                     "events": len(data["events"]),
                     "misread_events": len(mis), "corroborated": corroborated,
                     "density": len(mis) if corroborated else 0}
            per_section["%s/%s/%s" % (drug, arm, canon)] = entry
            if corroborated and len(mis) >= dthr and arm == "rebuilt":
                flagged.append({"drug": drug, "section": canon, "density": len(mis),
                                "families": mis_fams})
        gap = []
        maker_tasks = {}
        for drug in rubric["drugs"]:
            sa_path = "self-assessment/%s.yaml" % drug
            if not os.path.exists(sa_path):
                continue
            sa = yaml.safe_load(open(sa_path, encoding="utf-8")) or {}
            for sid, pred in (sa.get("predicted_clarity") or {}).items():
                conf = sum(v["misread_events"] for v in per_section.values()
                           if v["drug"] == drug and v["arm"] == "rebuilt" and v["section"] == sid)
                gap.append({"drug": drug, "section": sid, "predicted_clarity": pred,
                            "reader_misread_events": conf})
            oa = sa.get("own_answers") or {}
            perf = {}
            for t in rubric["drugs"][drug]["tasks"]:
                if t.get("id") == 0:
                    continue
                ans = oa.get(t["id"]) or oa.get(str(t["id"])) or ""
                perf[t["id"]] = bool(ans.strip()) and any(
                    re.search(p, ans, re.I) for p in t.get("answer_patterns", []))
            maker_tasks[drug] = perf
        expected_total = sum(len([r for r in manifest["readers"] if (r["drug"], r["arm"]) == c])
                             for c in active_conditions(manifest, R))
        evidence = {
            "round": R, "cards_in": len(cards), "coded": coded,
            "expected_cards": expected_total, "quorum_min": quorum,
            "absent_readers": absent, "unmapped_section_events": unmapped_events,
            "calibration_failures": calibration_failures, "refused_answers": refused_answers,
            "per_condition": {"%s/%s" % k: v for k, v in sorted(per_condition.items())},
            "per_section": per_section, "flagged": flagged, "maker_reader_gap": gap,
            "maker_task_performance": maker_tasks,
            "run_nonce": nonce,
        }
        return R, evidence, flagged

    def quorum_report(R):
        evidence = json.load(open("evidence/round-%d.json" % R, encoding="utf-8"))
        problems = []
        if evidence["cards_in"] != evidence["coded"]:
            problems.append("conservation: cards_in %d != coded %d" % (evidence["cards_in"], evidence["coded"]))
        for key, cond in evidence["per_condition"].items():
            if cond["n"] < evidence["quorum_min"]:
                problems.append("condition %s: n=%d < quorum %d" % (key, cond["n"], evidence["quorum_min"]))
        for a in evidence.get("absent_readers") or []:
            print("ABSENT: %s -> instances %s (typed, declared)" % (a["condition"], a["instances"]))
        print("QUORUM REPORT round %d: %s" % (R, "OK" if not problems else "; ".join(problems)))
        return 1 if problems else 0

    def main():
        argv = sys.argv[1:]
        problem = digest_ok()
        if problem:
            print("NOTES REFUSED: %s" % problem); return 1
        if "--quorum-report" in argv:
            R = int(open("run/round.txt", encoding="utf-8").read().strip())
            return quorum_report(R)
        if "--check" in argv:
            R = int(argv[argv.index("--check") + 1]) if len(argv) > argv.index("--check") + 1 else \
                int(open("run/round.txt", encoding="utf-8").read().strip())
            blob_expected = "evidence/round-%d.json" % R
            _R, evidence, _f = None, None, None
            # re-derive without writing: code_round is pure given the same inputs
            saved_out = None
            R2, evidence2, _g = code_round()
            blob = json.dumps(evidence2, indent=2, sort_keys=True) + "\n"
            if R2 != R:
                print("NOTES REFUSED: odometer moved since round-%d.json was written" % R); return 1
            if not os.path.exists(blob_expected) or open(blob_expected, encoding="utf-8").read() != blob:
                print("NOTES DETERMINISM REFUSED: re-run differs from %s" % blob_expected); return 1
            print("NOTES DETERMINISM PASS (round %d)" % R)
            return 0
        R, evidence, flagged = code_round()
        out = "evidence/round-%d.json" % R
        os.makedirs("evidence", exist_ok=True)
        blob = json.dumps(evidence, indent=2, sort_keys=True) + "\n"
        open(out, "w", encoding="utf-8").write(blob)
        vi = {"round": R, "max_rounds": int(yaml.safe_load(open("thresholds.yaml"))["max_rounds"]),
              "flagged": flagged}
        open("run/verdict-input-r%d.json" % R, "w", encoding="utf-8").write(
            json.dumps(vi, indent=2, sort_keys=True) + "\n")
        if R == 1 and not os.path.exists("official-arm-measured.stamp"):
            open("official-arm-measured.stamp", "w").write(
                "official arm measured in round 1; pinned bytes re-measure nothing\n")
        print("NOTES PASS: round=%d coded=%d absent=%d flagged=%d"
              % (R, evidence["coded"], len(evidence["absent_readers"]), len(flagged)))
        return 0

    if __name__ == "__main__":
        sys.exit(main())
    PYEOF

    # ── scripts/verdict-apply.py — M8: evidence join + bounds + anti-churn ──────
    # Revision restores the decisive invariant (review-2's core finding): the
    # deterministic evidence, not the LLM, chooses WHETHER. `done` is refused
    # while corroborated flags remain (unless the round bound is hit, which
    # must be declared as exhaustion); a recut set must EQUAL the flag set
    # exactly. The anti-churn diff now covers the section SET (no additions or
    # removals), the heading lines (title edits are changes), and the
    # provenance anchors of unflagged sections (staged as .new.yaml and
    # swapped only after the gates pass).
    cat > scripts/verdict-apply.py <<'PYEOF'
    #!/usr/bin/env python3
    """verdict-apply.py — the deterministic half of the verdict."""
    import json, os, re, subprocess, sys
    import yaml

    def split_sections(path):
        """ids + bodies INCLUDING the heading line (title edits are changes)."""
        ids, secs, cur, buf = [], {}, None, []
        for line in open(path, encoding="utf-8").read().splitlines():
            m = re.match(r"^##\s+([A-Za-z0-9_-]+)", line)
            if m:
                if cur is not None:
                    secs[cur] = buf
                cur, buf = m.group(1), [line]
                ids.append(cur)
            else:
                buf.append(line)
        if cur is not None:
            secs[cur] = buf
        return ids, secs

    def evidence_flags(R):
        try:
            vi = json.load(open("run/verdict-input-r%d.json" % R, encoding="utf-8"))
        except OSError:
            raise SystemExit("VERDICT REFUSED: run/verdict-input-r%d.json missing — the evidence join cannot run without coded evidence" % R)
        per = {}
        for f in vi.get("flagged") or []:
            per.setdefault(f["drug"], set()).add(f["section"])
        return {d: sorted(s) for d, s in per.items()}

    def lawfulness(v, R, maxr, flags=None):
        """The evidence join: returns a refusal string, 'CHAIN-EXHAUSTED', or None."""
        decision = v.get("decision")
        if flags is None:
            flags = evidence_flags(R)
        any_flags = any(flags.values())
        if decision not in ("recut", "done"):
            return "decision must be recut|done"
        if decision == "done":
            if any_flags and R < maxr:
                return "evidence flags remain (%d sections) and round %d < max_rounds %d — author a recut, not done" % (
                    sum(len(s) for s in flags.values()), R, maxr)
            if any_flags and v.get("reason") != "exhausted":
                return "done with remaining flags requires reason: exhausted"
            return None
        # recut
        if not any_flags:
            return "recut with no corroborated flags — author done instead"
        if R >= maxr:
            return "CHAIN-EXHAUSTED"
        per = v.get("per_drug") or {}
        norm = {d: sorted(set(s or [])) for d, s in per.items() if s}
        if norm != flags:
            return "recut set %s != deterministic flag set %s — the evidence chooses, you only execute" % (
                json.dumps(norm, sort_keys=True), json.dumps(flags, sort_keys=True))
        return None

    def prov_anchors(path, drug):
        prov = yaml.safe_load(open(path, encoding="utf-8"))
        pmap = (prov.get("drugs") or {}).get(drug) or prov.get(drug) or {}
        return {sid: [ (a.get("anchor") if isinstance(a, dict) else a) for a in (lst or []) ]
                for sid, lst in pmap.items()}

    def anti_churn(slug, old, new, old_prov, new_prov, flagged):
        problems = []
        old_ids, old_secs = split_sections(old)
        new_ids, new_secs = split_sections(new)
        if set(new_ids) != set(old_ids):
            problems.append("ANTI-CHURN REFUSED: section set changed (%s added/removed) — a recut modifies, it never restructures"
                            % sorted(set(new_ids) ^ set(old_ids)))
        oa, na = prov_anchors(old_prov, slug), prov_anchors(new_prov, slug)
        for sid in old_ids:
            if sid in new_ids and sid not in flagged and old_secs[sid] != new_secs.get(sid):
                problems.append("ANTI-CHURN REFUSED: unflagged section %s/%s changed (heading or body) — recut ONLY flagged sections (Rehearsal Spotlight)" % (slug, sid))
            if sid not in flagged and oa.get(sid) != na.get(sid):
                problems.append("ANTI-CHURN REFUSED: provenance anchors for unflagged section %s/%s changed" % (slug, sid))
        for sid in flagged:
            if sid not in new_secs:
                problems.append("VERDICT REFUSED: flagged section %s/%s absent from recut" % (slug, sid))
        return problems

    def main():
        argv = sys.argv[1:]
        thresholds = yaml.safe_load(open("thresholds.yaml", encoding="utf-8"))
        maxr = int(thresholds.get("max_rounds", 4))
        if "--selftest" in argv:
            os.makedirs("run/.selftest-va", exist_ok=True)
            base = "run/.selftest-va"
            open("%s/old.md" % base, "w").write("## a: A\n- old\n## b: B\n- keep\n")
            open("%s/new.md" % base, "w").write("## a: A\n- new\n## b: B\n- CHANGED AGAINST THE RULE\n")
            open("%s/old.yaml" % base, "w").write("a: [{anchor: old}]\nb: [{anchor: keep}]\n")
            open("%s/new.yaml" % base, "w").write("a: [{anchor: new}]\nb: [{anchor: keep}]\n")
            probs = anti_churn("x", "%s/old.md" % base, "%s/new.md" % base,
                               "%s/old.yaml" % base, "%s/new.yaml" % base, flagged=set("a"))
            v = {"decision": "done", "reason": "quiet"}
            law = lawfulness(v, 1, 4, flags={"x": ["a"]})
            if probs and law:
                print("SELFTEST PASS: unflagged change + evidence-contradicting done both refused"); return 0
            print("SELFTEST FAIL: a planted violation slipped through"); return 1
        if "--verify" in argv:
            rec_path = None
            for cand in sorted(glob_files("run/verdict-records"), reverse=True):
                rec_path = cand
            if rec_path is None:
                print("VERDICT VERIFY REFUSED: no recorded verdict to verify"); return 1
            rec = json.load(open(rec_path, encoding="utf-8"))
            law = lawfulness(rec["verdict"], rec["round"], maxr)
            flags_now = evidence_flags(rec["round"])
            if law == "CHAIN-EXHAUSTED":
                law = None if rec["verdict"].get("reason") == "exhausted" else "exhaustion done requires reason: exhausted"
            if law:
                print("VERDICT VERIFY REFUSED: %s" % law); return 1
            if rec.get("applied_flags") != flags_now:
                print("VERDICT VERIFY REFUSED: recorded flags drifted from evidence"); return 1
            print("VERDICT VERIFY PASS: round %d decision %s lawful against the evidence" % (rec["round"], rec["verdict"]["decision"]))
            return 0
        v = json.load(open("verdict.json", encoding="utf-8"))
        R = int(open("run/round.txt", encoding="utf-8").read().strip())
        law = lawfulness(v, R, maxr)
        if law == "CHAIN-EXHAUSTED":
            print("CHAIN EXHAUSTION: round %d >= max_rounds %d — re-author verdict.json "
                  "with decision: done, reason: exhausted (a null result is publishable)" % (R, maxr))
            return 42
        if law:
            print("VERDICT REFUSED: %s" % law); return 1
        decision = v["decision"]
        if decision == "recut":
            per = v.get("per_drug") or {}
            flagged_total = 0
            for slug, spec in per.items():
                flagged = set(spec.get("flagged") or [])
                if not flagged:
                    continue
                flagged_total += len(flagged)
                new = "rebuilt/%s.new.md" % slug
                old = "rebuilt/%s.md" % slug
                new_prov = "provenance/%s.new.yaml" % slug
                old_prov = "provenance/%s.yaml" % slug
                for path in (new, new_prov):
                    if not os.path.exists(path):
                        print("VERDICT REFUSED: %s missing for recut" % path); return 1
                probs = anti_churn(slug, old, new, old_prov, new_prov, flagged)
                if probs:
                    for p in probs:
                        print(p)
                    return 1
                for tool, args in (
                        (".venv/bin/python", ["scripts/provenance-join.py", slug, new, new_prov]),
                        (".venv/bin/python", ["scripts/readability.py", "--gate",
                                              str(thresholds.get("grade_target", 8)), "--files", new])):
                    rc = subprocess.call([tool] + args)
                    if rc != 0:
                        print("VERDICT REFUSED: recut gate failed (%s)" % " ".join(args)); return rc
                os.replace(new, old)
                os.replace(new_prov, old_prov)
                subprocess.call(["bash", "scripts/stage-delivery.sh", slug])
            if flagged_total == 0:
                print("VERDICT REFUSED: recut with no flagged sections — author done instead"); return 1
            if os.path.exists("done.stamp"):
                os.remove("done.stamp")
            open("recut.stamp", "w").write("round %d recut: %d sections\n" % (R, flagged_total))
            open("run/round.txt", "w").write("%d\n" % (R + 1))
            os.makedirs("run/verdict-records", exist_ok=True)
            json.dump({"round": R, "verdict": v, "applied_flags": evidence_flags(R)},
                      open("run/verdict-records/r%d.json" % R, "w"), indent=2, sort_keys=True)
            print("VERDICT APPLIED: recut round %d -> %d" % (R, R + 1))
            return 0
        # decision == done
        if os.path.exists("recut.stamp"):
            os.remove("recut.stamp")
        open("done.stamp", "w").write("round %d complete: %s\n" % (R, v.get("reason", "quiet")))
        json.dump(v, open("run/final-verdict.json", "w", encoding="utf-8"), indent=2, sort_keys=True)
        os.makedirs("run/verdict-records", exist_ok=True)
        json.dump({"round": R, "verdict": v, "applied_flags": evidence_flags(R)},
                  open("run/verdict-records/r%d.json" % R, "w"), indent=2, sort_keys=True)
        print("VERDICT APPLIED: done at round %d (%s)" % (R, v.get("reason", "quiet")))
        return 0

    def glob_files(d):
        import glob as _g
        return sorted(_g.glob(os.path.join(d, "r*.json")))

    if __name__ == "__main__":
        sys.exit(main())
    PYEOF

