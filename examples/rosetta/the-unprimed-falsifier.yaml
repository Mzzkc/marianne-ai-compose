    cat > scripts/claims-join.py <<'PYEOF'
    #!/usr/bin/env python3
    """claims-join.py — windowed claims ledger with teeth."""
    import json, os, re, sys
    import yaml
    from scipy.stats import binomtest

    WINDOW_CLASSES = [
        re.compile(r"(among|simulated|unprimed)", re.I),
        re.compile(r"(families|GPT|GEMMA|GLM)", re.I),
        re.compile(r"(N\s*=\s*\d+|\d+\s+(?:of|readers|correct|misread|cards|answers|failed|tasks))"),
        re.compile(r"(round\s+\d+|in\s+round)", re.I),
    ]
    QUANTIFIER = re.compile(
        r"\b(all readers|patients will|everyone|always|never|any patient|clear for|"
        r"most readers|most patients|none of the|every participant|proved|proven|improved|guaranteed)\b", re.I)

    def classes_hit(text):
        return sum(1 for c in WINDOW_CLASSES if c.search(text))

    def ci(k, n):
        r = binomtest(int(k), int(n)).proportion_ci(method="exact", confidence_level=0.95)
        return round(r.low, 4), round(r.high, 4)

    def load_inputs():
        ev = json.load(open("frozen/evidence-final.json", encoding="utf-8"))
        manifest = yaml.safe_load(open("panel-manifest.yaml", encoding="utf-8"))
        rounds = [r["round"] for r in ev["rounds"]]
        fams = sorted({r["family"] for r in manifest["readers"]})
        chain = yaml.safe_load(open("self-chain.yaml", encoding="utf-8"))
        observed = {}
        for rnd in ev["rounds"]:
            observed[str(rnd["round"])] = {"%s/%s" % k: v["n"] for k, v in
                                           ((tuple(k.split("/")), v) for k, v in rnd["per_condition"].items())}
        window = {
            "drugs": sorted({r["drug"] for r in manifest["readers"]}),
            "arms": ["official", "rebuilt"],
            "reader_families": fams,
            "corroboration_families": manifest["corroboration_families"],
            "local_families": manifest["local_families"],
            "configured_readers_per_condition": 7,
            "observed_readers_per_condition": observed,
            "quorum_min": ev["rounds"][0].get("quorum_min"),
            "rounds_executed": rounds,
            "max_chain_depth": (chain.get("concert") or {}).get("max_chain_depth"),
            "task_battery": "3 tasks + calibration, identical wording across arms, frozen pre-rebuild",
            "external_validity": "simulated readers (model panels), not human subjects — every derived claim inherits this window",
        }
        return ev, manifest, window

    def emit(ev, window):
        rows, n = [], 0
        fams = "/".join(window["reader_families"])
        def add(class_, text, **kw):
            nonlocal n
            n += 1
            row = {"id": "CL-%03d" % n, "class": class_, "text": text}
            row.update(kw)
            rows.append(row)
        for rnd in ev["rounds"]:
            R = rnd["round"]
            for key, cond in sorted(rnd["per_condition"].items()):
                drug, arm = key.split("/")
                tc = {int(k): v for k, v in (cond["task_correct"] or {}).items()}
                tm = {int(k): v for k, v in (cond["task_misread"] or {}).items()}
                for tid in sorted(set(list(tc) + list(tm))):
                    k = tc.get(tid, 0)
                    m = tm.get(tid, 0)
                    tot = k + m
                    if tot == 0:
                        continue
                    lo, hi = ci(k, tot)
                    add("in-window",
                        "Among N=%d simulated unprimed readers of families %s in round %d (%s, %s arm, task %s): "
                        "%d correct, %d misread (rate %.2f, exact 95%% CI %.2f-%.2f)."
                        % (tot, fams, R, drug, arm, tid, k, m, k / tot, lo, hi),
                        drug=drug, arm=arm, round=R, task=tid, k=k, n=tot)
                if cond["task_dead"]:
                    add("total-seen",
                        "In round %d (%s, %s arm): %d of %d readers failed the calibration item and were typed "
                        "dead-zone (disengaged is separable from confused)." % (R, drug, arm, cond["task_dead"], cond["n"]),
                        drug=drug, arm=arm, round=R)
            for a in (rnd.get("absent_readers") or []):
                add("total-seen",
                    "In round %d (%s): %d expected readers were ABSENT (typed and declared — partial failure tolerated, never hidden)."
                    % (R, a["condition"], len(a["instances"])), round=R)
            add("total-seen",
                "Round %d coded %d cards with %d calibration failures and %d refused (ungradable) answers."
                % (R, rnd["cards_in"], rnd["calibration_failures"], rnd["refused_answers"]), round=R)
        final = max(r["round"] for r in ev["rounds"])
        rnd = [r for r in ev["rounds"] if r["round"] == final][0]
        gap = rnd.get("maker_reader_gap") or []
        maker = rnd.get("maker_task_performance") or {}
        for drug, perf in sorted(maker.items()):
            cond = rnd["per_condition"].get("%s/rebuilt" % drug) or {}
            N = cond.get("n", 0)
            total = len(perf)
            correct = sum(1 for v in perf.values() if v)
            gtext = "; ".join("%s/%s predicted clarity %s vs %d reader misread events" %
                              (g["drug"], g["section"], g["predicted_clarity"], g["reader_misread_events"])
                              for g in gap if g["drug"] == drug)
            add("in-window",
                "Among N=%d simulated unprimed readers of families %s in round %d (%s, rebuilt arm), the maker's blind spot: "
                "the primed maker answered %d of %d battery tasks correctly while unprimed readers located the misreads above; %s."
                % (N, fams, final, drug, correct, total, gtext or "no located misreads"),
                drug=drug, arm="rebuilt", round=final)
        add("refused", "Whether plain-language rebuilding changes patient behavior or health outcomes — "
                       "out of window: no behavior or outcome endpoint was measured.")
        add("refused", "Generalization beyond the tested drugs — "
                       "out of window: the pinned drug set was tested, no more.")
        add("refused", "Comprehension by human patients — out of window: readers were simulated "
                       "(model panels on declared families), not human subjects.")
        add("refused", "That reformulation preserves medical meaning exactly — out of window: provenance is "
                       "enforced as strict-format mapping plus refusal; residual semantic risk is declared, not computed.")
        return rows, window

    def verify(ev, window, rows):
        problems = []
        # Independent recount from raw evidence — over the task-key UNION.
        want = set()
        for rnd in ev["rounds"]:
            for key, cond in rnd["per_condition"].items():
                drug, arm = key.split("/")
                tc = {int(k): v for k, v in (cond["task_correct"] or {}).items()}
                tm = {int(k): v for k, v in (cond["task_misread"] or {}).items()}
                for tid in set(list(tc) + list(tm)):
                    k = int(tc.get(tid, 0))
                    m = int(tm.get(tid, 0))
                    if k + m > 0:
                        want.add((drug, arm, rnd["round"], tid, k, k + m))
        emitted = {(r.get("drug"), r.get("arm"), r.get("round"), r.get("task"), r.get("k"), r.get("n"))
                   for r in rows if r["class"] == "in-window" and r.get("task") is not None
                   and r.get("arm") and r.get("n")}
        if emitted != want:
            problems.append("independent task-count recount drift: %d emitted vs %d recomputed" % (len(emitted), len(want)))
        # Reclassify every row from its OWN text.
        for r in rows:
            if r["class"] == "in-window" and classes_hit(r["text"]) < 2:
                problems.append("%s: in-window row with %d/4 window classes: %s" % (r["id"], classes_hit(r["text"]), r["text"][:80]))
            if QUANTIFIER.search(r["text"]) and r["class"] != "refused":
                problems.append("%s: unwindowed quantifier: %s" % (r["id"], r["text"][:80]))
            if re.search(r"\b(rate|CI)\b", r["text"]):
                m = re.search(r"(\d+) correct, (\d+) misread \(rate ([\d.]+), exact 95% CI ([\d.]+)-([\d.]+)\)", r["text"])
                if m:
                    k, m2 = int(m.group(1)), int(m.group(2))
                    lo, hi = ci(k, k + m2)
                    if abs(float(m.group(3)) - k / (k + m2)) > 0.005 or abs(float(m.group(4)) - lo) > 0.005 \
                       or abs(float(m.group(5)) - hi) > 0.005:
                        problems.append("%s: recomputed rate/CI drift" % r["id"])
        # Join arithmetic.
        iwr = sum(1 for r in rows if r["class"] in ("in-window", "total-seen"))
        refused = sum(1 for r in rows if r["class"] == "refused")
        if iwr + refused != len(rows):
            problems.append("join arithmetic: in-window(%d) + refused(%d) != emitted(%d)" % (iwr, refused, len(rows)))
        return problems, {"exact_in_window": iwr, "refused": refused, "claims_emitted": len(rows)}

    def main():
        argv = sys.argv[1:]
        ev, manifest, window = load_inputs()
        if "--verify" in argv:
            rows = [json.loads(l) for l in open("claims.jsonl", encoding="utf-8") if l.strip()]
            problems, summary = verify(ev, window, rows)
            if problems:
                for p in problems:
                    print("CLAIMS GATE REFUSED: %s" % p)
                return 1
            print("CLAIMS VERIFY PASS: %s" % json.dumps(summary, sort_keys=True))
            return 0
        rows, window = emit(ev, window)
        problems, summary = verify(ev, window, rows)
        if problems:
            for p in problems:
                print("CLAIMS GATE REFUSED: %s" % p)
            return 1
        with open("claims.jsonl", "w", encoding="utf-8") as fh:
            for r in rows:
                fh.write(json.dumps(r, sort_keys=True) + "\n")
        open("window-manifest.yaml", "w", encoding="utf-8").write(
            yaml.safe_dump(window, sort_keys=True, allow_unicode=True))
        open("claims-summary.json", "w", encoding="utf-8").write(
            json.dumps(summary, indent=2, sort_keys=True) + "\n")
        print("CLAIMS PASS: %s" % json.dumps(summary, sort_keys=True))
        return 0

    if __name__ == "__main__":
        sys.exit(main())
    PYEOF

    # ── scripts/citation-gate.py — M12/M14: prose cannot out-window itself ──────
    # Revision: claim IDs dumped in one paragraph no longer launder numeric
    # claims elsewhere — every SENTENCE containing a digit must carry its
    # [CL-xxx] citation in the same sentence; the quantifier vocabulary is
    # expanded beyond six phrases. --selftest plants both violations.
    cat > scripts/citation-gate.py <<'PYEOF'
    #!/usr/bin/env python3
    """citation-gate.py — every ledger row cited; every number and quantifier windowed."""
    import json, re, sys

    SENT = re.compile(r"[^.!?]*[.!?]")
    QUANT = re.compile(
        r"\b(all readers|patients will|everyone|always|never|any patient|clear for|"
        r"most readers|most patients|none of the|every participant|proved|proven|improved|guaranteed)\b", re.I)
    WINDOW = re.compile(r"(among|simulated|unprimed|families|GPT|GEMMA|GLM|round|N\s*=|readers of)", re.I)

    def run(path, rows):
        text = open(path, encoding="utf-8").read()
        problems = []
        for r in rows:
            if ("[%s]" % r["id"]) not in text:
                problems.append("uncited claim row: %s" % r["id"])
        for m in SENT.finditer(text):
            sent = m.group(0)
            if QUANT.search(sent) and not WINDOW.search(sent):
                problems.append("unwindowed quantifier sentence: %s" % sent.strip()[:100])
            body = re.sub(r"\[CL-\d+\]", "", sent)
            if re.search(r"\d", body) and "[CL-" not in sent:
                problems.append("numeric sentence without a same-sentence [CL-] citation: %s" % sent.strip()[:100])
        return problems

    def main():
        argv = sys.argv[1:]
        if "--selftest" in argv:
            open("run/.selftest-evidence.md", "w").write(
                "## Evidence\nPatients will understand this guide. [CL-001]\n"
                "Readers improved to 12 on the scale.\n")
            rows = [{"id": "CL-001", "class": "refused", "text": "x"}]
            probs = run("run/.selftest-evidence.md", rows)
            if len(probs) >= 2:
                print("SELFTEST PASS: unwindowed quantifier + uncited numeric sentence refused"); return 0
            print("SELFTEST FAIL: gate accepted a planted violation"); return 1
        if "--rendered" in argv:
            import re as _re, urllib.request
            cfg = __import__("json").load(open("run/deployment.json", encoding="utf-8"))
            html = urllib.request.urlopen(cfg["deployed_url"].rstrip("/") + "/evidence.html",
                                          timeout=60).read().decode("utf-8", "replace")
            text = _re.sub(r"<[^>]+>", " ", html)
            open("run/served-evidence.txt", "w", encoding="utf-8").write(
                _re.sub(r"\s+", " ", text))
            path = "run/served-evidence.txt"
        else:
            path = "site/evidence.md"
        rows = [json.loads(l) for l in open("claims.jsonl", encoding="utf-8") if l.strip()]
        probs = run(path, rows)
        if probs:
            for p in probs:
                print("CITATION GATE REFUSED: %s" % p)
            return 1
        print("CITATION GATE PASS (%s)" % path)
        return 0

    if __name__ == "__main__":
        sys.exit(main())
    PYEOF

    # ── scripts/negative-controls.sh — the recorded gate teeth ──────────────────
    # Revision fixes the review-1/2 blocker: each gate's --selftest exits 0
    # when it OBSERVES its planted violation being refused (that IS the teeth
    # proof), so run_case expects rc==0 on success. Six controls now — the
    # assessment gate and the verdict's evidence join/anti-churn joined the
    # original four.
    cat > scripts/negative-controls.sh <<'SHEOF'
    #!/usr/bin/env bash
    # Six planted violations; each gate's selftest MUST observe refusal (rc 0).
    # A gate that cannot fail is a receipt. Records run/negative-controls.json.
    set -uo pipefail
    fail=0
    run_case () {
      name=$1; shift
      "$@" >/dev/null 2>&1
      rc=$?
      if [ "$rc" -eq 0 ]; then
        echo "  TEETH PROVEN: $name"
        printf '"%s": {"passed": true},\n' "$name" >> run/negative-controls.partial
      else
        echo "  ACCEPTED/CRASHED (rc=$rc) — GATE HAS NO TEETH: $name"
        printf '"%s": {"passed": false, "rc": %d},\n' "$name" "$rc" >> run/negative-controls.partial
        fail=1
      fi
    }
    : > run/negative-controls.partial
    echo "negative controls:"
    run_case "rubric-schema-thresholds" .venv/bin/python scripts/rubric-gate.py --selftest
    run_case "provenance-unmappable-prose" .venv/bin/python scripts/provenance-join.py --selftest
    run_case "panel-single-family" .venv/bin/python scripts/panel-manifest.py --selftest
    run_case "citation-unwindowed-numeric" .venv/bin/python scripts/citation-gate.py --selftest
    run_case "assess-malformed" .venv/bin/python scripts/assess-gate.py --selftest
    run_case "verdict-anti-churn-evidence-join" .venv/bin/python scripts/verdict-apply.py --selftest
    { printf '{\n'; sed '$ s/,$//' run/negative-controls.partial; printf '}\n'; } > run/negative-controls.json
    rm -f run/negative-controls.partial
    if [ "$fail" -ne 0 ]; then echo "NEGATIVE CONTROLS FAIL: a gate accepted its planted violation"; exit 1; fi
    echo "NEGATIVE CONTROLS PASS: all six gates refused their planted violations"
    SHEOF

