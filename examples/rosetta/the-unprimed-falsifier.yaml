    description: "M2: registration hash holds AND schema gate passes (anchors grep-able, drug set == pinned set, thresholds in range)"
  - type: command_succeeds
    command: 'cd "{workspace}" && for D in $(cat run/drug-order.txt); do test -s "battery/$D.md" || exit 1; done'
    condition: "stage == 3"
    stage: 3
    description: "M2: battery extracted per drug (questions only — keys never left the rubric)"
  # ── M3 · Baseline Readability ────────────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/readability-official.json"
    condition: "stage == 4"
    stage: 1
    description: "M3: baseline measured"
  - type: command_succeeds
    command: 'cd "{workspace}" && .venv/bin/python scripts/readability.py --determinism --files $(echo official/*.md)'
    condition: "stage == 4"
    stage: 2
    description: "M3: determinism replay + bounds (the problem statement, re-derivable)"
  # ── M4 · Assemble (per drug, by instance) ────────────────────────────────────
  - type: command_succeeds
    command: 'D=$(sed -n "{instance}p" "{workspace}/run/drug-order.txt"); test -s "{workspace}/rebuilt/$D.md" -a -s "{workspace}/provenance/$D.yaml" -a -s "{workspace}/self-assessment/$D.yaml"'
    condition: "stage == 5"
    stage: 1
    description: "M4: rebuild + provenance + the primed self-assessment exist"
  - type: command_succeeds
    command: 'D=$(sed -n "{instance}p" "{workspace}/run/drug-order.txt"); cd "{workspace}" && .venv/bin/python scripts/assess-gate.py "$D"'
    condition: "stage == 5"
    stage: 2
    description: "M4: the blind-spot instrument is COMPLETE (every section covered 1-5, all battery answers present)"
  - type: command_succeeds
    command: 'D=$(sed -n "{instance}p" "{workspace}/run/drug-order.txt"); cd "{workspace}" && .venv/bin/python scripts/provenance-join.py "$D"'
    condition: "stage == 5"
    stage: 3
    description: "M4: strict-format reformulation-only provenance join passes (every bullet maps to official text; no prose escapes)"
  - type: command_succeeds
    command: 'D=$(sed -n "{instance}p" "{workspace}/run/drug-order.txt"); cd "{workspace}" && G=$(python3 -c "import json;print(json.load(open(\"run/deployment.json\"))[\"grade_target\"])") && .venv/bin/python scripts/readability.py --gate "$G" --files "rebuilt/$D.md"'
    condition: "stage == 5"
    stage: 3
    description: "M4: rebuild meets the grade target"
  - type: command_succeeds
    command: 'D=$(sed -n "{instance}p" "{workspace}/run/drug-order.txt"); test -f "{workspace}/.assembled-$D"'
    condition: "stage == 5"
    stage: 3
    description: "M4: delivery staged for this drug's readers"
  # ── M5 · Panel Manifest ──────────────────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/panel-manifest.yaml"
    condition: "stage == 6"
    stage: 1
    description: "M5: manifest emitted"
  - type: command_succeeds
    command: 'cd "{workspace}" && .venv/bin/python scripts/panel-manifest.py && N=$(.venv/bin/python -c "import yaml;print(yaml.safe_load(open(\"self-chain.yaml\"))[\"sheet\"][\"fan_out\"][7])") && test "$(wc -l < reader-arms.txt)" -eq "$N"'
    condition: "stage == 6"
    stage: 2
    description: "M5: per-condition family-inequality gate re-passes; reader count derived from the staged copy, not hardcoded"
  # ── M6 · Read-Cold (per reader, by instance) ─────────────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && test -s "$(bash scripts/card-path.sh {instance})"'
    condition: "stage == 7"
    stage: 1
    description: "M6: this reader's card exists"
  - type: command_succeeds
    command: 'cd "{workspace}" && C=$(bash scripts/card-path.sh {instance}) && head -1 "$C" | grep -q "^run: $(cat run/run-nonce.txt)$" && grep -q "^medicine:" "$C" && grep -q "^answer-1:" "$C" && grep -q "^answer-2:" "$C" && grep -q "^answer-3:" "$C" && grep -q "^section:" "$C"'
    condition: "stage == 7"
    stage: 2
    description: "M6: card carries THIS run's nonce + the exact labels + ALL THREE task answers (a silent card cannot pass)"
  - type: command_succeeds
    command: '! grep -rqE "rubric\.yaml|provenance|self-assessment|thresholds\.yaml|battery/|verdict\.json|self-chain|panel-manifest|reader-arms|claims\.jsonl|notes\.py|answer_patterns|spl_medguide|pin-meta" "{workspace}/cards"'
    condition: "stage == 7"
    stage: 2
    description: "M6: THE PRIMING GATE — narrow and path-shaped (Immune Checkpoint discipline: a fatal late replay must not fire on ordinary English like 'intent')"
  # ── M7 · Note-Code ───────────────────────────────────────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && test -s "evidence/round-$(cat run/round.txt).json"'
    condition: "stage == 8"
    stage: 1
    description: "M7: this round's evidence file exists"
  - type: command_succeeds
    command: 'cd "{workspace}" && .venv/bin/python scripts/notes.py --check'
    condition: "stage == 8"
    stage: 2
    description: "M7: coder determinism (re-run byte-identical) + registration digest + nonce join held"
  - type: command_succeeds
    command: 'cd "{workspace}" && .venv/bin/python scripts/notes.py --quorum-report'
    condition: "stage == 8"
    stage: 2
    description: "M7: conservation + per-condition quorum + absent readers typed and declared"
  # ── M8 · Verdict ─────────────────────────────────────────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && test -s verdict.json && ! (test -f done.stamp && test -f recut.stamp)'
    condition: "stage == 9"
    stage: 1
    description: "M8: a verdict exists; exactly one outcome stamp (never both)"
  - type: command_succeeds
    command: 'cd "{workspace}" && (test -f recut.stamp || (test -f done.stamp && test -s run/final-verdict.json))'
    condition: "stage == 9"
    stage: 2
    description: "M8: recut stamped and odometer advanced, OR done stamped with the final verdict recorded"
  - type: command_succeeds
    command: 'cd "{workspace}" && .venv/bin/python scripts/verdict-apply.py --verify'
    condition: "stage == 9"
    stage: 3
    description: "M8: the evidence join held — done was lawful against the flags (or exhausted at the bound) and the applied recut set equals the deterministic flag set"
  # ── M9 · Lock ────────────────────────────────────────────────────────────────
  - type: command_succeeds
    command: 'test -f "{workspace}/done.stamp"'
    condition: "stage == 10"
    stage: 1
    description: "M9: the chain TERMINATED (never abandoned)"
  - type: command_succeeds
    command: 'cd "{workspace}" && sha256sum -c frozen.sha256 && test "$(wc -l < frozen.sha256)" -ge 10'
    condition: "stage == 10"
    stage: 2
    description: "M9: the EXTENDED freeze digest verifies and actually covers the claimed surface (>= 10 files: guides, provenance, evidence, registration, manifest, verdict)"
  - type: file_exists
    path: "{workspace}/frozen/evidence-final.json"
    condition: "stage == 10"
    stage: 2
    description: "M9: all rounds' evidence frozen with the guides"
  # ── M10 · One-Pagers (per drug, by instance) ─────────────────────────────────
  - type: command_succeeds
    command: 'D=$(sed -n "{instance}p" "{workspace}/run/drug-order.txt"); test -s "{workspace}/dist/$D-onepager.pdf"'
    condition: "stage == 11"
    stage: 1
    description: "M10: the printable one-pager exists"
  - type: command_succeeds
    command: 'cd "{workspace}" && D=$(sed -n "{instance}p" run/drug-order.txt) && sha256sum -c frozen.sha256 >/dev/null && D="$D" .venv/bin/python scripts/pdfcheck.py'
    condition: "stage == 11"
    stage: 2
    description: "M10: digest join + page cap + extractable text + the accompany clause + the digest footer (pypdf, no poppler)"
  # ── M11 · Claims Ledger ──────────────────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/claims.jsonl"
    condition: "stage == 12"
    stage: 1
    description: "M11: the ledger exists"
  - type: command_succeeds
    command: 'cd "{workspace}" && .venv/bin/python scripts/claims-join.py --verify'
    condition: "stage == 12"
    stage: 2
    description: "M11: join arithmetic + independent recompute (over the task-key union) + 2-of-4 window classes all hold"
  - type: command_succeeds
    command: 'cd "{workspace}" && test "$(wc -l < claims.jsonl)" -ge 8 && python3 -c "import json; d=json.load(open(\"run/negative-controls.json\")); assert len(d)==6 and all(v[\"passed\"] for v in d.values()), \"gate teeth unproven\""'
    condition: "stage == 12"
    stage: 2
    description: "M11: substantive ledger AND all six negative controls refused their planted violations"
  # ── M12 · Evidence Prose ─────────────────────────────────────────────────────
  - type: file_exists
    path: "{workspace}/site/evidence.md"
    condition: "stage == 13"
    stage: 1
    description: "M12: the evidence page draft exists"
  - type: content_contains
    path: "{workspace}/site/evidence.md"
    pattern: "## Limits of this evidence"
    condition: "stage == 13"
    stage: 2
    description: "M12: the limits section exists (the window is visible, not buried)"
  - type: command_succeeds
    command: 'cd "{workspace}" && .venv/bin/python scripts/citation-gate.py'
    condition: "stage == 13"
    stage: 3
    description: "M12: every ledger row cited; every quantifier windowed; every numeric sentence carries its citation"
  # ── M13 · Site Build + Deploy ────────────────────────────────────────────────
  - type: command_succeeds
    command: 'cd "{workspace}" && test -s site/index.html -a -s site/evidence.html && for D in $(cat run/drug-order.txt); do test -s "site/$D.html" -a -s "site/downloads/$D-onepager.pdf" || exit 1; done'
    condition: "stage == 14"
    stage: 1
    description: "M13: the site is built from frozen bytes (index, evidence, per-drug pages, downloadable PDFs)"
  - type: command_succeeds
    command: 'python3 -c "import json; d=json.load(open(\"{workspace}/run/deployment.json\")); assert d.get(\"deployed_url\") and d.get(\"deployed_sha\"), \"no recorded deployment\""'
    condition: "stage == 14"
    stage: 2
    description: "M13: deployment facts recorded (URL + served commit)"
  - type: command_succeeds
    command: 'curl -fsS --max-time 30 "$(python3 -c "import json;print(json.load(open(\"{workspace}/run/deployment.json\"))[\"deployed_url\"] + \"/index.html\")")" | grep -qi "plain-language"'
    condition: "stage == 14"
    stage: 3
    description: "M13: the LIVE site serves the index (running-artifact check)"
  # ── M14 · Live Gate ──────────────────────────────────────────────────────────
  - type: command_succeeds
    command: 'bash "{workspace}/scripts/live-gate.sh"'
    working_directory: "{workspace}"
    condition: "stage == 15"
    stage: 2
    description: "M14: EVERY gate replayed green against the DEPLOYED artifact — digests, rubric gate, frozen provenance joins, readability determinism+gate, per-round coder determinism, PDF checks, panel gate, six negative controls, narrow priming grep, claim arithmetic, rendered citation gate, WCAG2AA, internal links, EXACT served-content join"
    timeout_seconds: 2400
  - type: command_succeeds
    command: 'test -f "{workspace}/run/.terminator-swapped" && grep -q plsd-chain-terminator "{workspace}/self-chain.yaml"'
    condition: "stage == 15"
    stage: 3
    description: "M14: the deterministic chain terminator is installed — the concert ends by design"
