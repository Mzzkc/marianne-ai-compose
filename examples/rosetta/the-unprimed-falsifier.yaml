    # ── scripts/provenance-join.py — M4/M8/M14: reformulation-only, STRICT ──────
    # Revision closes the review-1/2 bypass: the rebuilt guide format is
    # headings + bullets ONLY. Any other non-blank content line REFUSES (a
    # paragraph of unanchored medical claims can no longer sail through as a
    # zero-bullet section). Duplicate section ids are detected during parsing
    # (list-based, not dict-overwritten), and a section needs >=1 bullet with
    # >=1 matching anchor. 'No new medical claims' is enforced as
    # strict-format + mapping + refusal; residual semantic risk is declared on
    # the evidence page, never claimed as arithmetic.
    cat > scripts/provenance-join.py <<'PYEOF'
    #!/usr/bin/env python3
    """provenance-join.py — every rebuilt bullet maps to official text, strictly."""
    import re, sys
    import yaml

    def split_sections(path):
        """Return (ordered ids, {id: [lines INCLUDING heading]}) or raise on dup."""
        ids, secs, cur, buf = [], {}, None, []
        for line in open(path, encoding="utf-8").read().splitlines():
            m = re.match(r"^##\s+([A-Za-z0-9_-]+)\s*(?::(.*))?$", line)
            if m:
                if cur is not None:
                    secs[cur] = buf
                cur, buf = m.group(1), [line]
                if cur in secs or cur in ids:
                    raise ValueError("duplicate section id %r" % cur)
                ids.append(cur)
            else:
                if cur is None and line.strip() and not line.startswith("# "):
                    raise ValueError("content before the first section heading: %r" % line[:60])
                buf.append(line)
        if cur is not None:
            secs[cur] = buf
        return ids, secs

    def strict_bullets(sid, buf):
        """Bullets under a section; ANY other non-blank line refuses."""
        bl = []
        for ln in buf[1:]:
            s = ln.strip()
            if not s:
                continue
            if s.startswith("- "):
                bl.append(s[2:].strip())
            else:
                raise ValueError("section %s: non-bullet content line refused (strict format: headings + bullets only): %r"
                                 % (sid, s[:60]))
        return bl

    def run_join(rebuilt_path, prov, official_text, drug):
        problems = []
        try:
            ids, secs = split_sections(rebuilt_path)
        except ValueError as e:
            return ["%s: %s" % (drug, e)]
        if not ids:
            problems.append("%s: no sections in rebuilt guide" % drug)
        pmap = (prov.get("drugs") or {}).get(drug) or prov.get(drug) or {}
        for sid in ids:
            try:
                bl = strict_bullets(sid, secs[sid])
            except ValueError as e:
                problems.append("%s: %s" % (drug, e)); continue
            anchors = pmap.get(sid) or []
            if not bl:
                problems.append("%s/%s: section has no bullets (empty section refused)" % (drug, sid)); continue
            if not anchors:
                problems.append("%s/%s: no provenance anchors for a non-empty section" % (drug, sid)); continue
            if len(bl) != len(anchors):
                problems.append("%s/%s: %d bullets vs %d anchors" % (drug, sid, len(bl), len(anchors)))
                continue
            for i, a in enumerate(anchors):
                pat = a.get("anchor") if isinstance(a, dict) else a
                try:
                    if not re.search(pat, official_text):
                        problems.append("%s/%s bullet %d: anchor not found in official text: %r" % (drug, sid, i + 1, pat))
                except re.error as e:
                    problems.append("%s/%s bullet %d: bad regex %r: %s" % (drug, sid, i + 1, pat, e))
        for sid in pmap:
            if sid not in secs:
                problems.append("%s: provenance entry for absent section %s" % (drug, sid))
        return problems

    def main():
        argv = sys.argv[1:]
        if "--selftest" in argv:
            open("run/.selftest-rebuilt.md", "w").write("## test: T\n- You should take extra vitamins.\n")
            fake = {"test": [{"anchor": "(?i)zzz-no-such-passage"}]}
            probs = run_join("run/.selftest-rebuilt.md", fake, "the official text has no such passage", "selftest")
            open("run/.selftest-prose.md", "w").write("## test2: T\nA paragraph of unanchored medical claims.\n")
            probs += run_join("run/.selftest-prose.md", {"test2": []}, "official text", "selftest2")
            if len(probs) >= 2:
                print("SELFTEST PASS: unmappable bullet AND non-bullet prose refused"); return 0
            print("SELFTEST FAIL: join accepted a planted violation"); return 1
        drug = sys.argv[1]
        rebuilt = sys.argv[2] if len(sys.argv) > 2 else "rebuilt/%s.md" % drug
        prov_path = sys.argv[3] if len(sys.argv) > 3 else "provenance/%s.yaml" % drug
        official_text = open("official/%s.md" % drug, encoding="utf-8").read().replace("\n", " ")
        prov = yaml.safe_load(open(prov_path, encoding="utf-8"))
        probs = run_join(rebuilt, prov, official_text, drug)
        if probs:
            for p in probs:
                print("PROVENANCE GATE REFUSED: %s" % p)
            return 1
        print("PROVENANCE GATE PASS: %s" % drug)
        return 0

    if __name__ == "__main__":
        sys.exit(main())
    PYEOF

    # ── scripts/assess-gate.py — M4: the blind-spot instrument's schema gate ────
    # Revision (review-2/3): the self-assessment was validated only by a
    # substring grep. Now: predicted_clarity must cover EVERY section id of the
    # rebuilt guide with an integer 1..5, and own_answers must cover every
    # battery task (the decomposition's maker panel — previously a dead
    # artifact; notes.py now grades it).
    cat > scripts/assess-gate.py <<'PYEOF'
    #!/usr/bin/env python3
    """assess-gate.py — self-assessment schema gate (both halves, complete)."""
    import re, sys
    import yaml

    def rebuilt_ids(path):
        return re.findall(r"^##\s+([A-Za-z0-9_-]+)", open(path, encoding="utf-8").read(), re.M)

    def check(drug, rubric_path="rubric.yaml", rebuilt_path=None, sa_path=None):
        problems = []
        rebuilt_path = rebuilt_path or "rebuilt/%s.md" % drug
        sa_path = sa_path or "self-assessment/%s.yaml" % drug
        try:
            rubric = yaml.safe_load(open(rubric_path, encoding="utf-8"))["drugs"][drug]
        except (OSError, KeyError):
            return ["no rubric entry for %s" % drug]
        try:
            sa = yaml.safe_load(open(sa_path, encoding="utf-8")) or {}
        except OSError:
            return ["%s missing" % sa_path]
        ids = rebuilt_ids(rebuilt_path)
        pc = sa.get("predicted_clarity") or {}
        for sid in ids:
            v = pc.get(sid)
            if not isinstance(v, int) or isinstance(v, bool) or not (1 <= v <= 5):
                problems.append("%s: predicted_clarity[%r] must be an integer 1..5 (got %r)" % (drug, sid, v))
        for sid in pc:
            if sid not in ids:
                problems.append("%s: predicted_clarity covers absent section %r" % (drug, sid))
        task_ids = sorted(t["id"] for t in rubric.get("tasks") or [] if t.get("id") != 0)
        oa = sa.get("own_answers") or {}
        for tid in task_ids:
            v = oa.get(tid) or oa.get(str(tid))
            if not isinstance(v, str) or not v.strip():
                problems.append("%s: own_answers[%r] missing or empty (the maker panel is load-bearing)" % (drug, tid))
        return problems

    def main():
        argv = sys.argv[1:]
        if "--selftest" in argv:
            import os
            os.makedirs("run/.selftest-ag", exist_ok=True)
            base = "run/.selftest-ag"
            open("%s/rebuilt.md" % base, "w").write("## a: A\n- one\n## b: B\n- two\n")
            yaml.safe_dump({"a": 9, "b": 2}, open("%s/sa.yaml" % base, "w"))
            yaml.safe_dump({"drugs": {"x": {"tasks": [
                {"id": 0, "question": "q", "answer_patterns": ["x"]},
                {"id": 1, "question": "q", "answer_patterns": ["x"]}]}}},
                open("%s/rubric.yaml" % base, "w"))
            probs = check("x", rubric_path="%s/rubric.yaml" % base,
                          rebuilt_path="%s/rebuilt.md" % base, sa_path="%s/sa.yaml" % base)
            if len(probs) >= 2:
                print("SELFTEST PASS: malformed self-assessment refused (%d problems)" % len(probs)); return 0
            print("SELFTEST FAIL: gate accepted a malformed self-assessment"); return 1
        drug = argv[0] if argv else None
        drugs = [drug] if drug else [d["slug"] for d in __import__("json").load(open("run/drugs.json"))]
        probs = []
        for d in drugs:
            probs += check(d)
        if probs:
            for p in probs:
                print("ASSESS GATE REFUSED: %s" % p)
            return 1
        print("ASSESS GATE PASS: %s" % ", ".join(drugs))
        return 0

    if __name__ == "__main__":
        sys.exit(main())
    PYEOF

    # ── scripts/panel-manifest.py — M5: Condorcet's Premise per condition ───────
    # Parses the STAGED SCORE COPY (self-chain.yaml — the bytes actually
    # running) with the engine's own expansion arithmetic, resolves every
    # reader sheet's instrument, maps instruments to vendor families, and
    # REFUSES fewer than corroboration_min distinct corroboration families in
    # ANY drug×arm condition (revision: per condition, not globally — a future
    # layout concentrating families in different conditions no longer passes).
    # Emits panel-manifest.yaml + reader-arms.txt. --selftest feeds a doctored
    # single-family config and must observe refusal.
    cat > scripts/panel-manifest.py <<'PYEOF'
    #!/usr/bin/env python3
    """panel-manifest.py — the per-condition family-inequality gate."""
    import sys
    import yaml

    READER_MOVEMENT = 7

    def expand(movements, fan_out):
        total, stage_sheets = 0, {}
        for m in sorted(movements):
            n = fan_out.get(m, 1)
            stage_sheets[m] = list(range(total + 1, total + n + 1))
            total += n
        return stage_sheets

    def resolve(stage_sheets, cfg):
        per_sheet = (cfg.get("sheet") or {}).get("per_sheet_instruments") or {}
        mv_instr = {}
        for m, mdef in (cfg.get("movements") or {}).items():
            if isinstance(mdef, dict) and mdef.get("instrument"):
                mv_instr[int(m)] = mdef["instrument"]
        resolved = {}
        for m, sheets in stage_sheets.items():
            default = mv_instr.get(m) or cfg.get("instrument")
            for offset, sn in enumerate(sheets, start=1):
                resolved[sn] = {"instance": offset, "instrument": per_sheet.get(sn, default)}
        return resolved

    def gate(cfg, families):
        fan_out = {int(k): v for k, v in ((cfg.get("sheet") or {}).get("fan_out") or {}).items()}
        movements = {int(k): v for k, v in (cfg.get("movements") or {}).items()}
        stage_sheets = expand(movements, fan_out)
        readers = {int(k): v for k, v in ((cfg.get("prompt") or {}).get("variables") or {}).get("readers", {}).items()}
        drugs = ((cfg.get("prompt") or {}).get("variables") or {}).get("drugs") or {}
        slugs = [spec["slug"] for k, spec in sorted(drugs.items(), key=lambda kv: int(kv[0]))]
        resolved = resolve(stage_sheets, cfg)
        rows, problems = [], []
        if READER_MOVEMENT not in stage_sheets:
            return rows, ["movement %d absent from config" % READER_MOVEMENT]
        for sn in sorted(stage_sheets[READER_MOVEMENT]):
            info = resolved.get(sn)
            if info is None:
                problems.append("sheet %d: unresolved instrument" % sn); continue
            inst = info["instrument"]
            fam = families.get(inst)
            if fam is None:
                problems.append("sheet %d: instrument %r has no family mapping" % (sn, inst)); continue
            r = readers.get(info["instance"])
            if r is None:
                problems.append("sheet %d: reader instance %d missing from variables" % (sn, info["instance"])); continue
            rows.append({"sheet": sn, "instance": info["instance"], "drug": r["drug"],
                         "arm": r["arm"], "tier": r["tier"], "instrument": inst, "family": fam})
        return rows, problems

    def condition_families(rows, tier="corroboration"):
        per = {}
        for r in rows:
            if r["tier"] == tier:
                per.setdefault((r["drug"], r["arm"]), set()).add(r["family"])
        return per

    def main():
        argv = sys.argv[1:]
        thresholds = yaml.safe_load(open("thresholds.yaml", encoding="utf-8"))
        need = int(thresholds.get("corroboration_min", 2))
        if "--selftest" in argv:
            cfg = {"instrument": "claude-code",
                   "movements": {"7": {"instrument": "claude-code"}},
                   "sheet": {"fan_out": {7: 2}},
                   "prompt": {"variables": {"readers": {
                       1: {"drug": "warfarin", "arm": "official", "tier": "corroboration"},
                       2: {"drug": "warfarin", "arm": "rebuilt", "tier": "corroboration"}}}}}
            families = {"claude-code": "GLM"}
            rows, problems = gate(cfg, families)
            per = condition_families(rows)
            bad = problems or any(len(f) < need for f in per.values()) or len(rows) != 2
            if bad:
                print("SELFTEST PASS: single-family panel refused"); return 0
            print("SELFTEST FAIL: gate accepted a single-family panel"); return 1
        cfg = yaml.safe_load(open("self-chain.yaml", encoding="utf-8"))
        families = {k: str(v) for k, v in cfg["prompt"]["variables"]["families"].items()}
        rows, problems = gate(cfg, families)
        if problems:
            for p in problems:
                print("PANEL GATE REFUSED: %s" % p)
            return 1
        per = condition_families(rows)
        slugs = [spec["slug"] for k, spec in sorted((cfg["prompt"]["variables"].get("drugs") or {}).items(), key=lambda kv: int(kv[0]))]
        expected = {(d, a) for d in slugs for a in ("official", "rebuilt")}
        for cond in sorted(expected):
            fams = per.get(cond)
            if not fams:
                print("PANEL GATE REFUSED: condition %s/%s has NO corroboration readers" % cond); return 1
            if len(fams) < need:
                print("PANEL GATE REFUSED: condition %s/%s corroboration families %s < %d — a correlated panel cannot ratify its own blind spot"
                      % (cond[0], cond[1], sorted(fams), need)); return 1
        corr = sorted({f for fams in per.values() for f in fams})
        local = sorted({r["family"] for r in rows if r["tier"] == "local"})
        manifest = {
            "corroboration_families": corr,
            "local_families": local,
            "per_condition_corroboration": {"%s/%s" % k: sorted(v) for k, v in sorted(per.items())},
            "readers": [{"instance": r["instance"], "drug": r["drug"], "arm": r["arm"],
                         "tier": r["tier"], "instrument": r["instrument"], "family": r["family"]} for r in rows],
            "source": "self-chain.yaml (staged score copy — a fact about the configuration actually running; execution-identity receipts are an engine primitive this score records as a limit)",
        }
        open("panel-manifest.yaml", "w", encoding="utf-8").write(
            yaml.safe_dump(manifest, sort_keys=True, allow_unicode=True))
        with open("reader-arms.txt", "w", encoding="utf-8") as fh:
            for r in sorted(rows, key=lambda x: x["instance"]):
                fh.write("%d %s %s\n" % (r["instance"], r["drug"], r["arm"]))
        print("PANEL GATE PASS: corroboration=%s local=%s (per-condition enforced)" % (corr, local))
        return 0

    if __name__ == "__main__":
        sys.exit(main())
    PYEOF

