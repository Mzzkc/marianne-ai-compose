    #!/usr/bin/env bash
    set -euo pipefail
    OWNER=$(python3 -c 'import json;print(json.load(open("run/deployment.json"))["github_owner"])')
    REPO=$(python3 -c 'import json;print(json.load(open("run/deployment.json"))["repo_name"])')
    URL=$(python3 -c 'import json;print(json.load(open("run/deployment.json"))["site_url"])')
