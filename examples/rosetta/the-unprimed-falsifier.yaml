    git -c user.name="plain-language-dispensary" -c user.email="noreply@example.invalid" \
        commit -q -m "deploy: frozen digest build" || true
    gh repo view "$OWNER/$REPO" >/dev/null 2>&1 || gh repo create "$OWNER/$REPO" --public >/dev/null
    git remote add origin "https://github.com/$OWNER/$REPO.git" 2>/dev/null || true
    # ── The fence: refuse to overwrite work that is not ours ──────────────────
    git fetch -q origin gh-pages || true
    if git rev-parse --verify -q origin/gh-pages >/dev/null 2>&1; then
      MSG=$(git log -1 --format=%s origin/gh-pages)
      case "$MSG" in
        *"frozen digest build"*|*plsd*) : ;;
        *) echo "DEPLOY REFUSED: origin/gh-pages holds foreign work ('$MSG') — not force-pushing over it"; exit 1 ;;
      esac
    fi
    git push -q -f origin gh-pages
    cd ..
    # ── Pages config: attempted, then VERIFIED (never swallowed) ──────────────
    if ! gh api "repos/$OWNER/$REPO/pages" >/dev/null 2>&1; then
      gh api "repos/$OWNER/$REPO/pages" -X POST -f source[branch]=gh-pages -f source[path]=/ >/dev/null \
        || { echo "DEPLOY FAIL: enabling Pages refused"; exit 1; }
    fi
    gh api "repos/$OWNER/$REPO/pages" --jq .html_url >/dev/null 2>&1 \
      || { echo "DEPLOY FAIL: Pages configuration not verifiable"; exit 1; }
    ok=0
    for i in $(seq 1 120); do
      if curl -fsS --max-time 15 "$URL" >/dev/null 2>&1; then ok=1; break; fi
      sleep 10
    done
    [ "$ok" -eq 1 ] || { echo "DEPLOY FAIL: $URL not serving after 20 minutes"; exit 1; }
