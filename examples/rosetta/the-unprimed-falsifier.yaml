    # ── scripts/build-onepager.py — M10: the pharmacy-counter artifact ──────────
    # Pure-Python (reportlab + pypdf): no pandoc, no pdflatex, no poppler —
    # the toolchain cannot be missing mid-run because it IS the venv. Digest
    # join BEFORE build; >=14pt body; <=2 pages; real extractable text; the
