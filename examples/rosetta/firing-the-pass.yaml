    except BandViolation:
        drill_killed = True
    assert drill_killed, "DRILL BROKEN: the corrupted fixture survived the REAL band join"
    json.dump({"matched_events": matched, "worst_delta_min": {k: round(v, 2) for k, v in worst.items()},
               "bands_sha256": plan["tolerance_bands_sha256"],
               "dst_offsets": sorted(str(o) for o in all_offs),
               "fold_day": "{{ dst_fold_local }}", "fold_day_both_sides": True,
               "drill_killed": True,
               "convention": "shared horizon: center altitude -(refraction+semidiameter), both methods"},
              open("band-report.json", "w"), indent=2)
    open("tier-state.json", "w").write(json.dumps({
        "tier": tier,
        "pass_at_risk": pass_at_risk,
        "history": [{"at": "D1", "wall_clock_utc": now.isoformat(),
                     "from": 1, "to": tier, "slack_s": slack, "arithmetic": arith}]}, indent=2))
    print("D1 verdict: tier", tier, "| pass_at_risk", pass_at_risk, "| matched", matched,
          "| worst", {k: round(v, 2) for k, v in worst.items()},
          "| drill: REAL join killed the corrupted fixture")
