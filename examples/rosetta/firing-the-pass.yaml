    def verify_served_bytes(ics_bytes):
        """The REAL seal verifier: instant-equality per VEVENT + fold policy."""
        cal = Calendar.from_ical(ics_bytes)
        n = 0
        fold = datetime.date.fromisoformat("{{ dst_fold_local }}")
        for comp in cal.walk("VEVENT"):
            n += 1
            uid = str(comp.get("uid"))
            eid = uid.split("night-dispatch-%s-" % plan["edition"])[1].split("@")[0]
            if eid not in events:
                raise AssertionError("served UID %s not in events.json" % uid)
            prop = comp.get("dtstart")
            dt = prop.dt if prop.dt.tzinfo is not None else prop.dt.replace(tzinfo=datetime.timezone.utc)
            want_utc = datetime.datetime.fromisoformat(events[eid]["utc"])
            delta_s = abs((dt.astimezone(datetime.timezone.utc) - want_utc).total_seconds())
            if delta_s >= 1.0:  # second-exact: RFC 5545 whole seconds vs json microseconds
                raise AssertionError("SERVED instant drift %s: %s vs %s (%.3fs)" % (
                    eid, dt.astimezone(datetime.timezone.utc).isoformat(), want_utc.isoformat(), delta_s))
            tzid = prop.params.get("tzid", "")
            local_date = datetime.datetime.fromisoformat(events[eid]["local_wall"]).date()
            if local_date == fold:
                assert not tzid, "served fold-day VEVENT %s lost UTC form" % eid
            else:
                assert tzid == plan["tz"], "served TZID lost for %s" % eid
        return n
    served = fetch("events.ics")
