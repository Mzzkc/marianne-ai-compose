    condition: "stage == 4"
    stage: 2
    description: "Oracle: published-reference selftest within tolerance; full re-derivation present (all bodies + twilight + phases)"
  - type: command_succeeds
    command: |
      jq -e '.matched_events >= 400 and .drill_killed == true and .fold_day_both_sides == true' {workspace}/band-report.json > /dev/null
      jq -e '(.worst_delta_min | to_entries | select(.key | startswith("rs/")) | all(.value <= {rise_set_band_min})) and (.worst_delta_min | to_entries | select(.key | startswith("tw/")) | all(.value <= {twilight_band_min})) and (.worst_delta_min | to_entries | select(.key | startswith("ph/")) | all(.value <= {phase_band_min}))' {workspace}/band-report.json > /dev/null
      jq -e '.tier >= 1 and .tier <= 3 and (.history | length) >= 1 and (.history[0].at == "D1") and (.history[0].arithmetic | length > 20) and has("pass_at_risk")' {workspace}/tier-state.json > /dev/null
    condition: "stage == 5"
    stage: 2
    description: "Band join: coverage, per-class worst deltas within the registered bands, D1 tier decision cited with pass_at_risk surfaced, corruption drill killed by the REAL join"
  - type: command_succeeds
    command: |
      jq -e '.n_years >= {climatology_min_years} and (.bins | to_entries | length) == 3 and all(.bins[]; .n > 0 and has("median_pct") and (.iqr_pct | length) == 2)' {workspace}/climatology.json > /dev/null
      jq -e '.recomputed_bin.n > 0 and .recomputed_bin.median_pct >= 0 and (.night_window | test("local"))' {workspace}/climatology.json > /dev/null
      test $(ls {workspace}/raw/clim/oct-*.json | wc -l) -ge {climatology_min_years}
    condition: "stage == 6"
    stage: 2
    description: "Climatology: n/median/IQR on every bin, recomputed bin joins raw bytes, local-hour night window, raw Octobers retained"
  - type: command_succeeds
    command: |
      jq -e 'length >= {min_anniversaries} and all(.[]; (.qid | test("^Q[0-9]+$")) and (.date | test("^((19|20)[0-9][0-9])-{edition_month_padded}-[0-3][0-9]$")) and has("source_url") and has("date_property") and has("claim_line"))' {workspace}/anniversaries.json > /dev/null
    condition: "stage == 7"
    stage: 2
    description: "Anniversaries: every record QID-keyed, month-dated (regex aligned with the >=1900 gate — the original 1xxx-year regex rejected valid 20xx records), property-cited, source-linked"
  - type: command_succeeds
    command: |
      jq -e '.svg_fonttype == "none"' {workspace}/charts/ready-charts.json > /dev/null
      for f in $(jq -r '.made[]' {workspace}/charts/ready-charts.json); do
        grep -q "<text" "{workspace}/$f" || { echo "no text elements in $f"; exit 1; }
        grep -q "<image" "{workspace}/$f" && { echo "raster embedded in $f"; exit 1; } || true
      done
      echo "charts carry extractable text"
    condition: "stage == 8"
    stage: 2
    description: "Charts: svg.fonttype=none, text-as-text, no rasters"
  # ── M9 · Each voice: structural pre-gate before the full attribution join ──
  - &voice_gate
    type: command_succeeds
    command: |
      python3 - <<'PY'
      import json, re, os
      VOICES = {1: 'lunar', 2: 'planetary', 3: 'meteors', 4: 'history'}
      v = VOICES[{instance}]
      tier = json.load(open('{workspace}/tier-state.json'))['tier']
      annv = {r['qid'] for r in json.load(open('{workspace}/anniversaries.json'))}
      if tier == 1:
          text = open('{workspace}/pages/%s.md' % v).read()
          assert len(text.split()) >= {min_page_words}, 'page too thin'
          assert re.search(r'XREF\s+\S+\s+->\s+(lunar|planetary|meteors|history):', text), 'no XREF line'
          froms = re.findall(r'from:\s*(\S+\.json)', text)
          assert len(froms) >= {min_from_lines}, 'uncited numbers: %d from: lines' % len(froms)
          assert all(f in ('events.json', 'climatology.json', 'anniversaries.json', 'band-report.json') for f in froms), 'from: line names an unknown input'
          for q in re.findall(r'source:\s*(Q\d+)', text):
              assert q in annv, 'unsourced QID %s' % q
      else:
          doc = json.load(open('{workspace}/pages/voice-{instance}-tier-ack.json'))
          assert doc['tier'] == tier, 'ack tier disagrees with tier-state'
          assert doc['voice'] == v, 'ack voice mismatch'
      print('voice %s (instance {instance}) structurally clean at tier', v, tier)
      PY
    condition: "stage == 9"
    stage: 2
    description: "Voice gate: page shape, from-line floor, XREF contract, QIDs pre-join (or honest tier-ack) — keyed by {instance}"
  - type: command_succeeds
    command: |
      jq -e 'if .tier == 1 then ((.pages | length) == 4) and all(.pages[]; .from_lines >= {min_from_lines}) and ((.qid_universe | length) >= {min_anniversaries}) else ((.pages | length) == 0) end' {workspace}/attribution-report.json > /dev/null
    condition: "stage == 10"
    stage: 2
    description: "Attribution join: tier-1 has four joined pages carrying from-line evidence; retreated tiers have none"
  - type: command_succeeds
    command: |
      tier=$(jq -r .tier {workspace}/tier-state.json)
      for f in $(jq -r --argjson t "$tier" '.tier_ladder[$t | tostring].requires[]' {workspace}/backward-plan.json); do
        test -s "{workspace}/$f" || { echo "missing tier artifact: $f"; exit 1; }
      done
      jq -e '.vevents >= 500 and .fold_day_utc_form > 0' {workspace}/buffer-B/ics-manifest.json > /dev/null
      for a in ready-site.json ready-ics.json ready-card.json; do test -s "{workspace}/buffer-B/$a"; done
      test -s {workspace}/buffer-B/.night-dispatch
      test -s {workspace}/palette.json
      test -s {workspace}/buffer-B/style.css
    condition: "stage == 11"
    stage: 2
    description: "Products: every required tier artifact non-empty in buffer B, fold-day events in UTC form, ack set complete, marker written, palette single-source present"
  - type: command_succeeds
    command: |
      jq -e '.dst_classes.before > 10 and .dst_classes.after > 10 and .dst_classes.fold > 0 and (.instants_checked == .vevents) and .tzid == "{tz}"' {workspace}/product-gates-ics.json > /dev/null
      jq -e '.contrast["red-on-black"] >= {contrast_floor} and .contrast["grey-on-black"] >= {contrast_floor} and (.contrast_source | test("produced")) and .dangling_refs == 0' {workspace}/product-gates-web.json > /dev/null
      tier=$(jq -r .tier {workspace}/tier-state.json)
      if [ "$tier" = "1" ]; then jq -e '.pdf.min_font_pt >= {min_font_pt} and .pdf.a4 and .pdf.overflow_ok' {workspace}/product-gates-pdf.json > /dev/null; fi
      jq -e '.tonight_recompute | length == 3' {workspace}/product-gates-web.json > /dev/null
      jq -e 'all(.history[]; .to >= .from)' {workspace}/tier-state.json > /dev/null
    condition: "stage == 12"
    stage: 2
    description: "Product gates: instant-equality DST matrix with fold>0, contrast computed from produced bytes, measured font floor + overflow, tonight recomputes, no dangling refs, ratchet direction correct"
  - type: command_succeeds
    command: |
      jq -e '.ratchet_ok == true and .drill_killed == true and (.requires | length) >= 2 and .n_measured_actuals >= 1' {workspace}/tier-verification.json > /dev/null
    condition: "stage == 13"
    stage: 2
    description: "Tier verified against artifacts + ratchet + REAL-verifier drill + measured actuals recorded"
  # ── M14 · Each sign-off: class ownership + digest-joined inputs, per voice ──
  - &signoff_gate
    type: command_succeeds
    command: |
      python3 - <<'PY'
      import json, hashlib
      CLASSES = {1: 'temporal-ephemeris', 2: 'statistical', 3: 'editorial-experience'}
      c = CLASSES[{instance}]
      doc = json.load(open('{workspace}/signoffs/%s.json' % c))
      assert doc['class'] == c, 'class/file mismatch'
      assert doc['verdict'] in ('accept', 'non-accept'), 'malformed verdict'
      fams = json.load(open('{workspace}/instrument-families.json'))['instruments']
      assert doc['signer'] in fams, 'signer has no family record'
      assert len(doc['input_digests']) >= 2, 'must digest at least two consumed inputs'
      for f, dg in doc['input_digests'].items():
          actual = hashlib.sha256(open('{workspace}/' + f, 'rb').read()).hexdigest()
          assert dg == actual, 'input digest drift: %s changed after signing' % f
      if doc['verdict'] == 'non-accept':
          w = doc.get('waiver') or {}
          assert w.get('authority') and w.get('expiry') and w.get('compensating_control'), 'non-accept without complete waiver'
      print('signoff %s (instance {instance}): ownership + digests verified' % c)
      PY
    condition: "stage == 14"
    stage: 2
    description: "Sign-off gate: one class per {instance}, valid verdict, digested inputs joined, waiver completeness"
  - type: command_succeeds
    command: |
      jq -e '(.verdicts | keys | length) == 3 and ([.verdicts[]] | all(. == "accept" or . == "non-accept"))' {workspace}/release-attestation.json > /dev/null
      jq -e '(.class_ownership | to_entries | length) == 3 and (.signer_families | to_entries | length) == 3' {workspace}/release-attestation.json > /dev/null
      jq -e '(.waivers | length) >= 0 and all(.waivers[]; has("authority") and has("expiry") and has("compensating_control"))' {workspace}/release-attestation.json > /dev/null
      jq -e '.drills == {"absent_verdict": "killed", "duplicate_ownership": "killed", "incomplete_waiver": "killed"}' {workspace}/release-attestation.json > /dev/null
    condition: "stage == 15"
    stage: 2
    description: "Deadline gate: bijective verdict join, families recorded, waiver completeness, and ALL THREE corrupt-fixture drills killed by the REAL join"
  - type: command_succeeds
    command: |
      cue=$(python3 -c "import json; print(json.load(open('{workspace}/backward-plan.json'))['latest_safe_cue_utc'])")
      test -s "{workspace}/armed-$cue.json"
      jq -e '.acks | length == 3 and has("prior_live") and has("cue") and (.gate_reruns | has("ics")) and (.gate_reruns | has("web"))' "{workspace}/armed-$cue.json" > /dev/null
      test -s {workspace}/drill/arm-rerun/ics.json
      test -s {workspace}/drill/arm-rerun/web.json
    condition: "stage == 16"
    stage: 2
    description: "Arm: armed file with the full ack set AND actual product-gate re-run outputs present"
  # ── M17 · GO — exactly once, and the refusal is RE-TESTED at validation ────
  - type: command_succeeds
    command: |
      cue=$(python3 -c "import json; print(json.load(open('{workspace}/backward-plan.json'))['latest_safe_cue_utc'])")
      test "$(grep -c "^GO $cue " {workspace}/cue-log.jsonl)" -eq 1
      sha=$(grep "^GO $cue " {workspace}/cue-log.jsonl | awk '{print $4}')
      test "$(gh api repos/{github_owner}/{repo_name}/branches/main -q .commit.sha)" = "$sha"
      cd {workspace} && bash go.sh; rc=$?; test $rc -eq 3
    condition: "stage == 17"
    stage: 2
    timeout_seconds: 300
    description: "GO: one GO line for the cue, remote head is the logged commit (deterministic sha), and a second invocation REFUSES (exit 3, addressed-cue rule)"
  # ── M18/M19 · The live seam — served macros (anchor) on the RUNNING artifact ──
  - &live_gate
    type: command_succeeds
    command: |
      curl -sf --max-time 90 https://{github_owner}.github.io/{repo_name}/cutlog.html | grep -qi "cut log"
      curl -sf --max-time 90 https://{github_owner}.github.io/{repo_name}/cutlog.html | grep -c "data-claim" | xargs -I{} test {} -ge 1
    condition: "stage == 18"
    stage: 2
    timeout_seconds: 300
    description: "Cut-log audit: the RUNNING site serves the cut log with joinable data-claim records"
  - <<: *live_gate
    command: |
      curl -sf --max-time 90 https://{github_owner}.github.io/{repo_name}/events.ics | grep -c "BEGIN:VEVENT" | xargs -I{} test {} -ge 500
      curl -sf --max-time 90 https://{github_owner}.github.io/{repo_name}/events.ics | grep -c "TZID:{tz}" | xargs -I{} test {} -ge 400
    condition: "stage == 19"
    stage: 1
    timeout_seconds: 300
    description: "Live seam pre-check: the RUNNING site serves 500+ VEVENTs with TZID-correct non-fold instants"
  - <<: *live_gate
    command: |
      jq -e '.vevents_served >= 500 and (.vevents_served == .instants_checked) and (.oracle_rederived >= 400) and (.oracle_all_max_delta_min <= {rise_set_band_min}) and .drill_killed == true and has("served_events_sha256")' {workspace}/seal.json > /dev/null
      local_sha=$(sha256sum {workspace}/buffer-B/events.ics | cut -d' ' -f1)
      jq -e --arg s "$local_sha" '.served_events_sha256 == $s' {workspace}/seal.json > /dev/null
    condition: "stage == 19"
    stage: 2
    timeout_seconds: 120
    description: "Seal: every served instant re-verified; EVERY oracle-covered event re-derived within band; mutated bytes killed by the REAL verifier; served digest equals the released buffer"
