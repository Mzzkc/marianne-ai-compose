    import json, datetime
    from reportlab.lib.pagesizes import A4
    from reportlab.pdfgen import canvas
    plan = json.load(open("backward-plan.json"))
    pal = json.load(open("palette.json"))
    events = json.load(open("ephemeris/events.json"))
    W, H = A4
    RED, DIM, BLACK = pal["red"], pal["dim"], pal["black"]
    c = canvas.Canvas("buffer-B/night-dispatch-%s.pdf" % plan["edition"], pagesize=A4)
    c.setTitle("The Night Dispatch %s — %s" % (plan["edition"], plan["city"]))
    c.setFillColor(BLACK); c.rect(0, 0, W, H, fill=1, stroke=0)
    c.setFillColor(RED); c.setFont("Courier-Bold", 20)
    c.drawString(36, H - 40, "THE NIGHT DISPATCH — %s" % plan["edition"].upper())
    c.setFont("Courier", 10); c.setFillColor(RED)
    c.drawString(36, H - 56, "%s  %sN %sE  times %s  red-light field card" %
                 (plan["city"], plan["lat"], plan["lon"], plan["tz"]))
    def section(title, match, fmt):
        global y
        y -= 8; c.setFont("Courier-Bold", 11); c.setFillColor(RED)
        if y < 60: return
        c.drawString(36, y, title); y -= 16; c.setFont("Courier", 8)
        for e in events:
            if y < 40:  # EVERY section is bounds-guarded
                break
            if match(e):
                lw = datetime.datetime.fromisoformat(e["local_wall"])
                c.drawString(44, y, fmt(lw, e)); y -= 11
    y = H - 84
    c.setFont("Courier-Bold", 11); c.drawString(36, y, "MOON"); y -= 16; c.setFont("Courier", 8)
    for e in events:
        if y < 40: break
        if e["class"] == "phase":
            lw = datetime.datetime.fromisoformat(e["local_wall"])
            c.drawString(44, y, "%s  Moon %s" % (lw.strftime("%a %d %H:%M"), e["detail"]["phase"])); y -= 11
    section("PLANETS + TWILIGHT (rise/set/dawn/dusk)",
            lambda e: (e["class"] == "rise-set" and e["detail"]["body"] not in ("sun", "moon"))
                      or e["class"] == "twilight",
            lambda lw, e: "%s  %s %s%s" % (lw.strftime("%a %d %H:%M"),
                         (e["detail"].get("body") or e["detail"]["type"]).title(), e["detail"]["event"],
                         " (tw)" if e["class"] == "twilight" else ""))
    section("SHOWERS (date-precision windows)",
            lambda e: e["class"] == "shower",
            lambda lw, e: "%s  %s window (Moon %d%%)" % (lw.strftime("%a %d %H:%M"),
                         e["detail"]["shower"], e["detail"]["moon_illumination_pct"]))
    c.setFont("Courier", 8); c.setFillColor(DIM)
    c.drawString(36, 24, "night-dispatch — computed, band-verified, tier 1 field card — print and keep at the eyepiece")
    c.showPage(); c.save()
    print("field card written")
