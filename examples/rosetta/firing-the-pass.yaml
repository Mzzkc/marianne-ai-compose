    def join_signoffs(root=".", fams=fams):
        by_class, dupes = {}, []
        for p in sorted(glob.glob(os.path.join(root, "signoffs", "*.json"))):
            d = json.load(open(p))
            c = d["class"]
            if c in by_class:
                dupes.append((c, p))
            by_class[c] = (p, d)
        if dupes:
            raise JoinError("duplicate class ownership: %s" % dupes)
