    # ══ M17 · GO — the single atomic cutover at the computed cue ══════════════
    # Refuses unless armed (exit 2). Refuses a duplicate GO for the same cue —
    # the addressed-cue rule (exit 3) — which the validation BELOW re-invokes
    # and demands. The push is refused unless origin/main is empty-seeded or a
    # prior Night Dispatch, checked by the marker file. The push credential
    # is gh's own token helper (canaried by M2's gh auth status — review 3).
    # CRASH-WINDOW CUSTODY (review 2): the commit is DETERMINISTIC — fixed
    # author/committer dates at the cue, fixed message, tree from the frozen
    # buffer — so a retry after a crash between push and log-append re-derives
    # the SAME sha and the second push is byte-identical, not a second
    # external effect. An INTENT line (not matched by the ^GO grep) precedes
    # the push so a crash never erases the record that the pass was firing.
    # Firing EARLY is safe: the cue is the LATEST-safe instant; the GO line
    # records the actual fire time and its slack against the cue.
    cat > go.sh <<'SH'
    #!/usr/bin/env bash
    set -euo pipefail
    cd "{{ workspace }}"
    cue="$(python3 -c "import json; print(json.load(open('backward-plan.json'))['latest_safe_cue_utc'])")"
    armed="armed-$cue.json"
    [ -f "$armed" ] || { echo "REFUSED: not armed (no $armed) — arm before GO"; exit 2; }
    [ -f cue-log.jsonl ] || touch cue-log.jsonl
    if grep -q "^GO $cue " cue-log.jsonl; then
      echo "REFUSED: duplicate GO for cue $cue (addressed-cue rule)"; exit 3
    fi
    # gh api prints 404 error BODIES to stdout — `|| true` would capture the
    # error JSON as a non-empty "sha" and refuse every first run. Validate the
    # shape (caught live in commissioning; the original inherited this bug).
    prior_sha="$(gh api repos/{{ github_owner }}/{{ repo_name }}/branches/main -q .commit.sha 2>/dev/null || true)"
    if ! printf '%s' "$prior_sha" | grep -Eq '^[0-9a-f]{40}$'; then prior_sha=""; fi
    if [ -n "$prior_sha" ]; then
      gh api "repos/{{ github_owner }}/{{ repo_name }}/contents/.night-dispatch" >/dev/null 2>&1 \
        || { echo "REFUSED: origin/main is not empty-seeded and not a prior Night Dispatch (no marker)"; exit 4; }
    fi
    rm -rf buffer-B/.deploy
    mkdir -p buffer-B/.deploy
    git -C buffer-B/.deploy init -q -b main
    git -C buffer-B/.deploy config user.name "The Night Dispatch"
    git -C buffer-B/.deploy config user.email "night-dispatch@{{ github_owner }}.users.noreply.github.com"
    # Deterministic commit: fixed dates at the cue + fixed message + frozen
    # tree => identical sha on any retry (idempotent GO).
    export GIT_AUTHOR_DATE="$cue"
    export GIT_COMMITTER_DATE="$cue"
    # the pointer flip is ONE commit of the validated buffer; acks, deploy
    # scaffolding, and score tooling never ship
    (cd buffer-B && tar --exclude=.deploy --exclude='ready-*.json' --exclude='product-gates-d2-rerun-*.json' -cf - .) \
      | tar -xf - -C buffer-B/.deploy
    git -C buffer-B/.deploy add -A
    git -C buffer-B/.deploy commit -qm "The Night Dispatch — {{ edition }} (tier $(jq -r .tier tier-state.json))"
    sha="$(git -C buffer-B/.deploy rev-parse HEAD)"
    echo "INTENT $cue $(date -u +%Y-%m-%dT%H:%M:%SZ) $sha" >> cue-log.jsonl
    git -C buffer-B/.deploy remote add origin "https://github.com/{{ github_owner }}/{{ repo_name }}.git"
    git -C buffer-B/.deploy -c credential.helper='!gh auth git-credential' push -qf origin main
    slack=$(( $(date -u +%s) - $(date -u -d "$cue" +%s) ))
    echo "GO $cue $(date -u +%Y-%m-%dT%H:%M:%SZ) $sha slack=${slack}s" >> cue-log.jsonl
    echo "GO fired at cue $cue -> $sha (slack ${slack}s against the latest-safe cue)"
    SH
    bash go.sh
