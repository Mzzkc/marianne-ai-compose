    cat > gates_ics.py <<'PY'
    import json, sys, datetime, zoneinfo
    from icalendar import Calendar
    out_path = sys.argv[1]
    plan = json.load(open("backward-plan.json"))
    events = {e["id"]: e for e in json.load(open("ephemeris/events.json"))}
    ics = open("buffer-B/events.ics", "rb").read()
    cal = Calendar.from_ical(ics)
    tz = zoneinfo.ZoneInfo(plan["tz"])
    fold = datetime.date.fromisoformat("{{ dst_fold_local }}")
    classes = {"before": 0, "fold": 0, "after": 0}
    uids = set()
    instants_checked = 0
    for comp in cal.walk("VEVENT"):
        prop = comp.get("dtstart")
        tzid = prop.params.get("tzid", "")
        dt = prop.dt
        if dt.tzinfo is None:
            dt = dt.replace(tzinfo=datetime.timezone.utc)
        uid = str(comp.get("uid"))
        assert uid not in uids, "duplicate UID %s" % uid
        uids.add(uid)
        eid = uid.split("night-dispatch-%s-" % plan["edition"])[1].split("@")[0]
        assert eid in events, "UID %s does not join events.json" % uid
        want_utc = datetime.datetime.fromisoformat(events[eid]["utc"])
        # INSTANT equality at the published precision: RFC 5545 carries whole
        # seconds, events.json microseconds — so second-exactness is |delta|<1s.
        # An hour error still cannot hide behind matching wall text.
        delta_s = abs((dt.astimezone(datetime.timezone.utc) - want_utc).total_seconds())
        assert delta_s < 1.0, (
            "INSTANT MISMATCH %s: ics %s vs events %s (%.3fs)" % (
                eid, dt.astimezone(datetime.timezone.utc).isoformat(), want_utc.isoformat(), delta_s))
        instants_checked += 1
        # fold-form is decided by the event's LOCAL date (the producer's rule):
        # early fold-day hours are late 10-24 UTC, so the parsed dt's date lies.
        local_date = datetime.datetime.fromisoformat(events[eid]["local_wall"]).date()
        if local_date == fold:
            assert not tzid, "fold-day VEVENT %s must be UTC-form (no TZID), got TZID=%s" % (eid, tzid)
            classes["fold"] += 1
        else:
            assert tzid == plan["tz"], "DTSTART TZID %r != %r" % (tzid, plan["tz"])
            k = "before" if local_date < fold else "after"
            classes[k] += 1
    assert classes["before"] > 10 and classes["after"] > 10, "DST classes thin: %s" % classes
    assert classes["fold"] > 0, "no fold-day VEVENTs — the fold matrix has no subject"
