    import json, subprocess, datetime, zoneinfo, hashlib, math, copy, os, time
    from collections import defaultdict
    from icalendar import Calendar
    import ephem
    plan = json.load(open("backward-plan.json"))
    bands = json.load(open("tolerance-bands.json"))
    events = {e["id"]: e for e in json.load(open("ephemeris/events.json"))}
    tz = zoneinfo.ZoneInfo(plan["tz"])
    base = "https://{{ github_owner }}.github.io/{{ repo_name }}/"
    def fetch(p, attempts=20):
        last = ""
        for _ in range(attempts):
            r = subprocess.run(["curl", "-sf", "--max-time", "90", base + p],
                               capture_output=True)
            if r.returncode == 0 and r.stdout:
                return r.stdout
            last = "curl rc=%s" % r.returncode
            time.sleep(30)
