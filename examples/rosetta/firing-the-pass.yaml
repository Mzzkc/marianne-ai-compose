name: night-dispatch
description: "Firing the Pass proof (revised) — a backward-planned October 2026 sky almanac for a pinned city, tier-degradable by arithmetic, signed off by three disjoint classes, cut over atomically at a computed cue, and sealed live from served bytes re-derived per event."

# workspace: intentionally omitted — auto-managed at <workspace-root>/night-dispatch (#58).

instrument: claude-code
instrument_config:
  timeout_seconds: 1800

# Fallback chain for JUDGMENT sheets only. Every CLI movement below overrides
# this with an explicit empty chain — tools never fall back to minds.
instrument_fallbacks: [codex-cli, opencode]

# Named instruments: the three narration voices and three sign-off owners are
# distinct instrument NAMES so the map is explicit and the family record can be
# joined per owner. Profiles are the three probed judgment clients; see the
# VENDOR-DIVERSITY HONESTY block in the header — two real families, recorded,
# not performed.
instruments:
  voice-lunar:
    profile: claude-code
    config: {timeout_seconds: 1800}
  voice-planetary:
    profile: codex-cli
    config: {timeout_seconds: 1800}
  voice-meteors:
    profile: opencode
    config: {timeout_seconds: 1800}
  voice-history:
    profile: claude-code
    config: {timeout_seconds: 1800}
  signoff-temporal:
    profile: codex-cli       # the cross-family leg gets the class whose
    config: {timeout_seconds: 1500}  # checks are most mechanical
  signoff-statistical:
    profile: claude-code
    config: {timeout_seconds: 1500}
  signoff-editorial:
    profile: opencode
    config: {timeout_seconds: 1500}

# Circuit breaker — verified semantics only: trips on CONSECUTIVE SHEET
# FAILURES (execution.py), never on spend. 7 judgment sheets; 3 failures
# means the fan-out is sick, not unlucky.
circuit_breaker:
  enabled: true
  failure_threshold: 3
  recovery_timeout_seconds: 600

movements:
  # ── Phase 1 · The clock before the work — Firing the Pass stage 1 ──────────
  1:
    name: "The Backward Plan"
    instrument: cli            # Tool Chain: pure arithmetic + JSON emit; an LLM
    instrument_fallbacks: []   # here could hallucinate the schedule that polices
                               # everything else. Also PRE-REGISTERS the
                               # tolerance bands + shared refraction convention
                               # (First Article: thresholds before measurement).
    instrument_config:
      timeout_seconds: 300
  2:
    name: "Self-Canary + Seed"
    instrument: cli            # Canary Probe: gh identity, judgment binaries,
    instrument_fallbacks: []   # repo reachability + FIRST-RUN main-branch
                               # seeding — network/auth problems die HERE,
                               # cheaply and loudly, with a path THROUGH them
                               # (review 1 proved the detect-only version was
                               # a fresh-workspace dead end).
    instrument_config:
      timeout_seconds: 900
  # ── Phase 2 · Two independent methods over one pinned substrate ────────────
  3:
    name: "The Ephemeris"
    instrument: cli            # Etiquette Law: JPL integration via skyfield is
    instrument_fallbacks: []   # deterministic; the .bsp is sha256-verified
                               # before a single event is computed.
    instrument_config:
      timeout_seconds: 3600    # includes the one-time ~32 MB bsp fetch
  4:
    name: "The Second Method"
    instrument: cli            # Verify through Diverse Observers: PyEphem
    instrument_fallbacks: []   # (XEphem lineage) never touches skyfield's
                               # Kepler integration, but crosses the SAME
                               # horizon convention. Self-tests against a
                               # published reference value first.
    instrument_config:
      timeout_seconds: 1800
  5:
    name: "The Band Join"
    instrument: cli            # Graduate & Filter — D1: deltas within the
    instrument_fallbacks: []   # digest-pinned bands, THEN the tier arithmetic
                               # that decides the fan-out before it is spent.
    instrument_config:
      timeout_seconds: 600
  # ── Phase 3 · The world the almanac speaks about ───────────────────────────
  6:
    name: "Twenty Octobers"
    instrument: cli            # Etiquette Law: curl + stdlib statistics; every
    instrument_fallbacks: []   # bin carries n/median/IQR — an unsized claim
                               # cannot enter the record.
    instrument_config:
      timeout_seconds: 2400    # >= 20 Octobers x hourly cloud cover
  7:
    name: "The Old Nights"
    instrument: cli            # Proof-Carrying Artifact: anniversary claims are
    instrument_fallbacks: []   # resolved to Wikidata QIDs at RUNTIME and their
                               # dates RE-VERIFIED live — batched, paced, and
                               # retried after live throttling (reviews 1/3
                               # proved the unpaced version dies on a healthy
                               # API). The floor is met by candidates that
                               # were themselves live-verified before shipping.
    instrument_config:
      timeout_seconds: 1200    # pacing + backoff headroom
  # ── Phase 4 · Charts and voices ────────────────────────────────────────────
  8:
    name: "Painting the Sky"
    instrument: cli            # Etiquette Law: matplotlib with svg.fonttype=none
    instrument_fallbacks: []   # so labels are extractable text, not paths.
    instrument_config:
      timeout_seconds: 1200
  9:
    name: "Four Voices"
    instrument: claude-code    # Prefabrication (contained): the voice is
                               # judgment — a template would pass every gate and
                               # gut the CULT claim. Bounded into a renderer-
                               # with-judgment: cannot invent events (inputs
                               # digest-pinned), cannot invent cultural names
                               # (attribution gate), cannot escape the
                               # interface (XREF contract). Reads tier-state to
                               # know its content set.
    instrument_config:
      timeout_seconds: 1800
  10:
    name: "The Attribution Gate"
    instrument: cli            # Etiquette Law: every source: QID in every page
    instrument_fallbacks: []   # joins anniversaries.json, every from: line
                               # names a real input file, every XREF target
                               # page EXISTS — narration cannot publish
                               # unsourced names or dead cross-references.
    instrument_config:
      timeout_seconds: 600
  # ── Phase 5 · Products and their gates ─────────────────────────────────────
  11:
    name: "The Products"
    instrument: cli            # Etiquette Law: icalendar + stdlib site gen +
    instrument_fallbacks: []   # reportlab field card, assembled into buffer B
                               # while the live root stays frozen (Standby-GO).
                               # One palette source; fold-day instants in UTC.
    instrument_config:
      timeout_seconds: 2400
  12:
    name: "The Product Gates"
    instrument: cli            # Graduate & Filter — D2: ics instant matrix,
    instrument_fallbacks: []   # PDF geometry + overflow measured on the file,
                               # contrast computed from produced bytes,
                               # dangling-reference check, tonight recompute,
                               # tier re-decision that rebuilds the site.
    instrument_config:
      timeout_seconds: 1800
  13:
    name: "Verify the Tier"
    instrument: cli            # Graceful Retreat verification half: claimed
    instrument_fallbacks: []   # tier vs actual artifacts + attempt evidence +
                               # monotone ratchet + re-derivable arithmetic +
                               # estimate-vs-actual drift recorded.
    instrument_config:
      timeout_seconds: 600
  # ── Phase 6 · Separation of powers against the hard date ───────────────────
  14:
    name: "Three Signatures"
    instrument: claude-code    # Sign-Off Chain: the deterministic core of each
                               # class already IS CLI (band reports, schema
                               # gates, geometry); the AI owns the VERDICT
                               # and the waiver decision — whether evidence
                               # suffices under a hard date. A threshold rule
                               # would convert the chain into automation and
                               # destroy attributability.
    instrument_config:
      timeout_seconds: 1500
  15:
    name: "The Deadline Gate"
    instrument: cli            # Sign-Off Chain join: bijective verdicts +
    instrument_fallbacks: []   # waivers; absent verdict can never convert to
                               # implicit waiver; duplicate ownership dies;
                               # the join function is replayed against three
                               # corrupt fixtures and each must be killed.
    instrument_config:
      timeout_seconds: 600
  # ── Phase 7 · Standby-GO ───────────────────────────────────────────────────
  16:
    name: "Arm"
    instrument: cli            # Standby-GO arm: verify the complete ack set +
    instrument_fallbacks: []   # RE-RUN the actual product-gate scripts, without
                               # touching the live root; record prior live state.
    instrument_config:
      timeout_seconds: 1200
  17:
    name: "GO"
    instrument: cli            # Standby-GO fire: the single atomic cutover at
    instrument_fallbacks: []   # the computed cue; refuses unless armed;
                               # refuses a duplicate GO for the same cue;
                               # deterministic commit metadata makes the
                               # push/append crash window idempotent.
    instrument_config:
      timeout_seconds: 1800    # git commit + force-push + Pages
  18:
    name: "The Cut-Log Audit"
    instrument: cli            # Graceful Retreat disclosure: the cut-log page
    instrument_fallbacks: []   # was built INTO buffer B (no second push after
                               # the exactly-once cue); this movement audits
                               # that EVERY served claim joins a state record
                               # AND every state record appears on the page.
    instrument_config:
      timeout_seconds: 900
  19:
    name: "The Live Seal"
    instrument: cli            # Proof-Carrying Artifact: fetch the SERVED
    instrument_fallbacks: []   # events.ics + pages over HTTPS; re-derive every
                               # published instant; re-derive EVERY
                               # oracle-covered event from the independent
                               # method; digest what was served.
                               # Workspace-green != deployed-green.
    instrument_config:
      timeout_seconds: 1800

sheet:
  size: 1
  total_items: 19          # movements pre-expansion; engine expands to 24 sheets
  fan_out:
    9: 4                   # Four Voices: lunar / planetary / meteors / history (sheets 9-12)
    14: 3                  # Three Signatures: S1/S2/S3 disjoint classes (sheets 17-19)
  dependencies:            # movement-keyed; engine expands to the sheet DAG
    2: [1]                 # the canary verifies a plan exists
    3: [2]                 # ephemeris needs substrate + identity verified
    4: [2]                 # oracle runs beside, never after, the primary
    5: [3, 4]              # D1 joins BOTH methods — fan-in
    6: [2]                 # climatology: independent leaf (window W1)
    7: [2]                 # anniversaries: independent leaf (window W1)
    8: [5]                 # charts consume VERIFIED events only
    9: [5, 6, 7]           # voices read verified events + climatology + anniversaries
    10: [9]                # attribution judges the pages that exist
    11: [8, 10]            # products consume charts + attributed pages
    12: [11]               # D2 gates the built buffer
    13: [12]               # tier verification reads gates + buffer
    14: [13]               # sign-offs read the verified tree
    15: [14]               # the join reads all three signatures
    16: [15]               # arm reads the attestation
    17: [16]               # go requires armed
    18: [17]               # audit the SERVED cut log (post-cutover, read-only)
    19: [17]               # seal the SERVED bytes (post-cutover, read-only)
  instrument_map:          # sheet-keyed (expanded); named instruments above
    voice-lunar: [9]           # claude-code  (glm-zai family, probed)
    voice-planetary: [10]      # codex-cli    (gpt family, probed — cross-vendor voice)
    voice-meteors: [11]        # opencode     (glm-zai family, probed)
    voice-history: [12]        # claude-code  (glm-zai family, probed)
    signoff-temporal: [17]     # codex-cli  — S1 temporal/ephemeris
    signoff-statistical: [18]  # claude-code — S2 statistical
    signoff-editorial: [19]    # opencode    — S3 editorial/experience
  per_sheet_fallbacks:     # expanded-sheet-keyed; judgment sheets ONLY.
                           # codex-primary sheets must not "fall back" to codex.
    10: [claude-code, opencode]
    17: [claude-code, opencode]
    # sheets 9, 11, 12, 18, 19 inherit the score chain [codex-cli, opencode].
  descriptions:
    1: "Backward plan — latest-start arithmetic from the hard instant, GO cue, predeclared tier ladder (three DISTINCT starts), tolerance bands registered"
    2: "Self-canary + seed — gh identity, judgment binaries + family map, repo created-and-seeded (bootstrap commit) + Pages verified"
    3: "Ephemeris — pinned de440s.bsp via skyfield: shared-convention rise/set (7 bodies), civil+nautical twilight, phases, conjunctions (bisected), shower windows; DST-exact local rendering"
    4: "Oracle — PyEphem second method under the SAME horizon convention, self-tested against a published reference"
    5: "Band join — D1: every shared event within pre-registered bands; tier arithmetic selects the fan-out content set; corruption drill runs the REAL join"
    6: "Climatology — twenty-plus Octobers of hourly cloud cover; n/median/IQR per bin"
    7: "Anniversaries — QID-resolved, date-verified astronomy history (batched, paced, retried, fully re-verified)"
    8: "Charts — moon strip, planet tracks (time-encoded), month timeline; text-as-text SVG"
    9: "Voice — lunar pages (phases, moonlight, tides of the month)"
    10: "Voice — planetary pages (visibility windows, conjunctions)"
    11: "Voice — meteor pages (shower windows degraded by moonlight and cloud)"
    12: "Voice — history pages (anniversaries, sourced)"
    13: "Attribution gate — every cultural claim joins a verified QID record; every from: line names an input; every XREF target exists"
    14: "Products — events.ics (fold-day instants in UTC), static site, RSS, tonight panels, field-card PDF, cut-log page into buffer B; one palette source"
    15: "Product gates — D2: ics instant matrix, PDF geometry + overflow, contrast from produced bytes, dangling-reference check, tonight recompute, tier re-decision that REBUILDS the site"
    16: "Verify the tier — claimed tier vs actual artifacts + attempt evidence + ratchet arithmetic + estimate-vs-actual drift"
    17: "Sign-off S1 — temporal/ephemeris integrity (codex family)"
    18: "Sign-off S2 — statistical integrity (claude-code family)"
    19: "Sign-off S3 — editorial/experience integrity (opencode family)"
    20: "Deadline gate — bijective verdict/waiver join (replayed against corrupt fixtures), release attestation"
    21: "Arm — ack-set completeness + ACTUAL product-gate re-runs, live root untouched"
    22: "GO — the single atomic cutover at the computed cue (deterministic commit; INTENT/GO log lines)"
    23: "Cut-log audit — every served claim joins a state record and vice versa"
    24: "Live seal — served bytes re-derived per event; every oracle-covered event re-derived; mutated fixture must fail the real verifier"

parallel:
  enabled: true
  max_concurrent: 4          # W1 = {3,4,6,7}; W2 = {8, 9a-d}; W3 = {17,18,19}
  fail_fast: true

retry:
  max_retries: 1             # CLI gates fail LOUD, they are not retried into
  base_delay_seconds: 30     # blur (Andon discipline); one retry absorbs
                             # transient network only.

stale_detection:
  enabled: true
  idle_timeout_seconds: 3600

# cross_sheet: deliberately ABSENT — auto_capture_stdout would fan workspace
# stdout into later prompts; here the context economics are structural (voices
# read their own distilled inputs from disk) and the sign-offs must judge the
# ARTIFACTS, not each other's console noise.

prompt:
  variables:
    # ── Publishing identity (single point of change) ──
    github_owner: "Mzzkc"
    repo_name: "night-dispatch"
    # ── The pinned world (a future edition changes these, not the DAG) ──
    city_label: "Amsterdam"
    lat: 52.37
    lon: 4.90
    tz: "Europe/Amsterdam"
    edition: "2026-10"
    edition_year: 2026
    edition_month: 10
    edition_month_padded: "10"
    hard_date_local: "2026-10-01T00:00:00"   # Europe/Amsterdam; midnight-exact
    dst_fold_local: "2026-10-25"             # EU fall-back 03:00 CEST -> 02:00 CET
    # ── The pinned ephemeris (probed + digested 2026-09-04) ──
    bsp_url: "https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440s.bsp"
    bsp_sha256: "c1c7feeab882263fc493a9d5a5b2ddd71b54826cdf65d8d17a76126b260a49f2"
    # ── The published oracle selftest reference (NASA/AstroPixels new-moon
    #    table class; live-verified 2026-09-04: PyEphem delta 0.02 min) ──
    selftest_new_moon_utc: "2026-10-10T15:50:00Z"
    selftest_tolerance_min: 2
    # ── Pre-registered tolerance bands (registered BEFORE measurement; the
    #    digest of tolerance-bands.json is baked into backward-plan.json and
    #    BOTH compute scripts refuse to run on mismatch) ──
    rise_set_band_min: 1
    twilight_band_min: 3
    phase_band_min: 1
    refraction_mbar: 1010                    # shared physical assumptions, both methods
    refraction_c: 10
    # ── Meteor-shower activity windows (IMO annual tables; DATE precision —
    #    no minute-precision peak instants are claimed or computed) ──
    showers_json: '[{"id":"draconids","name":"Draconids","window_center":"2026-10-08","radiant":"Draco"},{"id":"south-taurids","name":"Southern Taurids","window_center":"2026-10-10","radiant":"Taurus"},{"id":"orionids","name":"Orionids","window_center":"2026-10-21","radiant":"Orion"},{"id":"leonis-minorids","name":"Leonis Minorids","window_center":"2026-10-24","radiant":"Leo Minor"}]'
    # ── Climatology + content floors ──
    climatology_min_years: 20
    min_font_pt: 8                           # the CV-law precedent for print floors
    contrast_floor: 4.5                      # WCAG AA normal text
    min_page_words: 250
    min_anniversaries: 3
    min_from_lines: 5                        # every page cites its numbers
    # ── Probed vendor families (family_source: `mzt instruments list`,
    #    2026-09-04; re-probe before relying on the diversity claim) ──
    probed_at: "2026-09-04"
    family_claude_code: "glm-zai"
    family_opencode: "glm-zai"
    family_codex_cli: "gpt-openai"
    # ── Fan-out maps (instance -> meaning) ──
    voice_class: {1: "lunar", 2: "planetary", 3: "meteors", 4: "history"}
    voice_brief:
      lunar: "moon phases, moonrise/moonset, moonlight weight on the month's nights"
      planetary: "planet visibility windows, conjunctions, elongations"
      meteors: "meteor-shower windows degraded by moonlight and cloud climatology"
      history: "this-month-in-astronomy-history anniversaries, every claim sourced"
    signoff_class: {1: "temporal-ephemeris", 2: "statistical", 3: "editorial-experience"}
    signoff_title:
      temporal-ephemeris: "S1 — temporal & ephemeris integrity"
      statistical: "S2 — statistical integrity"
      editorial-experience: "S3 — editorial & experience integrity"

  template: |
    {# ══ Macros: the house style, defined once ══════════════════════════════ #}
    {% macro strict() %}
    set -euo pipefail
    cd "{{ workspace }}"
    SECONDS=0
    {% endmacro %}

    {% macro sched_append(movement) %}
    python3 -c "import json,datetime; open('schedule-state.jsonl','a').write(json.dumps({'movement': {{ movement }}, 'event': 'actual', 'seconds': int('$SECONDS' or 0), 'wall_clock_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()})+'\n')"
    {% endmacro %}

    {% macro no_fabrication() %}
    ## Ground Rules (non-negotiable)
    - Every number you state MUST carry a `from:` line naming the file and key
      it came from (events.json, climatology.json, anniversaries.json,
      band-report.json). A number you cannot cite is not yours to state —
      write instead that the record does not answer it.
    - Every cultural or historical claim MUST carry a `source: Qxxxx` line
      matching a qid in anniversaries.json. If the record does not support
      the claim, the claim does not appear. No folk names from memory.
    {% endmacro %}

    {% macro page_shape() %}
    ## Required Output Shape
    - Write exactly one file: `{{ workspace }}/pages/{{ voice_class[instance] }}.md`.
    - Headed sections; at least {{ min_page_words }} words.
    - Cross-reference at least one other voice's page with a line of the exact
      form `XREF {{ voice_class[instance] }} -> <other-class>: <why>`
      (other-class is one of: lunar, planetary, meteors, history).
    - If `tier-state.json` says tier > 1, do NOT write the page: write
      `{{ workspace }}/pages/voice-{{ instance }}-tier-ack.json` containing
      {"voice": "{{ voice_class[instance] }}", "tier": <the tier you read>,
      "reason": "narration is Tier 1 content; the ladder cut it"} and nothing
      else. An honest absence beats an invented page.
    {% endmacro %}

    {% if stage == 1 %}
    {{ strict() }}
    mkdir -p ephemeris oracle pages charts signoffs raw/clim buffer-B drill
    # ══ M1 · The Backward Plan — Firing the Pass stage 1 ══════════════════════
    # Pre-register the tolerance bands FIRST (First Article: thresholds before
    # measurement), then compute the plan from the hard instant by subtraction.
    # GENERICITY (review 3): the boundary assert checks midnight-exactness in
    # the PINNED LOCAL ZONE, not a hardcoded UTC literal; edition_year/month
    # are written INTO the plan (review 2's KeyError fix); tier starts are
    # three DISTINCT instants (site_extra credit for the Ephemeris Card tier).
    python3 - <<'PY'
    import json, hashlib, datetime, zoneinfo
    tz = zoneinfo.ZoneInfo("{{ tz }}")
    hard_local = datetime.datetime.fromisoformat("{{ hard_date_local }}").replace(tzinfo=tz)
    assert hard_local.time() == datetime.time(0, 0), (
        "hard date must be midnight-exact local ({{ hard_date_local }}), not a rounded boundary")
    hard_utc = hard_local.astimezone(datetime.timezone.utc)

    bands = {
      "registered_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
      "rise_set_band_min": {{ rise_set_band_min }},
      "twilight_band_min": {{ twilight_band_min }},
      "phase_band_min": {{ phase_band_min }},
      "shared_refraction": {"pressure_mbar": {{ refraction_mbar }}, "temp_c": {{ refraction_c }}},
      "horizon_convention": "center altitude crosses -(refraction + semidiameter); "
                            "refraction 34 arcmin scaled by (P/1010)*(283.15/(273.15+T)); "
                            "at the pinned 1010 mbar / 10 C the scale factor is exactly 1.0; "
                            "twilight = sun center at -6/-12 deg geometric; applied IDENTICALLY "
                            "by both methods (executed 2026-09-04: worst rise/set delta 0.01 min)",
      "dst_exactness": "events on {{ dst_fold_local }} must render through {{ tz }} "
                       "with the 02:00 fold appearing exactly once in the month",
      "selftest_reference": {
        "what": "new moon {{ edition_year }}-{{ edition_month }}",
        "published_utc": "{{ selftest_new_moon_utc }}",
        "tolerance_min": {{ selftest_tolerance_min }},
        "source": "NASA/AstroPixels new-moon table class; the oracle selftest "
                  "cites it before the oracle is trusted"},
    }
    bands_bytes = json.dumps(bands, indent=2, sort_keys=True).encode()
    open("tolerance-bands.json", "wb").write(bands_bytes)
    bands_sha = hashlib.sha256(bands_bytes).hexdigest()

    # Worst-case durations (seconds) per tail segment. These are PLANNING
    # ESTIMATES recorded BEFORE the stages run; each CLI movement appends a
    # MEASURED actual to schedule-state.jsonl as it completes, D2 compares
    # against the remaining estimate, and M13 records estimate-vs-actual
    # drift. site_extra: the Ephemeris Card tier skips full site generation.
    dur = {
      "narration_wave": 1800, "attribution": 600, "products": 2400,
      "product_gates": 1800, "verify_tier": 600, "signoff_wave": 1500,
      "deadline_gate": 600, "arm": 1200, "go": 1800, "margin": 1800,
      "pdf_extra": 600, "chart_extra": 600, "site_extra": 600,
    }
    tail3 = dur["deadline_gate"] + dur["arm"] + dur["go"] + dur["margin"]
    tail2 = dur["verify_tier"] + dur["signoff_wave"] + tail3
    tail1 = dur["product_gates"] + tail2
    t1_start = hard_utc - datetime.timedelta(seconds=dur["narration_wave"]+dur["attribution"]+dur["products"]+tail1)
    t2_start = hard_utc - datetime.timedelta(seconds=dur["products"]+tail1-dur["pdf_extra"]-dur["chart_extra"])
    t3_start = hard_utc - datetime.timedelta(seconds=dur["products"]+tail1-dur["pdf_extra"]-dur["chart_extra"]-dur["site_extra"])
    assert t1_start < t2_start < t3_start, "tier ladder must have three DISTINCT starts"
    cue = hard_utc - datetime.timedelta(seconds=dur["arm"]+dur["go"]+dur["margin"]//2)

    plan = {
      "score": "night-dispatch", "edition": "{{ edition }}",
      "edition_year": {{ edition_year }}, "edition_month": {{ edition_month }},
      "city": "{{ city_label }}", "lat": {{ lat }}, "lon": {{ lon }}, "tz": "{{ tz }}",
      "hard_date_local": "{{ hard_date_local }}",
      "hard_instant_utc": hard_utc.isoformat(),
      "tolerance_bands_sha256": bands_sha,
      "durations_s": dur,
      "tier_starts_utc": {"1": t1_start.isoformat(), "2": t2_start.isoformat(), "3": t3_start.isoformat()},
      "latest_safe_cue_utc": cue.isoformat(),
      "tier_ladder": {
        "1": {"name": "Full Dispatch", "requires": [
            "pages/lunar.md", "pages/planetary.md", "pages/meteors.md", "pages/history.md",
            "charts/moon-strip.svg", "charts/planet-tracks.svg", "charts/month-timeline.svg",
            "buffer-B/events.ics", "buffer-B/rss.xml", "buffer-B/night-dispatch-{{ edition }}.pdf",
            "buffer-B/cutlog.html"]},
        "2": {"name": "Field Edition", "requires": [
            "charts/moon-strip.svg",
            "buffer-B/events.ics", "buffer-B/rss.xml", "buffer-B/cutlog.html"]},
        "3": {"name": "Ephemeris Card", "requires": [
            "buffer-B/events.ics", "buffer-B/cutlog.html"]},
      },
      "decision_points": {
        "D1": {"at_movement": 5, "rule": "tier = 1 if now<=s1 elif now<=s2 else 3; if now>s3 also set pass_at_risk (negative slack on the floor itself — data, not a retry)"},
        "D2": {"at_movement": 12, "rule": "richest tier whose remaining tail fits (1->2->3 cascade, never one step); ratchet downward only; degrade REBUILDS the site"},
      },
    }
    open("backward-plan.json", "w").write(json.dumps(plan, indent=2))
    open("schedule-state.jsonl", "a").write(json.dumps({
        "movement": 1, "event": "estimate", "seconds": 300,
        "basis": "planning estimate — replaced by the measured actual when this movement completes",
        "wall_clock_utc": datetime.datetime.now(datetime.timezone.utc).isoformat()}) + "\n")
    print("plan written; cue =", cue.isoformat(), "; bands sha =", bands_sha[:16])
    PY
    {{ sched_append(1) }}

    {% elif stage == 2 %}
    {{ strict() }}
    # ══ M2 · Self-Canary + Seed — minute one, not movement seventeen ══════════
    # Probes the score's newcomer-fragile dependencies: publish identity,
    # judgment instruments (+ honest family map), and the repo the cutover
    # will force-push. FRESH-WORKSPACE PATH (review 1's executed kill): a
    # repo created empty has no main branch, so Pages enablement against
    # source[branch]=main answers 422 and the original died here. This canary
    # SEEDS exactly one bootstrap commit (marker + README stub, zero edition
    # content) when main is absent, THEN enables Pages, THEN verifies. The
    # go-time credential path is gh's own token helper, so `gh auth status`
    # at this movement IS the push-credential canary (review 3's finding).
    command -v gh >/dev/null 2>&1 || { echo "FAIL: gh not on PATH"; exit 1; }
    command -v jq >/dev/null 2>&1 || { echo "FAIL: jq not on PATH"; exit 1; }
    command -v uv >/dev/null 2>&1 || { echo "FAIL: uv not on PATH (ephemeris/oracle/PDF routes need it)"; exit 1; }
    command -v curl >/dev/null 2>&1 || { echo "FAIL: curl not on PATH"; exit 1; }
    gh auth status >/dev/null 2>&1 || { echo "FAIL: gh not authenticated — the dispatch publishes at M17"; exit 1; }
    gh_owner="$(gh api user -q .login 2>/dev/null)" || { echo "FAIL: gh api user did not answer"; exit 1; }
    [ "$gh_owner" = "{{ github_owner }}" ] || { echo "FAIL: gh is $gh_owner but the score publishes as {{ github_owner }}"; exit 1; }
    n_bins=0
    for b in claude codex opencode; do
      command -v "$b" >/dev/null 2>&1 && n_bins=$((n_bins+1))
    done
    [ "$n_bins" -ge 1 ] || { echo "FAIL: no judgment instrument (claude/codex/opencode) on PATH — M9/M14 would die after six tool movements"; exit 1; }
    # Honest family map: shipped probe results + live binary evidence joined.
    python3 - <<'PY'
    import json, shutil, subprocess, datetime
    shipped = {
      "claude-code": {"family": "{{ family_claude_code }}", "probed_at": "{{ probed_at }}",
                      "evidence": "mzt instruments list 2026-09-04: default glm-5.3[1m]"},
      "codex-cli": {"family": "{{ family_codex_cli }}", "probed_at": "{{ probed_at }}",
                    "evidence": "mzt instruments list 2026-09-04: client default (GPT family)"},
      "opencode": {"family": "{{ family_opencode }}", "probed_at": "{{ probed_at }}",
                   "evidence": "mzt instruments list 2026-09-04: zai-coding-plan/glm-5.3"},
    }
