    import json, subprocess, statistics, datetime, os, zoneinfo
    plan = json.load(open("backward-plan.json"))
    tz = zoneinfo.ZoneInfo(plan["tz"])
    y = plan["edition_year"]
    years = [yy for yy in range(y - 1, y - 1 - 30, -1) if yy >= 1995][:{{ climatology_min_years }} + 5]
    fetched = 0
    for yy in years:
        dst = "raw/clim/oct-%d.json" % yy
        if os.path.exists(dst) and os.path.getsize(dst) > 1000:
            fetched += 1; continue
        url = ("https://archive-api.open-meteo.com/v1/archive?latitude=%s&longitude=%s"
               "&start_date=%d-%02d-01&end_date=%d-%02d-31&hourly=cloud_cover&timezone=UTC"
               % (plan["lat"], plan["lon"], yy, plan["edition_month"], yy, plan["edition_month"]))
        r = subprocess.run(["curl", "-s", "--max-time", "120", url], capture_output=True, text=True)
        doc = json.loads(r.stdout)
        assert doc.get("hourly", {}).get("cloud_cover"), "no cloud_cover data for %d: %s" % (yy, r.stdout[:200])
        open(dst, "w").write(r.stdout)
        fetched += 1
    # Bins: third-of-month x observing night (18:00-05:59 LOCAL, fold-exact)
    def night_bins(values_by_utc_hour):
        bins = {"early": [], "mid": [], "late": []}
        for iso, v in values_by_utc_hour:
            if v is None: continue
            utc = datetime.datetime.fromisoformat(iso.replace("Z", "+00:00"))
            hL = utc.astimezone(tz).hour  # local hour — correct on both sides of the fold
            if 18 <= hL or hL < 6:
                dL = utc.astimezone(tz).day
                bins["early" if dL <= 10 else "mid" if dL <= 20 else "late"].append(v)
        return bins
    out_bins = {}
    years_loaded = []
    for yy in years:
        doc = json.load(open("raw/clim/oct-%d.json" % yy))
        hours = doc["hourly"]["time"]; vals = doc["hourly"]["cloud_cover"]
        if len(hours) < 700: continue
        years_loaded.append(yy)
        b = night_bins(zip(hours, vals))
        for seg, vs in b.items():
            out_bins.setdefault(seg, []).extend(vs)
    assert len(years_loaded) >= {{ climatology_min_years }}, "only %d Octobers loaded" % len(years_loaded)
    report = {"city": plan["city"], "years": years_loaded, "n_years": len(years_loaded),
              "bins": {}, "recomputed_bin": None,
              "night_window": "18:00-05:59 local (zone-exact across the fold)",
              "note": "cloud-cover climatology is a probability statement about the past, never a forecast"}
    for seg, vs in out_bins.items():
        vs = sorted(vs)
        q1 = vs[int(0.25 * len(vs))]; q3 = vs[int(0.75 * len(vs))]
        report["bins"][seg] = {"n": len(vs), "median_pct": statistics.median(vs),
                               "iqr_pct": [q1, q3]}
    # Independent recomputation of one bin straight from raw bytes.
    doc = json.load(open("raw/clim/oct-%d.json" % years_loaded[0]))
    b = night_bins(zip(doc["hourly"]["time"], doc["hourly"]["cloud_cover"]))
    report["recomputed_bin"] = {"year": years_loaded[0], "segment": "early",
                                "n": len(b["early"]), "median_pct": statistics.median(b["early"])}
    json.dump(report, open("climatology.json", "w"), indent=2)
    print("octobers:", len(years_loaded), "| bins:", {k: v["n"] for k, v in report["bins"].items()})
