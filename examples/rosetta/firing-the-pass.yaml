    python3 - <<'PY'
    import json, datetime, zoneinfo, hashlib, copy, os
    from collections import defaultdict
    class BandViolation(Exception):
        pass
    plan = json.load(open("backward-plan.json"))
    bands = json.load(open("tolerance-bands.json"))
    assert hashlib.sha256(open("tolerance-bands.json","rb").read()).hexdigest() \
        == plan["tolerance_bands_sha256"]
    def k_primary(e):
        if e["class"] == "rise-set":
            return ("rs", e["detail"]["body"], e["detail"]["event"])
        if e["class"] == "twilight":
            return ("tw", e["detail"]["type"], e["detail"]["event"])
        if e["class"] == "phase":
            return ("ph", e["detail"]["phase"], None)
        return None
    def k_oracle(r):
        if r["class"] == "rise-set":
            return ("rs", r["body"], r["event"])
        if r["class"] == "tw":
            return ("tw", r["type"], r["event"])
        if r["class"] == "phase":
            return ("ph", r["phase"], None)
        return None
    def band_for(k):
        return {"rs": bands["rise_set_band_min"], "tw": bands["twilight_band_min"],
                "ph": bands["phase_band_min"]}[k[0]]
    def band_join(events, oracle):
        """The REAL gate. Raises BandViolation on any out-of-band delta."""
        by = defaultdict(list)
        for r in oracle:
            k = k_oracle(r)
            if k: by[k].append(datetime.datetime.fromisoformat(r["utc"]))
        matched, worst = 0, {}
        for e in events:
            k = k_primary(e)
            if not k or not by.get(k): continue
            t = datetime.datetime.fromisoformat(e["utc"])
            best = min(by[k], key=lambda c: abs((c - t).total_seconds()))
            dmin = abs((best - t).total_seconds()) / 60.0
            band = band_for(k)
            if dmin > band:
                raise BandViolation("BAND VIOLATION: %s primary=%s oracle=%s delta=%.1f min > %d" %
                                    (k, t.isoformat(), best.isoformat(), dmin, band))
            matched += 1
            key = "/".join(str(x) for x in k)
            worst[key] = max(worst.get(key, 0.0), dmin)
        return matched, worst
    events = json.load(open("ephemeris/events.json"))
    oracle = json.load(open("oracle/oracle-times.json"))
    matched, worst = band_join(events, oracle)
    assert matched >= 400, "join coverage implausibly low: %d matched" % matched
    # DST matrix: exactly two offsets across the month; the fold day carries both.
    tz = zoneinfo.ZoneInfo(plan["tz"])
    fold_day = datetime.date.fromisoformat("{{ dst_fold_local }}")
    hours = sorted(datetime.datetime.fromisoformat(e["local_wall"]) for e in events)
    all_offs = {h.utcoffset() for h in hours}
    assert len(all_offs) == 2, "expected exactly two UTC offsets, got %s" % all_offs
    pre = [h for h in hours if h.date() < fold_day]
    post = [h for h in hours if h.date() > fold_day]
    onday = [h for h in hours if h.date() == fold_day]
    assert pre and post and onday, "need events before, on, and after the fold day"
    assert all(h.utcoffset() == pre[0].utcoffset() for h in pre)
    assert all(h.utcoffset() == post[0].utcoffset() for h in post)
    assert pre[0].utcoffset() != post[0].utcoffset(), "no offset transition across the fold"
    assert any(h.utcoffset() == pre[0].utcoffset() for h in onday), "fold day missing pre-transition wall clock"
    assert any(h.utcoffset() == post[0].utcoffset() for h in onday), "fold day missing post-transition wall clock"
    # D1: the tier arithmetic — the Firing-the-Pass moment, by subtraction.
    now = datetime.datetime.now(datetime.timezone.utc)
    starts = {k: datetime.datetime.fromisoformat(v) for k, v in plan["tier_starts_utc"].items()}
    tier = 1 if now <= starts["1"] else (2 if now <= starts["2"] else 3)
    pass_at_risk = now > starts["3"]  # even the floor's latest start is gone: data, not a retry
    slack = int((starts[str(tier)] - now).total_seconds())
    arith = "now=%s vs tier_starts=%s -> tier %d (slack %ds against the tier's latest start)" % (
        now.isoformat(), {k: v.isoformat() for k, v in starts.items()}, tier, slack)
