    #
    # LIVE-PROBED 2026-09-04 (reviews 1/3 executed the ORIGINAL logic against
    # the live API and it died: 1 record vs a floor of 3, no retry, burst
    # throttling). The fixes, all executed: (a) CANDIDATES that each
    # live-verified to October dates BEFORE shipping — 12 stable hits; (b)
    # searches are PACED and retried on failure AND on empty results (a 200
    # with an empty search list is what throttling looks like); (c) entity
    # fetches are BATCHED (one call for all QIDs) which the limiter tolerates;
    # (d) ALL of P619/P585/P580 are iterated — no break on the first prop.
    python3 - <<'PY'
    import json, subprocess, urllib.parse, datetime, time
    UA = "night-dispatch/0.2 (Marianne proof)"
    DATE_PROPS = ["P619", "P585", "P580"]  # launch date, point in time, start time
    def api(params, tries=6, retry_empty=False):
        url = "https://www.wikidata.org/w/api.php?" + urllib.parse.urlencode(params)
        last = ""
        for attempt in range(tries):
            r = subprocess.run(["curl", "-s", "-w", "\n%{http_code}", "--max-time", "30",
                                "-H", "User-Agent: " + UA, url], capture_output=True, text=True)
            body, _, code = r.stdout.rpartition("\n")
            if r.returncode == 0 and code.strip() == "200":
                try:
                    doc = json.loads(body)
                    if retry_empty and not doc.get("search"):
                        last = "200 but empty search (throttle shape)"
                    else:
                        return doc
                except json.JSONDecodeError as e:
                    last = "bad json (%s)" % e
            else:
                last = "curl rc=%s http=%s" % (r.returncode, code.strip() or "?")
            time.sleep(min(2 ** attempt, 45))
        raise RuntimeError("wikidata api failed after %d tries: %s (%s)" % (tries, last, url[:120]))
    CANDIDATES = [
      "Sputnik 1", "Luna 3", "Voskhod 1", "Apollo 7", "Venera 9",
      "Mercury-Atlas 8", "Shenzhou 5", "Galileo spacecraft", "Ulysses probe",
      "Cassini–Huygens", "Deep Space 1", "BepiColombo", "Lucy spacecraft",
      "Psyche spacecraft", "Europa Clipper", "Hera spacecraft",
    ]
    def search_qid(term):
        """Entity search over TWO routes (live-verified 2026-09-04): the fast
        wbsearchentities (retried on the empty-200 throttle shape), then the
        action=query full-text route — a different path with its own limits
        that answered when the first was throttled. A miss is a MISS, not a
        failure: the floor governs the record count, and per-term silence
        must not kill the movement."""
        for attempt in range(4):
            try:
                s = api({"action": "wbsearchentities", "search": term, "language": "en",
                         "format": "json", "limit": 1}, retry_empty=True, tries=3)
                if s.get("search"):
                    return s["search"][0]["id"], "wbsearchentities"
            except RuntimeError:
                pass
            time.sleep(min(2 ** attempt, 20))
        r = subprocess.run(["curl", "-s", "-w", "\n%{http_code}", "--max-time", "30",
                            "-H", "User-Agent: " + UA,
                            "https://www.wikidata.org/w/api.php?" + urllib.parse.urlencode({
                                "action": "query", "list": "search", "srsearch": term,
                                "srnamespace": 0, "srlimit": 1, "format": "json"})],
                           capture_output=True, text=True)
        body, _, code = r.stdout.rpartition("\n")
        if r.returncode == 0 and code.strip() == "200":
            try:
                hits = json.loads(body).get("query", {}).get("search", [])
                if hits:
                    return hits[0]["title"], "query-search"
            except json.JSONDecodeError:
                pass
        return None, "miss"
    qids = {}
    search_routes = {}
    for term in CANDIDATES:
        qid, route = search_qid(term)
        search_routes[term] = route
        if qid:
            qids[term] = qid
        time.sleep(2.5)  # pace: bursty search calls are what trip the limiter
    all_ids = sorted(set(qids.values()))
    assert all_ids, "no candidates resolved — network shape changed, expand CANDIDATES"
    doc = api({"action": "wbgetentities", "ids": "|".join(all_ids),
               "props": "labels|claims", "languages": "en", "format": "json"})
    plan = json.load(open("backward-plan.json"))
    month = plan["edition_month"]
    term_by_qid = {v: k for k, v in qids.items()}
    records = []
    for qid in all_ids:
        ent = doc["entities"][qid]
        label = ent.get("labels", {}).get("en", {}).get("value", qid)
        rec = None
        for p in DATE_PROPS:  # iterate ALL props — no break on the first
            for claim in ent.get("claims", {}).get(p, []):
                t = claim["mainsnak"].get("datavalue", {}).get("value", {}).get("time", "")
                if not t:
                    continue
                dt = datetime.datetime.fromisoformat(t[1:].replace("Z", "+00:00"))
                if dt.month == month and dt.year >= 1900:
                    rec = {"qid": qid, "label": label,
                           "date": "%04d-%02d-%02d" % (dt.year, dt.month, dt.day),
                           "date_property": p,
                           "source_url": "https://www.wikidata.org/wiki/" + qid,
                           "claim_line": "%04d-%02d-%02d: %s (%s), verified live from %s claim" % (
                               dt.year, dt.month, dt.day, label, p, qid)}
                    break
            if rec:
                break
        if rec:
            records.append(rec)
    assert len(records) >= {{ min_anniversaries }}, (
        "only %d verified October anniversaries — expand CANDIDATES (live-verified "
        "2026-09-04: this list yields 12)" % len(records))
    # Deterministic re-verification of EVERY record (one batched call).
    doc2 = api({"action": "wbgetentities", "ids": "|".join(r["qid"] for r in records),
                "props": "claims", "format": "json"})
    for rec in records:
        t = doc2["entities"][rec["qid"]]["claims"][rec["date_property"]][0] \
            ["mainsnak"]["datavalue"]["value"]["time"]
        assert t[1:11] == rec["date"], "re-verification mismatch for %s: %s vs %s" % (
            rec["qid"], t, rec["date"])
    json.dump(records, open("anniversaries.json", "w"), indent=2)
    print("anniversaries:", len(records), "| all", len(records), "re-verified live")
    PY
