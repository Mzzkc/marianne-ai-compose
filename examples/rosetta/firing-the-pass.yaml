    # ══ M5 · The Band Join — decision point D1 ════════════════════════════════
    # Joins the two methods by (class, body/type/phase, event) with nearest-match,
    # asserts every delta within the DIGEST-REGISTERED bands — the join is a
    # FUNCTION, and the corruption drill runs THAT FUNCTION on a corrupted
    # fixture and demands the kill (review 2's "fixture exists" finding).
    # Checks the DST matrix, then runs the tier arithmetic that decides the
    # fan-out BEFORE the fan-out is spent, surfacing negative slack on the
