    # the REAL join function (not merely recorded as a file — review 2).
    drill = copy.deepcopy(events)
    for e in drill:
        if e["class"] == "rise-set" and e.get("detail", {}).get("body") == "moon":
            t = datetime.datetime.fromisoformat(e["utc"]) + datetime.timedelta(minutes=4)
