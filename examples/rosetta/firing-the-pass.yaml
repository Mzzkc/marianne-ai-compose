    local_sha = hashlib.sha256(open("buffer-B/events.ics", "rb").read()).hexdigest()
    assert served_sha == local_sha, "SERVED bytes differ from the released buffer (%s vs %s)" % (
        served_sha[:12], local_sha[:12])
    n = verify_served_bytes(served)
    assert n == len(events), "served %d VEVENTs vs %d computed" % (n, len(events))
    # Independent oracle: re-derive EVERY oracle-covered event from the second
    # code lineage, shared horizon convention, and join by key within bands.
    sr = bands["shared_refraction"]
    REFR_DEG = 0.5667 * (sr["pressure_mbar"] / 1010.0) * (283.15 / (273.15 + sr["temp_c"]))
    o = ephem.Observer()
    o.lat, o.lon, o.elevation = str(plan["lat"]), str(plan["lon"]), 0.0
    o.pressure = 0.0
    y, m = plan["edition_year"], plan["edition_month"]
    BODIES = {"sun": ephem.Sun, "moon": ephem.Moon, "mercury": ephem.Mercury,
              "venus": ephem.Venus, "mars": ephem.Mars, "jupiter": ephem.Jupiter,
              "saturn": ephem.Saturn}
    def alt_deg(bname, utc_dt):
        o.date = ephem.Date(utc_dt)
        b = BODIES[bname](); b.compute(o)
        return math.degrees(b.alt)
    def sd_deg(bname, utc_dt):
        if bname not in ("sun", "moon"):
            return 0.0
        o.date = ephem.Date(utc_dt)
        b = BODIES[bname](); b.compute(o)
        return (b.size / 2.0) / 3600.0
    def th_fn(bname):
        if bname in ("sun", "moon"):
            return lambda t, b=bname: -(REFR_DEG + sd_deg(b, t))
        return lambda t: -(REFR_DEG)
    def nearest_before(bname, th, t_target, hours=3.0):
        """Bisect the crossing immediately around t_target (search FORWARD
        from t_target - epsilon only — review 1's finding that searching
        backward 26h finds the PREVIOUS day's event)."""
        eps = datetime.timedelta(seconds=60)
        t_lo = t_target - eps
        t_hi = t_target + datetime.timedelta(hours=1.0)
        f_lo = alt_deg(bname, t_lo) - th(t_lo)
        f_hi = alt_deg(bname, t_hi) - th(t_hi)
        if f_lo * f_hi > 0:
            return None
        for _ in range(40):
            mid = t_lo + (t_hi - t_lo) / 2
            f_mid = alt_deg(bname, mid) - th(mid)
            if f_lo * f_mid <= 0:
                t_hi = mid
            else:
                t_lo, f_lo = mid, f_mid
        return t_lo + (t_hi - t_lo) / 2
    def k_of(e):
        if e["class"] == "rise-set":
            return ("rs", e["detail"]["body"], e["detail"]["event"])
        if e["class"] == "twilight":
            return ("tw", e["detail"]["type"], e["detail"]["event"])
        if e["class"] == "phase":
            return ("ph", e["detail"]["phase"], None)
        return None
    checked, worst_all = 0, 0.0
    for e in events.values():
        k = k_of(e)
        if not k:
            continue
        t = datetime.datetime.fromisoformat(e["utc"])
        if k[0] == "ph":
