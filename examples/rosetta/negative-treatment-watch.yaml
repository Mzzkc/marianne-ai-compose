    wjson(os.path.join(SB, "watermark.json"), {"entries_seen": 2, "updated_at": ""})
    r = run(PROP + ["--watermark", "watermark.json"])
    feed = open(os.path.join(SB, "site/feed.xml")).read()
    n_entries = feed.count("<entry>")
    check("zero-new-rows cycle still serves the window (2 entries)",
          r.returncode == 0 and n_entries == 2,
          (r.stderr or "entries=%d" % n_entries)[-160:])
    wjson(os.path.join(SB, "watermark.json"), {"entries_seen": 0, "updated_at": ""})
    r = run(PROP + ["--watermark", "watermark.json"])
    feed2 = open(os.path.join(SB, "site/feed.xml")).read()
    check("feed is a tail window, not only-new (watermark 0 -> same window)",
          r.returncode == 0 and feed2.count("<entry>") == 2)

    # 10 — the shipped stale-check.js wiring (banner only on a stale lease)
    node = shutil.which("node")
    if not node:
        check("stale-check wiring (node present)", False, "node absent")
    else:
        js = (
            "const { bootstrap } = require(%s);\n" % json.dumps(os.path.join(SB, "site/stale-check.js")) +
            "function stubDoc(){const a=[];return{appended:a," +
            "createElement:t=>({tag:t,attrs:{},children:[]," +
            "setAttribute(k,v){this.attrs[k]=v;}," +
            "appendChild(c){this.children.push(c);return c;}})," +
            "createTextNode:t=>({text:t}),body:{appendChild(c){a.push(c);}}};}\n" +
            "const now=Date.now();\n" +
            "const lease=ms=>({json:()=>Promise.resolve({completed_at:new Date(ms).toISOString(),interval_days:7,grace_days:1})});\n" +
            "const sd=stubDoc(),fd=stubDoc();\n" +
            "Promise.all([bootstrap({document:sd,fetch:()=>Promise.resolve(lease(now-(7+1+2)*86400000)),nowMs:now})," +
            "bootstrap({document:fd,fetch:()=>Promise.resolve(lease(now-86400000)),nowMs:now})])" +
            ".then(r=>{console.log(JSON.stringify({stale:r[0]===true&&sd.appended.length===1&&sd.appended[0].attrs.id==='rotting-canon-stale'," +
            "fresh:r[1]===false&&fd.appended.length===0}));process.exit(0);})" +
            ".catch(e=>{console.error(e);process.exit(1);});\n")
        r = subprocess.run([node, "-e", js], cwd=SB, capture_output=True, text=True)
        try:
            out = json.loads(r.stdout.strip().splitlines()[-1])
        except Exception:
            out = {}
        check("shipped stale-check.js injects the banner only when stale",
              r.returncode == 0 and out.get("stale") and out.get("fresh"),
              r.stdout[-120:] or r.stderr[-120:])

    # 11 — journal-verify: growth AND prior-HEAD ancestry (a rewritten local
    #     history with more commits than before must fail)
    def git(*args):
        return subprocess.run(["git", "-C", SB] + list(args),
                              capture_output=True, text=True)
    git("init", "-q")
    git("config", "user.name", "probe")
    git("config", "user.email", "probe@rotting-canon.invalid")
    wjson(os.path.join(SB, "cycle-state.json"),
          {"cycle": 1, "commit_count": 0})
    open(os.path.join(SB, "notefile.txt"), "w").write("one")
    git("add", "-A")
    git("commit", "-qm", "c1")
    JV = [os.path.join(SCRIPTS, "journal-verify.py"), "--ledger", LEDGER,
          "--repo", "."]
    r = run(JV)
    check("journal-verify passes a grown journal", r.returncode == 0,
          (r.stdout + r.stderr)[-160:])
    open(os.path.join(SB, "notefile.txt"), "w").write("two")
    git("add", "-A")
    git("commit", "-qm", "c2")
    r = run(JV)
    ok_grew = r.returncode == 0
    # rewrite AND grow: amend the recorded HEAD away, then add a fresh commit
    # so the count still grows — only the ANCESTRY check can catch this
    git("commit", "-q", "--amend", "-m", "rewritten")
    open(os.path.join(SB, "notefile.txt"), "w").write("three")
    git("add", "-A")
    git("commit", "-qm", "c3-on-rewritten")
    r = run(JV)
    check("rewritten-but-longer history fails the ancestry check",
          ok_grew and r.returncode != 0, (r.stdout + r.stderr).strip()[-120:])

    # 12 — quarantine hold lifecycle through the shipped quarantine.py:
    #     a stale hold.json suppresses; a clean cycle flips
    wjson(os.path.join(SB, "flagged.json"), [])
    wjson(os.path.join(SB, "adjudications.json"),
          [{"claim_id": CK, "verdict": "QUARANTINE",
            "touched_issue": "findings retracted", "evidence_quote": "Q",
            "rationale": "probe"}])
    wjson(os.path.join(SB, "hold.json"),
          {"flag_rate": 1.0, "threshold": 0.1, "decision": "HOLD",
           "escalation": "probe"})
    r = run([os.path.join(SCRIPTS, "quarantine.py"), "--db", "canon.db",
             "--adjudications", "adjudications.json",
             "--report", "quarantine-report.md"])
    conn = sqlite3.connect(os.path.join(SB, "canon.db"))
    held_status = conn.execute("SELECT status FROM claims WHERE id=?", (CK,)).fetchone()[0]
    conn.close()
    man = json.load(open(os.path.join(SB, "quarantine-manifest.json")))
    check("hold suppresses the quarantine (refusal, not execution)",
          r.returncode == 0 and held_status == "admitted" and man["hold"] is True,
          held_status)
    os.remove(os.path.join(SB, "hold.json"))
    r = run([os.path.join(SCRIPTS, "quarantine.py"), "--db", "canon.db",
             "--adjudications", "adjudications.json",
             "--report", "quarantine-report.md"])
    conn = sqlite3.connect(os.path.join(SB, "canon.db"))
    flipped = conn.execute("SELECT status FROM claims WHERE id=?", (CK,)).fetchone()[0]
    conn.close()
    check("clean cycle (hold removed at M1/M5) flips the status",
          r.returncode == 0 and flipped == "quarantined", flipped)

    all_ok = all(c["passed"] for c in checks)
    wjson(os.path.join(WS, "probes", "cycle2-probe.json"),
          {"probe": True,
           "label": "simulated cycle 2 over the shipped scripts "
                    "(no network, no publish, sandboxed)",
           "checks": checks, "all_passed": all_ok})
    print("cycle2 probe:", sum(1 for c in checks if c["passed"]), "of",
          len(checks), "checks passed")
    sys.exit(0 if all_ok else 1)
    PYEOF
    .venv/bin/python scripts/probe-cycle2.py

    # Immutability — the probe movement cannot have mutated the real record
    post_canon=$(sha256sum canon.db | cut -d" " -f1)
    post_lease=$(sha256sum lease-record.json | cut -d" " -f1)
    if [ "$pre_canon" = "$post_canon" ] && [ "$pre_lease" = "$post_lease" ]; then
      printf '{"unchanged": true, "canon_sha256": "%s", "lease_sha256": "%s"}\n' "$post_canon" "$post_lease" > probes/immutability.json
    else
      printf '{"unchanged": false}\n' > probes/immutability.json
      echo "FATAL: probes mutated the real record"
      exit 1
    fi
    {{ boundary("M12 prove-the-alarms") }}

    {% elif stage == 13 %}
    # ═══ M13 · Verify the Journal — FEH's verification half ═══
    # Per-entry hash chain (recomputed from each row's own fields),
    # supersedes that RESOLVES to a prior entry of the same claim, a git log
    # that strictly grew — and prior-HEAD ancestry: the HEAD recorded last
    # cycle must be an ancestor of this HEAD, which is exactly what a
    # force-push/rebase destroys. Count growth alone let a rewritten history
    # with equal-or-more commits pass (rev-1's check was also permanently
    # vacuous: the sweep overwrote cycle-state; it now MERGES).

    {{ cli_open() }}
    cat > scripts/journal-verify.py <<'PYEOF'
    import argparse, json, re, subprocess, sys

    ap = argparse.ArgumentParser()
    ap.add_argument("--ledger", required=True)
    ap.add_argument("--repo", required=True)
    a = ap.parse_args()
    rows = [json.loads(l) for l in open(a.ledger) if l.strip()]
    if rows:
        if rows[0]["prior_hash"] != "0" * 64:
            print("genesis prior_hash must be 64 zeros")
            sys.exit(1)
        for prev, cur in zip(rows, rows[1:]):
            if cur["prior_hash"] != prev["new_hash"]:
                print("chain break at", cur["id"])
                sys.exit(1)
        for r in rows:
            if not re.fullmatch(r"[0-9a-f]{64}", r["new_hash"]):
                print("bad new_hash at", r["id"])
                sys.exit(1)
            if r.get("supersedes") and not re.fullmatch(r"[0-9a-f]{64}", r["supersedes"]):
                print("bad supersedes at", r["id"])
                sys.exit(1)
    n = int(subprocess.run(["git", "-C", a.repo, "rev-list", "--count", "HEAD"],
                           capture_output=True, text=True).stdout.strip())
    state = {"cycle": 1, "commit_count": 0}
    try:
        state = json.load(open("cycle-state.json"))
    except FileNotFoundError:
        pass
    prior_count = state.get("commit_count", 0)
    if n <= prior_count:
        print("git log did not grow:", n, "<=", prior_count)
        sys.exit(1)
    prior_head = state.get("head_sha")
    if prior_head:
        rc = subprocess.run(
            ["git", "-C", a.repo, "merge-base", "--is-ancestor", prior_head, "HEAD"],
            capture_output=True).returncode
        if rc != 0:
            print("HISTORY REWRITE: prior cycle HEAD", prior_head[:12],
                  "is not an ancestor of HEAD — fork-evidence violated")
            sys.exit(1)
    state["commit_count"] = n
    state["head_sha"] = subprocess.run(
        ["git", "-C", a.repo, "rev-parse", "HEAD"],
        capture_output=True, text=True).stdout.strip()
    json.dump(state, open("cycle-state.json", "w"))
    print("journal verified:", len(rows), "rows,", n, "commits (prior",
          str(prior_count) + ")", "ancestry OK")
    PYEOF
    .venv/bin/python scripts/journal-verify.py --ledger ledger/corrections.jsonl --repo .
    {{ boundary("M13 journal-verify") }}

    {% elif stage == 14 %}
    # ═══ M14 · Publish — FEH's public half, ending at the LIVE seam ═══
    # The push is refused unless origin/main is empty or a prior canon cycle,
    # keyed on a MARKER FILE in the remote tree (commit subjects are a
    # heuristic; a file is a fact). Branch protection forbids force-push
    # with enforce_admins ON — and if the token lacks the authority to set
    # protection, that is DISCLOSED (marker absent) and retried next cycle,
    # never silently dropped. Pages serves /docs (the API only accepts /
    # or /docs): docs/ is a byte-identical copy of site/, materialized here
    # by the publish movement — the serving copy lives in the journal, so
    # the deployed bytes are auditable in-history. The LIVE seam then
    # re-fetches the deployed site, feed, methodology, debt page, banner
    # wiring — and the deployed EVIDENCE RESPONSE BYTES, re-hashed against
    # the admission digests: proof-carrying artifacts are public, not merely
    # present. gh push/admin authority is read back from the repo API.

    {{ cli_open() }}
    owner=$(cat canary/gh-login.txt)
    site_url="https://${owner}.github.io/{{ repo_name }}/"
    printf '{"owner": "%s", "site_url": "%s", "feed_url": "%sfeed.xml", "repo": "%s/%s"}\n' \
      "$owner" "$site_url" "$site_url" "$owner" "{{ repo_name }}" > publish/target.json
    # docs/ = byte-identical serving copy of site/ (derived; owned here)
    rm -rf docs
    cp -a site docs
    git add -A
    git commit -m "publish - cycle $(jq -r .cycle cycle-state.json)" --allow-empty
    if gh repo view "{{ repo_name }}" >/dev/null 2>&1; then
      git remote remove origin 2>/dev/null || true
      git remote add origin "https://github.com/${owner}/{{ repo_name }}.git"
      git fetch origin main 2>/dev/null || true
      # unrelated-history guard: a MARKER FILE in the remote tree, not subjects
      if git rev-parse origin/main >/dev/null 2>&1; then
        if git cat-file -e origin/main:rotting-canon-marker 2>/dev/null; then
          : # a prior canon cycle — proceed
        elif [ "$(git rev-list --count origin/main)" -gt 0 ]; then
          echo "REFUSING: origin/main carries unrelated history (no canon marker)"
          exit 1
        fi
      fi
      git push -u origin main
    else
      gh repo create "{{ repo_name }}" --public --source . --push
    fi

    # Authority read-back: identity (canary) is not authority (repo rights).
    push_ok=$(gh api "repos/${owner}/{{ repo_name }}" -q .permissions.push 2>/dev/null || echo null)
    admin_ok=$(gh api "repos/${owner}/{{ repo_name }}" -q .permissions.admin 2>/dev/null || echo null)
    echo "gh authority: push=${push_ok} admin=${admin_ok}"
    [ "$push_ok" = "true" ] || { echo "FATAL: token cannot push to the target repo"; exit 1; }

    if gh api -X PUT "repos/${owner}/{{ repo_name }}/branches/main/protection" --input - <<'JSON' >/dev/null
    {
      "required_status_checks": null,
      "enforce_admins": true,
      "required_pull_request_reviews": null,
      "restrictions": null,
      "allow_force_pushes": false,
      "allow_deletions": false
    }
    JSON
    then
      echo applied > publish/protection-applied
    else
      rm -f publish/protection-applied
      echo "WARN: branch protection NOT applied (token lacks administration authority) — DISCLOSED, retried idempotently next cycle"
    fi

    gh api -X POST "repos/${owner}/{{ repo_name }}/pages" -f "source[branch]=main" -f "source[path]=/docs" >/dev/null 2>&1 \
      || gh api "repos/${owner}/{{ repo_name }}/pages" >/dev/null
    # Dormancy Gate: poll the build with backoff instead of failing on latency
    i=0
    until [ "$(gh api "repos/${owner}/{{ repo_name }}/pages" -q .status 2>/dev/null || echo building)" = "built" ]; do
      i=$((i+1))
      [ "$i" -gt 40 ] && { echo "pages never reported built"; exit 1; }
      sleep 20
    done

    # THE LIVE SEAM: workspace-green is not deployed — fetch the deployed bytes.
    curl -fsSL --retry 6 --retry-delay 20 --retry-all-errors "$site_url" -o publish/live-index.html
    curl -fsSL --retry 6 --retry-delay 20 --retry-all-errors "$site_url"feed.xml -o publish/live-feed.xml
    grep -q "rotting-canon" publish/live-index.html || { echo "deployed index missing marker"; exit 1; }
    # the deployed banner WIRING and the noscript fallback
    curl -fsSL --retry 6 --retry-delay 20 --retry-all-errors "$site_url"stale-check.js -o publish/live-stale-check.js
    grep -q "lease.json" publish/live-stale-check.js && grep -q "rotting-canon-stale" publish/live-stale-check.js \
      || { echo "deployed stale-check.js lost its wiring"; exit 1; }
    grep -q "noscript" publish/live-index.html || { echo "deployed index missing noscript fallback"; exit 1; }
    # methodology discloses the healthcheck state; the debt list is public
    curl -fsSL --retry 4 --retry-delay 15 "$site_url"methodology.html -o publish/live-methodology.html
    grep -q "Dead-man switch" publish/live-methodology.html || { echo "deployed methodology does not disclose the switch"; exit 1; }
    curl -fsSL --retry 4 --retry-delay 15 "$site_url"debt.html -o publish/live-debt.html
    grep -qi "debt\|No unresolved" publish/live-debt.html || { echo "deployed debt page missing"; exit 1; }
    # deployed evidence bytes: re-hash the public proof-carrying artifacts
    SITE_URL="$site_url" .venv/bin/python - <<'PYEOF'
    import hashlib, json, os, urllib.request
    base = os.environ["SITE_URL"]
    bundles = [json.load(open(p)) for p in sorted(__import__("glob").glob("evidence/claims/C-*.json"))]
    assert bundles, "no evidence bundles to publish"
    checked = 0
    for b in bundles[:10]:      # first ten admitted claims, live
        u = base + "evidence/claims/" + b["id"] + ".response.json"
        with urllib.request.urlopen(u, timeout=60) as r:
            body = r.read()
        got = hashlib.sha256(body).hexdigest()
        assert got == b["digest"], ("public evidence bytes diverge from admission digest", b["id"])
        checked += 1
    print("live evidence re-hash OK:", checked, "bundles byte-identical to admission")
    # deployed feed joined back to the quarantined set + index presence
    import re, sqlite3, xml.parsers.expat
    feed = open("publish/live-feed.xml", "rb").read()
    p = xml.parsers.expat.ParserCreate()
    p.StartDoctypeDeclHandler = lambda *a: (_ for _ in ()).throw(ValueError("DTD forbidden"))
    p.Parse(feed, True)
    ids = set(re.findall(rb"<id>tag:rotting-canon,[^<]*?(C-[0-9a-f]{12})[^<]*</id>", feed))
    db = sqlite3.connect("canon.db")
    quarantined = {r[0] for r in db.execute("SELECT id FROM claims WHERE status='quarantined'")}
    index = open("publish/live-index.html", encoding="utf-8", errors="replace").read()
    for cid in ids:
        c = cid.decode()
        assert c in quarantined, ("deployed feed entry not a quarantined claim", c)
        assert c in index, ("deployed feed entry missing from the live index", c)
    print("live feed join OK:", len(ids), "entries all quarantined and indexed")
    PYEOF
    echo "LIVE: $site_url"
    {{ boundary("M14 publish") }}
    {% endif %}

# ═════════════════════════ VALIDATIONS ═══════════════════════════════════════
# Outcome, not process. No existence-only rule stands alone. Every sheet has
# at least one check; command_succeeds dominates; stages fail fast within a
# sheet (Commissioning Cascade: cheap structure before expensive semantics).
# NOTE the dialect split: validation commands use format-string {var}; only
# the prompt template above uses Jinja. User variables reach validation
# commands literally (template_variables carries them into the context).

# ═════════════════════════ VALIDATIONS ═══════════════════════════════════════
# Outcome, not process. No existence-only rule stands alone. Every sheet has
# at least one check; command_succeeds dominates; stages fail fast within a
# sheet (Commissioning Cascade: cheap structure before expensive semantics).
# NOTE the dialect split: validation commands use format-string {var}; only
# the prompt template above uses Jinja. User variables reach validation
# commands literally (template_variables carries them into the context).
# Descriptions claim EXACTLY what the command checks — a description that
# overclaims is the Validation-Reality failure mode this corpus exists to kill.

validations:
  # ── M1 · canary: the anti-fabrication gate (before any LLM token) ──────────
  - type: command_succeeds
    command: 'jq -e ''[.probes[].marker_present] | all'' {workspace}/canary/canary-report.json > /dev/null'
    condition: "stage == 1"
    stage: 1
    description: "All five markers observed — the pinned venv imports, Wakefield RETRACTED title, PubMed pubtype, month-length-aware pageviews, wikitext cite markers"
  - type: command_succeeds
    command: |
      cd {workspace}
      sha=$(sha256sum raw/rwdb.csv | cut -d" " -f1)
      pin=$(jq -r .digest raw/rwdb.pin.json)
      test "$sha" = "$pin"
      test "$(jq .rows raw/rwdb.pin.json)" -gt {min_rwdb_rows}
      jq -e '["OriginalPaperDOI","RetractionNature","RetractionDate","Reason"] - .header | length == 0' raw/rwdb.pin.json > /dev/null
      test -s canary/stack-freeze.txt
      grep -q "matplotlib=={pin_matplotlib}" canary/stack-freeze.txt
      grep -q "feedparser=={pin_feedparser}" canary/stack-freeze.txt
      grep -q "mwparserfromhell=={pin_mwparserfromhell}" canary/stack-freeze.txt
      test -s canary/gh-login.txt
      test -s rotting-canon-marker
      test -f ledger/corrections.jsonl
      jq -e '.prev_month_window | length == 2' canary/canary-report.json > /dev/null
    condition: "stage == 1"
    stage: 2
    description: "RWDB digest re-pinned, rows above floor, four load-bearing columns exact; the EXACT pip pins are in the freeze (matplotlib/feedparser/mwparserfromhell == the declared versions); gh identity receipt; publication marker and ledger file born"
  - type: command_succeeds
    command: 'git -C {workspace} rev-parse HEAD > /dev/null'
    condition: "stage == 1"
    stage: 2
    description: "FEH substrate born: repo exists with at least one boundary commit"

  # ── M2 · corpus gate ────────────────────────────────────────────────────────
  - type: command_succeeds
    command: 'jq -e ''length >= {min_articles} and all(.[]; (.title | type == "string" and length > 0) and (.views | type == "number"))'' {workspace}/articles/selected-articles.json > /dev/null'
    condition: "stage == 2"
    stage: 1
    description: "Corpus of at least {min_articles} traffic-ranked articles, each with a non-empty title and a numeric view count — one article proves nothing epidemiologically"

  # ── M3 · structural invariants of the raw claim material ────────────────────
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import glob, json, re
      cands = json.load(open('{workspace}/articles/candidates.json'))
      assert cands, 'no candidates extracted'
      per = {}
      for c in cands:
          assert re.match(r'^10\.\d{4,}/\S+$', c['doi']), c
          assert c['section'], c
          assert c['sentence_excerpt'], c
          per[c['article']] = per.get(c['article'], 0) + 1
      assert all(v <= {per_article_cap} for v in per.values()), per
      assert {total_claims_min} <= len(cands) <= {total_claims_max}, len(cands)
      prefixes = {c['doi'].split('/')[0] for c in cands}
      assert len(prefixes) >= {min_doi_prefixes}, sorted(prefixes)
      pins = glob.glob('{workspace}/articles/*.pin.json')
      assert pins, 'no revision pins'
      for p in pins:
          assert isinstance(json.load(open(p))['revid'], int), p
      print('candidates ok:', len(cands), 'articles:', len(per), 'registrants:', len(prefixes))
      "
    condition: "stage == 3"
    stage: 1
    description: "Every DOI well-formed; sections/excerpts non-empty; per-article cap held; totals in bounds; at least {min_doi_prefixes} distinct DOI registrants (domain spread, not one publisher's batch); every pin carries an integer revid (the parse.revid-is-null trap)"

  # ── M4 · PCA admit = re-hash; graph invariants; conservation ────────────────
  - type: command_succeeds
    command: 'cd {workspace}/evidence/claims && sha256sum -c MANIFEST.sha256'
    condition: "stage == 4"
    stage: 1
    description: "PCA admit re-hashes every bundle against the manifest — trust is re-derivation, not say-so"
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import json, re, sqlite3
      db = sqlite3.connect('{workspace}/canon.db')
      assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
      n_claims = db.execute('SELECT COUNT(*) FROM claims').fetchone()[0]
      n_anchors = db.execute('SELECT COUNT(*) FROM anchors').fetchone()[0]
      n_digests = db.execute('SELECT COUNT(DISTINCT digest) FROM anchors').fetchone()[0]
      n_orphans = db.execute('SELECT COUNT(*) FROM claims c LEFT JOIN dependents d ON c.id=d.claim_id WHERE d.claim_id IS NULL').fetchone()[0]
      n_nulls = db.execute('SELECT COUNT(*) FROM claims WHERE doi IS NULL OR doi = \'\'').fetchone()[0]
      assert n_claims == n_anchors == n_digests, (n_claims, n_anchors, n_digests)
      assert n_orphans == 0, n_orphans
      assert n_nulls == 0
      for (cid,) in db.execute('SELECT id FROM claims'):
          assert re.fullmatch(r'C-[0-9a-f]{12}', cid), cid
      cands = json.load(open('{workspace}/articles/candidates.json'))
      admitted = json.load(open('{workspace}/articles/admitted.json'))
      debt = json.load(open('{workspace}/articles/debt.json'))
      uniq = len(set(c['doi'] for c in cands))
      assert uniq == len(admitted) + len(debt), (uniq, len(admitted), len(debt))
      print('canon ok:', n_claims, 'DOI-derived ids; conservation', uniq, '=', len(admitted), '+', len(debt))
      "
    condition: "stage == 4"
    stage: 2
    description: "Integrity check passes; claims==anchors==distinct digests; every claim has >=1 dependent edge; zero NULL DOIs; every claim id matches C-[0-9a-f]{12} (sha256-of-DOI derived — position can never reassign identity); nothing silently dropped (candidates == admitted + debt)"

  # ── M5 · the sweep's own fabrication definition + semantic joins ────────────
  - type: command_succeeds
    command: 'test -s {workspace}/sweep-report.json && test -s {workspace}/lease-record.json'
    condition: "stage == 5"
    stage: 1
    description: "Sweep report AND lease record non-empty — a cycle that ran without touching the lease is a fabrication (the pattern's words)"
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import datetime, hashlib, json, os, sqlite3
      db = sqlite3.connect('{workspace}/canon.db')
      sw = json.load(open('{workspace}/sweep-report.json'))
      lease = json.load(open('{workspace}/lease-record.json'))
      flags = json.load(open('{workspace}/flagged.json'))
      admitted = set(r[0] for r in db.execute(
          \"SELECT id FROM claims WHERE status IN ('admitted','quarantined','retired')\"))
      for f in flags:
          assert f['claim_id'] in admitted, f['claim_id']
          assert f['probes'], f['claim_id']
          assert f.get('evidence_date'), ('no derivable evidence date', f['claim_id'])
          assert 'latency_days' in f, f['claim_id']
          for probe, sha in f['markers_sha'].items():
              try:
                  stored = open('%s/evidence/sweep/%s-%s.json' % (
                      '{workspace}', f['claim_id'], probe), 'rb').read()
              except FileNotFoundError:
                  raise AssertionError('no stored probe bytes: %s %s' % (
                      f['claim_id'], probe))
              assert hashlib.sha256(stored).hexdigest() == sha, (
                  'stored probe bytes do not hash to the sealed marker',
                  f['claim_id'], probe)
      matrix = sw.get('disagreement_matrix', [])
      assert len(matrix) == len(flags), (len(matrix), len(flags))
      for m in matrix:
          assert m['hit'], m
          assert set(m['hit']) <= set(m['ran']), m
      disagreement = [m for m in matrix if len(m['hit']) < len(m['ran'])]
      assert sw.get('disagreement_pairs') == disagreement, 'disagreement is hit-subset-of-ran'
      rate = sw['flag_count'] / sw['claims_swept'] if sw['claims_swept'] else 0.0
      held = rate > {hold_threshold}
      assert sw['hold'] == held, (sw['hold'], held)
      if held:
          assert json.load(open('{workspace}/hold.json'))['decision'] == 'HOLD'
      else:
          assert not os.path.exists('{workspace}/hold.json'), 'hold.json below threshold (lifecycle: written only when held)'
      c = datetime.datetime.strptime(lease['completed_at'], '%Y-%m-%dT%H:%M:%SZ')
      d = datetime.datetime.strptime(lease['due_next'], '%Y-%m-%dT%H:%M:%SZ')
      assert (d - c).days == lease['interval_days'] == {sweep_interval_days}
      assert lease['cycle'] == sw['cycle']
      print('sweep joins ok: flags', len(flags), 'rate', round(rate, 4), 'hold', held, 'disagreement', len(disagreement))
      "
    condition: "stage == 5"
    stage: 2
    description: "Flags are a subset of admitted; every flag's markers_sha IS the sha256 of the exact stored probe bytes (recomputed — encoding can never orphan a true flag); every flag carries a derivable evidence_date and a latency field; the disagreement matrix covers every flag with hit ⊆ ran and the recorded disagreement is exactly hit ⊂ ran; hold arithmetic recomputed independently and matches the gate's decision AND its file lifecycle; lease due_next is completed_at + interval exactly"

  # ── M6 · the Skeptical Oracle gate on LLM output #1 ─────────────────────────
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import glob, json, os
      adj = json.load(open('{workspace}/adjudications.json'))
      flags = json.load(open('{workspace}/flagged.json'))
      ids_a = [x['claim_id'] for x in adj]
      ids_f = [x['claim_id'] for x in flags]
      assert len(adj) == len(flags), ('bijection size', len(adj), len(flags))
      assert set(ids_a) == set(ids_f), ('bijection membership', set(ids_f) ^ set(ids_a))
      assert len(ids_a) == len(set(ids_a)), 'duplicate adjudication'
      bundles = {os.path.basename(p)[:-5]: open(p, encoding='utf-8', errors='replace').read()
                 for p in glob.glob('{workspace}/evidence/claims/C-*.json')}
      flags_by = {f['claim_id']: f for f in flags}
      for x in adj:
          assert x['verdict'] in ('QUARANTINE', 'RETAIN'), x
          if x['verdict'] == 'QUARANTINE':
              assert x.get('touched_issue'), x['claim_id']
          else:
              assert not x.get('touched_issue'), x['claim_id']
          assert x.get('evidence_quote'), x['claim_id']
          # PER-CLAIM corpus: only this claim's bundle + this claim's flag bytes
          local = bundles.get(x['claim_id'], '') + json.dumps(flags_by[x['claim_id']])
          assert x['evidence_quote'] in local, (
              'quote not a substring of THIS claim\\'s shipped bytes', x['claim_id'])
      print('adjudication gate ok:', len(adj), 'verdicts; bijection + iff + per-claim substring hold')
      "
    condition: "stage == 6"
    stage: 1
    description: "Verdict enum; flagged-to-adjudicated bijection; touched_issue non-empty iff QUARANTINE; every evidence_quote is a verbatim substring of THAT claim's bundle/flag bytes only — a quote borrowed from a neighboring claim fails (cross-claim laundering impossible)"

  # ── M7 · blast radius: the manifest joins the DB AND the report ─────────────
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import json, sqlite3
      db = sqlite3.connect('{workspace}/canon.db')
      adj = json.load(open('{workspace}/adjudications.json'))
      manifest = json.load(open('{workspace}/quarantine-manifest.json'))
      report = open('{workspace}/quarantine-report.md', encoding='utf-8').read()
      try:
          hold = json.load(open('{workspace}/hold.json'))['decision'] == 'HOLD'
      except FileNotFoundError:
          hold = False
      q = [x for x in adj if x['verdict'] == 'QUARANTINE']
      n_q = db.execute(
          \"SELECT COUNT(*) FROM claims WHERE status='quarantined'\").fetchone()[0]
      if hold:
          assert manifest['hold'] is True and manifest['quarantined'] == [], 'hold must suppress the manifest too'
          assert n_q == 0, (n_q, 'hold active but statuses flipped')
      else:
          assert {m['claim_id'] for m in manifest['quarantined']} == {x['claim_id'] for x in q}, 'manifest does not match QUARANTINE verdicts'
          assert n_q == len(q), (n_q, len(q))
          for m in manifest['quarantined']:
              db_articles = sorted(r[0] for r in db.execute(
                  'SELECT DISTINCT article FROM dependents WHERE claim_id=?', (m['claim_id'],)))
              assert m['articles'] == db_articles, (m['claim_id'], m['articles'], db_articles)
              assert m['dependent_edges'] >= 1, m['claim_id']
              assert ('## ' + m['claim_id']) in report, ('report missing section', m['claim_id'])
      print('quarantine join ok:', n_q, 'quarantined, hold', hold)
      "
    condition: "stage == 7"
    stage: 1
    description: "The manifest's quarantined set equals the QUARANTINE verdicts (zero when hold fired — refusal is the correct behavior); every manifest entry's article list equals the DB's dependent articles EXACTLY (blast radius is joined, not counted); every quarantined claim has >=1 dependent edge and a report section"

  # ── M8 · structural gates on LLM output #2 (genre constraints, checked) ─────
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import json, re
      corr = json.load(open('{workspace}/pending-corrections.json'))
      adj = json.load(open('{workspace}/adjudications.json'))
      flags_by = {f['claim_id']: f for f in json.load(open('{workspace}/flagged.json'))}
      quarantined = {x['claim_id'] for x in adj if x['verdict'] == 'QUARANTINE'}
      try:
          hold = json.load(open('{workspace}/hold.json'))['decision'] == 'HOLD'
      except FileNotFoundError:
          hold = False
      if hold:
          assert corr == [], 'hold active — no corrections may be drafted'
      else:
          ids = [c['claim_id'] for c in corr]
          assert len(ids) == len(set(ids)), 'duplicate correction'
          assert set(ids) == quarantined, ('BIJECTION violated', set(ids) ^ quarantined)
      blame = re.compile(r'(you (made|should have|failed|cited|missed|were)|editor.?s? (fault|mistake|error|blame)|(editor|author|contributor|wikipedia)[^.]{0,40}(fault|mistake|error|blame|sloppy|careless|negligen)|sloppy|careless|negligen)', re.I)
      for c in corr:
          for field in ('claim_id', 'error', 'new_text', 'authority'):
              assert c.get(field), (c.get('claim_id'), field)
          f = flags_by[c['claim_id']]
          assert f['evidence_date'] in c['new_text'], ('date not carried', c['claim_id'])
          token = f['evidence_reason'].split(',')[0].split(';')[0].strip().lower()
          if len(token) >= 4:
              assert token in c['new_text'].lower(), ('reason not carried', c['claim_id'])
          assert not blame.search(c['new_text']), ('blame lexicon hit', c['claim_id'])
          assert 80 <= len(c['new_text']) <= 1200, ('length', c['claim_id'])
      print('errata gates ok:', len(corr), 'corrections: bijected, dated, reasoned, blame-free, bounded')
      "
    condition: "stage == 8"
    stage: 1
    description: "BIJECTION: corrections exactly equal the quarantined claim set — omission fails, extras fail, hallucinated targets fail; new_text carries every flag's evidence_date and reason token UNCONDITIONALLY (never RWDB-conditional); blame lexicon (agent+fault collocations) returns zero matches; length bounds hold"

  # ── M9 · the hash-join and the chain ────────────────────────────────────────
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python {workspace}/scripts/errata-commit.py --verify-join \
        --db {workspace}/canon.db --ledger {workspace}/ledger/corrections.jsonl
    condition: "stage == 9"
    stage: 1
    description: "verify-join (shipped verifier): every hash hex64 and recomputable from the row's own fields, chain prefixes hold, supersedes resolves to a prior entry of the same claim, and the ledger HEAD names the canon digest it produced — canon/ledger divergence is impossible, not late-detected"
  - type: command_succeeds
    command: |
      {workspace}/.venv/bin/python -c "
      import hashlib, json, re
      rows = [json.loads(l) for l in open('{workspace}/ledger/corrections.jsonl') if l.strip()]
      def eh(r):
          payload = {'prior_hash': r['prior_hash'], 'claim_id': r['claim_id'],
                     'canon_digest': r['canon_digest'], 'date': r['date'],
                     'action': r['action'], 'note': r['note'],
                     'supersedes': r.get('supersedes') or ''}
          return hashlib.sha256(json.dumps(payload, sort_keys=True,
                                            separators=(',', ':')).encode()).hexdigest()
      if rows:
          assert rows[0]['prior_hash'] == '0' * 64
          for prev, cur in zip(rows, rows[1:]):
              assert cur['prior_hash'] == prev['new_hash']
          seen = {}
          for r in rows:
              assert re.fullmatch(r'[0-9a-f]{64}', r['new_hash']), r['id']
              assert re.fullmatch(r'[0-9a-f]{64}', r['canon_digest']), r['id']
              assert eh(r) == r['new_hash'], ('entry hash not the sha256 of its own fields', r['id'])
              sup = r.get('supersedes')
              if sup:
                  assert re.fullmatch(r'[0-9a-f]{64}', sup), r['id']
                  assert sup in seen.get(r['claim_id'], []), ('supersedes does not name a prior entry of this claim', r['id'])
              seen.setdefault(r['claim_id'], []).append(r['new_hash'])
      print('ledger chain ok:', len(rows), 'rows (independently recomputed per-entry hashes)')
      "
    condition: "stage == 9"
    stage: 2
    description: "Independent re-derivation: genesis is 64 zeros; every prefix link holds; every entry hash is the sha256 of that entry's own fields (INDEPENDENTLY recomputed here, not by the shipped verifier); every supersession digest resolves to a prior entry of the same claim — the Errata Ledger's contract in substance, not just shape"

