    import argparse, datetime, json, math, statistics

    def wilson(k, n, z=1.96):
        if n == 0:
            return [0.0, 0.0]
        p = k / n
        d = 1 + z * z / n
        c = (p + z * z / (2 * n)) / d
        h = z * math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d
        return [max(0.0, c - h), min(1.0, c + h)]

    def classify(flags):
        types = {"retraction": 0, "concern": 0, "correction": 0, "other": 0}
        for f in flags:
            sig = (f.get("signal", "") + " " + f.get("rwdb_nature", "")).lower()
            if "retract" in sig:
                types["retraction"] += 1
            elif "concern" in sig:
                types["concern"] += 1
            elif "correct" in sig or "update-to" in sig:
                types["correction"] += 1
            else:
                types["other"] += 1
        return types

    def latency_stats(flags):
        vals = [f.get("latency_days") for f in flags]
        vals = [v for v in vals if v is not None]
        if not vals:
            return {"count": 0}
        return {"count": len(vals), "median_days": statistics.median(vals),
                "min_days": min(vals), "max_days": max(vals),
                "mean_days": round(sum(vals) / len(vals), 1)}

    def real_disagreement(sw):
        matrix = sw.get("disagreement_matrix", [])
        return [m for m in matrix if m.get("hit") and len(m["hit"]) < len(m.get("ran", []))]

    ap = argparse.ArgumentParser()
    ap.add_argument("--sweep", required=True)
    ap.add_argument("--flagged", required=True)
    ap.add_argument("--outdir", required=True)
    a = ap.parse_args()
    sw = json.load(open(a.sweep))
    flags = json.load(open(a.flagged))
    disagreement = real_disagreement(sw)
    n, k = sw["claims_swept"], sw["flag_count"]
    stats = {"cycle": sw["cycle"], "claims_swept": n, "flag_count": k,
             "flag_rate": k / n if n else 0.0,
             "flag_rate_wilson95": wilson(k, n),
             "update_type_distribution": classify(flags),
             "disagreement": len(disagreement),
             "probes": sw["probes"],
             "latency": latency_stats(flags),
             "generated_at": datetime.datetime.now(datetime.timezone.utc).strftime(
                 "%Y-%m-%dT%H:%M:%SZ")}
    json.dump(stats, open(a.outdir + "/stats.json", "w"), indent=2)
    json.dump({"matrix": sw.get("disagreement_matrix", []),
               "disagreement": disagreement},
              open(a.outdir + "/disagreement-matrix.json", "w"), indent=2)
    types = stats["update_type_distribution"]
    with open(a.outdir + "/update-types.csv", "w") as fh:
        fh.write("type,count\n")
        for key in sorted(types):
            fh.write("%s,%d\n" % (key, types[key]))
    import matplotlib
    matplotlib.use("Agg")
    import matplotlib.pyplot as plt
    fig, ax = plt.subplots(figsize=(6, 4))
    ax.bar(sorted(types), [types[k2] for k2 in sorted(types)], color="#8b1a1a")
    ax.set_title("Negative treatment by type (cycle %d)" % sw["cycle"])
    fig.tight_layout()
    fig.savefig(a.outdir + "/update-types.png", dpi=120)
    print("stats: rate", round(stats["flag_rate"], 4), "wilson",
          [round(x, 4) for x in stats["flag_rate_wilson95"]],
          "disagreement", len(disagreement), "latency", stats["latency"])
