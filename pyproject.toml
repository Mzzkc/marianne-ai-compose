[project]
name = "marianne-ai-compose"
version = "0.1.0"
description = "Universal asynchronous AI orchestration — declarative YAML scores executed across any combination of CLI instruments with built-in validation."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Emzi" }
]
keywords = ["ai", "orchestration", "automation", "multi-agent", "yaml", "declarative", "validation", "agents", "cli", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    # Capped <2.13: pydantic 2.13 changed schema generation in a way that fails
    # to build the SheetState model. Verified green on 2.12.x; Dependabot
    # can propose the 2.13 bump with the accompanying model fix.
    "pydantic>=2.5.0,<2.13",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "croniter>=6.2.4,<7",

    # CLI (modern typer bundles rich + shellingham in the base package;
    # the legacy `[all]` extra was removed upstream). Capped <0.21: typer 0.21+
    # stopped aliasing typer.Exit to the top-level click.exceptions.Exit, which
    # several CLI tests assert against. Dependabot can propose the bump + the
    # accompanying test migration deliberately.
    "typer>=0.12.0,<0.21",
    "rich>=13.0.0",

    # HTTP (for profile-driven API transports + notifications)
    "httpx>=0.27.0",

    # Dashboard
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",

    # Desktop notifications
    "plyer>=2.1.0",

    # Structured logging
    "structlog>=24.1.0",

    # Security minimum versions — transitive deps with known CVEs (F-061, F-137)
    "cryptography>=48.0.1",   # GHSA-537c-gmf6-5ccf, CVE-2026-34073 (F-061)
    "pyjwt>=2.12.0",          # CVE-2026-32597 (F-061)
    "requests>=2.33.0",       # CVE-2026-25645 (F-061)
    "pygments>=2.20.0",       # CVE-2026-4539 (F-137)
    "starlette>=1.3.1",       # PYSEC-2026-248, PYSEC-2026-249
]

[project.optional-dependencies]
daemon = ["psutil>=5.9", "watchfiles>=0.21"]
# Terminal UI (`mzt top`). Lazily imported, so the core CLI works without it.
tui = ["textual>=7,<8"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "pymdown-extensions>=10.21.2",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.100.0",
    "pytest-xdist>=3.5.0",
    "pytest-randomly>=3.15.0",
    # Quality tools pinned to the versions the gates are verified green against.
    # Newer majors change rules (ruff 0.15 UP042, mypy 2.x) — let Dependabot
    # propose those bumps deliberately rather than break CI on a tooling release.
    "ruff>=0.14,<0.15",
    "mypy>=1.19,<1.20",
    # Type stubs for untyped runtime deps (needed by mypy --strict).
    "types-PyYAML>=6.0",
    "types-psutil>=6.0",
]

[project.scripts]
mzt = "marianne.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marianne"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",  # Function call in default argument - required for typer CLI patterns
    "E402",  # Module-level import not at top - logger init before imports is intentional
    "N802",  # Function name should be lowercase - we override stdlib methods (doRollover)
    "N803",  # Argument name should be lowercase - we match stdlib signatures (maxBytes, backupCount)
    "N806",  # Variable in function should be lowercase - Pydantic model names etc.
    "N817",  # CamelCase imported as acronym - domain convention
    "N818",  # Exception name should end in Error - legacy names
    "SIM102",  # Nested if - sometimes clearer with intermediate comments
    "SIM105",  # contextlib.suppress - try/except/pass is clearer for error recovery
    "SIM108",  # Ternary operator - multi-line if/else often more readable
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

# Optional, environment-dependent imports that are not declared dependencies
# and may be absent in a clean environment (e.g. hermetic CI):
#   - marianne_compiler: separately-packaged submodule, lazily imported by
#     `mzt compile`.
#   - pynvml: optional NVIDIA GPU probe; guarded by try/except ImportError.
# Treat their absence as a non-error for mypy --strict.
[[tool.mypy.overrides]]
module = ["marianne_compiler.*", "pynvml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30  # Safety net: kill any test that runs >30s (prevents orphaned processes)
addopts = "--tb=short -n auto -m 'not playwright'"
# Coverage: run explicitly with `pytest --cov=mzt --cov-report=term-missing:skip-covered --cov-report=json:coverage.json --no-cov-on-fail`
# Playwright tests: run separately with `pytest -m playwright -n0`
markers = [
    "adversarial: tests with adversarial/garbage inputs",
    "smoke: basic smoke tests for critical paths",
    "overnight: long-running tests for cron execution",
    "property_based: hypothesis property-based tests",
    "playwright: browser E2E tests — must run with -n0 (no xdist)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::RuntimeWarning",
    "ignore::UserWarning:pydantic.*:",
    "ignore::UserWarning:rich.*:",
    "ignore::pytest.PytestWarning",
    "ignore::FutureWarning",
    "ignore::UnicodeWarning",
]

[tool.coverage.run]
source = ["src/marianne"]
omit = [
    "src/marianne/dashboard/static/*",
    "src/marianne/dashboard/templates/*",
    "src/marianne/scores/templates/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "\\.\\.\\.",
]
show_missing = true
skip_covered = true
fail_under = 80
