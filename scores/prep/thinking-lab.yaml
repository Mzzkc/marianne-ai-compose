# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  Thinking Lab — Multi-Model Cross Review                                    ║
# ║                                                                              ║
# ║  Drop your prompt + context files into scores/prep/thinking-lab-input/       ║
# ║  Run: mzt run scores/prep/thinking-lab.yaml                                  ║
# ║  Read: workspaces/thinking-lab/review-{1,2,3,4}.md                           ║
# ║                                                                              ║
# ║  Reviewers, in order:                                                        ║
# ║    1. Claude Opus 4.7    (Anthropic, claude-code)        → review-1.md      ║
# ║    2. Gemini 3.1 Pro     (Google, gemini-cli)            → review-2.md      ║
# ║    3. GLM 5.2            (Z.AI Coding Plan via opencode) → review-3.md      ║
# ║    4. GPT-5.5            (OpenAI, codex-cli)             → review-4.md      ║
# ║                                                                              ║
# ║  Gemma 4 (Google free via openrouter) was removed 2026-05-07 — chronic       ║
# ║  bottleneck (24min+ stalls vs 5-10min for the rest).                        ║
# ║                                                                              ║
# ║  Pattern: cli stage 1 stages a setup marker; stages 2-5 fan in parallel      ║
# ║  with directory cadenza injection of the input dir.                          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: "thinking-lab"
description: "4 parallel independent reviews from Opus, Gemini Pro, GLM, GPT-5.5"
workspace: "/home/emzi/Projects/marianne-ai-compose/workspaces/thinking-lab"

workspace_lifecycle:
  archive_on_fresh: true

instrument: claude-code
instrument_config:
  # Repo-scale audit prompts (read code + git history) need more than the
  # old 600s — the 2026-06-12 goal-mode audit timed out two reviewers at
  # 600 while their reviews were mid-write.
  timeout_seconds: 1500

instruments:
  reviewer-opus:
    profile: claude-code
    config:
      model: claude-opus-4-7
  reviewer-gemini:
    profile: gemini-cli
    config:
      model: "gemini-3.1-pro-preview"
  reviewer-glm:
    profile: opencode
    config:
      model: "zai-coding-plan/glm-5.2"
  reviewer-codex:
    profile: codex-cli
    config:
      model: "gpt-5.5"

stale_detection:
  enabled: true
  idle_timeout_seconds: 300

movements:
  1:
    name: "Setup"
    instrument: cli
  2:
    name: "Review: Opus"
    instrument: reviewer-opus
  3:
    name: "Review: Gemini Pro"
    instrument: reviewer-gemini
  4:
    name: "Review: GLM"
    instrument: reviewer-glm
  5:
    name: "Review: GPT-5.5"
    instrument: reviewer-codex

sheet:
  size: 1
  total_items: 5

  dependencies:
    2: [1]
    3: [1]
    4: [1]
    5: [1]

  cadenzas:
    2:
      - directory: "/home/emzi/Projects/marianne-ai-compose/scores/prep/thinking-lab-input"
        as: context
    3:
      - directory: "/home/emzi/Projects/marianne-ai-compose/scores/prep/thinking-lab-input"
        as: context
    4:
      - directory: "/home/emzi/Projects/marianne-ai-compose/scores/prep/thinking-lab-input"
        as: context
    5:
      - directory: "/home/emzi/Projects/marianne-ai-compose/scores/prep/thinking-lab-input"
        as: context

parallel:
  enabled: true
  max_concurrent: 4

prompt:
  template: |
    {% if stage == 1 %}
    echo "ready" > {{ workspace }}/setup-complete.txt
    {% else %}
    {% set reviewer = {2: "Opus 4.7 (Anthropic)", 3: "Gemini 3.1 Pro (Google)", 4: "GLM 5.2 (Z.AI)", 5: "GPT-5.5 (OpenAI)"}[stage] %}
    {% set review_num = stage - 1 %}
    You are {{ reviewer }}. Independent review. Others can't see your response.
    Context files injected above contain the full problem and code.
    Write your response to {{ workspace }}/review-{{ review_num }}.md
    {% endif %}

validations:
  - type: file_exists
    path: "{workspace}/setup-complete.txt"
    condition: "stage == 1"
    stage: 1
  - type: content_regex
    path: "{workspace}/setup-complete.txt"
    pattern: "^ready"
    condition: "stage == 1"
    stage: 2
  - type: file_exists
    path: "{workspace}/review-1.md"
    condition: "stage == 2"
    stage: 1
  - type: content_regex
    path: "{workspace}/review-1.md"
    pattern: "(?s)\\S"
    condition: "stage == 2"
    stage: 2
  - type: file_exists
    path: "{workspace}/review-2.md"
    condition: "stage == 3"
    stage: 1
  - type: content_regex
    path: "{workspace}/review-2.md"
    pattern: "(?s)\\S"
    condition: "stage == 3"
    stage: 2
  - type: file_exists
    path: "{workspace}/review-3.md"
    condition: "stage == 4"
    stage: 1
  - type: content_regex
    path: "{workspace}/review-3.md"
    pattern: "(?s)\\S"
    condition: "stage == 4"
    stage: 2
  - type: file_exists
    path: "{workspace}/review-4.md"
    condition: "stage == 5"
    stage: 1
  - type: content_regex
    path: "{workspace}/review-4.md"
    pattern: "(?s)\\S"
    condition: "stage == 5"
    stage: 2
