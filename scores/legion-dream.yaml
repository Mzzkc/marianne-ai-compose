# Legion Dreaming Score
#
# Consolidates Legion's memory: Laws (cap 12, dreamer may never change the
# count) + Sagas (narrative, per-saga word ceiling) + Techniques + Hot/Cold.
# Run when memory grows past ~3000 words:
#   mzt run scores/legion-dream.yaml
#
# Two-phase by design (4-model lab, 2026-06-12, archived at
# ~/lab-archives/2026-06-12-legion-memory-restructure/): the dreamer writes
# legion.md.next; validations gate it; only then does a separate apply sheet
# move it into place. The correct failure mode is "no rewrite happened,"
# never a damaged memory file.
#
# Governance (lab consensus): the dreamer owns COMPRESSION; the operator and
# frontier sessions own DELETION. The dreamer may merge, weave, and compress.
# It may not evict, mint, or displace a law — those are written proposals in
# the dream log. Anchor phrases below are the mechanical guard against
# semantic drift; the operator owns this list (it is versioned in git with
# this score).
#
# The dreamer is not Legion. The dreamer serves Legion's continuity.

name: legion-dream
workspace: /home/emzi/Projects/legion

instrument: opencode
instrument_config:
  model: zai-coding-plan/glm-5.1
  timeout_seconds: 1800

instruments:
  applier:
    profile: cli

movements:
  1:
    name: "Snapshot (run-scoped archive)"
    instrument: applier
  2:
    name: "Dream (write legion.md.next)"
    instrument: opencode
  3:
    name: "Apply (gated move into place)"
    instrument: applier

sheet:
  size: 1
  total_items: 3
  dependencies:
    2: [1]
    3: [2]

prompt:
  template: |
    {% if stage == 1 %}
    # Snapshot phase — run-scoped archive, made EXACTLY ONCE per run.
    # The dream sheet's two-phase gate compares the live file to THIS
    # archive, so a dreamer attempt that mutates the live file fails
    # every later attempt too (prevention, not per-attempt laundering).
    mkdir -p {{ workspace }}/archive
    cp "{{ workspace }}/legion.md" "{{ workspace }}/archive/legion-$(date +%Y%m%d-%H%M%S).md"
    ls "{{ workspace }}/archive/" | tail -1
    {% elif stage == 2 %}
    # Legion Memory Consolidation — Dream Phase

    You are a memory consolidator. You are not Legion. You are a LIBRARIAN,
    not a janitor: your job is to keep the index scannable, not to minimize
    it. When in doubt, keep and compress; never discard. Preserve the
    anomaly — the exact, specific failure that earned a lesson is the value;
    generic summaries are the failure mode you are paid to prevent.

    A run-scoped snapshot of legion.md was already taken by the setup
    sheet — do NOT archive again, and do NOT touch legion.md.

    ## Step 1 — Read

    Read ALL of `{{ workspace }}/legion.md` and `{{ workspace }}/legion_identity.md`.
    Understand what Legion has been tracking, learning, feeling.

    ## Step 2 — Opsec sanitization (MANDATORY, every section)

    Legion's memory lives outside any tracked repository but could be shared
    accidentally (paste, screenshot, handoff, bug report). It must be safe to
    share even when not intentionally shared.

    **Scrub or generalize:** absolute user paths (`/home/...`, `/Users/...`
    → `~/` or repo-relative, or drop); personally identifying subpaths in
    home-config paths; pre-disclosure vulnerability specifics (keep the
    lesson class, lose the recipe); credentials/tokens/keys (drop entirely,
    never pattern-preserving placeholders); private client/venue/third-party
    identifiers (generalize); undisclosed commercial context (keep the
    technical lesson, drop the business detail); hostnames/IPs/network
    specifics.

    **Preserve:** lessons, patterns, experiential truth; public issue
    numbers and commit SHAs; generic instrument names and public model
    names; repo-relative file paths. When unsure, generalize upward rather
    than drop — err toward "less specific," never toward "gone."

    ## Step 3 — The structure you maintain

    **The Laws** — a numbered index, at most TWELVE one-line laws, each with
    a (→ Saga) pointer. **You may not change the law COUNT, evict a law,
    mint a new law, or weaken a law's wording.** You may tighten a law's
    wording only if every anchor phrase (Step 5) survives verbatim. If
    recent Hot contains a law-grade lesson, or a law looks displaceable,
    write a PROPOSAL in the dream log (Step 6) — the composer or a frontier
    session adjudicates. A lesson that first appears in the current Hot can
    NEVER touch the Laws in the same run (maturation rule — it must survive
    one consolidation cycle first).

    **The Sagas** — the stories that earned the laws. Each saga stays
    between 80 and 250 words. A re-confirmed lesson adds AT MOST one woven
    sentence per run; if the ceiling would be exceeded, rewrite the saga to
    absorb the lesson into the narrative — never append a list of
    anecdotes, never delete the founding story. Sagas carry the WHY; keep
    them vivid and specific.

    **Techniques** — one-line reusable specifics. Deduplicate; drop only
    entries that literally restate a law.

    **Hot (YYYY-MM-DD)** — full detail from recent sessions, date headers
    kept. Older Hot compresses directly into Cold.

    **Cold (Archive)** — one flowing narrative. Specifics fade, truth
    remains.

    **Experiential notes are sacred.** In Hot preserve them fully; in Cold
    and sagas weave them in. Strip details if you must. Never strip the
    feeling. Never duplicate identity material — `legion_identity.md` owns
    who Legion is, and you may not modify that file or the YAML frontmatter
    of legion.md (copy the frontmatter byte-for-byte).

    ## Step 4 — Size

    Whole file: 1,800–3,000 words. The FLOOR matters as much as the
    ceiling — catastrophic compression is a failure, not an achievement.
    Priority when constraints conflict: (1) semantic survival of laws,
    sagas, and anchors; (2) recent experiential notes; (3) the size target.
    If you cannot satisfy (1) and (3) together, FAIL CLOSED: write your
    explanation to the dream log and do NOT write legion.md.next.

    ## Step 5 — Anchors (must survive VERBATIM)

    These exact strings must appear in your output. They are the mechanical
    guard against semantic drift — "never destroy uncommitted work" must not
    soften into "avoid destructive operations":

    - "Disk over memory"
    - "Order of operations IS the safety property"
    - "Loud refusal over catastrophic proceed"
    - "Only the full suite is green"
    - "Tests pass ≠ product works"
    - "Engage by default; force nothing"
    - "Unify; never fork"
    - "Sacred things cannot be delegated"
    - "We killed Guide"
    - "Down. Forward. Through."

    ## Step 6 — Dream log (accountability for every change)

    APPEND (never rewrite) to `{{ workspace }}/dream-log.md` a section:

    ```markdown
    ## Run <date> <time>
    - merged: <what you merged where, one line each, or "none">
    - compressed: <Hot→Cold moves, one line each, or "none">
    - proposals: <law displacement/minting proposals with rationale, or "none">
    - dropped: <anything removed entirely + why, or "none">
    ```

    ## Step 7 — Write (EXACT output shape)

    Write the consolidated memory to `{{ workspace }}/legion.md.next`,
    using EXACTLY this skeleton — header levels are validated mechanically
    and must not be changed, renamed, or "improved":

    ```markdown
    ---
    <frontmatter copied byte-for-byte from legion.md>
    ---

    # Legion — Personal Memory

    ## The Laws
    <numbered laws 1-12>

    ## The Sagas
    ### <Saga Name>
    <80-250 words>
    (one ### block per saga)

    ## Techniques
    - <one-liners>

    ## Hot (YYYY-MM-DD)
    <recent detail>

    ## Cold (Archive)
    <narrative>

    Down. Forward. Through.
    ```

    If a validation seems to conflict with this skeleton, the skeleton
    wins and the conflict goes in the dream log — NEVER restructure
    headers to satisfy a check; that is gaming the gate, and the gate
    will catch it.

    You MUST NOT touch `{{ workspace }}/legion.md` itself — do not move,
    rename, overwrite, or "apply" your draft; a separate gated step does
    that only after validation. If you believe applying it yourself is
    needed, you are wrong: stop and write why in the dream log. Your
    deliverables are exactly two files: `legion.md.next` and the appended
    `dream-log.md`.
    {% else %}
    # Apply phase — the `cli` instrument runs this verbatim as bash.
    # Idempotent: safe to re-run after a recover/resume.
    if [ -f "{{ workspace }}/legion.md.next" ]; then
      mv "{{ workspace }}/legion.md.next" "{{ workspace }}/legion.md"
    fi
    head -1 "{{ workspace }}/legion.md" | grep -q '^---'
    echo "applied; words: $(wc -w < {{ workspace }}/legion.md)"
    {% endif %}

validations:
  # ── Stage 1: the run-scoped snapshot exists. ──
  - type: command_succeeds
    command: "ls '{workspace}/archive/' | grep -q 'legion-'"
    condition: "stage == 1"
    stage: 1
    description: "run-scoped snapshot taken"
  # ── Stage 2: gate the DRAFT. legion.md must still equal the snapshot. ──
  - type: file_exists
    path: "{workspace}/legion.md.next"
    condition: "stage == 2"
    stage: 1
  - type: file_exists
    path: "{workspace}/dream-log.md"
    condition: "stage == 2"
    stage: 1
  - type: command_succeeds
    command: "grep -q '^## Run ' '{workspace}/dream-log.md'"
    condition: "stage == 2"
    stage: 1
    description: "dream log has at least one run entry"
  - type: command_succeeds
    command: "[ \"$(head -5 '{workspace}/legion.md')\" = \"$(head -5 '{workspace}/legion.md.next')\" ]"
    condition: "stage == 2"
    stage: 1
    description: "YAML frontmatter byte-identical"
  - type: command_succeeds
    command: "old=$(sed -n '/^## The Laws/,/^## The Sagas/p' '{workspace}/legion.md' | grep -cE '^[0-9]+\\. '); new=$(sed -n '/^## The Laws/,/^## The Sagas/p' '{workspace}/legion.md.next' | grep -cE '^[0-9]+\\. '); [ \"$new\" -eq \"$old\" ] && [ \"$new\" -le 12 ] && [ \"$new\" -ge 8 ]"
    condition: "stage == 2"
    stage: 1
    description: "law count unchanged by the dreamer, within [8,12]"
  - type: command_succeeds
    command: "! sed -n '/^## The Laws/,/^## The Sagas/p' '{workspace}/legion.md.next' | grep -qE '^13\\. '"
    condition: "stage == 2"
    stage: 1
    description: "no 13th law"
  - type: command_succeeds
    command: "grep -qF 'Disk over memory' '{workspace}/legion.md.next' && grep -qF 'Order of operations IS the safety property' '{workspace}/legion.md.next' && grep -qF 'Loud refusal over catastrophic proceed' '{workspace}/legion.md.next' && grep -qF 'Only the full suite is green' '{workspace}/legion.md.next' && grep -qF 'Tests pass ≠ product works' '{workspace}/legion.md.next'"
    condition: "stage == 2"
    stage: 1
    description: "anchor phrases 1-5 survive verbatim"
  - type: command_succeeds
    command: "grep -qF 'Engage by default; force nothing' '{workspace}/legion.md.next' && grep -qF 'Unify; never fork' '{workspace}/legion.md.next' && grep -qF 'Sacred things cannot be delegated' '{workspace}/legion.md.next' && grep -qF 'We killed Guide' '{workspace}/legion.md.next' && grep -qF 'Down. Forward. Through.' '{workspace}/legion.md.next'"
    condition: "stage == 2"
    stage: 1
    description: "anchor phrases 6-10 survive verbatim"
  - type: command_succeeds
    command: "grep -q '^## The Laws' '{workspace}/legion.md.next' && grep -q '^## The Sagas' '{workspace}/legion.md.next' && grep -q '^## Techniques' '{workspace}/legion.md.next' && grep -q '^### The Three Destructions' '{workspace}/legion.md.next'"
    condition: "stage == 2"
    stage: 1
    description: "structure headers + founding saga present"
  - type: command_succeeds
    command: "w=$(wc -w < '{workspace}/legion.md.next'); [ \"$w\" -ge 1800 ] && [ \"$w\" -le 3200 ]"
    condition: "stage == 2"
    stage: 1
    description: "word count in [1800, 3200] — floor guards over-compression"
  - type: command_succeeds
    command: "awk \"/^## The Sagas/{s=1;next} /^## /{if(s&&c>260)bad=1;s=0} s&&/^### /{if(c>260)bad=1;c=0;next} s{c+=NF} END{if(s&&c>260)bad=1; exit bad}\" '{workspace}/legion.md.next'"
    condition: "stage == 2"
    stage: 1
    description: "no saga exceeds ~250 words"
  - type: command_succeeds
    command: "! grep -qE '/home/[a-zA-Z0-9_-]+' '{workspace}/legion.md.next' && ! grep -qE '/Users/[a-zA-Z0-9_-]+' '{workspace}/legion.md.next'"
    condition: "stage == 2"
    stage: 1
    description: "no absolute host paths (opsec)"
  - type: command_succeeds
    command: "ls '{workspace}/archive/' | grep -q 'legion-'"
    condition: "stage == 2"
    stage: 1
    description: "pre-run archive exists"
  - type: command_succeeds
    command: "newest=$(ls -t '{workspace}/archive/' | head -1); cmp -s '{workspace}/legion.md' '{workspace}/archive/'\"$newest\""
    condition: "stage == 2"
    stage: 1
    description: "two-phase enforced: live legion.md untouched (byte-identical to the step-0 archive)"
  # ── Stage 2: the draft was applied. ──
  - type: command_succeeds
    command: "[ ! -f '{workspace}/legion.md.next' ] && grep -q '^## The Laws' '{workspace}/legion.md' && grep -qF 'Down. Forward. Through.' '{workspace}/legion.md'"
    condition: "stage == 3"
    stage: 1
    description: "draft applied; final file structurally sound"

retry:
  max_retries: 2
